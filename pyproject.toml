[tool.ruff.lint.mccabe]
max-complexity = 15  # Match SonarCloud S3776 threshold

[tool.mypy]
# Keep strict mode as the default quality bar for actively maintained code.
strict = true
# Point mypy at the source tree so it resolves specify_cli from src/ rather than
# an installed wheel that may lack a py.typed marker.
mypy_path = "src"

[[tool.mypy.overrides]]
# When checking a narrow file path under ``specify_cli``, mypy otherwise walks
# the package's CLI bootstrap import graph via ``specify_cli.__init__`` and
# reports unrelated module errors instead of the target file's own issues.
module = ["specify_cli.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# protection_policy.py is strict-clean and imports nothing but the stdlib and
# ruamel.yaml, so following it cannot drag unrelated bootstrap errors into a
# narrow check. Re-enable it (mypy: the LAST matching override wins, so this
# entry must stay after the ``specify_cli.*`` skip above) so the concrete
# ``frozenset[str]`` on ``ProtectionPolicy.protected_branches`` stays visible
# to every narrow-file check that imports it — otherwise the delegate in
# ``git/commit_helpers.py`` returns ``Any`` under ``--strict`` (issue #3719).
module = ["specify_cli.git.protection_policy"]
follow_imports = "normal"

[[tool.mypy.overrides]]
# asset_preservation.backup's backup_before_overwrite() is the shared
# overwrite-backup helper (WP01, #4895 et al.) reused by policy/hook_installer.py
# and other overwrite-guard call sites. Under the ``specify_cli.*`` skip above,
# its concrete ``-> Path`` return type resolves as ``Any``, so every narrow-file
# ``mypy --strict`` check on a caller reports "Returning Any from function
# declared to return ...". Same shape/precedent as the protection_policy and
# core.errors entries above (issue #3719) — must stay after the
# ``specify_cli.*`` skip.
module = ["specify_cli.asset_preservation.backup"]
follow_imports = "normal"

[[tool.mypy.overrides]]
# core.errors defines the StructuredError base every typed error family
# subclasses; under the ``specify_cli.*`` skip above it resolves as ``Any`` and
# every subclass declaration reads "Class cannot subclass StructuredError (has
# type Any)" (e.g. dashboard/server.py's PortUnavailableError and friends).
# It imports only ``typing``, so following it cannot drag bootstrap errors
# into a narrow check — same shape as the protection_policy entry (issue
# #3719), and it must likewise stay after the ``specify_cli.*`` skip.
module = ["specify_cli.core.errors"]
follow_imports = "normal"

[[tool.mypy.overrides]]
# When checking charter.activation.neutrality in isolation, mypy walks into other
# charter submodules (interview, resolver, context, …) that have pre-existing
# strict issues being addressed in a separate mission. Skip them so that
# ``mypy --strict src/charter/activation/neutrality/`` reports only neutrality's
# own issues. ``charter.*`` also covers ``charter.activation.*`` /
# ``charter.offering.*`` (mission charter-activation-split-01M16ZSE relocated
# the activation-layer modules under charter.activation).
module = ["charter.*"]
follow_imports = "skip"

