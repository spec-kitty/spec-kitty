    # plugin. It already lives in the `test` extra, but that is only installed
    # with `--extra test`; the dev group IS installed by a plain `uv sync`, so
    # declare it here too.
    "pytest-xdist>=3.8.0",
    # `make test-full`'s serial passes (Makefile:60,62) pass `--timeout=240
    # --timeout-method=signal`, which needs the pytest-timeout plugin. Same
    # reasoning as pytest-xdist above: it lives in the `test` extra, but the
    # dev group IS installed by a plain `uv sync`, so declare it here too.
