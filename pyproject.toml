[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "C90",    # mccabe complexity (≈ Sonar S3776)
    "C4",     # comprehension simplifications (≈ Sonar S7494, S7500)
    "ARG",    # unused arguments (≈ Sonar S1172)
    "B",      # bugbear (common bugs, raise-without-from, etc.)
    "SIM",    # simplify (≈ Sonar S1066, S3358)
    "UP",     # pyupgrade (deprecated patterns, Pydantic v1 compat)
    "ASYNC",  # async issues (≈ Sonar S7497, S7502)
    "S",      # bandit security checks (≈ Sonar S2083)
    "TID251", # flake8-tidy-imports: banned-api (not TID252 which enforces absolute imports codebase-wide)
]
ignore = [
    "S101",   # allow assert (used extensively in tests and guards)
    "S603",   # subprocess without shell check (CLI tool by design)
    "S607",   # partial executable path (CLI tool by design)
    "B008",   # function calls in default arguments (intentional in CLI/Typer)
    "S110",   # try-except-pass: redundant with SIM105 (contextlib.suppress), which is already selected
    "S310",   # urllib-urlopen: spec-kitty intentionally makes HTTP requests to the SaaS backend
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S", "E402"]  # Relax unused-arg, security, and import-order rules in tests
# B904 (raise-without-from) in these CLI files requires human review: raise typer.Exit() calls
# appear inside nested if/else branches within except blocks, making automated patching unsafe.
"src/specify_cli/cli/commands/agent/config.py" = ["B904"]
"src/specify_cli/cli/commands/agent/status.py" = ["B904"]
"src/specify_cli/cli/commands/agent/workflow.py" = ["B904"]
# TID251 (banned-api) is ENFORCED across the ENTIRE tests/ tree — see ADR
# docs/adr/3.x/2026-05-28-1-... (Gap 3 / Gap 5) and the dedicated
# "[ENFORCED] banned-API (TID251)" gate in .github/workflows/ci-quality.yml.
#
# There are intentionally NO whole-directory TID251 exemptions for tests/. A directory
# glob per-file-ignore silently disarms the rule for every PRESENT and FUTURE file in
# that tree, which made the previous "new sha256 still requires a # noqa" policy
# unenforceable (the scope hole closed in this change). Every raw ``hashlib.sha256`` in
# a test must instead carry an inline ``# noqa: TID251 — <justification>`` describing the
# legitimate non-charter use (PKCE, body/file-integrity checksums, the synthesizer's own
# manifest scheme, fingerprint-definition tests, migration sentinel checks, …), OR call
# ``charter.hasher.hash_content()`` when it genuinely mirrors the charter freshness hash.
#
# Production code has legitimate raw SHA-256 owners, but file-level TID251
# ignores also disarm the Gap-5 click.exceptions ban for those files. Keep
# production raw-SHA exceptions inline at each call site so click.exceptions.*
# remains enforced across all src files.
#
# kernel.clock single-door (C-008): this ignore is scoped ONLY to the two
# `flake8-tidy-imports.banned-api` entries below (hashlib.sha256 /
# click.exceptions.*) -- it does NOT and must NOT become the enforcement
# surface for the wall-clock door. `scripts/` is in-scope for the door and is
# enforced exclusively via the AST-based
# `tests/architectural/test_clock_import_ban.py` / `test_clock_call_ban.py`
# gate + the per-owner `tests/architectural/_exemptions/*.txt` allow-lists
# (see `research/census.yaml`'s ownership_map and `tasks.md` WP14): the ratchet
# runs through that gate + the exemption files ONLY, never through a
# per-path/per-directory TID251 ignore. Confirmed live: `scripts/docs/*.py`'s
# prior `datetime`/`date` sites were caught and remediated by the AST gate
# despite this blanket TID251 ignore being present the whole time.
"scripts/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Gap 3: Tests must not reimplement the charter hash algorithm.
# Call charter.hasher.hash_content() instead of rolling a raw sha256 — a hand-rolled copy
# silently diverges whenever the production algorithm changes (e.g. normalization, encoding).
"hashlib.sha256".msg = "Use charter.hasher.hash_content() in tests instead of reimplementing the hash algorithm (TID251 / Gap 3). Add '# noqa: TID251' with a justification comment only for non-charter uses (PKCE, body checksums, file-integrity checks, etc.)."
# Gap 5: Tests must not catch click.exceptions.* directly.
# In typer 0.26+, click is vendored as typer._click; bare click.exceptions.Exit/UsageError/Abort
# assertions will match the wrong class once typer upgrades and will silently pass or fail.
# Use typer.Exit, typer.Abort, typer.BadParameter (typer's stable public re-exports) instead.
"click.exceptions.Exit".msg = "Use typer.Exit (typer's public surface) — click.exceptions.Exit refers to a different class in typer>=0.26 which vendors click internally (TID251 / Gap 5)."
"click.exceptions.UsageError".msg = "Use typer.UsageError or the _CLICK_USAGE_ERRORS shim — click.exceptions.UsageError is unrelated to typer's vendored copy in typer>=0.26 (TID251 / Gap 5)."
"click.exceptions.Abort".msg = "Use typer.Abort (typer's public surface) — click.exceptions.Abort is unrelated to typer's vendored copy in typer>=0.26 (TID251 / Gap 5)."

