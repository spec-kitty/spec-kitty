[project]
name = "spec-kitty-cli"
version = "4.0.0rc5"
description = "Spec Kitty, a tool for Specification Driven Development (SDD) agentic projects, with kanban and git worktree isolation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Spec Kitty Contributors" },
]
maintainers = [
    { name = "Spec Kitty Contributors" },
]
keywords = [
    "specification",
    "spec-driven-development",
    "sdd",
    "agentic-development",
    "ai-coding",
    "claude-code",
    "ai-agents",
    "llm-tools",
    "code-generation",
    "feature-specs",
    "requirements",
    "planning",
    "kanban",
    "git-worktree",
    "workflow-automation",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    # Upper bound #3794: every typer in [0.24.1, 0.28) is a surface this code
    # is exercised against (0.24.x lock, 0.25 pre-vendoring, 0.26/0.27 vendored
    # typer._click eras — see orchestrator_api/commands.py's shim); an
    # unbounded range let fresh resolves pick untested future majors of the
    # private typer._click surface and break at import time.
    "typer>=0.24.1,<0.28",
    "click>=8.2.1",  # Used directly in cli/helpers.py, selector_resolution.py, orchestrator_api, widen/review; typer>=0.26 no longer re-exports click
    "rich>=14.3.3",
    "pygments>=2.20.0",  # CVE-2026-4539 fix; transitive dep of rich, pinned explicitly
    "charset-normalizer>=3.4,<4",  # encoding detection for charter chokepoint (FR-016; was transitive via requests)
    "httpx[socks]>=0.28.1",
    "platformdirs>=4.9.2",
    "readchar>=4.2.1",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "pydantic>=2.0",
    "packaging>=23.0",
    "psutil>=5.9.0",  # Cross-platform process management for dashboard
    # spec-kitty-events / spec-kitty-tracker: public shared-package
    # dependencies. Their public-surface contracts are pinned in
    # tests/contract/spec_kitty_events_consumer/ and
    # tests/contract/spec_kitty_tracker_consumer/. spec-kitty-runtime is
    # intentionally absent: the CLI's runtime surface is internalized under
    # src/runtime/next/ (see WP01 of mission
    # shared-package-boundary-cutover-01KQ22DS), and absence is enforced by
    # tests/architectural/test_pyproject_shape.py.
    # The bounded ranges keep clean-wheel installs on the public release train
    # while preserving the release authority's compatibility contract.
    "spec-kitty-events>=9,<10",
    "spec-kitty-tracker>=0.5.2,<0.6",
    "toml>=0.10.2",  # Config file parsing
    "tomli-w>=1.0.0",  # TOML write serialiser (stdlib tomllib is read-only)
    "requests>=2.33.0",  # HTTP client for doctrine-pack https/api sources (CVE-2026-25645 fix)
    "jsonschema>=4.0",  # JSON Schema validation for mission configs
    "python-ulid>=3.0",  # ULID generation for event IDs
    "google-re2>=1.1",  # RE2 engine for linear-time regex (ReDoS prevention)
    "cryptography>=50.0.0",  # AES-256-GCM + scrypt KDF for encrypted auth session storage (feature 080); CVE-2026-69247 fix
    "mcp>=1.27.1,<2.0.0",  # Official Model Context Protocol SDK — Z7-C stdio adapter (mcp.server.stdio); pinned below 2.0 to avoid its httpx2 major-dependency swap against our httpx[socks]>=0.28.1 pin
]

[project.urls]
Repository = "https://github.com/spec-kitty/spec-kitty"
Issues = "https://github.com/spec-kitty/spec-kitty/issues"
Documentation = "https://docs.spec-kitty.ai/"
Changelog = "https://github.com/spec-kitty/spec-kitty/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<9.1",  # CVE-2025-71176 fix (>=9.0.3); <9.1 avoids the pytest 9.1.x reorder_items INTERNALERROR ('Function' not subscriptable) that trips CI's pip-resolved collection order (#2884). Aligns CI pip jobs with uv.lock's 9.0.3.
    "pytest-asyncio>=0.21.0",  # Required for async tests
    "pytest-benchmark>=5.2.3",  # Statistical off-PR performance pipeline (ADR 2026-08-22-1)
    "pytest-cov>=4.1.0",  # Required by CI coverage flags
    "pytest-timeout>=2.2.0",  # Required by mutmut pytest_add_cli_args --timeout flag
    "pytest-xdist>=3.8.0",  # Parallelize large CI shards with --dist loadfile
    "pytest-playwright>=0.7.0",  # Headless browser e2e driver for tests/ui/ (issue #1008); Chromium installed via `playwright install chromium`, never committed
    "respx>=0.21.1",  # HTTPX mocking for auth transport tests (feature 080)
    "diff-cover>=10.0.0",  # Enforce changed-line coverage in CI
    "chardet>=3.0.4,<6",  # Pin chardet below 6.x to avoid requests compatibility warning
    "build>=1.0.0",  # Required for distribution tests (wheel building)
    "hatchling>=1.27.0",  # Already a [build-system] requirement; pinned here so it's importable outside build isolation. (charter-code-topology-01M152G1, S5: its prior sole rationale, tests/doctrine/test_hatch_build.py's in-process BuildHookInterface coverage of the dormant doctrine wheel, was deleted with the dormant spec-kitty-doctrine wheel groundwork per MAP-BUILD -- kept as a lockfile-neutral no-op rather than risk uv.lock drift for a redundant-but-harmless test-extra pin.)
    "mutmut>=3.5.0",  # Mutation testing
    "pytestarch>=4.0.0",  # Architectural dependency testing (ADR 2026-03-27-1)
]
lint = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "msgpack>=1.2.1",  # GHSA-6v7p-g79w-8964 fix; transitive via CacheControl/pip-audit
    "types-jsonschema>=4.0.0",
    "types-psutil>=5.9.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.33.0",
    "types-toml>=0.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "cyclonedx-bom>=4.0",  # SBOM generation for release pipeline
]

[project.scripts]
spec-kitty = "specify_cli:main"

[build-system]
# Pin the build backend to the uv.lock-recorded hatchling. Unpinned, the
# isolated build pulls whatever hatchling is newest on PyPI, and post-1.31
# releases emit `Metadata-Version: 2.5`, which the release pipeline's pinned
# `twine==6.*` (pkginfo) rejects as "not a valid metadata version" — failing
# `twine check` before publish. hatchling 1.31.0 emits the widely-accepted
# `2.4`. Keep this in lockstep with uv.lock's hatchling entry.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel", "src/glossary", "src/mission_runtime", "src/runtime", "src/specify_cli", "src/charter"]
exclude = [
    "src/specify_cli/**/tests/**",
    # Build-tooling debris, not runtime code: src/kernel/pyproject.toml is
    # dormant packaging metadata for the planned standalone spec-kitty-kernel
    # wheel (docs/adr/3.x/2026-08-02-1-charter-wheel-assessment.md); it is
    # never imported at runtime. Shipping it inside the runtime wheel is pure
    # packaging pollution for every consumer of `spec-kitty-cli` (#3163).
    #
    # The sibling dormant spec-kitty-doctrine wheel groundwork
    # (src/charter/offering/pyproject.toml + hatch_build.py) was DELETED
    # outright (charter-code-topology-01M152G1, S5; MAP-BUILD) rather than
    # excluded here — it was never built or published by any CI job, so the
    # dormant-wheel exclude entries for it are retired along with the files.
    "src/*/pyproject.toml",
]
# Include all non-Python files (templates, configs, etc.)
# Runtime command templates are package assets under specify_cli/missions;
# charter/offering/missions holds the governance/action-bundle side of the surface.
artifacts = [
    "src/specify_cli/**/*.md",
    "src/specify_cli/**/*.yaml",
    "src/specify_cli/**/*.yml",
    "src/specify_cli/**/*.json",
    "src/specify_cli/**/*.jsonl",
    "src/runtime/**/*.md",
    "src/runtime/**/*.yaml",
    "src/runtime/**/*.yml",
    "src/runtime/**/*.json",
    "src/runtime/**/*.jsonl",
    "src/charter/**/*.yaml",
    "src/charter/**/*.yml",
    # R2 wheel silent-drop fix (charter-code-topology-01M152G1, S5): the
    # broader src/charter/** glob (files directly under src/charter/, e.g.
    # ERROR_CODES.md, plus everything under offering/) shipped only *.yaml/
    # *.yml before this change, silently dropping src/charter/activation/ERROR_CODES.md
    # and src/charter/README.md from the wheel. Widen to the same extension
    # set the offering/ subtree already ships (.md/.json/.csv/.template) so
    # the top-level charter docs/config surface is not silently excluded.
    "src/charter/**/*.md",
    "src/charter/**/*.json",
    "src/charter/**/*.csv",
    "src/charter/**/*.template",
    "src/charter/offering/**/*.md",
    "src/charter/offering/**/*.yaml",
    "src/charter/offering/**/*.yml",
    "src/charter/offering/**/*.json",
    "src/charter/offering/**/*.csv",
    "src/charter/offering/**/*.template",
]
# Relocated built-in doctrine packs (mission relocate-builtin-doctrine-packs-01KYT87F).
# `packs/` is a top-level tree, NOT under `src/`, so the `packages`/`artifacts`
# globs above never match it. `force-include` lands `packs/` as a site-packages
# sibling of the `charter` package (nesting the former top-level `doctrine`
# package as `charter.offering`) — exactly what the kernel sibling-path
# ancestor walk (`kernel.sibling_paths.resolve_installed_sibling`, which
# `resolve_pack_root("built-in")` now delegates to since #3091/#3204) expects:
# it walks up from an installed module to the ancestor holding `packs/built-in`.
#
# SCOPED TO `packs/built-in` ON PURPOSE: only the public product doctrine ships to
# consumers. Other repo-local packs (e.g. `packs/internal/`, the maintainer-only
# org-tier pack) must NOT be force-included into the wheel. Guarded by
# tests/cross_cutting/packaging/test_packaging_safety.py.
force-include = { "packs/built-in" = "packs/built-in", "src/doctrine.py" = "doctrine.py" }

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*",
    # Relocated built-in doctrine packs — a top-level tree that `src/**/*` excludes.
    # Without this the sdist ships ZERO built-in doctrine content (mission
    # relocate-builtin-doctrine-packs-01KYT87F, WP05 / NFR-002). Scoped to
    # `packs/built-in/**` so the maintainer-only `packs/internal/` pack never ships.
    "packs/built-in/**",
    "src/charter/offering/curation/imports/**/*",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    ".kittify/**",
    ".kittify/active-mission",
    "src/specify_cli/**/tests/**",
]

# NOTE: pytest configuration (markers, pythonpath, testpaths, addopts) lives in
# `pytest.ini`, which is the single source of truth. pytest reads only one
# config file and prefers `pytest.ini` over `[tool.pytest.ini_options]` when
# both are present, so a markers list here would be dead config that silently
# drifts from the live registry (this block had already drifted ~10 markers out
# of sync — see spec-kitty/spec-kitty#2034). Do not reintroduce
# `[tool.pytest.ini_options]` here; add markers to `pytest.ini` instead. This
# invariant is guarded by
# tests/architectural/test_marker_registry_single_source.py.

[tool.ruff]
target-version = "py311"
line-length = 164

[tool.ruff.format]
# Formatter-debt ratchet for issue #473. These files were not formatted under
# the live Ruff config on origin/main; remove entries as files are reformatted.
# This is formatter-only so `ruff check .` still lints these files.
# Shrink-only ratchet enforced by tests/architectural/test_ruff_format_exclude_ratchet.py
# (issue #559): the entry count may not exceed the pinned baseline, every entry
# must exist on disk, and every entry must still genuinely reformat under the
# live config. The three `kitty-specs/isolated-home-pin-guard-r1a-01KZNMA3/research/`
# entries this baseline used to carry were removed here (#559) as dead weight:
# `ruff.toml`'s `extend-exclude = ["kitty-specs/*/research/**"]` already drops
