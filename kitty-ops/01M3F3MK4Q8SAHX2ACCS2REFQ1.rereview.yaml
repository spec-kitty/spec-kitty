findings:
  - id: op-rereview-001
    severity: 3
    title: "docs/migrations/cross-repo-e2e-gate.md's worked exception example and 'Case A' still present the retired saas_sync_enabled.py scenario as live, contradicting the same doc's fixed floor-scenario section"
    location: "docs/migrations/cross-repo-e2e-gate.md:106,116-121,133-142 (unchanged by this diff)"
    evidence: >-
      Three places in this file, none touched by any of the four fixer commits, still describe
      `scenarios/saas_sync_enabled.py` as a currently-existing, currently-behaving scenario: (1)
      the `mission-exception.md` template's example `Failing scenario:` field names
      `spec-kitty-end-to-end-testing/scenarios/saas_sync_enabled.py::test_full_mission_with_sync`
      (line 106); (2) its "Reproduction command" fence gives a literally copy-pasteable command,
      `SPEC_KITTY_ENABLE_SAAS_SYNC=1 pytest spec-kitty-end-to-end-testing/scenarios/saas_sync_enabled.py -v`
      (lines 119-120), against a file confirmed deleted from the live E2E repo (`gh api
      repos/spec-kitty/EXPERIMENTAL-spec-kitty-end-to-end-testing/contents/scenarios` lists only
      `contract_drift_caught.py`, `dependent_wp_planning_lane.py`,
      `uninitialized_repo_fail_loud.py`, `conftest.py`, `__init__.py` -- no saas_sync file); (3)
      "### Case A: dev SaaS endpoint is down or unreachable" (lines 133-142) states in the
      present tense, with no retired/historical marker, "The `saas_sync_enabled.py` scenario
      detects this with an explicit health-check assertion ... If the endpoint is unreachable,
      the scenario records a structured 'unavailable' outcome" -- describing behavior of a
      scenario that does not exist in the current floor. Case A is listed as one of only three
      non-exhaustive "Common exception cases" for the *current* gate (alongside B: missing
      Docker, C: deferred bug), and none of the three surviving floor scenarios perform a
      dev-SaaS-endpoint reachability check, so Case A no longer maps to anything in the current
      Gate 3 floor at all -- it is not merely stale wording, the entire case is now orphaned.
      This sits ~10-90 lines below the "## The three floor scenarios" section this same PR just
      fixed (f7aab7888), so a reviewer who reads past that fixed section into the exception
      runbook lands on directly contradictory, actively-misleading guidance -- the same
      "reachable, non-ADR operator runbook residue" pattern op-review-001 flagged, just in a
      different part of the identical file. Judgment on the brief's specific question: this is
      false-floor residue within #5003's intent, not acceptable illustration -- an "illustration
      of the exception mechanism" does not need to name a real scenario at all (a placeholder
      like `<scenario_module.py>::<test_name>` would serve the template-teaching purpose without
      asserting anything false), and Case A in particular is framed as documentation of current
      gate behavior, not as a worked example of filling in a template.
    recommendation: >-
      Fold into this PR or a fast-follow against #5003: (a) replace the worked example's
      `Failing scenario:` / reproduction-command values with either a placeholder
      (`<scenario_module.py>::<test_name>`) or one of the three surviving scenario names; (b)
      either delete "Case A" entirely (nothing in the current floor performs a dev-SaaS-endpoint
      health check) or rewrite it in clearly historical/retired framing and replace it with a
      case that maps to a surviving scenario, so the exception runbook does not teach operators
      to reference a deleted test.
  - id: op-rereview-002
    severity: 1
    title: "Minor commit-type inconsistency with documented precedent for the shard-timings recapture commit"
    location: "commit a581d5492 subject line ('test(ci): recapture charter shard timings for gate3-floor guard tests')"
    evidence: >-
      This commit touches only .github/ci-shard-timings.json (a pytest-fixture data file with no
      test logic of its own). The documented precedent for the identical operation, commit
      3a84cf2b9 ("chore(landing): recapture charter shard-timings against current main
      (6156->6161)"), used `chore(landing)` for the same kind of change. `test(ci)` is
      defensible (the file is consumed by tests/architectural/test_module_length_agreement.py)
      but is not the type the repo's own prior art used for this exact operation. No functional
      effect; a reader scanning history by commit type for "what changed test behavior" vs.
      "what changed test-support data" gets a slightly inconsistent signal.
    recommendation: >-
      Cosmetic only; no action required. Future recaptures of this file could standardize on
      `chore(ci)` to match the 3a84cf2b9 precedent, or explicitly note in the body why `test(ci)`
      was chosen instead.
