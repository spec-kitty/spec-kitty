  - id: DIRECTIVE:DIRECTIVE_024
    kind: directive
    title: DIRECTIVE_024
    summary: "Keep changes close to the problem being solved to reduce blast radius, simplify review, and lower regression risk."
    source_path: ''
    local_path: _LIBRARY/directive-directive-024.md
  - id: DIRECTIVE:DIRECTIVE_025
    kind: directive
    title: DIRECTIVE_025
    summary: "Leave touched areas better than you found them; fixing a pre-existing failure in code you are already changing is the default, deferred only with explicit rationale."
    source_path: ''
    local_path: _LIBRARY/directive-directive-025.md
  - id: DIRECTIVE:DIRECTIVE_028
    kind: directive
    title: DIRECTIVE_028
    summary: "Prefer efficient, low-noise local tooling so investigation, editing, validation, and repository operations stay fast and reproducible."
    source_path: ''
    local_path: _LIBRARY/directive-directive-028.md
  - id: DIRECTIVE:DIRECTIVE_029
    kind: directive
    title: DIRECTIVE_029
    summary: "Agent-authored commits avoid GPG/SSH signing in unattended workflows so automation does not fail on missing or unverifiable key material."
    source_path: ''
    local_path: _LIBRARY/directive-directive-029.md
  - id: DIRECTIVE:DIRECTIVE_030
    kind: directive
    title: DIRECTIVE_030
    summary: "Changes must pass the relevant automated tests and static checks before handoff so regressions and interface drift are caught early."
    source_path: ''
    local_path: _LIBRARY/directive-directive-030.md
  - id: DIRECTIVE:DIRECTIVE_031
    kind: directive
    title: DIRECTIVE_031
    summary: "Make every design decision aware of its bounded context and ubiquitous language; cross a context boundary only through an explicit translation layer."
    source_path: ''
    local_path: _LIBRARY/directive-directive-031.md
  - id: DIRECTIVE:DIRECTIVE_032
    kind: directive
    title: DIRECTIVE_032
    summary: "Never assume shared vocabulary means shared meaning; state and confirm your interpretation of ambiguous or overloaded terms before acting."
    source_path: ''
    local_path: _LIBRARY/directive-directive-032.md
  - id: DIRECTIVE:DIRECTIVE_033
    kind: directive
    title: DIRECTIVE_033
    summary: "Stage only the expected deliverables for the current work package; never blanket-stage changes that could pull in unrelated files, secrets, or artefacts."
    source_path: ''
    local_path: _LIBRARY/directive-directive-033.md
  - id: DIRECTIVE:DIRECTIVE_034
    kind: directive
    title: DIRECTIVE_034
    summary: "Write tests first across acceptance and implementation layers so tests define the contract before production code."
    source_path: ''
    local_path: _LIBRARY/directive-directive-034.md
  - id: DIRECTIVE:DIRECTIVE_035
    kind: directive
    title: DIRECTIVE_035
    summary: "Before a codebase-wide rename or bulk string change, classify occurrences by semantic context (code, imports, paths, keys, CLI, docs, tests) since each may have different rules."
    source_path: ''
    local_path: _LIBRARY/directive-directive-035.md
  - id: DIRECTIVE:DIRECTIVE_036
    kind: directive
    title: DIRECTIVE_036
    summary: "Exercise the system through its external interfaces only, deriving cases from specifications and asserting on observable outputs, independent of internal structure."
    source_path: ''
    local_path: _LIBRARY/directive-directive-036.md
  - id: DIRECTIVE:DIRECTIVE_037
    kind: directive
    title: DIRECTIVE_037
    summary: "When observable behaviour changes, update its examples, acceptance checks, specs, docs, glossary, and architecture records in the same change so no reader is left with a stale picture."
    source_path: ''
    local_path: _LIBRARY/directive-directive-037.md
  - id: DIRECTIVE:DIRECTIVE_038
    kind: directive
    title: DIRECTIVE_038
    summary: "When the SPDD/REASONS pack is active, keep implementation inside the approved canvas's Requirements, Operations, Norms, and Safeguards unless a deviation is explicitly recorded."
    source_path: ''
    local_path: _LIBRARY/directive-directive-038.md
  - id: DIRECTIVE:DIRECTIVE_039
    kind: directive
    title: DIRECTIVE_039
    summary: "Constrain agentic implementation toward test-first, strongly typed, modular, boring, reviewable code; select when bloated or over-clever agent output is a concern."
    source_path: ''
    local_path: _LIBRARY/directive-directive-039.md
  - id: DIRECTIVE:DIRECTIVE_040
    kind: directive
    title: DIRECTIVE_040
    summary: "Once a bug class recurs despite point-fixes, respond with a structural intervention that closes the class, using five-paradigm parallel debugging to find the root cause."
    source_path: ''
    local_path: _LIBRARY/directive-directive-040.md
  - id: DIRECTIVE:DIRECTIVE_041
    kind: directive
    title: DIRECTIVE_041
    summary: "A test earns its place by failing exactly when the contract is violated; reject tests that pass for the wrong reason or fail on correct, behaviour-neutral changes."
    source_path: ''
    local_path: _LIBRARY/directive-directive-041.md
  - id: DIRECTIVE:DIRECTIVE_042
    kind: directive
    title: DIRECTIVE_042
    summary: "Documentation is governed single-source content: every file lives under the Common Docs root, declares lifecycle frontmatter, and is curated under a delete-stale policy."
    source_path: ''
    local_path: _LIBRARY/directive-directive-042.md
  - id: DIRECTIVE:DIRECTIVE_043
    kind: directive
    title: DIRECTIVE_043
    summary: "Answer a repeating defect class with a structural constraint (AST gate, type invariant, shrink-only ratchet) that eliminates the recurrence path, not another process rule."
    source_path: ''
    local_path: _LIBRARY/directive-directive-043.md
  - id: DIRECTIVE:DIRECTIVE_044
    kind: directive
    title: DIRECTIVE_044
    summary: "Use the canonical template, skill, or CLI rather than improvising or copying older artifacts; when a concept is split across surfaces, consolidate to one authority."
    source_path: ''
    local_path: _LIBRARY/directive-directive-044.md
  - id: DIRECTIVE:DIRECTIVE_045
    kind: directive
    title: DIRECTIVE_045
    summary: "All remote-main changes go through PRs (never a direct push or unrequested merge), and the mission spec and context are read before any high-risk git operation."
