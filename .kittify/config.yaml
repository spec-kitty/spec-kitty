vcs:
  type: git
agents:
  available:
  - claude
  - codex
  - cursor
  auto_commit: false
  lint_on_edit: true
project:
  uuid: 8a4a7da6-a97c-4bb4-893a-b31664abfee4
  slug: spec-kitty
  node_id: d036a097a835
  build_id: f97f4d9b-d2fa-4ce6-a7ee-9bbca7308aab
# Charter pointer (WP02 activation-relocation): resolves to charter.yaml,
# the activation authority. Minted at charter.yaml bootstrap (WP03/T014).
charter: .kittify/charter/charter.yaml
# Merge strategy for spec-kitty merge command (mission -> target step).
# One of: merge | squash | rebase. Default: squash.
# Lane -> mission merges always use merge commits regardless of this setting.
merge:
  strategy: squash
mission_type_activations:
- software-dev
- documentation
- research
- plan
# Internal (maintainer-only) org-tier charter pack — catfooding the pack approach.
# Repo-local; loaded as an overlay on built-in. NOT shipped to consumers (the wheel
# force-include is scoped to packs/built-in — see pyproject.toml).
charter_packs:
  org:
    packs:
    - name: internal
      local_path: packs/internal
