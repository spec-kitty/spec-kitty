claim: 'Question 20 (run 1), on planned moves of responsibility between repositories: the documentation-only answer is ''partly correct'' against code at head and a contradicting documentation source was ''found''. Code: Current-state clauses match code: no services/ directory in core, read-service pin only, activation ledger in core (evidence/H06b/code-checks-log.txt Q8,Q20). Not as stated: ''non-status coordination kinds move to the PRIMARY partition'' rests on option (b) of an open rule in an ADR with `status: Proposed`, whose own recommendation is option (a) (docs/adr/4.x/2026-11-06-4-...md:4,99-105). The other moves are plans and are not checkable against code. Sources that disagree: spec-kitty-charter/docs/adr/0033-...md:40-41 versus spec-kitty/.kittify/charter/charter.md:430-432 (direction of activation authority); spec-kitty/docs/adr/4.x/2026-10-19-1-activation-ledger-persists-deactivation.md:71 (Accepted: ''The activation layer is being extracted into its own repository'') versus
  charter.md:426-429 (nothing Python moves; charter.activation stays in core). Cited source authoritative under the repositories'' own rule: no (spec-kitty/docs/architecture/README.md:32-50 (docs/architecture + docs/adr authoritative; reader-facing docs lose; module boundaries owned by code, the enforced pair); docs/plans/ is outside the authoritative tier and the roadmap declares its own authority; the answer states there is no single approved-plan document). Run 2 (gained sources): ''partly correct'' against code, contradicting source ''found''.'
