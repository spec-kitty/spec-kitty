scope:
  covered: 'Rules of the intended model exercised: the core layer chain (kernel, charter, runtime as importers; M-RD-1, 2, 3, 5); public-only use of spec-kitty-events (M-PI-1); the activation seam and the offering surface (M-PI-2, M-PI-5); the runtime engine''s private names (M-PI-3); the charter service''s onion and slice rules (M-PI-4, M-PI-6, M-RD-6); library-to-core direction (M-RD-4); writers of the status event log (M-OB-1, M-OB-6), the activation ledger (M-OB-2), the migration ledger (M-OB-3), a service pin (M-OB-4) and the read service''s read-only guarantee (M-OB-5); six published shapes (events payload, charter OpenAPI, mission-status OpenAPI, orchestrator-api envelope, built-in pack descriptor, wp_window record).'
  not_covered: 'No mutation for: glossary or mission_runtime as the importing layer; charter.offering importing charter.activation; spec-kitty-tracker; pack content edited inside core''s fetched tree (untracked there, so no patch against head can express it); the Mission Write contract; the charter context JSON (F-E2-007); doc-kitty; the Java binding of events. No gate was run, so nothing here says which mutations are detected. Patches were not tested in combination; M-PI-2 and M-OB-2 edit the same place of one file and do not apply together.'
