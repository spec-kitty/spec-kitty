claim: 'The charter repository enforces its intended structure in three places: 92 ArchRule declarations in 10 test-source files (82 in HexagonalArchitectureTest), a declared-dependency allowlist on 2 modules (pack-validation, pack-doctor) and a no-external-library convention on 4 plain-Java modules (kernel, profiles, routing, missions). Run at head, the 9 architecture test classes executed 136 tests with 0 failures and 0 errors (deployable: 123 in 5 classes; packs: 13 in 4 classes), and the build configured without an allowlist or convention refusal: 0 observed dependencies violate the enforced model. The rules carry 9 named-class exemption lines, naming 6 distinct exempted classes (PackDoctorMain in 3 rules, Relationship, EndpointRule, RefusalCode, the round-trip rule class, OwnerOnly) and 1 exclusion of package-info. Beside them the pack-doctor main rule lists 3 adapter classes it may name; the import scan finds it names exactly those 3.'
