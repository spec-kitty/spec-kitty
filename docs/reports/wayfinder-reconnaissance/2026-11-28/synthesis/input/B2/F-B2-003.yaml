claim: 'From compiled classes (jdeps, 15 modules, 2,240 classes, 80 packages) the service has 44 module-to-module dependency edges carrying 3,577 class-level dependencies, and no module cycle. The import scan of source finds 37 of these 44; the 7 it misses all target the generated module charter-api. 10 of the 50 declared main-scope Gradle dependencies have no class-level dependency in main code: 6 are deployable''s (artifacts-edge, missions-edge, profiles-edge, routing, routing-edge, web-transport) and 4 are missions-edge -> web-transport, profiles-edge -> web-transport, pack-validation -> missions and pack-validation -> profiles. 4 observed edges are not declared directly and arrive through an api() dependency (missions-edge, profiles-edge, routing-edge and pack-doctor -> kernel). packs -> kernel alone carries 1,712 of the 3,577 class dependencies (47.9%).'
