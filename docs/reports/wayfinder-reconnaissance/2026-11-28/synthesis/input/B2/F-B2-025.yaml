claim: 'Nine commit-level pins between the five repositories were found, each naming a 40-character commit. Measured against the pinned repository''s origin/main on 2026-11-28 they are behind by: core->events read service 114 commits; core->doc-kitty toolkit 144; open-packs->charter 178; doc-kitty->charter packs contract 182; charter->open-packs 344; core->open-packs internal pack 646; core->open-packs built-in pack 665 (and not an ancestor of main, see F-B2-026); events->core 4,369; charter->core (a constant in a corpus script) 5,111. Version-range couplings stand beside them: core on spec-kitty-events >=11.3.0,<12 and three documentation sites on exact toolkit versions.'
