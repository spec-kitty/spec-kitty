claim: 'Core''s supervision is detection only: stale_detection.py uses the claiming shell PID (with a PID-reuse baseline) and lane commit timestamps as a heartbeat, surfaced by `agent tasks status`; status doctor flags WPs in claimed >7 days or in_progress >14 days; doctor ops closes Ops older than 24 h when asked. None of these stops, times out or reassigns a unit. Timeout enforcement exists in spec-kitty-orchestrator (executor.py:265-295: terminate, 5 s grace, kill); a workstream probe confirmed a `sleep 30` child was terminated after 1 s (returncode -15, reported exit 124). No orchestrator project test exercises the timeout path (its only execute_with_timeout test uses the non-expiring path).'
