claim: 'Of 14 unit identifiers mapped, 8 are minted in core (mission_id ULID, wp_id, lane_id, status event_id, Op invocation_id ULID, next run_id uuid4, orchestrator-api correlation_id, claim shell_pid); 3 exist only as spec-kitty-events contracts with no producer in core (SessionIdentity.session_id, FactoryAttemptRef.attempt_id, OpsInvocation (invocation_id, attempt)); 2 are provider-local in spec-kitty-orchestrator (retry counters, run-state file). The only cross-join between an Op and work-package state is one-way: a claim given --invocation-id checks the Op''s mission_id/wp_id/action and records the resolved profile, but the status event stores no invocation_id. correlation_id is returned per call and not persisted in status events.'
