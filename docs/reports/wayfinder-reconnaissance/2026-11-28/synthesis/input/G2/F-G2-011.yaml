  deviation: Own-check run used --noconftest -o addopts= because the conftest collection hook was killed twice by the host out-of-memory killer; the full gate-level conftest behaviour is not exercised.
subject:
  component: core Python distribution spec-kitty-cli 4.0.0rc9 (wheel)
  repository: spec-kitty/spec-kitty
  revision: 5c4fc5a79de1c1c299ab221ca26e5555c68ef533
  revision_kind: head
claim: 'Building the core wheel from a non-git copy of the source tree at head fails (PACK_TREE_STALE: packs/built-in missing; ''an sdist build verifies only and never fetches''). From a git checkout at head the hatch build hook fetches packs/built-in from https://github.com/spec-kitty/spec-kitty-open-packs.git at the pinned commit a79c36318b and digest-verifies it, and the build succeeds (22.8 s). The wheel installs into a fresh Python 3.13 venv with spec-kitty-events 11.3.0 and spec-kitty-tracker 0.5.2 resolved from PyPI (no other repository''s source), ''spec-kitty --version'' and ''spec-kitty init --ai claude --non-interactive'' plus ''charter context --action review --json'' succeed in a scratch git repository. Core''s own named test file tests/charter_offering/drg/test_builtin_graph_seam.py passes 4/4 in the checkout holding the fetched pack tree and fails 4/4 (BuiltInPackMissing) in the copy without it. In the same non-git copy, 2 of 129 tests in five architectural gate files fail
  with SiblingPathNotFound for packs/built-in (TestUnifiedMissionStepBoundary in test_layer_rules.py). Build and tests therefore depend on content of a second repository (fetched by pin and digest, not by a published package); install and smoke do not.'
