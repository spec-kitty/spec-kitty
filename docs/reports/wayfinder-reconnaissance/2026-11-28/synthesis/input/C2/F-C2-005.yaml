claim: 'On a seeded sample of 50 non-merge, non-bulk code commits (population 6,345, random.Random(20261128)), the fixed rule set agreed with a diff reading in 38 of 50 cases (76%, Cohen''s kappa 0.62). Disagreements: 3 cherry-picked commits labelled convergence-activity by rule R1 were read as corrective (2) and restructuring (1); 3 fix-prefixed commits were read as restructuring (Sonar cleanup, inert-entry removal, post-shim residue scrub); 1 feat-prefixed Mission squash merge was read as corrective; 1 chore commit touching migrations was read as corrective; 1 prefix-less ''fix(#2313) phase 2:'' subject fell to the compatibility keyword; 2 commits without a recognised prefix were read as capability-growth and restructuring; 1 docs commit with ''correct'' was read as other.'
