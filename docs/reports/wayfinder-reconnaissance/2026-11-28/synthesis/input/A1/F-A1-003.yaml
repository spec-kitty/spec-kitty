claim: 'No record in the five primary repositories or the planning repository states a general precedence order among the repositories. Cross-repository authority is stated pairwise per subject in 8 records: charter ADR-0015 (charter repo canonical for charter structure, contracts and pack schemas; consumers including core adapt, :51-58); core ADR 2026-10-03-1 Amendment 2026-10-19 (core governs seam routing only; offering internals decided in spec-kitty-charter, :384-390); events ADR-0002 and events charter.md:90-92 (events repo owns the services and contracts; services never depend on core); open-packs charter.md:15-20 (charter repo owns pack logic incl. activation; core is assembler); doc-kitty ADR-0082 D1 and ADR-0079 (doc-kitty reads producers'' published contracts only); core charter.md:536-540 (PR process delegated to planning PROGRAM.md 5-9); events charter.md:72 (PROGRAM.md section 2 governs package distribution during the programme).'
