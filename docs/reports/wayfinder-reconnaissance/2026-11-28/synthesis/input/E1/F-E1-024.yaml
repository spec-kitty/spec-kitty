claim: 'Recorded rules differ by repository. Core: "Exceptions discussed case-by-case. Strong justification required"; a baseline entry names an issue, an owner and a drain date; growing a cap needs a justification comment on the changed line in the same pull request; an ADR adds that a transient allowlist needs an issue, a named owner and an exit date. Charter: exceptions to hand-written gates live in one suppressions register with rule, file, reason and sunset; a risk exception names scope, reason, approver and sunset or review date. Events: exceptions need explicit maintainer approval and a documented follow-up. doc-kitty: a genuine exception to a gate is recorded as an ADR. open-packs: no rule found. No repository records who approves an allowlist entry other than through review of the pull request.'
