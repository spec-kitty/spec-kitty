claim: '420 of 3,357 file-ledger entries (12.5%) carry an issue reference, an ADR reference or a retirement condition in their own text or attached comment; without the two lint baselines it is 336 of 1,092 (30.8%: 308 with an issue, 47 with an ADR, 49 with a retirement condition). Per ledger the share ranges from 0% (charter.activation boundary baseline, built-in pack provenance baseline, coverage baselines, mypy quarantine, global-state allowlists) to 100% (inline meta reads, mission-type reader exemptions, widened dead symbols, deferred OS-detection exemptions). At ledger level, the header of 17 of the 28 non-empty file ledgers names an issue, 5 name an owner and 4 a retirement condition. Inline markers: 44 of 429 (10.3%) outside the noqa scan.'
