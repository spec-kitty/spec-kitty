claim: Exploratory, module level. The recorded rule that consumers import mission_runtime only from the package root holds for 213 of 213 importing modules outside mission_runtime (799 imported names, 0 naming a submodule). For specify_cli.status, 202 of 245 module pairs (82.4%) from outside the package target the package root and 43 name a submodule; 182 of 206 importing modules (88.3%) use only the root. The most-named submodules are status._unsafe (7 importing modules), status.models (7), status.wp_metadata (5), status.reducer (3), status.locking (2), status.mission_write (2) and status.read_surface (2). The records forbid imports of status internals from outside Mission Management; which submodules count as internals and which modules are Mission Management is not mapped (F-B3-007), so the 43 pairs are a count, not a count of breaches.
