claim: Sensitivity to rule (b). Not counting the general layer-chain rule as documentation moves M03b by 3 of 14 edges at top level (78.6% -> 57.1%; weight 91.2% -> 87.9%; load-time weight 94.7% -> 91.0%) and by 5 of 656 edges at full granularity (24.7% -> 23.9%; weight 30.2% -> 29.0%; load-time edges 29.8% -> 29.0%, load-time weight 35.7% -> 34.3%). The pairs carried only by the general rule are runtime -> kernel (26), runtime -> charter (20) and mission_runtime -> kernel (8). The change of granularity moves the edge share by 53.9 percentage points (78.6% -> 24.7%), against 21.5 points (top level) and 0.8 points (full) for the rule.
