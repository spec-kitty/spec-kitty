claim: M01f does not replicate in T2 and only partly in T1 and T3. As reported, file-level cross-component edges added per 1,000 changed Python lines are T1 4.311 vs 5.358, T2 1.651 vs 5.953, T3 3.616 vs 3.330; component pairs new to the src import graph per kloc are T1 1.383 vs 1.515 (replicated), T2 0.241 vs 0.906, T3 0.275 vs 0.491. Frames are identical in size and membership (947, 1,809, 3,026 code commits) but the samples share only 40, 15 and 11 of 150 commits; on shared commits the two edge counters give the same file-edge count for 36 of 40, 14 of 15 and 11 of 11. Recomputing both with the same estimator (unweighted or stratum-weighted) leaves the T2 gap (1.656 vs 5.953 unweighted). In C T2 one sampled commit holds 65.8% of sampled changed lines; without it C T2 is 4.846 per kloc. Between periods the runs agree that new-to-graph pairs per kloc fall from T1 to T2 and from T1 to T3, and disagree on the direction of file edges T1 to T2 and T2 to T3 and of new-to-graph pairs T2 to T3.
