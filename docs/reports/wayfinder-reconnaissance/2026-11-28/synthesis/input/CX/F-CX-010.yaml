claim: 'Component recurrence replicates (corrective commits in three or more months: 69 of 88 vs 68 of 88 components); file recurrence replicates in count (497 vs 517 files) but not in denominator (1,712 vs 1,977 corrected files; shares 29.0% vs 26.2%, relative difference 10.4%). The 14-day refix share with one shared src file replicates in T1 (435/539 = 80.7% vs 428/541 = 79.1%) and not in T2 pooled (75.0% vs 66.0%) or T3 (1,624/1,917 = 84.7% vs 1,331/1,880 = 70.8%). The strict variants are not comparable: C requires file-set Jaccard >= 0.5 (29.7% / 44.3% / 52.3%), C2 requires >= 50% of the first fix files (56.6% / 52.1% / 55.4%). Both runs show the one-shared-file share falling from T1 to T2; from T2 to T3 both show a rise.'
