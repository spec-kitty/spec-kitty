claim: 'Definitional or procedural choices that moved a compared result by more than 10%: (1) rule order and keyword fall-through in commit classification (compatibility-work T3 303 vs 69 code commits; class-level M01c/M01d for compatibility-work and other); (2) component assignment by file lineage (C) vs directory rules (C2) (top-level M01d T2 EXPERIMENTAL 11%; T1 co-change pair counts; recurrence denominator 1,712 vs 1,977); (3) line boundary of the fork window, reachability vs date (fork-window top-level M01d 12%); (4) M01f estimator and stratum allocation together with a heavy-tailed sample (T2 1.651 vs 5.953); (5) M02 fix-subject rule and contract-path rule (frames 666 vs 698; no-component fixes 348 vs 591); (6) M02 detection buckets, untraceable vs not-determinable plus reviewer split (M02a person 22 vs 16); (7) refix file matching through rename lineage, line compatibility and fix set (T3 84.7% vs 70.8%) and the strict-overlap rule (Jaccard vs share of the first fix); (8) events component
  universe and imported-commit test (2026-10 0.268 vs 0.218; 141 vs 0 imported); (9) acceptance definition in M02 (not comparable); (10) agent-authorship column definition (not comparable). Choices that did not move a result by more than 10%: rename detection in the merge diff, the percentile method, and treatment of bulk commits once subtracted.'
