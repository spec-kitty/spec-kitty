claim: 'Class IC: 5 of 6 mutations detected (5 of 6 assessable): 4 by checks per-change CI runs (M-IC-1 events unit and conformance tests, M-IC-4 and M-IC-6 core unit tests found by the mirror rule, M-IC-5 open-packs digest and generated-page drift checks) and 1 only by a tool no workflow invokes (M-IC-3, contracts/tools/example_check.py; Gradle side not assessable). Not detected: M-IC-2 (charter contract, optional request property made required). 4 of the 5 failure messages name the changed field or value; M-IC-5 names the pack and a digest. In none of the 6 runs did a check of a version constant or changelog requirement fail. By subtlety: blatant 2/2, moderate 1/2, subtle 2/2.'
