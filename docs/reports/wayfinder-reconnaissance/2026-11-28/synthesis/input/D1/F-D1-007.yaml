claim: 'A source checkout of core head does not work until the built-in pack is fetched: with packs/built-in absent, charter.offering.pack_paths.built_in_root() raises BuiltInPackMissing naming `make sync-packs`. Sync succeeds with no network when the cache holds the pinned commits (both trees placed, --check ok) and fails closed with PACK_SYNC_UNAVAILABLE (exit 1) when the cache is empty, offline or online-without-network. An installed wheel needs none of this: `charter pack path built-in` resolves to site-packages/packs/built-in inside an empty network namespace. The wheel build itself fetches or verifies the tree through hatch_build.py.'
