claim: 'Shared path conventions at head, by static construction of paths: 1,313 path expressions in 462 of 1,490 modules and 57 of 74 components build a path under .kittify/, kitty-specs/ (including a Mission directory) or a per-user directory. They resolve to 185 distinct path keys (anchor plus first segment); 82 keys are constructed in two or more components, and for 16 keys two or more components construct the path inside a function that also contains a write call. The most widely constructed keys: .kittify/config.yaml (29 components, 93 sites), the .kittify root (23), the kitty-specs root (21), <Mission dir>/meta.json (17), <Mission dir>/tasks (17), <Mission dir>/status.events.jsonl (14 components, 52 sites, write co-occurrence in 4), .kittify/charter (11), .kittify/runtime (10).'
