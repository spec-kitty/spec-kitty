claim: 'Q12 (How does a new version of the events package reach a core release?) Run-1 documentation (2,051 files across five repositories at head) answers: spec-kitty-events releases to PyPI; core consumes it through a SemVer range in pyproject.toml and an exact version in uv.lock. A bump PR runs ''uv lock --upgrade-package spec-kitty-events'', updates the range if the floor moves and the shared-package compatibility file, regenerates the committed envelope snapshot, runs the event-consumer tests and A/B-checks reducer changes; the next core release carries the locked version. Analyst-chosen authority: spec-kitty/docs/development/reference/events-in-core.md:155-170. Concurring sources cited: 4; differing sources cited: 3. Run-1 searches: 1.'
