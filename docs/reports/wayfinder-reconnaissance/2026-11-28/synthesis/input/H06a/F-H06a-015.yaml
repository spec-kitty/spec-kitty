claim: 'Q15 (Where are status events published for outside consumers, and is there a default transport?) Run-1 documentation (2,051 files across five repositories at head) answers: The committed event ledger (status.events.jsonl) is the publication seam: outside consumers read it with ''spec-kitty events tail'' (cursor) or the Mission Status Read API, never by being called by the CLI; spec-kitty/event-router is such a subscriber. An in-process fan-out seam, status/adapters.py, stays transport-free; open-core registers no handler, so every fire_* is a no-op. There is no default transport. Analyst-chosen authority: spec-kitty/docs/adr/4.x/2026-10-13-2-the-event-ledger-is-the-publication-seam-default-on-with-local-retention.md:104-120. Concurring sources cited: 3; differing sources cited: 2. Run-1 searches: 1.'
