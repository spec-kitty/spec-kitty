claim: 'Q4 (Which repository owns the source of the built-in pack, and how does core obtain it?) Run-1 documentation (2,051 files across five repositories at head) answers: spec-kitty-open-packs owns the source of the built-in (and internal) pack. Core commits only a pin lockfile, packs/built-in.source.yaml, and ''make sync-packs'' fetches the pinned commit, verifies the clean-tree digest and places packs/built-in/; pins are bumped with ''spec-kitty charter pack vendor --pack built-in --ref <sha>''. Analyst-chosen authority: spec-kitty/docs/adr/3.x/2026-08-16-2-open-packs-is-source-of-truth-for-built-in-doctrine.md:100-114. Concurring sources cited: 5; differing sources cited: 5. Run-1 searches: 2.'
