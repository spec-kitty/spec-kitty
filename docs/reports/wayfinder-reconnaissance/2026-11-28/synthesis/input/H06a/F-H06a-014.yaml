claim: 'Q14 (Which mission types exist, and where is a mission type''s state machine defined?) Run-1 documentation (2,051 files across five repositories at head) answers: Four mission types exist: software-dev, research, documentation and plan. A mission type''s step state machine is its step DAG in mission-runtime.yaml; the canonical catalogue is packs/built-in/missions/<type>/, and the runtime is a finite-state machine that reads the resolved mission type keyed off meta.json. The work-package lane state machine is separate (planned -> ... -> done). Analyst-chosen authority: spec-kitty/docs/architecture/mission-system.md:104-112. Concurring sources cited: 5; differing sources cited: 3. Run-1 searches: 2.'
