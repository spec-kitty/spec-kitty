claim: 'Q8 (Does the CLI start a long-running service? Which one, with what lifecycle?) Run-1 documentation (2,051 files across five repositories at head) answers: By design yes: the CLI fetches, digest-verifies and starts pinned service binaries on first need and never ships them in the wheel. The write service runs as one loopback HTTP instance per git common dir (endpoint file in the git common dir, default idle timeout 1800 s, ''spec-kitty service stop'' stops it); the charter service is designed as one loopback daemon per worktree; the Mission Status read service is pinned for CI conformance only and is never launched by the CLI. Several documents say the launcher or pins do not yet exist. Analyst-chosen authority: spec-kitty/.kittify/charter/charter.md:404-410. Concurring sources cited: 7; differing sources cited: 8. Run-1 searches: 2.'
