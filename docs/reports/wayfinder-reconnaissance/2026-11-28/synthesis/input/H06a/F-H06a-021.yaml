prereg:
  measure: H06a-discoverability
  deviation: 'Run-1 independence limit: the session harness placed spec-kitty CLAUDE.md and spec-kitty-events CLAUDE.md in the analyst''s context before run 1 (not opened as files); run-1 answers cite only run-1 sources. Scope reading: ''site content'' taken as site/**/*.md|mdx; README files under src/ and tests/ included. See workstream report. Searches count only logged corpus-wide grep calls; targeted reads of already-located files are listed separately in the log. Differing-source and decision-document classification is by the analyst.'
subject:
  component: ecosystem documentation
  repository: spec-kitty/spec-kitty
  revision: 5c4fc5a79de1c1c299ab221ca26e5555c68ef533
  revision_kind: head
claim: 'Discoverability over 20 questions, run-1 documentation corpus of 2,051 files: 41 logged corpus-wide searches (mean 2.05, median 2, max 4 per question; plus 51 targeted reads of located files); 15 of 20 questions had at least one cited source stating something different from the chosen authority, and for 14 of 20 that differing source is itself a charter, ADR or architecture document; confidence high 8/20, medium 10/20, low 2/20; questions without a single answering document: 3 of 20 (Q11 no general precedence rule, Q19 recovery spread across pages, Q20 no single approved plan), and Q17 only partly answered; chosen authorities: 19/20 in spec-kitty core, 1/20 in spec-kitty-events; by kind ADR 7, architecture doc 4, charter 3, API reference 2, README 1, development reference 1, how-to 1, plan 1. Run 2 (adding 13 agent-guidance files): 12 of 20 questions changed or gained sources (6 answers changed or became more answerable, 4 gained a contradicting or qualifying source, 2 gained corroborating
  or authority sources); 8 unchanged.'
