claim: 'Q10 (How is a Mission identified, and what may be used to look one up?) Run-1 documentation (2,051 files across five repositories at head) answers: A Mission is identified by a ULID mission_id (26 characters) minted at ''agent mission create'' and immutable; mid8 is its first 8 characters, mission_slug is a human handle and mission_number is display-only and never used for identity. Selectors accept mission_id, mid8 or mission_slug; an ambiguous handle returns MISSION_AMBIGUOUS_SELECTOR with no silent fallback. Analyst-chosen authority: spec-kitty/docs/api/orchestrator-api.md:328-338. Concurring sources cited: 4; differing sources cited: 0. Run-1 searches: 2.'
