claim: 'At core head no Java service is started by any command path. Tracked pins: 1 (read-service). ''spec-kitty
  service status'' and ''service fetch --all'' print ''No service is pinned in this spec-kitty version yet'' (exit
  0). ServiceLauncher.ensure refuses all three services: write-service with SERVICE_PIN_INVALID (''no pin lockfile''),
  read-service and charter-service with ''the CLI does not launch''. Outside the services package the launcher is
  referenced only by the ''service'' command (status, stop). A status transition written and read through core''s
  Python in a disposable project succeeded with no service present; the 3 child processes spawned were git, and
  no endpoint directory appeared. The read service runs when a user or CI starts it (one project root, loopback,
  read-only); the charter service runs when started with a configuration root and a token (loopback by default;
  a container profile binds all interfaces on port 8080); the write service, when launched, is one process per git
  common dir with a lock file and an idle timeout.'
