  org level), 401 without the bearer token, POST /api/v1/activations 201, then GET of the activation, its packs
  and its effective artifacts 200; the created activation was stored as 1 file under the service''s own configuration
  root. open-packs'' own check script, run unchanged against the pinned rc.3 jar, printed 46 ''ok'' lines and exited
  0 (composition, registration of every pack through PUT, and 10 expected refusals of 5 invalid fixtures).'
