claim: 'Classification of the gaps observed. Unsupported by design, on the basis of a recorded statement in the
  repository that says so: the CLI not launching the read service; no charter-service or write-service pin in core
  and no write transport; 5 of 10 mission-status operations answering 404; open-packs working only with its pinned
  charter build. Not classifiable from recorded intent found in this workstream: the released contract version strings
  reading SNAPSHOT; the fixtures archive lacking 5 goldens its request set names; the activation corpus in core
  not being referenced by the charter repository. Environment limits, not properties of the repositories: the events
  build, the attestation check and the first charter build attempts. No observation in this workstream was classified
  as a defect.'
