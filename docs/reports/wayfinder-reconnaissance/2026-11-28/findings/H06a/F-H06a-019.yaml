claim: "Q19 (What happens to an in-flight Mission when the process is interrupted?) Run-1 documentation (2,051 files across five repositories at head) answers: No single document answers it. Status survives in the event log, so a work package left in_progress is restored with 'spec-kitty implement <WP> --recover' (re-emits the transition, keeps commits); an interrupted consolidation keeps a record in .kittify/runtime/merge/<mission_id>/state.json and is continued with 'consolidate --resume' or rolled back with 'consolidate --abort'; 'spec-kitty next' returns a blocked result with a next_command that resumes a claimed or in-progress work package. Analyst-chosen authority: spec-kitty/docs/guides/how-to/recovery/recover-from-implementation-crash.md:15-50. Concurring sources cited: 5; differing sources cited: 0. Run-1 searches: 2."
