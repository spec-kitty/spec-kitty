claim: "The main-scope Gradle project dependency graph of the 16 service modules (api/implementation/compileOnly/runtimeOnly project() dependencies) is acyclic (0 cycles). Adding test-scope dependencies gives 1 cycle: packs -testImplementation-> pack-validation -api-> packs. Against the recorded baseline (the 'Depends on' column of docs/architecture/hexagonal-service.md), 5 of the main-scope module edges are absent from the table: activations->charter-api, packs->charter-api, packs->missions, packs->profiles, packs->routing (the last three are recorded elsewhere in the same document and in settings.gradle.kts comments citing ADR-0037/ADR-0080). At package level, grouping by the package root ai.speckitty.charter.<slice> yields one 5-slice SCC (activations, missions, packs, profiles, routing), which disappears (0 SCCs) when grouped by slice plus ring (domain/application/infra.<x>); 2 package-level SCCs exist, both within packs (packs.domain with .graph and .rules; packs.infra.storage with .markdown), of 78 packages."
