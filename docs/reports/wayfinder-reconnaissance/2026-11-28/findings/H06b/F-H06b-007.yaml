claim: 'Question 8 (run 1), on services started by the CLI: the documentation-only answer is ''partly correct''
  against code at head and a contradicting documentation source was ''found''. Code: Design details match code:
  write-service policy scope git_common_dir, launchable; charter-service scope worktree, launchable=False (src/specify_cli/services/policies.py:56-58);
  read-service pin present; default idle timeout 1800 s is the service''s (spec-kitty-events ServeOptionsTest.java:28).
  Not as the answer''s leading ''yes'': ServiceLauncher is referenced only by `service stop` (src/specify_cli/cli/commands/service.py:294);
  no caller of its ensure/start exists in src; pins/ holds only the read-service pin; `spec-kitty service status
  --json` returns ''No service is pinned in this spec-kitty version yet.'' exit 0 (evidence/H06b/code-checks-log.txt
  Q8; evidence/H06b/service-status.txt). The launcher module does exist, contrary to ''launcher does not yet exist''.
  Sources that disagree: spec-kitty/docs/development/how-to/service-pins.md:35-38 (''No pin exists yet. pins/ holds
  only its README.md'') versus spec-kitty/pins/README.md:29-32 and spec-kitty/.kittify/charter/charter.md:400-402
  (first pin vendored); spec-kitty/docs/adr/4.x/2026-10-29-1-...md:57 (''the write-service launcher (#6676) is unbuilt'')
  and spec-kitty/docs/plans/events-domain-move/plan.md:41 (''No Python code launches either service'') versus charter.md:400
  (''The mechanism is built (#6590)'') and service-pins.md:66 (''the first command that needs a service fetches,
  verifies and starts it''). Cited source authoritative under the repositories'' own rule: yes (spec-kitty/.kittify/charter/charter.md:98-100
  (single canonical authority) and spec-kitty/AGENTS.md:22 (charter wins over the agent guide)). Run 2 (changed):
  ''correct'' against code, contradicting source ''found''.'
