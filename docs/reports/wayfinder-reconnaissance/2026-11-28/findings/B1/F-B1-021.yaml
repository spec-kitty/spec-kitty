claim: 'Building core from a git checkout fetches content from another repository: in a fresh clone at head, `uv
  sync --frozen --all-extras` (exit 0) created packs/built-in during the editable build of spec-kitty-cli, through
  the hatch build hook, and created a pack cache keyed by the open-packs commit a79c36318b7a pinned in packs/built-in.source.yaml.
  With that cache emptied, the tree removed and SPEC_KITTY_PACK_OFFLINE=1, the same build fails (exit 1) with PACK_SYNC_UNAVAILABLE;
  with the cache present it succeeds offline (exit 0). packs/internal and the service binaries were not fetched
  by the build.'
