claim: 'Exception leakage at head: 542 exception classes are defined in src/. Of 3,770 `except` clauses and `raise`
  statements that name one of them, 1,651 (43.8%) are in a different component from the class definition: 1,499
  catches and 152 raises. 259 of the 542 classes (47.8%) are caught or raised by name outside their defining component,
  over 231 ordered component pairs. The largest pairs (defined in -> used in, caught/raised): mission_runtime ->
  specify_cli.cli 50/43; charter.activation -> specify_cli.cli 53/4; kernel -> specify_cli.cli 52/1; specify_cli.missions
  -> specify_cli.cli 48/1; charter.offering -> charter.activation 36/4; specify_cli.coordination -> specify_cli.cli
  39/0; specify_cli.task_utils -> specify_cli.cli 24/14. The most widely used classes are kernel.git.runner.GitCommandError
  (188 sites) and mission_runtime.resolution.ActionContextError (140).'
