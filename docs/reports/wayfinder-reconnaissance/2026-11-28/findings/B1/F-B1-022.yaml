claim: 'Import of the package depends on the fetched pack tree: in the same clone with dependencies installed and
  packs/built-in removed, 811 of 1,490 modules (54.4%) raise BuiltInPackMissing on import (727 in specify_cli, 57
  in charter, 27 in runtime), and `spec-kitty --version` and `spec-kitty agent profile list` exit 1 with the same
  error. Every one of the 811 failures passes through one module-level statement, charter/activation/activations.py
  line 89, which derives a constant from the built-in mission types when the module is loaded. With the tree present,
  0 of 1,490 modules fail and both commands exit 0.'
