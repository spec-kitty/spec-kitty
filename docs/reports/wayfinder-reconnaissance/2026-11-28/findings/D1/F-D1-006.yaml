claim: 'Released artefacts differ from head as follows. 4.0.0rc8 wheel: 2188 files, same 6 top-level trees, same
  built-in pack commit and same read-service pin as head, extra `services` pin ==4.0.0rc8; its resolved closure
  is 53 distributions against 44 for the head wheel (9 extra: mcp, starlette, uvicorn, sse-starlette, httpx-sse,
  pyjwt, pydantic-settings, python-dotenv, python-multipart). 3.2.7 wheel: 2066 files, a top-level module doctrine.py,
  502 pack files, no _pins, depends on spec-kitty-events >=6.0.0,<7 and spec-kitty-tracker >=0.4,<0.5 (resolved
  6.1.0 / 0.4.3), closure 49. The 3.2.7 sdist additionally ships kitty-specs (450 files), docs (29), tests (10),
  scripts (2), research-outputs (4) and packs/internal/README.md. spec-kitty-services 4.0.0rc8 on PyPI is one py3-none-any
  wheel of 8 files with no binary.'
