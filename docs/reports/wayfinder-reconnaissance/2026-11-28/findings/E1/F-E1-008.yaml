claim: '15 cross-repository check relations were found in the workflows of the five repositories. Two are required
  on every pull request (events: the end-to-end harness at a pinned commit; open-packs: the pinned charter release
  composes every pack). Five are required only when a path group selects them (core consumer tests of the events
  package and the docs-site build; events lock-interop and write-core-parity against a pinned core commit; charter
  verifyAll and whole-pack round trip against a pinned open-packs commit; doc-kitty packs corpus against a pinned
  open-packs commit). Two run per PR without being required (core: shared-package drift; core: pack pin and regeneration
  checks). Five run on a schedule. For one relation, core against the charter service, no check exists: core holds
  no charter pin and no core workflow names the charter repository.'
