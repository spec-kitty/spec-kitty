interpretation: The count of recorded exceptions rose over the range mainly because new gates registered existing
  constructs in new ledgers (30 ledgers created, 827 entries), while the ledgers that existed at the start shrank
  or stayed flat with three exceptions. The census cannot tell a newly recorded old construct from a newly created
  one, so "growing" at ledger level does not by itself mean that more transitional code was written.
