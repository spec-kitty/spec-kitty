claim: "orchestrator-api consolidate-mission takes 5 options (mission, target, strategy, push, origin-check) against 33 distinct options on `spec-kitty consolidate`; the API has no resume, abort, dry-run, attestation (--attest-*), --dependency-ref, retention (--keep-*/--delete-branch), --release-branch or --retarget. The API states this itself: consolidation.py:580 and :635 append 'attestation is done with `spec-kitty consolidate` (CLI only)'. Its stale-lane failure text (1.31.0) prints a re-review route made of host CLI commands (`spec-kitty agent action implement ... --incorporate`, `move-task`, `spec-kitty consolidate`; lanes/stale_check.py:273-294), which host-boundary-rules.md Anti-pattern 2 tells external systems not to call. The API also has no verb for Op/dispatch, implement --recover, doctor or review-feedback capture."
