claim: 'Of 220 period-to-period or month-to-month comparisons where both runs give a value, the direction of change
  is the same in 198 (90%). For all-class M01c (mean, median, p90) and M01d (both component levels) the direction
  agrees in every period step and line segment (25 of 25). Disagreements: 13 of 150 by-class rows (compatibility-work,
  restructuring, other, convergence-activity), 1 month (2026-08 public M01d, 0.4134 vs 0.4075 after 0.4107 vs 0.4147),
  and 8 M01f rows (file-edge rate T1 to T2 and T2 to T3; new-to-graph pairs T2 to T3). Both runs agree that the
  refix one-shared-file share falls from T1 to T2 and rises from T2 to T3.'
