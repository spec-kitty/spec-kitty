claim: The two pre-written rule sets assign the same class to 5,671 of the 6,345 code commits both runs classified
  (89.4%, Cohen kappa 0.841; T1 89.3%, T2 91.0%, T3 88.0%). The largest disagreement cell is 378 commits classed
  compatibility-work by C and corrective-maintenance by C2, followed by C other / C2 restructuring 93 and C other
  / C2 corrective 71. Both runs drew the same 50 validation commits (50 of 50 shared); each reports 38 of 50 rule-vs-reading
  agreement (kappa 0.66 vs 0.62); the two readers agree with each other on 45 of 50 and the two rule outputs agree
  on 44 of 50.
