  search: Looked for definition differences in both frame scripts and coding notes.
  result: Fix rule (C prefix or first word; C2 adds fold, fixup, landing fold and fix/bug/regression keywords anywhere)
    and contract rule (C contract/schema directories and schema basenames outside kitty-specs/ and tests/; C2 contracts/
