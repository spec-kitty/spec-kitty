claim: 'M02 frames and samples differ, and the sampled rates replicate on origin but not on detection. Frames: M02a
  666 (C) vs 698 (C2) from 2,276 vs 2,553 fix-subject commits; M02b 1,262 vs 1,264. Samples overlap in 4 of 30 (M02a)
  and 2 of 30 (M02b). Origin split is identical in both samples: M02a same pull request 13, earlier change on main
  15, unknown 2; M02b 21 and 9. Detection does not replicate: M02a (a) 1 vs 2, (c) a person 22 vs 16, untraceable
  or not determinable 7 vs 11; M02b (a) 3 vs 5, (b) 1 vs 1, (c) 8 vs 8, untraceable or not determinable 18 vs 16.
  On the 6 commits both traced, origin agrees on 4 and mapped detection on 5. Mission-acceptance counts are not
  comparable (C counts only the 15 earlier-change introducers, acceptance on or before pull-request merge; C2 counts
  20 traced introducers including same-pull-request ones, acceptance before or on the commit day).'
