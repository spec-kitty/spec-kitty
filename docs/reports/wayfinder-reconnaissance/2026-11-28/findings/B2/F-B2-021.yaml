claim: "doc-kitty imports no code of another ecosystem repository. Its one inbound interface from another repository\
  \ is a vendored snapshot of the charter repository's packs contract: 7 files under src/lib/packs/contract/, locked\
  \ in contract.lock.json to charter commit 33f3ad46 (tag contract-packs-v0.1.0-rc.2) with a SHA-256 per file, refreshed\
  \ by a maintainer script (src/scripts/packs-sync-contract.mjs) and never at build time. At charter head (182 commits\
  \ after that pin) 4 of the 7 files are byte-identical to contracts/packs/ and 3 differ (line similarity 0.976,\
  \ 0.918, 0.794). Pack content itself is read from a directory the consumer passes; the reader takes an optional\
  \ path to the consumer's charter.lock.yaml to compare commits. In the other direction, four repositories consume\
  \ the toolkit as an npm package for their documentation sites."
