claim: "Taking each commit or version pin as a directed edge between repositories, the graph over the five repositories\
  \ has 11 distinct edges and two 2-node cycles: charter <-> open-packs (charter's gradle.properties pins an open-packs\
  \ commit for its governance and usability packs; open-packs' charter.lock.yaml pins a charter release to prove\
  \ its packs against) and core <-> events (core pins the events read service and depends on the events PyPI package;\
  \ events' service/core-pin.json pins a core commit for CI-only parity oracles). doc-kitty is depended on by the\
  \ other four and itself pins only charter. Core holds no pin of the charter repository: pins/ contains read-service.source.yaml\
  \ only, while src/kernel/service_pin.py:71 already names a charter-service asset."
