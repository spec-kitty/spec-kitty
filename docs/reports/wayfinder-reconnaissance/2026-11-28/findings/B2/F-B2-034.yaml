interpretation: Neither repository uses module-info.java, so every public type of a module is reachable by any module
  that depends on it; cross-module reach into application and infra packages does occur and is bounded only by ArchUnit
  rules that run in one module's test task. Where a module is not on that task's classpath (charter's contracts
  and client-java, events' java-binding) no structural rule applies. This reading rests on static counts; for events
  it also rests on rules that were not executed here.
