claim: '''tier'' for packs has three uses and two contradictory rules: (a) audience tier, built-in (shipped) vs
  internal (in-house), where internal is loaded as an org pack — core binding charter .kittify/charter/charter.md:452;
  (b) the pack level built-in/org/project, whose single code authority is named kernel.pack_tiers while the glossary
  entry is ''Pack Level'' (governance.md:81) and the DRG middle layer is ''Organization Tier'' (charter.md:725,
  whose definition also says ''three-tier'' for a heading ''Three-layer''); (c) open-packs calls pack_level ''Pack
  tier'' (index.md:24). The charter repository says ''Do not say tier for either'' level or layer (domain.md:107)
  yet keeps an ''Organization Tier'' glossary entry. Lines: ''pack tier(s)'' core 153 / open-packs 12; ''pack level(s)''
  core 93 / charter 75; ''project tier'' core 88 / open-packs 28; ''project layer'' core 525; ''project pack'' charter
  279.'
