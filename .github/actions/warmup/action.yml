name: "Warmup / test-env creation"
description: >-
  Shared composite that resolves spec_kitty_events and builds the editable
  pytest environment exactly once, publishing it as a cache-keyed reusable
  artefact so downstream shards reuse it instead of re-running `uv sync` —
  dissolving the #3283 venv-lock bootstrap cascade (FR-003). mode: "pr"
  (default) resolves the recorded pinned spec_kitty_events rev for
  deterministic, cache-hit PR builds (charter Shared-Package pinned-rev
  policy — never a moving branch ref). mode: "full" resolves the latest
  published spec_kitty_events mainline release to surface upstream drift
  early (nightly / workflow_dispatch "run full"). See research.md D2 and
  data-model.md E8 in kitty-specs/ci-pipeline-reinstatement-01M1X35E/.

inputs:
  mode:
    description: >-
      Resolution mode. "pr" resolves the recorded pinned-events-rev input —
      deterministic, cache-hit, no moving ref. "full" resolves the latest
      published spec_kitty_events mainline release — an upstream-drift
      signal for nightly / workflow_dispatch "run full" runs. Defaults to
      "pr".
    required: false
    default: "pr"
  pinned-events-rev:
    description: >-
      The recorded spec_kitty_events version resolved when mode is "pr".
      Must be an explicit, non-moving version — never a moving branch ref
      (charter Shared-Package pinned-rev policy). Bump this input, reviewed,
      when the recorded pin advances.
    required: false
    default: "10.4.0"

outputs:
  resolved-events-rev:
    description: >-
      The spec_kitty_events version actually resolved for this run: the
      pinned-events-rev input in pr mode, or the latest published mainline
      release in full mode.
    value: ${{ steps.resolve-rev.outputs.resolved-events-rev }}
  cache-hit:
    description: >-
      "true" when the built environment was restored from cache (the
      editable install was skipped this run); "false" when a fresh build
      ran. Lets callers observe the #3283 single-build-then-reuse contract.
    value: ${{ steps.restore-cache.outputs.cache-hit }}
  venv-path:
    description: >-
      Absolute path to the built virtual environment, for downstream shards
      to reuse without re-running the install.
    value: ${{ steps.expose-env.outputs.venv-path }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        # Keep the caller's full history: recovery tests clone this checkout
        # and must retain pinned historical commits, not just source files.
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Resolve spec_kitty_events rev (mode ${{ inputs.mode }})
      id: resolve-rev
      shell: bash
      run: |
        set -euo pipefail
        mode="${{ inputs.mode }}"
        if [ "$mode" = "full" ]; then
          # full/nightly mode: resolve the latest published mainline release
          # (research D2 — catches upstream drift early; never a pinned ref).
          rev="$(curl -fsSL https://pypi.org/pypi/spec-kitty-events/json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')"
        elif [ "$mode" = "pr" ]; then
          # pr mode: the recorded pinned-events-rev — deterministic, cache-hit,
          # charter Shared-Package pinned-rev policy (never a moving ref).
          rev="${{ inputs.pinned-events-rev }}"
        else
          echo "::error::warmup: unknown mode '$mode' (expected 'pr' or 'full')"
          exit 64
        fi
        echo "resolved-events-rev=$rev" >> "$GITHUB_OUTPUT"

    - name: Compute warmup cache key
      id: cache-key
      shell: bash
      run: |
        set -euo pipefail
        # data-model E8: cache key = hash(uv.lock + resolved spec_kitty_events rev),
        # deterministic per (lockfile, rev) — reused via actions/cache below, not
        # a generic build-artifact upload (research D2). `mode` is part of the key
        # because the two modes build DIFFERENT environments (pr: a frozen
        # install; full: an upgrade-package install); when the resolved rev
        # coincides (latest published == pinned) a mode-less key would let a
        # pr-built frozen env satisfy a full run and skip the upstream-drift
        # resolution that full mode exists to run.
        lock_hash="$(sha256sum uv.lock | cut -d ' ' -f1)"
        echo "key=warmup-venv-${{ inputs.mode }}-${lock_hash}-${{ steps.resolve-rev.outputs.resolved-events-rev }}" >> "$GITHUB_OUTPUT"

    - name: Restore cached environment
      id: restore-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: ${{ steps.cache-key.outputs.key }}

    - name: Build the editable environment once
      id: build-env
      shell: bash
      run: |
        set -euo pipefail
        # #3283: exactly one build per (lockfile, rev) — a valid cache hit skips
        # the install so downstream shards reuse the artefact. BUT a cached
        # `.venv` is not self-contained: `uv` builds it with `.venv/bin/python`
        # as a SYMLINK to a uv-managed interpreter that lives OUTSIDE `.venv`
        # (and so is not in this cache). On a cache-hit runner that never ran the
        # interpreter download, that symlink dangles and every `.venv/bin/python`
        # invocation dies with "No such file or directory" (exit 127). So keep
        # the fast-path only when the restored interpreter actually works;
        # otherwise fall through and (re)build — the setup-uv + `.venv` caches
        # keep that near-instant.
        if [ "${{ steps.restore-cache.outputs.cache-hit }}" = "true" ] \
            && [ -x .venv/bin/python ] \
            && .venv/bin/python -c "import sys" >/dev/null 2>&1; then
          echo "warmup: cache hit and .venv interpreter is valid — reusing (#3283)."
          exit 0
        fi
        echo "warmup: building the environment (cache miss, or the restored .venv interpreter symlink is dangling)."
        mode="${{ inputs.mode }}"
        if [ "$mode" = "full" ]; then
          uv sync --all-extras --upgrade-package "spec-kitty-events==${{ steps.resolve-rev.outputs.resolved-events-rev }}"
        else
          uv sync --frozen --all-extras
        fi

    - name: Expose the built environment for downstream reuse
      id: expose-env
      shell: bash
      run: echo "venv-path=$(pwd)/.venv" >> "$GITHUB_OUTPUT"
