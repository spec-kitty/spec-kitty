# Module tests (shard) — reusable workflow.
#
# Mission ci-pipeline-reinstatement-01M1X35E, WP09 (FR-001/006/008).
#
# One reusable `workflow_call` shard, matrixed by the caller
# (ci-modules.yml) over the WP08-committed module registry
# (.github/ci-module-registry.yml) — adding a module is a registry row, never
# a new workflow file (bounded reusable-workflow fan-out, <=20/caller
# ceiling; contract contracts/router-two-authority.md §"Module shard
# registry"). Each shard:
#   * consumes the WP04 warmup composite (.github/actions/warmup) exactly
#     once — no per-shard re-install (the #3283 kill in practice, T050);
#   * selects its slice of the module's tests via greedy LPT
#     (longest-processing-time-first) bin-packing — the SAME algorithm the
#     registry used to size shard_count
#     (tests/architectural/test_module_shard_registry.py::_lpt_bin_pack) —
#     never round-robin or alphabetical;
#   * runs pytest with dotted `--cov=<target>` flags (never the path form)
#     covering the FULL top-level package set derived from `src/` — not just
#     the row's own `cov_target` (mission
#     sonar-per-pr-coverage-reuse-01M2FR32, WP01/FR-013: a narrow `--cov`
#     DROPS, rather than zero-records, every line a slice executes outside its
#     own package) — and emits coverage/xunit under
#     contracts/artefact-naming.md (forward-ref WP10, which dedups per-shard
#     artefacts by basename).
#
# `mode` (pr|full) is honored in THIS workflow's own run step: pr mode fails
# fast on the first red test; full mode continues past failures so every
# shard still uploads its coverage/xunit artefacts (if: always()) for
# aggregation (FR-018/FR-019, T049). The cross-cutting dual-mode contract
# test (test_dual_mode_contract) and dispatched-run evidence are WP11's.

on:
  workflow_call:
    inputs:
      module:
        description: 'Registry module name (ci-module-registry.yml modules[].module).'
        required: true
        type: string
      roots:
        description: "JSON array of the module's src/** globs (registry modules[].roots) — carried through for traceability/logging; the test-selection step below resolves the mirrored tests/<module> directory (or the registry row's explicit test_dirs, when provided)."
        required: true
        type: string
      cov_target:
        description: "JSON array of dotted coverage targets (registry modules[].cov_targets). OWNERSHIP DECLARATION ONLY — since mission sonar-per-pr-coverage-reuse-01M2FR32 (WP01, FR-013) every shard measures the full top-level package set derived from src/, so this input is logged for traceability and read by the registry gates, but no longer decides what this workflow measures."
        required: true
        type: string
      tier:
        description: 'Registry tier (registry modules[].tier).'
        required: true
        type: string
      shard:
        description: 'This shard as "<1-based index>/<total>"; total = registry modules[].shard_count.'
        required: true
        type: string
      mode:
        description: 'pr (fail-fast) or full (run-all, if: always()). Defaults to pr.'
        required: false
        type: string
        default: pr
      test_dirs:
        description: 'JSON array of explicit tests/** directories (registry modules[].test_dirs), for modules whose tests span more than the mirrored tests/<module> directory (AGGREGATE modules like core_misc/execution_context; dual-tree modules like dashboard/charter). Optional — an empty array or omitted input falls back to the tests/{module} mirror.'
        required: false
        type: string
        default: '[]'
  workflow_dispatch:
    inputs:
      module:
        description: 'Registry module name to re-run a single shard for.'
        required: true
        type: string
      roots:
        description: "JSON array of the module's src/** globs."
        required: true
        type: string
      cov_target:
        description: 'JSON array of dotted coverage targets (ownership declaration only; the measured set is derived from src/ — see the workflow_call input above).'
        required: true
        type: string
      tier:
        description: 'Registry tier.'
        required: true
        type: string
      shard:
        description: 'Shard as "<index>/<total>".'
        required: true
        type: string
      mode:
        description: 'pr or full.'
        required: false
        type: string
        default: pr
      test_dirs:
        description: 'JSON array of explicit tests/** directories (registry modules[].test_dirs). Optional.'
        required: false
        type: string
        default: '[]'

jobs:
  test:
    name: "module-tests (${{ inputs.module }} shard ${{ inputs.shard }})"
    runs-on: ubuntu-24.04
    # #4429: ceiling re-base on observed shard durations — the charter shard's
    # green baseline runs 24-26m (runs 34926712832 / 34924060312), and the
    # charter-heavy head 06fe4cfd grew past that into the 30m ceiling (killed
    # at 30:04m, reported as 'cancelled', wedging the PR on a stale
    # `[ci] running` verdict). The #4207 fix re-based the router cli/e2e
    # shard ceilings on observed max + headroom but left this workflow's
    # uniform 30m untouched. 40m covers the observed charter ceiling plus
    # headroom for charter test-mass growth, one ceiling for every registry
    # module's shards.
    timeout-minutes: 40
    steps:
      # A local composite action (./.github/actions/warmup) can only be resolved
      # once the repository is on disk — GitHub loads its action.yml from the
      # caller's checkout before the action's own steps run. Without this the job
      # fails immediately: "Can't find 'action.yml' ... under .github/actions/warmup".
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history: some module tests (e.g. tests/upgrade's mission-corpus
          # recovery suite) `git archive` historical mission SHAs, which a shallow
          # (fetch-depth 1) checkout does not contain — they error at setup with
          # `git archive <sha> ... exit 128` otherwise.
          fetch-depth: 0
      - name: Warm up shared test environment
        id: warmup
        uses: ./.github/actions/warmup
        with:
          mode: ${{ inputs.mode }}

      - name: Compute shard identifiers
        id: shard-info
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          MODULE: ${{ inputs.module }}
          ROOTS: ${{ inputs.roots }}
          COV_TARGET: ${{ inputs.cov_target }}
        run: |
          set -euo pipefail
          shard="$SHARD"
          idx="${shard%%/*}"
          total="${shard##*/}"
          slug="${idx}-of-${total}"
          {
            echo "idx=$idx"
            echo "total=$total"
            echo "slug=$slug"
          } >> "$GITHUB_OUTPUT"
          echo "module-tests: roots for $MODULE = $ROOTS"
          # Ownership declaration, logged for traceability only — the pytest
          # step measures the full top-level package set regardless (WP01,
          # mission sonar-per-pr-coverage-reuse-01M2FR32). Read from env: like
          # every other value here, per the #4355 interpolation hardening.
          echo "module-tests: declared cov_target (ownership record, not the measured set) for $MODULE = $COV_TARGET"

      - name: Select this shard's tests (greedy-LPT bin-packing over the registry shard structure)
        id: select
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          TEST_DIRS: ${{ inputs.test_dirs }}
        run: |
          set -euo pipefail
          venv_python="${{ steps.warmup.outputs.venv-path }}/bin/python"
          module="$MODULE"
          idx="${{ steps.shard-info.outputs.idx }}"
          total="${{ steps.shard-info.outputs.total }}"
          registry_test_dirs="$TEST_DIRS"

          "$venv_python" - "$module" "$idx" "$total" "$venv_python" "$registry_test_dirs" <<'PY'
          import json
          import os
          import subprocess
          import sys

          module, idx, total, venv_python, registry_test_dirs_json = sys.argv[1:6]
          idx, total = int(idx), int(total)

          # Modules whose tests span more than the mirrored tests/<module>
          # directory (AGGREGATE modules like core_misc/execution_context, and
          # dual-tree modules like dashboard/charter) declare an explicit
          # test_dirs list in the registry instead. Prefer it when present;
          # fall back to the tests/{module} mirror for every other module,
          # unchanged.
          registry_test_dirs = [d for d in (json.loads(registry_test_dirs_json) if registry_test_dirs_json else []) if os.path.isdir(d)]
          if registry_test_dirs:
              test_dirs = registry_test_dirs
          else:
              test_dir = f"tests/{module}"
              test_dirs = [test_dir] if os.path.isdir(test_dir) else []
          if not test_dirs:
              print(f"::error::module-tests: no test directory found for module {module!r} (looked for tests/{module} or the registry's test_dirs)")
              sys.exit(64)

          # Deselect the performance AND stress flows: `-m "not performance and
          # not stress"` keeps the wall-clock/benchmark budget guards and the
          # concurrency/load stress suite (both of which belong to ci-nightly's
          # dedicated `-m performance` / `-m stress` lanes) out of the module
          # slice, in BOTH pr and full mode — the nightly full-module-matrix is
          # not the home for either cadence. Each shard runs SERIALLY
          # (parallelism is ACROSS shards via the matrix, not within a shard —
          # the suite is not intra-shard xdist-safe: some tests, e.g. the
          # tool_surface plugin-bundle builds, crash an xdist worker; the stress
          # suite spawns its own threads and races coverage's per-thread trace
          # installation when co-scheduled). The aggregate shards are kept inside
          # the serial time budget by the de-duplicated, non-overlapping registry
          # test_dirs instead.
          collected = subprocess.run(
              [venv_python, "-m", "pytest", *test_dirs, "-m", "not performance and not stress", "--collect-only", "-q"],
              capture_output=True,
              text=True,
              check=True,
          )
          node_ids = [line for line in collected.stdout.splitlines() if "::" in line]
          if not node_ids:
              print(f"::error::module-tests: pytest collected zero tests for module {module!r} under {test_dirs!r}")
              sys.exit(64)

          # Greedy LPT (longest-processing-time-first) bin-packing -- the SAME
          # algorithm the WP08 registry used to size shard_count
          # (tests/architectural/test_module_shard_registry.py::_lpt_bin_pack),
          # never round-robin or alphabetical (WP09 caveat B). The registry's
          # ci-shard-timings.json records per-test durations but drops nodeids
          # for compactness, so they cannot be joined by identity; when the
          # collected test count matches the measured count we pair them
          # positionally (both come from a stable pytest collection order) as
          # the best available duration signal, falling back to uniform
          # weights -- still genuine greedy-LPT bin-packing, never a different
          # split scheme -- when the suite has drifted since the measurement
          # pass.
          durations: list[float] = []
          try:
              with open(".github/ci-shard-timings.json", encoding="utf-8") as fh:
                  timings = json.load(fh)
              durations = list(timings.get("module_test_durations", {}).get(module, []))
          except FileNotFoundError:
              durations = []
          if len(durations) != len(node_ids):
              durations = [1.0] * len(node_ids)

          paired = sorted(zip(node_ids, durations), key=lambda pair: pair[1], reverse=True)
          bins: list[list[str]] = [[] for _ in range(total)]
          loads = [0.0] * total
          for node_id, duration in paired:
              least_loaded = min(range(total), key=lambda k: loads[k])
              bins[least_loaded].append(node_id)
              loads[least_loaded] += duration

          selected = bins[idx - 1]
          with open("shard_tests.txt", "w", encoding="utf-8") as out:
              out.write("\n".join(selected))
          print(f"module-tests: selected {len(selected)}/{len(node_ids)} tests for {module} shard {idx}/{total}")
          PY

      - name: Run pytest for this shard
        id: pytest-run
        shell: bash
        env:
          TIER: ${{ inputs.tier }}
          MODULE: ${{ inputs.module }}
          MODE: ${{ inputs.mode }}
          COV_TARGET: ${{ inputs.cov_target }}
        run: |
          set -euo pipefail
          venv_python="${{ steps.warmup.outputs.venv-path }}/bin/python"
          tier="$TIER"
          mod="$MODULE"
          slug="${{ steps.shard-info.outputs.slug }}"
          mode="$MODE"
          run_id="${{ github.run_id }}"

          mkdir -p out/reports/coverage out/reports/xunit-reports

          # ---------------------------------------------------------------
          # Coverage breadth — mission sonar-per-pr-coverage-reuse-01M2FR32,
          # WP01 (FR-013/NFR-009). READ BEFORE "FIXING" THIS BACK.
          #
          # Every shard measures the FULL top-level package set, NOT this
          # row's `inputs.cov_target`. A narrow per-module `--cov` does not
          # record another package's executed lines as zero — coverage.py
          # DROPS the measurement, so the line is `absent` from the report.
          # Slices routinely execute code outside the package their module is
          # named for, and every one of those hits used to be discarded before
          # it reached the reconciled union: the matrix recorded 71,070 of the
          # 128,878-statement union (55.15%) against 42,933 (33.31%) for the
          # single broad step this mission retires, with 4,391 statements
          # covered by that step and by no slice at all.
          #
          # `inputs.cov_target` is deliberately still an input: it is the
          # registry row's OWNERSHIP declaration
          # (.github/ci-module-registry.yml, consumed verbatim by
          # tests/architectural/test_module_shard_registry.py) and is echoed
          # for traceability in "Compute shard identifiers". It declares who
          # owns what; it must not decide what a slice MEASURES.
          #
          # The set is derived from the source tree at run time — top-level
          # packages plus public top-level single-file modules under src/ —
          # never transcribed, so a new top-level package is measured without
          # editing this workflow. Pinned by
          # tests/architectural/test_coverage_breadth.py.
          # ---------------------------------------------------------------
          cov_targets="$("$venv_python" - <<'COV_PY'
          import pathlib

          src = pathlib.Path("src")
          targets = {
              entry.name if entry.is_dir() else entry.stem
              for entry in src.iterdir()
              if (entry.is_dir() and (entry / "__init__.py").is_file())
              or (entry.is_file() and entry.suffix == ".py" and not entry.name.startswith("_"))
          }
          if not targets:
              raise SystemExit("module-tests: no top-level coverage targets found under src/")
          print("\n".join(sorted(targets)))
          COV_PY
          )"

          cov_args=()
          while IFS= read -r target; do
            [ -n "$target" ] && cov_args+=("--cov=$target")
          done <<< "$cov_targets"
          if [ "${#cov_args[@]}" -eq 0 ]; then
            echo "::error::module-tests: derived an empty coverage-target set from src/"
            exit 64
          fi
          echo "module-tests: measuring ${cov_args[*]}"

          coverage_xml="out/reports/coverage/coverage-${tier}-${mod}-shard${slug}.xml"
          xunit_xml="out/reports/xunit-reports/xunit-result-${mod}-shard${slug}-${run_id}.xml"

          mapfile -t shard_tests < shard_tests.txt

          set +e
          "$venv_python" -m pytest "${shard_tests[@]}" \
            -m "not performance and not stress" \
            "${cov_args[@]}" --cov-report="xml:${coverage_xml}" \
            --junitxml="${xunit_xml}" \
            -q
          status=$?
          set -e

          if [ "$mode" = "full" ]; then
            # full mode: run-all, never short-circuit the aggregation run --
            # this shard's failure is surfaced but does not abort the step.
            if [ "$status" -ne 0 ]; then
              echo "::warning::module-tests: shard ${mod} ${slug} failed in full mode (if: always() aggregation continues)"
            fi
          else
            # pr mode: fail-fast -- propagate this shard's exit status.
            exit "$status"
          fi

      - name: Upload coverage + xunit artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "module-tests-${{ inputs.module }}-shard-${{ steps.shard-info.outputs.slug }}-attempt-${{ github.run_attempt }}-reports"
          path: out/reports/
