          python3 scripts/ci/nightly_escalation.py --suite-key "interpreter-3.13-shard-5" --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-interpreter-3.13-shard-5.xml

      - name: Fail the leg if this shard's suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key interpreter-3.13-shard-5 --xunit out/reports/xunit-nightly-interpreter-3.13-shard-5.xml --log-step 'Run fast/unit suite, shard 5 (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${INTERPRETER_SHARD_5_EXIT:-1}" -ne 0 ] && [ "${INTERPRETER_SHARD_5_EXIT:-1}" -ne 5 ]; then
            echo "::error::interpreter 3.13 shard 5 suite exited ${INTERPRETER_SHARD_5_EXIT}"
            exit 1
          fi
          echo "Interpreter 3.13 shard 5 suite passed (exit 0 or a marker-empty exit 5)."

  # Shard 6/6.
  interpreter-matrix-shard-6:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: "Interpreter matrix shard 6 (Python 3.13, nightly-only, FR-021)"
    runs-on: ubuntu-24.04
    # headroom (#5378): max-suite=7:26 runs=36300726806,36393904544,36482214935,36517786727,36553997695 formula=ceil((max+0:30)*1.5)
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      UV_PROJECT_ENVIRONMENT: .venv-py3.13
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.13
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment on this interpreter
        shell: bash
        run: uv sync --frozen --all-extras --python "3.13"

      - name: Run fast/unit suite, shard 6 (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen --python "3.13" --all-extras pytest -m "fast or unit" tests/agent tests/ci tests/coordination tests/cross_cutting tests/decisions tests/init tests/mission_runtime tests/next tests/paths tests/prompts tests/readiness tests/regressions tests/specify_cli/audit tests/specify_cli/bootstrap tests/specify_cli/context tests/specify_cli/distribution tests/specify_cli/drg_writers tests/specify_cli/identity tests/specify_cli/lanes tests/specify_cli/next tests/specify_cli/regression tests/specify_cli/session_presence tests/specify_cli/status tests/specify_cli/test_acceptable_ending.py tests/specify_cli/test_acceptance_needs_clarification.py tests/specify_cli/test_canonical_acceptance.py tests/specify_cli/test_charter_list.py tests/specify_cli/test_cli tests/specify_cli/test_codebase_sweep.py tests/specify_cli/test_configured_command.py tests/specify_cli/test_documentation_drg_nodes.py tests/specify_cli/test_intake_sources.py tests/specify_cli/test_intake_sources_hardening.py tests/specify_cli/test_lane_regression_guard.py tests/specify_cli/test_meta_fail_closed_degradation_paths.py tests/specify_cli/test_no_checklist_surface.py tests/specify_cli/test_profile_context_migration.py tests/specify_cli/test_runtime_hard_fail.py tests/specify_cli/test_state_doctor.py tests/specify_cli/test_workspace_context_tombstone.py tests/specify_cli/workspace tests/state tests/upgrade tests/zeitgeist_client -q -n auto --dist loadfile --junitxml="out/reports/xunit-nightly-interpreter-3.13-shard-6.xml"
          code=$?
          echo "INTERPRETER_SHARD_6_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::interpreter 3.13 shard 6 suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload interpreter-matrix shard 6 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "ci-nightly-interpreter-3.13-shard-6-reports"
          path: out/reports/

      - name: Escalate interpreter 3.13 shard 6 red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${INTERPRETER_SHARD_6_EXIT:-1}" -ne 0 ] && [ "${INTERPRETER_SHARD_6_EXIT:-1}" -ne 5 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key "interpreter-3.13-shard-6" --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-interpreter-3.13-shard-6.xml

      - name: Fail the leg if this shard's suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key interpreter-3.13-shard-6 --xunit out/reports/xunit-nightly-interpreter-3.13-shard-6.xml --log-step 'Run fast/unit suite, shard 6 (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${INTERPRETER_SHARD_6_EXIT:-1}" -ne 0 ] && [ "${INTERPRETER_SHARD_6_EXIT:-1}" -ne 5 ]; then
            echo "::error::interpreter 3.13 shard 6 suite exited ${INTERPRETER_SHARD_6_EXIT}"
            exit 1
          fi
          echo "Interpreter 3.13 shard 6 suite passed (exit 0 or a marker-empty exit 5)."

  # ---------------------------------------------------------------------------
  # generate-full-matrix / full-module-matrix: mission ci-modules-diff-scoping
  # -- the cross-module post-merge safety net that REPLACES the old
  # push-always-runs-every-shard behavior now that ci-modules.yml diff-scopes
  # its matrix on both pull_request and push (operator decision). This
  # nightly lane realizes the SAME committed module registry
  # (.github/ci-module-registry.yml) ci-modules.yml reads, unconditionally
  # selecting every module/shard leaf (no diff scoping -- nightly IS the
  # full-mode run), and calls the SAME `module-tests.yml` reusable shard
  # directly with `mode: full`.
  #
  # This does NOT `uses: ./.github/workflows/ci-modules.yml` (a nested
  # multi-job reusable-workflow call): the architectural gate-coverage model's
  # local-`uses:` splicer (tests/architectural/_gate_coverage.py
  # `_splice_local_uses`) requires a spliced reusable workflow to define
  # EXACTLY ONE job (module-tests.yml qualifies; ci-modules.yml, a 3-job
  # matrix orchestrator, does not) -- so this lane calls `module-tests.yml`
  # directly, exactly as ci-modules.yml's own `test` job does, at the cost of
  # a small, intentional duplication of the matrix-generation shape (never
  # the module list itself, which both read from the one committed registry).
  # ---------------------------------------------------------------------------
  generate-full-matrix:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Generate full module-shard matrix (nightly-only)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install PyYAML (matrix-generation only, no editable install needed)
        shell: bash
        run: |
          pip install --quiet --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"

      - name: Build the full matrix from the committed module registry (every module, every shard)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          import yaml

          with open(".github/ci-module-registry.yml", encoding="utf-8") as fh:
              registry = yaml.safe_load(fh)

          leaves = []
          for row in registry["modules"]:
              module = row["module"]
              shard_count = row["shard_count"]
              for idx in range(1, shard_count + 1):
                  leaves.append(
                      {
                          "module": module,
                          "roots": json.dumps(row["roots"]),
                          "cov_target": json.dumps(row["cov_targets"]),
                          "tier": row["tier"],
                          "shard": f"{idx}/{shard_count}",
                          "mode": "full",
                          "test_dirs": json.dumps(row.get("test_dirs", [])),
                      }
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(leaves)}\n")

          print(f"ci-nightly: generated {len(leaves)} shard leaves across {len(registry['modules'])} registry modules (full mode, every module selected)")
          PY

  full-module-matrix:
    name: "module-tests (${{ matrix.module }} shard ${{ matrix.shard }}) [nightly full]"
    needs: generate-full-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-full-matrix.outputs.matrix) }}
    uses: ./.github/workflows/module-tests.yml
    with:
      module: ${{ matrix.module }}
      roots: ${{ matrix.roots }}
      cov_target: ${{ matrix.cov_target }}
      tier: ${{ matrix.tier }}
      shard: ${{ matrix.shard }}
      mode: ${{ matrix.mode }}
      test_dirs: ${{ matrix.test_dirs }}

  # ---------------------------------------------------------------------------
  # integration-next: FR-006 / #4729 -- the nightly home for the integration +
  # next behavioral corpus. Replaces the DEAD `integration_tests_next` special
  # tier that ci-module-registry.yml declared but no workflow ever invoked (the
  # #4729 honesty gap, retired in the same change that added this job). That
  # tier declared roots tests/integration/** AND tests/next/**, so BOTH are run
  # here BY DIRECTORY -- not `-m integration`: 843/1015 tests are
  # integration-marked but no nightly marker suite selects them, and
  # tests/next/** carries no such marker at all, so a marker-only lane would
  # silently drop tests/next's 24 files. This is NOT a per-PR modules[] row
  # (C-003 -- that per-PR promotion is the deferred #5037); it is a dedicated
  # nightly lane.
  #
  # Runs its xdist fan-out inside ONE job (`-n auto --dist loadfile`, the
  # retired tier's own `parallel_mode`) rather than being split across separate
  # registry shards. Sizing (NFR-004, measured not guessed): the retired tier
  # recorded 69.2m fully-serial; a `-n auto --dist loadfile` run of the same
  # 1582-test corpus measured ~2m wall on a 32-core host (=> ~64m serial,
  # consistent with the tier's figure) and projects to ~15-20m on a 4-core
  # ubuntu-24.04 runner -- comfortably inside the 45m timeout below, so no
  # cross-job sharding is needed. `--dist loadfile` keeps each file on one
  # worker (file-scoped fixtures / collection semantics); per-worker HOME
  # isolation (WP04, conftest) keeps parallel workers off the real
  # ~/.spec-kitty. Same if: always() + set +e + exit-into-$GITHUB_ENV +
  # terminal fail-loud (#4212) + FR-007 escalation pattern as the suites above.
  # ---------------------------------------------------------------------------
  integration-next:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Integration + next suite (nightly-only, #4729)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # `issues: write` for the FR-007 escalation step below.
    permissions:
      contents: read
      issues: write
    env:
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run integration + next suites by directory (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest tests/integration tests/next -q -n auto --dist loadfile --junitxml=out/reports/xunit-nightly-integration-next.xml
          code=$?
          echo "INTEGRATION_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::integration+next suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly integration+next reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-integration-next-reports
          path: out/reports/

      # Nightly red -> deduped-P0 escalation (FR-007): mirror of the suites
      # above, scoped to the `integration` suite key. Fail-closed, if: always().
      #
      # FIND-2 (#5034): unlike the marker-based lanes above (performance/e2e/
      # stress/interpreter, each `-m <marker>`), this job runs
      # `pytest tests/integration tests/next` BY DIRECTORY. A pytest exit 5
      # here means the corpus vanished or was fully deselected -- never a
      # legitimate marker-empty skip -- so exit 5 is NOT exempted from
      # failure for this job (every `modules[]` lane in module-tests.yml
      # already fails closed on zero-collected the same way, ~L216-218,
      # `sys.exit(64)`; this job is the one directory-based nightly lane that
      # had been missing that floor). The `:-1` default (FIND-1) still
      # applies: an unset/timeout-killed INTEGRATION_EXIT also fails closed.
      - name: Escalate integration+next red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${INTEGRATION_EXIT:-1}" -ne 0 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key integration --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-integration-next.xml

      # Terminal fail-loud gate (#4212): mirror of the performance job's gate,
      # scoped to this suite/exit -- EXCEPT this directory-based lane does not
      # exempt exit 5 (FIND-2, #5034; see the escalation step's comment above
      # for why). Only exit 0 (all passed) passes; any nonzero exit, including
      # 5 (zero collected) and an unset/timeout-killed exit (`:-1`, FIND-1),
      # fails the job.
      - name: Fail the job if the integration+next suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key integration --xunit out/reports/xunit-nightly-integration-next.xml --log-step 'Run integration + next suites by directory (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${INTEGRATION_EXIT:-1}" -ne 0 ]; then
            echo "::error::integration+next suite exited ${INTEGRATION_EXIT} (a zero-collected exit 5 counts as failure for this directory-based lane, not a legitimate skip)"
            exit 1
          fi
          echo "integration+next suite passed (exit 0)."

  # ---------------------------------------------------------------------------
  # specify-cli-out-of-matrix (#5201): the tests/specify_cli/** trees that
  # .github/ci-module-registry.yml records under out_of_matrix_test_dirs
  # (deferred-promotion #4732, lift-invariant, secondary-tree dispositions)
  # had no lane that reaches a verdict: full-module-matrix above expands only
  # modules[] rows, and the interpreter-matrix lane -- before #4951 split it
  # into the interpreter-matrix-shard-<N> jobs above, which dispatch run
  # 36300726806 validated as completing within their per-shard timeouts --
  # was cancelled by its cap every night. Deterministic reds there (#4916)
  # therefore never reddened main. This job runs tests/specify_cli BY
  # DIRECTORY, minus every subdir a modules[] row already claims via
  # test_dirs -- computed from the registry at run time, so a #4732 promotion
  # drops its tree from this lane automatically and nothing double-runs
  # AGAINST full-module-matrix (landing pass #5244, LAND-ARCH-002: this
  # lane's tests/specify_cli trees DO also run, deliberately, inside the
  # interpreter-matrix-shard-<N> jobs' "fast or unit" selection on a SECOND
  # interpreter, 3.13 -- an intentional complementary-interpreter overlap,
  # not the double-run this sentence forbids). An interpreter-agnostic red in
  # that overlap therefore opens two standing P0s, one per suite key
  # (interpreter-3.13-shard-N and specify-cli-out-of-matrix) -- by design,
  # since escalation dedup is per suite key (LAND-ARCH-001).
  # `stress`/`timing` are deselected: both are parallel-unsafe and have their
  # own serial homes (the stress job above; make test-full's -n0 timing pass).
  # Same if: always() + set +e + exit-into-$GITHUB_ENV + terminal fail-loud
  # (#4212) + FR-007 escalation pattern as integration-next, including its
  # zero-collected floor (a directory lane never exempts exit 5, FIND-2 #5034).
  # ---------------------------------------------------------------------------
  specify-cli-out-of-matrix:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: specify_cli out-of-matrix trees (nightly-only, #5201)
    runs-on: ubuntu-24.04
    # headroom (#5378): max-suite>=45:01 runs=36300726806,36393904544,36482214935,36517786727,36553997695 formula=ceil((max+0:30)*1.5)
    timeout-minutes: 69
    # `issues: write` for the FR-007 escalation step below.
    permissions:
      contents: read
      issues: write
    env:
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run out-of-matrix tests/specify_cli trees by directory (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          mapfile -t ignores < <(uv run --frozen python - <<'PY'
          import yaml

          with open(".github/ci-module-registry.yml", encoding="utf-8") as fh:
              registry = yaml.safe_load(fh)
          claimed = {d for row in registry["modules"] for d in row.get("test_dirs", []) if d.startswith("tests/specify_cli/")}
          for directory in sorted(claimed):
              print(f"--ignore={directory}")
          PY
          )
          echo "::notice::ignoring ${#ignores[@]} registry-claimed tests/specify_cli subdirs: ${ignores[*]}"
          uv run --frozen pytest tests/specify_cli "${ignores[@]}" -m "not stress and not timing" -q -n auto --dist loadfile --junitxml=out/reports/xunit-nightly-specify-cli-out-of-matrix.xml
          code=$?
          echo "SPECIFY_CLI_OOM_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::specify_cli out-of-matrix suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly specify_cli out-of-matrix reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-specify-cli-out-of-matrix-reports
          path: out/reports/

      # Nightly red -> deduped-P0 escalation (FR-007), scoped to the
      # `specify-cli-out-of-matrix` suite key. Fail-closed, if: always(); the
      # `:-1` default (FIND-1) treats an unset/timeout-killed exit as failure.
      - name: Escalate specify_cli out-of-matrix red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${SPECIFY_CLI_OOM_EXIT:-1}" -ne 0 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key specify-cli-out-of-matrix --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-specify-cli-out-of-matrix.xml

      # Terminal fail-loud gate (#4212): only exit 0 passes. Exit 5 (zero
      # collected) and an unset/timeout-killed exit (`:-1`) both fail -- this
      # is a directory lane (FIND-2, #5034).
      - name: Fail the job if the specify_cli out-of-matrix suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key specify-cli-out-of-matrix --xunit out/reports/xunit-nightly-specify-cli-out-of-matrix.xml --log-step 'Run out-of-matrix tests/specify_cli trees by directory (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${SPECIFY_CLI_OOM_EXIT:-1}" -ne 0 ]; then
            echo "::error::specify_cli out-of-matrix suite exited ${SPECIFY_CLI_OOM_EXIT} (a zero-collected exit 5 counts as failure for this directory-based lane, not a legitimate skip)"
            exit 1
          fi
          echo "specify_cli out-of-matrix suite passed (exit 0)."

  # ---------------------------------------------------------------------------
  # architectural-backstop (#5510, FR-001, SC-003; folds #3265): the nightly runs
  # the FULL per-PR architectural battery base, so a green nightly really means
  # the whole battery ran. Before this job the nightly reached the battery only
  # through interpreter-matrix-shard-3's `-m "fast or unit"` selection (Python
  # 3.13), roughly a fifth of it; ADR 2026-09-26-1 and the by-design closure of
  # #5302 both assume a full nightly backstop.
  #
  # Plugin-free on purpose (D-04): no `--battery-part`, no partition plugin, so
  # if the partition machinery or the gate selector ever dropped a file, this
  # plain base run still executes it. The command is the `architectural-heavy`
  # base command of ci-router.yml (same path, marker and deselects); its parity
  # is pinned by tests/ci/test_nightly_architectural_backstop.py, and the
  # fast + S1 + S2 = base half is the partition proof's job. The python-version
  # pin is the per-PR battery interpreter (interpreter diversity stays with the
  # interpreter shards, D-14). It is deliberately NOT a registry key (D-26).
  #
  # `-n 4` and no `-q` so xdist prints `created: 4/4 workers` (FR-002 evidence).
  # Same if: always() + set +e + exit-into-$GITHUB_ENV + terminal fail-loud
  # (#4212) + FR-007 escalation pattern as the other directory lanes, including
  # no exit-5 exemption. No continue-on-error anywhere: a red backstop fails the
  # run conclusion, which scripts/ci/release_nightly_gate.py reads for the
  # release SHA, so the release gate needs no extra wiring (T017).
  #
  # Its junit report is the per-file timings refresh source for the battery
  # partition (D-29/D-36: the seed comes from census logs, junit capture via
  # `--from-junit` is the refresh path).
  # ---------------------------------------------------------------------------
  architectural-backstop:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Architectural battery backstop (nightly-only, #5510)
    runs-on: ubuntu-24.04
    # headroom (#5378): max-suite>=25:09 runs=census-2026-09-30 formula=ceil((max+0:30)*1.5)
    timeout-minutes: 40
    # `issues: write` for the FR-007 escalation step below.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history: several architectural recovery/receipt tests
          # `git archive` historical mission SHAs, which a shallow checkout
          # does not contain (same reason as the per-PR battery job).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run the full architectural battery base (no partition, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen python -m pytest tests/architectural \
            -m "not performance and not stress and not timing" \
            -n 4 --dist loadfile \
            --deselect tests/architectural/test_no_legacy_terminology.py \
            --deselect tests/architectural/test_layer_rules.py \
            --deselect tests/architectural/test_pyproject_shape.py \
            --deselect tests/architectural/test_archive_root_byte_identical.py \
            --junitxml=out/reports/xunit-nightly-architectural.xml
          code=$?
          echo "ARCH_BACKSTOP_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::architectural backstop exit=$code (full base, no partition; if: always() -- a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly architectural backstop reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-architectural-backstop-reports
          path: out/reports/

      # Nightly red -> deduped-P0 escalation (FR-007), scoped to the
      # `architectural` suite key. Fail-closed, if: always(); the `:-1` default
      # (FIND-1) treats an unset/timeout-killed exit as failure.
      - name: Escalate architectural backstop red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${ARCH_BACKSTOP_EXIT:-1}" -ne 0 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key architectural --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-architectural.xml

      # Terminal fail-loud gate (#4212): only exit 0 passes. Exit 5 (zero
      # collected) and an unset/timeout-killed exit (`:-1`) both fail -- this
      # is a directory lane (FIND-2, #5034).
      - name: Fail the job if the architectural backstop was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key architectural --xunit out/reports/xunit-nightly-architectural.xml --log-step 'Run the full architectural battery base (no partition, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${ARCH_BACKSTOP_EXIT:-1}" -ne 0 ]; then
            echo "::error::architectural backstop exited ${ARCH_BACKSTOP_EXIT} (a zero-collected exit 5 counts as failure for this directory-based lane, not a legitimate skip)"
            exit 1
          fi
          echo "architectural backstop passed (exit 0)."

  # ---------------------------------------------------------------------------
  # integration-slice: integration-marked tests no other nightly lane selects.
  #
  # module-tests.yml's pytest line has no static paths (the file list is
  # shard_tests.txt), so a marker-only reading claims the whole tree. The
  # registry's test_dirs do not. Interpreter shards list many of the leftover
  # directories under `-m "fast or unit"` only. tests/characterization/
  # test_trio_json_envelope.py is the floor: integration + git_repo, not fast
  # or unit, not a module test_dir. This job runs the selector's list. It does
  # not replace integration-next: that lane stays `pytest tests/integration
  # tests/next` BY DIRECTORY, because `-m integration` would drop tests/next's
  # unmarked files.
  #
  # Empty selector output is exit 5 and FAILS the job. A marker-empty skip is
  # the signal being lost, not a legitimate "nothing to run" (FIND-2's
  # exemption is for suites whose marker can honestly match nothing).
  # ---------------------------------------------------------------------------
  integration-slice:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Integration marker slice (nightly-only)
    runs-on: ubuntu-24.04
    # First-run ceiling. Recalibrate with a `# headroom (#5378)` comment once
    # a scheduled run records the suite step's wall clock. The selector's
    # current list is on the order of 150 modules, not a measured duration.
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    env:
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history: tests/upgrade/test_mission_corpus_recovery.py
          # `git archive`s pinned historical mission SHAs (e.g. c0054153b9bc),
          # which a shallow checkout does not contain (same reason as the
          # architectural job above and the per-PR battery job).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run integration-marked tests no other nightly lane selects
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen python -m scripts.ci.integration_slice > "$RUNNER_TEMP/integration-slice.txt"
          select_code=$?
          if [ "$select_code" -ne 0 ]; then
            echo "INTEGRATION_SLICE_EXIT=$select_code" >> "$GITHUB_ENV"
            echo "::error::integration slice selector exited $select_code"
          else
            mapfile -t files < "$RUNNER_TEMP/integration-slice.txt"
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::integration slice selected no files; the marker signal would be lost"
              echo "INTEGRATION_SLICE_EXIT=5" >> "$GITHUB_ENV"
            else
              echo "::notice::integration slice files=${#files[@]}"
              uv run --frozen pytest "${files[@]}" \
                -m "integration and not e2e and not fast and not live_adapter and not performance and not quarantine and not stress and not timing and not unit and not windows_ci" \
                -q -n auto --dist loadfile \
                --junitxml=out/reports/xunit-nightly-integration-slice.xml
              code=$?
              echo "INTEGRATION_SLICE_EXIT=$code" >> "$GITHUB_ENV"
              echo "::notice::integration slice exit=$code"
            fi
          fi

      - name: Upload nightly integration-slice reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-integration-slice-reports
          path: out/reports/

      - name: Escalate integration-slice red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${INTEGRATION_SLICE_EXIT:-1}" -ne 0 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key integration-slice --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-integration-slice.xml

      - name: Fail the job if the integration slice was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key integration-slice --xunit out/reports/xunit-nightly-integration-slice.xml --log-step 'Run integration-marked tests no other nightly lane selects' || echo "::warning::nightly xunit summary helper failed"
          if [ "${INTEGRATION_SLICE_EXIT:-1}" -ne 0 ]; then
            echo "::error::integration slice exited ${INTEGRATION_SLICE_EXIT} (exit 5 is an empty slice, which is a lost signal, not a skip)"
            exit 1
          fi
          echo "integration slice passed (exit 0)."

  # ---------------------------------------------------------------------------
  # universe-equivalence: a stored test universe equals a fresh collection
  # (mission shared-collection-and-shard-recapture, NFR-005).
  #
  # The per-PR consuming jobs trust a stored record keyed on the committed tree
  # and the collecting environment. This job is the standing proof that the key
  # is sufficient: `collect` stores the universe of this checkout, then `compare`
  # collects once more with the store bypassed and diffs the two. Any difference,
  # or no stored record, fails the job directly (no escalation helper, no exit
  # variable: the failure IS the signal, and it reaches nightly-summary through
  # `needs`).
  #
  # timeout-minutes: not measured yet (the job is new). Sized from the stages: one
  # environment sync, plus two collections of roughly two minutes each.
  # ---------------------------------------------------------------------------
  universe-equivalence:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Test-universe reuse equals a fresh collection (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history, same as the other nightly lanes that collect the battery.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Collect and store the test universe
        shell: bash
        env:
          SK_GATE_REUSE_REPORT: ${{ runner.temp }}/universe-reuse.jsonl
        run: uv run --frozen python -m scripts.ci.collect_universe_prestep collect

      - name: Compare the stored universe with a fresh collection
        shell: bash
        run: uv run --frozen python -m scripts.ci.collect_universe_prestep compare

  # ---------------------------------------------------------------------------
  # nightly-summary: terminal `if: always()` aggregator so a scheduled/dispatch
  # run's complete failure set is visible in one place, never short-circuited.
  # ---------------------------------------------------------------------------
  nightly-summary:
    name: Nightly full-mode summary
    runs-on: ubuntu-24.04
    needs: [performance, e2e, stress, p0-repro, interpreter-matrix-shard-1, interpreter-matrix-shard-2, interpreter-matrix-shard-3, interpreter-matrix-shard-4, interpreter-matrix-shard-5, interpreter-matrix-shard-6, integration-next, integration-slice, specify-cli-out-of-matrix, architectural-backstop, full-module-matrix, universe-equivalence]
    if: ${{ (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && always() }}
    steps:
      - name: Report full-mode results (run-all-regardless, never fail-fast)
        shell: bash
        run: |
          echo "performance: ${{ needs.performance.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          echo "stress: ${{ needs.stress.result }}"
          echo "p0-repro: ${{ needs.p0-repro.result }}"
          echo "interpreter-matrix-shard-1: ${{ needs.interpreter-matrix-shard-1.result }}"
          echo "interpreter-matrix-shard-2: ${{ needs.interpreter-matrix-shard-2.result }}"
          echo "interpreter-matrix-shard-3: ${{ needs.interpreter-matrix-shard-3.result }}"
          echo "interpreter-matrix-shard-4: ${{ needs.interpreter-matrix-shard-4.result }}"
          echo "interpreter-matrix-shard-5: ${{ needs.interpreter-matrix-shard-5.result }}"
          echo "interpreter-matrix-shard-6: ${{ needs.interpreter-matrix-shard-6.result }}"
          echo "integration-next: ${{ needs.integration-next.result }}"
          echo "integration-slice: ${{ needs.integration-slice.result }}"
          echo "specify-cli-out-of-matrix: ${{ needs.specify-cli-out-of-matrix.result }}"
          echo "architectural-backstop: ${{ needs.architectural-backstop.result }}"
          echo "full-module-matrix: ${{ needs.full-module-matrix.result }}"
          echo "universe-equivalence: ${{ needs.universe-equivalence.result }}"
