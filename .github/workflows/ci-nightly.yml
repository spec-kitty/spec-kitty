# CI Nightly — full-mode expensive cadence + interpreter lane.
#
# Mission ci-pipeline-reinstatement-01M1X35E, WP13 (FR-020/021; SC-011).
#
# This is the ONLY home for the performance / heavy-e2e / stress test cadence
# (#3595; stress reinstated #4698) and the above-3.12 interpreter matrix
# (FR-021) -- all stay OFF the per-PR blocking path (SC-011: a per-PR run
# executes 0 of these jobs). This
# workflow triggers on `schedule` (nightly) + `workflow_dispatch` ONLY: it
# carries no `pull_request` / `push` trigger, so a PR event can never start
# any job defined here (the structural half of SC-011; the guard in
# tests/architectural/test_performance_marker_guard.py asserts the rest --
# no OTHER pull_request-triggered workflow selects `-m performance` / `-m e2e`
# / an interpreter matrix, and that this file's own shape holds).
#
# `mode` (full|pr) is honored via `workflow_dispatch.inputs.mode`, defaulting
# to `full` -- the OPPOSITE default of the per-PR-triggered lanes
# (ci-modules.yml / ci-router.yml default `pr`) -- because this workflow's
# reason to exist IS the full-mode run-all-regardless cadence (FR-018/019):
# `fail-fast: false` on every matrix strategy plus `if: always()` on every
# step/job that must survive an upstream red, so a nightly run always
# surfaces the COMPLETE failure set rather than short-circuiting on the
# first red job like the PR fail-fast lanes. `mode: pr` remains selectable via
# manual dispatch for a fail-fast diagnostic re-run, but is never the
# scheduled trigger's mode. The cross-cutting dual-mode contract test
# (test_dual_mode_contract) and its dispatched-run evidence are WP11's.
#
# The interpreter-matrix job runs the fast/unit suite on every Python version
# ABOVE 3.12 up to the project's supported ceiling (pyproject.toml
# `Programming Language :: Python :: 3.13` trove classifier) so
# interpreter-divergence defects are visible instead of escaping CI (FR-021).
# This lands the nightly lane only -- the full above-3.12 burn-down across
# every suite is the deferred follow-up #3189 and is explicitly NOT claimed
# by this workflow or this mission (see spec.md FR-021 / issue-matrix).
#
# All `uses:` action references below are SHA-pinned (`@<40-hex> # v<tag>`).

name: CI Nightly

on:
  schedule:
    # 03:17 UTC daily -- off-peak, deliberately not a round hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full (run-all, if: always(), the scheduled default) or pr (fail-fast diagnostic re-run).'
        required: false
        default: full
        type: choice
        options:
          - full
          - pr

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # performance / e2e / stress: split from the former single
  # performance-and-e2e job (#4865) into three INDEPENDENT jobs, each with its
  # own timeout budget and its own verdict, so a genuine regression in one
  # suite is never blended with (or masked by) a different suite's timeout
  # cancellation. Concretely: nightly run 35683539593 (2026-09-20) hit the old
  # shared 60-minute cap, went `cancelled` at 65m01s, and truncated `stress`
  # entirely while `performance`/`e2e` had already passed inside the SAME
  # blended verdict -- a genuine e2e regression on that date would have been
  # indistinguishable from routine timeout cancellation. No `needs:`
  # dependency chain BETWEEN these three jobs -- they run in parallel where
  # runners are available; only `nightly-summary` below depends on all three.
  # The operator explicitly REJECTED merely raising the old job's timeout
  # cap as a half-fix (it would still blend three verdicts into one) -- see
  # spec.md "Binding operator decision #1".
  # ---------------------------------------------------------------------------

  # `performance`: timeout sized from the real measured duration (23m41s, run
  # 35683539593, pre-split blended job) with ~1.5x headroom (plan.md "Real
  # evidence used to size the new budgets"). Confirmed by WP03's first
  # post-split nightly dispatch (run 35756657364, 2026-09-22, mode=full):
  # this job alone measured 23m23s wall-clock -- consistent with the
  # pre-split figure, since `performance` is the one job that legitimately
  # owns SPEC_KITTY_RUN_PERFORMANCE=1 below (see the e2e/stress comments for
  # the 3x duplication this split actually removed from THEIR steps).
  # conftest.py skips `performance`-marked tests unless
  # SPEC_KITTY_RUN_PERFORMANCE=1 (they are cold-start / runner-bound off the
  # per-PR path) -- without this env var the `-m performance` step below
  # selects the suite but conftest skips every test in it, a vacuous lane.
  # PWHEADLESS keeps any UI-touching test headless. Budget kept at 35 (not
  # shrunk): a generous timeout costs nothing unless a job hangs, and this
  # WP's own evidence base is a single dispatch.
  performance:
    name: Performance suite (nightly-only, #3595)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # DO NOT add SPEC_KITTY_RUN_PERFORMANCE to any other job's env in this
      # file (e2e, stress, etc.) -- it is deliberately scoped to THIS job
      # alone. Re-adding it to `stress` re-duplicates the ~20
      # performance-marked tests back into that job (see the `stress` job's
      # `timeout-minutes` comment below) and reproduces #4865's truncation
      # defect this mission exists to fix.
      SPEC_KITTY_RUN_PERFORMANCE: "1"
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run performance-marked suite (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m performance -q --junitxml=out/reports/xunit-nightly-performance.xml
          code=$?
          echo "PERF_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::performance suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-performance-reports
          path: out/reports/

      # Terminal fail-loud gate (#4212): the suite above ran under `set +e` +
      # `if: always()` (run-all-regardless), capturing its pytest exit into
      # $GITHUB_ENV instead of discarding it. This step, also `if: always()`,
      # runs AFTER the artefact upload so the xunit report is preserved either
      # way, then FAILS the job if the suite exited on a GENUINE failure.
      #
      # pytest exit 5 = "no tests were collected" (a marker-empty suite). Per
      # spec.md Edge Case #4 a nightly suite that is *skipped* (marker-empty) is
      # NOT a failure -- distinct from a *failed* one. So 0 (all passed) and 5
      # (nothing to run) both pass; only a genuine failure exit (1/2/3/4/...)
      # fails the job.
      - name: Fail the job if the performance suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          if [ "${PERF_EXIT:-0}" -ne 0 ] && [ "${PERF_EXIT:-0}" -ne 5 ]; then
            echo "::error::performance suite exited ${PERF_EXIT}"
            exit 1
          fi
          echo "Performance suite passed (exit 0 or a marker-empty exit 5)."

  # `e2e`: timeout sized from the real measured duration (24m44s, run
  # 35683539593, pre-split blended job) with ~1.5x headroom (plan.md "Real
  # evidence used to size the new budgets"). That historical 24m44s was
  # measured while SPEC_KITTY_RUN_PERFORMANCE=1 was set at JOB level (the old
  # `performance-and-e2e` job), so it unintentionally included the same 20
  # `performance`-marked tests the `performance` job above already runs -- a
  # real 3x duplication (performance/e2e/stress steps each ran them) this
  # split removes: the env var is now scoped to the `performance` job alone,
  # so those 20 tests correctly skip here. WP03's first post-split dispatch
  # (run 35756657364, 2026-09-22, mode=full) confirms it: this job alone, no
  # longer duplicating that work, measured 9m04s (xunit: 45 tests, 26
  # skipped -- 20 of them the now-single-owner performance-marked tests, the
  # other 6 pre-existing/unrelated skips: 1x #4213 known hang, 5x missing
  # Playwright Chromium install). Budget kept at 40 (not shrunk -- outside
  # this WP's scope and evidence base, which is a single dispatch; a
  # generous timeout costs nothing unless a job hangs). PWHEADLESS keeps any
  # UI-touching heavy/e2e test headless.
  e2e:
    name: Heavy e2e suite (nightly-only, #3595)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run heavy/e2e-marked suite (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m e2e -q --junitxml=out/reports/xunit-nightly-e2e.xml
          code=$?
          echo "E2E_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::e2e suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-e2e-reports
          path: out/reports/

      # Terminal fail-loud gate (#4212): mirror of the performance job's gate
      # above, scoped to this job's own suite/exit code.
      - name: Fail the job if the e2e suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          if [ "${E2E_EXIT:-0}" -ne 0 ] && [ "${E2E_EXIT:-0}" -ne 5 ]; then
            echo "::error::e2e suite exited ${E2E_EXIT}"
            exit 1
          fi
          echo "e2e suite passed (exit 0 or a marker-empty exit 5)."

  # `stress`: Stage B complete -- tightened, FINAL production timeout-minutes
  # (plan.md "Real evidence used to size the new budgets" / Phasing Phase 1
  # steps 1e-1f, PLAN-ARCH-001). Nightly run 35683539593 (pre-split blended
  # job) truncated `stress` mid-run at >=16m18s (`cancelled`, never
  # completed) inside the OLD shared 60-minute job cap -- and even that
  # lower bound included the same 20 `performance`-marked tests duplicated
  # into every step by the old job-level SPEC_KITTY_RUN_PERFORMANCE=1 (see
  # the `e2e` job's comment above), so it was never a clean measurement of
  # this suite alone. WP03's Stage A dispatch (run 35756657364, 2026-09-22,
  # mode=full, the first dispatch after the split) gave the first REAL
  # completed duration: `stress` finished in 4m44s (`success`; xunit: 33
  # tests, 20 skipped -- the skip count matches the performance-marked tests
  # correctly sitting out of this job now that the split scoped the env var
  # to `performance` alone; 0 failures/errors). 4m44s is comfortably inside
  # the 90-minute Stage A ceiling, so the bounded widen-retry ladder (90 ->
  # 150 -> 300, each step under GitHub Actions' documented 6-hour/360-minute
  # per-job ceiling for hosted `ubuntu-latest` runners) was never triggered.
  # Stage B timeout-minutes below = ceil(4m44s x ~1.5 headroom), the SAME
  # method used for `performance`/`e2e` above, rounded to a clean number:
  # 284s x 1.5 = 426s = ~7.1min -> 10. Honesty caveat (plan.md requires this
  # distinction): completing in 4m44s establishes only that the 90-minute
  # Stage A ceiling was NOT hit -- it does not by itself establish that 10
  # minutes is sufficient for every future run's variance; that can only be
  # falsified by a future run, not this one (see WP03's "Risks &
  # Mitigations": T017's headroom sufficiency is unverifiable at WP-close).
  # Run serially (no `-n`): stress tests are not xdist-safe and race
  # coverage's per-thread trace installation when co-scheduled with other
  # suites. `not windows_ci` leaves the Windows-critical subset to
  # ci-windows.yml.
  stress:
    name: Stress suite (nightly-only, #3595)
    runs-on: ubuntu-latest
    # DO NOT set SPEC_KITTY_RUN_PERFORMANCE on this job. This 10-minute
    # budget assumes the ~20 performance-marked tests stay skipped here (they
    # are the single-owner responsibility of the `performance` job above).
    # Re-scoping that env var onto `stress` reintroduces the duplicated
    # performance-marked cases, blows this budget, and reproduces #4865's
    # ~16m18s+ truncation defect -- the exact regression this mission fixes.
    timeout-minutes: 10
    env:
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run stress-marked suite (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m "stress and not windows_ci" -q --junitxml=out/reports/xunit-nightly-stress.xml
          code=$?
          echo "STRESS_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::stress suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly stress reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-stress-reports
          path: out/reports/

      # Terminal fail-loud gate (#4212): mirror of the performance job's gate
      # above, scoped to this job's own suite/exit code.
      - name: Fail the job if the stress suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          if [ "${STRESS_EXIT:-0}" -ne 0 ] && [ "${STRESS_EXIT:-0}" -ne 5 ]; then
            echo "::error::stress suite exited ${STRESS_EXIT}"
            exit 1
          fi
          echo "Stress suite passed (exit 0 or a marker-empty exit 5)."

  # ---------------------------------------------------------------------------
  # interpreter-matrix: FR-021 -- above-3.12 interpreter lane, nightly-only.
  # Deliberately scoped to the nightly lane, NOT the full above-3.12 suite
  # burn-down (#3189 is a deferred follow-up, not claimed here).
  # ---------------------------------------------------------------------------
  interpreter-matrix:
    name: "Interpreter matrix (Python ${{ matrix.python-version }}, nightly-only, FR-021)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Above 3.12, up to the supported ceiling declared in pyproject.toml's
        # `Programming Language :: Python :: 3.13` trove classifier. Bump this
        # list, reviewed, when the ceiling classifier advances -- never ahead
        # of it (the full multi-version burn-down beyond this nightly lane is
        # #3189, not this workflow).
        python-version:
          - '3.13'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment on this interpreter
        shell: bash
        run: uv sync --frozen --all-extras --python "${{ matrix.python-version }}"

      - name: Run fast/unit suite on this interpreter (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m "fast or unit" -q --junitxml="out/reports/xunit-nightly-interpreter-${{ matrix.python-version }}.xml"
          code=$?
          echo "INTERPRETER_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::interpreter ${{ matrix.python-version }} suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload interpreter-matrix reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "ci-nightly-interpreter-${{ matrix.python-version }}-reports"
          path: out/reports/

      # Terminal fail-loud gate (#4212): mirror of the performance/e2e/stress
      # gate on the FR-021 interpreter lane. The suite above captured its
      # pytest exit into $GITHUB_ENV under `set +e` + `if: always()`; this
      # `if: always()` step (after the artefact upload) fails the matrix leg
      # if that interpreter's suite was red, so a divergence on 3.13 is no
      # longer invisible. `fail-fast: false` keeps every other leg running.
      # pytest exit 5 ("no tests collected", a marker-empty suite) is a skip,
      # not a failure (spec.md Edge Case #4), so 0 and 5 both pass here.
      - name: Fail the leg if this interpreter's suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          if [ "${INTERPRETER_EXIT:-0}" -ne 0 ] && [ "${INTERPRETER_EXIT:-0}" -ne 5 ]; then
            echo "::error::interpreter ${{ matrix.python-version }} suite exited ${INTERPRETER_EXIT}"
            exit 1
          fi
          echo "Interpreter ${{ matrix.python-version }} suite passed (exit 0 or a marker-empty exit 5)."

  # ---------------------------------------------------------------------------
  # generate-full-matrix / full-module-matrix: mission ci-modules-diff-scoping
  # -- the cross-module post-merge safety net that REPLACES the old
  # push-always-runs-every-shard behavior now that ci-modules.yml diff-scopes
  # its matrix on both pull_request and push (operator decision). This
  # nightly lane realizes the SAME committed module registry
  # (.github/ci-module-registry.yml) ci-modules.yml reads, unconditionally
  # selecting every module/shard leaf (no diff scoping -- nightly IS the
  # full-mode run), and calls the SAME `module-tests.yml` reusable shard
  # directly with `mode: full`.
  #
  # This does NOT `uses: ./.github/workflows/ci-modules.yml` (a nested
  # multi-job reusable-workflow call): the architectural gate-coverage model's
  # local-`uses:` splicer (tests/architectural/_gate_coverage.py
  # `_splice_local_uses`) requires a spliced reusable workflow to define
  # EXACTLY ONE job (module-tests.yml qualifies; ci-modules.yml, a 3-job
  # matrix orchestrator, does not) -- so this lane calls `module-tests.yml`
  # directly, exactly as ci-modules.yml's own `test` job does, at the cost of
  # a small, intentional duplication of the matrix-generation shape (never
  # the module list itself, which both read from the one committed registry).
  # ---------------------------------------------------------------------------
  generate-full-matrix:
    name: Generate full module-shard matrix (nightly-only)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install PyYAML (matrix-generation only, no editable install needed)
        shell: bash
        run: |
          pip install --quiet --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"

      - name: Build the full matrix from the committed module registry (every module, every shard)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          import yaml

          with open(".github/ci-module-registry.yml", encoding="utf-8") as fh:
              registry = yaml.safe_load(fh)

          leaves = []
          for row in registry["modules"]:
              module = row["module"]
              shard_count = row["shard_count"]
              for idx in range(1, shard_count + 1):
                  leaves.append(
                      {
                          "module": module,
                          "roots": json.dumps(row["roots"]),
                          "cov_target": json.dumps(row["cov_targets"]),
                          "tier": row["tier"],
                          "shard": f"{idx}/{shard_count}",
                          "mode": "full",
                          "test_dirs": json.dumps(row.get("test_dirs", [])),
                      }
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(leaves)}\n")

          print(f"ci-nightly: generated {len(leaves)} shard leaves across {len(registry['modules'])} registry modules (full mode, every module selected)")
          PY

  full-module-matrix:
    name: "module-tests (${{ matrix.module }} shard ${{ matrix.shard }}) [nightly full]"
    needs: generate-full-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-full-matrix.outputs.matrix) }}
    uses: ./.github/workflows/module-tests.yml
    with:
      module: ${{ matrix.module }}
      roots: ${{ matrix.roots }}
      cov_target: ${{ matrix.cov_target }}
      tier: ${{ matrix.tier }}
      shard: ${{ matrix.shard }}
      mode: ${{ matrix.mode }}
      test_dirs: ${{ matrix.test_dirs }}

  # ---------------------------------------------------------------------------
  # nightly-summary: terminal `if: always()` aggregator so a scheduled/dispatch
  # run's complete failure set is visible in one place, never short-circuited.
  # ---------------------------------------------------------------------------
  nightly-summary:
    name: Nightly full-mode summary
    runs-on: ubuntu-latest
    needs: [performance, e2e, stress, interpreter-matrix, full-module-matrix]
    if: always()
    steps:
      - name: Report full-mode results (run-all-regardless, never fail-fast)
        shell: bash
        run: |
          echo "performance: ${{ needs.performance.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          echo "stress: ${{ needs.stress.result }}"
          echo "interpreter-matrix: ${{ needs.interpreter-matrix.result }}"
          echo "full-module-matrix: ${{ needs.full-module-matrix.result }}"
