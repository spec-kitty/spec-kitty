# CI Nightly — full-mode expensive cadence + interpreter lane.
#
# Mission ci-pipeline-reinstatement-01M1X35E, WP13 (FR-020/021; SC-011).
#
# This is the ONLY home for the performance / heavy-e2e test cadence (#3595)
# and the above-3.12 interpreter matrix (FR-021) -- both stay OFF the per-PR
# blocking path (SC-011: a per-PR run executes 0 of these jobs). This
# workflow triggers on `schedule` (nightly) + `workflow_dispatch` ONLY: it
# carries no `pull_request` / `push` trigger, so a PR event can never start
# any job defined here (the structural half of SC-011; the guard in
# tests/architectural/test_performance_marker_guard.py asserts the rest --
# no OTHER pull_request-triggered workflow selects `-m performance` / `-m e2e`
# / an interpreter matrix, and that this file's own shape holds).
#
# `mode` (full|pr) is honored via `workflow_dispatch.inputs.mode`, defaulting
# to `full` -- the OPPOSITE default of the per-PR-triggered lanes
# (ci-modules.yml / ci-router.yml default `pr`) -- because this workflow's
# reason to exist IS the full-mode run-all-regardless cadence (FR-018/019):
# `fail-fast: false` on every matrix strategy plus `if: always()` on every
# step/job that must survive an upstream red, so a nightly run always
# surfaces the COMPLETE failure set rather than short-circuiting on the
# first red job like the PR fail-fast lanes. `mode: pr` remains selectable via
# manual dispatch for a fail-fast diagnostic re-run, but is never the
# scheduled trigger's mode. The cross-cutting dual-mode contract test
# (test_dual_mode_contract) and its dispatched-run evidence are WP11's.
#
# The interpreter-matrix job runs the fast/unit suite on every Python version
# ABOVE 3.12 up to the project's supported ceiling (pyproject.toml
# `Programming Language :: Python :: 3.13` trove classifier) so
# interpreter-divergence defects are visible instead of escaping CI (FR-021).
# This lands the nightly lane only -- the full above-3.12 burn-down across
# every suite is the deferred follow-up #3189 and is explicitly NOT claimed
# by this workflow or this mission (see spec.md FR-021 / issue-matrix).
#
# All `uses:` action references below are SHA-pinned (`@<40-hex> # v<tag>`).

name: CI Nightly

on:
  schedule:
    # 03:17 UTC daily -- off-peak, deliberately not a round hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full (run-all, if: always(), the scheduled default) or pr (fail-fast diagnostic re-run).'
        required: false
        default: full
        type: choice
        options:
          - full
          - pr

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # performance-and-e2e: the dedicated performance-test workflow home (#3595).
  # Runs the `performance` + `e2e` marked suites that never execute on the
  # per-PR path -- full-mode run-all-regardless, never fail-fast.
  # ---------------------------------------------------------------------------
  performance-and-e2e:
    name: Performance + heavy e2e (nightly-only, #3595)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
    # conftest.py skips `performance`-marked tests unless SPEC_KITTY_RUN_PERFORMANCE=1
    # (they are cold-start / runner-bound off the per-PR path). Without this the
    # `-m performance` step below selects the suite but conftest skips every test
    # in it — a vacuous lane. Set it here so the performance flow actually runs
    # the wall-clock budget guards it is the sole home for. PWHEADLESS keeps any
    # UI-touching heavy/e2e test headless.
    env:
      SPEC_KITTY_RUN_PERFORMANCE: "1"
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run performance-marked suite (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m performance -q --junitxml=out/reports/xunit-nightly-performance.xml
          code=$?
          echo "PERF_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::performance suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Run heavy/e2e-marked suite (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m e2e -q --junitxml=out/reports/xunit-nightly-e2e.xml
          code=$?
          echo "E2E_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::e2e suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly performance/e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-performance-e2e-reports
          path: out/reports/

      # Terminal fail-loud gate (#4212): every suite above ran under `set +e` +
      # `if: always()` (run-all-regardless), capturing its pytest exit into
      # $GITHUB_ENV instead of discarding it. This step, also `if: always()`,
      # runs AFTER the artefact upload so xunit reports are preserved either
      # way, then FAILS the job if any suite exited non-zero -- so a red suite
      # can no longer leave the job green. Run-all is preserved: the complete
      # failure set is surfaced (annotations + reports) before this fails.
      - name: Fail the job if any nightly suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          status=0
          if [ "${PERF_EXIT:-0}" -ne 0 ]; then
            echo "::error::performance suite exited ${PERF_EXIT}"
            status=1
          fi
          if [ "${E2E_EXIT:-0}" -ne 0 ]; then
            echo "::error::e2e suite exited ${E2E_EXIT}"
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "One or more nightly suites failed; see the ::error:: annotations above and the uploaded xunit reports."
            exit 1
          fi
          echo "All nightly performance/e2e suites passed."

  # ---------------------------------------------------------------------------
  # interpreter-matrix: FR-021 -- above-3.12 interpreter lane, nightly-only.
  # Deliberately scoped to the nightly lane, NOT the full above-3.12 suite
  # burn-down (#3189 is a deferred follow-up, not claimed here).
  # ---------------------------------------------------------------------------
  interpreter-matrix:
    name: "Interpreter matrix (Python ${{ matrix.python-version }}, nightly-only, FR-021)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Above 3.12, up to the supported ceiling declared in pyproject.toml's
        # `Programming Language :: Python :: 3.13` trove classifier. Bump this
        # list, reviewed, when the ceiling classifier advances -- never ahead
        # of it (the full multi-version burn-down beyond this nightly lane is
        # #3189, not this workflow).
        python-version:
          - '3.13'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment on this interpreter
        shell: bash
        run: uv sync --frozen --all-extras --python "${{ matrix.python-version }}"

      - name: Run fast/unit suite on this interpreter (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m "fast or unit" -q --junitxml="out/reports/xunit-nightly-interpreter-${{ matrix.python-version }}.xml"
          code=$?
          echo "INTERPRETER_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::interpreter ${{ matrix.python-version }} suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload interpreter-matrix reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "ci-nightly-interpreter-${{ matrix.python-version }}-reports"
          path: out/reports/

      # Terminal fail-loud gate (#4212): mirror of the performance-and-e2e
      # gate on the FR-021 interpreter lane. The suite above captured its
      # pytest exit into $GITHUB_ENV under `set +e` + `if: always()`; this
      # `if: always()` step (after the artefact upload) fails the matrix leg
      # if that interpreter's suite was red, so a divergence on 3.13 is no
      # longer invisible. `fail-fast: false` keeps every other leg running.
      - name: Fail the leg if this interpreter's suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          if [ "${INTERPRETER_EXIT:-0}" -ne 0 ]; then
            echo "::error::interpreter ${{ matrix.python-version }} suite exited ${INTERPRETER_EXIT}"
            exit 1
          fi
          echo "Interpreter ${{ matrix.python-version }} suite passed."

  # ---------------------------------------------------------------------------
  # generate-full-matrix / full-module-matrix: mission ci-modules-diff-scoping
  # -- the cross-module post-merge safety net that REPLACES the old
  # push-always-runs-every-shard behavior now that ci-modules.yml diff-scopes
  # its matrix on both pull_request and push (operator decision). This
  # nightly lane realizes the SAME committed module registry
  # (.github/ci-module-registry.yml) ci-modules.yml reads, unconditionally
  # selecting every module/shard leaf (no diff scoping -- nightly IS the
  # full-mode run), and calls the SAME `module-tests.yml` reusable shard
  # directly with `mode: full`.
  #
  # This does NOT `uses: ./.github/workflows/ci-modules.yml` (a nested
  # multi-job reusable-workflow call): the architectural gate-coverage model's
  # local-`uses:` splicer (tests/architectural/_gate_coverage.py
  # `_splice_local_uses`) requires a spliced reusable workflow to define
  # EXACTLY ONE job (module-tests.yml qualifies; ci-modules.yml, a 3-job
  # matrix orchestrator, does not) -- so this lane calls `module-tests.yml`
  # directly, exactly as ci-modules.yml's own `test` job does, at the cost of
  # a small, intentional duplication of the matrix-generation shape (never
  # the module list itself, which both read from the one committed registry).
  # ---------------------------------------------------------------------------
  generate-full-matrix:
    name: Generate full module-shard matrix (nightly-only)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install PyYAML (matrix-generation only, no editable install needed)
        shell: bash
        run: |
          pip install --quiet --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"

      - name: Build the full matrix from the committed module registry (every module, every shard)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          import yaml

          with open(".github/ci-module-registry.yml", encoding="utf-8") as fh:
              registry = yaml.safe_load(fh)

          leaves = []
          for row in registry["modules"]:
              module = row["module"]
              shard_count = row["shard_count"]
              for idx in range(1, shard_count + 1):
                  leaves.append(
                      {
                          "module": module,
                          "roots": json.dumps(row["roots"]),
                          "cov_target": json.dumps(row["cov_targets"]),
                          "tier": row["tier"],
                          "shard": f"{idx}/{shard_count}",
                          "mode": "full",
                          "test_dirs": json.dumps(row.get("test_dirs", [])),
                      }
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(leaves)}\n")

          print(f"ci-nightly: generated {len(leaves)} shard leaves across {len(registry['modules'])} registry modules (full mode, every module selected)")
          PY

  full-module-matrix:
    name: "module-tests (${{ matrix.module }} shard ${{ matrix.shard }}) [nightly full]"
    needs: generate-full-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-full-matrix.outputs.matrix) }}
    uses: ./.github/workflows/module-tests.yml
    with:
      module: ${{ matrix.module }}
      roots: ${{ matrix.roots }}
      cov_target: ${{ matrix.cov_target }}
      tier: ${{ matrix.tier }}
      shard: ${{ matrix.shard }}
      mode: ${{ matrix.mode }}
      test_dirs: ${{ matrix.test_dirs }}

  # ---------------------------------------------------------------------------
  # nightly-summary: terminal `if: always()` aggregator so a scheduled/dispatch
  # run's complete failure set is visible in one place, never short-circuited.
  # ---------------------------------------------------------------------------
  nightly-summary:
    name: Nightly full-mode summary
    runs-on: ubuntu-latest
    needs: [performance-and-e2e, interpreter-matrix, full-module-matrix]
    if: always()
    steps:
      - name: Report full-mode results (run-all-regardless, never fail-fast)
        shell: bash
        run: |
          echo "performance-and-e2e: ${{ needs.performance-and-e2e.result }}"
          echo "interpreter-matrix: ${{ needs.interpreter-matrix.result }}"
          echo "full-module-matrix: ${{ needs.full-module-matrix.result }}"
