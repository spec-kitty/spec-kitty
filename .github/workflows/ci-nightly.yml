# CI Nightly — full-mode expensive cadence + interpreter lane.
#
# Mission ci-pipeline-reinstatement-01M1X35E, WP13 (FR-020/021; SC-011).
#
# This is the ONLY home for the performance / heavy-e2e / stress test cadence
# (#3595; stress reinstated #4698) and the above-3.12 interpreter matrix
# (FR-021) -- all stay OFF the per-PR blocking path (SC-011: a per-PR run
# executes 0 of these jobs). This
# workflow triggers on `schedule` (nightly) + `workflow_dispatch` ONLY: it
# carries no `pull_request` / `push` trigger, so a PR event can never start
# any job defined here (the structural half of SC-011; the guard in
# tests/architectural/test_performance_marker_guard.py asserts the rest --
# no OTHER pull_request-triggered workflow selects `-m performance` / `-m e2e`
# / an interpreter matrix, and that this file's own shape holds).
#
# `mode` (full|pr) is honored via `workflow_dispatch.inputs.mode`, defaulting
# to `full` -- the OPPOSITE default of the per-PR-triggered lanes
# (ci-modules.yml / ci-router.yml default `pr`) -- because this workflow's
# reason to exist IS the full-mode run-all-regardless cadence (FR-018/019):
# `fail-fast: false` on every matrix strategy plus `if: always()` on every
# step/job that must survive an upstream red, so a nightly run always
# surfaces the COMPLETE failure set rather than short-circuiting on the
# first red job like the PR fail-fast lanes. `mode: pr` remains selectable via
# manual dispatch for a fail-fast diagnostic re-run, but is never the
# scheduled trigger's mode. The cross-cutting dual-mode contract test
# (test_dual_mode_contract) and its dispatched-run evidence are WP11's.
#
# The interpreter-matrix-shard-<N> jobs (issue #4951) together run the
# fast/unit suite on Python 3.13 -- the ceiling ABOVE 3.12 declared by
# pyproject.toml's `Programming Language :: Python :: 3.13` trove classifier
# -- split into N independent, disjoint shards so the leg can complete
# instead of racing a single 45-minute cap against the whole suite (the
# single combined job never once produced a verdict). Shard identity lives
# in `tests/architectural/_interpreter_shard_roster.py`; completeness
# (zero-gap/zero-overlap) is machine-checked by
# `tests/architectural/test_interpreter_shard_coverage.py`. This lands the
# nightly lane only -- the full above-3.12 burn-down across every suite is
# the deferred follow-up #3189 and is explicitly NOT claimed by this
# workflow or this mission (see spec.md FR-021 / issue-matrix).
#
# All `uses:` action references below are SHA-pinned (`@<40-hex> # v<tag>`).

name: CI Nightly

on:
  schedule:
    # 03:17 UTC daily -- off-peak, deliberately not a round hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full (run-all, if: always(), the scheduled default) or pr (fail-fast diagnostic re-run).'
        required: false
        default: full
        type: choice
        options:
          - full
          - pr

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Fork guard: automated runs (schedule, push to main, workflow_run) are core-repo
# only. On a fork the guarded jobs skip; pull_request and workflow_dispatch still
# run everywhere. Pinned by tests/ci/test_fork_guard.py.
jobs:
  # ---------------------------------------------------------------------------
  # performance / e2e / stress: split from the former single
  # performance-and-e2e job (#4865) into three INDEPENDENT jobs, each with its
  # own timeout budget and its own verdict, so a genuine regression in one
  # suite is never blended with (or masked by) a different suite's timeout
  # cancellation. Concretely: nightly run 35683539593 (2026-09-20) hit the old
  # shared 60-minute cap, went `cancelled` at 65m01s, and truncated `stress`
  # entirely while `performance`/`e2e` had already passed inside the SAME
  # blended verdict -- a genuine e2e regression on that date would have been
  # indistinguishable from routine timeout cancellation. No `needs:`
  # dependency chain BETWEEN these three jobs -- they run in parallel where
  # runners are available; only `nightly-summary` below depends on all three.
  # The operator explicitly REJECTED merely raising the old job's timeout
  # cap as a half-fix (it would still blend three verdicts into one) -- see
  # spec.md "Binding operator decision #1".
  # ---------------------------------------------------------------------------

  # `performance`: timeout sized from the real measured duration (23m41s, run
  # 35683539593, pre-split blended job) with ~1.5x headroom (plan.md "Real
  # evidence used to size the new budgets"). Confirmed by WP03's first
  # post-split nightly dispatch (run 35756657364, 2026-09-22, mode=full):
  # this job alone measured 23m23s wall-clock -- consistent with the
  # pre-split figure, since `performance` is the one job that legitimately
  # owns SPEC_KITTY_RUN_PERFORMANCE=1 below (see the e2e/stress comments for
  # the 3x duplication this split actually removed from THEIR steps).
  # conftest.py skips `performance`-marked tests unless
  # SPEC_KITTY_RUN_PERFORMANCE=1 (they are cold-start / runner-bound off the
  # per-PR path) -- without this env var the `-m performance` step below
  # selects the suite but conftest skips every test in it, a vacuous lane.
  # PWHEADLESS keeps any UI-touching test headless. Budget kept at 35 (not
  # shrunk): a generous timeout costs nothing unless a job hangs, and this
  # WP's own evidence base is a single dispatch.
  performance:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Performance suite (nightly-only, #3595)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # `issues: write` is for the nightly red -> deduped-P0 escalation step
    # (scripts/ci/nightly_escalation.py, FR-007) below; the workflow-level
    # default is `contents: read`.
    permissions:
      contents: read
      issues: write
    env:
      # DO NOT add SPEC_KITTY_RUN_PERFORMANCE to any other job's env in this
      # file (e2e, stress, etc.) -- it is deliberately scoped to THIS job
      # alone. Re-adding it to `stress` re-duplicates the ~20
      # performance-marked tests back into that job (see the `stress` job's
      # `timeout-minutes` comment below) and reproduces #4865's truncation
      # defect this mission exists to fix.
      SPEC_KITTY_RUN_PERFORMANCE: "1"
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run performance-marked suite (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m performance -q --junitxml=out/reports/xunit-nightly-performance.xml
          code=$?
          echo "PERF_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::performance suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-performance-reports
          path: out/reports/

      # Nightly red -> deduped-P0 escalation (FR-007, DM-01M3CZWF). Runs
      # `if: always()` BEFORE the terminal fail-loud gate so it fires whether
      # the suite was red or green; on red it opens/updates ONE standing
      # priority:P0 issue for this suite key, on green it closes it. It is
      # fail-closed toward the workflow: a missing token / API outage prints a
      # warning and exits 0 (degrade to fail-loud only), never crashing the run
      # and never echoing the token (C-005). Exit 0 and the marker-empty exit 5
      # both count as `success`, mirroring the fail-loud gate below.
      #
      # FIND-1 (#5034): the `:-1` default (NOT `:-0`) is load-bearing. PERF_EXIT
      # is written by the suite step's OWN `code=$?; echo ... >> $GITHUB_ENV`
      # line, which only runs if that step gets to finish. If the job is killed
      # by its `timeout-minutes` cap mid-run (the #4865 truncation scenario),
      # that write never happens and PERF_EXIT is UNSET here -- `:-0` would then
      # read as "exit 0, passed", closing a standing P0 for a suite that never
      # actually finished. `:-1` makes an unset/never-written exit resolve to a
      # genuine failure instead.
      #
      # Mainline-only (#5169/#5172/#5265): every escalation step in this file
      # is gated on `github.ref == 'refs/heads/main'`, so a workflow_dispatch
      # on an unmerged branch can never open, bump OR close a P0 (a green
      # branch run must not auto-close a real main P0). The script enforces
      # the same gate on `--ref "$GITHUB_REF"` independently, so the rule
      # holds even if this condition drifts; tests/ci/test_nightly_escalation.py
      # pins both halves.
      - name: Escalate performance red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${PERF_EXIT:-1}" -ne 0 ] && [ "${PERF_EXIT:-1}" -ne 5 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key performance --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-performance.xml

      # Terminal fail-loud gate (#4212): the suite above ran under `set +e` +
      # `if: always()` (run-all-regardless), capturing its pytest exit into
      # $GITHUB_ENV instead of discarding it. This step, also `if: always()`,
      # runs AFTER the artefact upload so the xunit report is preserved either
      # way, then FAILS the job if the suite exited on a GENUINE failure.
      #
      # pytest exit 5 = "no tests were collected" (a marker-empty suite). Per
      # spec.md Edge Case #4 a nightly suite that is *skipped* (marker-empty) is
      # NOT a failure -- distinct from a *failed* one. So 0 (all passed) and 5
      # (nothing to run) both pass; only a genuine failure exit (1/2/3/4/...)
      # fails the job. The `:-1` default (FIND-1, #5034) fails closed if a
      # timeout-cancelled job never reached the `code=$?` write above.
      - name: Fail the job if the performance suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key performance --xunit out/reports/xunit-nightly-performance.xml --log-step 'Run performance-marked suite (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${PERF_EXIT:-1}" -ne 0 ] && [ "${PERF_EXIT:-1}" -ne 5 ]; then
            echo "::error::performance suite exited ${PERF_EXIT}"
            exit 1
          fi
          echo "Performance suite passed (exit 0 or a marker-empty exit 5)."

  # `e2e`: timeout sized from the real measured duration (24m44s, run
  # 35683539593, pre-split blended job) with ~1.5x headroom (plan.md "Real
  # evidence used to size the new budgets"). That historical 24m44s was
  # measured while SPEC_KITTY_RUN_PERFORMANCE=1 was set at JOB level (the old
  # `performance-and-e2e` job), so it unintentionally included the same 20
  # `performance`-marked tests the `performance` job above already runs -- a
  # real 3x duplication (performance/e2e/stress steps each ran them) this
  # split removes: the env var is now scoped to the `performance` job alone,
  # so those 20 tests correctly skip here. WP03's first post-split dispatch
  # (run 35756657364, 2026-09-22, mode=full) confirms it: this job alone, no
  # longer duplicating that work, measured 9m04s (xunit: 45 tests, 26
  # skipped -- 20 of them the now-single-owner performance-marked tests, the
  # other 6 pre-existing/unrelated skips: 1x #4213 known hang, 5x missing
  # Playwright Chromium install). Budget kept at 40 (not shrunk -- outside
  # this WP's scope and evidence base, which is a single dispatch; a
  # generous timeout costs nothing unless a job hangs). PWHEADLESS keeps any
  # UI-touching heavy/e2e test headless.
  e2e:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Heavy e2e suite (nightly-only, #3595)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # `issues: write` for the FR-007 escalation step below.
    permissions:
      contents: read
      issues: write
    env:
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run heavy/e2e-marked suite (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m e2e -q --junitxml=out/reports/xunit-nightly-e2e.xml
          code=$?
          echo "E2E_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::e2e suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-e2e-reports
          path: out/reports/

      # Nightly red -> deduped-P0 escalation (FR-007): mirror of the performance
      # job's step, scoped to this suite's key/exit. Fail-closed, if: always().
      - name: Escalate e2e red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${E2E_EXIT:-1}" -ne 0 ] && [ "${E2E_EXIT:-1}" -ne 5 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key e2e --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-e2e.xml

      # Terminal fail-loud gate (#4212): mirror of the performance job's gate
      # above, scoped to this job's own suite/exit code.
      - name: Fail the job if the e2e suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key e2e --xunit out/reports/xunit-nightly-e2e.xml --log-step 'Run heavy/e2e-marked suite (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${E2E_EXIT:-1}" -ne 0 ] && [ "${E2E_EXIT:-1}" -ne 5 ]; then
            echo "::error::e2e suite exited ${E2E_EXIT}"
            exit 1
          fi
          echo "e2e suite passed (exit 0 or a marker-empty exit 5)."

  # `stress`: Stage B complete -- tightened, FINAL production timeout-minutes
  # (plan.md "Real evidence used to size the new budgets" / Phasing Phase 1
  # steps 1e-1f, PLAN-ARCH-001). Nightly run 35683539593 (pre-split blended
  # job) truncated `stress` mid-run at >=16m18s (`cancelled`, never
  # completed) inside the OLD shared 60-minute job cap -- and even that
  # lower bound included the same 20 `performance`-marked tests duplicated
  # into every step by the old job-level SPEC_KITTY_RUN_PERFORMANCE=1 (see
  # the `e2e` job's comment above), so it was never a clean measurement of
  # this suite alone. WP03's Stage A dispatch (run 35756657364, 2026-09-22,
  # mode=full, the first dispatch after the split) gave the first REAL
  # completed duration: `stress` finished in 4m44s (`success`; xunit: 33
  # tests, 20 skipped -- the skip count matches the performance-marked tests
  # correctly sitting out of this job now that the split scoped the env var
  # to `performance` alone; 0 failures/errors). 4m44s is comfortably inside
  # the 90-minute Stage A ceiling, so the bounded widen-retry ladder (90 ->
  # 150 -> 300, each step under GitHub Actions' documented 6-hour/360-minute
  # per-job ceiling for hosted `ubuntu-24.04` runners) was never triggered.
  # Stage B timeout-minutes below = ceil(4m44s x ~1.5 headroom), the SAME
  # method used for `performance`/`e2e` above, rounded to a clean number:
  # 284s x 1.5 = 426s = ~7.1min -> 10. Honesty caveat (plan.md requires this
  # distinction): completing in 4m44s establishes only that the 90-minute
  # Stage A ceiling was NOT hit -- it does not by itself establish that 10
  # minutes is sufficient for every future run's variance; that can only be
  # falsified by a future run, not this one (see WP03's "Risks &
  # Mitigations": T017's headroom sufficiency is unverifiable at WP-close).
  # Run serially (no `-n`): stress tests are not xdist-safe and race
  # coverage's per-thread trace installation when co-scheduled with other
  # suites. `not windows_ci` leaves the Windows-critical subset to
  # ci-windows.yml.
  stress:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Stress suite (nightly-only, #3595)
    runs-on: ubuntu-24.04
    # DO NOT set SPEC_KITTY_RUN_PERFORMANCE on this job. This 10-minute
    # budget assumes the ~20 performance-marked tests stay skipped here (they
    # are the single-owner responsibility of the `performance` job above).
    # Re-scoping that env var onto `stress` reintroduces the duplicated
    # performance-marked cases, blows this budget, and reproduces #4865's
    # ~16m18s+ truncation defect -- the exact regression this mission fixes.
    timeout-minutes: 10
    # `issues: write` for the FR-007 escalation step below.
    permissions:
      contents: read
      issues: write
    env:
      PWHEADLESS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run stress-marked suite (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m "stress and not windows_ci" -q --junitxml=out/reports/xunit-nightly-stress.xml
          code=$?
          echo "STRESS_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::stress suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload nightly stress reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-stress-reports
          path: out/reports/

      # Nightly red -> deduped-P0 escalation (FR-007): mirror of the performance
      # job's step, scoped to this suite's key/exit. Fail-closed, if: always().
      - name: Escalate stress red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${STRESS_EXIT:-1}" -ne 0 ] && [ "${STRESS_EXIT:-1}" -ne 5 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key stress --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-stress.xml

      # Terminal fail-loud gate (#4212): mirror of the performance job's gate
      # above, scoped to this job's own suite/exit code.
      - name: Fail the job if the stress suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key stress --xunit out/reports/xunit-nightly-stress.xml --log-step 'Run stress-marked suite (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${STRESS_EXIT:-1}" -ne 0 ] && [ "${STRESS_EXIT:-1}" -ne 5 ]; then
            echo "::error::stress suite exited ${STRESS_EXIT}"
            exit 1
          fi
          echo "Stress suite passed (exit 0 or a marker-empty exit 5)."

  # ---------------------------------------------------------------------------
  # p0-repro: the ONLY lane that runs red-first reproductions of open P0 bugs
  # (`@pytest.mark.p0_repro(issue=N)`). tests/conftest.py deselects them from
  # every other run -- every per-PR lane, `make test-fast`/`make test-full` and
  # every other nightly lane -- unless SPEC_KITTY_RUN_P0_REPRO=1, which only
  # this job sets, so PRs land green while an open P0 keeps the nightly
  # honestly red (ADR 2026-07-17-1). Each failure carries an [OPEN P0 #N]
  # banner naming its issue, surfaced by the summary step below. No escalation
  # step: every reproduction is already pinned to its own open P0 issue, so a
  # generic "Nightly suite red" issue would duplicate it. An empty marker
  # (pytest exit 5) is green; exit 1 is the expected red, any other non-zero
  # exit a broken lane. Serial: the slice is a handful of tests, and the
  # passing and skipped reproduction notices are printed by the controller's terminal summary.
  p0-repro:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: Open-P0 reproductions (nightly-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PWHEADLESS: "1"
      SPEC_KITTY_RUN_P0_REPRO: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment
        shell: bash
        run: uv sync --frozen --all-extras

      - name: Run open-P0 reproductions (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen pytest -m p0_repro -q -rf --junitxml=out/reports/xunit-nightly-p0-repro.xml
          code=$?
          echo "P0_REPRO_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::p0-repro suite exit=$code (if: always() -- a red suite is surfaced by the terminal fail-loud step)"

      - name: Upload nightly p0-repro reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-nightly-p0-repro-reports
          path: out/reports/

      - name: Fail the job while an open-P0 reproduction is red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key p0-repro --xunit out/reports/xunit-nightly-p0-repro.xml --log-step 'Run open-P0 reproductions (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${P0_REPRO_EXIT:-99}" -eq 1 ]; then
            echo "::error::open-P0 reproductions are red (exit 1): each failure names its [OPEN P0 #N] issue -- this is the expected signal while those P0s are open"
            exit 1
          elif [ "${P0_REPRO_EXIT:-99}" -ne 0 ] && [ "${P0_REPRO_EXIT:-99}" -ne 5 ]; then
            echo "::error::the p0-repro lane is BROKEN, not an expected red (exit ${P0_REPRO_EXIT:-unset}: pytest 2=interrupted, 3=internal error, 4=usage or collection error; unset=the run step never recorded an exit code): no reproduction reached a verdict, so fix the lane"
            exit 1
          fi
          echo "No open-P0 reproduction is red (exit 0 or a marker-empty exit 5)."

  # ---------------------------------------------------------------------------
  # interpreter-matrix-shard-<N>: FR-021 -- above-3.12 interpreter lane,
  # nightly-only, split into N independent shards (issue #4951) because the
  # single combined job could never finish `pytest -m "fast or unit"` on
  # Python 3.13 within its 45-minute timeout on a GitHub-hosted runner (two
  # real dispatch runs, serial and `-n auto`, both force-cancelled without a
  # verdict). Each shard below runs a disjoint slice of the suite, pinned and
  # sync'd independently (no shared sync step, FR-008), with its own
  # measured `timeout-minutes` (NFR-001). The shard boundaries are declared
  # in `tests/architectural/_interpreter_shard_roster.py` (the single source
  # of truth for shard identity) and machine-checked for zero-gap/zero-
  # overlap completeness by `tests/architectural/test_interpreter_shard_coverage.py`.
  # Deliberately scoped to the nightly lane, NOT the full above-3.12 suite
  # burn-down (#3189 is a deferred follow-up, not claimed here).
  # Independent jobs, not a `strategy.matrix.include` leg per shard (landing
  # pass #5244, LAND-PAT-008): a matrix would collapse `nightly-summary`'s
  # `needs.<job>.result` to one aggregate (losing the per-shard lines below),
  # and the roster/FR-016 guards key on individual job NAMES -- the #4948
  # precedent for this repo's other independent-jobs-over-matrix nightly
  # lanes.
  # ---------------------------------------------------------------------------
  # Shard 1/6: tests/unit, tests/status, tests/cli.
  interpreter-matrix-shard-1:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: "Interpreter matrix shard 1 (Python 3.13, nightly-only, FR-021)"
    runs-on: ubuntu-24.04
    # headroom (#5378): max-suite=12:35 runs=36300726806,36393904544,36482214935,36517786727,36553997695 formula=ceil((max+0:30)*1.5)
    timeout-minutes: 20
    # `issues: write` for the FR-007 escalation step below.
    permissions:
      contents: read
      issues: write
    env:
      UV_PROJECT_ENVIRONMENT: .venv-py3.13
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.13
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dev environment on this interpreter
        shell: bash
        run: uv sync --frozen --all-extras --python "3.13"

      - name: Run fast/unit suite, shard 1 (full-mode, run-all-regardless)
        if: always()
        shell: bash
        run: |
          set +e
          uv run --frozen --python "3.13" --all-extras pytest -m "fast or unit" tests/unit tests/status tests/cli -q -n auto --dist loadfile --junitxml="out/reports/xunit-nightly-interpreter-3.13-shard-1.xml"
          code=$?
          echo "INTERPRETER_SHARD_1_EXIT=$code" >> "$GITHUB_ENV"
          echo "::notice::interpreter 3.13 shard 1 suite exit=$code (if: always() -- full mode never short-circuits; a red suite is surfaced by the terminal fail-loud step, #4212)"

      - name: Upload interpreter-matrix shard 1 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "ci-nightly-interpreter-3.13-shard-1-reports"
          path: out/reports/

      # Nightly red -> deduped-P0 escalation (FR-007/FR-011): scoped per
      # shard so a 3.13 divergence in THIS shard gets its OWN standing issue
      # (no two shards ever race to open one issue).  Fail-closed, if: always().
      - name: Escalate interpreter 3.13 shard 1 red -> deduped P0 (fail-closed)
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${INTERPRETER_SHARD_1_EXIT:-1}" -ne 0 ] && [ "${INTERPRETER_SHARD_1_EXIT:-1}" -ne 5 ]; then conclusion=failure; else conclusion=success; fi
          python3 scripts/ci/nightly_escalation.py --suite-key "interpreter-3.13-shard-1" --conclusion "$conclusion" --ref "$GITHUB_REF" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --xunit out/reports/xunit-nightly-interpreter-3.13-shard-1.xml

      # Terminal fail-loud gate (#4212): mirror of the performance/e2e/stress
      # gate, applied independently PER SHARD (issue #4951). The suite above
      # captured its pytest exit into $GITHUB_ENV under `set +e` +
      # `if: always()`; this `if: always()` step (after the artefact upload)
      # fails THIS SHARD if its slice of the suite was red, so a divergence
      # on 3.13 is no longer invisible -- and, because every shard is an
      # independent job, one red shard never masks or cancels another
      # (FR-012). pytest exit 5 ("no tests collected", a marker-empty suite)
      # is a skip, not a failure (spec.md Edge Case #4), so 0 and 5 both pass
      # here.
      - name: Fail the leg if this shard's suite was red (run-all-then-fail-loud)
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/nightly_xunit.py summarize --suite-key interpreter-3.13-shard-1 --xunit out/reports/xunit-nightly-interpreter-3.13-shard-1.xml --log-step 'Run fast/unit suite, shard 1 (full-mode, run-all-regardless)' || echo "::warning::nightly xunit summary helper failed"
          if [ "${INTERPRETER_SHARD_1_EXIT:-1}" -ne 0 ] && [ "${INTERPRETER_SHARD_1_EXIT:-1}" -ne 5 ]; then
            echo "::error::interpreter 3.13 shard 1 suite exited ${INTERPRETER_SHARD_1_EXIT}"
            exit 1
          fi
          echo "Interpreter 3.13 shard 1 suite passed (exit 0 or a marker-empty exit 5)."

