# CI Router — path-scoped change router (two-authority model).
#
# Mission ci-pipeline-reinstatement, WP07 (FR-004/005/008/016; NFR-002).
#
# There are exactly TWO hand-authored routing sources; everything else is
# derived and asserted against them (contract contracts/router-two-authority.md):
#   1. the dorny `changes` filter block  ->  group -> globs[]   (path -> group)
#   2. the job `if: needs.changes.outputs.<group>` gates         (group -> job)
#
# The dorny filter groups transcribe the WP05 retirement scrub
# (tests/release/ci_retirement_scrub.json) — the single data source WP07
# consumes; it does not re-scrub. The single importable gate-selection authority
# (scripts/ci/gate_selection.py) PARSES these two sources (it never re-encodes
# them as a second map — that is the #2476 hazard it closes). The shape is
# guarded by tests/architectural/test_ci_quality_path_filters.py and
# tests/architectural/test_gate_selection_authority.py.
#
# Amended by Mission ci-runtime-stabilisation (FR-007, amendment A1): the non-src
# `ci_config` group gates the architectural battery on a CI-configuration-only PR
# -- kitty-specs/ci-runtime-stabilisation-01M3TZH6/contracts/router-two-authority-amendment.md.
# Amendment A2 (FR-002/003/004): the battery is an always-on `architectural-fast` job plus
# `architectural-heavy` as one job key with a two-leg `include:` matrix, all on a literal
# `-n 4` (same file, same pointer).
#
# Skip-if-green (FR-011, D-30): an EVENT-LEVEL selection-step suppression, like the fork guard
# below -- NOT a third CI path routing authority. On a `ready_for_review` event whose tested key
# already has a green run, the `green` step of the `changes` job (scripts/ci/green_match.py)
# suppresses the path-filter steps, so every path-gated job skips and `router-gate` posts success.
# No job `if:`, `needs:` or `changes.outputs` expression mentions it, and gate_selection.py
# deliberately does not model it (contracts/router-two-authority-amendment.md A4).
name: CI Router

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Routing mode: pr (fail-fast, path-scoped) or full (run-all).'
        required: false
        default: pr
        type: choice
        options:
          - pr
          - full

# Per-SHA concurrency on push→main (#4347): each landed tip gets its own singleton
# group (nothing to cancel), so a merge burst no longer cancel-cascades main runs and
# every tip receives a terminal evaluation. PR/dispatch keep the per-ref self-coalesce.
concurrency:
  group: ci-router-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# Fork guard: automated runs (schedule, push to main, workflow_run) are core-repo
# only. On a fork the guarded jobs skip; pull_request and workflow_dispatch still
# run everywhere. Pinned by tests/ci/test_fork_guard.py.
jobs:
  # ---------------------------------------------------------------------------
  # changes: the two-authority router's authority #1 (path -> group). The dorny
  # filter block maps each group to its globs; the outputs fold in run-all
  # (full mode) and the FR-004 fail-closed `unmatched` catch-all. Push-to-main
  # is diff-based exactly like a PR (mission ci-modules-diff-scoping) -- the
  # nightly full-module-matrix run (ci-nightly.yml) is the cross-module
  # post-merge safety net that replaces the old push-always-full-scope.
  # ---------------------------------------------------------------------------
  changes:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    # Job-level `permissions:` REPLACES the workflow-level grant, so `contents` is restated
    # next to the `actions: read` the skip-if-green step needs (ci-modules.yml `summarize`
    # precedent).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      consolidation: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.consolidation }}
      auth: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.auth }}
      missions: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.missions }}
      post_merge: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.post_merge }}
      release: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.release }}
      status: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.status }}
      review: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.review }}
      next: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.next }}
      lanes: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.lanes }}
      upgrade: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.upgrade }}
      cli: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.cli }}
      charter: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.charter }}
      agent: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.agent }}
      kernel: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.kernel }}
      glossary: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.glossary }}
      execution_context: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.execution_context }}
      core_misc: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.core_misc }}
      # Test-inventory groups (mission sonar-per-pr-coverage-reuse-01M2FR32,
      # WP02): src-backed like every row above -- their roots are a verbatim
      # SUBSET of globs other groups already own, so they add no new path->group
      # match and belong in the unmatched union and the heavy battery's `if:`.
      unit: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.unit }}
      specify_cli_runtime: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.specify_cli_runtime }}
      # Non-src groups (data, not code): docs/corpus/e2e mirror the src rows'
      # fold shape but are DELIBERATELY excluded from the unmatched loop below.
      docs: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.docs }}
      corpus: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.corpus }}
      e2e: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.e2e }}
      # CI-infrastructure group (spec-kitty#4386): non-src, like docs/corpus/e2e
      # above. Names the scripts/ci/** + .github/workflows/** path family so it
      # routes (matches a named group) instead of silently matching nothing.
      ci: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.ci }}
      # Architectural-gate group (spec-kitty#5168): non-src, like ci above. The
      # registry gives tests/architectural no module row -- its only per-PR home is
      # the heavy battery -- so this group routes a gate/allowlist/helper change
      # there instead of skipping it.
      architectural: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.architectural }}
      # CI-configuration group (FR-007, amendment A1): non-src, like architectural
      # above; gates only the heavy battery. Never in the unmatched loop.
      ci_config: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.ci_config }}
      # Contract-tools group (#5558): non-src, like ci_config above; gates only `tests (contract tools)`
      # (together with `corpus`, which owns contracts/**). Never in the unmatched loop.
      contract_tools: ${{ (inputs.mode == 'full' || steps.unmatched.outputs.unmatched == 'true') && 'true' || steps.filter.outputs.contract_tools }}
      # Raw fail-closed catch-all signal (FR-004): any src/** changed but no named src group did.
      unmatched: ${{ steps.unmatched.outputs.unmatched }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # On a pull_request this job runs PR code next to `actions: read`, so the token must not stay in
          # .git/config. On push (trusted main, no PR code) dorny/paths-filter fetches the base commit over
          # git and needs it; every other step here is API- or local-git-only.
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - name: Skip-if-green on ready-for-review (selection-step suppression; FR-011)
        id: green
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        continue-on-error: true
        # A stalled `gh` must not delay the run: a timeout leaves the outputs unset, so the run executes (fail-safe).
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/green_match.py decide --workflow ci-router.yml --marker-dir "$RUNNER_TEMP/green-match"
      - name: Record the tested-key marker (every other pull_request action; never skips)
        id: green-key
        if: github.event_name == 'pull_request' && github.event.action != 'ready_for_review'
        continue-on-error: true
        # A stalled `gh` must not delay the run: a timeout leaves the outputs unset, so the run executes (fail-safe).
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/green_match.py decide --workflow ci-router.yml --marker-dir "$RUNNER_TEMP/green-match"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.green.outputs.skip != 'true'
        with:
          filters: |
            consolidation:
              - 'src/specify_cli/consolidation/**'
            auth:
              - 'src/specify_cli/auth/**'
            missions:
              - 'src/specify_cli/mission.py'
              - 'src/specify_cli/mission_metadata.py'
              - 'src/specify_cli/missions/**'
              - 'src/charter/offering/missions/**'
            post_merge:
              - 'src/specify_cli/post_merge/**'
            release:
              - 'src/specify_cli/release/**'
            status:
              - 'src/specify_cli/status/**'
              - 'src/specify_cli/coordination/**'
            review:
              - 'src/specify_cli/review/**'
            next:
              - 'src/specify_cli/runtime/**'
              - 'src/runtime/next/**'
              - 'src/mission_runtime/**'
            lanes:
              - 'src/specify_cli/lanes/**'
            upgrade:
              - 'src/specify_cli/upgrade/**'
            cli:
              - 'src/specify_cli/cli/**'
            charter:
              - 'src/charter/**'
              - 'src/specify_cli/charter_runtime/**'
            agent:
              - 'src/specify_cli/agent_utils/**'
            kernel:
              - 'src/kernel/**'
            glossary:
              - 'src/glossary/**'
            execution_context:
              - 'src/mission_runtime/**'
              - 'src/specify_cli/status/**'
              - 'src/runtime/next/**'
              - 'src/specify_cli/cli/commands/agent/**'
            core_misc:
              - 'src/kernel/**'
              - 'src/charter/offering/**'
              - 'src/specify_cli/core/**'
              - 'src/specify_cli/coordination/**'
              - 'src/specify_cli/doctrine_synthesizer/**'
              - 'src/specify_cli/status/**'
              - 'src/specify_cli/tool_surface/**'
              - 'src/specify_cli/zeitgeist_client/**'
            # Test-inventory groups: tests/unit and tests/specify_cli/runtime had
            # no declared home in the module registry. Every glob below is a
            # verbatim copy of one another group already carries (scrub groups
            # `unit` / `specify_cli_runtime`), so no path's match set changes.
            unit:
              - 'src/specify_cli/status/**'
              - 'src/runtime/next/**'
              - 'src/charter/offering/missions/**'
              - 'src/kernel/**'
            specify_cli_runtime:
              - 'src/specify_cli/runtime/**'
              - 'src/charter/offering/missions/**'
              - 'src/specify_cli/core/**'
            docs:
              - 'docs/**'
              - 'tests/docs/**'
              - 'scripts/docs/**'
            corpus:
              - 'packs/**'
              - 'kitty-specs/**/spec.md'
              - 'kitty-specs/**/plan.md'
              - 'kitty-specs/**/tasks/**'
              - 'kitty-specs/**/contracts/**'
              - 'kitty-specs/**/acceptance-matrix.json'
              - '.kittify/charter/**'
              - '.kittify/glossaries/**'
              - '.kittify/doctrine/**'
              - 'contracts/**'
            e2e:
              - 'tests/e2e/**'
              - 'tests/cross_cutting/**'
            # CI-infrastructure group (spec-kitty#4386), mirroring the `ci` module
            # registry row and its scrub group 1:1. NON-src, like docs/corpus/e2e:
            # deliberately NOT in the unmatched loop below -- the FR-004 catch-all
            # is contractually the sensor for unmapped src/** CODE
            # (contracts/router-two-authority.md Invariants 1-2), and these paths
            # are not src and are now named, so there is nothing unmatched to
            # catch. No job gates on this group BY DESIGN: the per-PR executor for
            # these paths' guard suite (tests/ci) is the ci-modules.yml module
            # matrix, which runs on every PR; a `tests (ci)` job here would
            # double-run the suite per PR -- the exact duplicate class
            # tests/architectural/test_no_duplicate_suite_execution.py exists to
            # remove. The group makes the path family's routing visible and
            # asserted (tests/ci/test_ci_module_wiring.py) instead of silent.
            ci:
              - 'scripts/ci/**'
              - '.github/workflows/**'
            # Architectural-gate group (spec-kitty#5168): NON-src (not in the
            # unmatched loop); gates only the heavy battery, the sole per-PR home
            # of tests/architectural (see .github/ci-module-registry.yml).
            architectural:
              - 'tests/architectural/**'
            # CI-configuration group (Mission ci-runtime-stabilisation, FR-007; contract
            # amendment kitty-specs/ci-runtime-stabilisation-01M3TZH6/contracts/
            # router-two-authority-amendment.md A1). NON-src (not in the unmatched loop);
            # gates ONLY the architectural battery, whose gates guard exactly these files.
            # Overlaps the `ci` group by design: `ci` keeps gating no router job (#4386).
            ci_config:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/ci/**'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'Makefile'
              - '.github/ci-module-registry.yml'
              - '.github/ci-shard-timings.json'
            # Contract-tools group (#5558): NON-src (not in the unmatched loop); with `corpus`
            # (which owns contracts/**, pinned by tests/ci/test_contracts_routing.py) it gates
            # only `tests (contract tools)`. It names what the contract tool tests read or run on
            # beyond contracts/**: their own tests, the contract workflows, the locked environment, the
            # pytest configuration and conftest, and the lifecycle source event_mapping_check parses.
            contract_tools:
              - 'tests/contract/**'
              - '.github/workflows/contracts.yml'
              - '.github/workflows/contracts-release.yml'
              - 'uv.lock'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'tests/conftest.py'
              # Not spelled src/...: a src/ glob would make this a src-backed group (a code-shard gate that
              # belongs in the unmatched catch-all, scripts/ci/gate_selection.py), and this one is data-shaped.
              # The file is the one event_mapping_check parses; the `status` group still routes it to its modules.
              - '**/status/lifecycle_events.py'
              # The src files the mission-status reference reader (tests/contract/_mission_status_*.py) and its tests import,
              # spelled the same way and for the same reason: a change to one of them must run `tests (contract tools)`, which is
              # their only per-PR home. Pinned by tests/ci/test_contracts_workflows.py, which derives the list from the imports.
              - '**/kernel/clock.py'
              - '**/kernel/errors.py'
              - '**/kernel/git/__init__.py'
              - '**/mission_runtime/__init__.py'
              - '**/mission_runtime/identity.py'
              - '**/specify_cli/cli/commands/agent/tasks_move_task.py'
              - '**/specify_cli/context/__init__.py'
              - '**/specify_cli/context/mission_resolver.py'
              - '**/specify_cli/coordination/surface_resolver.py'
              - '**/specify_cli/core/dependency_graph.py'
              - '**/specify_cli/core/git_ops.py'
              - '**/specify_cli/core/vcs/git.py'
              - '**/specify_cli/frontmatter.py'
              - '**/specify_cli/lanes/branch_naming.py'
              - '**/specify_cli/lanes/compute.py'
              - '**/specify_cli/lanes/persistence.py'
              - '**/specify_cli/mission_metadata.py'
              - '**/specify_cli/missions/_read_path_resolver.py'
              - '**/specify_cli/ownership/validation.py'
              - '**/specify_cli/policy/commit_guard.py'
              - '**/specify_cli/review/artifacts.py'
              - '**/specify_cli/review/cycle.py'
              - '**/specify_cli/status/aggregate.py'
              - '**/specify_cli/status/models.py'
              - '**/specify_cli/status/progress.py'
              - '**/specify_cli/status/reducer.py'
              - '**/specify_cli/status/tail_reader.py'
              - '**/specify_cli/status/wp_metadata.py'
              - '**/specify_cli/status/wp_view.py'
              - '**/specify_cli/workspace/context.py'
            # FR-004 probe: matches ANY src change. The `unmatched` step computes
            # `any_src AND NOT (any named src group)` from the filter's own outputs.
            # Never gate a job on `any_src` directly (contract Invariant 1).
            any_src:
              - 'src/**'
      - name: Compute fail-closed catch-all unmatched signal
        id: unmatched
        if: steps.green.outputs.skip != 'true'
        env:
          ANY_SRC: ${{ steps.filter.outputs.any_src }}
        run: |
          matched=false
          # Union of the SRC-BACKED filter groups ONLY (docs/corpus/e2e are non-src,
          # excluded so a data-only path can never mask an unmapped src/** change).
          for group_hit in \
            "${{ steps.filter.outputs.consolidation }}" \
            "${{ steps.filter.outputs.auth }}" \
            "${{ steps.filter.outputs.missions }}" \
            "${{ steps.filter.outputs.post_merge }}" \
            "${{ steps.filter.outputs.release }}" \
            "${{ steps.filter.outputs.status }}" \
            "${{ steps.filter.outputs.review }}" \
            "${{ steps.filter.outputs.next }}" \
            "${{ steps.filter.outputs.lanes }}" \
            "${{ steps.filter.outputs.upgrade }}" \
            "${{ steps.filter.outputs.cli }}" \
            "${{ steps.filter.outputs.charter }}" \
            "${{ steps.filter.outputs.agent }}" \
            "${{ steps.filter.outputs.kernel }}" \
            "${{ steps.filter.outputs.glossary }}" \
            "${{ steps.filter.outputs.execution_context }}" \
            "${{ steps.filter.outputs.core_misc }}" \
            "${{ steps.filter.outputs.unit }}" \
            "${{ steps.filter.outputs.specify_cli_runtime }}"; do
            if [ "$group_hit" = "true" ]; then
              matched=true
            fi
          done
          if [ "$ANY_SRC" = "true" ] && [ "$matched" = "false" ]; then
            echo "::warning::src/** change matched by NO named filter group — forcing run-all (FR-004 fail-closed catch-all). Add a named group for this directory."
            echo "unmatched=true" >> "$GITHUB_OUTPUT"
          else
            echo "unmatched=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the skip-if-green marker (tested key or matched run)
        if: steps.green.outputs.marker != '' || steps.green-key.outputs.marker != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.green.outputs.marker || steps.green-key.outputs.marker }}
          # BY OUTPUT NAME, never the whole directory: a stale JSON body must not ride along.
          path: ${{ runner.temp }}/green-match/${{ steps.green.outputs.marker || steps.green-key.outputs.marker }}.json
          retention-days: 30
          if-no-files-found: error
          # A re-run attempt re-uploads under the same name; the default would fail it.
          overwrite: true

  # ---------------------------------------------------------------------------
  # prose-scan: the PR-level "proven prose-only" verdict (mission
  # ci-prose-only-downroute-01M31T5S). A SEPARATE job from `changes`, NOT a
  # step inside it: `scripts/ci/gate_selection.py`'s single parsed authority
  # (`_GROUP_REF`) matches ONLY `needs\.changes\.outputs\.<name>` references
  # in a job's `if:` -- an output named `prose_only` living under `changes`
  # would be silently mis-parsed by that regex as a routing GROUP the moment
  # any job's `if:` referenced `needs.changes.outputs.prose_only`, corrupting
  # the src-backed-group / code-shard model the WP17 completeness oracle and
  # WP18 local parity both rely on. Keeping this output under
  # `needs.prose-scan.outputs.prose_only` means the regex never sees it.
  # `prose_only` is a pure SUBTRACTIVE aggregate (research R2): it is true
  # only when every changed path is either a proven prose-only `.py`
  # (`scripts/ci/prose_only.is_prose_only`, content-aware) or an existing
  # doc/corpus path (classified against the SAME glob set the single
  # gate-selection authority resolves, `scripts/ci/gate_selection.load_router`),
  # AND at least one changed `.py` was prose-only. Safety does NOT rest on any
  # claim that an unmapped `src/**` path can't be prose-only (it can -- a
  # docstring-only edit to an unmapped src file IS proven prose; research R2
  # retracted that reasoning). It rests on the WIRING being strictly
  # SUBTRACTIVE: every code lane keeps its own gate ANDed with
  # `prose_only != 'true'`, so `prose_only` can only ever *remove* an
  # already-selected code lane and never defeat the FR-004 `unmatched`
  # catch-all; it only ever *adds* the docs lane (see the `tests-docs.if`
  # guard below). This step (a) loads `gate_selection.load_router()` itself
  # to resolve the doc/corpus globs and does its own `git show` blob fetch,
  # then (b) hands both, plus the changed-path list, to the pure, unit-tested
  # `scripts/ci/prose_only.prose_only_pr_verdict` aggregate (architect
  # MINOR-2), which is IO-free (NFR-001): it never imports `gate_selection`,
  # shells out, or reads the router YAML itself -- both inputs are injected
  # by this step's own IO.
  # ---------------------------------------------------------------------------
  prose-scan:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: prose-only PR scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prose_only: ${{ steps.scan.outputs.prose_only }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history: this step does its own `git diff` against the PR
          # base / pre-push SHA, mirroring ci-modules.yml's generate-matrix
          # job -- a shallow clone would not contain the base commit.
          fetch-depth: 0
      # No setup-uv here (unlike the test-shard jobs): this job runs a plain
      # `python3` heredoc, so it uses the runner's default python + pip. Adding
      # setup-uv desynced `pip` from `python3` and the PyYAML install landed in
      # a different interpreter (ModuleNotFoundError: yaml). Mirror
      # ci-modules.yml's generate-matrix job exactly: checkout, pip install
      # PyYAML into the SAME python via `python3 -m pip`, then run `python3`.
      - name: Install PyYAML (verdict imports gate_selection, no editable install needed)
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"
      - name: Compute the PR-level prose-only verdict
        id: scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -uo pipefail
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$BASE_SHA" ;;
            push) base="$PUSH_BEFORE" ;;
          esac

          # Degenerate/null base (missing PR base SHA, or a push whose
          # pre-push SHA is the null SHA -- first push / force push) means no
          # trustworthy diff can be computed: fail-closed to prose_only=false,
          # mirroring ci-modules.yml's own selection-forced-full handling.
          prose_only="false"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            if diff_output="$(git diff --name-only "$base" "$HEAD_SHA" 2>/dev/null)"; then
              # The raw diff is threaded through an env var, NOT piped to
              # stdin: `python3 -` reads its OWN script text from stdin (the
              # heredoc below), so a concurrent stdin pipe would never reach
              # the script's own input reads.
              prose_only="$(SCAN_BASE_SHA="$base" SCAN_HEAD_SHA="$HEAD_SHA" SCAN_DIFF_PATHS="$diff_output" python3 - <<'PY'
          import os
          import subprocess
          import sys

          sys.path.insert(0, os.environ.get("PYTHONPATH", "."))
          from scripts.ci.gate_selection import load_router
          from scripts.ci.prose_only import prose_only_pr_verdict

          _base_sha = os.environ["SCAN_BASE_SHA"]
          _head_sha = os.environ["SCAN_HEAD_SHA"]
          _raw_paths = os.environ.get("SCAN_DIFF_PATHS", "")


          def _show(sha: str, path: str) -> str | None:
              result = subprocess.run(
                  ["git", "show", f"{sha}:{path}"],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return result.stdout


          def _blob_getter(path: str, side: str) -> str | None:
              sha = _base_sha if side == "base" else _head_sha
              return _show(sha, path)


          _paths = [line for line in _raw_paths.splitlines() if line]

          _router = load_router()
          _doc_globs = tuple(_router.filters.get("docs", ())) + tuple(_router.filters.get("corpus", ()))

          _verdict = prose_only_pr_verdict(_paths, _blob_getter, _doc_globs)

          print("true" if _verdict else "false")
          PY
              )"
            fi
          fi
          echo "prose_only=$prose_only" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Shift-left front (FR-005): the cheapest static / lint / regen gates. Every
  # one is ALWAYS-ON (no filter group) and carries NO `needs:` between the
  # front-line lint jobs, so they run in parallel and fail first / cheapest.
  # Ordered cheapest-first in declaration order.
  # ===========================================================================
  ruff:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: ruff (lint + format)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      # ruff lives in the `lint` extra, not the default groups — sync it in
      # first, or `uv run ruff` fails to spawn on a cold runner (the env has no
      # ruff). Mirrors the proven ci-quality.yml Lint job.
      - run: |
          uv sync --frozen --extra lint
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

  commit-msg:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: commit message lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - run: git log --format=%s origin/${{ github.base_ref || 'main' }}..HEAD || true

  markdownlint:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: npx --yes markdownlint-cli2 "**/*.md" || true

  uv-lock:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: uv lock --check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: uv lock --check

  import-linter:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: import boundaries (TID251)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      # ruff lives in the `lint` extra — sync it in first or `uv run ruff` fails
      # to spawn on a cold runner (env has no ruff). Mirrors the ruff job above.
      - run: |
          uv sync --frozen --extra lint
          uv run --frozen ruff check --select TID251 .

  regen-check:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: regen --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen spec-kitty regen --check

  # ---------------------------------------------------------------------------
  # FAST always-on architectural gates (FR-008 / NFR-002): terminology + the
  # layer-rule / import-direction pole. They run UNCONDITIONALLY and carry NO
  # filter group, so they add nothing to the code-scoped cone — a docs-only PR
  # still pays for them but pays for NO code shard and NOT the heavy battery.
  # ---------------------------------------------------------------------------
  terminology:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: terminology guard (fast, always-on)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest tests/architectural/test_no_legacy_terminology.py -q

  # Docs prose lint (#5426): codespell (typos + scoped US spelling) and the
  # changelog [Unreleased] style guard. Always-on because its inputs span
  # docs/**, README.md, packs/built-in/**/*.md, pyproject.toml and uv.lock,
  # which no single path group covers. Runs no pytest (duplicate-suite ledger).
  docs-lint:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: docs lint (spelling + changelog style, always-on)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen
          uv run --frozen python -m scripts.docs.check_spelling
          uv run --frozen python -m scripts.docs.check_changelog_style

  layer-rules:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: layer rules / import direction (fast, always-on)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest tests/architectural/test_layer_rules.py tests/architectural/test_pyproject_shape.py -q

  # FAST always-on archive freeze (NFR-002 / #4365): the heavy battery below is
  # CODE-SCOPED, so a docs-only PR that rewrites archived kitty-specs/**
  # dossiers in place pays for neither it nor a code shard — the exact shape
  # #4260 used to rewrite archived mission dossiers unjudged (it was a
  # docs-only PR). This gate runs the one freeze file unconditionally (~6 s
  # plus setup) so every PR shape meets the archive freeze. fetch-depth: 0
  # because the freeze test merge-bases against this repository's main and
  # reads archived history. The heavy battery deselects this file (as it does
  # terminology/layer-rules) so it is not executed twice on a code PR.
  archive-freeze:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: archive freeze (fast, always-on)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest tests/architectural/test_archive_root_byte_identical.py -q

  # FAST always-on architectural gates (FR-003, #5510): the registry-held roster
  # (special_tiers.architectural.fast_gate) of deterministic ratchet / census
  # gates, run as `--battery-part fast` so a red shows in ~2-3 min on every PR
  # shape (docs-only included; C-002). Disjoint from the two architectural-heavy
  # legs by construction (tests/architectural/test_battery_partition_proof.py).
  # No `needs:`, so it starts at pipeline start (NFR-002). fetch-depth: 0 because
  # several roster gates `git archive` historical SHAs or merge-base against main.
  # Literal `-n 4` (the registry `workers`) and no `-q`, so xdist prints
  # `created: 4/4 workers` (FR-002); the sampler records the peak memory (NFR-005)
  # and the junit feeds the timings refresh (D-29). Pinned by
  # tests/ci/test_xdist_worker_policy.py and tests/ci/test_ci_module_wiring.py.
  architectural-fast:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: architectural fast gates (ratchet/census, always-on)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Start memory sampler (NFR-005)
        run: python3 -m scripts.ci.memory_sampler start --out "$RUNNER_TEMP/memory-sampler.json"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen python -m pytest tests/architectural \
            -m "not performance and not stress and not timing" \
            -n 4 --dist loadfile \
            --deselect tests/architectural/test_no_legacy_terminology.py \
            --deselect tests/architectural/test_layer_rules.py \
            --deselect tests/architectural/test_pyproject_shape.py \
            --deselect tests/architectural/test_archive_root_byte_identical.py \
            -p scripts.ci.battery_partition_plugin --battery-part fast \
            --junitxml=out/reports/xunit-architectural-fast.xml
      - name: Report peak memory (NFR-005)
        if: always()
        run: python3 -m scripts.ci.memory_sampler stop --out "$RUNNER_TEMP/memory-sampler.json"
      - name: Upload battery junit (timings recapture source, D-29)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-router-architectural-fast-junit
          path: out/reports/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # HEAVY architectural battery (FR-004 / NFR-001): CODE-SCOPED, run as a static
  # two-leg `include:` matrix (`--battery-part 1/2`, `2/2`). Its `if:` is
  # authority #2 — the OR of every src-backed filter group PLUS the non-src
  # `architectural` group (spec-kitty#5168) and the non-src `ci_config` group
  # (FR-007: CI configuration is guarded by this battery) — so ANY code change,
  # any tests/architectural change and any CI-configuration change runs it, while
  # a docs-only PR runs NEITHER it nor a code shard. (The completeness oracle
  # asserts this OR-list equals the parsed src-backed group set
  # ∪ HEAVY_BATTERY_NON_SRC_GROUPS.) The matrix is still ONE job key, so
  # gate_selection and the oracle see one code shard (contracts/
  # router-two-authority-amendment.md A2); the two legs plus the always-on
  # `architectural-fast` job are pairwise file-disjoint
  # (tests/architectural/test_battery_partition_proof.py).
  #   * `fail-fast: false` is a literal: the gates are deterministic, and a red in
  #     one leg must not hide the other leg's reds behind a second ~10-min round trip.
  #   * the display name carries the leg (`${{ matrix.shard }}`): router-gate keys the
  #     jobs-API rows by display name, so two legs sharing a name could overwrite a
  #     red with a green.
  #   * per leg: a literal `-n 4` and no `-q` (xdist prints `created: 4/4 workers`,
  #     FR-002), the memory sampler (NFR-005), and a junit upload (D-29, timings refresh).
  # The matrix variable must be called `shard` (_gate_coverage reads it), and the leg
  # count must equal the registry `shards.shard_count`; the plugin also fails closed at
  # runtime (D-23). `label` exists because artifact names cannot contain `/`.
  # ---------------------------------------------------------------------------
  architectural-heavy:
    name: architectural battery (heavy, code-scoped) ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, prose-scan]
    if: >-
      (needs.changes.outputs.consolidation == 'true' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.missions == 'true' ||
      needs.changes.outputs.post_merge == 'true' ||
      needs.changes.outputs.release == 'true' ||
      needs.changes.outputs.status == 'true' ||
      needs.changes.outputs.review == 'true' ||
      needs.changes.outputs.next == 'true' ||
      needs.changes.outputs.lanes == 'true' ||
      needs.changes.outputs.upgrade == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.charter == 'true' ||
      needs.changes.outputs.agent == 'true' ||
      needs.changes.outputs.kernel == 'true' ||
      needs.changes.outputs.glossary == 'true' ||
      needs.changes.outputs.execution_context == 'true' ||
      needs.changes.outputs.core_misc == 'true' ||
      needs.changes.outputs.unit == 'true' ||
      needs.changes.outputs.specify_cli_runtime == 'true' ||
      needs.changes.outputs.ci_config == 'true' ||
      needs.changes.outputs.architectural == 'true') &&
      needs.prose-scan.outputs.prose_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            label: '1-of-2'
          - shard: '2/2'
            label: '2-of-2'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history: several architectural recovery/receipt tests
          # `git archive` historical mission SHAs (e.g. the WP01 base commit),
          # which a shallow (fetch-depth 1) checkout does not contain — they
          # error at setup with `git archive <sha> ... exit 128` otherwise.
          fetch-depth: 0
      - name: Start memory sampler (NFR-005)
        run: python3 -m scripts.ci.memory_sampler start --out "$RUNNER_TEMP/memory-sampler.json"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Sync dev environment
        run: uv sync --frozen --all-extras
      # Shared test-universe collection (mission shared-collection-and-shard-recapture,
      # FR-008/FR-009). A leg that holds a test requesting the universe, and the `ci`
      # module shard, collect once HERE, before pytest, and the tests reuse the stored
      # record instead of collecting again. The battery partition moves with the
      # timings, so each leg first asks the Python authority whether its own files hold
      # such a test (`consumers`, an AST scan of tests/architectural, never a file name
      # written here); a leg that holds none skips every universe step below, as the
      # module shard does with the same `select` step id and `universe` output. The
      # question is not allowed to fail quietly: no `||` and no continue-on-error, so
      # an error fails the job rather than skip the pre-step on a leg that may hold a
      # consumer (tests/ci/test_ci_workflow_prestep_shape.py pins both).
      # Order (contracts/collection-store.md): key -> restore -> collect -> save ->
      # pytest -> check. `key` prints nothing and exits 2 on a dirty checkout; the
      # empty output keeps restore and save off, and `collect` then fails the job with
      # the dirty paths, so a dirty checkout never silently disables reuse. The save
      # sits before pytest so a leg that goes red on a test is still re-runnable warm.
      # Only an exact key may restore (no restore-keys): the key is the content guard.
      # The key is the collection key plus the commit (`key --with-commit`): a stored
      # record is valid for one commit only and a cache key never changes once saved, so
      # a key without the commit could keep a record that a later commit rejects.
      - name: Decide whether this leg holds a test that collects the universe
        id: select
        shell: bash
        run: |
          universe="$(uv run --frozen python -m scripts.ci.collect_universe_prestep consumers --battery-part ${{ matrix.shard }})"
          case "$universe" in
            true | false) ;;
            *) echo "architectural-heavy: unexpected consumers answer: '$universe'" >&2; exit 1 ;;
          esac
          echo "universe=$universe" >> "$GITHUB_OUTPUT"
          echo "architectural-heavy ${{ matrix.shard }}: test-universe pre-step selected: $universe"
      - name: Compute the test-universe collection key
        id: universe-key
        if: steps.select.outputs.universe == 'true'
        shell: bash
        run: |
          key="$(uv run --frozen python -m scripts.ci.collect_universe_prestep key --with-commit)" || key=""
          echo "key=${key:+universe-$key}" >> "$GITHUB_OUTPUT"
      - name: Restore the test-universe store
        id: universe-restore
        if: steps.select.outputs.universe == 'true' && steps.universe-key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/universe-store
          key: ${{ steps.universe-key.outputs.key }}
      - name: Collect the test universe once (pre-test step)
        id: universe-collect
        if: steps.select.outputs.universe == 'true'
        shell: bash
        env:
          SK_GATE_REUSE_REPORT: ${{ runner.temp }}/universe-reuse.jsonl
        run: uv run --frozen python -m scripts.ci.collect_universe_prestep collect
      - name: Save the test-universe store
        if: steps.select.outputs.universe == 'true' && steps.universe-key.outputs.key != '' && steps.universe-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pytest_cache/universe-store
          key: ${{ steps.universe-key.outputs.key }}
      - name: Run the architectural battery leg
        env:
          SK_GATE_REUSE_REPORT: ${{ runner.temp }}/universe-reuse.jsonl
        run: |
          # Run the battery in parallel (per-worker HOME isolation via conftest,
          # --dist loadfile) — the full serial run overran the timeout. Deselect
          # the parallel-unsafe / off-PR families (performance/stress/timing),
          # matching make test-full's PARALLEL_UNSAFE_MARKERS. This leg runs only
          # its own file partition (--battery-part).
          uv run --frozen python -m pytest tests/architectural \
            -m "not performance and not stress and not timing" \
            -n 4 --dist loadfile \
            --deselect tests/architectural/test_no_legacy_terminology.py \
            --deselect tests/architectural/test_layer_rules.py \
            --deselect tests/architectural/test_pyproject_shape.py \
            --deselect tests/architectural/test_archive_root_byte_identical.py \
            -p scripts.ci.battery_partition_plugin --battery-part ${{ matrix.shard }} \
            --junitxml=out/reports/xunit-architectural-heavy-${{ matrix.label }}.xml
      - name: Check the test-universe reuse
        if: always() && steps.select.outputs.universe == 'true'
        shell: bash
        env:
          SK_GATE_REUSE_REPORT: ${{ runner.temp }}/universe-reuse.jsonl
        run: uv run --frozen python -m scripts.ci.collect_universe_prestep check
      - name: Report peak memory (NFR-005)
        if: always()
        run: python3 -m scripts.ci.memory_sampler stop --out "$RUNNER_TEMP/memory-sampler.json"
      - name: Upload battery junit (timings recapture source, D-29)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-router-architectural-heavy-${{ matrix.label }}-junit
          path: out/reports/
          if-no-files-found: warn

  # The per-group code shards for consolidation, status and cli were removed by
  # FR-008: the ci-modules.yml module rows are the sole per-PR executor of those trees.

  # ---------------------------------------------------------------------------
  # Non-code shards (data groups). docs/e2e/corpus-blocking select these; NONE is a
  # code shard, so a docs-only PR selects 0 code shards (NFR-002). The `-m corpus`
  # suite no longer runs here as a whole: packs.yml is its sole (advisory) owner
  # (FR-009), including the exit-5 floor (#3008). Only the corpus node-ids with no
  # other blocking per-PR home keep one -- `tests-corpus-blocking` below (D-13/D-22).
  # The router `corpus` filter group gates it and also feeds `prose-scan` and
  # scripts/ci/corpus_select.py (Packs' trigger).
  # ---------------------------------------------------------------------------
  tests-docs:
    name: tests (docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, prose-scan]
    if: ${{ needs.changes.outputs.docs == 'true' || needs.prose-scan.outputs.prose_only == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest tests/docs -q

  tests-e2e:
    name: tests (e2e)
    runs-on: ubuntu-24.04
    # #4207: 25m, not 35m — with the 20-iteration worktree-concurrency
    # saturation test moved to the nightly performance lane the shard
    # returns to ~8m; a 35m ceiling would only buy burn per push against
    # the CI budget (controller ruling, 2026-09-11).
    timeout-minutes: 25
    needs: [changes]
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest tests/e2e -q

  # The corpus-marked node-ids that no other required job runs (D-13/D-22). Forty of them: the
  # whole of tests/contract/test_example_round_trip.py (34) and
  # tests/integration/test_mission_review_contract_gate.py (5) -- both trees are
  # outside the module matrix -- plus the single performance-marked class
  # TestShippedProfilesPerformance (1; the other 363 corpus tests of that file already
  # run in the `charter` module row). tests/conftest.py skips that class per-PR unless
  # SPEC_KITTY_RUN_PERFORMANCE=1; its executing home is the nightly `performance` job.
  # Keeping it in this selection preserves "selected by exactly one required job".
  # Two contract modules (#5558) read the committed corpus and are listed too:
  # tests/contract/test_mission_status_reality.py (the reality check over every Mission under
  # kitty-specs/) and tests/contract/test_mission_status_payloads.py (its payload helper).
  # tests/specify_cli/migration/test_corpus_wp_snapshot_parity.py (#5579) is listed as well: its
  # module row deselects the corpus marker, so no other required job runs it.
  # The contract tool unit tests (tests/contract/test_bundle.py .. test_schema_formats.py) read no
  # corpus: they run in the separate `tests-contract-tools` job below (with them this job
  # took 7m20s of its 10 minute timeout), so this job stays well inside its timeout.
  # Packs' advisory corpus run deselects exactly these selections, so nothing
  # runs twice. Pinned by tests/ci/test_corpus_blocking_home.py; a tests/contract module that
  # neither this job nor the tool-test job runs fails tests/ci/test_contracts_workflows.py.
  # Budget (2026-10-06, #5838): 20 minutes. On 25c03e3549 the job passed 877 tests in 5m47s
  # and was still cancelled at the old 10-minute cap: setup took ~3.7 min, collection
  # ~1.5 min, and the reality-check fixture alone 157 s for 575 Missions. Runtime grows with
  # the corpus (4.5 -> 7.2 -> 10.1 min on recent main tips); #5838 tracks bounding that cost.
  tests-corpus-blocking:
    name: tests (corpus-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    if: ${{ needs.changes.outputs.corpus == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest -m "corpus and not windows_ci" \
            tests/contract/test_example_round_trip.py \
            tests/contract/test_mission_status_payloads.py \
            tests/contract/test_mission_status_reality.py \
            tests/integration/test_mission_review_contract_gate.py \
            tests/specify_cli/migration/test_corpus_wp_snapshot_parity.py \
            "tests/doctrine/test_shipped_profiles.py::TestShippedProfilesPerformance"

  # The contract tool unit tests (#5558): every corpus-marked module of tests/contract except the three that
  # `tests-corpus-blocking` owns (the directory minus those three, so a new tool test module is picked up
  # without an edit here): the example round trip, and the reality check and its payload helper, which read
  # the committed corpus. The tool tests read no corpus and used to run only in contracts.yml's path-filtered
  # `contract-tool-tests` job, which is not a required check, so a PR that broke them could auto-merge. As a router
  # job under `router-gate` they block the merge. Gated on the `corpus` group (contracts/**) or the `contract_tools`
  # group (tests/contract/** and what the tools run on); mode=full and the unmatched catch-all run it too. Packs'
  # advisory run deselects these modules and the module matrix deselects the corpus marker, so each runs once.
  # Pinned by tests/ci/test_contracts_workflows.py (every tests/contract module has exactly one home).
  tests-contract-tools:
    name: tests (contract tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: ${{ needs.changes.outputs.corpus == 'true' || needs.changes.outputs.contract_tools == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      - name: Run the contract tool unit tests
        run: |
          uv run --frozen --no-sync pytest -m "corpus and not windows_ci" tests/contract \
            --ignore=tests/contract/test_example_round_trip.py \
            --ignore=tests/contract/test_mission_status_payloads.py \
            --ignore=tests/contract/test_mission_status_reality.py \
            -n 4 --dist loadfile

  # ---------------------------------------------------------------------------
  # router-gate: terminal aggregator. `if: always() && !cancelled()` realizes
  # the FR-018/FR-019 full-mode semantics (skipped != pass) — it evaluates the
  # real result of every dependency in both PR (fail-fast) and full mode.
  # ---------------------------------------------------------------------------
  router-gate:
    name: router gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions:read is needed to read each dependency's real conclusion from the
    # Actions jobs API (#4208): the `needs` context cannot carry `timed_out`.
    permissions:
      contents: read
      actions: read
    needs:
      - changes
      - prose-scan
      - ruff
      - commit-msg
      - markdownlint
      - uv-lock
      - import-linter
      - regen-check
      - terminology
      - docs-lint
      - layer-rules
      - archive-freeze
      - architectural-fast
      - architectural-heavy
      - tests-docs
      - tests-e2e
      - tests-corpus-blocking
      - tests-contract-tools
    if: ${{ (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && always() && !cancelled() }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Evaluate router-gate decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MODE: ${{ inputs.mode || 'pr' }}
        run: |
          set -euo pipefail
          # #4208: the `needs` context collapses a timeout-kill to `cancelled`
          # (it cannot carry `timed_out`), so read each dependency's REAL
          # conclusion from the Actions jobs API and let the extracted,
          # unit-tested classifier (scripts/ci/router_gate.py) decide. The
          # blocking policy is byte-identical to the historical needs-context
          # gate ({failure, cancelled} block, {success, skipped} pass); a genuine
          # timeout is now reported distinctly. Capturing the jobs-API read into
          # a variable (not a pipe) fails the step closed under `set -e` if the
          # read errors, so an API error body is never fed to the classifier.
          API_ROWS="$(gh api --paginate \
            "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            -q '.jobs[] | [.name, (.conclusion // "")] | @tsv')"
          printf '%s\n' "$API_ROWS" | python3 scripts/ci/router_gate.py
