name: Check Shared Package Drift

on:
  pull_request:
    branches: [main, develop, "2.x"]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.kittify/release/shared-package-compatibility.json'
      - 'scripts/release/**'
      - '.github/workflows/check-spec-kitty-events-alignment.yml'
  push:
    branches: [main, develop, "2.x"]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '.kittify/release/shared-package-compatibility.json'
      - 'scripts/release/**'
      - '.github/workflows/check-spec-kitty-events-alignment.yml'
  schedule:
    # Nightly shared-package drift monitor.
    - cron: '11 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-candidate-metadata:
    name: Prepare candidate package metadata
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'pr:deferred') && !contains(github.event.pull_request.labels.*.name, 'pr:skip-ci') }}
    steps:
      - uses: actions/checkout@v6

      - name: Upload candidate package metadata
        uses: actions/upload-artifact@v7
        with:
          name: candidate-package-metadata
          path: |
            pyproject.toml
            uv.lock
            .kittify/release/shared-package-compatibility.json
          retention-days: 1

  verify-drift:
    name: Verify shared package drift
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'pr:deferred') && !contains(github.event.pull_request.labels.*.name, 'pr:skip-ci') }}
    needs: [prepare-candidate-metadata]
    steps:
      - name: Check out trusted validation scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "packaging==26.2"

      - name: Download candidate package metadata
        uses: actions/download-artifact@v8
        with:
          name: candidate-package-metadata
          path: candidate

      - name: Validate shared package drift
        run: |
          MANIFEST_ARGS=()
          if python scripts/release/check_shared_package_drift.py --help | grep -q -- '--compatibility-manifest'; then
            MANIFEST_ARGS=(
              --compatibility-manifest candidate/.kittify/release/shared-package-compatibility.json
            )
          fi

          python scripts/release/check_shared_package_drift.py \
            --pyproject candidate/pyproject.toml \
            --lockfile candidate/uv.lock \
            "${MANIFEST_ARGS[@]}"
