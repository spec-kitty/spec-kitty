name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [ main, 2.x ]
    paths:
      - 'docs/**'
      - 'kitty-specs/**'
      - '.kittify/glossaries/**'
      - 'scripts/docs/generate_kitty_specs_docs.py'
      - 'scripts/docs/seo_postprocess.py'
      - 'scripts/docs/seo_verify.py'
      - 'scripts/docs/glossary_linker.py'
      - 'scripts/docs/plantuml_render.py'
      - 'scripts/docs/plantuml_invoke.py'
      - 'scripts/docs/plantuml_pins.json'
      - 'scripts/docs/redirect_stub_generator.py'
      - 'scripts/docs/redirect_map.yaml'
      - 'scripts/docs/redirect_baseline_urls.json'
      - 'src/specify_cli/dashboard/templates/glossary.html'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Allow only one concurrent Pages deployment, but do NOT cancel an in-progress
  # one — cancelling a run mid-deploy leaves the Pages backend with a half-synced
  # deployment, and the next push then collides with "Deployment failed, try again
  # later". This matches GitHub's recommended Pages pattern (let production
  # deployments complete). Queued runs between the in-progress and latest are
  # still skipped by the group, so only the newest waiting deploy runs.
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.probe-pages.outputs.available }}
    steps:
      - name: Probe Pages configuration
        id: probe-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/pages-api-response.json"
          status="$(curl \
            --silent \
            --show-error \
            --location \
            --request GET \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::warning::GitHub Pages is not enabled; skipping docs build and deploy."
              echo "available=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::GitHub Pages configuration probe failed with HTTP $status." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Setup Pages
        id: setup-pages
        if: steps.probe-pages.outputs.available == 'true'
        uses: actions/configure-pages@v6

  build:
    runs-on: ubuntu-24.04
    needs: [pages]
    if: needs.pages.outputs.configured == 'true' && needs.pages.result == 'success'
    # The docs scripts import first-party src-layout packages: seo_postprocess.py
    # imports `kernel.clock` (src/kernel/), and glossary_linker.py / seo_verify.py
    # import `scripts.docs.*` (seo_verify transitively pulls in seo_postprocess ->
    # kernel.clock too). This job runs raw `python3 scripts/docs/*.py` without
    # installing the package, so both roots must be on PYTHONPATH or the Build and
    # Verify steps die with `ModuleNotFoundError: No module named 'kernel'`. Mirrors
    # docs-build-pr.yml's `PYTHONPATH: .`, extended with `src` for the kernel import.
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build documentation
        run: |
          python3 scripts/docs/generate_kitty_specs_docs.py
          cd docs
          docfx docfx.json
          cd ..
          python3 scripts/docs/seo_postprocess.py

      # Auto-link the first mention of every glossary term on each rendered
      # page to its anchor on the glossary page (FR-011, NFR-004). Pure HTML
      # post-processing on the DocFX render output, so it must run after
      # `docfx docfx.json` — placed alongside seo_postprocess.py and before
      # redirect-stub generation so stub pages never get glossary links
      # injected. See scripts/docs/glossary_linker.py's module docstring.
      - name: Auto-link glossary terms (FR-011)
        run: python3 scripts/docs/glossary_linker.py --site-dir docs/_site

      # Render @startyaml schema diagrams to inline SVG — AFTER glossary_linker,
      # BEFORE redirect-stub/seo_verify. Host-native stdlib-only Python; the pinned
      # jar runs ONLY inside a digest-pinned JRE under docker --network=none (zero
      # doctrine egress; no setup-java, no pip install). See the schema-diagram ADR.
      - name: Render PlantUML schema diagrams (FR-001, no-egress)
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, time, urllib.request
          pins = json.loads(pathlib.Path("scripts/docs/plantuml_pins.json").read_text())
          jar = pathlib.Path("plantuml.jar")
          if not jar.exists():
              last = None
              for attempt in range(5):  # GitHub release downloads flake with RemoteDisconnected
                  try:
                      urllib.request.urlretrieve(pins["plantuml_jar_url"], jar)
                      last = None
                      break
                  except Exception as exc:  # noqa: BLE001 - retry any transient download error
                      last = exc
                      time.sleep(2 * (attempt + 1))
              if last is not None:
                  raise SystemExit(f"plantuml.jar download failed after retries: {last}")
          got = hashlib.sha256(jar.read_bytes()).hexdigest()
          if got != pins["plantuml_jar_sha256"].lower():
              raise SystemExit(f"plantuml.jar sha256 mismatch: {got}")
          subprocess.run(["docker", "pull", pins["jre_image_digest"]], check=True)
          PY
          python3 scripts/docs/plantuml_render.py docs/_site

      # DocFX/GitHub Pages has no native redirect (FR-006). Inject a
      # <meta http-equiv="refresh"> stub at every moved old URL into the built
      # _site BEFORE upload, so no bookmarked URL 404s post-fold. The redirect
      # map is single-writer (WP07-owned), derived from occurrence_map.yaml
      # `moves:`. Runs after `Build documentation` (which emits docs/_site) and
      # before `Upload artifact`. Fails the job if any stub would point at a 404.
      - name: Inject redirect stubs into _site (FR-006)
        run: python3 scripts/docs/redirect_stub_generator.py generate --site-dir docs/_site

      # NFR-002 gate: assert every URL in WP02's committed pre-move baseline
      # resolves directly or via a live-target stub (uncovered == []). The check
      # is non-vacuous — it refuses to pass against an empty baseline.
      - name: Verify redirect coverage (NFR-002)
        run: python3 scripts/docs/redirect_stub_generator.py coverage --site-dir docs/_site

      # FR-005/FR-008/FR-012 gate: assert the *shipped* HTML carries a
      # description, a self-referential canonical, and matching Open Graph
      # values — the render-path defects no source-level check can observe.
      # Position is load-bearing (C-B9): it runs AFTER redirect-stub generation
      # and its coverage check, so it sees the stubs and can assert they are
      # correctly excluded from indexing and from sitemap.xml; and BEFORE
      # `Upload artifact`, so a metadata regression fails the build instead of
      # reaching the deployed site. Placing it earlier would
      # leave stub regressions unobserved. The verifier is strictly read-only —
      # it never mutates docs/_site.
      # Deploy-side trigger note (FR-007): this workflow — and therefore this
      # seo_verify gate — runs push-only on `main`/`2.x` (see the `on:` block
      # above: `push: [main, 2.x]` + `workflow_dispatch`, no `pull_request`
      # trigger). So a rendered-HTML SEO regression is caught at deploy time on
      # the target branches, NOT on the originating PR. This is the deploy-side
      # analogue of the docs-freshness PR-scoping gap; recorded here
      # deliberately and left verification-free (no pre-merge gate exists for
      # the DocFX render output).
      - name: Verify built-output SEO metadata (FR-005, FR-008, FR-012)
        run: python3 scripts/docs/seo_verify.py --site-dir docs/_site --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.repository == 'spec-kitty/spec-kitty' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
