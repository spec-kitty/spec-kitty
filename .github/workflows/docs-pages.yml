# ---------------------------------------------------------------------------
# Deploy the docsite to GitHub Pages (ADR docs/adr/4.x/2026-10-31-1-the-docsite-is-built-with-doc-kitty.md
# D-11, D-12, D-13 step 3; #6938 cutover, #2361 smoketest).
#
# `build` calls the ONE doc-kitty build definition, .github/workflows/docs-site-build.yml, the
# same build the required `docs-site` pull-request gate runs (D-11), with `pages-artifact: true`.
# `deploy` publishes that artifact from `main` of the core repository only. `smoketest` then
# probes the live site's URL classes, derived from the committed ledgers
# (scripts/docs/site_live_probe.py), and a mismatch turns the run red. No alert issue is filed: the
# red run is the signal (operator decision on #2361).
#
# Rollback: the legacy site generator was retired (#6943), so going back to it means reverting
# both the retirement pull request and the cutover pull request (#7558). Rolling forward is
# preferred (ADR Amendment 2026-11-12).
#
# Pinned by tests/release/test_release_ci_ownership.py (the job graph, evaluated on the real `if:`
# conditions) and tests/ci/test_fork_guard.py.
# ---------------------------------------------------------------------------
name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [ main ]
    # The inputs of the shared build: the router's `docs_site` group (ci-router.yml), which
    # tests/release/test_release_ci_ownership.py keeps a subset of this list, plus this workflow.
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/docs/_dockitty_contract.py'
      - 'scripts/docs/site_contract.py'
      - 'scripts/docs/site_built_check*.py'
      - 'scripts/docs/site_link_gates.py'
      - 'scripts/docs/site_redirects*.py'
      - 'scripts/docs/site_live_probe.py'
      - 'scripts/docs/moves_ledger.py'
      - '.github/workflows/docs-site-build.yml'
      - '.github/workflows/docs-pages.yml'
  # A plain dispatch on `main` deploys and smoketests like a push; on another branch it builds only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  # Allow only one concurrent Pages deployment, but do NOT cancel an in-progress
  # one — cancelling a run mid-deploy leaves the Pages backend with a half-synced
  # deployment, and the next push then collides with "Deployment failed, try again
  # later". This matches GitHub's recommended Pages pattern (let production
  # deployments complete). Queued runs between the in-progress and latest are
  # still skipped by the group, so only the newest waiting deploy runs.
  cancel-in-progress: false

# Fork guard: automated runs (schedule, push to main, workflow_run) are core-repo
# only. On a fork the guarded jobs skip; pull_request and workflow_dispatch still
# run everywhere. Pinned by tests/ci/test_fork_guard.py.
jobs:
  pages:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # Reads the Pages site and runs configure-pages without enablement: read only.
    permissions:
      pages: read
    outputs:
      configured: ${{ steps.probe-pages.outputs.available }}
    steps:
      - name: Probe Pages configuration
        id: probe-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/pages-api-response.json"
          status="$(curl \
            --silent \
            --show-error \
            --location \
            --request GET \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::warning::GitHub Pages is not enabled; skipping docs build and deploy."
              echo "available=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::GitHub Pages configuration probe failed with HTTP $status." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Setup Pages
        id: setup-pages
        if: steps.probe-pages.outputs.available == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

  # The doc-kitty site, built by the shared definition the pull-request gate runs (D-11). It uploads
  # the `github-pages` Pages artifact (the input's default name), which `deploy` publishes.
  build:
    needs: [pages]
    if: needs.pages.outputs.configured == 'true' && needs.pages.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-site-build.yml
    with:
      pages-artifact: true

  # Publishes only from `main` of the core repository, and only after a successful doc-kitty build.
  deploy:
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.repository == 'spec-kitty/spec-kitty' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Post-deploy smoketest (#2361): the live site, not the build. The probe derives one URL per
  # ADR D-13 class from the committed ledgers (site/url-baseline.txt, site/moves.yaml,
  # site/legacy-redirects.json), including the root, /llms.txt and a retired URL that must answer
  # 404. Its retries cover Pages propagation, under a 300 s budget per URL. A mismatch fails this
  # job and the run; nothing swallows it.
  smoketest:
    runs-on: ubuntu-24.04
    needs: [deploy]
    if: github.repository == 'spec-kitty/spec-kitty' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Probe the live site's URL classes (scripts/docs/site_live_probe.py)
        # Standard library plus PyYAML (through moves_ledger), which the runner's python3 has.
        env:
          PYTHONPATH: .:src
        run: python3 -m scripts.docs.site_live_probe https://docs.spec-kitty.ai
