# CI Aggregate — coverage/xunit artefact aggregation + diff-cover PR gate.
#
# Mission ci-pipeline-reinstatement-01M1X35E, WP10 (FR-007/FR-009; C-005;
# NFR-003).
#
# Triggered by the completion of "CI Modules" (ci-modules.yml, WP09) via
# `workflow_run` — this aggregator is a SEPARATE workflow file (GitHub Actions
# has no cross-workflow `needs:`), so it consumes the shards' already-uploaded
# `*-reports` artefacts through a cross-run `actions/download-artifact`
# (`run-id:` pointed at the triggering run) and never re-runs pytest (FR-007).
# Coverage basenames are deduped and collisions fail loudly. Its registry and
# diff come from the verified synthetic merge tree (parents must match the
# source run's immutable tested workflow reference); the trusted default-branch checkout remains
# in place. Missing source provenance fails closed.
#
# SELECTION-AWARE STALE-ARTEFACT FALLBACK (mission ci-modules-diff-scoping,
# Approach C). ci-modules.yml diff-scopes its module matrix: an UNSELECTED
# (unchanged) module's leaf is SKIPPED, not run, so `current` legitimately
# lacks its coverage file even on a fully green run. The `collect` job keeps
# the aggregate WHOLE-TREE (never shrinks its expected 19-module set) by
# reconciling per module:
#   * a SELECTED (changed) module missing from `current` -> fails closed,
#     exactly as before -- it is NEVER served from the fallback run, even
#     when the fallback has it, so a genuine shard failure on changed code
#     can never be masked by old green;
#   * an UNSELECTED (unchanged, provably byte-identical to the fallback
#     source) module missing from `current` -> backfilled from the most
#     recent successful "CI Modules" run on the branch (falling back to the
#     default branch when the PR's own branch has no prior success) --
#     `diff-cover` only scores the actual diff, which lives entirely in
#     selected/fresh modules, so backfilling unchanged coverage cannot mask a
#     regression while keeping whole-tree/Sonar coverage coherent.
# The discriminator (which modules were SELECTED) is read from the
# `selected-modules` artifact ci-modules.yml's `generate-matrix` job
# publishes. Manual `workflow_dispatch` replay downloads neither the fallback
# run nor that artifact, so it always requires complete evidence retained by
# its exact source attempt (no backfill at all) -- deliberately, so a
# hand-triggered re-aggregation never silently substitutes data the operator
# did not ask for.
#
# `mode` (pr|full) is honored in THIS workflow's own fail-fast/`needs`
# behavior: pr short-circuits the diff-cover gate the moment `collect` cannot
# resolve every registry-expected shard; full always runs the gate
# (`if: always()`) so the complete coverage/failure picture is visible even
# when a shard was red or missing (FR-018/FR-019 — verified cross-cutting by
# WP11's test_dual_mode_contract).
#
# Produces NO single merged `coverage.xml` — consumers (diff-cover here,
# sonar.yml nightly) merge per-basename `coverage-*.xml` files as needed
# (Sonar merges server-side via a comma-joined reportPaths list).

name: CI Aggregate
run-name: "CI Aggregate source ${{ github.event.workflow_run.id || inputs.source_run_id }} attempt ${{ github.event.workflow_run.run_attempt || inputs.source_run_attempt }}"

on:
  workflow_run:
    workflows: ["CI Modules"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Exact CI Modules run to aggregate.'
        required: true
        type: string
      source_run_attempt:
        description: 'Exact CI Modules run attempt to aggregate.'
        required: true
        type: string
      mode:
        description: 'pr (fail-fast) or full (run-all, if: always()) — overrides the mode inferred from the triggering "CI Modules" run''s own trigger event.'
        required: false
        default: pr
        type: choice
        options:
          - pr
          - full

concurrency:
  group: ci-aggregate-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # collect: download the exact source attempt (plus non-PR diagnostic fallback),
  # reconcile by basename with collision and completeness guards,
  # and upload the reconciled coverage set for the diff-cover job to consume.
  # ---------------------------------------------------------------------------
  collect:
    name: Collect + dedup shard artefacts (stale-fallback aware)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.resolve-mode.outputs.mode }}
      complete: ${{ steps.reconcile.outputs.complete }}
      missing: ${{ steps.reconcile.outputs.missing }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Prepare exact source registry and diff (data only; trusted checkout stays in place)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.source_run_attempt }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT" > "$RUNNER_TEMP/source-run.json"
          python3 scripts/ci/aggregate_source.py "$RUNNER_TEMP/source-run.json" \
            --repository "$SOURCE_REPOSITORY" --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_RUN_ATTEMPT"

      - name: Upload exact source data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-aggregate-source
          path: out/aggregate/source/
          if-no-files-found: error

      - name: Resolve run mode (workflow_dispatch input, else inferred from the triggering run's own trigger event)
        id: resolve-mode
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            if [ "${{ github.event.workflow_run.event }}" = "schedule" ]; then
              mode="full"
            else
              mode="pr"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ci-aggregate: resolved mode=$mode"

      - name: Select reports from executions retained by the source attempt
        id: select-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.source_run_attempt }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs?per_page=100" | jq --slurp . > "$RUNNER_TEMP/source-jobs.json"
          gh api --paginate "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" | jq --slurp . > "$RUNNER_TEMP/source-artifacts.json"
          python3 scripts/ci/select_source_artifacts.py out/aggregate/source/source.json \
            "$RUNNER_TEMP/source-jobs.json" "$RUNNER_TEMP/source-artifacts.json" >> "$GITHUB_OUTPUT"

      - name: Download the triggering run's shard artefacts
        id: download-current
        if: steps.select-current.outputs.has-artifacts == 'true'
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: ${{ steps.select-current.outputs.artifact-pattern }}
          path: out/aggregate/current
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}

      - name: Find the most-recent successful "CI Modules" run (stale-artefact fallback source)
        id: last-success
        # Mission ci-modules-diff-scoping (Approach C): generalized to PR runs
        # too, now that `current` can legitimately lack a shard because
        # diff-scoping did not SELECT it (not because it failed). The reconcile
        # step below is what keeps this safe for PR coverage: it never lets a
        # SELECTED (changed) module's missing shard resolve from `previous` --
        # only an UNSELECTED (provably byte-identical to the fallback source)
        # module may be backfilled. workflow_dispatch manual replay still
        # requires complete evidence from its exact source attempt (no
        # fallback at all): mixing a hand-picked prior run into a deliberate
        # re-aggregation would silently substitute data the operator did not
        # ask for.
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          branch="$SOURCE_BRANCH"
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci-modules.yml \
            --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$run_id" ] && [ "$branch" != "$DEFAULT_BRANCH" ]; then
            # No prior successful run on the PR's own branch (e.g. its first
            # push) -- fall back to the default branch's most recent success
            # so an UNSELECTED (unchanged) module can still be backfilled.
            run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci-modules.yml \
              --branch "$DEFAULT_BRANCH" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          fi
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download the fallback run's shard artefacts (stale shards only)
        if: steps.last-success.outputs.run-id != ''
        id: download-previous
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: '*-reports'
          path: out/aggregate/previous
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.last-success.outputs.run-id }}

      - name: Download the triggering run's selected-module set (mission ci-modules-diff-scoping)
        id: download-selected-modules
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: selected-modules
          path: out/aggregate/selected
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}

      - name: Install PyYAML (registry parsing only, no editable install needed)
        shell: bash
        run: |
          pip install --quiet --disable-pip-version-check --only-binary :all: "pyyaml==6.0.2"

      - name: Reconcile shard artefacts by basename (dedup + selection-aware stale-artefact fallback; guard collisions + completeness)
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          # Selection-aware shard reconciler extracted to a unit-tested
          # module (#4360-B): require every SELECTED shard fresh in this
          # run; UNSELECTED shards backfill-if-available, never fatal. The
          # fail-closed guard still exits non-zero on any missing shard.
          python3 scripts/ci/reconcile_shards.py

      - name: Upload reconciled coverage set
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-aggregate-reconciled-coverage
          path: out/aggregate/coverage/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # diff-cover: the real PR-blocking coverage gate (FR-009/NFR-003) — distinct
  # from Sonar's informational whole-repo new-code gate (sonar.yml, nightly).
  #
  # `if: always()` here is mode-conditioned: in `full` mode the gate always
  # runs (run-all, per FR-018/FR-019) — but ``needs.collect.outputs.complete``
  # is re-checked by this job's OWN first step (below), so `always()` never
  # silently scores an incomplete artefact set as if it were fine. In `pr`
  # mode the job-level `if:` requires BOTH `collect` to have succeeded AND
  # `complete == 'true'` — a `collect` failure (a same-run collision, or a
  # registry-expected shard missing from the exact PR attempt)
  # short-circuits the gate rather than burning runner compute on data that is
  # already known-incomplete (NFR-008).
  # ---------------------------------------------------------------------------
  diff-cover:
    name: "diff-cover PR gate (>=90% changed critical-path lines)"
    needs: collect
    permissions:
      contents: read
    if: >-
      always() &&
      (needs.collect.outputs.mode == 'full' ||
        (needs.collect.result == 'success' && needs.collect.outputs.complete == 'true'))
    runs-on: ubuntu-latest
    # Budget re-checked against the BROADENED reconciled set (mission
    # sonar-per-pr-coverage-reuse WP05/T027): once coverage breadth is applied
    # to every shard the set grows ~6x, 29.8 MB -> 166.6 MiB over 34 shard
    # files (4.8M `<line>` elements). Measured locally against a synthetic set
    # of exactly that size, built from this repository's real source tree:
    #   raw ElementTree parse of all 34 files ....  5.8 s
    #   scripts/ci/validate_diff_coverage.py .....  7.2 s  (peak RSS 2.26 GB)
    #   diff-cover over the same set ............. 6.7 s  (peak RSS 2.64 GB)
    # so the two parses this job performs cost ~14 s of a 900 s budget. The
    # budget is NOT raised: time is not the constraint here, and the real
    # headroom to watch is MEMORY -- ~2.6 GB peak against a 16 GB stock
    # ubuntu-latest runner. If the set grows several-fold again, re-measure
    # resident size before wall clock.
    timeout-minutes: 15
    steps:
      - name: Fail loudly if the reconciled shard set is incomplete (full mode's always() re-check)
        if: needs.collect.outputs.complete != 'true'
        shell: bash
        env:
          MISSING_SHARDS: ${{ needs.collect.outputs.missing }}
        run: |
          echo "::error::ci-aggregate: reconciled coverage set is INCOMPLETE (missing: $MISSING_SHARDS) -- refusing to score diff-cover over data missing from both the current and fallback runs (C-005)"
          exit 1

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build the census environment
        shell: bash
        # The census oracle (below) is a test-suite citizen: importing it pulls
        # in specify_cli (typer), pytest, and scripts.docs — so the census step
        # needs the real editable environment, not a bare interpreter. Without
        # it the step dies under `set -euo pipefail` and the diff-cover gate can
        # never go green. `--frozen --all-extras` is deterministic (uv.lock) and
        # mode-independent: the census only needs the env to import, it does not
        # exercise upstream event drift.
        run: uv sync --frozen --all-extras

      - name: Download reconciled coverage set
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ci-aggregate-reconciled-coverage
          path: out/aggregate/coverage

      - name: Install diff-cover
        shell: bash
        run: |
          uv pip install --python .venv/bin/python --only-binary :all: "diff-cover==10.3.0" "defusedxml==0.7.1"

      - name: Compute the census-dead denominator exclusion (WP02 oracle)
        id: census
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from tests.architectural._p1_census_oracle import denominator_excluded_surfaces

          surfaces = denominator_excluded_surfaces()
          excludes = "--exclude " + " ".join(f"'*/src/{surface.replace('.', '/')}*'" for surface in sorted(surfaces)) if surfaces else ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"exclude-flags={excludes}\n")
          print(f"ci-aggregate: excluding {len(surfaces)} census-dead surface(s) from the diff-cover denominator: {sorted(surfaces)}")
          PY

      - name: Download exact source diff
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ci-aggregate-source
          path: out/aggregate/source

      - name: diff-cover — critical-path, enforced (>=90%)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          coverage_files=(out/aggregate/coverage/coverage-*.xml)
          if [ "${#coverage_files[@]}" -eq 0 ]; then
            echo "::error::ci-aggregate: zero reconciled coverage files — nothing for diff-cover to score"
            exit 1
          fi
          .venv/bin/python scripts/ci/validate_diff_coverage.py \
            --diff-file=out/aggregate/source/critical.diff.patch \
            --sources=out/aggregate/source/critical-sources.json \
            --output=out/aggregate/source/statement.diff.patch \
            "${coverage_files[@]}" \
            ${{ steps.census.outputs.exclude-flags }}
          .venv/bin/diff-cover "${coverage_files[@]}" \
            --diff-file=out/aggregate/source/statement.diff.patch \
            --fail-under=90 \
            ${{ steps.census.outputs.exclude-flags }}

  # ---------------------------------------------------------------------------
  # sonar-pr: the per-change SonarCloud report (spec-kitty#4334, FR-002/FR-004).
  #
  # It REUSES the measurement `collect` already reconciled instead of running a
  # second test tier for one report (the duplicate execution retired from
  # ci-quality.yml's `sonarcloud` job). It therefore runs NO tests, and
  # deliberately carries no `uv sync` step: this job holds the publication
  # credential, and syncing would execute change-authored build configuration
  # inside it (NFR-004).
  #
  # PUBLICATION BLOCKER -- spec-kitty#4350. A green pipeline here does NOT prove
  # the report reached SonarCloud: an Automatic-Analysis conflict on the
  # `spec-kitty_spec-kitty` project can reject the upload while this job stays
  # green (it is continue-on-error by design). Read #4350 before concluding from
  # this job's status that per-change reporting is live.
  #
  # EXECUTION CONDITION (contract §C1) -- five conjuncts, ALL required. Four are
  # expressible in the job `if:` below; the fifth (credential presence) is not,
  # because the `secrets` context is unavailable in a job-level condition. All
  # five are therefore decided, independently and without short-circuiting, by
  # the extractable evaluator in this job's first step -- which is also what
  # makes the condition testable at all, since a `workflow_run` handler executes
  # only the default-branch copy of its file and so cannot run on the change
  # that introduces it (C-006).
  #
  # NO `always()`. The sibling `diff-cover` gate pairs `always()` with an
  # internal completeness re-check; copying that shape without the re-check
  # publishes a partial figure that reads as a coverage regression.
  # ---------------------------------------------------------------------------
  sonar-pr:
    name: "SonarCloud per-change report (informational; never merge-blocking)"
    needs: collect
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.collect.result == 'success' &&
      needs.collect.outputs.complete == 'true'
    # §C4, surface 1 of 3. Surface 2 is this job's absence from
    # `aggregate-gate.needs`; surface 3 (branch protection) is outside the
    # repository and is declared, never claimed.
    continue-on-error: true
    # Job-scoped ONLY: the pull-request metadata read is this job's need, and
    # granting it workflow-wide would widen `collect`/`diff-cover`'s blast
    # radius. A job-level block REPLACES the workflow-level grant, so the two
    # inherited scopes are restated here.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Evaluate the five-conjunct execution condition (§C1)
        id: gate
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # The TRIGGERING run's payload -- not this run's. `github.event_name`
          # is `workflow_run` here, so the retiring job's
          # `github.event_name == 'pull_request'` would be always false.
          SOURCE_JSON: ${{ toJSON(github.event.workflow_run) }}
          THIS_REPOSITORY: ${{ github.repository }}
          # A BOOLEAN presence signal, never the credential's value (DIR-050).
          SONAR_TOKEN_PRESENT: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          # Contract §C1. Each conjunct is decided ON ITS OWN and reported by a
          # stable slug: no short-circuiting, so the log names every unmet
          # clause rather than the first, and a clause dropped in a later edit
          # reds exactly one named test instead of perturbing a shared string.
          CONJUNCT_REASONS = {
              "pull-request-event": "the triggering run's event is not a pull request (FR-014/C-001)",
              "same-origin": "the triggering run's head repository is not this repository (FR-011/NFR-004)",
              "assembly-succeeded": "the reconciliation job did not succeed (FR-004)",
              "assembly-complete": "the reconciled coverage set is incomplete (FR-007/NFR-006)",
              "credential-present": "SONAR_TOKEN is not configured (FR-008)",
          }

          needs = json.loads(os.environ["NEEDS_JSON"] or "{}") or {}
          # `toJSON(github.event.workflow_run)` is the literal `null` on a
          # workflow_dispatch replay: fail CLOSED, a run with no triggering
          # change is not a per-change run.
          source = json.loads(os.environ["SOURCE_JSON"] or "null") or {}
          this_repository = os.environ["THIS_REPOSITORY"]
          credential_present = os.environ["SONAR_TOKEN_PRESENT"] == "true"

          collect = needs.get("collect") or {}
          head_repository = (source.get("head_repository") or {}).get("full_name")

          conjuncts = {
              "pull-request-event": source.get("event") == "pull_request",
              # An ABSENT origin signal is not a same-origin signal.
              "same-origin": isinstance(head_repository, str) and head_repository == this_repository,
              "assembly-succeeded": collect.get("result") == "success",
              # The reconciled artefact uploads even when the assembly fails and
              # `complete=false` is written BEFORE it exits, so artefact
              # presence is not evidence of completeness.
              "assembly-complete": (collect.get("outputs") or {}).get("complete") == "true",
              "credential-present": credential_present,
          }
          unmet = [name for name, held in conjuncts.items() if not held]

          for name in unmet:
              # A withheld report is a SKIP with an advisory notice, never a
              # failure -- on every conjunct, not only the credential one.
              print(f"::notice::sonar-pr: skipping the per-change report -- {CONJUNCT_REASONS[name]}")

          run = "false" if unmet else "true"
          destination = os.environ.get("GITHUB_OUTPUT")
          if destination:
              # Bare `key=value` is safe here and only here: both values are
              # drawn from the fixed slug vocabulary above, never from run data.
              with open(destination, "a", encoding="utf-8") as handle:
                  handle.write(f"run={run}\n")
                  handle.write(f"unmet={','.join(unmet)}\n")
          print(f"sonar-pr: run={run} unmet={unmet}")
          PY

      - name: Check out the trusted tree (the analysis configuration lives here)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Blame attribution and new-code detection need full history.
          fetch-depth: 0

      - name: Download the reconciled per-change coverage set
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ci-aggregate-reconciled-coverage
          path: out/aggregate/coverage

      - name: Download the validated source record
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ci-aggregate-source
          path: out/aggregate/source

      - name: Resolve the change identity and the analysis arguments (§C2/§C3)
        id: analysis
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The identity comes from the VALIDATED source record, whose
          # `pr_number` aggregate_source.py derives from the immutable
          # refs/pull/N/merge reference -- never from the mutable
          # workflow_run.pull_requests[] projection that script refuses.
          pr_number="$(python3 scripts/ci/sonar_pr_analysis.py pr-number --source out/aggregate/source/source.json)"
          # ONE authenticated read, keyed on that validated number, for the
          # branch names and the origin repository (which source.json lacks).
          gh api "repos/$THIS_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/pull-request.json"
          version="$(python3 scripts/ci/sonar_project_version.py)"
          if [ -z "$version" ]; then
            echo "::error::sonar-pr: sonar.projectVersion could not be derived from pyproject.toml" >&2
            exit 1
          fi
          python3 scripts/ci/sonar_pr_analysis.py scanner-args \
            --source out/aggregate/source/source.json \
            --pull-request "$RUNNER_TEMP/pull-request.json" \
            --properties sonar-project.properties \
            --coverage-dir out/aggregate/coverage \
            --project-version "$version"

      - name: Replace the analysed trees from the validated tested revision (§C3, NFR-008)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.analysis.outputs.pr-number }}
          TESTED_SHA: ${{ steps.analysis.outputs.tested-sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "refs/pull/${PR_NUMBER}/merge"
          # NFR-008: bind the fetched revision to the MEASURED one, loudly. An
          # unbound analysis projects line numbers onto a different tree and
          # produces a plausible, silently wrong report.
          python3 scripts/ci/sonar_pr_analysis.py verify-revision \
            --source out/aggregate/source/source.json \
            --fetched "$(git rev-parse FETCH_HEAD)"
          # Trust is an ALLOWLIST OF TWO REPLACED PATHS, not an enumeration of
          # every file the scanner might read. The working directory stays the
          # trusted checkout, so the configuration the scanner loads is
          # project-controlled. Delete first, so a deletion in the change under
          # review is honoured instead of leaving a stale trusted file behind.
          rm -rf src tests
          git checkout "$TESTED_SHA" -- src tests

      - name: SonarCloud Scan
        if: steps.gate.outputs.run == 'true'
        # SHA-pinned (DIR-051) to the SAME commit sonar.yml vets for this
        # action -- both surfaces analyze the same SonarCloud project, so the
        # pins must not drift apart (enforced by
        # tests/release/test_sonar_workflow.py).
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          # The TRUSTED checkout root. Pointing this at a subdirectory holding
          # the change's sources was refused during planning: the scanner
          # locates sonar-project.properties RELATIVE to this directory, so it
          # would load the change's OWN configuration -- the exact
          # FR-012/NFR-005 breach the subdirectory was meant to prevent.
          projectBaseDir: .
          # Every publication-governing setting, resolved from trusted content
          # by scripts/ci/sonar_pr_analysis.py and passed explicitly.
          args: ${{ steps.analysis.outputs.args }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Quality Gate (reported, not required)
        if: steps.gate.outputs.run == 'true'
        # SHA-pinned (DIR-051) -- see the scan step above.
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ---------------------------------------------------------------------------
  # aggregate-gate: the terminal verdict (contract §C4, surface 2 of 3).
  #
  # Its value is DECLARABILITY, not enforcement: job-level continue-on-error
  # already holds the run conclusion green (10 sampled runs of the retiring
  # reporter show 7 failed jobs and 10 green run conclusions), and
  # scripts/ci/fleet_verdict.py's red set does not include `cancelled`, so no
  # terminal job can rescue a run conclusion. What this job buys is a seam a
  # test can assert `sonar-pr` is EXCLUDED from -- which is what makes the
  # workflow-run-conclusion half of the non-blocking guarantee assertable at
  # all, the way tests/architectural/test_suite_jobs_gate_blocking.py's
  # NON_BLOCKING_ALLOWLIST declares ci-quality.yml's non-blocking jobs.
  #
  # Modelled on ci-router.yml's `router-gate` (skipped-tolerant), NOT
  # ci-quality.yml's `quality-gate` (strict success): both siblings here are
  # legitimately skippable -- `collect` carries its own `if:`, and `diff-cover`
  # was observed skipped in run 34842534281 -- so a verbatim port of the strict
  # form would fail the verdict on every such run.
  # ---------------------------------------------------------------------------
  aggregate-gate:
    name: CI Aggregate gate
    needs: [collect, diff-cover]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate the terminal verdict (skipped-tolerant)
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          # Set equality, not containment: a job added to `needs:` without a
          # reasoned update here is a silent widening of the merge path, and a
          # job REMOVED from it is a silent narrowing that no red would find.
          expected = {"collect", "diff-cover"}
          if set(needs) != expected:
              raise SystemExit(f"ci-aggregate gate needs changed: {sorted(needs)} (expected {sorted(expected)})")
          blocking = {job: result.get("result") for job, result in needs.items() if result.get("result") not in {"success", "skipped"}}
          if blocking:
              raise SystemExit(f"blocking job(s) did not succeed: {blocking}")
          print(f"ci-aggregate: terminal verdict green over {sorted(needs)} (skipped is not red)")
          PY
