# Packs workflow — dedicated packs/doctrine-asset verification producer.
#
# Mission ci-pipeline-reinstatement, WP14 (FR-011).
#
# Independent from the code CI (ci-router.yml / ci-quality.yml): those
# workflows exclude packs/** and tests/doctrine/** from every CODE shard (the
# `corpus` group in ci-router.yml is explicitly a non-code, data shard — see
# that file's "Non-code shards" comment) so a packs-only PR never pays for a
# code shard and a src-only PR never pays for packs work. This file is the
# other half of that split: it owns everything packs/doctrine-asset-shaped.
#
# Two lanes, gated by ONE dorny `changes` filter (Gate-1). Deliberately no
# top-level `on.*.paths` (Gate-0): #3008 (docs/convergence/interim-ci-producer.md,
# contract §Invariant 6) warns that a hand-maintained Gate-0 path list can
# silently drift out of lockstep with Gate-1 and no-op the whole workflow.
# ci-router.yml and ci-quality.yml both resolve this the same way — run on
# every PR/push, gate the actual WORK per-job off the single dorny authority.
# A src-only PR still spins up this workflow's `changes` job, but every lane
# job below reports `if: false` (skipped) — zero packs work runs (NFR-002).
#
# - **Built-in lane** (`packs/built-in/**`, PUBLIC, ships in the wheel): regen
#   `--check`, DRG `regenerate-graph --check`, the pack-manifest freshness +
#   authored-only guard, the `-m corpus` suite, and the Claude Code plugin
#   build + `claude plugin validate --strict` (zero errors AND warnings). The
#   corpus suite is the SOLE, ADVISORY owner of `-m corpus` (FR-009; router
#   `tests (corpus)` retired) EXCEPT the 40 node-ids with no other blocking per-PR
#   home, which run blocking in router `tests (corpus-blocking)` (D-13/D-22) and
#   are deselected here: `--cov=charter.offering`, four workers, trigger
#   = `built_in` UNION the router-derived `corpus` selection
#   (scripts/ci/corpus_select.py -> gate_selection.select_gates, never a
#   second glob list); advisory = job-level continue-on-error, outside
#   `packs-gate.needs`.
# - **Internal lane** (`packs/internal/**`, MAINTAINER-only, NEVER ships):
#   `spec-kitty doctrine org validate` (DRG-fragment validity + `refines`-edge
#   resolution + `org-charter.yaml` required-id validation), plus the
#   packaging-safety NEGATIVE guard proving the internal pack never ships in
#   the wheel.
#
# Plus the retired-dir `__pycache__` sweep (T076): a retired test directory
# lingering only as `__pycache__` orphans (bytecode with no live `.py`) must
# not be picked back up by pytest collection. Swept before the corpus suite
# runs. tests/architectural/test_pycache_sweep.py (T072) pins this step's
# behaviour directly against the on-disk YAML.
#
# Skip-if-green (FR-011, D-30): an EVENT-LEVEL selection-step suppression, like the fork guard --
# NOT a third CI path routing authority. On a `ready_for_review` event whose tested key already
# has a green run, the `green` step of the `changes` job (scripts/ci/green_match.py) suppresses
# the filter and corpus-selection steps, so every lane job skips and `packs-gate` posts success.
# No job `if:`, `needs:` or `changes.outputs` expression mentions it
# (contracts/router-two-authority-amendment.md A4).
name: Packs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Routing mode: pr (fail-fast, lane-scoped) or full (run-all).'
        required: false
        default: pr
        type: choice
        options:
          - pr
          - full

concurrency:
  group: packs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Fork guard: automated runs (schedule, push to main, workflow_run) are core-repo
# only. On a fork the guarded jobs skip; pull_request and workflow_dispatch still
# run everywhere. Pinned by tests/ci/test_fork_guard.py.
jobs:
  # ---------------------------------------------------------------------------
  # changes: the single gate-selection authority for this workflow (Gate-1).
  # Folds in run-all (full mode / push to main) the same way ci-router.yml's
  # `changes` job does, so `full` mode / a main push always selects both lanes.
  # ---------------------------------------------------------------------------
  changes:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    # Job-level `permissions:` REPLACES the workflow-level grant, so `contents` is restated
    # next to the `actions: read` the skip-if-green step needs (ci-modules.yml `summarize` precedent).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      built_in: ${{ (inputs.mode == 'full' || github.event_name == 'push') && 'true' || steps.filter.outputs.built_in }}
      internal: ${{ (inputs.mode == 'full' || github.event_name == 'push') && 'true' || steps.filter.outputs.internal }}
      # FR-009: the corpus lane trigger, a superset of the deleted router `tests (corpus)`
      # job's (computed by scripts/ci/corpus_select.py via the single gate-selection authority).
      corpus: ${{ (inputs.mode == 'full' || github.event_name == 'push') && 'true' || steps.corpus.outputs.selected }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history: the corpus-selection step below does a plain `git diff`
          # against the PR base, which a shallow clone would not contain.
          fetch-depth: 0
      - name: Skip-if-green on ready-for-review (selection-step suppression; FR-011)
        id: green
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/green_match.py decide --workflow packs.yml --marker-dir "$RUNNER_TEMP/green-match"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.green.outputs.skip != 'true'
        with:
          filters: |
            built_in:
              - 'packs/built-in/**'
              - 'tests/doctrine/**'
              - 'tests/architectural/test_pack_manifest_no_author_edit.py'
              - '.kittify/command-skills-manifest.json'
              - 'tests/specify_cli/regression/_twelve_agent_baseline/**'
              - 'tests/specify_cli/skills/__snapshots__/**'
              # Charter-scheme CODE the built-in pack artifacts are generated
              # from (schemas the pack manifest/DRG/generated schemas validate
              # against, and the DRG builder). A change here can leave the pack
              # regen/DRG/manifest stale, so re-run the built-in lane. (#4010)
              - 'src/charter/offering/schemas/**'
              - 'src/charter/offering/drg/**'
            internal:
              - 'packs/internal/**'
      - name: Install PyYAML (corpus selection only, no editable install)
        if: steps.green.outputs.skip != 'true'
        shell: bash
        run: |
          pip install --quiet --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"
      - name: Corpus selection via the single gate-selection authority (FR-009)
        id: corpus
        if: steps.green.outputs.skip != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          MODE: ${{ inputs.mode || 'pr' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -uo pipefail
          # A plain `git diff --name-only` (never a second dorny group: the
          # router's own `corpus` group is the one encoding, read through
          # scripts/ci/gate_selection.py). Only a pull_request has a usable base;
          # a missing/zero base or a git error leaves the outcome != success and
          # corpus_select.py fails closed to `selected=true`.
          files_json="[]"
          outcome="failure"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if diff_output="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
              files_json="$(printf '%s\n' "$diff_output" | python3 -c 'import json,sys; print(json.dumps([l for l in sys.stdin.read().splitlines() if l]))')"
              outcome="success"
            fi
          fi
          export CHANGED_FILES="$files_json" CHANGED_OUTCOME="$outcome"
          python3 scripts/ci/corpus_select.py --mode "$MODE" --event "$EVENT_NAME"

      - name: Upload the skip-if-green marker (tested key or matched run)
        if: steps.green.outputs.marker != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.green.outputs.marker }}
          # BY OUTPUT NAME, never the whole directory: a stale JSON body must not ride along.
          path: ${{ runner.temp }}/green-match/${{ steps.green.outputs.marker }}.json
          retention-days: 30
          if-no-files-found: error
          # A re-run attempt re-uploads under the same name; the default would fail it.
          overwrite: true

  # ===========================================================================
  # Built-in lane (PUBLIC, packs/built-in/** — ships in the wheel).
  # ===========================================================================
  built-in-regen-check:
    name: built-in / regen --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.built_in == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen spec-kitty regen --check
      - name: Surface remediation command on drift
        if: failure()
        run: |
          echo "::error::Generated fixtures are stale. Run: spec-kitty regen (then commit the diff)."

  built-in-drg-check:
    name: built-in / DRG regenerate-graph --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.built_in == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen spec-kitty doctrine regenerate-graph --check
      - name: Surface remediation command on drift
        if: failure()
        run: |
          echo "::error::packs/built-in DRG fragments are stale. Run: spec-kitty doctrine regenerate-graph (then commit the diff)."

  built-in-pack-manifest:
    name: built-in / pack-manifest freshness + authored-only guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    # Fires on every trigger the advisory corpus lane fires on, so deselecting
    # this guard from the corpus run (FR-009) weakens nothing.
    if: ${{ needs.changes.outputs.built_in == 'true' || needs.changes.outputs.corpus == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest tests/architectural/test_pack_manifest_no_author_edit.py -q

  built-in-corpus-suite:
    name: built-in / -m corpus suite (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    if: ${{ needs.changes.outputs.built_in == 'true' || needs.changes.outputs.corpus == 'true' }}
    # Advisory per FR-009 / operator decision DM 01M3V027T8WF0CR3D1B8VY2VZ0: the
    # sole corpus owner must not turn the PR red. JOB-level (not step-level)
    # continue-on-error: ci-fleet-verdict reads the Packs workflow-run conclusion.
    continue-on-error: true
    steps:
      # fetch-depth: 0 — the corpus suite includes the shrink-only ratchet
      # (test_transition_guard_shrink_only), which walks history to the EXP port
      # base commit; a shallow clone can't reach it and the test fails closed.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Sweep retired-dir __pycache__ orphans (T076)
        id: pycache-sweep
        run: |
          find . -depth -type d -name '__pycache__' -exec rm -rf {} +
      - run: |
          uv sync --frozen --all-extras
          # corpus exit-5 floor (#3008): "no tests collected" is a failure,
          # never a silent pass — do not swallow the exit code. Run parallel
          # (--dist loadfile, per-worker HOME isolation via conftest): ~1400
          # corpus tests serial overran the 20-min timeout. Literal `-n 4`, no
          # `-q`, so the log shows `created: 4/4 workers` (FR-002). The blocking
          # pack-manifest guard (built-in-pack-manifest) is deselected here: it
          # fires on every trigger this job fires on. The 40 corpus node-ids with no
          # other blocking per-PR home run BLOCKING in the router's
          # `tests (corpus-blocking)` job (D-13/D-22) and are deselected here (the
          # three --deselect selections below) so nothing runs twice.
          uv run --frozen pytest -m "corpus and not windows_ci" -n 4 --dist loadfile --deselect tests/architectural/test_pack_manifest_no_author_edit.py --deselect tests/contract/test_example_round_trip.py --deselect tests/integration/test_mission_review_contract_gate.py --deselect tests/doctrine/test_shipped_profiles.py::TestShippedProfilesPerformance --cov=charter.offering --cov-report=term-missing
      - name: Advisory corpus failure notice
        if: failure()
        run: |
          echo "::warning::corpus suite failed (advisory, FR-009) -- this does not block packs gate or router gate"

  built-in-plugin-validate:
    name: built-in / plugin build + claude plugin validate --strict
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: ${{ needs.changes.outputs.built_in == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.270
      - name: Build plugin bundle + claude plugin validate --strict
        run: |
          uv sync --frozen --all-extras
          if ! uv run --frozen spec-kitty plugin build --target claude-code 2>build.log; then
            echo "::error::spec-kitty plugin build (claude plugin validate --strict) failed."
            cat build.log >&2
            exit 1
          fi
          cat build.log >&2
          if grep -qi '^Warning:' build.log; then
            echo "::error::claude plugin validate --strict emitted a warning; the built-in lane requires zero errors AND zero warnings."
            exit 1
          fi

  # ===========================================================================
  # Internal lane (MAINTAINER-only, packs/internal/** — must NEVER ship).
  # ===========================================================================
  internal-org-validate:
    name: internal / DRG-fragment validity + refines-edge + org-charter required-ids
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.internal == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen spec-kitty doctrine org validate packs/internal

  internal-packaging-safety:
    name: internal / packaging-safety NEGATIVE guard (never ships)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: ${{ needs.changes.outputs.internal == 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: |
          uv sync --frozen --all-extras
          uv run --frozen pytest tests/cross_cutting/packaging/test_packaging_safety.py::test_wheel_contains_only_known_packages -q

  # ---------------------------------------------------------------------------
  # packs-gate: terminal aggregator. `if: always() && !cancelled()` realizes
  # the FR-018/FR-019 full-mode semantics (skipped != pass) in both PR
  # (fail-fast, lane-scoped skip) and full (run-all) mode.
  # ---------------------------------------------------------------------------
  packs-gate:
    name: packs gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - built-in-regen-check
      - built-in-drg-check
      - built-in-pack-manifest
      - built-in-plugin-validate
      - internal-org-validate
      - internal-packaging-safety
    if: ${{ (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && always() && !cancelled() }}
    steps:
      - name: Evaluate packs-gate decision
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MODE: ${{ inputs.mode || 'pr' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          # A lane job short-circuit-skipped by the changes filter (PR mode,
          # lane not selected) reports "skipped"; a genuinely failed one
          # reports "failure" or "cancelled". Skipped != pass, but a
          # lane-scoped skip is allowed (the lane was not selected for this diff).
          blocking = {
              job: result.get("result")
              for job, result in needs.items()
              if result.get("result") in {"failure", "cancelled"}
          }
          if blocking:
              raise SystemExit(f"blocking job(s) did not succeed: {blocking}")
          print(f"packs-gate OK (mode={os.environ['MODE']})")
          PY
