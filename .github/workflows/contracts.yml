# Contracts: validates, bundles and cross-checks the machine-readable contracts under contracts/.
# The bundle is written by the Python resolver and consumed by the JVM toolchain (validate, Java view, TypeScript client smoke);
# every job runs over the real contracts root. Node is not used anywhere (C-005), and no tool or Gradle directory is cached.
# Pytest runs in exactly one job, contract-tool-tests: the unit tests of the contract tools, which read
# no corpus. The router's corpus job runs only the modules that read committed Missions, to keep it within its time
# budget: the two modules that read the committed corpus (the reality check and its payload helper) stay there, so no
# test runs twice.
name: Contracts

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'tests/contract/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'tests/contract/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs over the real contracts tree (module mission-status); the one-module spike fixture is a test fixture only.
  CONTRACTS_ROOT: contracts

jobs:
  verify-pins:
    # A root job: it carries the canonical fork guard as the first conjunct.
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      # The manifest, every uses: pin and the install form of both contract workflow files (contracts*.yml). This job installs no tools
      # itself, so --fetch downloads each pinned artefact over https and hashes it: verify_pins refuses a run that hashed nothing
      # (CHECKSUMS_UNVERIFIED, exit 2), and --pins-only would only dodge that refusal.
      - name: Verify the pins and every pinned checksum
        run: uv run --frozen --no-sync python contracts/tools/verify_pins.py --fetch
      # The versions the JVM build declares (the generator plugin in build.gradle and in the verification metadata, any wrapper or
      # gradle-version input) must equal the versions pins.json pins and installs; a mismatch is GRADLE_PIN_MISMATCH.
      - name: Verify the build's versions equal the pinned versions
        run: uv run --frozen --no-sync python contracts/tools/gradle_pin_check.py

  python-checks:
    # A root job: it carries the canonical fork guard as the first conjunct.
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      # The nine content and hygiene checks over the real contracts tree, then the pytest scan: ten scripts, each at its defaults
      # (the enum pin check reads its committed default pin file, contracts/tools/enum_pins.json). A failing check does not hide the
      # ones after it: every script runs and the step fails if any did.
      - name: Content and hygiene checks over the real contract
        run: |
          set -u
          status=0
          uv run --frozen --no-sync python contracts/tools/layout_check.py || status=1
          uv run --frozen --no-sync python contracts/tools/citation_check.py || status=1
          uv run --frozen --no-sync python contracts/tools/provisional_check.py || status=1
          uv run --frozen --no-sync python contracts/tools/example_check.py || status=1
          uv run --frozen --no-sync python contracts/tools/event_mapping_check.py || status=1
          uv run --frozen --no-sync python contracts/tools/enum_pin_check.py || status=1
          uv run --frozen --no-sync python contracts/tools/leak_scan.py || status=1
          uv run --frozen --no-sync python contracts/tools/structure_check.py || status=1
          uv run --frozen --no-sync python contracts/tools/codeowners_check.py || status=1
          uv run --frozen --no-sync python contracts/tools/no_pytest_scan.py || status=1
          exit $status

  contract-tool-tests:
    # A root job: it carries the canonical fork guard as the first conjunct. It runs every corpus-marked module of
    # tests/contract except the three the router's corpus job owns (the directory minus those three, so a new tool test
    # module is picked up without an edit here): the reality check and its payload helper, which read the committed corpus,
    # and the example round trip, which was already a router corpus module. Unmarked modules run in the module matrix.
    # tests/ci/test_contracts_workflows.py proves every tests/contract module has exactly one home.
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      - name: Run the contract tool unit tests
        run: |
          uv run --frozen --no-sync pytest -m "corpus and not windows_ci" tests/contract \
            --ignore=tests/contract/test_example_round_trip.py \
            --ignore=tests/contract/test_mission_status_payloads.py \
            --ignore=tests/contract/test_mission_status_reality.py \
            -n 4 --dist loadfile

  validate-bundle:
    needs: verify-pins
    # A root job in the skeleton, so it keeps the canonical fork guard as the first conjunct.
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Prelude: the only Python install form (FR-018, plan D-P12).
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      # The JDK is an action pinned by SHA; Gradle and the generator plugin come from pins.json.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # Only Gradle is downloaded here: the gradle plugin comes through Gradle, and vacuum and oasdiff belong to other jobs.
      - name: Install the pinned Gradle (checksum verified before it runs)
        run: uv run --frozen --no-sync python contracts/tools/install_tools.py --pins contracts/tools/pins.json --dest "$RUNNER_TEMP/tools" --only gradle
      - name: Write the bundle of every module, validate it with the JVM toolchain and re-emit it as the Java parser reads it
        run: uv run --frozen --no-sync python contracts/tools/bundle.py --root "$CONTRACTS_ROOT" --out "$RUNNER_TEMP/bundle-out"
      # Planted negative: the build must refuse Gradle verification metadata whose checksums were tampered with.
      - name: Tampered verification metadata must be refused (planted)
        run: uv run --frozen --no-sync python contracts/tools/tamper_check.py --contracts contracts
      # Failing: a generation failure turns this job, and so contracts-gate, red.
      - name: Generate a TypeScript client from the bundle (smoke)
        run: uv run --frozen --no-sync python contracts/tools/client_smoke.py --root "$CONTRACTS_ROOT" --out "$RUNNER_TEMP/bundle-out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bundle-contracts
          path: |
            ${{ runner.temp }}/bundle-out/bundle
            ${{ runner.temp }}/bundle-out/javaview
          if-no-files-found: warn
          overwrite: true

  resolver-parity:
    needs: validate-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: bundle-contracts
          path: ${{ runner.temp }}/staged
      - name: Check that the Java view shares the bundle's inventory and cross-check every example
        run: uv run --frozen --no-sync python contracts/tools/resolver_parity.py --root "$CONTRACTS_ROOT" --bundles "$RUNNER_TEMP/staged"

  # The three jobs below run on the real contracts tree (CONTRACTS_ROOT): each writes the bundle itself with the Python
  # resolver (bundle.py --bundle-only, no JVM) and downloads only the prebuilt binary it runs, pinned in pins.json.
  lint:
    needs: validate-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      - name: Install the pinned vacuum (checksum verified before it runs)
        run: uv run --frozen --no-sync python contracts/tools/install_tools.py --pins contracts/tools/pins.json --dest "$RUNNER_TEMP/tools" --only vacuum
      - name: Write the bundle of every module
        run: uv run --frozen --no-sync python contracts/tools/bundle.py --root "$CONTRACTS_ROOT" --out "$RUNNER_TEMP/lint-out" --bundle-only
      - name: Lint every bundle with the ruleset
        run: uv run --frozen --no-sync python contracts/tools/lint_check.py --ruleset contracts/lint/ruleset.yaml --bundles "$RUNNER_TEMP/lint-out"
      # Planted proof: each planted fixture fails with exactly its own rule (declared by the '# rule: <id>' header on its first line, so a variant plant
      # may be named anything), the clean control passes under the same ruleset.
      - name: Planted violations must fail and the clean control must pass
        run: |
          set -u
          fixtures=contracts/tools/fixtures/vacuum
          status=0
          uv run --frozen --no-sync python contracts/tools/lint_check.py --file "$fixtures/clean.yaml" || status=1
          for plant in "$fixtures"/*.yaml; do
            [ "$(basename "$plant")" = clean.yaml ] && continue
            rule=$(sed -n 's/^# rule: \([A-Za-z0-9-][A-Za-z0-9-]*\)$/\1/p' "$plant" | head -n 1)
            if [ -z "$rule" ]; then echo "::error::planted $plant declares no '# rule: <id>' header"; status=1; continue; fi
            if output=$(uv run --frozen --no-sync python contracts/tools/lint_check.py --file "$plant"); then
              echo "::error::planted $rule passed the lint"; status=1
            else
              echo "$output"
              echo "$output" | grep -q "LINT_VIOLATION: $plant: $rule:" || { echo "::error::planted $rule did not fail with its own rule"; status=1; }
            fi
          done
          # FR-002: a path file declaring a non-2xx response with another content type, bundled by the real resolver.
          uv run --frozen --no-sync python contracts/tools/bundle.py --root "$fixtures/other_content_type" --out "$RUNNER_TEMP/plant-out" --bundle-only --min-paths 1
          if output=$(uv run --frozen --no-sync python contracts/tools/lint_check.py --bundles "$RUNNER_TEMP/plant-out"); then
            echo "::error::the other-content-type plant passed the lint"; status=1
          else
            echo "$output"
            echo "$output" | grep -q "LINT_VIOLATION: .*: non-2xx-is-problem:" || { echo "::error::the other-content-type plant did not fail with non-2xx-is-problem"; status=1; }
          fi
          exit $status

  breaking-change:
    needs: validate-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0  # full history and every tag: the baseline is rebuilt from the last release tag
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      - name: Install the pinned oasdiff (checksum verified before it runs)
        run: uv run --frozen --no-sync python contracts/tools/install_tools.py --pins contracts/tools/pins.json --dest "$RUNNER_TEMP/tools" --only oasdiff
      # No contract-<module>-v<semver> tag exists before the first release: that state is printed loudly and counted, never silent.
      - name: Compare every module with its last release (job summary on the first release)
        run: uv run --frozen --no-sync python contracts/tools/breaking_check.py --root "$CONTRACTS_ROOT"
      # Planted proof against the committed baseline-and-candidate fixture pairs, with the real oasdiff.
      - name: Planted breaking changes fail without a major move and pass with one
        run: |
          set -u
          fixtures=contracts/tools/fixtures/breaking_check
          check() { uv run --frozen --no-sync python contracts/tools/breaking_check.py --root "$1" --baseline-root "$fixtures/baseline"; }
          status=0
          for name in clean_same clean_minor provisional_only; do
            echo "== control $name"; check "$fixtures/candidates/$name" || { echo "::error::control $name failed"; status=1; }
          done
          for name in removed_property removed_path required_parameter narrowed_enum changed_type added_response_property added_response_allof_branch added_response_property_allof added_response_success_status added_response_error_status added_response_media_type added_response_header; do
            echo "== plant $name"
            if output=$(check "$fixtures/candidates/$name"); then
              echo "::error::planted $name passed without a major move"; status=1
            else
              echo "$output"; echo "$output" | grep -q "BREAKING_WITHOUT_MAJOR" || { echo "::error::planted $name failed for another reason"; status=1; }
            fi
            moved="$RUNNER_TEMP/moved-$name"; mkdir -p "$moved"; cp -r "$fixtures/candidates/$name/things" "$moved/things"
            sed -i 's/^  version: 1.0.0$/  version: 2.0.0/' "$moved/things/openapi.yaml"
            check "$moved" || { echo "::error::planted $name failed although the major moved"; status=1; }
          done
          echo "== plant changed_same_version"
          if output=$(check "$fixtures/candidates/changed_same_version"); then
            echo "::error::a changed bundle with the same version passed"; status=1
          else
            echo "$output"; echo "$output" | grep -q "BUNDLE_CHANGED_VERSION_SAME" || { echo "::error::wrong reason"; status=1; }
          fi
          exit $status

  release-dry-run:
    needs: validate-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      - name: Dry-run the release of every module (tag rules, bundle, checksum, gh arguments; nothing is published)
        run: uv run --frozen --no-sync python contracts/tools/release_check.py --root "$CONTRACTS_ROOT" --out "$RUNNER_TEMP/release-out"
      - name: Verify the checksum file with sha256sum
        run: cd "$RUNNER_TEMP/release-out/release/mission-status" && sha256sum -c openapi.yaml.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-mission-status
          path: ${{ runner.temp }}/release-out/release/mission-status
          if-no-files-found: error
          overwrite: true
      # Planted proof: a version without a CHANGELOG heading, a tag whose version is not the module's and a -SNAPSHOT tag all fail; the clean control passes.
      - name: Planted release errors must fail and the clean control must pass
        run: |
          set -u
          root=contracts/tools/fixtures/release_check/root
          status=0
          release() { uv run --frozen --no-sync python contracts/tools/release_check.py --root "$root" --out "$RUNNER_TEMP/planted-out" --min-paths 1 --tag "$1"; }
          release contract-clean-v1.0.0 || { echo "::error::the clean control failed"; status=1; }
          for plant in "contract-no-heading-v1.2.0 CHANGELOG_HEADING_MISSING" "contract-mismatch-v1.0.0 VERSION_MISMATCH" "contract-clean-1.0.0 TAG_FORM" "contract-absent-v1.0.0 MODULE_UNKNOWN" "contract-snapshot-v1.0.0-SNAPSHOT SNAPSHOT_RELEASE_REFUSED"; do
            set -- $plant
            if output=$(release "$1"); then
              echo "::error::planted tag $1 passed"; status=1
            else
              echo "$output"; echo "$output" | grep -q "$2" || { echo "::error::planted tag $1 did not fail with $2"; status=1; }
            fi
          done
          exit $status

  # The permanent planted proof (FR-021): every script and tool runs against its planted fixtures and must fail for the expected
  # reason, with a clean control on the same root. It needs the whole toolchain, so it installs its own. Leak-class plants and the
  # forbidden-property lint plant are assembled at run time by the driver; none is committed.
  negative-tests:
    needs: verify-pins
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - name: Install the locked Python environment
        run: uv sync --frozen --no-install-project
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned toolchain (checksum verified before anything runs)
        run: uv run --frozen --no-sync python contracts/tools/install_tools.py --pins contracts/tools/pins.json --dest "$RUNNER_TEMP/tools"
      - name: Run every planted case with its clean control
        run: uv run --frozen --no-sync python contracts/tools/run_negative_cases.py --manifest contracts/tools/negative_cases.json --work "$RUNNER_TEMP/negative-work"

  # The terminal gate: it lists the nine other jobs and fails unless every one of them succeeded.
  contracts-gate:
    needs: [verify-pins, python-checks, contract-tool-tests, validate-bundle, lint, breaking-change, resolver-parity, release-dry-run, negative-tests]
    # always() makes the job self-starting, so the canonical fork guard is required here too.
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a needed job did not succeed: $RESULTS"
              exit 1
            fi
          done
