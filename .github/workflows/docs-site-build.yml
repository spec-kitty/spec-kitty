# ---------------------------------------------------------------------------
# docs-site-build (#6937; ADR docs/adr/4.x/2026-10-31-1-the-docsite-is-built-with-doc-kitty.md
# D-11): the ONE build definition of the doc-kitty docsite. It checks the site's folder
# contract, installs site/ with the frozen lockfile (no token: doc-kitty is public), runs the
# frontmatter and source link gates and that the legacy redirect map is generated (#6933), builds
# with drafts off (site/.env.production), checks that the built site publishes no unpublished
# route (#6932), gates redirect coverage of every legacy URL twice and proves the gate's own
# verdicts on mutants (#6933), runs the built-site link gate and uploads site/dist.
#
# Diagrams (#6936) render at build time to static SVG: Mermaid through the exact-pinned
# Playwright's Chromium (site/package.json pins playwright 1.62.1, matching doc-kitty's optional,
# exact peer, so pnpm warns if the two drift), PlantUML against the `plantuml` service below, a digest-pinned
# plantuml-server in the SANDBOX security profile (it refuses every URL read, so a diagram's
# remote `!include` cannot reach the network). Before the build, doc-kitty's canary
# (dockitty-assert-plantuml-no-remote-include) proves the running service refuses a remote
# include and runs SANDBOX, and doc-kitty's dockitty-plantuml-guard proves neither the toolkit,
# the server URL nor the site config names plantuml.com. After the build, doc-kitty's
# dockitty-assert-diagrams proves every built diagram is an SVG figure with no raw, client-mode,
# error or plantuml.com residue, and the built-site check's `diagrams` surface proves each
# published page has a figure per source diagram fence. External includes stay off (doc-kitty
# #268 unused, operator ruling 2026-11-01 on #6936). This follows doc-kitty's own CI at the
# pinned commit (1042a40 ci.yml, spec-kitty/doc-kitty#314).
#
# The link gates run through scripts/docs/site_link_gates.py, which fails on any problem not
# priced in site/link-debt.json (immutable history bodies only, #7489).
#
# Callers:
#   - ci-router.yml `docs-site` (the required pull-request gate): plain artifact upload. Its
#     jobs-API row reads `docs site (doc-kitty build) / build`; router-gate classifies it.
#   - docs-pages.yml's `build` (the Pages deploy since the #6938 cutover): `with: {pages-artifact:
#     true}`, uploading the default `github-pages` Pages artifact its `deploy` publishes, so main
#     deploys the site the gate built. Its `smoketest` then probes the live site.
#
# workflow_call only: the callers own the triggers, path filters and the fork guard. Pinned by
# tests/ci/test_docs_site_job.py.
# ---------------------------------------------------------------------------
name: docs site build (shared)

on:
  workflow_call:
    inputs:
      pages-artifact:
        description: Upload site/dist as the GitHub Pages artifact (the deploy) instead of a plain artifact (the gate).
        type: boolean
        required: false
        default: false
      pages-artifact-name:
        description: The Pages artifact's name; the docs-pages.yml deploy uses the default, github-pages, which actions/deploy-pages reads by default.
        type: string
        required: false
        default: github-pages

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The job runs on the runner, not in a container, so the mapped port is a localhost port and
    # the canary can inspect the service container with the runner's docker CLI.
    services:
      plantuml:
        # Pinned by digest: a re-tag cannot swap the renderer. The multi-arch index digest of
        # jetty-v1.2026.9, the one doc-kitty v0.7.0 recommends (docs/guides/consumer-setup.md).
        # Bump the tag and the digest together, here and in the Makefile (DOCS_SITE_PLANTUML_IMAGE);
        # tests/ci/test_docs_site_job.py keeps them equal.
        image: plantuml/plantuml-server:jetty-v1.2026.9@sha256:065c66adc6728ba6dd353a29d4ada73f8358b68549a0f710c4bf46b43c103618
        ports:
          - 8091:8080
        env:
          # The image default is INTERNET (fetches over http(s)); the canary refuses anything but SANDBOX.
          PLANTUML_SECURITY_PROFILE: SANDBOX
    # Read from the process environment only (never site/.env.production): build mode is pinned,
    # so a missing Chromium fails the build instead of silently falling back to client rendering.
    env:
      DK_DIAGRAM_BUILD_RENDER: build
      DK_PLANTUML_SERVER_URL: http://localhost:8091/svg/
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check the site's folder contract against scripts/docs/_dockitty_contract.py
        # Standard library plus src/kernel (the contract reads dates through the
        # kernel.clock door), so the runner's python3 is enough (no uv sync).
        env:
          PYTHONPATH: .:src
        run: python3 -m scripts.docs.site_contract --check
      - name: Check the legacy redirect map is generated, not stale (#6933)
        # Standard library plus PyYAML (the runner's python3 has it, as docs-pages.yml relies on).
        env:
          PYTHONPATH: .:src
        run: python3 -m scripts.docs.site_redirects --check
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The pnpm version comes from site/package.json `packageManager`.
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install the site with the frozen lockfile (no token)
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Frontmatter gate (doc-kitty, published and draft pages)
        working-directory: site
        run: pnpm exec dockitty-validate-frontmatter ../docs --astro-config astro.config.mjs
      - name: Source link gate (strict; immutable-body debt priced in site/link-debt.json, #7489)
        working-directory: site
        env:
          PYTHONPATH: ..:../src
        run: python3 -m scripts.docs.site_link_gates check-links -- pnpm exec dockitty-check-links ../docs --strict --astro-config astro.config.mjs
      - name: Wait for the PlantUML server
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8091/; then echo "PlantUML ready"; exit 0; fi
            echo "waiting for PlantUML ($i/30)..."; sleep 2
          done
          echo "PlantUML did not become ready on :8091" >&2; exit 1
      - name: Resolve the pinned Playwright version
        id: playwright
        working-directory: site
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the Chromium download
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for build-time diagrams (the pinned Playwright's revision)
        # Retried with a pause: one 403 from the download host failed a doc-kitty deploy (doc-kitty #117).
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: site
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install chromium; then exit 0; fi
            echo "Chromium download failed (attempt $attempt/3)" >&2
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Install Chromium system dependencies
        working-directory: site
        run: pnpm exec playwright install-deps chromium
      - name: Prove the PlantUML server refuses remote includes (canary, SANDBOX profile)
        # The service reaches the runner at its Docker network gateway; the check first proves the
        # canary is reachable from inside the service, then that two remote-include fixtures render
        # as errors with zero canary hits, then reads the container's security profile and ports.
        working-directory: site
        run: |
          GATEWAY=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' "${{ job.services.plantuml.id }}")
          pnpm exec dockitty-assert-plantuml-no-remote-include --service-container "${{ job.services.plantuml.id }}" --canary-host "$GATEWAY" --astro-config astro.config.mjs
      - name: Prove no PlantUML diagram can reach plantuml.com (doc-kitty plantuml-guard)
        # dockitty-plantuml-guard (doc-kitty 1042a40, #314): the installed toolkit's lib/ names no
        # plantuml.com URL and defaults to a self-hosted server, the effective DK_PLANTUML_SERVER_URL
        # is not plantuml.com, and the site config (read as text) names no plantuml.com URL.
        working-directory: site
        run: pnpm exec dockitty-plantuml-guard --astro-config astro.config.mjs
      - name: Build the docsite (drafts off via site/.env.production; diagrams rendered at build time)
        working-directory: site
        run: pnpm run build
      - name: Prove every built diagram was drawn at build time (doc-kitty assert-diagrams)
        # dockitty-assert-diagrams (doc-kitty 1042a40, #314) owns the built-markup rules: every
        # dk-diagram figure holds an <svg>; no raw diagram code block, client-mode <pre class="mermaid">,
        # plantuml-error block or plantuml.com URL the page would load. It reads no site config, so it
        # takes no --astro-config. The per-route figure count stays in the built-site check below.
        working-directory: site
        run: pnpm exec dockitty-assert-diagrams dist
      - name: "Check the built site: no unpublished route (#6932), a figure per published diagram fence (#6936)"
        # Standard library plus src/kernel, like the contract check above.
        env:
          PYTHONPATH: .:src
        run: python3 -m scripts.docs.site_built_check site/dist --docs docs
      - name: Redirect coverage, drafts excused only through the declared map (#6933)
        working-directory: site
        run: pnpm exec dockitty-check-redirect-coverage url-baseline.txt dist --docs ../docs --declared-redirects legacy-redirects.json --astro-config astro.config.mjs
      - name: Redirect coverage, nothing excused (#6933; ADR D-5 "No silent excuse")
        working-directory: site
        run: pnpm exec dockitty-check-redirect-coverage url-baseline.txt dist --astro-config astro.config.mjs
      - name: Prove the redirect gate's verdicts on mutants of a hard-linked copy of the site (#6933)
        env:
          PYTHONPATH: .:src
        run: python3 -m scripts.docs.site_redirects_selftest site/dist
      - name: Built-site link gate (immutable-body debt priced in site/link-debt.json, #7489)
        working-directory: site
        env:
          PYTHONPATH: ..:../src
        run: python3 -m scripts.docs.site_link_gates built-links -- pnpm exec dockitty-assert-no-broken-links dist --base / --site https://docs.spec-kitty.ai --docs ../docs --astro-config astro.config.mjs
      - name: Probe the built site over local HTTP, the post-deploy smoketest's live-site probe (#6938, #2361)
        # The URL classes of ADR D-13, derived from the ledgers, against site/dist served on
        # loopback: a ledger change that drops a class, or a build that stops answering one, fails
        # here and not in the production smoketest after a deploy. Loopback answers in well under a second.
        timeout-minutes: 1
        env:
          PYTHONPATH: .:src
        run: |
          python3 -m http.server 8092 --bind 127.0.0.1 --directory site/dist >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8092/; then break; fi
            sleep 0.5
          done
          python3 -m scripts.docs.site_live_probe http://127.0.0.1:8092 --attempts 1
      - name: Upload the built site
        if: ${{ !inputs.pages-artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site-${{ github.run_attempt }}
          path: site/dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload the built site as the Pages artifact
        if: ${{ inputs.pages-artifact }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ inputs.pages-artifact-name }}
          path: site/dist
