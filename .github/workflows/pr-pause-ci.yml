# pr:pause-ci -- immediate effect of the label (the `if:` guards in every PR workflow
# only act on runs that START after the label is applied).
#
# SECURITY: `pull_request_target` runs with a write-capable token in the base-repo
# context, so this workflow NEVER checks out or executes PR code. It uses only the
# preinstalled `gh` CLI and passes event values through `env:` (never interpolated
# into the script body).
#
#   labeled   -> cancel every queued/in-progress run for the PR head SHA, and post a
#                failing check run under each required gate name so a PR whose gates
#                were already green stops being mergeable at once.
#   unlabeled -> re-run every cancelled run for the PR head SHA. Events caused by
#                `GITHUB_TOKEN` (a close/reopen, a push) start no workflow runs, so a
#                re-run is the only resume this token can trigger. A re-run replays the
#                ORIGINAL payload: runs the pause cancelled started before the label and
#                resume cleanly; a run that started while labelled pauses again, so after
#                a push made under the label, push again (or close and reopen the PR by
#                hand) once the label is off. When the head moved after the label came off
#                (a push), the re-run is skipped: the new head's runs are current, and an old
#                head's re-run would cancel them through the shared concurrency group.
name: PR Pause CI

on:
  pull_request_target:
    types: [labeled, unlabeled]

concurrency:
  group: pr-pause-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pause:
    if: ${{ github.repository == 'spec-kitty/spec-kitty' && github.event.label.name == 'pr:pause-ci' && github.event.action == 'labeled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OWN_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel queued and in-progress runs for the head commit
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress waiting pending requested; do
            gh run list --repo "$REPO" --commit "$HEAD_SHA" --status "$status" \
              --json databaseId -q '.[].databaseId' --limit 200 | while read -r id; do
              [ "$id" = "$OWN_RUN_ID" ] && continue
              gh run cancel "$id" --repo "$REPO" || echo "run $id already finished"
            done
          done
      - name: Fail the required gates for the head commit
        shell: bash
        run: |
          set -euo pipefail
          for gate in "router gate" "CI Modules gate" "Clean install verification"; do
            gh api "repos/$REPO/check-runs" -X POST \
              -f name="$gate" -f head_sha="$HEAD_SHA" \
              -f status=completed -f conclusion=failure \
              -f 'output[title]=CI is paused by the pr:pause-ci label' \
              -f 'output[summary]=CI is paused on this PR by the pr:pause-ci label; remove the label to run CI.'
          done

  resume:
    if: ${{ github.repository == 'spec-kitty/spec-kitty' && github.event.label.name == 'pr:pause-ci' && github.event.action == 'unlabeled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Re-run the runs the pause cancelled for the head commit
        shell: bash
        run: |
          set -euo pipefail
          # A push after the label came off already started fresh runs on the new head. Re-running the
          # old head's runs would join the same concurrency group and cancel those, so skip when the
          # head moved.
          live="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)"
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "head moved to $live since the label was removed; its own runs are current, nothing to re-run"
            exit 0
          fi
          gh run list --repo "$REPO" --commit "$HEAD_SHA" --status cancelled \
            --json databaseId,event -q '.[] | select(.event == "pull_request") | .databaseId' --limit 200 \
            | while read -r id; do
              gh run rerun "$id" --repo "$REPO" || echo "run $id could not be re-run"
            done
