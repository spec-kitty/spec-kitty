# Sonar workflow -- net-new (`introduced`), WP12 of ci-pipeline-reinstatement-01M1X35E
# (C-008/FR-010; contracts/artefact-naming.md).
#
# Restores SonarCloud scanning -- fully removed at Convergence -- as an
# INFORMATIONAL nightly/workflow_dispatch producer. This is a SEPARATE workflow
# file with no `pull_request` trigger, so it structurally cannot enter any PR
# merge-blocking `needs:` chain (never gates a merge). Fork-safe: without a
# `SONAR_TOKEN` repository secret the job SKIPS-GREEN (an advisory notice, never a
# hard failure) -- see the "Check Sonar token availability" step below and
# kitty-specs/ci-pipeline-reinstatement-01M1X35E/sonar-identity-verification.md
# (T064 fork-safe precedent: NFR-004's `skip_drift` on a missing token).
#
# Identity (2026-09-14): the `spec-kitty_spec-kitty` project / `spec-kitty`
# organization, matching the `spec-kitty/spec-kitty` repository the `SONAR_TOKEN`
# secret was reprovisioned for, and verified live as public + actively analyzed
# against the SonarCloud API. This supersedes the prior `Priivacy-ai_spec-kitty` /
# `priivacy-ai` identity (the cross-org-rename question T062/C-008 had left open).
# `sonar-project.properties` carries this identity; this workflow reads it from there.
#
# Artefact aggregation (contracts/artefact-naming.md): this workflow runs when a
# "CI Nightly" run on main completes (`workflow_run`, #7531), or on
# `workflow_dispatch`. Its coverage comes from the CI Nightly full module matrix
# (every registry shard, `module-tests-*-reports`), never from the diff-selected
# "CI Modules" push run, which covers only the touched modules. On `workflow_run`
# the job checks out the triggering run's `head_sha` and binds coverage to that
# run alone; on dispatch it lists CI Nightly runs at the checked-out revision.
# Either way the revision is the provenance key: only completed CI Nightly runs
# (success, or failure because some suite is red) whose `head_sha` is EXACTLY the
# checked-out revision (and, when the ref is a branch, whose `head_branch` is that
# branch) may supply coverage; on dispatch a second such run at the SAME revision
# may fill missing basenames. Completeness fails closed: unless every shard that
# .github/ci-module-registry.yml expands has a report, the scan runs WITHOUT
# coverage and a `::warning::` names the missing shards, so no partial
# percentage is ever published. Coverage from
# a newer/different revision, another branch, or a superseded run attempt is never
# merged into the scan. When no matching run (or no matching coverage report) is
# available, the scan still runs informational with a clear `::warning::` and zero
# coverage paths -- it never silently substitutes another revision's report. The
# selection and reconciliation decisions live in the tested helper
# scripts/ci/sonar_coverage_provenance.py. Coverage basenames are deduped by
# basename (current-run wins; same-revision fallback fills gaps) and comma-joined
# into `sonar.python.coverage.reportPaths` -- Sonar merges server-side, so NO single
# merged coverage.xml is produced here (matches ci-aggregate.yml's own consumer
# note). `sonar.python.xunit.reportPath` is deliberately NOT wired (decision
# recorded in sonar-identity-verification.md's "xunit gap" section) -- this WP
# aggregates coverage only.
#
# Per-PR promotion path (SC-007, no rearchitecture): documented in
# sonar-identity-verification.md -- switching to a pull_request/workflow_run
# trigger and reusing ci-aggregate.yml's own reconciled artefact is the only
# change needed; the naming contract already supports it.
#
# `mode` (pr|full, default pr) is threaded through workflow_dispatch for
# forward-compat with WP11's cross-cutting dual-mode contract
# (tests/architectural/test_dual_mode_contract.py, not yet merged into this
# lane) -- this workflow has no pull_request trigger and a single job, so there
# is no per-mode fail-fast/needs: branch to gate; the resolved mode is
# logged for visibility only, and every step here runs run-all/`if: always()`
# per FR-018/FR-019's full-mode semantics (a nightly/dispatch producer with no
# PR fail-fast short-circuit to honor).

name: Sonar

on:
  # The CI Nightly full module matrix produces this scan's coverage (#7531), so the
  # scan follows it rather than racing it on its own cron.
  workflow_run:
    workflows: ['CI Nightly']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr (fail-fast) or full (run-all) -- forward-compat with the reinstated-workflow dual-mode contract (WP11); this single-job informational workflow always runs full/if: always() regardless.'
        required: false
        default: pr
        type: choice
        options:
          - pr
          - full

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

# Fork guard: automated runs (schedule, push to main, workflow_run) are core-repo
# only. On a fork the guarded jobs skip; pull_request and workflow_dispatch still
# run everywhere. Pinned by tests/ci/test_fork_guard.py.
jobs:
  scan:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    name: SonarCloud scan (informational, after CI Nightly or on dispatch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve run mode (visibility only -- no per-mode branch in this single-job workflow)
        id: resolve-mode
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            mode="full"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sonar: resolved mode=$mode (informational only -- this workflow has no PR fail-fast branch to gate)"

      - name: Check Sonar token availability (fork-safe skip-green)
        id: sonar_token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::sonar.yml: SONAR_TOKEN is not configured -- skipping analysis (fork-safe, advisory-only). See kitty-specs/ci-pipeline-reinstatement-01M1X35E/sonar-identity-verification.md for the verified project/org identity and how to provision the secret."
          fi

      - name: Check out repository
        if: steps.sonar_token.outputs.enabled == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          # The triggering CI Nightly run's revision (empty on dispatch: the dispatched ref).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve the checked-out source revision for coverage provenance
        id: source
        if: steps.sonar_token.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          branch=""
          case "$GITHUB_REF" in
            refs/heads/*) branch="${GITHUB_REF#refs/heads/}" ;;
          esac
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          echo "sonar: coverage provenance bound to source revision $sha${branch:+ on branch $branch}"

      - name: List completed "CI Nightly" runs at this exact source revision
        id: module-runs
        if: steps.sonar_token.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          RUNS_JSON: ${{ runner.temp }}/ci-modules-runs.json
        with:
          script: |
            // Query by head_sha, not by branch newest-first: the revision is the
            // provenance key. The tested selector validates every returned run
            // again (head_sha, head_branch, status/conclusion, run attempt), so a
            // mocked or unexpectedly broad API response cannot widen the binding.
            // On workflow_run the triggering CI Nightly run is the only candidate.
            // A CI Nightly run is red whenever any suite is, while its module
            // shards still upload coverage, so completed runs are listed and the
            // registry completeness check decides whether the coverage is usable.
            const fs = require('fs');
            if (context.eventName === 'workflow_run') {
              fs.writeFileSync(process.env.RUNS_JSON, JSON.stringify({ workflow_runs: [context.payload.workflow_run] }));
              core.info(`sonar: bound to triggering CI Nightly run ${context.payload.workflow_run.id}`);
              return;
            }
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-nightly.yml',
              head_sha: process.env.SOURCE_SHA,
              status: 'completed',
              per_page: 100,
            };
            if (process.env.SOURCE_BRANCH) params.branch = process.env.SOURCE_BRANCH;
            const { data } = await github.rest.actions.listWorkflowRuns(params);
            fs.writeFileSync(process.env.RUNS_JSON, JSON.stringify(data));
            core.info(`sonar: fetched ${data.workflow_runs.length} completed CI Nightly run(s) for head_sha=${process.env.SOURCE_SHA}${process.env.SOURCE_BRANCH ? ` on ${process.env.SOURCE_BRANCH}` : ''}`);

      - name: Select runs at exactly this source revision (deterministic, same-branch only)
        id: current-run
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
          RUNS_JSON: ${{ runner.temp }}/ci-modules-runs.json
        run: |
          set -euo pipefail
          args=(--runs "$RUNS_JSON" --source-sha "$SOURCE_SHA" --accept-failed --output "$GITHUB_OUTPUT")
          if [ -n "$SOURCE_BRANCH" ]; then
            args+=(--branch "$SOURCE_BRANCH")
          fi
          if ! python3 scripts/ci/sonar_coverage_provenance.py select "${args[@]}"; then
            echo "::warning::sonar: could not bind coverage to source revision $SOURCE_SHA; scanning WITHOUT coverage rather than reusing another revision's report."
            {
              echo "run_id="
              echo "fallback_run_id="
              echo "coverage_available=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Download current-run shard artefacts (exact source revision)
        id: download-current
        if: steps.sonar_token.outputs.enabled == 'true' && steps.current-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: '*-reports'
          path: out/reports/artifacts/current
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.current-run.outputs.run_id }}

      - name: Download fallback-run shard artefacts (same source revision only)
        id: download-previous
        if: steps.sonar_token.outputs.enabled == 'true' && steps.current-run.outputs.fallback_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: '*-reports'
          path: out/reports/artifacts/previous
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.current-run.outputs.fallback_run_id }}

      # The registry completeness check reuses scripts/ci/reconcile_shards.py's parser, which needs PyYAML
      # (the same pin ci-nightly.yml's matrix generation installs). A failed install must not red this
      # informational scan: the reconcile step below then fails closed and scans WITHOUT coverage.
      - name: Install PyYAML for the registry completeness check
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        run: |
          pip install --quiet --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"

      - name: Reconcile coverage basenames (same-revision dedup, every registry shard required) -> comma-joined reportPaths
        id: coverage
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if ! python3 scripts/ci/sonar_coverage_provenance.py reconcile \
            --current out/reports/artifacts/current \
            --fallback out/reports/artifacts/previous \
            --registry .github/ci-module-registry.yml \
            --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_OUTPUT"; then
            echo "::warning::sonar: coverage reconciliation failed; scanning WITHOUT coverage rather than reusing an unverified report."
            echo "report-paths=" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive sonar.projectVersion from pyproject.toml
        id: version
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "
          import re
          text = open('pyproject.toml', encoding='utf-8').read()
          match = re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', text)
          if not match:
              raise SystemExit('sonar.projectVersion could not be derived: no version= in pyproject.toml')
          print(match.group(1))
          ")"
          if [ -z "$version" ]; then
            echo "::error::sonar.projectVersion could not be derived from pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sonar: resolved sonar.projectVersion=$version (from pyproject.toml)"

      # The acceptance-jvm Java test scaffolding is scanned here, nightly only,
      # with Sonar's full Java rule set (quality and security), which needs
      # compiled classes. This scan runs on trusted, already-merged code. The
      # per-PR sonar-pr job (ci-aggregate.yml) leaves the Java out: compiling a
      # PR's own Gradle build there would run untrusted build code beside
      # SONAR_TOKEN. sonar-project.properties keeps acceptance-jvm out of the
      # coverage figure. If the JDK setup or the compile fails, the Python scan
      # still runs.
      #
      # The Java is analysed as MAIN code (`sonar.sources`) on purpose, not as
      # test code, so the full Java rule set, security rules included, applies to
      # it. It is excluded from the coverage figure only (sonar.coverage.exclusions).
      - name: Set up JDK 25 (Temurin) for the acceptance-jvm Java analysis
        id: jdk
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # install_tools.py is the pinned contract-tools extra of spec-kitty-events (#6915): the locked Python
      # environment runs scripts/sync_services.py, which fetches, verifies and unpacks it. Soft like the JDK step:
      # if any of these fails, the Python scan still runs.
      - name: Install uv for the pinned contract tools
        id: uv
        if: always() && steps.sonar_token.outputs.enabled == 'true' && steps.jdk.outcome == 'success'
        continue-on-error: true
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Install the locked Python environment for the pinned contract tools
        id: pyenv
        if: always() && steps.sonar_token.outputs.enabled == 'true' && steps.uv.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: uv sync --frozen --no-install-project

      - name: Sync the pinned service extras (contract tools)
        id: service_extras
        if: always() && steps.sonar_token.outputs.enabled == 'true' && steps.pyenv.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/sync-services
        with:
          extras-only: 'true'

      # The Gradle distribution is restored from a cache keyed on the pinned
      # archive, but a cache entry is never trusted blindly: gradle_tool_cache.py
      # re-hashes the restored tree against the manifest written after the
      # canonical checksum-verified install, and reinstalls on any mismatch.
      # Only build tools and dependency artefacts are cached -- never test results
      # or acceptance-jvm/build output. Gradle verifies cached dependency bytes
      # against acceptance-jvm/gradle/verification-metadata.xml on use.
      - name: Restore the pinned Gradle tool cache (checksum-verified on restore)
        id: gradle_tool_cache
        if: always() && steps.sonar_token.outputs.enabled == 'true' && steps.service_extras.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tools
          key: gradle-tool-${{ runner.os }}-${{ hashFiles('acceptance-jvm/tools/pins.json') }}

      - name: Restore the Gradle dependency cache (never test results)
        id: gradle_deps_cache
        if: always() && steps.sonar_token.outputs.enabled == 'true' && steps.service_extras.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('acceptance-jvm/tools/pins.json', 'acceptance-jvm/build.gradle', 'acceptance-jvm/settings.gradle', 'acceptance-jvm/gradle/verification-metadata.xml') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Install the pinned Gradle (checksum verified; cache re-verified before use)
        id: gradle
        if: always() && steps.sonar_token.outputs.enabled == 'true' && steps.service_extras.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tools="$(PYTHONPATH="$GITHUB_WORKSPACE/src" uv run --frozen --no-sync python scripts/sync_services.py --extras-path read-service:contract_tools)/contracts/tools"
          uv run --frozen --no-sync python scripts/ci/gradle_tool_cache.py ensure --pins acceptance-jvm/tools/pins.json --dest "$RUNNER_TEMP/tools" --installer "$tools/install_tools.py"

      - name: Compile the acceptance-jvm Java for analysis
        id: java
        if: always() && steps.sonar_token.outputs.enabled == 'true' && steps.gradle.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gradle -p acceptance-jvm compileTestJava --no-daemon
          {
            echo "args=-Dsonar.sources=src,acceptance-jvm/src/test/java"
            echo "binaries=acceptance-jvm/build/classes/java/test"
            echo "libraries=$HOME/.gradle/caches/modules-2/files-2.1/**/*.jar"
          } >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.python.coverage.reportPaths=${{ steps.coverage.outputs.report-paths }}
            ${{ steps.java.outcome == 'success' && format('{0} -Dsonar.java.binaries={1} -Dsonar.java.libraries={2}', steps.java.outputs.args, steps.java.outputs.binaries, steps.java.outputs.libraries) || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Informational, like its siblings: a red quality gate is reported on the step (and in SonarCloud), but it does not
      # turn the nightly Sonar run red. The scan above is what must succeed; the gate verdict on new code is debt
      # tracked in the issue tracker (#2970, #4304), not a workflow failure.
      - name: SonarCloud Quality Gate (informational; never PR-blocking)
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        id: quality_gate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The gate no longer fails the run, so surface its verdict where a reader of the run sees it.
      - name: Report the quality-gate verdict
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        shell: bash
        env:
          GATE_STATUS: ${{ steps.quality_gate.outputs.quality-gate-status }}
          GATE_OUTCOME: ${{ steps.quality_gate.outcome }}
        run: |
          status="${GATE_STATUS:-unknown (gate step outcome: ${GATE_OUTCOME})}"
          echo "### SonarCloud quality gate: ${status}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${GATE_STATUS}" != "PASSED" ]; then
            echo "::warning::SonarCloud quality gate on new code: ${status} (informational; see SonarCloud and #2970, #4304, #7113)"
          fi
