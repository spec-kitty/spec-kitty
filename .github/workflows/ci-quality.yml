name: CI Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Run ruff checks
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.12'
      - name: Build wheel
        run: |
          uv build --wheel
          ls -la dist/
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: spec-kitty-cli-wheel
          path: dist/spec_kitty_cli-*.whl
          retention-days: 7

  clean-install-verification:
    name: Clean install verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-wheel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download CLI wheel
        uses: actions/download-artifact@v4
        with:
          name: spec-kitty-cli-wheel
          path: dist/
      - name: Create clean venv
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/pip" install --upgrade pip
      - name: Install CLI from wheel
        run: |
          "$RUNNER_TEMP/clean-venv/bin/pip" install dist/spec_kitty_cli-*.whl
          "$RUNNER_TEMP/clean-venv/bin/pip" list
      - name: Assert spec-kitty-runtime is not installed
        run: |
          if "$RUNNER_TEMP/clean-venv/bin/pip" show spec-kitty-runtime >/dev/null 2>&1; then
            echo "::error::spec-kitty-runtime is installed; the clean-install contract regressed."
            exit 1
          fi
      - name: Assert no runtime import side effect
        run: |
          "$RUNNER_TEMP/clean-venv/bin/python" -c "
          import sys
          import specify_cli
          leaked = [name for name in sys.modules if 'spec_kitty_runtime' in name]
          assert not leaked, f'spec_kitty_runtime imported: {leaked}'
          "
      - name: Run spec-kitty next against fixture mission
        run: |
          cp -r tests/fixtures/clean_install_fixture_mission "$RUNNER_TEMP/fixture"
          cd "$RUNNER_TEMP/fixture"
          git init -q
          git -c user.email=ci@test -c user.name=ci add -A
          git -c user.email=ci@test -c user.name=ci commit -q -m "fixture mission"
          "$RUNNER_TEMP/clean-venv/bin/spec-kitty" next \
            --agent claude \
            --mission clean-install-fixture-01KQ22XX \
            --json | tee "$RUNNER_TEMP/next.json"
          "$RUNNER_TEMP/clean-venv/bin/python" -c "
          import json
          import pathlib
          payload = json.loads(pathlib.Path('$RUNNER_TEMP/next.json').read_text())
          assert isinstance(payload, dict), payload
          "

  uv-lock-check:
    name: uv lock --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.12'
      - name: Assert uv.lock is up to date
        run: uv lock --check

  sonarcloud:
    name: SonarCloud (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Per-PR reporter ONLY. Both Sonar surfaces resolve the same
    # sonar.projectKey from sonar-project.properties, and SonarCloud holds one
    # current analysis per branch -- if this fast-tier-only scan also ran on
    # pushes to main, it would outpace sonar.yml's nightly (0 3 * * *)
    # full-coverage aggregation and become main's standing branch analysis,
    # degrading the new-code baseline every PR is measured against. The
    # nightly owns main; this job owns the per-PR view (spec-kitty#3993).
    # Reinstated per spec-kitty#3993 (owner ruling 2026-09-06: "There's no
    # discussion on Sonar, it was not meant to be permanently removed. It
    # should be reinstated."). The convergence-era workflow deletion
    # (e8cc2f444, 2026-08-27) removed the only coverage / new-code quality
    # signal this repository's CI had. This job re-adds it as a NON-BLOCKING
    # reporter: it runs the fast tier under pytest --cov, uploads the report
    # to SonarCloud keyed by the SONAR_TOKEN repository secret, and reports
    # the quality-gate status — but continue-on-error keeps a Sonar verdict
    # off the merge path, and quality-gate.needs deliberately does NOT
    # include this job (the reasoned declaration lives in
    # tests/architectural/test_suite_jobs_gate_blocking.py's
    # NON_BLOCKING_ALLOWLIST).
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Check Sonar token availability
        id: sonar_token
        env:
          # Env-mapped (never interpolated into the script text) so the
          # secret value and any expression never touch the shell command.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not configured — skipping SonarCloud analysis (spec-kitty#3993)."
          fi

      - name: Check out repository
        if: steps.sonar_token.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          # SonarCloud new-code detection and blame attribution need full
          # history, not the default shallow checkout.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: steps.sonar_token.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.sonar_token.outputs.enabled == 'true'
        run: uv sync --frozen --all-extras

      - name: Run fast tier under coverage
        if: steps.sonar_token.outputs.enabled == 'true'
        env:
          # Dotted module form (the post-#2975 convention) keeps the coverage
          # XML's filenames project-relative, which SonarCloud resolves. The
          # coverage report path matches sonar-project.properties'
          # sonar.python.coverage.reportPaths fallback default; the fast-tier
          # selection itself stays single-sourced in the Makefile's test-fast
          # target. No --junitxml: sonar.python.xunit.reportPath is
          # deliberately NOT set (WP12 T065, sonar-project.properties), so an
          # xunit report here would be written and read by nobody.
          PYTEST_ADDOPTS: >-
            --cov=specify_cli
            --cov=charter
            --cov=glossary
            --cov=kernel
            --cov=mission_runtime
            --cov=runtime
            --cov=doctrine
            --cov-report=xml:out/reports/coverage/coverage.xml
        run: |
          mkdir -p out/reports/coverage
          make test-fast

      # The four steps below carry `if: always()` (mirroring sonar.yml) so a
      # red fast tier still reaches the scan: pytest --cov writes coverage.xml
      # even on test failure, and this job is continue-on-error, so without
      # the continuation a skipped upload would be indistinguishable from a
      # clean run in a green workflow.
      - name: Derive sonar.projectVersion from pyproject.toml
        id: sonar_version
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        run: |
          # scripts/ci/sonar_project_version.py raises loudly and emits
          # NOTHING on stdout on any failure, so an empty capture plus set -e
          # fails this step rather than silently stamping an empty
          # sonar.projectVersion (the #2421 baseline freeze this wiring
          # exists to prevent; unit-tested in
          # tests/ci/test_sonar_project_version.py).
          version="$(python3 scripts/ci/sonar_project_version.py)"
          if [ -z "$version" ]; then
            echo "::error::sonar.projectVersion could not be derived from pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved sonar.projectVersion=$version (from pyproject.toml)"

      - name: Resolve SonarCloud branch arguments
        id: sonar_branch
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        env:
          # Env-mapped so a branch name carrying shell metacharacters can
          # never be interpreted as code by this step's script.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "args=-Dsonar.pullrequest.key=$PR_NUMBER -Dsonar.pullrequest.branch=$PR_HEAD_REF -Dsonar.pullrequest.base=$PR_BASE_REF" >> "$GITHUB_OUTPUT"
          else
            # Defensive only: the job-level `if:` restricts this job to
            # pull_request events, where PR_NUMBER is always set. Kept so a
            # future widening of that trigger cannot silently fall back to
            # writing a branch analysis on a non-PR ref.
            echo "args=-Dsonar.branch.name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        # SHA-pinned (DIR-051) to the SAME commit sonar.yml vets for this
        # action -- both surfaces analyze the same SonarCloud project, so the
        # pins must not drift apart (enforced by
        # tests/release/test_sonar_workflow.py).
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          # projectKey / organization / sources / coverage paths come from
          # sonar-project.properties; only the per-run values are passed here.
          args: >-
            -Dsonar.projectVersion=${{ steps.sonar_version.outputs.version }}
            ${{ steps.sonar_branch.outputs.args }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Quality Gate (reported, not required)
        if: always() && steps.sonar_token.outputs.enabled == 'true'
        # SHA-pinned (DIR-051) to the SAME commit sonar.yml vets for this
        # action -- see the SonarCloud Scan step above.
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - build-wheel
      - clean-install-verification
      - uv-lock-check
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Evaluate quality-gate decision
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = {
              "lint",
              "build-wheel",
              "clean-install-verification",
              "uv-lock-check",
          }
          if set(needs) != expected:
              raise SystemExit(f"quality-gate needs changed: {sorted(needs)}")
          failed = {
              job: result.get("result")
              for job, result in needs.items()
              if result.get("result") != "success"
          }
          if failed:
              raise SystemExit(f"blocking job(s) did not succeed: {failed}")
          PY
