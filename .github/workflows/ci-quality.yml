name: CI Quality

on:
  pull_request:
    # labeled/unlabeled (#7019): removing pr:pause-ci starts a full run on the PR head with no push.
    # Any other label event is a no-op: every self-starting job carries the label guard, the
    # required gate posts under a different name, and the run gets its own concurrency group.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  # Merge queue (landing-merge-queue ADR): the queue tests each PR on main plus
  # the PRs ahead of it, and this workflow's required check must report there.
  merge_group:
  workflow_dispatch:

# Label events (#7019): a run started by a label other than pr:pause-ci (or by any label on a
# closed PR) joins its own group
# (`-label-no-op-<run id>`), so it never cancels the real run; a pr:pause-ci label event joins
# the PR group and supersedes it (removing the label resumes, adding it re-reports paused).
concurrency:
  group: ci-quality-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && (github.event.label.name != 'pr:pause-ci' || github.event.pull_request.state != 'open') && format('-label-no-op-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

# Fork guard: automated runs (schedule, push to main, workflow_run) are core-repo
# only. On a fork the guarded jobs skip; pull_request and workflow_dispatch still
# run everywhere. Pinned by tests/ci/test_fork_guard.py.
jobs:
  # Ruff (including TID251) and uv lock --check have one execution owner:
  # CI Router. Its stable required `router gate` awaits both. This workflow
  # owns wheel construction and genuine clean-install verification only.
  build-wheel:
    if: (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && ((github.event.label.name == 'pr:pause-ci' && github.event.pull_request.state == 'open') || (github.event.action != 'labeled' && github.event.action != 'unlabeled')) && !contains(github.event.pull_request.labels.*.name, 'pr:pause-ci')
    name: Build wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build-required: ${{ steps.package-scope.outputs.build-required }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether package inputs changed (fail closed)
        id: package-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/packaging_scope.py
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.package-scope.outputs.build-required != 'false'
        with:
          python-version: '3.12'
      - name: Install the locked Python environment (pack sync dependencies)
        if: steps.package-scope.outputs.build-required != 'false'
        run: uv sync --frozen --no-install-project
      - name: Sync packs
        if: steps.package-scope.outputs.build-required != 'false'
        uses: ./.github/actions/sync-packs
      - name: Build wheel
        if: steps.package-scope.outputs.build-required != 'false'
        run: |
          uv build --wheel
          ls -la dist/
      - name: Upload wheel
        if: steps.package-scope.outputs.build-required != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: spec-kitty-cli-wheel
          path: dist/spec_kitty_cli-*.whl
          retention-days: 7

  clean-install-verification:
    name: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && (github.event.label.name != 'pr:pause-ci' || github.event.pull_request.state != 'open') && 'Clean install verification (label no-op)' || 'Clean install verification' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-wheel]
    # Must RUN (not skip) on a paused PR: it is a required check, and a skipped
    # required check passes. `always()` keeps it alive when build-wheel is skipped.
    if: ${{ (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && ((github.event.label.name == 'pr:pause-ci' && github.event.pull_request.state == 'open') || (github.event.action != 'labeled' && github.event.action != 'unlabeled')) && always() && !cancelled() }}
    steps:
      - name: Refuse while CI is paused by label
        if: ${{ contains(github.event.pull_request.labels.*.name, 'pr:pause-ci') }}
        shell: bash
        run: |
          echo "::error::CI is paused on this PR by the pr:pause-ci label; remove the label to run CI."
          exit 1
      - name: Report proven package-irrelevant prose change
        if: needs.build-wheel.outputs.build-required == 'false'
        run: echo 'No package inputs changed; wheel and clean-install execution not needed.'
      - uses: actions/checkout@v4
        if: needs.build-wheel.outputs.build-required != 'false'
      - uses: actions/setup-python@v5
        if: needs.build-wheel.outputs.build-required != 'false'
        with:
          python-version: '3.13'
      - name: Download CLI wheel
        if: needs.build-wheel.outputs.build-required != 'false'
        uses: actions/download-artifact@v4
        with:
          name: spec-kitty-cli-wheel
          path: dist/
      - name: Create clean venv
        if: needs.build-wheel.outputs.build-required != 'false'
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/pip" install --upgrade pip
      - name: Install CLI from wheel
        if: needs.build-wheel.outputs.build-required != 'false'
        run: |
          "$RUNNER_TEMP/clean-venv/bin/pip" install dist/spec_kitty_cli-*.whl
          "$RUNNER_TEMP/clean-venv/bin/pip" list
      - name: Assert spec-kitty-runtime is not installed
        if: needs.build-wheel.outputs.build-required != 'false'
        run: |
          if "$RUNNER_TEMP/clean-venv/bin/pip" show spec-kitty-runtime >/dev/null 2>&1; then
            echo "::error::spec-kitty-runtime is installed; the clean-install contract regressed."
            exit 1
          fi
      - name: Assert no runtime import side effect
        if: needs.build-wheel.outputs.build-required != 'false'
        run: |
          "$RUNNER_TEMP/clean-venv/bin/python" -c "
          import sys
          import specify_cli
          leaked = [name for name in sys.modules if 'spec_kitty_runtime' in name]
          assert not leaked, f'spec_kitty_runtime imported: {leaked}'
          "
      - name: Run spec-kitty next against fixture mission
        if: needs.build-wheel.outputs.build-required != 'false'
        run: |
          cp -r tests/fixtures/clean_install_fixture_mission "$RUNNER_TEMP/fixture"
          cd "$RUNNER_TEMP/fixture"
          git init -q
          git -c user.email=ci@test -c user.name=ci add -A
          git -c user.email=ci@test -c user.name=ci commit -q -m "fixture mission"
          "$RUNNER_TEMP/clean-venv/bin/spec-kitty" next \
            --agent claude \
            --mission clean-install-fixture-01KQ22XX \
            --json | tee "$RUNNER_TEMP/next.json"
          "$RUNNER_TEMP/clean-venv/bin/python" -c "
          import json
          import pathlib
          payload = json.loads(pathlib.Path('$RUNNER_TEMP/next.json').read_text())
          assert isinstance(payload, dict), payload
          "

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - build-wheel
      - clean-install-verification
    if: ${{ (github.repository == 'spec-kitty/spec-kitty' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && ((github.event.label.name == 'pr:pause-ci' && github.event.pull_request.state == 'open') || (github.event.action != 'labeled' && github.event.action != 'unlabeled')) && always() && !cancelled() }}
    steps:
      - name: Evaluate quality-gate decision
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = {
              "build-wheel",
              "clean-install-verification",
          }
          if set(needs) != expected:
              raise SystemExit(f"quality-gate needs changed: {sorted(needs)}")
          failed = {
              job: result.get("result")
              for job, result in needs.items()
              if result.get("result") != "success"
          }
          if failed:
              raise SystemExit(f"blocking job(s) did not succeed: {failed}")
          PY
