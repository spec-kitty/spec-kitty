# Metadata-only bridge. The existing workflows remain the sole test producer.
name: CI Fleet Verdict
on:
  workflow_run:
    workflows: [CI Router, CI Modules, Packs, CI Quality, ci-windows, Release Readiness Check, Check Shared Package Drift, CI Aggregate]
    # A verdict is a function of terminal upstream state only (#4371): requested /
    # in_progress transitions are pure fan-out with no verdict value.
    types: [completed]

# Cap the per-subject fan-out (#4371): coalesce all redundant workflow_run triggers for
# one verdict subject to a single surviving run, with a key that never mixes subjects.
# The seven direct producers run on the head they verified, so their head_sha IS the
# subject — a PR head, or the exact main tip of a push run — and distinct subjects have
# distinct SHAs → distinct groups. CI Aggregate is the exception: a workflow_run child
# always executes on the default branch, so an aggregate completion's head_sha is the
# *current main tip*, not the PR head it verified (its display_title binds it to exactly
# one source CI Modules run). Keying that path on head_sha would land every PR's
# aggregate completion in the current tip's group and cancel/replace other subjects'
# runs — the dropped-verdict hole NFR-002 forbids — so the aggregate path keys on the
# aggregate run's own id instead: a per-subject singleton group (only a re-run of the
# same aggregate run shares it, which is same-subject newer evidence). The survivor is
# the last completion and re-reads live evidence, so coalescing loses no verdict.
concurrency:
  group: ci-fleet-verdict-${{ github.event.workflow_run.path == '.github/workflows/ci-aggregate.yml' && format('aggregate-{0}', github.event.workflow_run.id) || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  identify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.source.outputs.prs }}
      main: ${{ steps.source.outputs.main }}
    steps:
      # All jobs use trusted default-branch code, never source PR code/artifacts.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
      - id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_ID: ${{ github.run_id }}
          REPORT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/ci/fleet_verdict.py --event "$GITHUB_EVENT_PATH" \
            --repository "$REPORT_REPOSITORY" --reporter-id "$REPORT_ID" --attempt "$REPORT_ATTEMPT"

  report:
    needs: identify
    if: needs.identify.outputs.prs != '' && needs.identify.outputs.prs != '[]'
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.identify.outputs.prs) }}
    # Same-subject coalescing is owned by the top-level concurrency block — direct
    # producers key on their own head_sha and the CI Aggregate path on its run id, so
    # distinct verdict subjects never share a group — plus the reporter's
    # double-snapshot head-drift guard. This per-PR group with cancel-in-progress:false
    # remains as defence-in-depth so a superseding queued event for the same PR still
    # survivor-re-reads every gate.
    concurrency:
      group: ci-fleet-verdict-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
      - name: Reconcile fleet verdict from current Actions evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_ID: ${{ github.run_id }}
          REPORT_ATTEMPT: ${{ github.run_attempt }}
          REPORT_PR: ${{ matrix.pr }}
        run: |
          python3 scripts/ci/fleet_verdict.py --pr "$REPORT_PR" \
            --repository "$REPORT_REPOSITORY" --reporter-id "$REPORT_ID" --attempt "$REPORT_ATTEMPT"

  report-main:
    needs: identify
    if: needs.identify.outputs.main == 'true'
    # Serialize across main heads: the survivor always rereads current main.
    concurrency:
      group: ci-fleet-verdict-main
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
      - name: Reconcile main CI into the fleet P0 intake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_ID: ${{ github.run_id }}
          REPORT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -m scripts.ci.fleet_main \
            --repository "$REPORT_REPOSITORY" --reporter-id "$REPORT_ID" --attempt "$REPORT_ATTEMPT"
