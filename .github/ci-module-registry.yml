schema_version: 1.0
description: Committed module-shard registry (FR-006/NFR-001/NFR-005, WP08 T042). The single data source
  for the per-module CI test matrix, realized as a matrix over a BOUNDED set of reusable workflows (<=
  GitHub's 20-reusable-workflows-per-caller ceiling) -- adding a module is a registry row, never a new
  workflow file. Rows are consumed verbatim from the WP05 retirement scrub (tests/release/ci_retirement_scrub.json);
  this registry does not re-scrub. shard_count is chosen by greedy LPT bin-packing of the MEASURED per-test
  durations recorded in ci-shard-timings.json (never guessed, never from file counts) so the within-module
  inter-shard skew stays <=20% (NFR-005).
source_scrub: tests/release/ci_retirement_scrub.json
source_timings: .github/ci-shard-timings.json
reusable_workflow_ceiling: 20
modules:
- module: merge
  roots:
  - src/specify_cli/merge/**
  cov_targets:
  - specify_cli.merge
  tier: standard
  # spec-kitty#4374 (WP03 T009): promoted tests/specify_cli/merge (the secondary
  # tests/specify_cli/** mirror) into this row's per-PR execution -- the explicit
  # test_dirs list REPLACES the tests/merge fallback claim, so tests/merge is named
  # explicitly alongside it or the guard reds. shard_count re-measured in T010.
  shard_count: 1
  # spec-kitty#5001 (terminus-merge-integrity): tests/terminus holds the real-CLI,
  # mock-free terminus reconciliation repros. The spine they exercise lives under
  # src/specify_cli/merge/** (reconciliation.py, executor.py, ref_advance via merge),
  # so they are claimed here and run on every merge-touching PR. Naming an explicit
  # test_dirs list REPLACES the tests/merge fallback claim, so tests/merge stays named.
  test_dirs:
  - tests/merge
  - tests/specify_cli/merge
  - tests/terminus
- module: missions
  roots:
  - src/specify_cli/mission.py
  - src/specify_cli/mission_metadata.py
  - src/specify_cli/missions/**
  - src/charter/offering/missions/**
  cov_targets:
  - specify_cli.mission
  - specify_cli.mission_metadata
  - specify_cli.missions
  - charter.offering.missions
  tier: standard
  shard_count: 1
- module: post_merge
  roots:
  - src/specify_cli/post_merge/**
  cov_targets:
  - specify_cli.post_merge
  tier: standard
  shard_count: 1
- module: release
  roots:
  - src/specify_cli/release/**
  cov_targets:
  - specify_cli.release
  tier: standard
  shard_count: 1
- module: status
  roots:
  - src/specify_cli/status/**
  - src/specify_cli/coordination/**
  cov_targets:
  - specify_cli.status
  - specify_cli.coordination
  tier: standard
  # spec-kitty#4374 (WP03 T009): promoted tests/specify_cli/status AND
  # tests/specify_cli/write_side (bundled -- write_side's top import is
  # specify_cli.coordination.status_transition, matching this row's second root) into
  # this row's per-PR execution -- the explicit test_dirs list REPLACES the
  # tests/status fallback claim, so tests/status is named explicitly alongside them or
  # the guard reds. shard_count re-measured in T010.
  shard_count: 1
  test_dirs:
  - tests/status
  - tests/specify_cli/status
  - tests/specify_cli/write_side
- module: review
  roots:
  - src/specify_cli/review/**
  cov_targets:
  - specify_cli.review
  tier: standard
  shard_count: 1
- module: next
  roots:
  - src/specify_cli/runtime/**
  - src/runtime/next/**
  - src/mission_runtime/**
  cov_targets:
  - specify_cli.runtime
  - runtime.next
  - mission_runtime
  tier: standard
  shard_count: 2
- module: lanes
  roots:
  - src/specify_cli/lanes/**
  cov_targets:
  - specify_cli.lanes
  tier: standard
  shard_count: 1
- module: dashboard
  roots:
  - src/specify_cli/dashboard/**
  cov_targets:
  - specify_cli.dashboard
  tier: standard
  # DUAL test tree (spec-kitty#4369): the module's tests live in BOTH
  # tests/dashboard/ AND tests/test_dashboard/ -- the second tree (API
  # handler, scanner, mission-id, server suites) was previously invisible to
  # every shard: the mirrored-dir fallback only ever looked at
  # tests/dashboard, so tests written there could neither fail a PR nor
  # contribute coverage evidence. The explicit test_dirs list claims both
  # trees. Measured basis (supplemental run recorded in
  # ci-shard-timings.json, 2026-09-14): 247 collected, 246 passed + 1
  # skipped, 14.7s serial wall, slowest single test 2.0s -- shard_count
  # stays 1, far inside the 30m shard budget, so no nightly marker split
  # is needed.
  # spec-kitty#4374 (WP03 T009): promoted tests/specify_cli/dashboard (the secondary
  # tests/specify_cli/** mirror) as a THIRD tree onto this row -- re-measured the
  # combined module (not just the new tree) in T010 to keep skew accurate.
  shard_count: 1
  test_dirs:
  - tests/dashboard
  - tests/test_dashboard
  - tests/specify_cli/dashboard
- module: upgrade
  roots:
  - src/specify_cli/upgrade/**
  cov_targets:
  - specify_cli.upgrade
  tier: standard
  # 4 shards: the module's ~840 tests run near-instant in pytest's measured
  # "call" phase (module_test_durations sums to ~5s) but each carries heavy
  # per-test fixture setup (project init / ensure_runtime) that the call-phase
  # timings do not capture, so the SERIAL single-shard run overran the 30m job
  # timeout. Splitting by test count keeps each serial shard well under budget;
  # inter-shard skew stays 0% (the per-test call durations are near-uniform).
  shard_count: 4
- module: cli
  roots:
  - src/specify_cli/cli/**
  cov_targets:
  - specify_cli.cli
  tier: standard
  shard_count: 2
- module: charter
  roots:
  - src/charter/**
  - src/specify_cli/charter_runtime/**
  cov_targets:
  - charter
  - specify_cli.charter_runtime
  tier: standard
  # shard_count=5 (WP05 T024, spec-kitty#4865; corrected per operator ruling,
  # Decision Moment 01M3584PY5A6F79DWX1QFDHW87 -- see mission decisions/):
  # durations recaptured 2026-09-22 via scripts/ci/capture_shard_timings.py
  # --module charter --write (run-id wp02-durations-20260922T174952Z; 6156
  # collected/passed, 1134.188s summed per-test durations -- ci-shard-timings.json),
  # then RE-CAPTURED 2026-09-23 during the PR #4948 landing pass (run-id
  # landing-pr4948; 6161 collected) because rebasing onto current main pulled in
  # 5 new charter tests, so the anchor was recaptured to keep committed == collected.
  # The committed list length (now 6161) equals what
  # the consumer actually collects (pytest tests/charter tests/doctrine -m
  # "not performance and not stress" --collect-only -q -> 6161), so
  # module-tests.yml's positional nodeid/duration pairing now weights this
  # module's shards by MEASURED time instead of silently falling back to
  # uniform weights (its length-mismatch fallback) -- that fallback, not
  # skew, is what #4864's observed 31m13s long pole (run 35756657364)
  # needed fixed. LPT bin-packing (_lpt_bin_pack/_skew_of,
  # test_module_shard_registry.py) of these durations gives skew=0.000% at
  # shard_count=5; skew does not discriminate a good shard_count here (it
  # stays ~0% across the whole practical range on both the pre- and
  # post-recapture data), so it is NOT the basis for the value below.
  # shard_count=5 is chosen as the smallest value whose worst shard,
  # projected onto real GitHub Actions wall-clock via the empirical
  # CI/local ratio measured in dispatch run 35756657364 (7624s CI /
  # 1134.188s local ~= 6.72x), lands safely under module-tests.yml's
  # 40-minute per-shard timeout (~25m vs ~32m projected at shard_count=4,
  # which leaves almost no margin) -- not the manual wall-clock/test-count
  # heuristic C-002 rejects as a precedent.
  shard_count: 5
  # DUAL test tree (CLAUDE.md Modularity SSOT): the doctrine test tree did
  # not move when src/doctrine/ was absorbed into src/charter/offering/, so
  # both dirs cover `charter`. This pair was previously hardcoded inside
  # module-tests.yml's selection step as an extra_dirs special case;
  # promoted into the registry (spec-kitty#4369) so the registry alone
  # determines every module's test directories.
  test_dirs:
  - tests/charter
  - tests/doctrine
- module: agent
  roots:
  - src/specify_cli/agent_utils/**
  cov_targets:
  - specify_cli.agent_utils
  tier: standard
  # 3 shards: ~1173 tests at ~1.2s wall each (CliRunner + ensure_runtime
  # overhead the measured call-phase timings undercount) → ~23m SERIAL, which
  # brushed the 30m job timeout. Three serial shards land each near ~8m;
  # inter-shard skew stays 0% under LPT of the near-uniform per-test durations.
  shard_count: 3
- module: kernel
  roots:
  - src/kernel/**
  cov_targets:
  - kernel
  tier: standard
  shard_count: 1
- module: glossary
  roots:
  - src/glossary/**
  cov_targets:
  - glossary
  tier: standard
  shard_count: 1
- module: execution_context
  roots:
  - src/mission_runtime/**
  - src/specify_cli/status/**
  - src/runtime/next/**
  - src/specify_cli/cli/commands/agent/**
  cov_targets:
  - mission_runtime
  - specify_cli.status
  - runtime.next
  tier: standard
  shard_count: 3
  # AGGREGATE module: no single tests/<module> mirror exists for
  # "execution_context" -- the roots above are covered by these real
  # directories instead (verified to exist and collect >0 tests, WP09 landing
  # fold). module-tests.yml consumes this list when present rather than
  # guessing tests/{module}.
  test_dirs:
  - tests/mission_runtime
  - tests/runtime
  - tests/specify_cli/cli/commands/agent
- module: core_misc
  roots:
  - src/kernel/**
  - src/charter/offering/**
  - src/specify_cli/core/**
  - src/specify_cli/coordination/**
  - src/specify_cli/doctrine_synthesizer/**
  - src/specify_cli/status/**
  - src/specify_cli/tool_surface/**
  - src/specify_cli/zeitgeist_client/**
  cov_targets:
  - specify_cli
  - glossary
  - mission_runtime
  tier: standard
  shard_count: 5
  # AGGREGATE module: no single tests/<module> mirror exists for "core_misc"
  # -- the roots above are covered by these real directories instead
  # (verified to exist and collect >0 tests, WP09 landing fold). Both
  # src/specify_cli/core/** and src/specify_cli/coordination/** have two
  # live test trees (tests/<name> and tests/specify_cli/<name>) that each
  # exercise the src module -- both are kept for faithful coverage (overlap
  # accepted, per CLAUDE.md "Test policy"). src/charter/offering/** mirrors
  # the same dual-tree tests/charter + tests/doctrine pattern
  # module-tests.yml already special-cases for the "charter" module.
  test_dirs:
  - tests/core
  - tests/specify_cli/core
  - tests/coordination
  - tests/specify_cli/coordination
  - tests/decisions
  - tests/doctrine_synthesizer
  - tests/specify_cli/tool_surface
  # ownership-boundary-preservation-01M32KEN: the new asset-preservation guard's
  # unit tests, claimed alongside its tool_surface sibling so they run per-PR.
  - tests/specify_cli/asset_preservation
  - tests/zeitgeist_client
- module: unit
  roots:
  - src/specify_cli/status/**
  - src/runtime/next/**
  - src/charter/offering/missions/**
  - src/kernel/**
  cov_targets:
  - specify_cli.status
  - runtime.next
  - charter.offering.missions
  - kernel
  tier: standard
  shard_count: 1
  # TEST-INVENTORY module (mission sonar-per-pr-coverage-reuse-01M2FR32,
  # WP02/FR-006): tests/unit had NO declared home in this registry, so
  # retiring the duplicate broad-measurement step would have removed its
  # PER-CHANGE execution (the scheduled interpreter sweep still selects it
  # by marker -- it was never unrun). It owns no src/** surface of its own:
  # every root above is a verbatim copy of a glob another row already owns,
  # chosen from the surfaces tests/unit actually imports, so the router's
  # path->group mapping and the FR-004 fail-closed union are unchanged.
  # test_dirs is declared explicitly even though it equals the tests/{module}
  # default -- the default is a guess, this is the declaration.
  test_dirs:
  - tests/unit
- module: specify_cli_runtime
  roots:
  - src/specify_cli/runtime/**
  - src/charter/offering/missions/**
  - src/specify_cli/core/**
  cov_targets:
  - specify_cli.runtime
  - charter.offering.missions
  - specify_cli.core
  tier: standard
  shard_count: 1
  # TEST-INVENTORY module (same WP02 rationale as `unit` above). No
  # tests/specify_cli_runtime mirror exists -- the directory is
  # tests/specify_cli/runtime, so test_dirs is load-bearing here (without it
  # module-tests.yml would look for tests/specify_cli_runtime and exit 64).
  test_dirs:
  - tests/specify_cli/runtime
- module: ci
  roots:
  - scripts/ci/**
  - .github/workflows/**
  cov_targets:
  - kernel
  - specify_cli.core
  tier: standard
  # CI-INFRASTRUCTURE row (spec-kitty#4386): tests/ci (the guard suites for
  # scripts/ci/ and the CI workflows it feeds -- including the SONAR_TOKEN
  # sonar-pr path) was claimed by no row, so no per-PR job ever selected it:
  # the only lane reaching it was the nightly interpreter sweep (scheduled,
  # never PR-triggered, fail-soft). The roots are NON-src on purpose: they are
  # the CI-infrastructure paths whose regressions these tests guard, not
  # product code -- the first non-src module row, mirrored 1:1 as the `ci`
  # filter group in ci-router.yml. cov_targets follow the `unit`-row
  # precedent: the src surfaces scripts/ci actually imports
  # (kernel.clock, specify_cli.core.vcs.git) -- an ownership declaration only;
  # the shard measures the full top-level package set (WP01/FR-013).
  # Deliberate routing decision (issue "Wanted" #2): CI-infra changes do NOT
  # join the FR-004 fail-closed catch-all. That sensor is contractually
  # "unmapped src/** code" (contracts/router-two-authority.md Invariants 1-2);
  # scripts/ci/** and .github/workflows/** are not src, and they are now
  # NAMED, so there is no unmatched path left to catch. The per-PR executor
  # is this module matrix (ci-modules.yml runs on every PR), never a router
  # `tests (ci)` job -- that would double-run the suite per PR, the exact
  # duplicate class tests/architectural/test_no_duplicate_suite_execution.py
  # exists to remove. Measured basis (scripts/ci/capture_shard_timings.py run
  # recorded in ci-shard-timings.json, run-id wp02-durations-20260915T035159Z,
  # 2026-09-15): 252 collected, 252 passed, 26.5s summed per-test durations
  # (~67s serial wall, the rest collection/import time) -- shard_count stays 1,
  # far inside the 30m shard budget, so no split is needed (skew is trivially
  # 0%).
  shard_count: 1
  test_dirs:
  - tests/ci
- module: auth
  roots:
  - src/specify_cli/auth/**
  cov_targets:
  - specify_cli.auth
  tier: standard
  # SECURITY-CRITICAL new-row-via-scrub (spec-kitty#4374 WP03 T011, Phase-S capped
  # promotion set): the ONE new-row-via-scrub this mission's cap permits. Minted via
  # tests/release/ci_retirement_scrub.json's `auth` group (roots/cov_targets mirrored
  # verbatim, per test_registry_consumes_scrub_verbatim_no_divergent_rescrub). Parent-only
  # test_dirs claim (tests/auth); the concurrency/integration/secure_storage/stress
  # subdirs are covered by recursion, never listed separately (non-nesting guard).
  # Verified NOT blocked by the registry's 20-reusable-workflow-ceiling comment: all
  # modules[] rows share ONE `uses: ./.github/workflows/module-tests.yml` reference via
  # strategy.matrix (ci-modules.yml:293-297) -- a 21st row is one more matrix cell, not a
  # new `uses:` reference. Measured basis: scripts/ci/capture_shard_timings.py --module
  # auth --write (see ci-shard-timings.json for run-id/duration) -- shard_count stays 1,
  # far inside the 30m shard budget.
  shard_count: 1
  test_dirs:
  - tests/auth
# OUT-OF-MATRIX INVENTORY (spec-kitty#4369). Every test-bearing directory under
# tests/ that no modules[] row claims, each with the reason it is deliberately
# outside the per-PR module matrix. Enforced by
# tests/architectural/test_module_shard_registry.py: a directory that is claimed
# by no row and recorded here would be silently unrun -- exactly the
# tests/test_dashboard/ defect this section was minted for (its tests could
# neither fail a PR nor contribute coverage evidence). Adding a directory here
# is a reasoned decision; the right fix for a directory that SHOULD gate per-PR
# is a registry row with measured durations, never a silent default.
out_of_matrix_test_dirs:

- reason: >-
    Root-level test modules held directly under tests/ (isolation/bootstrap/
    shard-registry helpers). No per-PR lane selects them by directory;
    tests/test_test_venv_bootstrap.py is additionally covered by
    ci-windows.yml's path filter. Full suite via make test-full.
  dirs:
  - tests

- reason: >-
    Per-PR home is ci-router.yml's 'tests (docs)' path-routed job, which runs this
    directory directly; claiming it in a module row too would only double-run it per PR.
  dirs:
  - tests/docs

- reason: >-
    Per-PR home is ci-router.yml's 'tests (e2e)' path-routed job, which runs this
    directory directly; claiming it in a module row too would only double-run it per PR.
  dirs:
  - tests/e2e

- reason: >-
    Per-PR home is ci-router.yml's 'architectural battery' job, which runs the full
    tests/architectural tree (this registry's own special_tiers.architectural pole); a
    module row would only double-run it.
  dirs:
  - tests/architectural
  - tests/architectural/tool_artifact_enrolment


- reason: >-
    Browser-backed Playwright UI guards: ci-nightly.yml's -m e2e lane (PWHEADLESS=1) is
    their home; no per-PR lane installs browsers, so they are deliberately nightly-only.
  dirs:
  - tests/ui

- reason: >-
    Secondary tests/specify_cli/** tree; its command-path/latency parity is covered by
    the cli module mirror (tests/cli) and the always-on architectural CLI-reference
    gate. The one repo-invariant unique to it -- completion-manifest freshness (help
    TEXT, which the path-only CLI-reference gate does not check) -- was promoted to the
    always-on architectural battery as
    tests/architectural/test_completion_manifest_freshness.py (spec-kitty#4479 /
    spec-kitty#4374), so a stale manifest reds every PR instead of only make test-full.
    Promoting the rest of this tree into the cli row remains a measured-durations
    decision (spec-kitty#4374), never a silent default.
  dirs:
  - tests/specify_cli/cli/commands

- reason: >-
    Lift-invariant (spec-kitty#4374 T006/WP02, #4715 pattern): PC1-PROMOTION-BLOCKED
    (recursive descendants include the excluded tests/specify_cli/cli/commands AND the
    execution_context-claimed tests/specify_cli/cli/commands/agent -- illegal to claim as
    a test_dirs parent). This tree's drift-prone single-topic invariants were extracted to
    8 always-on architectural gates: tests/architectural/test_lifted_cli_no_visible_feature_alias.py,
    test_lifted_cli_doctrine_retirement.py, test_lifted_cli_bytecode_heal_startup.py,
    test_lifted_cli_accept_coord_surface_anchor.py, test_lifted_cli_accept_birth_cutover.py,
    test_lifted_cli_terminal_control_sanitization.py, test_lifted_cli_doctrine_charter_cr02_compat.py,
    test_lifted_cli_project_root_resolution.py. Accepted named gap: the residual behavioral
    files in this tree remain make test-full-only -- lifting covers the drift-prone
    invariants, not the full behavioral surface.
  dirs:
  - tests/specify_cli/cli

- reason: >-
    Lift-invariant (spec-kitty#4374 T006/WP02, #4715 pattern): single-topic doc-freshness
    invariants extracted to always-on architectural gates:
    tests/architectural/test_lifted_specify_cli_docs_trail_model.py,
    test_lifted_specify_cli_docs_host_surface_inventory.py,
    test_lifted_specify_cli_docs_readme_governance.py.
  dirs:
  - tests/specify_cli/docs

- reason: >-
    Lift-invariant (spec-kitty#4374 T006/WP02, #4715 pattern): single-topic registry-
    completeness invariant extracted to
    tests/architectural/test_lifted_drg_writers_registry_completeness.py.
  dirs:
  - tests/specify_cli/drg_writers

- reason: >-
    Lift-invariant (spec-kitty#4374 T006/WP02, #4715 pattern): single-topic import-hygiene
    invariant extracted to tests/architectural/test_lifted_mission_v1_import_hygiene.py.
  dirs:
  - tests/specify_cli/mission_v1

- reason: >-
    Deferred-promotion (spec-kitty#4374 disposition ledger, WP01): existing owning row
    agent (cov_targets specify_cli.agent_utils; import census confirms 2x
    specify_cli.agent_utils.status). Not in the Phase-S capped promotion set
    (merge/status/dashboard/auth only) -- promotion warranted; deferred to a follow-up
    (#4732) to respect the bounded single-PR cap, never silently absorbed.
  dirs:
  - tests/specify_cli/agent_utils

- reason: >-
    Deferred-promotion (spec-kitty#4374 disposition ledger, WP01): existing owning row
    charter (cov_targets charter, specify_cli.charter_runtime; roots src/charter/**,
    src/specify_cli/charter_runtime/**; import census confirms specify_cli.charter_runtime.*
    / charter.* as top imports). Not in the Phase-S capped promotion set (merge/status/
    dashboard/auth only) -- promotion warranted; deferred to a follow-up (#4732)
    to respect the bounded single-PR cap, never silently absorbed.
  dirs:
  - tests/specify_cli/charter
  - tests/specify_cli/charter_freshness
  - tests/specify_cli/charter_lint
  - tests/specify_cli/charter_lint/checks
  - tests/specify_cli/charter_preflight
  - tests/specify_cli/charter_runtime

- reason: >-
    Deferred-promotion (spec-kitty#4374 disposition ledger, WP01): existing owning row
    cli (cov_targets specify_cli.cli; roots src/specify_cli/cli/**). Each leaf is itself
    PC1-clean (does not nest the excluded tests/specify_cli/cli/commands dir or the
    execution_context-claimed commands/agent sibling, which are separate registry
    entries). A real EG1 coverage-diff capture over commands/charter was started but
    exceeded a reasonable WP01 analysis budget (aborted after >8min on a 29-test set,
    heavy CliRunner/project-init fixture overhead) -- no fabricated mirror-equivalence
    verdict is recorded; commands/review has no plausible in-matrix mirror at all (zero
    tests/cli hits by census). Not in the Phase-S capped promotion set -- promotion
    warranted; deferred to a follow-up (#4732), never silently absorbed.
  dirs:
  - tests/specify_cli/cli/commands/charter
  - tests/specify_cli/cli/commands/review

- reason: >-
    Deferred-promotion (spec-kitty#4374 disposition ledger, WP01): existing owning row
    lanes (cov_targets specify_cli.lanes; import census confirms 15x
    specify_cli.lanes.worktree_allocator, 7x .models, 7x .recovery). Not in the Phase-S
    capped promotion set (merge/status/dashboard/auth only) -- promotion warranted;
    deferred to a follow-up (#4732) to respect the bounded single-PR cap, never
    silently absorbed.
  dirs:
  - tests/specify_cli/lanes

- reason: >-
    Deferred-promotion (spec-kitty#4374 disposition ledger, WP01): existing owning row
    missions (cov_targets specify_cli.missions; import census confirms 18x
    specify_cli.missions._read_path_resolver, 6x specify_cli.missions._substantive). Not
    in the Phase-S capped promotion set (merge/status/dashboard/auth only) -- promotion
    warranted; deferred to a follow-up (#4732) to respect the bounded single-PR
    cap, never silently absorbed.
  dirs:
  - tests/specify_cli/missions

- reason: >-
    Deferred-promotion (spec-kitty#4374 disposition ledger, WP01): existing owning row
    next (cov_targets specify_cli.runtime, runtime.next, mission_runtime; import census
    confirms 39x runtime.next.runtime_bridge, 14x
    runtime.next._internal_runtime.workflow_registry). Not in the Phase-S capped
    promotion set (merge/status/dashboard/auth only) -- promotion warranted; deferred to
    a follow-up (#4732) to respect the bounded single-PR cap, never silently
    absorbed.
  dirs:
  - tests/specify_cli/next

- reason: >-
    Deferred-promotion (spec-kitty#4374 disposition ledger, WP01): existing owning row
    post_merge (cov_targets specify_cli.post_merge; import census confirms 5x
    specify_cli.post_merge.retrospective_terminus). Not in the Phase-S capped promotion
    set (merge/status/dashboard/auth only) -- promotion warranted; deferred to a
