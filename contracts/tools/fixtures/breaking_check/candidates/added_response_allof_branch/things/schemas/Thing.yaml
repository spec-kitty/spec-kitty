title: Thing
description: A thing.
type: object
additionalProperties: false
required:
  - id
  - name
properties:
  id:
    type: string
    description: Identifier.
  name:
    type: string
    description: Display name.
  count:
    type: integer
    description: How many.
  guess:
    description: A provisional guess.
    type:
      - string
      - 'null'
    x-provisional:
      open_decision: the shape of this guess is still being decided
allOf:
  - type: object
    properties:
      size:
        type: integer
        description: A response property added through a new allOf branch.
