title: WriteRefusal
description: >-
  The body of every refused write-service request: the shared Problem with a code from
  WriteRefusalCode and the status that code fixes. A guard refusal also carries type, a
  WriteRefusalReason URN; every other refusal omits type (about:blank). The body never echoes the
  bearer token, a host path or row content. A refused batch names the unit that failed in
  instance, as the JSON pointer #/units/<index> of the request. Consumers branch on code,
  never on title.
type: object
allOf:
  - $ref: ../../_shared/schemas/Problem.yaml
  - if:
      required:
        - code
      properties:
        code:
          const: TRANSITION_REJECTED
    then:
      required:
        - status
      properties:
        status:
          const: 409
  - if:
      required:
        - code
      properties:
        code:
          const: WP_ALREADY_CLAIMED
    then:
      required:
        - status
      properties:
        status:
          const: 409
  - if:
      required:
        - code
      properties:
        code:
          const: DEPENDENCIES_NOT_SATISFIED
    then:
      required:
        - status
      properties:
        status:
          const: 409
  - if:
      required:
        - code
      properties:
        code:
          const: WP_NOT_FOUND
    then:
      required:
        - status
      properties:
        status:
          const: 404
  - if:
      required:
        - code
      properties:
        code:
          const: MISSION_NOT_FOUND
    then:
      required:
        - status
      properties:
        status:
          const: 404
  - if:
      required:
        - code
      properties:
        code:
          const: STATUS_LOCK_HELD
    then:
      required:
        - status
      properties:
        status:
          const: 409
  - if:
      required:
        - code
      properties:
        code:
          const: BOOKKEEPING_DOUBLE_EVENT_ID
    then:
      required:
        - status
      properties:
        status:
          const: 409
  - if:
      required:
        - code
      properties:
        code:
          const: COORD_STATUS_SURFACE_DIVERGED
    then:
      required:
        - status
      properties:
        status:
          const: 409
  - if:
      required:
        - code
      properties:
        code:
          const: PROTECTED_BRANCH_REFUSED
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: DESTINATION_REF_NOT_FOUND
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: DESTINATION_REF_INVALID_SHAPE
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: DESTINATION_REF_NOT_LOCAL
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: BOOKKEEPING_WORKTREE_MISSING
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: FALLBACK_COORD_WORKTREE_UNRESOLVED
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: COORDINATION_BRANCH_DELETED
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: COORDINATION_WORKTREE_UNMATERIALIZED
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: OWNED_MISSION_PATH_REFUSED
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: COORD_STATUS_SURFACE_UNREADABLE
    then:
      required:
        - status
      properties:
        status:
          const: 500
  - if:
      required:
        - code
      properties:
        code:
          const: STATUS_EVENT_PERSISTENCE_VERIFICATION_FAILED
    then:
      required:
        - status
      properties:
        status:
          const: 500
  - if:
      required:
        - code
      properties:
        code:
          const: BOOKKEEPING_COMMIT_FAILED
    then:
      required:
        - status
      properties:
        status:
          const: 500
  - if:
      required:
        - code
      properties:
        code:
          const: WRITE_LOCATION_UNVERIFIED
    then:
      required:
        - status
      properties:
        status:
          const: 422
  - if:
      required:
        - code
      properties:
        code:
          const: REQUEST_MALFORMED
    then:
      required:
        - status
      properties:
        status:
          const: 400
  - if:
      required:
        - code
      properties:
        code:
          const: PROTOCOL_VERSION_UNSUPPORTED
    then:
      required:
        - status
      properties:
        status:
          const: 400
  - if:
      required:
        - code
      properties:
        code:
          const: WRITE_TOKEN_INVALID
    then:
      required:
        - status
      properties:
        status:
          const: 401
  - if:
      required:
        - code
      properties:
        code:
          const: REQUEST_REFUSED
    then:
      required:
        - status
      properties:
        status:
          const: 403
  - if:
      required:
        - code
      properties:
        code:
          const: EVENT_ID_CONFLICT
    then:
      required:
        - status
      properties:
        status:
          const: 409
  - if:
      required:
        - code
      properties:
        code:
          const: REQUEST_TOO_LARGE
    then:
      required:
        - status
      properties:
        status:
          const: 413
  - if:
      required:
        - code
      properties:
        code:
          const: SERVICE_BUSY
    then:
      required:
        - status
      properties:
        status:
          const: 503
  - if:
      required:
        - code
      properties:
        code:
          const: SERVICE_DRAINING
    then:
      required:
        - status
      properties:
        status:
          const: 503
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:unknown_lane'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:illegal_transition'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:force_requires_actor_and_reason'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:actor_required'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:dependencies_unsatisfied'
    then:
      properties:
        code:
          const: DEPENDENCIES_NOT_SATISFIED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:workspace_context_required'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:implementation_evidence_required'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:reason_required'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:review_ref_required'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:reviewer_approval_required'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:review_evidence_invalid'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:force_note_required'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:done_evidence_incomplete'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:claim_held_by_other_actor'
    then:
      properties:
        code:
          const: WP_ALREADY_CLAIMED
  - if:
      required:
        - type
      properties:
        type:
          const: 'urn:spec-kitty:write-refusal:start_rejected'
    then:
      properties:
        code:
          const: TRANSITION_REJECTED
  - type: object
    required:
      - code
    properties:
      code:
        $ref: WriteRefusalCode.yaml
        description: The reason class of the refusal. It fixes the status.
        x-derived:
          rule: >-
            The CLI code of the refusal the service reproduces, verbatim, or a protocol-only code
            when the CLI has none; the status follows from the code.
          inputs:
            - path: src/specify_cli/status/write_service_protocol.py
              symbol: REFUSAL_STATUS
      type:
        $ref: WriteRefusalReason.yaml
        description: The guard reason of a guard refusal; absent otherwise.
        x-derived:
          rule: >-
            The guard of the lane state machine that refused the transition, present only when
            code is TRANSITION_REJECTED, WP_ALREADY_CLAIMED or DEPENDENCIES_NOT_SATISFIED.
          inputs:
            - path: src/specify_cli/status/write_service_protocol.py
              symbol: REASON_CODE
examples:
  - $ref: ../examples/WriteRefusal.illegal-transition.yaml
  - $ref: ../examples/WriteRefusal.protected-branch.yaml
  - $ref: ../examples/WriteRefusal.token-invalid.yaml
  - $ref: ../examples/WriteRefusal.service-busy.yaml
  - $ref: ../examples/WriteRefusal.batch-unit.yaml
