title: ReviewOverride
description: >-
  A recorded override of the review step: when it was recorded, by whom, and the stated reason.
  It is present only when an operator overrode the review and the record is complete: at, actor
  and reason all non-empty. A partial record, and the release marker that clears an override (all
  fields empty), are not review overrides and are projected as null, never as an object with
  blank members.
type: object
additionalProperties: false
required:
  - at
  - actor
  - reason
properties:
  at:
    type: string
    format: date-time
    description: When the override was recorded, an RFC 3339 date-time with an offset.
    x-source:
      path: src/specify_cli/status/models.py
      symbol: ReviewOverride
  actor:
    $ref: ActorHandle.yaml
    description: The handle of whoever recorded the override, or null when the stored value is not a valid handle.
    x-source:
      path: src/specify_cli/status/models.py
      symbol: ReviewOverride
  reason:
    type: string
    description: The reason given for the override. Human text. A host path inside it is replaced by `[path]` and an e-mail address by `[email]`; only the matching text is replaced.
    x-source:
      path: src/specify_cli/status/models.py
      symbol: ReviewOverride
