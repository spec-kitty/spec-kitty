title: StatusLaneCounts
description: >-
  The number of work packages in each status lane. All nine keys are always present, a lane
  with no work packages counts 0, and no lanes are grouped. A work package with no events is
  in none of them.
type: object
additionalProperties: false
required: [planned, claimed, in_progress, for_review, in_review, approved, done, blocked, canceled]
