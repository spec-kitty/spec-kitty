title: MissionOverview
description: >-
  The overview of one Mission: its identity, branch shape, work package counts, progress,
  lifecycle state and the position of its event log. The fields are defined in MissionHead;
  this schema closes them, so a record with any other property is invalid. displayNumber is
  display-only and is never an identifier.
type: object
allOf:
  - $ref: MissionHead.yaml
unevaluatedProperties: false
examples:
  - $ref: ../examples/MissionOverview.populated.yaml
  - $ref: ../examples/MissionOverview.sparse.yaml
  - $ref: ../examples/MissionOverview.provisional.yaml
  - $ref: ../examples/MissionOverview.discarded.yaml
