get:
  operationId: getDriftReport
  summary: Read where derived state disagrees with its source.
  description: >-
    Scans the Missions of the project, or the one named by missionId, and reports each place where
    a derived file disagrees with the record that decides it. Three kinds are reported: the status
    snapshot disagrees with the status event log, one of the two status files is missing, and an
    expected lane branch or Mission branch has no local branch. A scan reads and never repairs;
    Rescan is a second call, and scannedAt is the time of this scan. Findings are sorted and at
    most 1000, with truncated true only when MORE than 1000 existed (exactly 1000 is false), and findings: [] means the scan ran and found
    none. A Mission whose declared coordination branch no longer exists is scanned from its own
    directory, which can lag the coordination surface. The stock coordination resolver may query
    remotes, so the outcome depends on the network. An unreachable remote leaves the Mission read from its own directory, and the answer is still a 200; a reachable remote that lacks the declared branch is likewise read from its own directory; any other resolver error is a 500 drift_scan_unreadable.
    The scan is refused as a whole, never partly answered: a missionId that names no Mission
    is a 404, and a Mission the scan cannot read is a 500.
  tags:
    - Drift
  parameters:
    - $ref: ../parameters/DriftMissionId.yaml
  responses:
    '200':
      description: The drift report. It is never cached.
      headers:
        Cache-Control:
          description: Always no-store, because every call scans again and the report is only as old as its scan.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: ../schemas/DriftReport.yaml
    '404':
      $ref: ../responses/DriftMissionNotFound.yaml
    '500':
      $ref: ../responses/DriftScanUnreadable.yaml
    default:
      $ref: ../../_shared/responses/Problem.yaml
