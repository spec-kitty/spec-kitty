name: Last-Event-ID
in: header
required: false
description: >-
  The same text as streamCursor. A browser sends it by itself when it reconnects, with the id of
  the last event it received, so the stream resumes where it stopped. It requires missionId in
  the same way. When both this header and streamCursor are sent, streamCursor is used.
schema:
  $ref: ../schemas/StreamCursorString.yaml
x-provisional:
  open_decision: >-
    That streamCursor wins over Last-Event-ID when both are sent is a proposal for the event
    stream convention, open on #5528.
