description: >-
  The artifact holds a credential, refused with 422 and no content. The credentials are a
  GitHub token (the prefixes ghp, gho, ghu, ghs and ghr, and the fine-grained prefix
  github_pat), an AWS access key id (the prefixes AKIA and ASIA) and the header line of a PEM
  private key. The body is a problem details object whose code is artifact_secret.
content:
  application/problem+json:
    schema:
      $ref: ../schemas/ArtifactRefusal.yaml
