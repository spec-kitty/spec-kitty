contexts:
  - name: "Execution"
    domainVisionStatement: "Terms describing tool invocation and semantic safety gates during generation."
    terms:
      - name: "Checkpoint/Resume"
        definition: "A mechanism that lets a glossary pipeline pause at a generation boundary and pick up where it left off in a later session. The pause point and its context are saved so no work is lost."
      - name: "Clarification Prompt"
        definition: "Targeted question emitted when conflict severity/confidence requires human input before continuing generation."
      - name: "Collaboration Mode"
        definition: "The level of Human-in-Charge involvement during a mission step or workflow. Determines how much real-time oversight the HiC provides versus delegating to agents."
      - name: "communication artifact"
        definition: "A durable artifact produced or consumed by an Effector during a mission run (for example, a commit, a pull request, a review comment). Distinct from planning artifacts (spec, plan, tasks) which are produced before execution begins."
      - name: "Effector"
        definition: "The Actor realized inside the Execution domain — the execution-bound realization of an Actor that performs actions within a Mission, producing or consuming communication artifacts (commits, PRs, comments). Named concept in docs only; no code type until a concrete actor-kind-mismatch bug triggers materialization."
      - name: "Fully Delegated Mode"
        definition: "The agentic stack operates asynchronously without the HiC present. Work proceeds until a final Accept/Decline decision point, where the HiC returns to approve or reject the outcome. Also known as \"AFK mode.\""
      - name: "Generation Boundary"
        definition: "Point where text/code generation would begin and semantic gate policy is enforced."
      - name: "Glossary Strictness"
        definition: "Policy mode controlling warning/block behavior for semantic conflicts."
      - name: "GovernanceContext"
        definition: "The resolved set of Charter and Doctrine artifacts active for an operation. Owned by the Governance bounded module. Resolved once per operation and passed down; never re-derived mid-operation."
      - name: "Hands-off with Review Mode"
        definition: "Agents operate independently during execution, but the HiC reviews results at defined checkpoints before work is accepted or advanced. The HiC is absent during execution but present for review."
      - name: "InfraContext"
        definition: "The resolved set of infrastructure credentials and endpoints for an operation, including git remote URL, CI endpoint, and any external service tokens. Owned by the Execution module."
      - name: "integrating worktree"
        definition: "A linked git worktree whose checked-out branch is a `kitty/mission-…` mission, lane or coordination branch, as recognized by the branch-naming authority (`parse_mission_slug_from_branch`), or whose branch cannot be read (a detached HEAD counts, to fail safe). Its branch will later be integrated into another branch of the same Mission. `spec-kitty upgrade`, run from the repository root checkout, skips integrating worktrees: it writes, stamps and commits nothing in them (`_is_integrating_worktree`, `src/specify_cli/upgrade/runner.py`; ADR 2026-10-04-4)."
      - name: "Interactive Mode"
        definition: "The HiC works alongside agents in real time — conducting interviews, pair-developing, micro-prompting, or making decisions as they arise. The HiC is present and actively steering."
      - name: "Middleware Pipeline"
        definition: "An ordered chain of processing steps that run before a mission step produces output. Each layer in the chain can extract terms, check for semantic conflicts, gate generation, prompt the Human-in-Charge for clarification, or resume from a checkpoint."
      - name: "MissionExecutionContext"
        definition: "The resolved set of workspace root, branch name, feature directory, and WP identity for an operation. Owned by `mission_runtime/context.py` (Open Host Service facade). Resolved once per operation via `resolve_action_context`; never re-derived from CWD by individual command surfaces. Renamed from `ExecutionContext` (FR-012) to match the ubiquitous language and disambiguate from the unrelated `core/context_validation.py::ExecutionContext(StrEnum)`."
      - name: "owned checkout"
        definition: "A linked git checkout of the repository that the canonical owned-mission validator has accepted, for one command invocation, as owning a given Mission. The operator names it with `--owned-checkout <path>`, or a flagless command adopts it after validation. Every lifecycle read and write of that Mission resolves inside it. The validator records the proof as the *validated ownership fact* (`mission_runtime.OwnedCheckout`: owned checkout, repository root checkout, stored topology, target branch)."
      - name: "Pack skill"
        definition: "A thin, parameterized entry point that a team shares through a charter pack instead of through private per-user copies. It is a doctrine artifact of kind `skill` (`ArtifactKind.SKILL`, URN `skill:<id>`), declared as a `<id>.skill.yaml` record (plus a body file in the `prompt` form) in an org pack's `skills/` directory or in the project's `.kittify/doctrine/skills/` directory. A maintainer switches it on with `spec-kitty charter activate skill <id>`. Spec Kitty then renders it as `<skill_namespace>-<id>/SKILL.md` into the project skill root of each configured tool, and records ownership in `.kittify/skills-manifest.json`. A pack skill carries no doctrine substance of its own: it `requires` the procedures and directives that do."
      - name: "repository root checkout"
        definition: "The canonical repository-root working copy of a project — the single checkout from which planning commands run and against which lane worktrees are created. It is distinct from a lane worktree (an isolated per-work-package checkout under `.worktrees/`). This is `primary` Sense C; the charter §Branch-Intent Terminology Governance decrees \"repository root checkout\" as the canonical term for this sense. The retired alias phrases \"primary surface\" and \"primary checkout\" describe it."
      - name: "Seed File"
        definition: "An optional YAML file (`.kittify/glossaries/{scope}.yaml`) that pre-loads domain glossary terms before the runtime starts extracting new ones. Gives teams a head start by defining known terminology upfront."
      - name: "Semantic Check"
        definition: "Deterministic validation step that compares extracted terms with active glossary scope(s) before generation proceeds."
      - name: "Shadow Clone (Isolated Dev Environment)"
        definition: "A contributor/maintainer practice for developing Spec Kitty itself: a standalone repository-root checkout of the Spec Kitty codebase whose CLI and runtime state are pinned to that checkout, so it does not interfere with a machine-global install or with sibling checkouts. Isolation has two axes — code (a clone-local `.venv` editable install placed first on `PATH`, so `spec-kitty` runs the checkout's live `src/`) and state (`SPEC_KITTY_HOME` pointed at a clone-local root so the offline queue, sync daemon, event journal, auth, gate-locks, and trackers do not land in the shared `~/.spec-kitty`). It is the non-containerised isolation option, chosen for speed over the stronger isolation of a container."
      - name: "Slash Command"
        definition: "User-facing command surface that triggers a lifecycle operation (for example specify, plan, tasks, review, merge)."
      - name: "Tool"
        definition: "Concrete runtime product used to execute commands (for example Claude Code, Codex, opencode)."
      - name: "Tool Surface"
        definition: "A tool-visible artifact or configuration entry that Spec Kitty installs, verifies, repairs, or packages for a concrete execution tool. This is `surface` Sense 1 — the tool-facing sense, one of two unrelated domains that share the word. Realized in code by the `ToolSurfaceKind` enum in `src/specify_cli/tool_surface/enums.py` (members `COMMAND_SKILL`, `DOCTRINE_SKILL`, `CONTEXT_FILE`, `RULE`, `HOOK`, `AGENT_PROFILE`, `PLUGIN_MANIFEST`, `NATIVE_CONFIG`, `COMMAND_FILE`), renamed from the bare `SurfaceKind` per ADR 2026-07-23-1."
      - name: "Tool-surface drift"
        definition: "The state of a tool surface file that Spec Kitty generated and still tracks as managed, whose content no longer matches anything Spec Kitty wrote, so Spec Kitty will not overwrite it without consent. In practice: someone edited a generated slash-command file, command skill, managed skill, agent profile or plugin-bundle component. `spec-kitty upgrade` keeps such a file, names it (`Not updated, your local edit was kept: <path>`) and exits non-zero with the outcome `drift_unresolved` and the failure reason `surface_drift` (ADR 2026-10-04-3; whether that exit should be non-zero is open in #5745)."
