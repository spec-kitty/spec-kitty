$schema: https://json-schema.org/draft/2020-12/schema
$id: https://spec-kitty.dev/schemas/doctrine/skill.schema.yaml
title: Pack skill
description: >-
  A thin, parameterised pack skill (URN skill:<id>). Mirrors
  charter.offering.pack_skills.models.PackSkill; form is prompt or wrapper.
type: object
additionalProperties: false
required:
- schema_version
- id
- title
- description
- form
properties:
  schema_version:
    const: '1.0'
  id:
    type: string
    pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
  title:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  triggers:
    type: array
    items:
      type: string
  form:
    enum: [prompt, wrapper]
  body_path:
    type: string
    minLength: 1
  expands_to:
    type: object
    additionalProperties: false
    required: [target]
    properties:
      target:
        type: string
        pattern: ^(builtin:.+|cli:spec-kitty( .*)?)$
      args:
        type: string
  parameters:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        required:
          type: boolean
        description:
          type: string
        default:
          type: string
  invocation:
    type: object
    additionalProperties: false
    properties:
      user_invocable:
        type: boolean
      model_invocable:
        type: boolean
      side_effects:
        type: array
        items:
          type: string
  tools:
    type: array
    items:
      type: string
  version:
    type: string
  maintainers:
    type: array
    items:
      type: string
  overrides:
    type: string
  enhances:
    type: string
allOf:
- if:
    properties:
      form:
        const: prompt
  then:
    required: [body_path]
    not:
      required: [expands_to]
- if:
    properties:
      form:
        const: wrapper
  then:
    required: [expands_to]
    not:
      required: [body_path]
