$schema: https://json-schema.org/draft/2020-12/schema
$id: https://spec-kitty.ai/schemas/doctrine/occurrence-map.schema.yaml
title: OccurrenceMap
description: >-
  Schema for `occurrence_map.yaml` — the per-mission classification artifact
  that governs bulk-edit missions (DIRECTIVE_035). The map declares a target
  term and assigns a per-category action to each of the 8 standard occurrence
  categories so the runtime can enforce path-heuristic diff compliance at
  review time.
type: object
additionalProperties: false
required:
- target
- categories
definitions:
  action:
    type: string
    enum:
    - rename
    - manual_review
    - do_not_change
    - rename_if_user_visible
  operation:
    type: string
    enum:
    - rename
    - remove
    - deprecate
  standard_category:
    type: string
    enum:
    - code_symbols
    - import_paths
    - filesystem_paths
    - serialized_keys
    - cli_commands
    - user_facing_strings
    - tests_fixtures
    - logs_telemetry
  category_entry:
    type: object
    additionalProperties: true
    required:
    - action
    properties:
      action:
        $ref: '#/definitions/action'
  exception_entry:
    type: object
    additionalProperties: false
    required:
    - path
    - action
    properties:
      path:
        type: string
        minLength: 1
      action:
        $ref: '#/definitions/action'
      reason:
        type: string
      field_path:
        description: >-
          Optional dot-separated YAML field path (e.g.
          "tactic-references") scoping this exception to ONE field
          inside files matching `path` (WP02, FR-002/C-005). Without this,
          `path` overrides the WHOLE file's verdict — which cannot express a
          mission whose exemptions are field-scoped when every governed file
          ALSO carries entries the category-level action must still classify
          normally (e.g. an agent profile's `directive-references` field
          must never change while `tactic-references` in the SAME
          file migrates). When present, the file's category-level action
          still governs the whole file, and the reviewer-facing diff check
          additionally records that `field_path` is pinned to `action`
          (see `specify_cli.bulk_edit.diff_check.assess_file`). Omitting
          this key leaves legacy single-term maps validating unchanged
          (C-OMAP-1).

          KNOWN LIMITATION — do not read the zero-producer lint's green as
          coverage of this slot. `field_path` collides as a BARE NAME with
          unrelated locals in six src/charter/offering/**/validation.py modules, so it
          reads as "produced" whether or not any artefact authors it. Verified
          by mutation: deleting every deliberate producer leaves that lint
          green. Closing it needs per-kind namespacing in the lint, which its
          own docstring places out of scope. Tracked upstream as #2967.

          Consequence to know BEFORE that lands: `field_path` has no in-tree
          artefact producer at all. Its only real producers are per-mission
          `kitty-specs/**/occurrence_map.yaml` files, which the lint does not
          scan. So when namespacing lands this slot surfaces as a FALSE POSITIVE,
          not as debt. Do not spend the zero-slack `unassigned` baseline hatch on
          it, and do not "fix" it by re-uncommenting the template example — that
          shipped consumer projects a live placeholder exception, which is why it
          was reverted.

          A pin is ADVISORY: it surfaces the field to the reviewer and does not
          block, and nothing verifies the field was actually unchanged. `mission
          B2` must not read `do_not_change` here as enforcement.
        type: string
        minLength: 1
  move_entry:
    type: object
    additionalProperties: false
    required:
    - from
    - to
    properties:
      from:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      to:
        type: string
        minLength: 1
      reason:
        type: string
  structural_target_entry:
    type: object
    additionalProperties: false
    required:
    - path
    - reason
    properties:
      path:
        description: >-
          A concrete file path (with an extension, e.g. "src/foo/bar.py") or
          an extension-bounded glob (e.g. "src/foo/*.py", "**/bar_*.py")
          naming ONE structural-edit exemption. Bare directories,
          directory-prefixes, and unbounded globs ("*", "**", "**/*") are
          rejected by the runtime validator
          (`specify_cli.bulk_edit.occurrence_map._is_narrow_structural_path`)
          — this is the load-bearing narrowness invariant that keeps the
          exemption from degrading into a blanket "ignore all src/*.py".
        type: string
        minLength: 1
      reason:
        description: >-
          Required, non-empty justification for why this specific file's
          change in THIS mission is a genuine structural code edit (new
          function, refactor) rather than a bulk find/replace occurrence.
          Surfaced verbatim in the review-time gate output as a per-file
          warning whenever the exemption fires, so the bypass is never
          silent.
        type: string
        minLength: 1
properties:
  target:
    type: object
    additionalProperties: false
    required:
    - term
    properties:
      term:
        type: string
        minLength: 1
      replacement:
        type:
        - string
        - 'null'
      operation:
        $ref: '#/definitions/operation'
  categories:
    type: object
    minProperties: 1
    additionalProperties:
      $ref: '#/definitions/category_entry'
  exceptions:
    type:
    - array
    - 'null'
    items:
      $ref: '#/definitions/exception_entry'
  moves:
    description: >-
      Optional multi-path structural-move block (IC-10, #1815). Each entry maps
      one or more `from` source paths to a single `to` destination path,
      describing a structural relocation that the eight single-term-rename
      categories cannot express. Omitting this block leaves legacy single-term
      maps unchanged (C-OMAP-1 backward compatibility).
    type:
    - array
    - 'null'
    items:
      $ref: '#/definitions/move_entry'
  structural_targets:
    description: >-
      Optional per-file structural-edit exemption block. Each entry names ONE
      path (file or glob) whose changes in THIS mission are a genuine
      structural code edit (new function, refactor) rather than a bulk
      find/replace occurrence, exempting it from the `do_not_change` path
      heuristic. Deliberately narrow — one path/glob at a time, never a
      blanket exemption for a whole category or extension. Omitting this
      block leaves maps predating this declaration unchanged (C-OMAP-1
      backward compatibility).
    type:
    - array
    - 'null'
    items:
      $ref: '#/definitions/structural_target_entry'
  status:
    type:
    - object
    - 'null'
    additionalProperties: true
