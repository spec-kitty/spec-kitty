# Minimal charter pack — a small, curated starting point for a project
# that wants a sane governance baseline WITHOUT running the full charter
# interview (FR-005, #3064; relocated from the doctrine-asset tier to
# first-class pack status alongside `default.yaml`, #3064 follow-up).
#
# This is deliberately NOT a copy of `default.yaml` (this same directory),
# which activates ALL built-in artifacts across every kind (the semantic
# inverse of "minimal"). If you want everything spec-kitty ships, use that
# pack instead; use this one when you want a small, legible baseline you can
# grow from.
#
# Usage: apply it to a project's `.kittify/config.yaml` with:
#   spec-kitty charter pack apply minimal
# List all shipped built-in packs (this one included) with:
#   spec-kitty charter pack list
#
# Scope note: this pack only trims directives and tactics. It declares no
# activated_* key for styleguides, toolguides, paradigms, procedures,
# agent_profiles, mission_step_contracts, or glossary_packs -- those kinds
# fall back to "admit all built-ins" (the three-state None/absent behaviour)
# until a project explicitly activates a subset. "Minimal" describes the
# curated directive/tactic baseline, not every kind spec-kitty governs.

activated_kinds:
  - directives
  - tactics

mission_type_activations:
  - software-dev

# A small, curated subset of foundational built-in directives -- not the
# full catalog. Picked for broad applicability: architectural integrity,
# spec fidelity, locality of change, efficient tooling, and the test/type
# quality gate.
activated_directives:
  - 001-architectural-integrity-standard
  - 010-specification-fidelity-requirement
  - 024-locality-of-change
  - 028-search-tool-discipline
  - 030-test-and-typecheck-quality-gate

# A small, curated subset of foundational built-in tactics. (Boring code
# review is a styleguide; the scope note above admits every styleguide.)
activated_tactics:
  - acceptance-test-first
