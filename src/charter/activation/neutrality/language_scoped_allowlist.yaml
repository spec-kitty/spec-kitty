# Language-scoped path allowlist. Schema: contracts/language-scoped-allowlist-schema.yaml
#
# Every entry here declares a repo-relative file as intentionally language-scoped,
# exempting it from the generic neutrality lint. Before adding an entry:
#   1. Confirm the file genuinely requires language-specific vocabulary (e.g., Python
#      tool names are the *subject*, not an accidental bias).
#   2. Provide a clear `reason` so future reviewers can audit the decision.
#   3. Verify the path resolves to an existing file (stale entries fail the lint).
#   4. Run `pytest tests/charter/test_neutrality_lint.py` to confirm lint passes.
schema_version: "1"
paths:
  - path: "packs/built-in/agent_profiles/python-pedro.agent.yaml"
    scope: python
    owner: "charter team"
    reason: "Shipped Python specialist agent profile (python-pedro); pytest/pip references are intentional."
    added_in: "3.2.0"
