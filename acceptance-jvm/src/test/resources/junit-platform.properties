# JUnit-Platform Cucumber runner configuration (T016, FR-006/FR-011).
#
# The runner is realised through the JUnit Platform's engine auto-discovery rather than a
# `@Suite` class: WP03's build.gradle already sets the `cucumber.features` system property (the
# external `../tests/scenarios` path), the `cucumber.plugin` Allure plugin, and threads
# `cucumber.filter.tags` through from the invoking JVM. Gradle's `useJUnitPlatform()` then runs the
# Cucumber engine directly from those properties.
#
# A `@Suite` class is deliberately NOT added: because the `cucumber.features` system property
# already selects the features at top-level discovery, a suite that includes the Cucumber engine
# would select the same scenarios a second time and execute every scenario twice. This file plus
# build.gradle's system properties give exactly one clean run per scenario.
#
# Only glue discovery is set here; features, the Allure plugin and the tag filter come from
# build.gradle (system properties take precedence), so they are not duplicated (which would also
# register the Allure plugin twice).
cucumber.glue=kitty.acceptance
cucumber.execution.dry-run=false
