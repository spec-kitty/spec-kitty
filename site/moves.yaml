# Docsite moves ledger — standing, repository-level, APPEND-ONLY (#6927, absorbs #2358).
#
# Every published route that moved, as `from -> to`. ADR
# docs/adr/4.x/2026-10-31-1-the-docsite-is-built-with-doc-kitty.md D-5.
# DocFX's scripts/docs/redirect_map.yaml is DERIVED from this file:
#   python3 scripts/docs/redirect_stub_generator.py regenerate-map
# A later doc-kitty generator (#6933) reads the same entries.
#
# Route form: site-relative legacy published path with a leading slash
# (`/guides/x.html`, `/adr/1.x/index.html`). Chains are allowed and collapse to
# their final route (ADR D-5 rule 2). A route that is no longer published points
# at its section hub (ADR D-5 rule 4) with a `note`.
#
# Rules: append only; never edit or delete a recorded line. A page that moves
# again gets a NEW entry from its previous route. Each `from` appears once, and no
# `from` is a published page. Each entry carries a `ref` (PR, issue or Mission).
# To record a move: append `- {from: /old.html, to: /new.html, ref: "#<issue>"}`, add the old
# route to site/url-baseline.txt if missing, run `regenerate-map`, then `check-map`.
#
# Provenance (seeded 2026-11-01 on main 7e2ca9fdc, Mission docsite-url-ledgers-01M6BRMR):
#   (a) the 163 entries of scripts/docs/redirect_map.yaml, derived until now from the
#       occurrence maps of the closed Missions common-docs-structural-move-01KW3SBK and
#       common-docs-convergence-01KZMTR9;
#   (b) the 124 file moves of that convergence occurrence map with no redirect (#3914);
#   (c) follow-ups for (b) destinations that later moved again or were archived.
#
# Amendments inherited from scripts/docs/redirect_baseline_urls.json (the old 180-URL
# manifest; its URL set is folded into site/url-baseline.txt):
#   - 2026-07-04, PR #2350, ground operator-ruling: 14 legacy migration/*.html URLs
#     retired without stubs; runbooks relocated to migrations/*.html (#2313). 14 removed,
#     14 added.
#   - 2026-07-04, PR #2350, ground capture-defect: assets/index.html removed, a phantom URL
#     that was never published (#2348; assets/index.md is a verbatim resource).
#   - 2026-07-20, PR mission:docs-ia-onboarding-overhaul-01KY02JB, ground
#     mission-extension: 13 contributor-only guides/*.html URLs added after they moved to
#     development/ (FR-003).
