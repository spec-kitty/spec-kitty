# Identity: MIGRATED to the `spec-kitty` SonarCloud organization (2026-09-14),
# resolving the "open cross-org-rename question" that T062/C-008 recorded and
# deliberately did not gate on -- see
# kitty-specs/ci-pipeline-reinstatement-01M1X35E/sonar-identity-verification.md
# for the pre-migration evidence trail.
#
# Verified live against the token-free SonarCloud API on 2026-09-14:
#   GET /api/components/show?component=spec-kitty_spec-kitty
#     -> {"organization":"spec-kitty","key":"spec-kitty_spec-kitty",
#         "qualifier":"TRK","visibility":"public"}
#   GET /api/organizations/search?organizations=spec-kitty
#     -> {"key":"spec-kitty","name":"Spec Kitty"}
#
# The previous identity (`Priivacy-ai_spec-kitty` / `priivacy-ai`) still exists
# and still holds history; it is simply no longer the analysis target. The
# `SONAR_TOKEN` repository secret must be issued by the `spec-kitty`
# organization for either analysis surface (the per-PR `sonarcloud` job in
# ci-quality.yml and the nightly sonar.yml) to authenticate.
sonar.projectKey=spec-kitty_spec-kitty
sonar.organization=spec-kitty

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11

# Local/manual `sonar-scanner` fallback default only. .github/workflows/sonar.yml
# (WP12) never reads this value for its scheduled/dispatched CI scan -- it
# derives the real per-shard, deduped, comma-joined list at run time
# (contracts/artefact-naming.md) and passes it as
# `-Dsonar.python.coverage.reportPaths=...`, which overrides this file's value.
sonar.python.coverage.reportPaths=out/reports/coverage/coverage.xml

# sonar.python.xunit.reportPath intentionally NOT set (WP12 T065): the
# pre-Convergence single-file path (`xunit-result.xml`) no longer matches the
# per-shard naming contract (`xunit-result-<shard>-<run_id>.xml`), and this
# mission's aggregation work is scoped to coverage only. Wiring xunit
# aggregation into Sonar is a documented follow-up, not a half-wired dangling
# property -- see sonar-identity-verification.md's "xunit gap" section.

sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/**

# sonar.coverage.exclusions: coverage-only denominator fix (FR-012, GC-6).
# These files remain in Sonar's issue analysis (duplication/hotspots/
# maintainability) — they are only excluded from the coverage percentage.
# - **/static/** : dashboard JS/CSS (e.g. dashboard.js ~720 lines);
#   non-Python and untestable by pytest --cov.
# - **/__main__.py : thin CLI entrypoints.
#
# NOTE: src/specify_cli/migration/** is deliberately NOT excluded. It is a
# live, imported, tested package (~5.6k LOC, ~19 runtime importers, ~135 test
# functions), NOT one-shot glue — excluding it would drop covered+tested lines
# from the denominator to shed an uncovered remainder, which games the gate.
# Any 0%-covered one-shot entrypoints inside it are real coverage debt to
# surface, not hide. (The genuine run-once upgrade glue lives in
# src/specify_cli/upgrade/migrations/** and is already covered by the plural
# **/migrations/** entry in sonar.exclusions above.)
sonar.coverage.exclusions=**/static/**,**/__main__.py
