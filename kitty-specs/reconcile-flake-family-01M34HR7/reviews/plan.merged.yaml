  - id: PLAN-FIT-001
    lens: mission-specific / workflow-step-reordering completeness
    severity: 2
    title: >-
      New "Wait for selected shard artefact visibility" step's env-var plumbing
      (SOURCE_RUN_ID/SOURCE_REPOSITORY) is unspecified, though it needs the same
      values every prior step in this job re-declares locally
    evidence:
      - artifact: "plan.md § Architecture Seam and File Placement (§2a.1), item 5; § User Story 3, reordered step list"
      - artifact: "plan.md § User Story 3 § scripts/ci/wait_for_artifacts.py (new): \"Polls GET actions/runs/{SOURCE_RUN_ID}/artifacts ...\""
      - code: ".github/workflows/ci-aggregate.yml:110-112 (step-local env SOURCE_RUN_ID/SOURCE_RUN_ATTEMPT/SOURCE_REPOSITORY in \"Prepare exact source registry and diff\")"
      - code: ".github/workflows/ci-aggregate.yml:148-150 (the same three vars re-declared as step-local env again in \"Select reports from executions retained by the source attempt\", id: select-current)"
    claim: >-
      Every existing `collect`-job step that needs SOURCE_RUN_ID/SOURCE_RUN_ATTEMPT/SOURCE_REPOSITORY
      re-declares them as a step-local `env:` block (there is no job-level `env:` in this job — verified
      by reading the full `collect:` job, lines 88-247, which has no top-level `env:` key). The plan's
      description of the new "Wait for selected shard artefact visibility" step (User Story 3) says it
      "Polls GET actions/runs/{SOURCE_RUN_ID}/artifacts" but neither the reordered step list nor the
      file-placement section states that the new `run:` step must carry its own `env:` block repeating
      these three variables, the way every other step that touches the GitHub API in this job does. This
      is a genuine gap in the plan's own stated design for a file it lists as "modified" (item 5), not a
      hazard from the reordering itself (the reorder itself introduces no dependency problem — see
      mission-specific lens verification below) but a missing wiring detail for the *new* step's own
      inputs.
    remediation: >-
      Add one sentence to plan.md's "User Story 3" `wait_for_artifacts.py` bullet list (or to the
      reordered step list) stating that the new "Wait for selected shard artefact visibility" step must
      declare its own step-local `env:` block for SOURCE_RUN_ID/SOURCE_REPOSITORY (mirroring
      ci-aggregate.yml:110-112 and :148-150), since this job carries no job-level `env:` to inherit from.
      This is a one-line plan clarification, not a design change.

  - id: PLAN-SEQ-001
    lens: Campsite scope
    severity: 4
    title: "Campsite-Clean Scope claims 'no domain-matched debt' but two directly-touched functions exceed the charter's complexity-15 ceiling"
    evidence:
      - artifact: "plan.md § Campsite-Clean Scope (§2a.4), lines 245-249 and 258-262"
      - code: "scripts/ci/fleet_verdict.py:219 (snapshot()) — measured cyclomatic complexity 24 (radon grade D), called twice inside report()/the planned _attempt() extraction, i.e. the literal double-snapshot body this mission wraps in retry"
      - code: "scripts/ci/fleet_main.py:99 (report()) — measured cyclomatic complexity 18 (radon grade C); this is the exact function the plan (plan.md line 361-364) says will be extracted into a private _attempt() helper"
      - code: "scripts/ci/fleet_main.py:45 (snapshot()) — measured cyclomatic complexity 22 (radon grade D)"
    claim: >
      plan.md states, for fleet_verdict.py: "no dead code, duplicated literals, or obvious drift
      found in the surrounding report()/snapshot() region during this reading" and for
      fleet_main.py: "same — no drift found in the touched region", then concludes "All five
      candidate files were read in full during this planning pass and no domain-matched debt
      (dead code, duplicated ≥3x literals, effect-free exception handlers, functions over the
      complexity-15 ceiling) was found in the regions this mission's functional change touches."
      This is factually wrong for the complexity-15 category: `fleet_verdict.py::snapshot()`
      (complexity 24) and `fleet_main.py::report()`/`snapshot()` (complexity 18/22) all sit
      directly in the region this mission's functional change touches — `report()` in both files
      is the function being extracted/wrapped, and `snapshot()` in both files is the literal
      double-snapshot body the retry logic is built around — yet none of the three exceed-15
      functions is mentioned. Separately, the plan's own claim that "extracting [report()'s] body
      into a private `_attempt()` helper... is itself the complexity-reducing move" is only true
      for the thin `report()` wrapper left behind; the extracted `_attempt()` will inherit most of
      `report()`'s existing branching (the plan's own pseudocode shows `_attempt` absorbing
      snapshot/dedupe/re-snapshot/compare), so complexity is relocated under a new name, not
      resolved, unless decomposition is done deliberately.
    remediation: >
      Update plan.md's Campsite-Clean Scope section to (a) name
      `fleet_verdict.py::snapshot()` (24), `fleet_main.py::snapshot()` (22), and
      `fleet_main.py::report()` (18, pre-extraction) as complexity-15-ceiling violations inside
      the touched region, and (b) per Standing Order #2's own two allowed outcomes, either extract
      a narrowly-scoped opening campsite-clean commit that decomposes at least
      `fleet_main.py::report()`/`snapshot()` before the functional retry change lands, or
      explicitly freeze them as baseline debt with a one-line deferral rationale (e.g., "signature
      and behavior unchanged per spec Key Entities; decomposition deferred, tracked separately")
      instead of the current unqualified "no domain-matched debt... was found" claim. If the
      extraction-into-`_attempt()` is kept as the sole tidy-up, the WP prompt should set an
      explicit target (e.g., split evidence-comparison from publish-decision into two helpers) so
      `_attempt()` itself lands under the 15 ceiling rather than silently inheriting `report()`'s
      complexity under a new name.

  - id: PLAN-SEQ-002
    lens: MISSION-SPECIFIC (FR-008 generalization scope)
    severity: 3
    title: "FR-008's shared-helper generalization to a third, structurally-unrelated call site is legitimate but lacks a binding compatibility-contract guardrail"
    evidence:
      - artifact: "spec.md FR-005 (line 97) and FR-008 (line 100), Key Entities item 4 (line 131)"
      - artifact: "plan.md § Summary (lines 15-17), § User Story 2 (lines 309-331), § Deviations item 1 (lines 590-594)"
      - artifact: "tracer-design-decisions.md entry 1 (lines 9-20)"
    claim: >
      Verdict: this is (a), not (b) — a legitimate, charter-aligned reduction of duplication risk
      that stays within spec.md's actual boundaries, not scope drift. FR-008 literally names only
      the fleet_verdict/fleet_main pair, and FR-005/Key Entities item 4 explicitly frame
      `wait_for_artifacts.py` as "a fourth entity this mission is expected to add" — conceived
      independently. But the plan's chosen primitive
      (`retry_with_backoff(attempt, *, max_attempts, backoff_seconds, sleep)`, plan.md lines
      311-325) is deliberately mechanism-only: it has no GitHub awareness, no knowledge of PRs,
      comments, incidents, or shard artifacts, and explicitly leaves the terminal-behavior decision
      (skip-and-defer vs. fall-through-regardless) with each caller (plan.md lines 322-330: "carries
      no GitHub-specific or fleet-verdict-specific behavior"). Sharing this kind of pure
      control-flow utility across three call sites is exactly what the charter's Single Canonical
      Authority governing principle asks for, and hand-rolling a third copy for
      `wait_for_artifacts.py` would repeat, inside the very mission fixing it, the
      hand-duplication anti-pattern FR-008's own rationale names as the root cause
      ("the same pattern that let the current double-snapshot logic drift into two hand-written
      copies in the first place" — spec.md FR-008). The plan and tracer-design-decisions.md both
      already flag this generalization explicitly for reviewer scrutiny, which is the right
      transparency move. The one real gap: nothing in plan.md binds `reconcile_retry.py` to STAY
      domain-agnostic going forward — the description of its current genericness is not phrased as
      a constraint future changes must honor, so a later "just add one GitHub-specific parameter to
      reconcile_retry.py for the fleet-verdict pair's convenience" change could silently couple
      `wait_for_artifacts.py`'s fate to fleet-verdict-pair-specific needs, which is exactly the
      destabilization risk this lens was asked to weigh.
    remediation: >
      Add an explicit compatibility-contract note to plan.md's User Story 2 section (and carry it
      into `scripts/ci/reconcile_retry.py`'s own module docstring at implement time) stating:
      `retry_with_backoff` MUST remain fully caller-agnostic — no GitHub-specific parameters, no
      fleet-verdict-specific terminal-behavior knobs, no optional hooks added for one caller's
      convenience. Any GitHub-specific or fleet-verdict-specific need belongs in the caller's
      `attempt()` closure or a caller-side wrapper, never inside `reconcile_retry.py` itself. This
      converts the plan's current descriptive claim into a binding constraint a future reviewer can
      hold changes to, protecting `wait_for_artifacts.py`'s independence from the fleet-verdict
      pair's evolution.

  - id: PLAN-SEQ-003
    lens: Directive
    severity: 2
    title: "Constitution Check row for Standing Order #9 (red-main discipline) claims 'N/A' while the mission directly modifies the P0-incident-filing function it governs"
    evidence:
      - artifact: "plan.md § Constitution Check table, line 77"
      - artifact: ".kittify/charter/charter.md lines 93-100 (Standing Order #9: red-main discipline)"
      - code: "scripts/ci/fleet_main.py:1-8 (module docstring: 'Red main is P0 under PROGRAM.md section 9 and agents/ci.md step 6'), :23 (INCIDENT marker), :105-138 (report()'s incident-filing logic)"
    claim: >
      plan.md's Constitution Check table row reads: "Red-main discipline (Standing Order #9) | N/A
      — this mission does not touch a red-main state; it changes CI-reporting tooling, not release
      gating | N/A". This understates the actual engagement: `fleet_main.py::report()` — the exact
      function this mission modifies under FR-003/FR-004 — IS the mechanism that implements
      Standing Order #9 (it files/updates the `priority:P0` `from:ci` incident issue for a red
      `main` head, per its own docstring and the `INCIDENT` marker logic). The mission does not
      violate Standing Order #9 in substance (the retry only defers on unresolved snapshot
      disagreement, never suppresses a stabilized/confirmed red result per Invariant (a)/FR-007),
      but labeling the row "N/A" as if the standing order were never engaged is inaccurate and could
      lead a reviewer checking charter compliance to skip verifying this exact safety property.
    remediation: >
      Change the Constitution Check row's status from "N/A" to "PASS" (or similar) and its check
      text to something like: "Standing Order #9 IS engaged — this mission modifies
      fleet_main.py::report(), the function that files the P0 red-main incident — but the
      retry/skip-and-defer change (FR-004) only defers on unresolved snapshot disagreement; it never
      suppresses a stabilized/confirmed red result (Invariant (a)/FR-007), so the red-main safety
      guarantee is preserved, not weakened."

  - id: PLAN-SEQ-004
    lens: Directive
    severity: 2
    title: "Constitution Check omits the charter's binding ATDD-First Discipline (C-011) separate-commit requirement"
    evidence:
      - artifact: "plan.md § Constitution Check table, line 73 (only row addressing red-first/ATDD)"
      - artifact: ".kittify/charter/charter.md § 'ATDD-First Discipline (binding per C-011)', lines 622-635"
    claim: >
      The charter's Governing Principles list "ATDD-first" as a distinct, named governing principle
      (pointing to "the ATDD-First Discipline section below"), and that section (binding per C-011)
      states a specific, stricter requirement than plain red-first testing: "The ATDD test is
      committed as a separate commit (often the first commit of the lane) BEFORE any implementation
      commits," and "the reviewer verifies red→green: the test was RED on the WP's
      planning_base_branch AND GREEN on the WP's final commit." plan.md's Constitution Check table
      only cites "Standing Order #4, DIRECTIVE_041" (test-remediation/red-first discipline) for this
      row, and does not cite C-011 anywhere in the document (verified: no match for "C-011",
      "separate commit", "first commit", or "planning_base_branch" in plan.md). This is a real,
      more specific binding rule the plan's Constitution Check does not surface, so a WP
      implementer following only plan.md could bundle a new retry unit test into the same commit as
      its implementation, satisfying NFR-003's "run against unmodified surface first" in-session
      but not C-011's commit-history requirement a reviewer will check.
    remediation: >
      Add an explicit citation to charter.md's "ATDD-First Discipline (binding per C-011)" section
      in the Constitution Check table (either as a new row or appended to the existing red-first
      row), stating that each WP's first commit must be the failing retry test alone — committed
      separately and BEFORE the retry implementation commit(s) — so tasks.md/the implement phase
      structures each WP's git history accordingly and the reviewer can verify red-on-base,
      green-on-final per C-011.

  - id: PLAN-VERIFY-001
    lens: Gates
    severity: 4
    title: "Gate Statement misdescribes how the `ci` module shard is reached — ci-modules.yml is NOT gated by ci-router.yml's `ci` filter group"
    evidence:
      - artifact: "plan.md § Gate Statement (Triggers, hard-enforced), the `ci-modules.yml`'s `ci` shard bullet"
      - code: ".github/workflows/ci-router.yml:181-193"
      - code: ".github/workflows/ci-modules.yml:37-50"
      - code: ".github/ci-module-registry.yml (module: ci, roots: scripts/ci/**, .github/workflows/**)"
    claim: >-
      plan.md states the `ci` shard is "the actual test *executor* for this diff, reached via
      `ci-router.yml`'s `ci` filter group (`scripts/ci/**` + `.github/workflows/**`)". This is
      factually wrong. `ci-router.yml`'s own header comment for the `ci` filter group says
      verbatim: "No job gates on this group BY DESIGN: the per-PR executor for these paths'
      guard suite (tests/ci) is the ci-modules.yml module matrix, which runs on every PR" —
      i.e. ci-router.yml explicitly disclaims gating anything with this output. `ci-modules.yml`
      is a wholly separate workflow file, triggered directly and independently by its own
      `on: pull_request` / `on: push` / `on: workflow_call` block (lines 37-50), with its own
      `generate-matrix` job that diff-scopes via `scripts/ci/gate_selection.py`'s
      `select_modules` reading `git diff` directly — not by consuming any `ci-router.yml`
      job output. The two workflows both use the same `gate_selection.py` authority in
      PARALLEL, not in a "reached via" dependency chain. The practical bottom line (the `ci`
      shard does execute against `scripts/ci/**` + `.github/workflows/**` changes) happens to
      still be correct, because ci-modules.yml's own independent diff-scoping selects the `ci`
      module row for this diff's paths — but the causal mechanism the Gate Statement asserts
      contradicts the cited source files, which is exactly the "verified, trust us" failure
      mode this section must not exhibit.
    remediation: >-
      Rewrite the bullet to state that `ci-modules.yml` is triggered directly by the same
      `pull_request`/`push` events (not routed through `ci-router.yml`), and that its own
      `generate-matrix` job independently selects the `ci` module row (via
      `scripts/ci/gate_selection.select_modules` against `.github/ci-module-registry.yml`) for
      diffs touching `scripts/ci/**` or `.github/workflows/**`. Drop the "reached via
      ci-router.yml's `ci` filter group" framing entirely — cite `ci-modules.yml`'s own trigger
      block and `generate-matrix` job instead.

  - id: PLAN-VERIFY-002
    lens: "MISSION-SPECIFIC (Retry Budget Rationale, NFR-001) — part (a)"
    severity: 2
    title: "Artifact-visibility propagation-lag claim is stated as established fact with no citation or hedge"
    evidence:
      - artifact: "plan.md § Retry Budget Rationale (NFR-001), the `wait_for_artifacts.py` bullet"
      - artifact: ".kittify/charter/charter.md § Writing, Communication & Diagramming Doctrine → Supporting workflows (\"every factual claim in a research output is traceable to a named source (an unsourced claim is a hypothesis and must be labelled one)\", `research-citation-discipline` styleguide)"
    claim: >-
      The rationale for the 8-attempt/~155s artifact-poller budget states: "GitHub Actions
      artifact-listing propagation lag (the actual race) is typically observed on the order of
      single-digit-to-tens-of-seconds after upload completion" — presented as an established
      empirical fact, with no citation (no GitHub docs link, no incident log, no measurement,
      no reference to #4675's comment thread data). NFR-001 explicitly permits the plan to pick
      numbers with "a stated rationale" without requiring the rationale be measured, so this is
      not a hard NFR-001 violation and the provisional/tunable framing elsewhere in the plan
      partially mitigates the risk. But per the charter's citation-discipline standard, an
      unsourced factual claim must be labelled a hypothesis, and this one is not — a reviewer
      could mistake "typically observed" for a grounded figure rather than an assumption.
    remediation: >-
      Either cite a concrete source for the propagation-lag figure (a GitHub Actions
      documentation page, an incident report, or observed timing data from #4675's own
      thread), or explicitly relabel the sentence as an unverified working assumption, e.g.
      "this is our working hypothesis, not a measured figure — SC-004's post-merge watch is
      what validates or corrects it."

  - id: PLAN-VERIFY-003
    lens: "MISSION-SPECIFIC (Retry Budget Rationale, NFR-001) — part (b)"
    severity: 3
    title: "Plan does not commit each of the three call sites to its own exact-attempt-count termination assertion — only the shared primitive is clearly so committed"
    evidence:
      - artifact: "plan.md § Retry Budget Rationale (NFR-001), closing paragraph: \"Both budgets are unit-tested for their bound itself (a mocked source that never stabilizes must still terminate after exactly the stated attempt count...)\""
      - artifact: "plan.md § Project Structure, tests/ci/ file list (test_reconcile_retry.py \"the shared primitive's own unit tests\"; test_wait_for_artifacts.py \"FR-005/006 mocked-GH-artifacts-API tests\"; test_fleet_verdict.py/test_fleet_main.py \"new retry tests + one re-pinned existing test\")"
      - artifact: "spec.md NFR-003 (requires asserting \"the recovery path\" and \"the terminal path\" per surface, but does not itself require pinning an exact attempt-count number at each call site)"
    claim: >-
      `retry_with_backoff` takes `max_attempts` as a caller-supplied parameter, so "terminates
      after exactly the stated attempt count" is a property the shared primitive can prove once
      generically (any N) in `test_reconcile_retry.py`. Whether each of the three call sites
      (`fleet_verdict.py::report()`, `fleet_main.py::report()`, `wait_for_artifacts.py`) is
      actually WIRED with the plan's stated numbers (4, 4, 8) is a separate, call-site-specific
      fact that only a test asserting the mock's exact call/attempt count at that call site can
      catch. The Project Structure test-file list describes each call-site file only generically
      ("new retry tests", "mocked-GH-artifacts-API tests") — none of these descriptions commits
      to asserting the wired constant itself. A call-site wiring bug (e.g. `fleet_main.py`
      accidentally passed `max_attempts=3`) would pass every test description given here as long
      as the call site "eventually skips"/"eventually recovers", because none of the described
      tests are explicitly required to check the exact attempt count at that specific site — only
      the generic primitive test in `test_reconcile_retry.py` is clearly committed to that
      exactness, and it tests the primitive's own looping, not any specific call site's wiring.
    remediation: >-
      Add an explicit sentence in the Project Structure / NFR-003 test plan requiring each of
      `test_fleet_verdict.py`, `test_fleet_main.py`, and `test_wait_for_artifacts.py` to assert
      the mock's exact call count at the exhausted-budget path (e.g. `assert mock_snapshot.call_count == 4`
      for the fleet-verdict pair, `== 8` for the artifact poller), so the plan's own stated
      budget numbers are pinned at each call site, not only proven generically in the shared
      primitive's test file.

  - id: PLAN-VERIFY-004
    lens: "Revert discipline"
    severity: 3
    title: "NFR-003's red-first clause is concretely walked through for only 2 of its 4 required test surfaces"
    evidence:
      - artifact: "plan.md § Constitution Check table, \"ATDD-first / red-first\" row (generic restatement only: \"Planned — binding on implement phase\")"
      - artifact: "plan.md § \"Existing Test That Must Change, and Why That Is Not a Regression\" (concretely addresses red-first only for the two EXISTING tests being re-pinned in test_fleet_verdict.py/test_fleet_main.py, explicitly noting \"NFR-003's red-first clause is satisfied here in the inverse direction from a brand-new test\")"
      - artifact: "plan.md § User Story 3 / Safety Invariants (describes wait_for_artifacts.py's new tests and FR-009's new isolation tests, but never states how red-first applies when there is no pre-existing entry point to run red against)"
      - artifact: "spec.md NFR-003 (\"Each new retry unit test MUST first be run against the unmodified (pre-fix) surface and confirmed to fail the way the current code does today ... before the retry implementation is added\")"
    claim: >-
      The plan concretely satisfies red-first only for the two pre-existing-test-edit surfaces
      (the `test_fleet_verdict.py`/`test_fleet_main.py` "publication rechecks head" tests being
      re-pinned) — and explicitly frames that as the inverse case (the test is already red today
      by design). It never explains how "red-first through the pre-existing entry point" applies
      to: (a) the brand-NEW recovery-path tests inside those same two files (as opposed to the
      one edited existing test); (b) `wait_for_artifacts.py`'s entirely new test file, where
      there is literally no pre-existing entry point (the module does not exist pre-fix) to run
      red against; or (c) FR-009's cross-invocation isolation test, which has no pre-fix failure
      mode to reproduce at all (pre-fix code has no retry state to leak in the first place, so
      the property trivially holds before this mission and cannot be run "red" against unmodified
      code). This leaves 2 of NFR-003's 4 required test surfaces (wait_for_artifacts.py, FR-009
      isolation) with no concrete red-first application described, risking the implement phase
      either skipping red-first there or a reviewer being unable to verify it was done.
    remediation: >-
      Add an explicit note defining how red-first is satisfied for surfaces with no pre-existing
      entry point: for `wait_for_artifacts.py`, specify running the new recovery/terminal tests
      against a stub single-attempt (no-loop) version of the function first and confirming they
      fail; for FR-009's isolation test, state explicitly that it is exempted from red-first
      because no pre-fix analog exists (own that exemption rather than leaving it silently
      unaddressed), and add one sentence confirming the NEW (non-re-pinned) recovery-path tests
      inside test_fleet_verdict.py/test_fleet_main.py are also run red-first against the
      unmodified `report()` (expecting the existing immediate `ValueError`) before the retry
      wrapper lands.
