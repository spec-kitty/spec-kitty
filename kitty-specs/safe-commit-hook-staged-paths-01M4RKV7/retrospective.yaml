  summary: 'Tracer: [2026-10-12][review] POSIX-normalize both sides of the path comparison (adversarial fold).'
  evidence_refs:
  - e-010
  details: "- **[2026-10-12][review] POSIX-normalize both sides of the path comparison (adversarial fold).** The\n  pre-PR
    adversarial squad found a Windows release-blocker: `git diff-tree` output is always\n  forward-slashed, but `str(Path)`
    uses backslashes on Windows, so comparing the committed set\n  against `normalized_files` directly would false-positive
    on every nested-path commit (even with no\n  hook) and mutate the index. Both sides now route through `kernel.paths.to_posix`
    (the #2836\n  separator seam). Added a nested-path no-hook regression test so `ci-windows.yml` exercises it; the\n  single-component
    fixtures could not. Documented the individual-files precondition (Finding 2,\n  latent). Finding 3 (re-sync drops a `git
    add -p` partial stage of a swept path) matches existing\n  `_sync_real_index_after_commit` behaviour and is accepted."
