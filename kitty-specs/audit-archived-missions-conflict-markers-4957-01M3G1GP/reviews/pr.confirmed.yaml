findings:
- id: PR-CONTRACT-001
  lens: Contract vs implementation / Fakeable DoD (shrink-only ratchet)
  severity: 4
  title: Shrink-only exemption ratchet is co-located and vacuous-by-construction; its exact-equality assertion
    also contradicts FR-005's stated shrink allowance
  evidence:
  - artifact: spec.md FR-005, NFR-003
  - code: tests/architectural/test_archive_root_byte_identical.py:787 (_CONFLICT_MARKER_SCAN_EXEMPTIONS)
  - code: tests/architectural/test_archive_root_byte_identical.py:791 (_CONFLICT_MARKER_EXEMPTION_BASELINE)
  - code: tests/architectural/test_archive_root_byte_identical.py:930-935 (test_conflict_marker_exemption_allowlist_is_shrink_only)
  claim: '`_CONFLICT_MARKER_EXEMPTION_BASELINE` (line 791) is not an externally-anchored baseline the
    way `_baselines.yaml`''s registered modules are — it is a second module-level frozenset literal, defined
    four lines below the live exemption set (line 787) in the same file, with the identical value. The
    ratchet test `test_conflict_marker_exemption_allowlist_is_shrink_only` (line 930) only fails if a
    contributor edits the live set without also editing the baseline; the natural way to add a new exemption
    is to edit both together in one PR, which this mechanism cannot distinguish from a legitimate operator
    re-baseline. NFR-003''s promise that unauthorized growth "must fail a dedicated shrink-only test...
    until an explicit code review re-baselines it" is therefore enforced only socially (a reviewer must
    notice two frozensets moved together), not technically — the same failure mode Standing Order #5 exists
    to close by construction. FR-008''s positive-control test only proves the comparator helper (`_assert_exemption_set_is_shrink_only`,
    line 861) detects an artificially-augmented candidate against a *held-fixed* baseline; it never exercises
    the real risk (both real constants edited together in one diff). Separately, line 935 (`assert _CONFLICT_MARKER_SCAN_EXEMPTIONS
    == _CONFLICT_MARKER_EXEMPTION_BASELINE`) requires *exact* equality, not subset, so a legitimate future
    *shrink* (e.g. removing `tests/git_ops/test_git.py` once that fixture no longer needs the exemption)
    would false-red this test unless the baseline constant is edited in the same commit — directly contradicting
    FR-005''s own text: "the exemption set can shrink over time but never silently grow." A shrink should
    never need a "re-baseline."

    '
  remediation: 'Anchor the baseline independently of the live exemption set — e.g. read the previous value
    from a source that is not trivially co-edited in the same diff hunk (a separate reviewed constants
    file, or wiring into `tests/architectural/_baselines.yaml`''s existing growth/shrink machinery per
    spec.md Clarification (k)''s own noted future path) — so a reviewer sees the two values move on genuinely
    distinct lines/commits rather than assuming adjacency is safe. At minimum, drop line 935''s exact-equality
    assertion (subset-only, as `_assert_exemption_set_is_shrink_only` already implements, is the actual
    shrink-only contract FR-005 specifies) so a legitimate shrink does not fail this test.

    '
  source_group: contract
  refute_verdict: confirmed
  refute_reason: 'Verified directly at lines 787/791/930-935: the baseline is a second module-level frozenset
    literal 4 lines below the live set with an identical value (co-editable in one diff hunk), and line
    935''s `assert _CONFLICT_MARKER_SCAN_EXEMPTIONS == _CONFLICT_MARKER_EXEMPTION_BASELINE` requires exact
    equality, which would hard-FAIL any legitimate future shrink unless the baseline constant is edited
    in lockstep -- directly contradicting FR-005''s "the exemption set can shrink over time" and NFR-003''s
    own cited Burn-down Policy analogy ("growth ... FAILS CI, shrinkage WARNS").'
- id: PR-CONTRACT-002
  lens: Silent success — per-file decode skip
  severity: 3
  title: Per-file decode skip is broader than "legitimate binary blobs" and its visibility promise does
    not hold in the real CI invocation
  evidence:
  - artifact: spec.md Edge Cases (binary/non-text tracked files); NFR-002
  - code: tests/architectural/test_archive_root_byte_identical.py:846-854
  - code: .github/workflows/ci-router.yml:500-502 (archive-freeze job)
  - artifact: kitty-specs/audit-archived-missions-conflict-markers-4957-01M3G1GP/reviews/wp-WP02-cycle2.yaml
      WP02-R-002 resolution
  claim: 'The except clause at line 848 catches `(UnicodeDecodeError, OSError)` for *any* tracked file,
    not only "legitimate binary blobs" as spec.md''s Edge Cases rationale frames it. A genuine text file
    with one stray non-UTF-8 byte anywhere (a plausible symptom of the exact kind of botched-merge corruption
    this guard exists to catch) is silently excluded from the marker scan too, even though its ASCII `<<<<<<<
    `/`>>>>>>> ` marker bytes would otherwise match `_CONFLICT_MARKER_PATTERN` fine on an otherwise-valid
    line. The skip is only surfaced via `logger.warning` (line 853); the actual archive-freeze CI invocation
    (`.github/workflows/ci-router.yml:502`: `uv run --frozen pytest tests/architectural/test_archive_root_byte_identical.py
    -q`) passes no `--log-cli-level`/`--log-cli-format`, and no `log_cli`/`log_level` setting exists in
    pytest.ini or pyproject.toml, so pytest''s logging plugin captures but does not print WARNING records
    for a *passing* test in that invocation. wp-WP02-cycle2.yaml''s WP02-R-002 resolution asserts the
    skip is "visible via caplog or --log-cli-level=WARNING in CI," but the cited CI job does not pass
    that flag, so the claim does not hold for the transcript anyone reviewing a green archive-freeze run
    would actually see. Net effect: a real corruption landing in a non-UTF-8-decodable tracked file produces
    a green run with a scanned-file count that looks like a clean floor, and a warning nobody sees.

    '
  remediation: 'Decode with `errors="replace"` (or `"surrogateescape"`) instead of strict UTF-8 for the
    content scan, so a file is skipped only for a true OSError (unreadable, permission, dangling symlink)
    rather than for any encoding wrinkle — the anchored regex only needs clean ASCII at a line start,
    which survives lossy decoding of the surrounding bytes, so this closes the false-negative gap directly
    instead of relying on log visibility. If a narrower binary/decode-skip path is still wanted for true
    binary blobs (e.g. detect via a NUL-byte heuristic before attempting decode), keep the warning but
    also assert on it in the test (fail if the skipped-file set is non-empty and none of the skipped paths
    match a maintained known-non-text-extension allowlist), so a skip is provably visible in the gate''s
    own pass/fail signal rather than only in an unread log stream.

    '
  source_group: contract
  refute_verdict: confirmed
  refute_reason: Confirmed the except clause at lines 846-854 catches (UnicodeDecodeError, OSError) for
    any tracked file with no binary/mime pre-check, so a genuinely corrupted text file with one stray
    non-UTF-8 byte is silently skipped, not just true binaries; also confirmed ci-router.yml:502 runs
    `pytest ... -q` with no --log-cli-level and neither pytest.ini nor pyproject.toml sets log_cli/log_level,
    so a WARNING on a passing test is not printed in that exact invocation -- the cycle-2 reviewer's resolution
    rationale ("visible via ... --log-cli-level=WARNING in CI") is factually wrong for this specific job,
    so its ruling is outweighed by the evidence.
- id: PR-TESTS-001
  lens: Would these tests catch it (contrasted against an established sibling precedent)
  severity: 4
  title: New _run_ls_files omits -z, so a non-ASCII/special-char tracked filename is quoted by git and
    silently drops out of content-scanning, contradicting the sibling guard's own documented fix for this
    exact class
  evidence:
  - artifact: spec.md FR-003/FR-004 ("scans tracked repository content for lines matching ... a concrete,
      ground-truth-tied floor")
  - code: tests/architectural/test_archive_root_byte_identical.py:187-196 (_run_ls_files uses ["git",
      "-C", str(root), "ls-files"], no -z)
  - code: 'tests/architectural/test_no_invalid_windows_filenames.py:44-50 (_tracked_paths uses ["git",
      "ls-files", "-z"] with the comment: "-z yields NUL-separated, verbatim paths — this disables git''s
      default core.quotePath C-quoting, which would otherwise wrap a non-ASCII path like café.txt as \"caf\\303\\251.txt\"
      and inject a spurious \"/\\ that false-reds the Windows-illegal guard")'
  claim: 'Without ``-z``, ``git ls-files`` applies default ``core.quotePath`` C-style quoting to any tracked
    path containing a non-ASCII byte or a shell-special character: the path is emitted as a single double-quoted,
    octal-escaped literal (e.g. ``"caf\303\251.txt"``) rather than the real filesystem path. ``_enumerate_tracked_files``
    takes each output line verbatim as ``rel_path``, so ``(root / rel_path).read_text(...)`` in ``_scan_tracked_files_for_conflict_markers``
    then looks for a literal path containing the quote/backslash characters, which does not exist on disk
    — raising ``FileNotFoundError`` (an ``OSError`` subclass). That is caught by the same ``except (UnicodeDecodeError,
    OSError)`` branch used for genuine binary files and logged as "skipping unreadable/binary tracked
    file <mangled-quoted-name>" — the file is never actually content-scanned for conflict markers, even
    though it is correctly counted toward the FR-004 floor (so the floor stays non-vacuous while the *content*
    guarantee silently doesn''t hold for that one path). The sibling architectural test in the same directory,
    ``test_no_invalid_windows_filenames.py``, already hit and fixed this exact defect class with an inline
    comment describing the identical mechanism, and this diff''s new call site does not follow that established
    convention. Confirmed via ``git ls-files | grep -cP ''[^\x00-\x7f]''`` → 0 in the current tree, so
    this is currently latent, not yet triggered — but it is a real, precedented, reachable gap in exactly
    the guarantee FR-003 exists to provide (repo-wide content scanning), and it degrades in the fail-silent
    direction (mislabeled "binary" skip) rather than fail-closed.

    '
  remediation: 'Change ``_run_ls_files`` to ``["git", "-C", str(root), "ls-files", "-z"]`` and split ``result.stdout``
    on ``"\0"`` (matching ``test_no_invalid_windows_filenames.py``''s ``_tracked_paths()`` exactly), so
    tracked paths arrive verbatim regardless of ``core.quotePath``. Add a fixture-repo test with a non-ASCII
    tracked filename (mirroring the existing binary-file fixture) proving it is actually content-scanned,
    not silently skipped.

    '
  source_group: tests
  refute_verdict: confirmed
  refute_reason: 'Reproduced live in a throwaway /tmp git repo: `git ls-files` (no -z) C-quotes a non-ASCII
    tracked filename as a literal octal-escaped string (confirmed core.quotePath defaults to true), which
    `_run_ls_files` (no -z, line 794-809) would feed verbatim into `(root/rel_path).read_text()`, raising
    FileNotFoundError (an OSError) caught by the same except used for binaries -- silently skipping content-scan
    on that path while still counting it toward the floor; the sibling `test_no_invalid_windows_filenames.py:44-50`
    documents this exact mechanism as the reason it uses `-z`, confirmed verbatim by reading it.'
- id: PR-TESTS-003
  lens: Revert test / error-path non-vacuity (ratchet's shrink direction)
  severity: 3
  title: The shrink-only ratchet's actual 'shrink' permission (FR-005's namesake behaviour) has zero test
    coverage — only the 'never grow' and 'stays-equal' cases are exercised
  evidence:
  - artifact: spec.md FR-005 ("enforced as a shrink-only ratchet ... so the exemption set can shrink over
      time but never silently grow")
  - code: tests/architectural/test_archive_root_byte_identical.py:861-866 (_assert_exemption_set_is_shrink_only)
  - code: tests/architectural/test_archive_root_byte_identical.py:930-936 (test_conflict_marker_exemption_allowlist_is_shrink_only,
      asserts subset AND == baseline)
  - code: tests/architectural/test_archive_root_byte_identical.py:938-945 (test_conflict_marker_exemption_shrink_only_ratchet_has_positive_control,
      only exercises growth)
  claim: 'Verified directly (throwaway detached worktree, discarded after): changing ``_assert_exemption_set_is_shrink_only``''s
    body from a subset check (``unexpected = candidate - baseline; assert not unexpected``) to a strict-equality
    check (``assert not unexpected and candidate == baseline``) — i.e. silently deleting the "shrink"
    capability the function''s own name and FR-005 promise — leaves every test in the file passing (ran
    ``-k "shrink or ratchet"``: 2 passed, and the full file''s other tests are independent of this helper).
    The two tests that exercise this helper only ever call it with (a) the live set exactly equal to baseline
    (today''s state) and (b) a live set that is a strict *superset* of baseline (FR-008''s growth positive-control,
    expected to raise). Neither passes a live set that is a strict, non-empty-diff *subset* of baseline,
    so nothing proves the ratchet actually tolerates a shrink — the "shrink-only" name is half unproven
    by test, the untested half being the one word that distinguishes this from a plain equality/no-drift
    gate.

    '
  remediation: 'Add a dedicated positive-control test asserting ``_assert_exemption_set_is_shrink_only(frozenset(),
    _CONFLICT_MARKER_EXEMPTION_BASELINE)`` (or ``baseline - {"tests/git_ops/test_git.py"}``) does *not*
    raise, proving the shrink direction is genuinely permitted and not merely untested-and-coincidentally-working
    alongside the growth-detection test.

    '
  source_group: tests
  refute_verdict: confirmed
  refute_reason: 'Grepped every call site of `_assert_exemption_set_is_shrink_only` (lines 934 and 944
    only): one passes candidate==baseline (today''s live set), the other passes a strict superset (FR-008''s
    growth positive control) -- no call site ever passes a candidate that is a strict, non-empty-diff
    subset of baseline, so the function''s own namesake "shrink" permission has zero direct test coverage,
    exactly as claimed.'
