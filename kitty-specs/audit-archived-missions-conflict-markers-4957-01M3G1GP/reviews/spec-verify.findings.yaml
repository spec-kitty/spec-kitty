findings:
  - id: SPEC-VERIFY-001
    lens: non-vacuity-triad
    severity: 4
    title: "Shrink-only-allowlist leg of the non-vacuity triad self-declares as no-op passable, contradicting its own FR"
    evidence:
      - artifact: "spec.md § FR-005 (Requirements table row: \"No-op passable? | no\")"
      - artifact: "spec.md § SC-004 (\"— [build] · no-op passable: yes\")"
      - artifact: "spec.md § NFR-003 and Clarifications (g) (claims the new shrink-only test \"mirrors the existing `_APPEND_ONLY_SPINE_EXCEPTIONS` / burn-down-policy discipline\")"
      - code: "tests/architectural/test_archive_root_byte_identical.py:114 (_APPEND_ONLY_SPINE_EXCEPTIONS defined) and :150 (_OPERATOR_SANCTIONED_CORRECTIONS defined) — grep confirms no test anywhere in tests/ enforces growth/shrink on either frozenset; the only references to _APPEND_ONLY_SPINE_EXCEPTIONS repo-wide are its own definition and its own consumption inside this same file (line 728)"
      - code: ".kittify/charter/charter.md:599 \"Burn-down Policy (binding per HiC §5a.2 / C-004)\" — governs allowlists registered in tests/architectural/_baselines.yaml only; grep confirms _baselines.yaml has zero references to archive_root/byte_identical/spine_except/sanctioned_correct, so this file's frozensets are not currently under that policy either"
    claim: >
      Standing Order #5 requires three independently-testable legs (concrete floor,
      self-mutation test, shrink-only allowlist). For the third leg, FR-005's own
      table row marks it "No-op passable? no" (i.e. doing nothing must NOT satisfy
      it), yet the corresponding Success Criterion SC-004 explicitly flags itself
      "no-op passable: yes" for the identical requirement. On the current tree the
      exemption set already equals its landed baseline ({"tests/git_ops/test_git.py"}),
      so a "dedicated shrink-only test" that is a bare no-op (e.g. `assert True` or an
      assertion that never actually re-derives the frozenset from source and compares
      it against a baseline) would still pass SC-004 as literally worded, because
      nothing has grown yet. SC-004's own parenthetical gestures at the missing
      positive control ("paired with the growth-detection assertion itself... a test
      that adds a spurious exemption entry must fail this check") but that positive
      control is never promoted to its own numbered FR/AC the way FR-006 explicitly
      is the self-mutation proof for the marker-scan leg — it lives only as a
      dependent clause inside SC-004's rationale, not as a testable requirement of its
      own. Separately, FR-005/NFR-003/Clarification(g)'s claim that the new mechanism
      "mirrors" _APPEND_ONLY_SPINE_EXCEPTIONS's "own discipline" is not accurate: that
      frozenset (and _OPERATOR_SANCTIONED_CORRECTIONS) currently has zero shrink/growth
      enforcement anywhere in the test suite to mirror — the spec is citing an existing
      precedent that does not exist in code, which further weakens confidence that the
      new test's shape is well-specified rather than assumed-by-analogy.
    remediation: >
      (1) Resolve the FR-005/SC-004 no-op-passable contradiction explicitly — set
      SC-004's no-op-passable flag to "no" to match FR-005, and (2) promote the
      positive control already gestured at in SC-004's parenthetical into its own
      numbered Acceptance Scenario or FR (parallel to FR-006): "Given a fixture that
      adds a second entry to the exemption frozenset beyond the landed baseline, when
      the shrink-only test runs, then it fails identifying the spurious entry; given
      the baseline-only set, it passes" — i.e. a genuine self-mutation test for the
      allowlist leg, not just a docstring claim. (3) Correct or drop the "mirrors...
      existing discipline" framing in NFR-003/Clarification(g), since no such
      enforcement test currently exists for _APPEND_ONLY_SPINE_EXCEPTIONS to mirror;
      either cite the repo-wide `_baselines.yaml` Burn-down Policy as the actual
      precedent being extended by analogy, or state plainly that this is a new
      mechanism.

  - id: SPEC-VERIFY-002
    lens: non-vacuity-triad
    severity: 4
    title: "Concrete-floor AC (FR-004) does not tie the reported scan count to an independently verifiable ground truth"
    evidence:
      - artifact: "spec.md § FR-004 (\"assert it scanned a real, non-empty set of tracked files\")"
      - artifact: "spec.md § User Story 2, Acceptance Scenario 1 (\"the new guard test runs... it passes with a non-empty, real count of scanned files\")"
      - artifact: "spec.md § Edge Cases, first bullet (empty git ls-files result must fail/raise)"
      - artifact: "spec.md § User Story 2, Acceptance Scenario 4 (simulated enumeration-failure must raise)"
    claim: >
      FR-004's own acceptance criterion only asserts that the guard's self-reported
      scanned-file count is non-empty on today's tree. Nothing in FR-004, its AC, or
      NFR-002 requires that count to be cross-checked against an independently
      derived ground truth (e.g. asserting the guard's count equals a fixture
      directory's known file count, or equals a fresh, separately-invoked `git
      ls-files | wc -l`). A naive implementation that hardcodes a literal
      (`scanned_count = 9999; assert scanned_count > 0`) without ever calling `git
      ls-files` satisfies AC1 verbatim, exactly the gaming the mission-derived lens
      names ("hardcoding a fixed count rather than actually counting scanned
      files"). The one AC that could indirectly catch this — Acceptance Scenario 4,
      simulating an enumeration failure and asserting the guard raises — only closes
      the gap if the implementation is required to derive both the marker-scan input
      and the floor count from the exact same enumeration call; the spec does not
      say this, so an implementation could route the two through separate code
      paths (a real scan for markers, a decoupled hardcoded floor assertion) and
      still pass every literal AC in the spec.
    remediation: >
      Add an explicit, testable requirement (either as an amendment to FR-004 or a
      new Acceptance Scenario under User Story 2) that the guard's reported floor
      count must be asserted equal to the count of files actually fed into the
      regex scan for that same invocation — e.g. "Given a fixture subtree with a
      known, independently-counted N tracked files and zero conflict markers, when
      the guard runs scoped to that subtree, then it reports scanned-file count ==
      N" — so a hardcoded or decoupled count fails this check even though it passes
      the vaguer "non-empty" wording.

  - id: SPEC-VERIFY-003
    lens: silent-success
    severity: 3
    title: "NFR-002 and the binary/non-text Edge Case give contradictory guidance on decode-error handling"
    evidence:
      - artifact: "spec.md § NFR-002 (\"decode error treated as fatal rather than skip-silently ... must raise a test failure, never return/print a success\")"
      - artifact: "spec.md § Edge Cases, last bullet (\"it either skips genuinely binary blobs by content-type detection or treats a decode failure as informational, but never as silent success for the whole scan\")"
    claim: >
      NFR-002 lists a per-file "decode error" alongside whole-scan failure modes
      (git command failure, unreadable path) and says it must be "treated as fatal
      rather than skip-silently" — i.e. any decode error aborts the guard with a
      failure. The Edge Cases section, addressing the identical decode-error
      scenario for binary/non-text tracked files, explicitly permits the guard to
      *skip* such files (via content-type detection) or treat the failure as merely
      "informational" — i.e. non-fatal, continue the scan. These are two different
      prescriptions for the same trigger (a per-file decode failure): NFR-002 reads
      as "any decode error red-lines the whole guard," while the Edge Case reads as
      "a binary file's decode failure is fine to skip or log, so long as the overall
      scan doesn't silently report false success." An implementer following NFR-002
      literally would fail the guard on any repo containing a single binary tracked
      file with non-UTF-8 content (a plausible corpus state); an implementer
      following the Edge Case would build a skip-and-continue path NFR-002's
      wording seems to forbid. This is exactly the kind of gap Standing Order #5's
      "non-vacuous" framing exists to close before implementation, not after.
    remediation: >
      Reconcile the two: state explicitly whether a per-file binary/decode
      failure (a) always fails the whole guard (drop the Edge Case's skip
      allowance), or (b) is skip/log-and-continue at the per-file level while
      NFR-002's "fatal" language is scoped only to enumeration-level failures
      (git unavailable, unreadable root) — and if (b), make clear that a skipped
      file must still be counted (or explicitly excluded and logged) so it cannot
      silently shrink the FR-004 floor without trace.

  - id: SPEC-VERIFY-004
    lens: baseline-honesty
    severity: 2
    title: "Spec does not explicitly acknowledge that main carries other, unrelated pre-existing reds outside the cited 3-file baseline"
    evidence:
      - artifact: "spec.md § SC-002 and § Clarifications (f) (baseline: 48 passed, 0 failed, main@46ea5bd7f, scoped to the named 3 files)"
    claim: >
      SC-002 and Clarifications (f) correctly scope the baseline claim to an exact
      count on an exact 3-file set ("not 'tests pass' in the abstract"), which is
      good baseline-honesty practice and internally consistent. However, neither
      SC-002 nor the Clarifications explicitly states the complementary fact
      CLAUDE.md's baseline-red-gotcha discipline requires framing against: that
      `main` is known to carry other, unrelated pre-existing red tests elsewhere in
      the suite (the "#3283/#3284 class"), so this mission's green 3-file baseline
      is not itself evidence that the wider repository is clean. C-002's two-file
      blast radius makes this low-risk in practice (the mission has no reason to
      touch those other reds), but the spec's own baseline language would be
      strictly more honest if it said so rather than leaving it to be inferred.
    remediation: >
      Add one sentence to Clarifications (f) or SC-002 noting that this baseline is
      scoped to the 3 named files precisely because main is known to carry other,
      unrelated pre-existing reds elsewhere in the suite (per CLAUDE.md's
      baseline-red-gotcha policy), which this mission's narrow blast radius (C-002)
      does not touch and is not attempting to characterize.
