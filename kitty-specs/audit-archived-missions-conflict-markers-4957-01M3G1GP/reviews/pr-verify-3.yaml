      post-fix worktree at 0dfbfc90c: baseline correctly resolved to main's real landed
      {"legit.txt"} and _assert_exemption_set_is_shrink_only raised on the malicious entry --
      GREEN. Also ran the shipped regression
      test_conflict_marker_exemption_baseline_checks_landed_ref_when_base_predates_constant
      as part of the full 24-test file run -- passes.
      (b) Traced _port_base_candidate_refs -> _select_port_base_refs -> _live_remote_urls
      live in the post-fix worktree: this checkout's only remote is
      origin=https://github.com/spec-kitty/spec-kitty.git (canonical slug), so
      candidate_refs()==["origin/main"] and port_base_rev() resolves via that same ref. In
      CI (ci-router.yml archive-freeze job, fetch-depth:0, standard actions/checkout), a
      same-repo PR's origin is likewise spec-kitty/spec-kitty, so the candidate list is
      identical in CI and locally -- one ref, always fetched, never missing. Structurally,
      _resolve_landed_exemption_baseline uses the SAME candidate list _port_base_rev already
      used to resolve base_rev, in the same process -- so a candidate can only be "missing" in
      a way that also makes base_rev itself unreachable, which routes to outcome (d) (fail
      closed / skip) before _resolve_exemption_baseline is ever called, not a silent bypass.
      Order is canonical remotes first (origin prioritized, then alphabetical), legacy
      "origin/main" appended only if absent. _resolve_landed_exemption_baseline loops in that
      order and returns the first ref whose OWN TIP has the constant, correctly skipping (not
      stopping at) a ref that lacks it -- verified by construction: the mutation fixture in (a)
      passes a single-element candidate list; the loop logic (tests/architectural/test_archive_root_byte_identical.py:944-954)
      has no early-return-on-None inside the loop, only continue-by-falling-through, so a mixed
      list (first ref missing, second ref landed) resolves to the second ref's value, not to
      "never landed."
      (c) ast-parse failure: called the real _parse_frozenset_of_str_constant with a
      syntactically invalid source string (unclosed paren) -- raised SyntaxError uncaught, not
