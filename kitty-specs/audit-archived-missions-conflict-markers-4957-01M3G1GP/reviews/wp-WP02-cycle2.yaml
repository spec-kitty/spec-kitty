  - id: WP02-R-002
    status: resolved
    verification: >
      Commit 433d38f02 adds `logger = logging.getLogger(__name__)` and a
      `logger.warning("conflict-marker scan: skipping unreadable/binary tracked
      file %s (%s)", rel_path, error)` call inside the existing per-file
      UnicodeDecodeError/OSError except block, plus a new
      test_conflict_marker_guard_logs_skipped_undecodable_files test using
      caplog. Independent red check: created a detached scratch worktree
      (git worktree add --detach .../4957-wp02-c2 433d38f02) OUTSIDE the mission
      tree, deleted the logger.warning line, and ran
      `<lane-venv>/python -m pytest tests/architectural/test_archive_root_byte_identical.py
      -k logs_skipped -q` with cwd set to the scratch worktree — result: 1 failed
      (test correctly reds when the fix is removed; non-vacuous). Scratch worktree
      then removed via `git worktree remove --force` and pruned.
      Spec-intent judgment (spec.md Edge Cases: "a skip can never silently shrink
      the floor into a false 'clean' result nor hide which files were not
      content-scanned"): the new test also asserts `scanned_count == 2` for a
      2-file fixture with one undecodable file, so the floor still counts the
      skipped file — the "shrink the floor" half of the spec sentence is
      independently proven, not just claimed. On the "hide which files" half: a
      standard `logging.getLogger(__name__).warning(...)` call is a legitimate,
      literal implementation of "logged" — it is captured by pytest's log
      capture (visible via caplog or --log-cli-level=WARNING in CI), and even
      outside a test harness Python's logging module falls back to a
      last-resort stderr handler for an unconfigured WARNING+ record, so the
      skip is never silent in any of these paths. The spec text requires the
      skip be "logged," not that it be printed to the default CI console
      transcript specifically — reading in a stronger requirement than the
      spec states would be inventing new scope. Ruled: meets the spec's stated
      intent.
  - id: WP02-R-003
    status: resolved
    verification: >
      The fourth _OPERATOR_SANCTIONED_CORRECTIONS comment block's prose "--"
      before "the same defect class..." is now an em dash ("—"), matching the
      three existing entries' style. The implementer left
      `git merge-base --is-ancestor` (in the same comment block) as an ASCII
      double-dash — correctly, since it is a literal CLI flag being quoted for
      a reader to run, not prose; converting it to an em dash would corrupt a
      runnable command. Judged correct: the fix addressed the cosmetic nit
      without touching the one dash that is not prose.
