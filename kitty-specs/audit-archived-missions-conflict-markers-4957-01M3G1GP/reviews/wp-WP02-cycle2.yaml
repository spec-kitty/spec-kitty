      exactly, and carries the required informational-only / does-not-close-#4956
      disclaimer (C-003) in its opening sentence. status.events.jsonl shows T008
      marked done at 2026-09-27T04:20:30Z, twenty-four seconds AFTER the comment was
      posted (04:20:06Z) — the deferred-posting sequencing the orchestrator claimed
