# Occurrence map — mission consolidate-canonical-terminology-01M3GSSV (#3080).
#
# SEMANTIC rename, NOT a blanket find-replace. The term "merge" carries three
# senses; ONLY the lane-consolidation sense becomes consolidate/consolidation.
# git-merge/branch-integration keeps "merge"/"integrate"; publish-to-origin keeps
# "publish". Because the sense is per-occurrence, most categories are
# `manual_review` (the implementer classifies each site against the rubric in
# research.md / classification-larry.md), with hard carve-outs below.
#
# Frozen KEEPS (do_not_change, see exceptions): the persisted `baseline_merge_commit`
# meta.json wire-key (drives phase derivation at mission_runtime/lifecycle_phase.py:237-239),
# the `MergeStrategy` enum + its `"merge"` serialized value, the `state.json`
# filename, and the git merge-driver plumbing. Immutable history (kitty-specs/**,
# docs/adr/**, changelog) is never rewritten.

target:
  term: merge
  replacement: consolidate
  operation: rename   # command surface also REMOVES `spec-kitty merge` (migration-error stub); see cli_commands note + spec C-004

categories:
  # Symbol-by-symbol: rename lane-consolidation-sense symbols (MergeState→ConsolidationState,
  # _run_lane_based_merge→_run_lane_based_consolidation, LaneMergeResult→LaneConsolidationResult);
  # KEEP git-sense symbols (MergeStrategy, merge-driver funcs). Sense-dependent → manual_review.
  code_symbols:        { action: manual_review }
  # The merge/ package and lanes/merge.py are physically renamed → their import paths move.
  # git-sense modules that move with the package keep their internal "merge" symbols.
  import_paths:        { action: rename }
  # state.json path + .kittify/runtime/merge/<id>/ dir are frozen; worktree paths unaffected.
  filesystem_paths:    { action: manual_review }
  # FROZEN: baseline_merge_commit (meta.json), MergeStrategy "merge" value (state.json),
  # merge_gates keys — no serialized key/value is renamed in this mission.
  serialized_keys:     { action: do_not_change }
  # `spec-kitty merge` → `spec-kitty consolidate` (primary); `merge` removed with a
  # migration-error stub. The command surface is renamed.
  cli_commands:        { action: rename }
  # Lane-consolidation-sense prose → consolidate; git-merge/publish prose stays.
  user_facing_strings: { action: manual_review }
  # Rename with the code (tests/merge/ → tests/consolidation/), but frozen-KEEP
  # assertions (MergeStrategy value, baseline_merge_commit) stay verbatim.
  tests_fixtures:      { action: manual_review }
  # Status/telemetry use lane names, not "merge"; any consolidation-op log line is
  # sense-dependent, frozen serialized fields stay.
  logs_telemetry:      { action: manual_review }

exceptions:
  # ---- Frozen KEEPS (git-integration Sense B / serialized contracts) ----
  - path: "src/specify_cli/cli/commands/merge_driver.py"
    action: do_not_change
    reason: "git merge-driver plumbing (Sense B), tied to .gitattributes/git-config — renaming breaks conflict resolution."
  - path: "src/specify_cli/merge/config.py"
    action: do_not_change
    reason: "MergeStrategy enum + `\"merge\"` serialized value (Sense B, glossary-pinned unchanged contract)."
  - path: "src/specify_cli/merge/baseline.py"
    action: manual_review
    reason: "FREEZE the baseline_merge_commit meta.json wire-key (phase-derivation contract); boyscout only local prose/identifiers, never the key."
  - path: "src/mission_runtime/lifecycle_phase.py"
    action: do_not_change
    reason: "Reads the frozen baseline_merge_commit key to derive PRE_CONSOLIDATION/CONSOLIDATED — key must not move."
  - path: "src/runtime/next/_internal_runtime/schema.py"
    action: do_not_change
    reason: "Frozen KEEP: trigger_mode Literal[\"manual\",\"post_merge\",\"both\"] on a frozen=True model — serialized enum value, not the lane-consolidation verb (post-plan A5)."
  # ---- Machine-contract surfaces (post-plan A2/A4) ----
  - path: "docs/api/cli-commands.md"
    action: manual_review
    reason: "GENERATED by scripts/docs/build_cli_reference.py + strict-freshness-gated — REGENERATE, never hand-edit; carries `## spec-kitty merge` + `merge-mission`."
  - path: "docs/api/agent-subcommands.md"
    action: manual_review
    reason: "Generated agent-subcommand reference — regenerate alongside cli-commands.md."
  - path: "src/specify_cli/core/upstream_contract.json"
    action: manual_review
    reason: "A4 (operator-veto-flagged): if merge-mission→consolidate-mission is kept in scope, update token `:92` to consolidate-mission (allowed); keep `:108 merge-feature` forbidden. Frozen otherwise."
  # ---- Immutable history / snapshots ----
  - path: "kitty-specs/**"
    action: do_not_change
    reason: "Immutable mission snapshots; historical wording preserved."
  - path: "docs/adr/**"
    action: do_not_change
    reason: "ADR bodies are historical record (C-006). The landed consolidate ADRs stay as-is."
  - path: "docs/changelog/**"
    action: do_not_change
    reason: "Changelog is historical; this mission APPENDS one new entry but does not rewrite past lines."
  # ---- Long-tail deferral (C-008) ----
  - path: "docs/**"
    action: manual_review
    reason: "v1 converts ~5 high-value doc files only; long-tail/archival prose deferred (grandfathered by the shrink-only drift guard)."
