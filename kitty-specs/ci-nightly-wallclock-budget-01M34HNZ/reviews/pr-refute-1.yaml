  - id: PR-TESTS-001
    status: upheld
    severity_after: 3
    reason: >
      Verified independently, fresh (not reusing the concurrent lens run):
      `.venv/bin/python -m pytest tests/architectural/test_module_length_agreement.py
      -m "not slow" -q` -> "7 passed, 1 deselected in 33.29s"; the unfiltered
      run -> "8 passed in 33.54s". Deselecting the one `@pytest.mark.slow` test
      saves essentially zero wall-clock, exactly as claimed (finding's own
      34.53s/34.40s vs. my 33.29s/33.54s -- consistent, small run-to-run
      variance, same conclusion). Read the source: `test_charter_is_not_allowlisted_and_agrees`
      (line ~305) and `test_allowlisted_modules_still_genuinely_mismatch`
      (line ~339) both take the session-scoped `_collected_counts` fixture
      (21 live pytest --collect-only subprocesses, the same cost the marked
      test pays) and neither carries `@pytest.mark.slow`. This directly
      contradicts pytest.ini's own marker contract ("slow: test expected to
      take >30 seconds") for two tests that demonstrably do. Confirmed via
      ci-router.yml that no live CI job today filters this directory by
      `-m slow`/`-m "not slow"` (`architectural-heavy` has no such filter),
      so there is no live-CI break today -- but the marker is real,
      documented tooling surface (pytest.ini's own definition, and a cited
      future mission that greps `@pytest.mark.slow` to build a shrink-only
      baseline), and it silently lies about the cost profile of 2 of the
      file's 8 tests. This is a genuine defect the diff introduces (the file
      is new), not pre-existing drift, and it's inexpensive to fix. Severity
      kept at 3: real and verified, but disclosed-zero live-CI blast radius
      today keeps it a should-fix-before-merge nit rather than higher.
