  - id: PR-BOUNDARY-002
    status: upheld
    severity_after: 2
    reason: >
      Verified the claim: `_resolve_test_dirs` in
      tests/architectural/test_module_length_agreement.py:200-203 does
      `sys.path.insert(0, str(_SCRIPTS_CI_DIR)); import capture_shard_timings
      as _capture`, called once per registry module inside the session-scoped
      `_collected_counts` fixture (21 calls -> 21 redundant sys.path
      insertions of the same directory, never cleaned up). Read
      tests/ci/test_capture_shard_timings.py:29-46: its `_load_module()` uses
      `importlib.util.spec_from_file_location`, with an explicit docstring
      reason ("scripts/ci is not an importable package from the test's own
      import root", mirroring test_sonar_project_version.py) -- i.e. this
      repo already has one established, deliberately-chosen technique for
      this exact integration point, and the new file adds a second, more
      permissive one. I tested the two real-risk questions raised: (1) name
      collision among scripts/ci's 19 modules -- listed them all, none
      collide with anything else imported in this session; (2) test-ordering
      dependence -- ran both test files together in both orders
      (`test_module_length_agreement.py tests/ci/test_capture_shard_timings.py`
      and reversed), both pass, 22/22, ~33s either way; pytest-randomly is not
      installed (pip show confirms absent, and pytest.ini's addopts carries
      no randomization flag), so ordering is deterministic and this isn't a
      flake risk either. So: functionally harmless today, exactly as the
      finding itself discloses -- but it's a real, verified second seam for
      one integration point (charter Governing Principle "Single canonical
      authority" / DIRECTIVE_044: "reconcile existing doctrine rather than
      add a second authority," explicitly a reviewer-weighed principle, not
      an auto-reject). Upheld at severity 2 as filed: genuine, cheap-to-fix
      canonical-sources drift, not a live break.
  - id: PR-TESTS-002
    status: upheld
    severity_after: 1
    reason: >
      Verified: test_allowlist_does_not_exceed_baseline (line ~323) takes no
      fixture args and does a pure len() comparison; test_allowlist_entries_are_real_registry_modules
      (line ~332) takes only the session-scoped `_live_registry_state` fixture
      (a single YAML load, not a subprocess) -- both are genuinely sub-second
      and match pytest.ini's `fast` marker definition ("pure-logic tests with
      no subprocess/git overhead"), same class as the three
      `@pytest.mark.fast` self-mutation tests lower in the same file. The
      file's own docstring states this design intent explicitly ("kept in
      pure-logic tests ... so they stay sub-second and can run everywhere,
      including under make test-fast-style selection"), so leaving these two
      untagged is an internal inconsistency the diff itself introduces (not
      pre-existing drift) against a convention the same file states and
      partially applies. Checked the practical stakes: Makefile's
      FAST_TIER_DIRS for `make test-fast` is `tests/unit tests/status
      tests/cli tests/specify_cli/runtime
      tests/architectural/test_no_retired_subsystems.py` -- this file isn't
      in that list at all, so tagging `fast` would not actually pull these
      two into `make test-fast` today; the marker is presently
      documentation/selection-surface only for this file. Given the repo's
      broad-but-optional use of `fast` elsewhere (used in ~23 architectural
      files, usually sparingly), this is a real but genuinely cosmetic gap.
      Upheld as filed (severity 1, the finding's own text already says "does
      not block merge") rather than refuted, since it is accurate and the
      diff does introduce the inconsistency -- but not escalated, since the
      practical consequence is smaller than even the original finding
      implies (the marker wouldn't currently change any CI selection for
      this file either way).
