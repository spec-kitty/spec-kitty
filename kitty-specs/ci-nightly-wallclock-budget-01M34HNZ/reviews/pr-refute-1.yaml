      lens's substantive claim holds, its citation is just one test off).
      Since nothing consumes reason: as data, C-004's "accepted out-of-scope
      prose" framing is accurate, not question-begging. Ruling: refuted --
      already dispositioned by a binding, on-point spec constraint that was
      written with the post-split state in mind. severity_after left at 2
      as filed (matching the original) purely for traceability; status is
      what changes, not severity, since the finding is not being merged as
