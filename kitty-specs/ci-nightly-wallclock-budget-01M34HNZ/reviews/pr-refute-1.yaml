      true, not aspirational. I also independently located and read the four
      `reason:` entries at (post-diff) lines ~646/665/693/716 under
      `out_of_matrix_test_dirs:` (offset from C-004's cited ~622/641/669/692
      by the +24 lines the charter-comment insertion adds, modulo a small
      ~3-line pre-existing shift -- same entries, same "performance-and-e2e"
      language, confirmed by direct read). C-004 names these exact four
      comments, by approximate location, as accepted out-of-scope drift,
      written with full knowledge that FR-001 retires the job they name
      ("after FR-001's split these comments describe a job that no longer
      exists, and that documentation drift is accepted as out-of-scope prose
      for this mission, not fixed here"). That is about as directly on-point
      as a binding spec constraint can be: it doesn't merely fail to mention
      this drift, it anticipates this exact objection and forecloses it by
      name and line number. On the "does touching the file at all reopen the
      constraint" question: C-004's own text already contemplates that the
      file IS being edited (that's the entire reason the constraint exists --
      an untouched file would need no locality carve-out) and explicitly
      rules that touching one row does not extend scope to unrelated rows'
      staleness. That is DIRECTIVE_024 (Locality of Change) applied exactly
      as designed, not a loophole. On "is reason: prose or data": functionally
      it is prose -- the boundary lens's own evidence confirms no gate parses
      or validates reason-string content against real job ids (though the
      specific test it cites, test_timings_excluded_dirs_are_documented,
      actually validates ci-shard-timings.json's unrelated "excluded" list;
