      - code: "packs/built-in/missions/software-dev/templates/plan-template.md:4"
      - code: ".kittify/charter/charter.md:557-561 (Terminology Canon)"
    claim: >
      plan.md's line 4 literally reads "Feature specification," verbatim boilerplate copied
      from the canonical `plan-template.md`. Genuine terminology drift, but root-caused in the
      canonical template, not authored by this plan.
    remediation: >
      Do not fix inline in this plan. Ledger the canonical-template terminology drift
      (`packs/built-in/missions/software-dev/templates/plan-template.md:4`) separately. This
      mission's plan.md itself needs no change.
    refute_verdict: confirmed
    refute_reason: >
      plan.md:4 is byte-for-byte the template's "Feature specification" boilerplate;
      charter.md:557-561 hard-bans Feature/Features. Genuine drift, correctly root-caused to
      the canonical template.

  - id: PLAN-ARCH-001
    lens_group: arch
    lens: Timeout-budget fidelity to spec AC1
    severity: 4
    title: "stress job's timeout-minutes: 60 is numerically a bare copy of the old shared cap, which is the literal condition AC1's falsifiability clause names as a failure"
    evidence:
      - artifact: "spec.md § User Story 1 › How each AC fails (falsifiability), AC1"
      - artifact: "plan.md § Real evidence used to size the new budgets (grounds FR-002/NFR-002, not guessed)"
      - artifact: "plan.md § Phasing › Phase 1, step 1a"
      - code: ".github/workflows/ci-nightly.yml:71 (old shared job's `timeout-minutes: 60`)"
    claim: >
      spec.md's AC1 states plainly: "AC1 fails if ... any new job's timeout-minutes is a
      bare copy of the old 60." plan.md sets the new `stress` job's `timeout-minutes` to
      exactly `60` and explicitly calls it "the old shared job's full cap, now dedicated
      solely to this suite" — a direct self-contradiction against the plan's own "never a bare
      copy" claim, matching the exact failure condition AC1 names. The plan's mitigation
      explicitly permits 60 to ship unrevised even given contrary dispatch evidence.
    remediation: >
      Either (1) make the FR-009 dispatch a hard prerequisite for finalizing stress's timeout,
      deriving it from stress's real measured duration with the same ~1.5x-headroom method
      used for performance/e2e; or (2) if a provisional value must land first, pick a number
      distinct from 60 (e.g. ~45) and make the post-dispatch re-derivation unconditional.
      State explicitly: "the shipped timeout-minutes for stress must differ from 60 unless a
      genuine re-derivation independently lands on that same number."
    refute_verdict: confirmed
    refute_reason: >
      spec.md AC1 (lines 100-103) explicitly fails on "a bare copy of the old 60." plan.md:
      89-92 sets stress's timeout-minutes to exactly 60 and literally calls it "the old shared
      job's full cap" one sentence after claiming budgets are "never a bare copy of the old
      shared 60" — a direct self-contradiction matching the exact failure condition AC1 names.

  - id: PLAN-VERIFY-001
    lens_group: verify
    lens: SC-006 spot-check reproducibility (mission-derived)
    severity: 4
    title: "Deliberately-wrong shard_count for the SC-006 spot-check has no concrete, pre-committed selection rule and can silently land on a degenerate value that proves nothing"
    evidence:
      - artifact: "plan.md § Red-first / revert discipline (including for YAML-only changes) — \"#4864 registry re-derivation (FR-006-FR-008, SC-005-SC-007)\""
      - code: "tests/architectural/test_module_shard_registry.py:119-122 (_skew_of)"
      - code: "tests/architectural/test_module_shard_registry.py:104-116 (_lpt_bin_pack)"
    claim: >
      plan.md's spot-check instructs computing skew at "one deliberately-wrong shard_count" —
      not a concrete number or deterministic rule, deferred to implementation-time judgment.
      At `shard_count == 1`, `_lpt_bin_pack` produces exactly one bin, so `_skew_of` is always
      exactly 0.0 by construction regardless of data — a degenerate choice an implementer
      could pick that would produce a spot-check showing ~0% skew for BOTH the correct and the
      "wrong" shard_count, the opposite of what FR-008/NFR-003/SC-006 need. The plan never
      excludes these candidates.
    remediation: >
      Fix the "deliberately-wrong shard_count" to a concrete, pre-declared rule in plan.md
      BEFORE implementation sees any skew numbers — e.g. "use derived_shard_count // 2 (floor,
      minimum 2)" — and explicitly exclude shard_count == 1 and values within one unit of
      len(durations) as invalid choices.
    refute_verdict: confirmed
    refute_reason: >
      Directly verified in code: at shard_count==1, _lpt_bin_pack produces one bin and
      _skew_of provably returns exactly 0.0 for any data — a real, unguarded degenerate case
      the plan's spot-check rule does not exclude.

  - id: PLAN-VERIFY-002
    lens_group: verify
    lens: SC-006 spot-check reproducibility (mission-derived)
    severity: 4
    title: "'Documented, not committed' ad-hoc snippet is the sole required non-vacuity proof, but it is neither re-runnable nor independently verifiable — falling short of Standing Order #5's 'cannot self-validate' bar and NFR-006's durability requirement"
    evidence:
      - artifact: "plan.md § Red-first / revert discipline — \"The actual falsification path (SC-006's spot-check)\""
      - artifact: "plan.md § Constitution Check — \"Architectural gate discipline (#5): ... PASS, directly addressed.\""
      - code: "tests/architectural/test_module_shard_registry.py (whole file: no __main__ block, no CLI entry point, no fixture or standalone-invocation pattern for _lpt_bin_pack/_skew_of — confirmed by grep)"
    claim: >
      Charter Standing Order #5 states "a gate-unmask cannot self-validate." plan.md's chosen
      evidence mechanism is an uncommitted, non-re-runnable ad-hoc snippet — confirmed no
      standalone-callable pattern exists today, so this would be genuinely new, one-off code
      hand-transcribed into the PR description by the same implementing agent. plan.md's own
      Constitution Check claims "PASS, directly addressed" against the same standing order,
      resting on the same non-durable evidence.
    remediation: >
      Either (a) make the narrow, committed, re-runnable `charter`-specific skew-sensitivity
      unit test mandatory rather than optional; or (b) commit the ad-hoc spot-check snippet
      itself as a throwaway script so the exact code that produced the recorded numbers is
      available for independent re-execution.
    refute_verdict: confirmed
    refute_reason: >
      charter.md:79-83 (Standing Order #5) states "a gate-unmask cannot self-validate."
      plan.md makes an uncommitted, non-re-runnable ad-hoc snippet the mandatory SC-006
      evidence while demoting the durable, committed, re-runnable unit-test alternative to
      optional, then self-assesses "PASS, directly addressed." Confirmed via grep: no
      __main__/CLI/standalone-invocation pattern exists anywhere in the 569-line test file.
