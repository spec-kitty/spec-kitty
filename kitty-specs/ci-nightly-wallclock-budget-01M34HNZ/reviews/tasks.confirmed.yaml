  - id: TASKS-VERIFY-001
    source_group: verify
    lens: mission-derived (per-WP red-first concreteness)
    severity: 3
    title: "WP01 has no dedicated red-first/falsification story for the campsite-clean half; the \"dead key\" claim isn't re-verified at the WP-task level before removal"
    evidence:
      - artifact: "tasks/WP01-baseline-and-campsite-clean.md — no '## Red-first / revert discipline' heading (contrast WP02 line 256 and WP06 line 199)"
      - artifact: "tasks/WP01-baseline-and-campsite-clean.md § Subtask T004 — no step asks the implementer to independently confirm the key is inert before removing it"
      - code: ".github/workflows/ci-nightly.yml:68-73 (fail-fast at 72-73, no matrix: key in 68-171 — claim IS true, but WP01 doesn't ask the implementer to establish that fact itself)"
    claim: >
      WP02 and WP06 each carry an explicit "Red-first / revert discipline" section. WP01 has no
      equivalent section or task-level instruction to confirm the inertness claim before acting.
    remediation: >
      Add a "Red-first / revert discipline" section to WP01's prompt: before T004 removes the two
      lines, grep/confirm no matrix key exists under performance-and-e2e; if one is found, that is
      this WP's "red" — do not remove the key, escalate instead. Fold into T004's own steps.

