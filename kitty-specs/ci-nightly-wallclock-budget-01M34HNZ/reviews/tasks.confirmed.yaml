findings:
  - id: TASKS-DECOMP-001
    source_group: decomp
    lens: mission-derived (Phase-0-baseline fold / requirement-ref accuracy)
    severity: 3
    title: "WP01 cites FR-001 as a Requirement Ref, but WP01's own content never performs FR-001's split"
    evidence:
      - artifact: "tasks.md § WP01 (\"Requirement Refs: FR-001, NFR-006, SC-008\")"
      - artifact: "tasks.md § Requirements Coverage Summary (\"FR-001 | WP01, WP02\")"
      - artifact: "kitty-specs/ci-nightly-wallclock-budget-01M34HNZ/tasks/WP01-baseline-and-campsite-clean.md frontmatter (requirement_refs: [FR-001, NFR-006])"
      - artifact: "kitty-specs/ci-nightly-wallclock-budget-01M34HNZ/spec.md:250 (\"FR-001 | Split performance-and-e2e into three independent jobs\")"
      - artifact: "tasks.md § WP02 Goal — this is where the FR-001 split actually happens"
    claim: >
      WP01's Goal is exactly two things: (a) record a Phase-0 pytest baseline and (b) remove the
      inert fail-fast key as a campsite-clean commit. Neither splits performance-and-e2e — that is
      WP02's entire Goal and its own feat(ci) commit. Yet WP01 lists FR-001 in its Requirement Refs
      and the Requirements Coverage Summary records FR-001 as covered by "WP01, WP02".
    remediation: >
      Drop FR-001 from WP01's Requirement Refs (both tasks.md's WP01 section and the WP01 prompt
      file's frontmatter requirement_refs) and from the Requirements Coverage Summary's FR-001 row,
      leaving FR-001 covered by WP02 alone. Keep NFR-006 as WP01's machine-parsed anchor.

  - id: TASKS-SEQ-001
    source_group: seq
    lens: Mission-derived — blanket "zero [P] subtasks" claim
    severity: 2
    title: "Two genuinely independent subtask pairs exist (WP07 T034/T036; WP02 T010/T011) despite the mission's blanket zero-[P] claim"
    evidence:
      - artifact: "tasks.md § Subtask Format (lines 49-56): \"No subtask below carries [P]\""
      - artifact: "tasks.md § Dependency & Execution Summary — reasoning is topology/chokepoint-level only"
      - artifact: "tasks.md WP07 T034 vs T036 — T036 is prose from already-committed text, no data dependency on T034"
      - artifact: "tasks.md WP02 T010-T011 — both independent read-only checks over the same T009-edited file"
    claim: >
      The blanket "fully linear, zero [P] anywhere" claim never examines intra-WP independence.
      WP02's T010 (ruff format --check) and T011 (pytest run) are a genuine counter-example: both
      non-mutating verification commands with no ordering dependency on each other.
    remediation: >
      Mark T010/T011 [P] relative to each other in WP02. Add one sentence to the "Dependency &
      Execution Summary" acknowledging intra-WP subtask-level parallelism was considered separately
      from inter-WP/topology-level parallelism, and record this as the one case found.

  - id: TASKS-SEQ-002
    source_group: seq
    lens: Chokepoints — PR #4886 collision handling (WP05 T026)
    severity: 3
    title: "PR #4886's collision check is performed once in WP05 but never re-verified at the actual highest-risk moment (WP07's PR push/open, T037)"
    evidence:
      - artifact: "tasks.md WP05 T026 (line 378): re-checks PR #4886 once, mid-mission"
      - artifact: "tasks.md WP07 T036: documents/references the collision policy in prose — not a live re-check"
      - artifact: "tasks.md WP07 T037: pushes/opens the PR with no intervening re-check of #4886's live status"
      - artifact: "plan.md:427-436 § Known collision — PR #4886 (\"should be re-checked at implementation time\")"
      - artifact: "plan.md:168-178: up to ~650 minutes can elapse between WP05 and WP07"
    claim: >
      WP05's T026 checks PR #4886's live status once, mid-mission. Per plan.md's own worst-case
      wall-clock accounting, up to ~650 minutes can elapse before this mission's own PR is pushed
      (WP07 T037) — a real window in which #4886 could merge without this mission's side noticing.
    remediation: >
      Add an explicit subtask in WP07, immediately before T037, that re-runs `gh pr view 4886` and
      re-confirms via git diff that the charter row is the only touched row relative to current
      main, applying T026's re-apply-and-hand-verify procedure again if #4886 merged in the
      interim.

