mission: ci-nightly-wallclock-budget-01M34HNZ
findings:
  - id: SPEC-ARCH-001
    lens: Contracts
    severity: 4
    title: >-
      test_performance_marker_guard.py hardcodes the job name
      "performance-and-e2e" in three assertions that the FR-001 split will
      break; the spec's AC4/FR-005 framing does not disclose this or scope
      the required edit
    evidence:
      - artifact: "spec.md § Acceptance Scenarios (User Story 1), AC4"
      - artifact: "spec.md § FR-005"
      - artifact: "spec.md § SC-004"
      - code: "tests/architectural/test_performance_marker_guard.py:280 (`for job_name in (\"performance-and-e2e\", \"interpreter-matrix\"):` inside test_nightly_suite_steps_are_fail_loud)"
      - code: "tests/architectural/test_performance_marker_guard.py:313 (same tuple, inside test_nightly_fail_loud_step_treats_marker_empty_exit_5_as_non_failing)"
      - code: "tests/architectural/test_performance_marker_guard.py:350 (`assert \"performance-and-e2e\" in jobs` inside test_nightly_workflow_houses_performance_and_interpreter_jobs)"
    claim: >-
      AC4 and SC-004 state that `test_performance_marker_guard.py` "still
      passes" / "passes unchanged" after the split, and FR-005/C-001 frame the
      file's job purely as verifying "no pull_request trigger + no
      -m performance/-m e2e/interpreter-matrix on the PR path." That framing
      is accurate for two of the file's tests
      (test_nightly_workflow_never_triggers_on_pull_request,
      test_no_pull_request_workflow_selects_performance_or_interpreter_jobs)
      but the same file ALSO contains three other tests that hardcode the
      literal job key "performance-and-e2e" and read
      `jobs.get(job_name)`/`"performance-and-e2e" in jobs` against the live
      parsed `ci-nightly.yml`. Once FR-001 removes the `performance-and-e2e`
      job (replacing it with three independent perf/e2e/stress jobs, as
      required), `jobs.get("performance-and-e2e")` returns `None` and
      `assert isinstance(job, dict), f"{job_name} job missing"` fails —
      guaranteed test failures in test_nightly_suite_steps_are_fail_loud,
      test_nightly_fail_loud_step_treats_marker_empty_exit_5_as_non_failing,
      and test_nightly_workflow_houses_performance_and_interpreter_jobs. The
      spec's own stated scope ("no src/** CLI code changes implied", and by
      extension only `.github/workflows/**` +
      `.github/ci-module-registry.yml`/`ci-shard-timings.json` are touched)
      never names `tests/architectural/test_performance_marker_guard.py` as a
      file this mission edits, so an implementer following the spec literally
      would hit three unexpected, unscoped red tests after doing exactly what
      FR-001 asks, discover the guard file itself needs updating mid-WP, and
      have to improvise the fix (e.g. widen the tuples to the three new job
      names) without spec guidance on the correct new shape.
    remediation: >-
      Add an FR (or extend FR-005) explicitly naming
      `tests/architectural/test_performance_marker_guard.py` as an in-scope
      file for this mission, listing the three job-name-hardcoding tests
      (lines 280, 313, 350) and requiring their tuples/literals be updated
      from `"performance-and-e2e"` to the three new job names (or refactored
      to iterate the job list dynamically). Rewrite AC4/SC-004 to state that
      the guard file is modified (not merely "unchanged") and that after the
      edit it still enforces the same pull_request/marker-selection guarantee
      plus the same fail-loud/exit-5 shape, now against three jobs instead of
      one.

  - id: SPEC-ARCH-002
    lens: MISSION-DERIVED — Workflow-YAML mechanics are correctly described
    severity: 1
    title: Off-by-one line citation for charter's shard_count in the Summary section
    evidence:
      - artifact: "spec.md § Summary, item 2"
      - code: ".github/ci-module-registry.yml:151 (`shard_count: 5` under `- module: charter` which starts at line 143)"
    claim: >-
      The Summary section states "`.github/ci-module-registry.yml`'s
      `charter` module row (line 150) hardcodes `shard_count: 5`" with an
      exact (non-approximate) line number. The actual line is 151, not 150
      (elsewhere in the spec — FR-007, Key Entities — the same fact is cited
      correctly as "line ~150" with a tilde). This is a one-line citation
      slip; it would not misdirect an implementer since the `charter` row is
      easy to locate by module name, but it is a factual inaccuracy in a spec
      whose other citations (job names, needs: list, env vars) are otherwise
      exact.
    remediation: >-
      Change "line 150" to "line ~150" (or the exact "line 151") in the
      Summary section, item 2, to match the approximate-citation convention
      used elsewhere in the spec for the same fact.

  - id: SPEC-ARCH-003
    lens: Contracts
    severity: 2
    title: >-
      C-004's "registry edit scoped to the charter row only" leaves several
      other rows' disposition-ledger comments (and one tests/e2e/ comment)
      referencing the retired "performance-and-e2e" job name stale, with no
      spec-level acknowledgment
    evidence:
      - artifact: "spec.md § Constraints, C-004"
      - code: ".github/ci-module-registry.yml:622 (\"Real marker home is ci-nightly.yml's performance-and-e2e job\")"
      - code: ".github/ci-module-registry.yml:641,669,692 (three more occurrences of the same phrase in other disposition-ledger `reason:` blocks)"
      - code: "tests/e2e/test_worktree_owned_root_concurrency.py:377 (comment: \"the nightly ``performance-and-e2e`` job (ci-nightly.yml, ...)\")"
    claim: >-
      C-004 restricts this mission's `.github/ci-module-registry.yml` diff to
      the `charter` row only. Repo-wide grep shows four other places in that
      same file (disposition-ledger `reason:` comments for `tests/stress`,
      `tests/performance`/etc., `tests/cross_cutting`, and a Windows-marker
      row) plus one test-file comment
      (tests/e2e/test_worktree_owned_root_concurrency.py:377) that name
      "performance-and-e2e" as the real marker home for excluded
      directories. After FR-001's split these references describe a job that
      no longer exists. None of these are functionally consumed by any gate
      (they are prose comments), so this is not a correctness break, but the
      spec neither acknowledges this documentation drift nor states it is an
      accepted, out-of-scope side effect of C-004 the way it does for other
      known trade-offs (e.g. NFR-005's 3x checkout cost).
    remediation: >-
      Add one sentence to C-004 (or a new Edge Case) noting that the
      disposition-ledger comments and the test_worktree_owned_root_concurrency.py
      comment naming "performance-and-e2e" will go stale after the split and
      are explicitly accepted as out-of-scope prose drift for this mission —
      or, if preferred, widen C-004 to permit updating just those comment
      strings (not the rows' functional fields) to name the new job(s).
