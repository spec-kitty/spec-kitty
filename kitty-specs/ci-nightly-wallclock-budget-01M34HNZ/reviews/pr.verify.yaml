new_findings:
- id: PR-VERIFY-001
  severity: 2
  status: pre-existing, not introduced by 563bd71b8, does not block merge
  title: The architectural suite's parallel-vs-serial count delta is deterministic, not the flake it was
    attributed to
  claim: The +3 passed / +1 skipped delta (2816/4/2 parallel vs 2813/3/2) was attributed to a known non-reproducing
    xdist race between test_charter_sole_door_resolver_imports.py and test_topology_inference_retired.py's
    scratch file under src/. An independent re-run under the same -n auto --dist loadfile command reproduced
    EXACTLY 2816 passed / 4 skipped / 2 xfailed, zero errors, totalling its own --collect-only count.
    A genuine race would surface as an intermittent ERROR, not a clean twice-reproduced result. The likelier
    cause is a deterministic serial-vs-parallel structural difference (per-worker HOME/XDG isolation,
    which this repo documents by design). Root cause not established.
  impact: Any baseline quoted for tests/architectural/ must state whether it is the serial or the parallel
    figure; quoting one as though it were the other misattributes a deterministic difference to flakiness.
