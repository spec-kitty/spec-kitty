  category: tooling
  summary: 'Tracer: [2026-11-11][accept] `spec-kitty accept` crashed with a traceback after writing the acceptance record'
  evidence_refs:
  - e-014
  details: "- **[2026-11-11][accept] `spec-kitty accept` crashed with a traceback after writing the acceptance record** (`TaskCliError:
    The following paths are ignored by one of your .gitignore files: .worktrees`). On a settled `lanes_with_coord` Mission,
    accept writes `meta.json` in the coordination worktree, then runs `git add <.worktrees/...-coord/.../meta.json>` with
    `cwd=` the repository root checkout (`accept.py`, the \"Unprotected path (mission-lane branch)\" commit, `run_git([\"\
    add\", meta_rel], cwd=repo_root)`). Same root cause as the `spec-commit` / `safe-commit` placement entries. The record
    also names `accepted_from_commit` = the root checkout's HEAD (the target branch), not the Mission branch, and adds `status_phase:
    \"1\"`. Workaround: commit `meta.json` with git in the coordination worktree. Follow-up: file an issue (accept's meta
    commit ignores the coordination placement after settlement)."
- id: n-004
  category: tooling
  summary: 'Tracer: [2026-11-11][analyze] `spec-commit` refuses planning edits after topology settlement.'
  evidence_refs:
  - e-014
  details: '- **[2026-11-11][analyze] `spec-commit` refuses planning edits after topology settlement.** Once `finalize-tasks`
    settled the default Mission to `lanes_with_coord`, the topic branch (now also the coordination branch) is checked out
    in the coordination worktree, and the repository root checkout went back to `create_return_branch`. `spec-commit` resolves
    the planning placement to the repository root checkout (`worktree=/home/user/spec-kitty`) and refuses with `WRONG_SURFACE`.
    `record-analysis` and `finalize-tasks` commit fine through their own paths. Workaround: commit the remediation edits with
    git inside the coordination worktree. Follow-up: file an issue (planning edits after settlement have no canonical commit
    path).'
