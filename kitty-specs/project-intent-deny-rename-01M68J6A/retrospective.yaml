- id: n-005
  category: tooling
  summary: 'Tracer: [2026-10-31][specify] Carry the exclusion, do not refuse the rename (#6565).'
  evidence_refs:
  - e-012
  details: "- **[2026-10-31][specify] Carry the exclusion, do not refuse the rename (#6565).** The issue offered\n  two options.
    Refusing the rename would break `charter synthesize` permanently on a project whose\n  deny entry names the old stem and
    would ask the user to clear state they cannot see. Carrying the\n  exclusion keeps the user's explicit decision intact
    and reuses the rename's own mapping."
- id: n-006
  category: tooling
  summary: 'Tracer: [2026-10-31][specify] Deny rename only where deny is authoritative.'
  evidence_refs:
  - e-012
  details: "- **[2026-10-31][specify] Deny rename only where deny is authoritative.** A legacy surface's\n  `deactivated_*`
    key is never applied (ADR 2026-10-19-1 Amendment 2026-10-20) and its save refuses a\n  deny change, so rewriting it there
    would turn the rename into a refusal for no behaviour. The deny\n  keys are therefore rewritten only when the resolved
    write target is the activation ledger."
- id: n-004
  category: tooling
  summary: 'Tracer: [2026-10-31][specify] One authority, one new choice.'
  evidence_refs:
  - e-011
  details: "- **[2026-10-31][specify] One authority, one new choice.** The fix extends the existing rename helper\n  (`charter/activation/synthesizer/legacy_rename.py`)
    rather than adding a deny-side mapping: its\n  token step already rewrites stem tokens in the activation write target,
    so the deny list joins that\n  step and the write stays one call. A new `DenyListChoice.RENAME` is the sanctioned authority;
    the\n  FR-014 gate pins its single origin. Issue #6565."
