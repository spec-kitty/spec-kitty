- id: PR-SECURITY-002
  verdict: refuted
  severity: 1
  reason: "AD-17 and the Terminology entry 'Credential pattern' fix the closed set (GitHub, AWS key id, PEM header) as operator-acknowledged, with SECRET_PATTERNS the authority and 'this spec adds none'; spec line 162 lists hidden files. Not a defect. Fork status: widening the set or adding name-based refusal would amend AD-17 and need an operator ruling, so it is a genuine fork only if the operator wants to reopen it; the current scope is within the acknowledged decision and needs no action now."
