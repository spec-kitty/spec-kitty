  severity: 1
  reason: "NFR-002 bounds which sources a detail may open (no artifact content) and the WP and cycle files are read by the product's own public readers (read_authored_wp_frontmatter, read_guarded), which is the design; the spec asks for no cap on them and no recorded FR requires fault injection on these two reads. Speculative hardening of a test-tree reference reader."
- id: PR-READERS-003
  verdict: confirmed
  severity: 2
  reason: "grep of tests/contract finds MAX_TASKS_MD_BYTES and the 4 MiB cap only in the reader (lines 70, 278, 281), so no test exercises the over-cap branch; reverting it to an unbounded read stays green. Small gap, the implementation is right."
- id: PR-READERS-004
  verdict: refuted
  severity: 1
  reason: "Eligibility by per-component lstat is exactly what the spec prescribes (Eligible file, FR-014) and the lstat already requires S_ISREG, so a FIFO is rejected up front. The finding needs a race swap between lstat and open, a read-only test-tree reference reader on a repository checkout; not a defect against any recorded requirement."
- id: PR-SECURITY-001
