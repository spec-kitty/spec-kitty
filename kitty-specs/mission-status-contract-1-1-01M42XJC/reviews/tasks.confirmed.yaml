- id: TASKS-COVER-001
  lens: coverage-traceability
  severity: 3
  title: AD, CL, OQ and AC rows of the coverage tables are not traceable into the WP prompts
  evidence:
  - artifact: "tasks.md \xA7 Clarifications and decisions; \xA7 Acceptance criteria groups, open questions\
      \ and operator decisions"
  - artifact: tasks/WP01..WP09 (body text, grep per id and WP)
  claim: 'Mechanical check (script over tasks.md rows joined with each prompt body, 240 id/WP pairs):
    the FR, NFR, SC and C pairs all appear in the named prompt, but 127 pairs from the CL, AD, OQ and
    AC rows do not. AC-LIST, AC-DETAIL, AC-CONTENT, AC-VERSION, CL-2..CL-5, OQ-1..OQ-6 and AD-1..AD-12,
    AD-15..AD-17, AD-20..AD-22 are cited in no prompt at all. Only AD-13, AD-14, AD-18, AD-19, CL-1 and
    OD-n appear. No prompt references spec.md, although tasks.md says it is reference material for every
    WP. WP05 (7 subtasks, tasks.md maps AD-1,2,4..12,14,15,17..19,21,22 to it) names no AD id. The rows
    say "spec Traceability table (requirements that cite it)", which is derived from requirement_refs,
    not from what the prompt tells the implementer or reviewer to honour. I confirmed the derivation itself
    is correct (all 21 AD rows and CL-1..CL-4 recompute exactly from the spec Traceability table joined
    with wps.yaml), so this is a prompt-side gap, not a table error. Decisions such as AD-5 (status pairing),
    AD-8 (listing cap) and AD-21 (500 source_unreadable) reach the implementer only through data-model.md
    and the contract notes, which the prompt cites by section, so the reviewer cannot check a WP against
    its AD list from the prompt.

    '
  remediation: 'Add one line per prompt, "Decisions honoured: AD-n ..., CL-n, OQ-n, AC-x (spec.md, Decisions
    and Traceability)", taken from the tasks.md rows for that WP, and add spec.md to each Context section.
    Alternatively state in tasks.md that AD/CL/OQ/AC traceability is by the contract notes only and name,
    per AD, the data-model or contract-note section that carries it.

    '
  refute_reason: Grep of WP05 finds zero AD/CL/OQ references, confirming the prompt-side traceability
    gap.
