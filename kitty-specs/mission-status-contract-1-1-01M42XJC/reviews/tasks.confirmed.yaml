  evidence:
  - artifact: "tasks.md \xA7 Success criteria (SC-004 -> WP08, WP09; SC-005 -> WP08, WP09)"
  - artifact: "plan.md \xA7 Traceability (SC-004 IC-07 and IC-08; SC-005 IC-02 and IC-08)"
  - artifact: "spec.md \xA7 SC-004, SC-005; wps.yaml WP02 and WP06 requirement_refs"
  claim: 'SC-004 (changed, unchanged, unknown each produced by the constructed cause in synthetic repositories,
    listed mutations killed) is delivered by WP06 T034..T036, and SC-005 (planted negative that fails
    and clean control for each endpoint) by WP02 (25 planted kinds, FR-023 leak half). Neither WP carries
