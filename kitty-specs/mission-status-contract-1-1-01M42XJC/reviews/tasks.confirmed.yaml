    and cite them in the Definition of Done, or add an explicit sentence under the SC table that WP06/WP02
    build the proof and WP08/WP09 only re-measure it.

    '
  refute_reason: SC-004 and SC-005 are absent from WP06 and WP02 refs and prompts while WP08 and WP09
