  - code: src/specify_cli/lanes/implement_support.py:787-795 (check_claim_ancestry requires only planning_commit_sha
      and the approved dependency lanes' branches)
  - artifact: 'lanes.json: planning_commit_sha a693f55 is an ancestor of HEAD and its tree already holds
      all nine WP prompts; kitty/mission-mission-status-contract-1-1-01M42XJC does not exist yet, so lane
