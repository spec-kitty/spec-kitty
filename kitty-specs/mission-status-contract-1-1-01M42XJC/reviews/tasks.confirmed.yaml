    '
  remediation: 'Correct to WP03: 2 path files, 1 parameter, 7 schemas, 7 responses, 13 examples; WP04:
    1 path file, 0 parameters, 11 schemas, 2 responses, 8 examples.

    '
  refute_reason: tasks.md lists 3 path files and 1 parameter for WP03 (sums to 31, not 30) and 3 path
