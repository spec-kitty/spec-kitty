- id: TASKS-DECOMP-013
  lens: no padding
  severity: 1
  title: Two no-file subtasks in WP01 (T001 baseline hand-off, T004 write the report) and a wording slip
    in WP02 Objective
  evidence:
  - artifact: 'tasks/WP01 T004: ''Files: None (the report is your final message, not a file)''; T001 ''No
      file is written'''
  - artifact: 'tasks/WP02 Objective: ''the four contract-tooling files of FR-015 (here: fixture_builder.py,
      leak_scan.py, negative_cases.json and their three test modules ...)'''
  claim: 'T004 restates the hand-off section every prompt already requires, adding a subtask id with no
    deliverable (the T-ids are marked done by status events). The WP02 sentence says four files and lists
