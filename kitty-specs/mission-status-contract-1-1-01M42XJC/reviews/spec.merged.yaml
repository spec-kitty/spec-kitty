findings:
- id: SPEC-ARCH-001
  lens: Reflexivity / premise currency
  severity: 3
  title: 'Spec says #5581 and the projector are not on main; both have merged, so FR-021, A-1, AD-15 and the risk row describe a state that no longer exists'
  evidence:
  - artifact: "spec.md \xA7 FR-021, A-1, AD-15, Risks table row '#5581 reality check and projector', Summary last paragraph"
  - code: 'tests/contract/_mission_status_payloads.py (1273 lines) and tests/contract/test_mission_status_reality.py exist on upstream main since the merge of PR #5581 (2026-10-04); neither file is in this
      workspace, which is based on an older main'
  claim: The spec treats the reality check and projector as a future dependency that gates FR-021 and makes the Mission 'not complete' until they land. They are already merged. The extension is therefore
    an edit to existing files with existing conventions (public readers only, a pure function of the checked-out tree, load_source/resolve_read_dir, a work_package_trap read guard, tree_fingerprint, floors
    pinned in tests/contract/fixtures/mission_status_expected.json, a build_detail already named for MissionDetail), none of which the spec names or honours. FR-022 also exercises 'the reference reader',
    which only exists inside that projector, yet is not marked as gated, so the gating labels are inconsistent.
  remediation: 'Rebase the workspace on current main before plan. Rewrite FR-021/A-1/AD-15/Risks to name the real files and conventions the extension must follow (and the name clash: the existing build_detail
    builds MissionDetail, so the new builder needs a distinct name, for example build_work_package_detail). Drop the ''gated'' wording or make it uniform for FR-021 and FR-022. Re-measure the corpus floors
    on the rebased tree.'
- id: SPEC-ARCH-002
  lens: Layering / private seams
  severity: 3
  title: A-6/OQ-2 leaves review-cycle discovery to a private, environment-dependent resolver, which contradicts the projector's public-readers-only, pure-function-of-the-tree rule and NFR-005 determinism
  evidence:
  - artifact: "spec.md \xA7 FR-005, Edge Cases (coordination partition / SK-348), A-6, OQ-2, NFR-005, FR-021"
  - code: src/specify_cli/review/cycle.py:176 _review_cycle_wp_dir (private; reads the coordination worktree on a materialized coordination Mission, falls back to the primary directory only when the coordination
      directory holds no cycle files)
  - code: src/specify_cli/cli/commands/agent/workflow_cores.py:411 and workflow_executor.py:1118 already import the private name (a fourth reach would be added)
  - code: 'tests/contract/_mission_status_payloads.py load_source docstring: ''through public readers only''; resolve_read_dir falls back to the Mission''s own directory ''so the payload is a pure function
      of the checked-out tree'''
  claim: No public function lists a work package's review-cycle files (resolve_review_cycle_pointer needs a pointer, so it cannot enumerate). The only enumerator is _review_cycle_wp_dir, whose answer depends
    on whether a coordination worktree is materialized on the host. That makes reviewCycles (and the ~1300-file corpus floor) host-dependent, breaks the projector's stated purity, and sends the reference
    reader (the 'executable statement of the rules', which a separate service must also implement) through a private seam. artifactPath is also silently null for a cycle found in the coordination partition
    because AD-2 lists the primary surface only, which the spec never states.
  remediation: 'Decide the seam in the spec, not the plan. Option A: the reader enumerates tasks/<wp-slug>/review-cycle-N.md under the Mission''s own (primary) directory only, document that a cycle that
    exists only on a coordination surface is not listed, and test the stranded-record case (SK-348) against that rule. Option B: add one public listing seam in src/ and amend NFR-007/SC-008 with its justification.
    Either way state that artifactPath is null for a cycle outside the listing, and that the reading is deterministic across hosts.'
- id: SPEC-ARCH-004
  lens: Contracts / Problem schema
  severity: 3
  title: Refusal codes cannot be pinned or exemplified on the shared Problem; v1 convention is a module-specific refusal schema, and editing _shared is forbidden by FR-017
  evidence:
  - artifact: "spec.md \xA7 FR-013, FR-017, FR-019 ('all as the shared Problem', 'Problem examples for 400, 404, 413 and 415'), AC-CONTENT"
  - code: 'contracts/_shared/schemas/Problem.yaml: code is a free string, status only min 400/max 599, no examples'
  - code: 'contracts/mission-status/schemas/StreamRefusal.yaml and PageCursorRefusal.yaml: allOf Problem + const/enum code + status pin + examples, served through module responses/ files'
  claim: 'With the shared Problem as the response schema, the contract states no code, no code-to-status pairing and no enum, so ''a refusal carries the code matching its cause'' and the enum-pin check
    are test-only. Examples for the four refusals have no home: Problem.yaml is a _shared file (an existing schema file, off-limits under FR-017 and the _shared admission rule), and examples live inside
    the schema file. The v1 refusals were closed with a module schema precisely for this.'
  remediation: Add a new module schema (for example ArtifactRefusal) built as allOf Problem + required code enum {invalid_artifact_path, not_found, artifact_too_large, artifact_not_text} with the status
    pairing 400/404/413/415 and the four examples, plus a new responses/ file; the new operations reference it for 400/404/413/415 and keep default as the shared Problem. Existing getWorkPackage stays untouched.
    Add the code enum to the enum pins and state the OQ for artifact 404 versus Mission 404 code consistency (v1's 404 carries no code).
- id: SPEC-ARCH-005
  lens: Canonical source / single authority
  severity: 3
  title: The reference reader is called 'the executable statement of the rules' while the contract descriptions and x-derived rules are the stated source, and the rules are prose-only for the parts no product
    reader has
  evidence:
  - artifact: "spec.md \xA7 Terminology 'Reference reader', FR-003 (tasks.md title rule), FR-010 (kind classifier), FR-015, AD-11, Out of Scope 'the read service'"
  - code: src/specify_cli/core/subtask_rows.py:178 iter_wp_section_subtask_rows yields (id, checked) only; no title reader exists in src/
  claim: The title parsing (two row formats, first row wins), the artifact kind classifier, the media-type table and the readable determination have no product implementation. The spec lets the Python test
    helper be their executable form and the separate Java service must reimplement them from the contract. Two authorities (a Python helper and the contract text) will drift, against charter Standing Order
    6 (single canonical authority).
  remediation: State that contracts/ (descriptions and x-derived rules, with the regex for both tasks.md row formats and the classifier table written out) is the authority and the reader is a conformance
    implementation of it. Add shared conformance fixtures (input tree to expected JSON) that both the Python reader and the future service run, or at minimum require that every x-derived rule be complete
    enough to implement without reading the reader.
- id: SPEC-ARCH-006
  lens: Field-source fidelity (workspace)
  severity: 3
  title: FR-006 and AD-12 cite resolve_workspace_for_wp, which raises for exactly the cases the spec calls normal (no lanes.json, WP in no lane); lane_branch_name and lane-planning are mis-described
  evidence:
  - artifact: "spec.md \xA7 FR-006, AD-12, AD-4, Edge Cases (77 Missions without lanes.json), FR-007 ('no code lane')"
  - code: 'src/specify_cli/workspace/context.py:1197-1203 _resolve_workspace_for_wp_impl: require_lanes_json raises MissingLanesError when lanes.json is absent for a code_change WP; raises ValueError when
      the WP is in no lane'
  - code: src/specify_cli/workspace/context.py:210-239 ResolvedWorkspace has runs_in_checkout_root, resolution_kind, worktree_path, branch_name, lane_id
  - code: src/specify_cli/lanes/branch_naming.py:533 lane_branch_name requires keyword target_branch and returns target_branch itself for lane-planning
  - code: src/specify_cli/lanes/persistence.py:138 read_lanes_json raises CorruptLanesError on a malformed file
  claim: FR-006 says only the topology materialisation raises; the cited resolver raises too, so worktreePresent for a Mission with no lanes.json or an unassigned WP is undefined (a failed read, not the
    documented false). FR-006 omits the target_branch input of lane_branch_name and does not say that for lane-planning (planning-artifact and single_branch lanes) laneId is non-null while laneBranch is
    the target branch (for example the primary branch), which is not a lane branch. FR-007's 'no code lane' then has no definition for laneId=lane-planning. A corrupt lanes.json is not covered by 'null
    when no lanes.json'.
  remediation: Specify that resolver exceptions (MissingLanesError, ValueError, CorruptLanesError, MissionSelectorAmbiguous) map to worktreePresent false / laneId null (or a Problem for CorruptLanesError,
    state which), cite ResolvedWorkspace.runs_in_checkout_root for the AD-12 test instead of re-deriving it, name lanes.json target_branch as the lane_branch_name input, and define laneBranch for lane-planning
    (null, since it is no lane branch) and make FR-007 key 'unknown' on that definition.
- id: SPEC-ARCH-008
  lens: Field-source fidelity (subtasks)
  severity: 3
  title: authored_subtask_roster raises for a missing 'subtasks' key, a missing or ambiguous WP file; the v1 authored roster (AuthoredGroup.subtasks) never raises, so the two can disagree
  evidence:
  - artifact: "spec.md \xA7 FR-003, field catalogue row subtasks[].id, FR-004 control 'dependency ids equal WorkPackage.dependencies', AC-DETAIL"
  - code: src/specify_cli/core/subtask_rows.py:285-322 authored_subtask_roster raises SubtaskRosterResolutionError (key missing, file missing, ambiguous, unreadable)
  - code: src/specify_cli/status/wp_view.py:198-211 _authored_group builds AuthoredGroup.subtasks from normalize_authored_subtask_roster(metadata.subtasks) and yields an empty group when metadata is None
  claim: The spec cites the raising function as the x-source of subtasks[].id but says only an empty roster is []; a work package whose frontmatter has no subtasks key (legacy planning files) would raise,
    with no stated outcome (FR-020 has no null for this field). v1's WorkPackage.authored.subtasks derives from AuthoredGroup, so the detail's ids may differ from the ids v1 returns for the same work package,
    and the equality controls the spec lists cover dependencies and ownedFiles but not subtasks.
  remediation: Cite AuthoredGroup.subtasks (and normalize_authored_subtask_roster) as the x-source, the same source as v1, and add an equality control subtasks[].id == WorkPackage.authored.subtasks in AC-DETAIL.
    If authored_subtask_roster is kept, state that a raise yields [] and which condition fails the read.
- id: SPEC-ARCH-009
  lens: Field-source fidelity (dependency titles)
  severity: 2
  title: FR-004 describes WPMetadata.display_title as falling back to the id when the title is empty; it falls back only when the title is None
  evidence:
  - artifact: "spec.md \xA7 FR-004 ('the title, trimmed, or the work package id when there is none'), FR-015 ('the field stays non-null')"
  - code: src/specify_cli/status/wp_metadata.py:430-439 display_title returns self.title.strip() for any non-None title, so '' or '   ' returns ''
  claim: A whitespace-only or empty authored title yields an empty-string title, contradicting 'never filled with an empty string' (AD-4) and v1's title minLength 1. Also the reference reader must read
    each dependency's WP file (not just the current one), which the work_package_trap pattern of the v1 projector would flag; the spec does not say so.
  remediation: 'Define the rule as: trimmed title if non-empty, otherwise the work package id; state that the rule is ''x-derived on display_title'' rather than a pure x-source. Note that the detail builder
    reads sibling WP files and adjust the read-guard accordingly.'
- id: SPEC-ARCH-010
  lens: Field-source fidelity (reviewCycles)
  severity: 2
  title: Verdict-by-pointer matching is underspecified (key, multiple matches, renamed Missions) and build_review_cycle_pointer can raise
  evidence:
  - artifact: "spec.md \xA7 FR-005 verdict and feedbackReference, AD-13"
  - code: src/specify_cli/status/models.py:285-295 ReviewResult.reference is 'Approval ref or feedback:// URI', so a reference is not always a review-cycle pointer
  - code: src/specify_cli/review/cycle.py:446-453 build_review_cycle_pointer validates each segment and raises ReviewCycleError on an unsafe slug or filename
  claim: The spec does not say what string is compared (full pointer equality, or the wp-slug and file name only), what happens when several events carry the same pointer (a re-moved WP) or when the event's
    mission segment differs from the directory's (renamed Missions), nor how the reader behaves when pointer construction raises, although feedbackReference is 'always a non-null string matching the pattern'.
    The corpus yield of non-null verdicts is therefore unpredictable and untested.
  remediation: State the match key, last-event-wins by event order (or error), and that a segment that fails validation yields a Problem for the read (or a documented fallback). Add a corpus floor on the
    number of cycles with a non-null verdict and a synthetic case with two matching events.
- id: SPEC-ARCH-011
  lens: Contracts / sequencing
  severity: 2
  title: The 1.0.0 release sequencing (CL-2) does not account for tag reachability or the release commit editing the same lines the slice edits
  evidence:
  - artifact: "spec.md \xA7 CL-2, A-4, FR-017 (b), FR-018, AC-VERSION"
  - code: contracts/tools/breaking_check.py:find_baseline uses git tag --merged <ref>; first_release accepts only 1.0.0 or 1.0.0-SNAPSHOT without a tag
  - code: contracts/mission-status/openapi.yaml info.version is 1.0.0-SNAPSHOT and contracts/mission-status/CHANGELOG.md has the heading '## 1.0.0-SNAPSHOT'; no contract-mission-status-v* tag exists today
  claim: The baseline tag must be an ancestor of the commit checked, so the branch must be rebased onto the release commit; that commit rewrites info.version and the CHANGELOG heading that this slice also
    edits (1.1.0-SNAPSHOT). The spec says only 'before the pull request is opened'. FR-017 (b) lists path/schema/parameter/response files but the slice also edits openapi.yaml and three _index.yaml files
    (and contracts/tools/enum_pins.json for the new pins), none of which the allow-list names.
  remediation: 'State that the branch is rebased onto the release commit before the check is run, that the CHANGELOG heading rename is resolved there, and enumerate the edited existing files (openapi.yaml,
    the four _index.yaml files, enum_pins.json) as the only permitted changes to existing files. Record that OQ-1 is answered: structure_check reads headings only and requires Added/Changed/Removed/Provisional
    to exist anywhere in the file plus a heading for info.version, so a fifth ''Deferred'' heading is accepted.'
- id: SPEC-ARCH-012
  lens: Migrations / locality
  severity: 1
  title: 'Confirmation: no migration is implied, and no src/ change is required by the cited seams except the OQ-2 decision'
  evidence:
  - artifact: "spec.md \xA7 NFR-007, Out of Scope, A-6"
  - code: pyproject.toml wheel packages do not include contracts/ ; citation_check.py resolves x-source symbols from the syntax tree (annotated class fields such as AuthoredGroup.owned_files and class-level
      defs such as WPMetadata.display_title resolve)
  claim: All cited symbols exist at module or class level and resolve under the citation grammar; no upgrade migration, packaged asset or kitty-specs edit is implied. The one exception is SPEC-ARCH-002,
    which could add a src/ seam. The frozen kitty-specs archive is respected (the slice reads it, add-only records).
  remediation: None required; keep NFR-007 and note in the plan that the migration question was checked and is closed.
- id: SPEC-COMPLETE-001
  lens: Secrets/leaks
  severity: 4
  title: Redaction covers only paths and e-mails; the single leak authority also recognises secrets and forbidden property names
  evidence:
  - artifact: "spec.md \xA7 FR-015, CL-3, AD-10, NFR-004, AC-CONTENT"
  - code: 'contracts/tools/leak_patterns.py: SECRET_PATTERNS, CODE_CREDENTIAL, FORBIDDEN_PROPERTY_NAMES, leak_codes()'
  claim: FR-015 names the leak_patterns.py module as "the single authority" and says the slice adds none and weakens none, but it only defines two replacement tokens ([path], [email]). The same module returns
    a third code (SECRET) for GitHub tokens, AWS key ids and PEM private-key headers, and lists forbidden property names (feedback_path, record_path, worktree_path and others). The spec gives no mechanism
    for a secret in artifact content (no token, no refusal), so a content read serves it verbatim while the corpus leak scan over envelope content (which uses leak_codes) either fails the run or, if the
    scan is narrowed to path and e-mail, passes a credential through. Forbidden property names inside served JSON/YAML/JSONL content (the D-14 class "property that carries local identity") are not addressed
    either. AC-CONTENT and NFR-004 say "zero host paths and e-mail addresses", so the secret class has no AC and no planted negative (FR-023). This is a credential hazard in a public-repo corpus.
  remediation: Add to FR-015 and AC-CONTENT a stated outcome for the SECRET class in content and in human-text fields (for example a third fixed token [secret] with the same substring rule, or a refusal
    Problem), and state what happens to a forbidden property name appearing as a key in served JSON/YAML content (redact its value, or document the accepted residual). CL-3 only fixes [path] and [email]
    for the envelope, so if a new token is needed record it as an author decision for operator confirmation rather than silently adding it. Add a planted secret per endpoint to FR-023 and a floor/negative
    to AC-CONTENT; say the leak scan runs all three codes.
- id: SPEC-COMPLETE-002
  lens: Testability
  severity: 4
  title: The readable invariant contradicts the first-bytes bound in FR-011 and NFR-002
  evidence:
  - artifact: "spec.md \xA7 AD-7, FR-011 (last sentence), NFR-002, AC-LIST readable invariant, FR-013"
  - artifact: "spec.md \xA7 AD-7 ('inspects the first bytes of every file within the cap (bounded by the entry cap times the byte cap)')"
  - artifact: "spec.md \xA7 FR-011 ('opens no file beyond the first bytes needed'), \xA7 NFR-002 ('at most the first bytes of each'), \xA7 FR-013 (415 for any invalid UTF-8 or NUL byte anywhere)"
  - artifact: "spec.md \xA7 AD-7 ('inspects the first bytes of every file within the cap'); \xA7 FR-011 last sentence ('no file beyond the first bytes needed by the readable determination'); \xA7 NFR-002\
      \ ('at most the first bytes of each')"
  claim: AD-7 says readable:true implies the content read succeeds, and inspects "the first bytes of every file within the cap". A NUL byte or an invalid UTF-8 sequence can sit anywhere in a file of up
    to 262144 bytes, so only a full read of every file within the cap can make the invariant true. FR-011 says the listing "opens no file beyond the first bytes needed" and NFR-002 says "at most the first
    bytes of each". Those bounds read as a prefix, which makes the AC-LIST invariant (checked for every entry in the corpus, SC-003 100 percent) fail on any file whose defect is late, or forces the implementer
    to guess. AD-7's own bound (entry cap times byte cap) is 256 MiB per listing, which NFR-002 and NFR-001 do not reflect.
  remediation: 'State exactly what the listing reads: the whole file for every file with st_size at or below 262144 and nothing for larger files. Reword FR-011/NFR-002 to that bound, put the 1000 x 262144
    worst case into NFR-001/NFR-002, and add a fixture to FR-022/AC-LIST with the NUL byte and the invalid sequence at the last byte of a 262144-byte file, asserting readable:false and a 415.'
  also_raised_as:
  - SPEC-GOV-003
  - SPEC-VERIFY-007
- id: SPEC-COMPLETE-003
  lens: Permissions
  severity: 4
  title: Status-record exclusion is not defined for case-insensitive hosts, nested names or symlinked parent directories
  evidence:
  - artifact: "spec.md \xA7 AD-5, AD-6, AD-9, FR-011, FR-014, FR-022 containment list, Edge Cases (case-insensitive)"
  - code: src/specify_cli/core/utils.py:125 ensure_within_directory (resolves symlinks, then relative_to)
  claim: (1) The exclusion of status.events.jsonl and status.json is stated by name only. On a case-insensitive host (the desktop app is a consumer; the Edge Case says artifacts differing by case are listed
    with real names, no normalisation) a request for STATUS.JSON or Status.Events.jsonl opens the very file AD-5 forbids, unless the comparison is on the resolved real name. (2) It is not stated whether
    the exclusion applies at the Mission root only or at any depth. (3) FR-014 names ensure_within_directory as the reference rule, but that helper resolves symlinks and only checks the final result; AD-6
    requires that no symlink is followed, including a symlinked directory component (research/ pointing elsewhere), and FR-014 never says per-component lstat or O_NOFOLLOW is the mechanism. A check-then-open
    race between validation and open is also not addressed. (4) The AC for containment ("every case in FR-022's list") has no case for a status record read by exact name, by case variant, or through a symlinked
    parent, because FR-022's containment bullet omits them.
  remediation: 'In FR-011/FR-014 state the exclusion as: the final path component, compared case-insensitively on every host, at the Mission root (and say whether nested names are also excluded); state
    that each component of the path is lstat-checked and none may be a symlink, with the open done without following links. Add to FR-022 and AC-CONTENT: status.events.jsonl and status.json by exact name
    and by case variant (404), a path through a symlinked directory inside the Mission, and a regular file hard-linked to an outside file (document the outcome). Each must assert no target content in the
    response.'
- id: SPEC-COMPLETE-004
  lens: Coverage / Testability
  severity: 4
  title: AD-12 (worktreePresent true only for a lane worktree) has no test that can fail; corpus asserts boolean shape only
  evidence:
  - artifact: "spec.md \xA7 AD-12, FR-006, FR-016, FR-022, AC-DETAIL workspace bullet, SC-004"
  - code: src/specify_cli/workspace/context.py resolve_workspace_for_wp (per AD-12 resolves planning WPs to the repository root)
  - artifact: "spec.md \xA7 AD-12; \xA7 FR-006 worktreePresent; \xA7 FR-016 ('asserted boolean'); \xA7 FR-022 (the synthetic list has no worktreePresent case); \xA7 AC-DETAIL (workspace bullet only covers\
      \ changeState)"
  - code: 'src/specify_cli/workspace/context.py: resolve_workspace_for_wp (a planning-artifact work package resolves to the repository root)'
  claim: AD-12 exists to stop worktreePresent being true for the repository root. FR-016 asserts it in the corpus only as a boolean, and FR-022's synthetic list never mentions worktreePresent or workspace.laneId/laneBranch/planningBranch.
    An implementation that returns true for every planning-artifact work package (the exact bug AD-12 names) passes every stated check, as does one that never returns true. The AC-DETAIL workspace bullet
    covers only changeState. No AC covers the null workspace values required by User Story 1 scenario 3 beyond a corpus floor, and none covers the happy path (a lane worktree that exists gives true).
  remediation: 'Add to FR-022 and AC-DETAIL a synthetic matrix: a work package in a real lane worktree (true), a lane worktree recorded but not created (false), a planning-artifact work package resolving
    to the repository root (false, fails if true), no lanes.json (laneId and laneBranch null), a work package in no lane. State the invariant that changeState is never changed or unchanged when worktreePresent
    is false, and assert it.'
  also_raised_as:
  - SPEC-VERIFY-004
- id: SPEC-COMPLETE-005
  lens: Coverage
  severity: 4
  title: Several FRs and decisions have no acceptance criterion although the traceability table claims coverage
  evidence:
  - artifact: "spec.md \xA7 Traceability row FR-001 to FR-008 -> AC-DETAIL; AC-DETAIL bullets; FR-004, FR-005, FR-008, AD-13, FR-003 statusLane"
  claim: 'The row "FR-001 to FR-008 -> AC-DETAIL" overstates coverage. Reading AC-DETAIL bullet by bullet: FR-004 titles and statusLane (and the dangling-dependency case, and statusLane null rather than
    planned) have only the wpId equality check; FR-008 artifactReferences (non-null only when listed, null when absent) is not mentioned anywhere in the ACs; FR-005 verdict matching by pointer, verdict
    null, cycle ordering and the unparseable-cycle entry (AD-13) have no AC, only feedbackReference is checked; FR-003 subtask statusLane null versus planned and duplicate-id first-row-wins have none; FR-024
    maps to "review of plan/README", which is not a testable observable. The FR-021 corpus controls compare only ids and patterns, so a wrong dependency title or a wrong verdict passes every AC.'
  remediation: 'Add AC-DETAIL bullets, each with a fail condition: (a) dependency title/statusLane against the status snapshot and the title fallback, plus a dangling dependency listed with id as title
    and statusLane null; (b) artifactReferences prompt/spec non-null iff the path is in the listing, null otherwise, including on a truncated listing; (c) verdict equals the status event matched by pointer,
    null when none, and a planted event for the wrong cycle; ascending cycleNumber; an unparseable cycle file kept as an entry with nulls and a cycle number from its file name; (d) subtask statusLane null
    for an id with no recorded state; duplicate id resolves to the first row. Give FR-024 an observable (a table in the plan listing every removed route, checked by a grep in the review).'
- id: SPEC-COMPLETE-006
  lens: Coverage
  severity: 3
  title: Risks table promises fixtures that FR-022 and the ACs do not contain
  evidence:
  - artifact: "spec.md \xA7 Risks and Dependencies rows SK-348 and SK-310; FR-022; Edge Cases (review-cycle file in coordination partition, dependency naming no work package, no lanes.json)"
  claim: The SK-348 row says "test a Mission with the record in each place (FR-022)" and the SK-310 row says "fixture with a coordination-topology Mission". FR-022's bullet list has neither. The Edge Cases
    (cycle in the coordination partition or stranded in primary, work package in no lane, no lanes.json, dependency naming no work package, tasks.md absent) are likewise not in FR-022 or any AC. The traceability
    is therefore dishonest for exactly the topology cases the ledger entries warn about, and zero-found-is-[] could mask a resolver that misses the coordination place.
  remediation: Add the two topology fixtures and each Edge Case as explicit FR-022 bullets, with the outcome and the way each fails (for example a cycle file only in the coordination partition must appear,
    not give []; plan.md must be found on a coordination-topology Mission).
- id: SPEC-COMPLETE-007
  lens: Silent-success at the edges
  severity: 3
  title: A corrupt lanes.json and the planning lane have no stated outcome
  evidence:
  - artifact: "spec.md \xA7 FR-006, FR-007, Edge Cases (no lanes.json), AD-4"
  - code: src/specify_cli/lanes/persistence.py:138 read_lanes_json (returns None only when absent, raises CorruptLanesError when present but malformed)
  - code: src/specify_cli/lanes/branch_naming.py:533 lane_branch_name (requires keyword target_branch; returns target_branch for lane-planning)
  claim: The spec defines null for "no lanes.json" only. The real reader distinguishes absence (None) from a corrupt file (raises), precisely to prevent silent fallback; the spec does not say whether a
    corrupt lanes.json yields null laneId (silent success on a broken Mission) or a Problem. Second, lane_branch_name needs a target_branch argument the spec never names as an input, and for the lane-planning
    lane it returns the target branch itself (for example the integration branch), so FR-006's rule "laneBranch is the lane branch name when laneId is non-null" would report the primary branch as a lane
    branch for every single_branch or planning work package; FR-007 covers changeState for "no code lane" but FR-006 does not say laneId/laneBranch for the planning lane.
  remediation: 'State in FR-006: absent lanes.json gives null/null; unparseable lanes.json is a Problem (or an explicit documented null with the cause visible), consistent with AD-4 and FR-020; name target_branch
