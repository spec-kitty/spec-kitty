- id: SPEC-COMPLETE-009
  lens: Silent-success at the edges
  severity: 3
  title: Subtask title null conflates three causes, and an empty title cell is unspecified (and contradicts AC-DETAIL)
  evidence:
  - artifact: "spec.md \xA7 FR-003, FR-020 first bullet, AC-DETAIL subtask titles bullet, User Story 1 scenario 1"
  claim: title is null when tasks.md is absent, has no row for the id, or (FR-020) cannot be decoded; a consumer cannot tell a Mission without tasks.md from a decode failure, and no AC or FR-022 bullet
    exercises an undecodable tasks.md. FR-003 does not say what a row with an empty title cell gives, while AC-DETAIL says the check fails when a title is an empty string; FR-003 permits null only for absent
    file or absent row, so the two disagree. The title extraction rule for the checkbox form (priority tags, bold, WP references) is also left unstated, and the fixture in the AC has only one clean row
    of each kind.
