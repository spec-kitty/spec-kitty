  remediation: 'State the outcome: either the pointer is built from the validated file path and an entry whose pointer cannot be built is still listed with feedbackReference null (and make the schema nullable),
    or the detail read is a Problem. Add a planted cycle file with an invalid name to FR-022.'
  refuter_reason: build_review_cycle_pointer raises ReviewCycleError on invalid segments or file names, while FR-005 says feedbackReference is always non-null and AD-13 says cycle files are never dropped,
