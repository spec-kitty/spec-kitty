- id: SPEC-ARCH-001
  lens: Reflexivity / premise currency
  severity: 3
  title: 'Spec says #5581 and the projector are not on main; both have merged, so FR-021, A-1, AD-15 and the risk row describe a state that no longer exists'
  evidence:
  - artifact: "spec.md \xA7 FR-021, A-1, AD-15, Risks table row '#5581 reality check and projector', Summary last paragraph"
  - code: 'tests/contract/_mission_status_payloads.py (1273 lines) and tests/contract/test_mission_status_reality.py exist on upstream main since the merge of PR #5581 (2026-10-04); neither file is in this
      workspace, which is based on an older main'
  claim: The spec treats the reality check and projector as a future dependency that gates FR-021 and makes the Mission 'not complete' until they land. They are already merged. The extension is therefore
    an edit to existing files with existing conventions (public readers only, a pure function of the checked-out tree, load_source/resolve_read_dir, a work_package_trap read guard, tree_fingerprint, floors
    pinned in tests/contract/fixtures/mission_status_expected.json, a build_detail already named for MissionDetail), none of which the spec names or honours. FR-022 also exercises 'the reference reader',
    which only exists inside that projector, yet is not marked as gated, so the gating labels are inconsistent.
  remediation: 'Rebase the workspace on current main before plan. Rewrite FR-021/A-1/AD-15/Risks to name the real files and conventions the extension must follow (and the name clash: the existing build_detail
    builds MissionDetail, so the new builder needs a distinct name, for example build_work_package_detail). Drop the ''gated'' wording or make it uniform for FR-021 and FR-022. Re-measure the corpus floors
    on the rebased tree.'
  refuter_reason: gh shows PR 5581 MERGED 2026-10-04 and main holds tests/contract/_mission_status_payloads.py (1273 lines, public-readers-only, build_detail already present), so spec FR-021, A-1, AD-15
    and the risk row describe a stale premise.
- id: SPEC-ARCH-002
  lens: Layering / private seams
  severity: 3
  title: A-6/OQ-2 leaves review-cycle discovery to a private, environment-dependent resolver, which contradicts the projector's public-readers-only, pure-function-of-the-tree rule and NFR-005 determinism
  evidence:
  - artifact: "spec.md \xA7 FR-005, Edge Cases (coordination partition / SK-348), A-6, OQ-2, NFR-005, FR-021"
  - code: src/specify_cli/review/cycle.py:176 _review_cycle_wp_dir (private; reads the coordination worktree on a materialized coordination Mission, falls back to the primary directory only when the coordination
      directory holds no cycle files)
  - code: src/specify_cli/cli/commands/agent/workflow_cores.py:411 and workflow_executor.py:1118 already import the private name (a fourth reach would be added)
  - code: 'tests/contract/_mission_status_payloads.py load_source docstring: ''through public readers only''; resolve_read_dir falls back to the Mission''s own directory ''so the payload is a pure function
      of the checked-out tree'''
  claim: No public function lists a work package's review-cycle files (resolve_review_cycle_pointer needs a pointer, so it cannot enumerate). The only enumerator is _review_cycle_wp_dir, whose answer depends
    on whether a coordination worktree is materialized on the host. That makes reviewCycles (and the ~1300-file corpus floor) host-dependent, breaks the projector's stated purity, and sends the reference
    reader (the 'executable statement of the rules', which a separate service must also implement) through a private seam. artifactPath is also silently null for a cycle found in the coordination partition
    because AD-2 lists the primary surface only, which the spec never states.
  remediation: 'Decide the seam in the spec, not the plan. Option A: the reader enumerates tasks/<wp-slug>/review-cycle-N.md under the Mission''s own (primary) directory only, document that a cycle that
    exists only on a coordination surface is not listed, and test the stranded-record case (SK-348) against that rule. Option B: add one public listing seam in src/ and amend NFR-007/SC-008 with its justification.
    Either way state that artifactPath is null for a cycle outside the listing, and that the reading is deterministic across hosts.'
  refuter_reason: _review_cycle_wp_dir is private and its answer depends on a materialized coordination worktree (with a primary fallback), while the projector load_source docstring says public readers
    only and resolve_read_dir promises a pure function of the tree; the spec defers the seam to OQ-2 without stating the determinism consequence.
- id: SPEC-ARCH-004
  lens: Contracts / Problem schema
  severity: 3
  title: Refusal codes cannot be pinned or exemplified on the shared Problem; v1 convention is a module-specific refusal schema, and editing _shared is forbidden by FR-017
  evidence:
  - artifact: "spec.md \xA7 FR-013, FR-017, FR-019 ('all as the shared Problem', 'Problem examples for 400, 404, 413 and 415'), AC-CONTENT"
  - code: 'contracts/_shared/schemas/Problem.yaml: code is a free string, status only min 400/max 599, no examples'
  - code: 'contracts/mission-status/schemas/StreamRefusal.yaml and PageCursorRefusal.yaml: allOf Problem + const/enum code + status pin + examples, served through module responses/ files'
  claim: 'With the shared Problem as the response schema, the contract states no code, no code-to-status pairing and no enum, so ''a refusal carries the code matching its cause'' and the enum-pin check
    are test-only. Examples for the four refusals have no home: Problem.yaml is a _shared file (an existing schema file, off-limits under FR-017 and the _shared admission rule), and examples live inside
    the schema file. The v1 refusals were closed with a module schema precisely for this.'
  remediation: Add a new module schema (for example ArtifactRefusal) built as allOf Problem + required code enum {invalid_artifact_path, not_found, artifact_too_large, artifact_not_text} with the status
    pairing 400/404/413/415 and the four examples, plus a new responses/ file; the new operations reference it for 400/404/413/415 and keep default as the shared Problem. Existing getWorkPackage stays untouched.
    Add the code enum to the enum pins and state the OQ for artifact 404 versus Mission 404 code consistency (v1's 404 carries no code).
  refuter_reason: Problem.yaml has a free-string code and no examples, the v1 convention pins codes via module schemas such as StreamRefusal (allOf Problem plus enum plus status), and example_check requires
    every example to be referenced from a schema's examples list, so the FR-019 Problem examples have no home without editing _shared (forbidden by FR-017).
- id: SPEC-ARCH-006
  lens: Field-source fidelity (workspace)
  severity: 3
  title: FR-006 and AD-12 cite resolve_workspace_for_wp, which raises for exactly the cases the spec calls normal (no lanes.json, WP in no lane); lane_branch_name and lane-planning are mis-described
  evidence:
  - artifact: "spec.md \xA7 FR-006, AD-12, AD-4, Edge Cases (77 Missions without lanes.json), FR-007 ('no code lane')"
  - code: 'src/specify_cli/workspace/context.py:1197-1203 _resolve_workspace_for_wp_impl: require_lanes_json raises MissingLanesError when lanes.json is absent for a code_change WP; raises ValueError when
      the WP is in no lane'
  - code: src/specify_cli/workspace/context.py:210-239 ResolvedWorkspace has runs_in_checkout_root, resolution_kind, worktree_path, branch_name, lane_id
  - code: src/specify_cli/lanes/branch_naming.py:533 lane_branch_name requires keyword target_branch and returns target_branch itself for lane-planning
  - code: src/specify_cli/lanes/persistence.py:138 read_lanes_json raises CorruptLanesError on a malformed file
  claim: FR-006 says only the topology materialisation raises; the cited resolver raises too, so worktreePresent for a Mission with no lanes.json or an unassigned WP is undefined (a failed read, not the
    documented false). FR-006 omits the target_branch input of lane_branch_name and does not say that for lane-planning (planning-artifact and single_branch lanes) laneId is non-null while laneBranch is
    the target branch (for example the primary branch), which is not a lane branch. FR-007's 'no code lane' then has no definition for laneId=lane-planning. A corrupt lanes.json is not covered by 'null
    when no lanes.json'.
  remediation: Specify that resolver exceptions (MissingLanesError, ValueError, CorruptLanesError, MissionSelectorAmbiguous) map to worktreePresent false / laneId null (or a Problem for CorruptLanesError,
    state which), cite ResolvedWorkspace.runs_in_checkout_root for the AD-12 test instead of re-deriving it, name lanes.json target_branch as the lane_branch_name input, and define laneBranch for lane-planning
    (null, since it is no lane branch) and make FR-007 key 'unknown' on that definition.
  refuter_reason: _resolve_workspace_for_wp_impl calls require_lanes_json (MissingLanesError) and raises ValueError for a WP in no lane, and lane_branch_name requires target_branch and returns it for lane-planning,
    none of which FR-006/AD-12 states, leaving worktreePresent and laneBranch undefined in those cases.
- id: SPEC-ARCH-008
  lens: Field-source fidelity (subtasks)
  severity: 3
  title: authored_subtask_roster raises for a missing 'subtasks' key, a missing or ambiguous WP file; the v1 authored roster (AuthoredGroup.subtasks) never raises, so the two can disagree
  evidence:
  - artifact: "spec.md \xA7 FR-003, field catalogue row subtasks[].id, FR-004 control 'dependency ids equal WorkPackage.dependencies', AC-DETAIL"
  - code: src/specify_cli/core/subtask_rows.py:285-322 authored_subtask_roster raises SubtaskRosterResolutionError (key missing, file missing, ambiguous, unreadable)
  - code: src/specify_cli/status/wp_view.py:198-211 _authored_group builds AuthoredGroup.subtasks from normalize_authored_subtask_roster(metadata.subtasks) and yields an empty group when metadata is None
  claim: The spec cites the raising function as the x-source of subtasks[].id but says only an empty roster is []; a work package whose frontmatter has no subtasks key (legacy planning files) would raise,
    with no stated outcome (FR-020 has no null for this field). v1's WorkPackage.authored.subtasks derives from AuthoredGroup, so the detail's ids may differ from the ids v1 returns for the same work package,
    and the equality controls the spec lists cover dependencies and ownedFiles but not subtasks.
  remediation: Cite AuthoredGroup.subtasks (and normalize_authored_subtask_roster) as the x-source, the same source as v1, and add an equality control subtasks[].id == WorkPackage.authored.subtasks in AC-DETAIL.
    If authored_subtask_roster is kept, state that a raise yields [] and which condition fails the read.
  refuter_reason: authored_subtask_roster raises SubtaskRosterResolutionError for a missing subtasks key or missing/ambiguous WP file, while v1's AuthoredGroup.subtasks uses normalize_authored_subtask_roster
    and never raises; the spec cites the raising function as x-source with no stated outcome and no equality control.
- id: SPEC-ARCH-010
  lens: Field-source fidelity (reviewCycles)
  severity: 2
  title: Verdict-by-pointer matching is underspecified (key, multiple matches, renamed Missions) and build_review_cycle_pointer can raise
  evidence:
  - artifact: "spec.md \xA7 FR-005 verdict and feedbackReference, AD-13"
  - code: src/specify_cli/status/models.py:285-295 ReviewResult.reference is 'Approval ref or feedback:// URI', so a reference is not always a review-cycle pointer
  - code: src/specify_cli/review/cycle.py:446-453 build_review_cycle_pointer validates each segment and raises ReviewCycleError on an unsafe slug or filename
  claim: The spec does not say what string is compared (full pointer equality, or the wp-slug and file name only), what happens when several events carry the same pointer (a re-moved WP) or when the event's
    mission segment differs from the directory's (renamed Missions), nor how the reader behaves when pointer construction raises, although feedbackReference is 'always a non-null string matching the pattern'.
    The corpus yield of non-null verdicts is therefore unpredictable and untested.
  remediation: State the match key, last-event-wins by event order (or error), and that a segment that fails validation yields a Problem for the read (or a documented fallback). Add a corpus floor on the
    number of cycles with a non-null verdict and a synthetic case with two matching events.
  refuter_reason: FR-005/AD-13 do not say what happens with several events carrying the same pointer, and build_review_cycle_pointer raises ReviewCycleError on an unsafe segment while FR-005 says feedbackReference
    is always non-null, so that outcome is unspecified.
