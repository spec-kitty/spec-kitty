- id: SPEC-COMPLETE-001
  lens: Secrets/leaks
  severity: 4
  title: Redaction covers only paths and e-mails; the single leak authority also recognises secrets and forbidden property names
  evidence:
  - artifact: "spec.md \xA7 FR-015, CL-3, AD-10, NFR-004, AC-CONTENT"
  - code: 'contracts/tools/leak_patterns.py: SECRET_PATTERNS, CODE_CREDENTIAL, FORBIDDEN_PROPERTY_NAMES, leak_codes()'
  claim: FR-015 names the leak_patterns.py module as "the single authority" and says the slice adds none and weakens none, but it only defines two replacement tokens ([path], [email]). The same module returns
    a third code (SECRET) for GitHub tokens, AWS key ids and PEM private-key headers, and lists forbidden property names (feedback_path, record_path, worktree_path and others). The spec gives no mechanism
    for a secret in artifact content (no token, no refusal), so a content read serves it verbatim while the corpus leak scan over envelope content (which uses leak_codes) either fails the run or, if the
    scan is narrowed to path and e-mail, passes a credential through. Forbidden property names inside served JSON/YAML/JSONL content (the D-14 class "property that carries local identity") are not addressed
    either. AC-CONTENT and NFR-004 say "zero host paths and e-mail addresses", so the secret class has no AC and no planted negative (FR-023). This is a credential hazard in a public-repo corpus.
  remediation: Add to FR-015 and AC-CONTENT a stated outcome for the SECRET class in content and in human-text fields (for example a third fixed token [secret] with the same substring rule, or a refusal
    Problem), and state what happens to a forbidden property name appearing as a key in served JSON/YAML content (redact its value, or document the accepted residual). CL-3 only fixes [path] and [email]
    for the envelope, so if a new token is needed record it as an author decision for operator confirmation rather than silently adding it. Add a planted secret per endpoint to FR-023 and a floor/negative
    to AC-CONTENT; say the leak scan runs all three codes.
  refuter_reason: leak_patterns.leak_codes returns SECRET for GitHub tokens, AWS key ids and PEM headers and the projector's leak scan calls leak_codes over every payload node, yet FR-015, CL-3 and AC-CONTENT
    define only [path] and [email] and state no outcome for a secret in served content.
- id: SPEC-COMPLETE-002
  lens: Testability
  severity: 4
  title: The readable invariant contradicts the first-bytes bound in FR-011 and NFR-002
  evidence:
  - artifact: "spec.md \xA7 AD-7, FR-011 (last sentence), NFR-002, AC-LIST readable invariant, FR-013"
  - artifact: "spec.md \xA7 AD-7 ('inspects the first bytes of every file within the cap (bounded by the entry cap times the byte cap)')"
  - artifact: "spec.md \xA7 FR-011 ('opens no file beyond the first bytes needed'), \xA7 NFR-002 ('at most the first bytes of each'), \xA7 FR-013 (415 for any invalid UTF-8 or NUL byte anywhere)"
  - artifact: "spec.md \xA7 AD-7 ('inspects the first bytes of every file within the cap'); \xA7 FR-011 last sentence ('no file beyond the first bytes needed by the readable determination'); \xA7 NFR-002\
      \ ('at most the first bytes of each')"
  claim: AD-7 says readable:true implies the content read succeeds, and inspects "the first bytes of every file within the cap". A NUL byte or an invalid UTF-8 sequence can sit anywhere in a file of up
    to 262144 bytes, so only a full read of every file within the cap can make the invariant true. FR-011 says the listing "opens no file beyond the first bytes needed" and NFR-002 says "at most the first
    bytes of each". Those bounds read as a prefix, which makes the AC-LIST invariant (checked for every entry in the corpus, SC-003 100 percent) fail on any file whose defect is late, or forces the implementer
    to guess. AD-7's own bound (entry cap times byte cap) is 256 MiB per listing, which NFR-002 and NFR-001 do not reflect.
  remediation: 'State exactly what the listing reads: the whole file for every file with st_size at or below 262144 and nothing for larger files. Reword FR-011/NFR-002 to that bound, put the 1000 x 262144
    worst case into NFR-001/NFR-002, and add a fixture to FR-022/AC-LIST with the NUL byte and the invalid sequence at the last byte of a 262144-byte file, asserting readable:false and a 415.'
  also_raised_as:
  - SPEC-GOV-003
  - SPEC-VERIFY-007
  refuter_reason: AD-7 requires readable:true to imply a successful read yet FR-011 and NFR-002 bound the listing to "first bytes", and a late NUL or invalid UTF-8 byte cannot be seen without reading the
    whole file within the cap.
- id: SPEC-COMPLETE-004
  lens: Coverage / Testability
  severity: 4
  title: AD-12 (worktreePresent true only for a lane worktree) has no test that can fail; corpus asserts boolean shape only
  evidence:
  - artifact: "spec.md \xA7 AD-12, FR-006, FR-016, FR-022, AC-DETAIL workspace bullet, SC-004"
  - code: src/specify_cli/workspace/context.py resolve_workspace_for_wp (per AD-12 resolves planning WPs to the repository root)
  - artifact: "spec.md \xA7 AD-12; \xA7 FR-006 worktreePresent; \xA7 FR-016 ('asserted boolean'); \xA7 FR-022 (the synthetic list has no worktreePresent case); \xA7 AC-DETAIL (workspace bullet only covers\
      \ changeState)"
  - code: 'src/specify_cli/workspace/context.py: resolve_workspace_for_wp (a planning-artifact work package resolves to the repository root)'
  claim: AD-12 exists to stop worktreePresent being true for the repository root. FR-016 asserts it in the corpus only as a boolean, and FR-022's synthetic list never mentions worktreePresent or workspace.laneId/laneBranch/planningBranch.
    An implementation that returns true for every planning-artifact work package (the exact bug AD-12 names) passes every stated check, as does one that never returns true. The AC-DETAIL workspace bullet
    covers only changeState. No AC covers the null workspace values required by User Story 1 scenario 3 beyond a corpus floor, and none covers the happy path (a lane worktree that exists gives true).
  remediation: 'Add to FR-022 and AC-DETAIL a synthetic matrix: a work package in a real lane worktree (true), a lane worktree recorded but not created (false), a planning-artifact work package resolving
    to the repository root (false, fails if true), no lanes.json (laneId and laneBranch null), a work package in no lane. State the invariant that changeState is never changed or unchanged when worktreePresent
    is false, and assert it.'
  also_raised_as:
  - SPEC-VERIFY-004
  refuter_reason: FR-016 asserts worktreePresent as a boolean only, FR-022 has no worktreePresent or workspace case, and AC-DETAIL covers only changeState, so the AD-12 bug (true for the repository root)
    passes every stated check.
- id: SPEC-COMPLETE-005
  lens: Coverage
  severity: 4
  title: Several FRs and decisions have no acceptance criterion although the traceability table claims coverage
