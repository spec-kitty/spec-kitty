- id: SPEC-COMPLETE-006
  lens: Coverage
  severity: 3
  title: Risks table promises fixtures that FR-022 and the ACs do not contain
  evidence:
  - artifact: "spec.md \xA7 Risks and Dependencies rows SK-348 and SK-310; FR-022; Edge Cases (review-cycle file in coordination partition, dependency naming no work package, no lanes.json)"
  claim: The SK-348 row says "test a Mission with the record in each place (FR-022)" and the SK-310 row says "fixture with a coordination-topology Mission". FR-022's bullet list has neither. The Edge Cases
    (cycle in the coordination partition or stranded in primary, work package in no lane, no lanes.json, dependency naming no work package, tasks.md absent) are likewise not in FR-022 or any AC. The traceability
    is therefore dishonest for exactly the topology cases the ledger entries warn about, and zero-found-is-[] could mask a resolver that misses the coordination place.
  remediation: Add the two topology fixtures and each Edge Case as explicit FR-022 bullets, with the outcome and the way each fails (for example a cycle file only in the coordination partition must appear,
    not give []; plan.md must be found on a coordination-topology Mission).
  refuter_reason: The SK-348 and SK-310 risk rows cite FR-022 fixtures that FR-022 does not list, and the Edge Cases (coordination-partition cycle, no lanes.json, dangling dependency) have no FR-022 bullet
