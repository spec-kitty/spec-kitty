  - code: src/specify_cli/review/cycle.py:446 build_review_cycle_pointer (validates segments and the review-cycle-N.md filename, raises ReviewCycleError)
  claim: 'FR-005 says feedbackReference is always a non-null string matching the pointer pattern; FR-015 makes it a strict field whose failure is a projection error for non-nullable fields. The builder
    raises when the mission slug, work-package slug or file name fails validation, and AD-13 says a cycle file is never dropped. The three statements conflict for a cycle file with an unusual name or work-package
