- id: SPEC-COMPLETE-007
  lens: Silent-success at the edges
  severity: 3
  title: A corrupt lanes.json and the planning lane have no stated outcome
  evidence:
  - artifact: "spec.md \xA7 FR-006, FR-007, Edge Cases (no lanes.json), AD-4"
  - code: src/specify_cli/lanes/persistence.py:138 read_lanes_json (returns None only when absent, raises CorruptLanesError when present but malformed)
  - code: src/specify_cli/lanes/branch_naming.py:533 lane_branch_name (requires keyword target_branch; returns target_branch for lane-planning)
  claim: The spec defines null for "no lanes.json" only. The real reader distinguishes absence (None) from a corrupt file (raises), precisely to prevent silent fallback; the spec does not say whether a
    corrupt lanes.json yields null laneId (silent success on a broken Mission) or a Problem. Second, lane_branch_name needs a target_branch argument the spec never names as an input, and for the lane-planning
    lane it returns the target branch itself (for example the integration branch), so FR-006's rule "laneBranch is the lane branch name when laneId is non-null" would report the primary branch as a lane
    branch for every single_branch or planning work package; FR-007 covers changeState for "no code lane" but FR-006 does not say laneId/laneBranch for the planning lane.
  remediation: 'State in FR-006: absent lanes.json gives null/null; unparseable lanes.json is a Problem (or an explicit documented null with the cause visible), consistent with AD-4 and FR-020; name target_branch
    (from the lanes manifest or meta.json) as an input; for lane-planning state laneId and laneBranch values explicitly (recommended: laneId is lane-planning, laneBranch null because no lane branch exists).
    Add a fixture for each.'
  refuter_reason: Code check shows read_lanes_json raises CorruptLanesError for a malformed file, and lane_branch_name returns target_branch for lane-planning and requires it as a keyword, none of which
    FR-006 states.
- id: SPEC-COMPLETE-008
  lens: Terminology consistency / Silent-success
  severity: 3
  title: feedbackReference is "always non-null" but its builder raises on invalid segments
  evidence:
