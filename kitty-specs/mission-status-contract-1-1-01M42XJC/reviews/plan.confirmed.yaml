- id: PLAN-VERIFY-001
  lens: leak/redaction and planted negatives
  severity: 4
  title: The raw-text pass of leak_scan flags an at-sign file name, so the planned artifact-path controls
    and any example with such a path go red
  evidence:
  - artifact: "plan.md \xA7 D-P7 (the class replaces the host-path and e-mail scan, edit is in _Scanner.walk\
      \ only)"
  - artifact: "contracts/tool-extension-and-reader.md \xA7 A fixture_builder (control of every artifact-path\
      \ kind holds a name with an at sign) and \xA7 leak_scan.py"
  - code: contracts/tools/leak_scan.py:112-118 (scan_text applies leak_codes(line, HUMAN) to every non-blank
      line of every file, before and independent of the structured walk)
  - code: 'contracts/tools/leak_patterns.py:56-59 (EMAIL_PATTERN); run: leak_codes(''data/icon@2x.png'',
      human) returns (''EMAIL'',)'
  - code: contracts/tools/run_negative_cases.py:160-168 (build_leak control keeps Control.clean.yaml and
      only unlinks the planted file)
  claim: 'The plan changes only the structured walk (_Scanner.walk). scan_text still runs the human patterns,
    including the e-mail pattern, over the raw lines of the same YAML, so a control file (or a contract
    example) holding a path with an at sign is reported as EMAIL in text. Every leak_scan invocation runs
    run_self_test, so CONTROL_FLAGGED would fire on every run of the tool, in the Contracts workflow,
    the negative-tests job and the router tool job. The AD-19 premise (an at-sign name is listed and must
    pass) is therefore not delivered by the planned edit. The same text pass also catches a credential
    in a path, which contradicts AD-19''s accepted-residual statement and the plan wording "instead of
    ... host-path and e-mail".

    '
  remediation: 'State in D-P7 and in A how scan_text treats the artifact-path keys: either carry the odd
    names only in reader-level tests (payload_leaks on built outputs, outside the contracts/ tree) and
    keep at-sign names out of every file under contracts/ including the controls (home/<x>/ segments are
    safe in the text pass, at signs are not), or give scan_text a per-line exemption for lines the structured
    pass attributes to a path key. Add a test that a contract example holding an at-sign path passes leak_scan,
    and say explicitly whether SECRET stays scanned for path values.

    '
- id: PLAN-VERIFY-002
  lens: leak/redaction and planted negatives
  severity: 3
  title: The fixture_builder plant shape cannot express the planned artifact-path plants and controls,
    and the edit list does not say so
  evidence:
  - artifact: "contracts/tool-extension-and-reader.md \xA7 A (artifact path kinds planted into entries:\
      \ [{path: <malformed>}], control holds four odd names)"
  - code: contracts/tools/fixture_builder.py:116-148 (_plant returns one (field, value, codes); build
      writes a flat mapping and sets planted[field_name] = value; _control is one fixed dict)
  - code: contracts/tools/leak_scan.py:177-190 (run_self_test uses build and the CONTROL_FILE / PLANTED_FILE
      subjects)
  claim: 'The plan says KINDS and _plant gain 25 kinds. A flat field/value plant cannot put a value under
    entries[].path or under artifactPath at a nested position, and the control cannot differ per kind.
