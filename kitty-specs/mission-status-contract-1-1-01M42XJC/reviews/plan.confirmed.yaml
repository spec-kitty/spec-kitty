  - artifact: "plan.md \xA7 Charter Check ATDD-first (red on the planning base)"
  - code: contracts/tools/leak_scan.py:112-118 (every line scanned with HUMAN patterns incl. host path,
      e-mail and SECRET)
  - code: contracts/tools/fixture_builder.py:29-38,116-133 (host-path-human, email, github-token, aws-key,
