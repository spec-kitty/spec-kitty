      functions with the repo venv python on every case (A = _matches_any_glob on the
      normalised path, B = _mt_matches_owned_file; expected/A/B), all agree with the spec.
      src/foo/** vs src/foobar/x.py F/F/F; src/foo/** vs src/foo/x.py T/T/T; plain src/foo vs
