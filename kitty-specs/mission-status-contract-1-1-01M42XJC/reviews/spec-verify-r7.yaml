      x.py F/F/F and vs a/x.py T/T/T; a/**/b/**/c vs a/x/b/y/c T/T/T and vs a/b/c F/F/F;
      src/foo/** vs ./src/foo/x.py T/T/T and vs src\foo\x.py T/T/T (after normalising for A);
      src/{a,b}.py vs src/a.py F/F/F and vs the literal src/{a,b}.py T/T/T (both would turn
      the required unknown into a changed). Mutant killability (mutants implemented and
