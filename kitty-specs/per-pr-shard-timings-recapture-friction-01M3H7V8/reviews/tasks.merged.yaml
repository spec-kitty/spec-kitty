    evidence:
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability, row FR-007: \"WP02 | T011, T013, T014 (fixtures 1, 2, 7) | ... fixture 7 (TOCTOU re-check) proves a PR appearing between the initial check and the push still aborts the push\""
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability, row \"Plan ruling: TOCTOU re-check fixture (fixture 7) | WP02 | T015 | `test_toctou_recheck_aborts_push`\" (same table, a few rows below the FR-007 row)"
      - artifact: "tasks.md § Subtask Index: \"T014 | Unit tests for fixtures 1-6 (skip-if-open, unrelated-PR-not-matched, no-drift-no-PR, capture-failure-no-commit, missing-secret-loud-failure x2, drift-triggers-push)\" vs. \"T015 | Unit tests for fixtures 7-11 (toctou-recheck-aborts-push, ...)\""
      - code: "kitty-specs/per-pr-shard-timings-recapture-friction-01M3H7V8/tasks/WP02-recapture-decision-script.md:304-342 (Subtask T014's six numbered fixtures stop at 6, drift-triggers-push) and :343-384 (Subtask T015 opens with \"7. toctou-recheck-aborts-push\")"
    claim: >
      The FR-007 row cites T014 as the subtask delivering fixture 7, but WP02's own Subtask Index and
      full subtask text put fixture 7 (toctou-recheck-aborts-push) in T015, not T014 — and the same
      traceability table directly contradicts itself two rows later by correctly citing T015 for the
