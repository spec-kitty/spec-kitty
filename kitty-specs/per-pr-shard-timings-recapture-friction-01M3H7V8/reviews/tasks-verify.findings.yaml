  - id: TASKS-VERIFY-005
    lens: Mission-derived lens — operator-ruling traceability into WPs
    severity: 1
    title: "FR-007 row's verification text overstates that the pure matcher function itself checks base==main"
    evidence:
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability, row FR-007: \"open-PR matcher returns the PR number only for the fixed head branch\" (and the Ruling row two lines below: \"open-PR matcher checks head==`ci/recapture-charter-shard-timings` AND base==`main`\")"
      - code: "kitty-specs/per-pr-shard-timings-recapture-friction-01M3H7V8/tasks/WP02-recapture-decision-script.md:190-202 (`find_open_recapture_pr(open_prs)` only checks `pr.get(\"headRefName\") == RECAPTURE_BRANCH`; it never inspects a `base`/`baseRefName` field)"
      - code: "kitty-specs/per-pr-shard-timings-recapture-friction-01M3H7V8/tasks/WP02-recapture-decision-script.md:203-209 (the `base main` restriction is applied only by the `gh pr list --head ... --base main --state open` subprocess call that produces `open_prs`, i.e. upstream of the pure matcher)"
    claim: >
      The "Ruling: fixed head branch ... skip-if-open" row states the open-PR matcher itself "checks
      head==... AND base==main", but WP02's `find_open_recapture_pr` (the pure, unit-tested function)
      only checks `headRefName`; the base==`main` restriction is enforced by the `gh pr list --base
      main` query string that supplies the function's input, not by the function's own logic. This is
      a wording overstatement about which component enforces which half of FR-007's match condition —
      the end-to-end behavior is correct, but a reader taking the row literally would expect a `base`
      check inside the pure function's unit tests (fixtures 1/2), which is not what T011/T014 build or
      test.
    remediation: >
      Reword the row to distinguish the two enforcement points, e.g.: "the `gh pr list --base main`
      query restricts candidates to PRs against `main`; `find_open_recapture_pr` then matches on
      `headRefName == ci/recapture-charter-shard-timings` among those results" — so the description
      matches T011's actual function signature and T014's fixture scope (head-only matching).

  - id: TASKS-VERIFY-006
    lens: Mission-derived lens — operator-ruling traceability into WPs
    severity: 1
    title: "Traceability table claims full ruling coverage but omits PLAN-FRESH2-003/004/005/006"
    evidence:
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability (header prose): \"Every FR in spec.md, every NFR, every Constraint, and every operator ruling point is mapped below to a concrete WP task with a concrete test\""
      - artifact: "reviews/plan.ruling.md, \"Plan HALT ruling\" points 3-6 (PLAN-FRESH2-003 through PLAN-FRESH2-006), none of which appear as a row in tasks.md's traceability table (only PLAN-FRESH2-001 and PLAN-FRESH2-002 have rows)"
      - artifact: "plan.md item (b) TOCTOU paragraph (cites spec.md Key Entities' three-step sequence directly, resolving PLAN-FRESH2-003), item (d)'s explicit fixture-tested/code-shape-inspection split (resolving PLAN-FRESH2-005), and the \"accepted-residual-cost\" paragraph naming the external-actor race source (resolving PLAN-FRESH2-006) — confirming these three are already fully resolved in plan.md's own prose, with no separate code-landing task required"
    claim: >
      The traceability table's own header asserts it maps "every operator ruling point," but
      PLAN-FRESH2-003, -004, -005, and -006 have no row. Independently checking plan.md confirms these
      four are in fact resolved (as plan-phase prose fixes, not as an implementation requirement), so
      there is no missing WP/test coverage — but the table's completeness claim is inaccurate as
      stated, and a reviewer relying on the table alone (rather than re-reading plan.md) cannot
      confirm those four rulings were addressed without doing the cross-check this review just did.
    remediation: >
      Either add four rows noting "PLAN-FRESH2-003/004/005/006 — resolved in plan.md's own prose at
      [phase], no code-landing WP required" or narrow the header sentence to state it maps every
      ruling point that has a code-facing consequence, so the claim matches what the table actually
      contains.
