findings:
  - id: TASKS-VERIFY-001
    lens: Per-AC test strategy concrete
    severity: 2
    title: "FR-001 traceability row cites T003 for a test that T004 actually adds"
    evidence:
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability, row FR-001: \"WP01 | T003, T007 | `test_charter_disposition_flags_length_disagreement`, `test_charter_is_not_allowlisted_and_agrees_xfails_on_disagreement`\""
      - artifact: "tasks.md § Subtask Index: T003 = \"Demote `test_charter_is_not_allowlisted_and_agrees` to use the helper + `pytest.xfail`\" (no test added); T004 = \"Add `test_charter_disposition_flags_length_disagreement`\""
      - code: "kitty-specs/per-pr-shard-timings-recapture-friction-01M3H7V8/tasks/WP01-demote-charter-length-assertion.md:203-221 (Subtask T004 is the one that adds `test_charter_disposition_flags_length_disagreement`; Subtask T003 at lines 182-201 only demotes the assertion and adds no test)"
    claim: >
      The FR-001 row's Task(s) column lists "T003, T007" but the first test it names
      (`test_charter_disposition_flags_length_disagreement`) is delivered by T004, not T003 — T003 is
      the pure implementation edit (no test of its own). The table therefore misattributes which
      subtask actually produces the cited verification artifact, even though T004 exists and will be
      executed anyway (WP01 subtasks are sequential, T001-T008 all run), so no wrong implementation
      results — but a reviewer checking "did T003 deliver this test" against the WP file would find
      it does not.
    remediation: >
      Change the FR-001 row's Task(s) column to "T004, T007" (or "T003, T004, T007" if T003's role as
      the underlying implementation edit should stay listed), matching the Subtask Index's own
      T003/T004 split.

  - id: TASKS-VERIFY-002
    lens: Per-AC test strategy concrete
    severity: 3
    title: "FR-007 row misattributes fixture 7 (TOCTOU re-check) to T014; a later row in the same table correctly attributes it to T015"
    evidence:
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability, row FR-007: \"WP02 | T011, T013, T014 (fixtures 1, 2, 7) | ... fixture 7 (TOCTOU re-check) proves a PR appearing between the initial check and the push still aborts the push\""
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability, row \"Plan ruling: TOCTOU re-check fixture (fixture 7) | WP02 | T015 | `test_toctou_recheck_aborts_push`\" (same table, a few rows below the FR-007 row)"
      - artifact: "tasks.md § Subtask Index: \"T014 | Unit tests for fixtures 1-6 (skip-if-open, unrelated-PR-not-matched, no-drift-no-PR, capture-failure-no-commit, missing-secret-loud-failure x2, drift-triggers-push)\" vs. \"T015 | Unit tests for fixtures 7-11 (toctou-recheck-aborts-push, ...)\""
      - code: "kitty-specs/per-pr-shard-timings-recapture-friction-01M3H7V8/tasks/WP02-recapture-decision-script.md:304-342 (Subtask T014's six numbered fixtures stop at 6, drift-triggers-push) and :343-384 (Subtask T015 opens with \"7. toctou-recheck-aborts-push\")"
    claim: >
      The FR-007 row cites T014 as the subtask delivering fixture 7, but WP02's own Subtask Index and
      full subtask text put fixture 7 (toctou-recheck-aborts-push) in T015, not T014 — and the same
      traceability table directly contradicts itself two rows later by correctly citing T015 for the
      identical fixture under the "Plan ruling: TOCTOU re-check fixture" row. This is an internal
      inconsistency within tasks.md's own traceability table, not merely a mismatch against the WP
      file, so a verifier cross-checking FR-007 coverage against "T014" would not find fixture 7 there
      and could wrongly conclude the fixture is missing or double-counted.
    remediation: >
      Change the FR-007 row's Task(s) column to "T011, T013, T014 (fixtures 1, 2), T015 (fixture 7)"
      so it matches both the Subtask Index and the correct citation already present in the
      "Plan ruling: TOCTOU re-check fixture" row of the same table.

  - id: TASKS-VERIFY-003
    lens: Per-AC test strategy concrete
    severity: 2
    title: "FR-008 row misattributes fixture 4 (capture-failure-no-commit) to T015; it is actually T014's fourth fixture"
    evidence:
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability, row FR-008: \"WP02 | T009, T015 (fixtures 4, 8, 9, 10) | ... fixtures 4/8/9 prove mechanism-crash aborts before commit/push/PR-open; fixture 10 proves an ordinary non-zero `pytest_exit_code` ... proceeds to the drift check\""
      - artifact: "tasks.md § Subtask Index: \"T014 | Unit tests for fixtures 1-6 (skip-if-open, unrelated-PR-not-matched, no-drift-no-PR, capture-failure-no-commit, missing-secret-loud-failure x2, drift-triggers-push)\""
      - code: "kitty-specs/per-pr-shard-timings-recapture-friction-01M3H7V8/tasks/WP02-recapture-decision-script.md:321-323 (Subtask T014, numbered item 4: \"capture-failure-no-commit: a fake `capture_main` callable that raises a plain `Exception`...\")"
    claim: >
      Fixture 4 (capture-failure-no-commit) is T014's fourth numbered fixture, not part of T015
      (which covers fixtures 7-11). The FR-008 row's "T015 (fixtures 4, 8, 9, 10)" citation is wrong
      for fixture 4 specifically; fixtures 8, 9, 10 are correctly in T015. All four fixtures still get
      implemented regardless (T009-T015 are all WP02 subtasks), so this does not change what gets
      built, but it misdirects a reviewer verifying FR-008's coverage against the named subtask.
    remediation: >
      Change the FR-008 row's Task(s) column to "T009, T014 (fixture 4), T015 (fixtures 8, 9, 10)".

  - id: TASKS-VERIFY-004
    lens: Per-AC test strategy concrete
    severity: 2
    title: "NFR-001 row cites T017 for the PR-body statement; that text is actually written by T019"
    evidence:
      - artifact: "tasks.md § FR/NFR/Constraint/Ruling traceability, row NFR-001: \"WP01, WP03 | T003 (code shape), T017 (PR-body statement) | `module-tests.yml`'s uniform-weight fallback verified by inspection ...; WP03's PR-body note states this explicitly\""
      - code: "kitty-specs/per-pr-shard-timings-recapture-friction-01M3H7V8/tasks/WP03-scheduled-workflow-wiring.md:181-197 (Subtask T017, \"Verify workflow shape against plan.md's verbatim decisions\" — a 7-point YAML-shape checklist: trigger, concurrency group, permissions, checkout token, timeout-minutes, runs-on, SHA-pinning; no mention of NFR-001 or a PR-body note anywhere in T017's text)"
      - code: "kitty-specs/per-pr-shard-timings-recapture-friction-01M3H7V8/tasks/WP03-scheduled-workflow-wiring.md:217-246 (Subtask T019, step 3: \"Add a note to the PR body stating NFR-001's claim explicitly ... this demotion does not risk masking a test-coverage or correctness regression ...\")"
    claim: >
      T017 is a structural self-check of the workflow YAML's shape (trigger/concurrency/permissions/
      checkout-token/timeout/runner/SHA-pinning) and contains no PR-body-drafting step at all. The
      NFR-001 PR-body statement the traceability row describes is written in T019 (step 3), not T017.
      The row cites the wrong subtask for the half of NFR-001's verification it attributes to WP03.
    remediation: >
