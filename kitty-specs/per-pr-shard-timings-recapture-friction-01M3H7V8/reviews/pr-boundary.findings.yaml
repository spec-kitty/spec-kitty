profile_directives_applied:
  - "DIRECTIVE_044 (Canonical Sources and Unification) — used to identify that tests/release/pinning_rule_inventory.json is a DERIVED artifact with one canonical producer (scripts/ci/derive_pinning_inventory.py) and that this mission's diff drifted it out of sync with that producer without regenerating it."
