schema: review-verify/v1
complete: true
phase: pr
profile_directives_applied:
  - "reviewer-renata: 030 Test and Typecheck Quality Gate (re-ran every cited gate/test
      command myself against the current HEAD; did not accept the fixer's or the
      refuter's write-up as evidence)"
  - "reviewer-renata: 041 Tests as Scaffold, Not Friction / test-scaffolding-as-design-smell
      (checked that the two rescued strict-mode tests now isolate the environment rather
      than being weakened or deleted, and that the new GITHUB_TOKEN-fallback test is a
      real red-first regression guard, not a restated assertion)"
  - "reviewer-renata: code-review-incremental / reverse-speccing (read the diffs and
      reconstructed each fix's contract from the code before checking it against the
      finding, rather than trusting commit messages)"
  - "reviewer-renata: anti-laziness stance (empirically reproduced every empirical claim:
      pytest runs, a fresh script re-derivation, and a live scratch-worktree fault
      injection, instead of accepting that a fix 'looks right')"
results:
  - id: pr-boundary-001
    status: resolved
    reason: The derived inventory was regenerated by its own script (byte-identical to a
      fresh --stdout re-derivation), the diff touches only "lines" line-number arrays with
      no hand-edited content, and the freshness test now passes.
    evidence:
      - command: ".venv/bin/python -m pytest tests/release/test_pinning_inventory_fresh.py -q"
        outcome: "5 passed"
      - command: "git diff d3169133b HEAD -- tests/release/pinning_rule_inventory.json"
        outcome: "every changed line is a numeric value inside a `lines:` array (verified
          via grep filtering out array-only integer lines); no other field/content changed"
      - command: ".venv/bin/python scripts/ci/derive_pinning_inventory.py --check"
        outcome: "exit 0 (fresh vs. committed agree)"
      - command: ".venv/bin/python scripts/ci/derive_pinning_inventory.py --stdout > /tmp/derived.json && diff /tmp/derived.json tests/release/pinning_rule_inventory.json"
        outcome: "no diff -- committed file is byte-identical to a fresh re-derivation, not
          hand-edited"
  - id: pr-boundary-002
    status: resolved
    reason: The two new WP01 tests now monkeypatch.delenv the strict-mode env var before
      calling the production gate functions, so the strict job fails only on the two real
      charter/agent drift gates and the file is fully green without the strict flag.
    evidence:
      - command: "SPEC_KITTY_STRICT_SHARD_TIMINGS=1 .venv/bin/python -m pytest tests/architectural/test_module_length_agreement.py -q"
        outcome: "2 failed, 17 passed -- both failures are
          test_non_allowlisted_modules_agree_with_live_collection and
          test_charter_is_not_allowlisted_and_agrees (the real drift gates); the two
          formerly-broken warning-emission tests now pass"
      - command: ".venv/bin/python -m pytest tests/architectural/test_module_length_agreement.py -q"
        outcome: "19 passed, 2 warnings (fully green without the strict env var)"
      - note: "confirmed commit 0e8e7ad9a adds monkeypatch.delenv(_STRICT_ENV_VAR,
          raising=False) to both
          test_charter_disagreement_emits_shard_timings_drift_warning and
          test_non_allowlisted_disagreement_emits_shard_timings_drift_warning"
  - id: pr-contract-001
    status: resolved
    reason: "A non-list gh JSON payload and a non-int PR number field both now raise
      SystemExit(1) with an ::error:: message instead of silently coercing to []/None, and
      each branch has a dedicated red-first test."
    evidence:
      - code: "scripts/ci/recapture_charter_shard_timings.py:236-246
          (_list_open_recapture_prs) and :140-149 (find_open_recapture_pr) -- both raise
          SystemExit(1) with an ::error:: message on the malformed-shape branch"
      - command: ".venv/bin/python -m pytest tests/ci/test_recapture_charter_shard_timings.py -q"
        outcome: "39 passed, including
          test_list_open_recapture_prs_raises_loudly_for_non_list_payload and
          test_find_open_recapture_pr_raises_loudly_for_non_int_number"
      - command: ".venv/bin/ruff check --select C901 scripts/ci/recapture_charter_shard_timings.py"
        outcome: "All checks passed! (every function stays <=15 complexity)"
  - id: pr-contract-002
    status: resolved
    reason: All five gh/git subprocess call sites (gh pr list, git add, git commit, git
      push, gh pr create) now route through _run_subprocess_or_die, which converts
      CalledProcessError into an ::error::-prefixed SystemExit(1) naming the failed step,
      and both call sites are covered by a dedicated failure test.
    evidence:
      - code: "scripts/ci/recapture_charter_shard_timings.py:185-203 (_run_subprocess_or_die
          helper) used by _list_open_recapture_prs (:215) and all four calls inside
          _push_and_open_pr (:277,278,292,299)"
      - command: ".venv/bin/python -m pytest tests/ci/test_recapture_charter_shard_timings.py -q"
        outcome: "39 passed, including
          test_list_open_recapture_prs_fails_loudly_on_subprocess_error and
          test_push_and_open_pr_fails_loudly_on_subprocess_error, both asserting
          '::error::' in stderr and a non-zero SystemExit rather than a raw traceback"
  - id: pr-tests-001
    status: resolved
    reason: A new test (parametrized) and an extended end-to-end fixture now assert
      require_recapture_token() ignores an ambient GITHUB_TOKEN; empirically confirmed by
      injecting the exact forbidden fallback in an isolated scratch worktree and observing
      the new coverage go red.
    evidence:
      - action: "git worktree add ../5189-verify-scratch HEAD (outside the reviewed repo
          directory), then edited only the scratch copy of
          scripts/ci/recapture_charter_shard_timings.py to add `or
          os.environ.get(\"GITHUB_TOKEN\")` to require_recapture_token()'s lookup"
      - command: ".venv/bin/python -m pytest <scratch>/tests/ci/test_recapture_charter_shard_timings.py -q (unmodified scratch, sanity baseline)"
        outcome: "39 passed"
      - command: ".venv/bin/python -m pytest <scratch>/tests/ci/test_recapture_charter_shard_timings.py -q -p no:cacheprovider (after injecting the fallback)"
        outcome: "3 failed, 36 passed -- failures are exactly
          test_require_recapture_token_ignores_github_token_fallback[distinct-value] and
          both parametrizations of
          test_fixture5_missing_secret_fails_loud_before_any_recapture_work, proving the
          scratch (modified) module was the one imported and that the new coverage catches
          the regression"
      - action: "git worktree remove --force ../5189-verify-scratch (cleaned up
          immediately after)"
