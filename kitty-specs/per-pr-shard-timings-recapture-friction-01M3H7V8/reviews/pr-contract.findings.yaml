findings:
  - id: pr-contract-001
    lens: "Silent success"
    severity: 3
    title: "Unexpected gh JSON shape for the open-PR check is silently treated as 'no PR open', not surfaced or tested"
    evidence:
      - artifact: "spec.md FR-007 / Key Entities (open-PR detection is the sole gate before a force-push)"
      - code: "scripts/ci/recapture_charter_shard_timings.py:205 (`return parsed if isinstance(parsed, list) else []`)"
      - code: "scripts/ci/recapture_charter_shard_timings.py:130-138 (`find_open_recapture_pr`: `number if isinstance(number, int) else None`)"
    claim: >
      If `gh pr list --json number,headRefName` ever exits 0 but returns a JSON payload whose
      top level is not a list (e.g. an object, or a schema change), `_list_open_recapture_prs`
      silently coerces it to `[]` rather than failing loudly. `find_open_recapture_pr` applies the
      same silent-coercion pattern to a malformed `number` field, returning `None` (i.e. "no match")
      instead of raising. Both branches feed directly into FR-007's "is a recapture PR already
      open" decision -- the one gate standing between this workflow and a `git push --force` to the
      fixed branch. A malformed/unexpected response is indistinguishable, downstream, from a
      genuine "no open PR" answer, so the workflow could proceed to force-push in a state where the
      true answer to "is a PR open" was actually unknown, not "no". Neither branch has a unit test
      (`tests/ci/test_recapture_charter_shard_timings.py` covers only well-formed lists/ints), so a
      future refactor that reintroduces or widens this silent path would not be caught red-first,
      contrary to the reviewer profile's `041`/`test-scaffolding-as-design-smell` expectation that
      every decision branch of a gating function carry a fixture.
    remediation: >
      Raise (e.g. `RuntimeError`/`SystemExit` with an `::error::`-prefixed message, mirroring
      `require_recapture_token`'s own convention) when the parsed `gh pr list` payload is not a
      list, or when an entry's `number` field is present but not an int, instead of silently
      falling back to an empty result / `None`. Add a unit test asserting the loud failure for each
      case, alongside the existing fixture-1/2 coverage for the well-formed paths.
  - id: pr-contract-002
    lens: "Silent success"
    severity: 2
    title: "gh/git subprocess failures in the open-PR-check and push/PR-open edge functions surface as raw CalledProcessError tracebacks, not the script's own ::error:: convention"
    evidence:
      - code: "scripts/ci/recapture_charter_shard_timings.py:183-203 (`_list_open_recapture_prs`, `subprocess.run(..., check=True)`, no try/except)"
      - code: "scripts/ci/recapture_charter_shard_timings.py:236-276 (`_push_and_open_pr`, four `subprocess.run(..., check=True)` calls, no try/except)"
      - code: "scripts/ci/recapture_charter_shard_timings.py:148 (require_recapture_token's own `::error::`-prefixed message) / :314 (run_capture_or_die caller's `::error::` message in main())"
    claim: >
      A genuine `gh`/`git` failure at these two call sites (auth expiry, rate limit, transient
      network error, a rejected force-push) is not silent -- `check=True` raises
      `subprocess.CalledProcessError` uncaught, which does fail the job -- but it surfaces as a bare
      Python traceback rather than the `::error::`-annotated, job-summary-visible message the
      script uses everywhere else for its own defined failure modes (missing secret, mechanism
      crash). This is a minor inconsistency in observability, not a correctness defect, and no
      fixture in the required list (item (c), fixtures 1-11) calls for covering it, but it leaves
      one class of real-world failure (gh/git transport errors) without the loud, named diagnostic
      the rest of the script deliberately provides.
    remediation: >
      Wrap the `gh pr list` / `git add` / `git commit` / `git push` / `gh pr create` subprocess
      calls in a thin try/except that re-raises with an `::error::`-prefixed message naming which
      step failed (never the token value), for parity with `require_recapture_token`'s and
      `run_capture_or_die`'s existing diagnostic convention. Optional polish, not blocking.
