  - id: PLAN-VERIFY-001
    lens: Revert discipline (catalog verify lens)
    severity: 4
    title: >-
      The two "reversion-catching" fast tests for FR-001/FR-004 only pin the extracted
      helper's own correctness, not that the actual test body calls it
    evidence:
      - artifact: "plan.md § (d) Red-first fixtures per changed behaviour, lines 344-356"
      - code: "tests/architectural/test_module_length_agreement.py:329-344 (test_charter_is_not_allowlisted_and_agrees, current hard-assert body)"
    claim: >-
      plan.md's two new tests (`test_charter_disposition_flags_length_disagreement`,
      `test_charter_disposition_is_none_on_agreement`) call the pure helper `_charter_disposition`
      directly. plan.md claims these tests "fail if the demotion is ever reverted" — true only for
      the narrower revert where the helper itself is deleted. If someone instead restores
      `test_charter_is_not_allowlisted_and_agrees`'s body to a bare hard `assert` while leaving the
      now-orphaned helper and its two unit tests untouched, both new tests still pass, because
      neither exercises the production test body itself. A classic
      test-the-helper-not-the-integration-point gap.
    remediation: >-
      Add a fixture that exercises `test_charter_is_not_allowlisted_and_agrees` itself under a
      disagreeing committed/collected pair (e.g. via monkeypatching or calling the test function
      directly and asserting it raises the `xfail` outcome, not a bare `AssertionError`), so a revert
      of the consuming line is caught independent of the helper's own survival.

  - id: PLAN-VERIFY-002
    lens: "Mission-derived: test-fixture completeness against spec.md falsifiability bars (FR-006)"
    severity: 4
    title: >-
      FR-006 requires both a drift-triggers-PR fixture and a no-drift-no-PR fixture; plan.md's item (c)
      only specifies the latter
    evidence:
      - artifact: "spec.md FR-006 row, 'No-op passable?' column: 'requires a fixture proving both the drift case (length disagrees -> PR opened) and the no-drift case'"
      - artifact: "plan.md § (c) Required fixtures, item 3 ('no-drift-no-PR'), lines 250-252"
    claim: >-
      spec.md's falsifiability bar for FR-006 names two required fixtures; plan.md's item (c) lists
      exactly 5 fixtures, and only fixture 3 ("no-drift-no-PR") covers the negative half. No fixture
      anywhere in plan.md asserts the positive path — that when `has_drift` returns `True`, the
      orchestration DOES invoke the commit/push/PR-open call. Every orchestration-path assertion
      named is phrased as "performs no ... call." The drift-triggers-a-PR path is the actual
      deliverable of User Story 2 / SC-003, and it is left completely unverified by the plan's own
      test list.
    remediation: >-
      Add a sixth required fixture, "drift-triggers-push": `has_drift(before_length=N,
      after_length=M)` with N != M returns `True`, and the orchestration path that consumes a `True`
      result DOES invoke the commit/push/PR-open callable exactly once (via the same fake
      "would-push" callable pattern, asserting it IS called with expected arguments).

  - id: PLAN-VERIFY-003
    lens: "Mission-derived: test-fixture completeness against spec.md falsifiability bars (FR-004)"
    severity: 3
    title: >-
      FR-004's infra-break fixture only covers "missing artefact" via `_load_timings()`; the
      "live-collection crash" half of the same falsifiability requirement is neither fixtured nor
      explicitly defended as out of scope
    evidence:
      - artifact: "spec.md FR-004 row, 'No-op passable?' column: 'a genuine infrastructure/collection break (missing timings/registry artefact, live-collection crash) fails/errors visibly'"
      - artifact: "spec.md User Story 3, Acceptance Scenario 3"
      - artifact: "plan.md § (d), fixture 3, lines 357-363 (test_load_timings_fails_loudly_when_artefact_missing)"
      - code: "tests/architectural/test_module_length_agreement.py:229-251 (_live_collected_count: pytest.fail on subprocess rc not in (0, 1) or empty node_ids)"
    claim: >-
      spec.md names two concrete infra-break sub-cases: a missing artefact OR a live-collection
      crash. plan.md's item (d) adds exactly one new test, covering only the missing-artefact case.
      The live-collection-crash case has its own pre-existing mechanism (`_live_collected_count()`,
      line 229) but plan.md adds no fixture exercising it and gives no rationale for treating one
      fixture as representative of both sub-cases.
    remediation: >-
      Either (a) add a fourth fast test that monkeypatches `subprocess.run` (or otherwise forces the
      collect-only invocation to fail) so `_live_collected_count()` raises via `pytest.fail`, proving
      the live-collection-crash sub-case is independently exercised; or (b) state explicitly in
      plan.md item (d) the judgment that the missing-artefact fixture is representative of both
      sub-cases (both call `pytest.fail` at the session-scoped-fixture level) and why.
