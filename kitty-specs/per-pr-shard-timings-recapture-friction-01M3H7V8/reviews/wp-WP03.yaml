feedback:
  - id: WP03-C1-001
    severity: 4
    claim: >-
      reviews/implement.ruling.md (orchestrator, 2026-09-28) explicitly ruled that WP03's write
      scope widens to add a registration entry in every closed registry that enumerates
      .github/workflows/, "one entry per registry ... mirroring the existing
      ci-stale-running-sweep.yml entries", and that shipping without them "turns the PR's
      architectural-heavy check red." The actual diff (472616135..lane-c) touches only
      .github/workflows/ci-charter-shard-recapture.yml and
      docs/development/reference/known-friction-points.md — it does not touch
      tests/architectural/test_no_duplicate_suite_execution.py's NON_CHANGE_TRIGGERED_WORKFLOWS
      dict (line 202) or tests/architectural/_gate_coverage.py's WORKFLOW_FILES tuple (lines
      118-131). Reproduced live from the lane
      (.venv/bin/python -m pytest
      tests/architectural/test_no_duplicate_suite_execution.py
      tests/architectural/test_workflow_coherence.py -q): both named tests fail with exactly the
      predicted diff (extra item 'ci-charter-shard-recapture.yml' in both cases). No other
      workflow-enumerating registry among the ones checked (test_coverage_artefact_contract,
      test_dual_mode_contract, test_module_shard_registry, test_same_tier_uniqueness,
      test_suite_jobs_gate_blocking, test_ci_collection_completeness, test_module_tests_matrix,
      test_ci_router_transcription_guards, test_gate_selection_authority,
      test_pinning_inventory_fresh, ci-module-registry.yml's glob-based 'ci' module roots) needs
      an entry — confirmed by running each specifically and by inspecting how each reads its
      registry (closed-list literal vs. real on-disk glob).
    remediation: >-
      Add "ci-charter-shard-recapture.yml": "<reason: schedule + workflow_dispatch only, no
      pull_request/push trigger>" to NON_CHANGE_TRIGGERED_WORKFLOWS in
      tests/architectural/test_no_duplicate_suite_execution.py (mirroring the
      ci-stale-running-sweep.yml entry's shape), and add "ci-charter-shard-recapture.yml" to the
      WORKFLOW_FILES tuple in tests/architectural/_gate_coverage.py so
      discover_pytest_workflows() and the model agree; then re-run both named tests plus
      test_suite_jobs_gate_blocking.py (which also parses WORKFLOW_FILES) to confirm the new
      entry's gate is classified correctly (its strict-mode pytest invocation of
      tests/architectural/test_module_length_agreement.py) without tripping a duplicate-gate
      finding, since implement.ruling.md places this registration inside WP03's own widened
      scope rather than deferring it.
