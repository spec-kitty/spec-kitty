#     the disjunction rests on a GitHub branch-protection mechanism that
#     cannot actually be scoped the way the FR text claims (SPEC-FRESH5-001).
#   - 5-Whys/Ishikawa (The Cartographer): asked why the Edge Cases entries
#     before this round all cite a covering FR while the new stale-review-
#     thread bullet does not, to confirm SPEC-FRESH5-003 is a genuinely new
