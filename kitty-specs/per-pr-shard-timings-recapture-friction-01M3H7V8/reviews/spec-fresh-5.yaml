# Directive-references applied: 001 (Architectural Integrity Standard --
# checked FR-012's branch-protection mechanism against how GitHub branch
# protection actually scopes, a structural/boundary fact, not just the
# prose); 003 (Decision Documentation Requirement -- confirmed
# SPEC-FRESH3-001/002 and SPEC-FRESH4-001..005 are genuinely closed per
# reviews/spec.ruling.md and tracer-design-decisions.md before treating any
# adjacent text as fair game, per the dispatch's do-not-relitigate scope);
# 032 (Conceptual Alignment -- FR-012/AS7 vs. actual GitHub branch-protection
# semantics; Charter Tension item 1's FR range vs. item 5's FR range).
# Tactic applied: review-intent-and-risk-first (evaluated FR-012's intent --
# "force-update review state is never silent" -- against the real-world risk
# that its (a) branch requires a repo-wide branch-protection change outside
