#     job-vs-human, and are complementary, not reported).
#   - Bisection/timeline (The Bisector): `git diff HEAD` was read as a
#     before/after bisection isolating exactly the round-4/round-5 additions
#     (FR-011, FR-012, the new Edge Case bullet, SC-007) from the unchanged
#     text they now must stay consistent with.
#   - Divergence matrix (The Matrix-Maker): cross-checked FR-011/FR-012/the
#     new Edge Case/SC-007 against Charter Tension, Key Entities, C-001/C-006,
#     and the Acceptance Scenarios cell-by-cell for drift the new text left
#     behind (surfaced SPEC-FRESH5-002).
#   - Trace-based observability (The Stenographer): treated the spec's own
#     "never silent" / falsifiable-fixture theme as the evidentiary trace to
