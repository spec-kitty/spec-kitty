findings:
  - id: pr-tests-001
    lens: revert-passes / regression-detection (candidate break list)
    severity: 4
    title: No test proves require_recapture_token() ignores an ambient GITHUB_TOKEN -- the
      exact anti-pattern CL-002/FR-005 exist to forbid is a silently unguarded regression
    evidence:
      - code: "scripts/ci/recapture_charter_shard_timings.py:141-150 (require_recapture_token)"
      - code: "tests/ci/test_recapture_charter_shard_timings.py:107-118 (the only two tests of
          require_recapture_token: test_require_recapture_token_returns_value_when_set and
          test_require_recapture_token_raises_for_empty_or_unset, both of which only
          setenv/delenv CHARTER_SHARD_RECAPTURE_TOKEN -- neither ever sets GITHUB_TOKEN)"
      - code: "tests/ci/test_recapture_charter_shard_timings.py:41-45 (_set_token helper --
          touches only SECRET_NAME, never GITHUB_TOKEN)"
    claim: >
      CL-002/FR-005's whole reason to exist is "never silently fall back to the default
      GITHUB_TOKEN" -- a fallback would silently defeat the anti-recursion protection the mission
      exists to add (a GITHUB_TOKEN-authored PR does not trigger other workflows' pull_request
      events). require_recapture_token() today correctly does NOT fall back -- but I edited it in
      an isolated scratch worktree to add exactly that fallback
      (`os.environ.get(SECRET_NAME) or os.environ.get("GITHUB_TOKEN")`) and reran
      tests/ci/test_recapture_charter_shard_timings.py: all 33 tests still passed. No fixture in
      the file ever sets GITHUB_TOKEN while leaving CHARTER_SHARD_RECAPTURE_TOKEN unset/empty, so
      the single most safety-critical property in the whole WP02 module (FR-005's own acceptance
      scenario 4 / spec.md CL-002) has zero regression coverage. This is precisely the class of
      defect Standing Order #4 (red-first) and Standing Order #5 (a gate cannot self-validate)
      warn about: the code is currently correct, but nothing would turn red if a future edit
      reintroduced the fallback GitHub's own docs describe as the standard (and wrong-for-this-
      case) pattern.
    remediation: >
      Add a fixture to tests/ci/test_recapture_charter_shard_timings.py, e.g.
      test_require_recapture_token_ignores_github_token_fallback(monkeypatch): delenv
      CHARTER_SHARD_RECAPTURE_TOKEN, setenv GITHUB_TOKEN to a distinct fake value, and assert
      require_recapture_token() still raises SystemExit (not that it returns the GITHUB_TOKEN
      value). Extend the same monkeypatch into
      test_fixture5_missing_secret_fails_loud_before_any_recapture_work so the end-to-end main()
      path is covered too, not just the unit-level helper.
