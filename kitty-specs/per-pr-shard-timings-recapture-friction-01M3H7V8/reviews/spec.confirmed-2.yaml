findings:
  - id: SPEC-GOV-001
    origin: spec-verify.yaml (unresolved carry-over)
    lens: "Standing Order #5 fidelity — allowlist headcount sweep, missed instance"
    severity: 2   # per R5a's remaining_severity (down from the original 4; most instances were fixed)
    title: "CL-003 (spec.md line 48) still says 'the other 20 modules tracked by ledger entry SK-247' — the one unquoted, present-tense '20' claim the round-1 sweep missed"
    evidence:
      - artifact: "spec.md § CL-003 (line 48), the unquoted sentence \"The other 20 modules tracked by ledger entry SK-247 (the operator's cross-mission ledger...) stay out of scope\" — distinct from the adjacent verbatim SK-247 quote (\"20 of 21 modules\") which is correctly left as historical framing"
      - artifact: "spec.md § Non-Goals bullet (already fixed to name 19 modules) — CL-003's unquoted '20' now contradicts it"
      - code: "tests/architectural/test_module_length_agreement.py:98-117 (`_MISMATCH_ALLOWLIST` — 19 live keys, re-confirmed by R5a)"
    claim: >
      Round 1's fix correctly swept FR-003, FR-009, C-001, SC-006, the Non-Goals bullet, the
      Ledger Cross-Reference closing sentence, User Story 1 AS2, the Key Entities bullet, and
      Charter Tension from "20" to "19" — but missed CL-003's own unquoted, present-tense "the
      other 20 modules ... stay out of scope" sentence. This is the identical defect class the
