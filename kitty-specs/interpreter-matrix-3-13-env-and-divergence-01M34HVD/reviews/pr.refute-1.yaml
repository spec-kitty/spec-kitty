verdicts:
  - id: pr-merged-001
    verdict: confirmed
    reason: Collection fact reproduced independently and the class runs fast when interpreters are already cached, but the mechanism (real subprocess uv sync/run against a differently-versioned scratch venv, unguarded by any skip for missing interpreter/network) is a real fast-tier-purity and flakiness hazard in the nightly gate, not merely a theoretical one.
    evidence: "Ran `.venv/bin/python -m pytest tests/upgrade/test_migration_robustness.py -m \"fast or unit\" -k TestVenvCorruptionHazardFR003b --collect-only -q` -> exactly 4 test IDs collected (5 deselected), matching the finding's count. Ran the same selection for real: `4 passed, 5 deselected in 6.67s` (real 7.875s) -- confirms the tests DO get pulled in and are cheap ONLY because Python 3.11/3.12/3.13 happen to already be uv-managed-cached on this box (`uv python list` showed cpython-3.12.13 and cpython-3.11.15 already present under ~/.local/share/uv/python). `grep -rn 'fast or unit' --include=*.yml .github/workflows` confirms ci-nightly.yml:224 is the only CI consumer of that selector."
    severity_note: "The measured ~7s wall-clock cost does NOT by itself justify a 45-minute-budget-driven sev 4 -- on this evidence alone the time-cost case supports something closer to sev 2-3. The stronger basis for keeping it high is un-gated: whether GitHub's ubuntu-latest runner has a Python 3.12 interpreter already resolvable by uv (no fetch) is NOT knowable without running on that runner, which I did not do per the explicit no-network-fetch instruction, so it is left unverified. If the runner lacks 3.12 and uv must fetch it, the `sync.returncode == 0` assertion in `test_a_well_pinned_nested_uv_run_leaves_a_dedicated_venv_untouched`/`test_named_call_site_argv_does_not_rebuild_a_mismatched_dedicated_venv` has no skip/guard, so a network hiccup would turn an ostensibly 'fast' test red in the nightly gate -- that flakiness/tier-purity risk, not the raw seconds, is what supports keeping severity elevated; sev 4 'blocks merge' is a defensible but not slam-dunk call on the evidence I could gather."
  - id: pr-merged-002
    verdict: confirmed
    reason: xdist 3.8.0's own source confirms bare `-n auto` (no --dist) resolves to `dist=load`, not `loadfile`, and the repo's testing doc states a blanket, unscoped policy ("We always use loadfile ... CI uses loadfile for the same reason"), which ci-nightly.yml:224 violates.
    evidence: "`grep -n 'config.option.dist\\|config.option.numprocesses' .venv313/lib/python3.13/site-packages/xdist/plugin.py` -> lines 318-320: `if config.option.numprocesses: if config.option.dist == \"no\": config.option.dist = \"load\"` -- confirms the fallback is `load`, matching the finding exactly. `.venv313/bin/python -c 'import xdist; print(xdist.__version__)'` -> 3.8.0, matching cited version. Read docs/development/testing/testing-parallel.md lines 40-50: 'We always use `loadfile`' / '`load` ... breaks file-scoped fixtures and any test that relies on collection order' -- unscoped, not narrowed to make test-fast/test-full only. Makefile:52 and Makefile:66 both independently pass `--dist loadfile` alongside `-n auto`, confirming consistent repo-wide practice that ci-nightly.yml:224 alone omits. `grep -rl 'scope=\"module\"\\|scope=\"class\"' tests/` -> 64 files, so file-scoped fixture reliance is real and widespread, not theoretical, across the same fast/unit population the nightly job selects."
  - id: pr-merged-003
    verdict: confirmed
    reason: Read both extractors side by side -- the sibling in tests/ci/test_interpreter_matrix_env_pinning.py asserts uniqueness explicitly; the AST helper in test_migration_robustness.py returns on the first structural match with no such assertion, so the asymmetry is real, and the helper is invoked against source files outside this WP's own ownership where a future second matching call is plausible.
    evidence: "tests/ci/test_interpreter_matrix_env_pinning.py:68 `_find_interpreter_matrix_run_step`: `matching = [...]; assert len(matching) == 1, ...`. tests/upgrade/test_migration_robustness.py `_extract_uv_run_argv_prefix` (~line 219-247): `for node in ast.walk(func_node): if isinstance(node, ast.Call) ... : ... return prefix` -- returns on first match, no count/assert. The function is called (per its own docstring and the parametrize table) against tests/charter/test_interview_mapping_mission_alias.py and tests/docs/test_docs_index.py, both explicitly OUTSIDE this WP's owned_files, so a later unrelated edit adding a second subprocess.run([...]) earlier in the same target function is plausible and would silently shadow the intended call -- \"inert today\" is accurate, \"silently shadowed\" tomorrow is a real achievable failure mode given the helper's own design."
  - id: pr-merged-004
    verdict: confirmed
    reason: Empirically reproduced exactly as claimed -- --no-sync against a nonexistent UV_PROJECT_ENVIRONMENT target silently creates an empty venv and exits 0, and the hazard suite's own three tests never exercise this absent-target branch.
    evidence: "Ran (scratch path under repo root, not tmp_path/RAM, cleaned up after): `UV_PROJECT_ENVIRONMENT=<nonexistent> uv run --frozen --no-sync python -c \"print('hello')\"` -> stdout `Creating virtual environment at: <path>` then `hello from venv`, exit 0. Follow-up run inspecting site-packages: `ls <path>/lib/python3.11/site-packages/` -> only `_virtualenv.py`/`_virtualenv.pth`/`__pycache__`, and `import yaml` raised `ModuleNotFoundError: No module named 'yaml'` inside that venv -- confirms it is genuinely empty of project deps, no warning emitted anywhere. Re-read TestVenvCorruptionHazardFR003b (tests/upgrade/test_migration_robustness.py lines ~310-450): its three concrete tests cover (a) a static job-env YAML check, (b) a dedicated venv matching the CURRENT interpreter (present+correct), (c) a dedicated venv built for a MISMATCHED interpreter 3.12 (present+wrong-version) -- none constructs an absent-target venv, confirming the untested-branch claim. Both scratch venvs from my reproduction were `rm -rf`'d immediately after inspection; `git status --porcelain` stayed clean throughout."
  - id: pr-merged-005
    verdict: confirmed
    reason: Read the extractor's control flow directly -- when no call matches the required literal-list-of-string-constants shape, the function falls through to an explicit AssertionError rather than returning a wrong/empty result silently.
    evidence: "tests/upgrade/test_migration_robustness.py, end of `_extract_uv_run_argv_prefix`: `raise AssertionError(f\"no subprocess.run([...]) call found in {function_name!r} ({source_path})\")` is reached whenever `ast.walk` finds no `Call` node matching `.run([...])` with a literal `ast.List` first arg -- e.g. if a call site were rewritten to assemble its argv in a variable instead of a literal list. This is a genuine loud failure, not a silent pass; matches both lenses' independent confirmation cited in the merged finding."
