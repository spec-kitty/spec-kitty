      from spec.md: "Checked by: re-running the exact reproduction that first
      surfaced the hazard ... and confirming it no longer occurs" is indeed
      the named check for option (a), and User Story 3's own Independent Test
      section describes the original repro as accidental ("a
      multiprocessing-spawn child reporting Python 3.11... the exact signature
      already captured in the readiness report"). The finding's core point
      stands on the spec's own text: a single non-reproduction after the fix,
      of a hazard whose trigger conditions were never deterministically
      pinned down, is weaker revert-discipline than a targeted assertion on
      the actual fixed call site. Confirmed, with the caveat that the external
      readiness-report line numbers themselves are unverifiable from this
      checkout.
    severity_adjustment: null
