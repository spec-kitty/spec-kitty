findings:
  - id: TASKS-DECOMP-001
    lens: concrete-enough-to-implement
    severity: 4
    title: "WP03 T005 and WP07 T001's worked local-repro command places uv run's own flags after the pytest subcommand, where they are parsed as pytest arguments and fail — verified live"
    evidence:
      - artifact: "tasks/WP03-uv-run-env-pinning.md § Subtask T005: Local reproduction of the exact command pair"
      - artifact: "tasks/WP07-final-verification.md § Subtask T001: Final local reproduction (explicitly 'same command as WP03's T005')"
      - code: ".github/workflows/ci-nightly.yml:212 (the uv run step this WP03 fix targets: `uv run --frozen pytest -m \"fast or unit\" -q --junitxml=...`)"
    claim: >
      Both WP03's T005 and WP07's T001 give this exact worked command as the
      required local reproduction of the post-fix uv run step:
      `uv run --frozen pytest -m "fast or unit" -q --python 3.13 --all-extras
      --junitxml=out/reports/xunit-nightly-interpreter-3.13.xml`. This places
      `--python 3.13 --all-extras` AFTER the `pytest` subcommand. `uv run`'s
      own CLI grammar is `uv run [OPTIONS] [COMMAND]...` — once the command
      word (`pytest`) appears, every subsequent token is passed through to
      that command, not consumed by `uv run`. Verified live in this checkout:
      `uv run pytest -m "fast or unit" -q --python 3.13 --all-extras
      --collect-only tests/ci/` fails with `pytest: error: unrecognized
      arguments: --python --all-extras tests/ci/`, while placing the same
      flags BEFORE the command word
      (`uv run --frozen --python 3.13 --all-extras pytest --collect-only -q
      tests/ci/`) collects cleanly. Both WPs frame this command as mirroring
      "ci-nightly.yml's own commands byte-for-byte" post-fix, and WP03's own
      T003 (the subtask that actually edits `ci-nightly.yml`'s `uv run` step)
      gives no exact resulting `run:` string — only "add ... to this uv run
      invocation ... preserve the existing ... arguments unchanged." An
      implementer who anchors on the only two concrete worked examples this
      mission provides (T005/T001) risks landing the identical wrong
      placement in the actual workflow YAML fix (FR-001, the mission's core
      defect), which would make the `interpreter-matrix` job's `uv run` step
      fail outright with a pytest argument error instead of running under
      3.13 with the test extra — the opposite of what FR-001 requires. This
      is the same defect duplicated verbatim across two WPs, not two
      independent mistakes.
    remediation: >
      In WP03's T003, give the exact resulting `run:` string for the fixed
      `uv run` step (flags placed between `uv run --frozen` and `pytest`,
      e.g. `uv run --frozen --python "${{ matrix.python-version }}"
      --all-extras pytest -m "fast or unit" -q
      --junitxml="out/reports/xunit-nightly-interpreter-${{
      matrix.python-version }}.xml"`), not just prose describing which flags
      to add. Correct the worked command in WP03's T005 and WP07's T001 to
      place `--python 3.13 --all-extras` immediately after `uv run --frozen`
      and before `pytest`. Re-verify both corrected commands live against
      this checkout before considering the fix applied.
findings_count: 1
