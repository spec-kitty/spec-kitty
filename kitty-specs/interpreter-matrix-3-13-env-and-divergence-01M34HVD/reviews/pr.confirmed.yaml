refuter_corrections:
- 'pr-merged-001: the refuter CONFIRMED the finding but corrected its rationale. Measured cost is ~6.67s
  for 4 tests with interpreters already cached, so the time-budget framing in pr.merged.yaml supports
  only ~sev2-3 on its own. The justification that carries sev4 is different and stronger: un-gated, network-dependent
  subprocess venv builds with NO skip guard running in a nominally "fast" tier - a FLAKINESS risk, not
  a time-budget risk. Severity 4 retained on that basis.'
- 'pr-merged-002: strengthened, not weakened. The refuter tested whether file-scoped grouping matters
