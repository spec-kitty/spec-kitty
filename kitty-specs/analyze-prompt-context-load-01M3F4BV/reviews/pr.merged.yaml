      returns frozenset({'charter'}) — verified interactively
  - code: '.github/ci-module-registry.yml ''charter'' module row: test_dirs includes tests/doctrine (alongside
      tests/charter), so ci-modules.yml''s diff-scoped matrix (module-tests.yml, `-m "not performance
      and not stress"`) selects and runs this file'
  - code: .github/workflows/packs.yml built_in lane filters include both 'packs/built-in/**' and 'tests/doctrine/**'
      — this diff's packs/built-in/* changes independently trigger `built-in-corpus-suite` (`pytest -m
      "corpus and not windows_ci"`), which also collects this file (pytestmark includes pytest.mark.corpus)
  - code: make ci-parity (scripts/ci/local_gate_parity.py) run against this diff (--base-ref 6fd106041)
      reports job 'tests-corpus' selected via ci-router.yml's own corpus group (packs/** match), independently
      of the module matrix
  claim: 'The lens brief asked whether this new test might run only under a shard nothing selects on a
    PR touching these exact paths. Verified empirically: it is actually over-selected, not under-selected
    — it runs via (1) the `charter` module shard in ci-modules.yml/module-tests.yml (test-path-to-module
    mapping, since tests/doctrine is that module''s declared test_dirs), (2) ci-router.yml''s `tests-corpus`
    job (corpus marker, triggered by the packs/** path match), and (3) packs.yml''s `built-in-corpus-suite`
    job (also `-m corpus`, triggered by both packs/built-in/** and tests/doctrine/** path matches). No
    defect; recorded for completeness since this was an explicit named lens.'
  remediation: None required — informational.
- id: pr-tests-004
  lens: diff-cover ≥90% (informational — no defect found)
  severity: 1
  title: This diff has zero Python lines diff-cover's critical-path gate would score
  evidence:
  - code: scripts/ci/aggregate_source.py:17-27 CRITICAL_PATHS tuple (src/kernel/*, src/charter/*, src/specify_cli/status/*,
      src/specify_cli/lanes/branch_naming.py, src/specify_cli/dashboard/handlers/*, src/specify_cli/dashboard/scanner.py,
      src/specify_cli/merge/*, src/runtime/next/*, src/mission_runtime/*) — none of this diff's 3 paths
      (packs/built-in/pack-manifest.yaml, packs/built-in/tactics/canonical-source-unification.tactic.yaml,
      tests/doctrine/test_directive_consistency.py) match any glob
  - code: scripts/ci/aggregate_source.py:113-119 restricts `critical.diff.patch` to `git diff ... -- *CRITICAL_PATHS`,
      so this diff's content is entirely absent from the patch diff-cover scores against
  - code: 'scripts/ci/validate_diff_coverage.py:46-47 additionally skips any non-`.py` path outright (''if
      not changed or not path.endswith(".py"): continue''), which would have excluded the two YAML files
      even if they were under a critical path'
  claim: 'Neither the two YAML doctrine files (not .py) nor the new test file (tests/doctrine/** is not
    in CRITICAL_PATHS) contribute any line to the diff-cover critical-path denominator. The gate scores
    an empty set for this diff and passes trivially. Worth recording because a broader concern was investigated
    and ruled out along the way: none of the module-tests.yml shards ever pass `--cov=tests`, so ANY new
    test file''s own lines are never "measured" in any coverage.xml this repo produces (coverage source
    is always derived from top-level packages under src/, per module-tests.yml''s own documented policy
    at ~line 277). Had this new test file been inside CRITICAL_PATHS, the diff-cover job could plausibly
    hard-fail with "missing coverage evidence" for the test file''s own lines rather than merely scoring
    low — that risk does not apply here only because tests/ is outside CRITICAL_PATHS, not because of
    any explicit test-file exclusion. Flagging as informational since it did not manifest in this diff,
    but the underlying gap (a critical-path test file''s own new lines would hard-fail diff-cover with
    a confusing "missing coverage evidence" error rather than a normal low-score failure) is a latent
    trap for a future PR that DOES add a test under one of the CRITICAL_PATHS-mirrored test trees.'
  remediation: 'No action needed for this diff. Separately (out of this mission''s scope): consider whether
    validate_diff_coverage.py should treat a `.py` path with zero measured lines in ANY coverage report
    (not just a report that measured it partially) as "not applicable" rather than "fully missing," to
    avoid a hard failure on a legitimately-added test file that lives under a critical-path test tree.'
