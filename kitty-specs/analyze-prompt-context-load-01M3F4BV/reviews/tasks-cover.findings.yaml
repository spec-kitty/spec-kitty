findings:
  - id: TASKS-COVER-001
    lens: requirement-mapping-honesty
    severity: 2
    title: "WP01 explains why FR-001/FR-004/FR-005 ride along in requirement_refs but never mentions FR-003 anywhere in its body"
    evidence:
      - artifact: "tasks/WP01-unverified-size-assumption-doctrine.md frontmatter requirement_refs (FR-002, FR-001, FR-003, FR-004, FR-005) and body"
      - artifact: "wps.yaml WP01.requirement_refs (same five ids)"
      - code: "kitty-specs/analyze-prompt-context-load-01M3F4BV/tasks/WP01-unverified-size-assumption-doctrine.md:8 (only occurrence of the literal string 'FR-003' in the entire file)"
      - artifact: "spec.md 'Remaining scope after Operator Decision 7' section — bullets '- **FR-001 no longer executes**', '- **FR-002 (advisory doctrine entry...)**', '- **FR-003 (measurements) is already done**...', '- **FR-004...is restated**', '- **FR-005/006/007...stay out of scope**'"
      - code: "src/specify_cli/requirement_mapping.py:32-70 (_declared_ids docstring/comments: table row / id-naming heading / bulleted item / 'bold id leading a bare paragraph' are the four declaration shapes it matches)"
    claim: >
      WP01's own 'Note on FR-005 in this WP's requirement_refs' section correctly and
      verifiably explains (confirmed against the real `_declared_ids` heuristic in
      `src/specify_cli/requirement_mapping.py`) that finalize-tasks's requirement-mapping
      check sweeps in any bold-bullet-led `- **FR-NNN ...**` line regardless of whether the
      prose says in-scope or out-of-scope. That is the exact mechanism that also explains why
      FR-001, FR-003, and FR-004 all rode along into the same requirement_refs list (spec.md's
      "Remaining scope after Operator Decision 7" section bullets all match that shape). WP01's
      body does go on to give FR-001 and FR-004 their own explicit, honest treatment elsewhere
      (Context paragraph on FR-001 being a no-op; FR-004 as "a hard constraint on this WP,
      not merely on the mission as a whole"; DoD/Reviewer Guidance both check it). FR-003 gets
      none of that — it appears only in the frontmatter list and is never mentioned again in
      Objective, Context, any Subtask, Definition of Done, Risks, or Reviewer Guidance. A
      reader auditing WP01's requirement-mapping honesty (exactly this lens's job) has no
      WP-local explanation for FR-003's presence and must reconstruct it from spec.md's parser
      quirk alone. This is a completeness gap in an otherwise well-flagged pattern, not a
      build-scope error — FR-003 has no undone work and nothing in WP01 implies otherwise.
    remediation: >
      Extend the existing "Note on FR-005 in this WP's requirement_refs" callout (or add a
      one-line sibling note) to also name FR-001, FR-003, and FR-004 as riding along via the
      same bold-bullet-lead parser heuristic, with FR-003 specifically noted as
      "already delivered by research.md, referenced not rebuilt, no WP action needed" — the
      same one-sentence treatment already given to FR-005.
  - id: TASKS-COVER-002
    lens: silent-success-fakeable-dod-check
    severity: 2
    title: "T003's quoted test function is nested under a numbered list step and, copied byte-for-byte as its raw markdown text ('verbatim'), is not valid Python — it needs an implicit dedent the WP never states"
    evidence:
      - artifact: "tasks/WP01-unverified-size-assumption-doctrine.md, Subtask T003 step 2: 'Add the following test function verbatim (already verified genuinely RED...)' followed by a fenced ```python block nested inside numbered step '2.'"
      - code: "kitty-specs/analyze-prompt-context-load-01M3F4BV/tasks/WP01-unverified-size-assumption-doctrine.md:195-196 — the fence and the `def` line both carry a 3-space list-continuation margin (`   \\`\\`\\`python`, `   def test_size_assumption_bypass_failure_mode_documented...`), while the function body/docstring lines carry 7 spaces (3-space list margin + 4-space Python indent)"
      - artifact: "plan.md 'Red-first tests per changed behaviour' section — the same test function, NOT nested in a list, at top-level code-fence indentation (0-space margin)"
    claim: >
      Extracting the T003 code block's raw text exactly as it is byte-encoded in
      WP01-unverified-size-assumption-doctrine.md (verified directly: `python3 -c` extraction
      between the fence markers, then `ast.parse()`) raises
      `SyntaxError: unexpected indent (<unknown>, line 1)` — the `def` line itself carries 3
      leading spaces (the markdown list-continuation margin from being nested under
      "2. Add the following test function verbatim"), which is not legal at module scope.
      Only after `textwrap.dedent()`-ing the block does it parse. plan.md's copy of the
      identical test function is NOT list-nested and is directly copy-pastable as valid
      Python without any dedent. An LLM implementer reading the raw `.md` file as text (a
      normal way for a coding-agent WP consumer to ingest a prompt file, as opposed to a
      dedenting markdown renderer) and following the explicit instruction to add it
      "verbatim" could paste 3 extra leading spaces onto every line of the function,
      producing an immediate `IndentationError` in `tests/doctrine/test_directive_consistency.py`.
      The defect is self-evident and would fail loudly on the very first test run (not a
      silent-success risk), so implementation would still come out right after one fix
      cycle — but it is a genuine, concrete authoring defect in the WP's own quoted content
      that plan.md's version of the same block does not share.
    remediation: >
      Reformat T003 step 2 in WP01 so the ```python fence is not nested inside the numbered
      list item's indentation — either move it to its own paragraph at the step's left margin
      (matching plan.md's formatting exactly, 0-space fence/def indentation) or explicitly
      instruct the implementer to strip the list-continuation margin before pasting. Simplest
      fix: dedent the fence block in the WP file to match plan.md byte-for-byte.
