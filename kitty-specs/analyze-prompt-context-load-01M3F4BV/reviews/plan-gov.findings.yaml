findings:
  - id: PLAN-GOV-001
    lens: PR-overlap check quality
    severity: 3
    title: "PR #5133 overlap claim is factually wrong: it DOES touch packs/built-in/tactic.graph.yaml, contradicting plan.md's explicit 'zero overlap' finding"
    evidence:
      - artifact: "plan.md § PR-overlap section (Dependencies & Sequencing addendum)"
      - code: "plan.md:487-493 (\"#5133 does **not** touch ... `packs/built-in/tactic.graph.yaml`, or `packs/built-in/directive.graph.yaml` (confirmed by the full file list from `gh pr view 5133 --json files`)\")"
      - code: "plan.md:537 (\"Net finding: the only real file-level overlap across the entire current open-PR list is #5133's `analyze.md`\")"
    claim: >
      Live re-verification (`gh pr view 5133 --json files --repo spec-kitty/spec-kitty`, run
      during this review) shows PR #5133's file list includes
      `packs/built-in/tactic.graph.yaml` (MODIFIED, +15/-0) — a file this mission's own
      "Generated artifacts and their regenerating command" section (plan.md § Generated
      artifacts) lists as part of THIS mission's write set (regenerated by FR-002's required
      `spec-kitty doctrine regenerate-graph` step). Plan.md explicitly asserts the opposite
      twice: once in the itemized "does not touch" list for #5133, and again in the closing
      "Net finding" sentence claiming the *only* real overlap across every open PR is the
      `analyze.md` modify/delete case. Both statements are false as of this review pass. The
      PR #5133 change is an unrelated DRG-regeneration side effect (it adds a new tactic file,
      `tactics/testing/acceptance-criteria-non-vacuity.tactic.yaml`, which requires
      regenerating the same shared `tactic.graph.yaml` fragment FR-002 also regenerates), so
      the overlap is a second, distinct file-level collision the plan's re-verification pass
      missed — not merely a stale snapshot, since the plan claims this was freshly re-confirmed
      ("still holds as of this plan-authoring pass") via the same `gh pr view` command this
      review just re-ran with a contradicting result. `directive.graph.yaml` is correctly
      confirmed absent from #5133's diff — only the `tactic.graph.yaml` claim is wrong.
    remediation: >
      Correct the PR-overlap section to list `packs/built-in/tactic.graph.yaml` as a second
      real file-level overlap with #5133 (both PRs regenerate the same DRG fragment via
      independent, non-conflicting source-YAML edits), and add a concrete resolution
      instruction analogous to the modify/delete guidance already given for `analyze.md`:
      whichever PR lands second must re-run `spec-kitty doctrine regenerate-graph` in write
      mode after rebasing onto the first PR's merged state (never hand-resolve a git conflict
      inside the generated fragment) before committing, since the fragment is
      machine-generated and must never be hand-patched per the plan's own "Generated
      artifacts" section. Update the "Net finding" sentence to no longer claim `analyze.md` is
      the *only* overlap.
