findings:
  - id: SPEC-R3-GOV-001
    lens: Scope
    severity: 2
    title: "NFR-003's title still names the dropped governance-context fix; its actual (post-Decision-6) content is a sequencing statement duplicating C-002, inviting an FR-token-scan false positive of the SK-277 kind"
    evidence:
      - artifact: "spec.md § Non-Functional Requirements, NFR-003 row title: \"Governance-context fix seam and PR #5009 overlap\""
      - artifact: "spec.md § NFR-003 body: \"Per Decision 6, the governance-context budget fix (FR-005/006/007) this NFR originally analyzed for PR #5009 file-level overlap is not implemented in this mission ... The overlap discussion is therefore moot for this mission's actual diff, which touches only the override deletion (FR-001) and the doctrine pack files (FR-002) — neither of which overlaps PR #5009's or PR #4995's diffs.\""
      - artifact: "spec.md § C-002 (Constraints table), which independently states the same FR-001/FR-002-vs-#5009/#4995 no-overlap conclusion in full detail"
      - artifact: "SPEC-KITTY-LEDGER.md SK-277 (\"The terminus retrospective's FR-coverage gap check counts cross-mission FR citations as local, uncovered requirements\" — \"The gap detector treats any FR-\\d+ token in the spec as a local requirement\")"
    claim: >
      Decision 6 drops FR-005/006/007 from this mission's scope entirely, so the governance-context
      fix NFR-003 was written to analyze no longer exists as a deliverable in this mission. NFR-003's
      row title ("Governance-context fix seam and PR #5009 overlap") was not updated to match: the
      body now explicitly says the fix "is not implemented" and the overlap discussion "is moot,"
      leaving the row's only live content the FR-001/FR-002-vs-open-PRs sequencing check that C-002
      already states, in more detail, under its own title. Keeping this now-vestigial row in the
      active Non-Functional Requirements table (rather than in a historical block or folded into
      C-002) is a real gap, not merely stylistic: SK-277 is a live, ledger-recorded defect in this
      same tooling family (the retrospective's FR-coverage gap detector) that treats *any* `FR-\d+`
      token appearing anywhere in a spec's prose as a local, uncovered requirement needing WP
      coverage, regardless of context. NFR-003's body is one of several active (non-historical,
      non-"Known residual") locations in this spec that spell out "FR-005/006/007" in full — a
      future post-merge retrospective pass over this mission is exactly the kind of automated scan
      SK-277 already documents as fooled by such tokens, and NFR-003 in particular no longer earns
      its keep as a distinct, live requirement once its content is fully subsumed by C-002.
    remediation: >
      Either delete NFR-003 as superseded by C-002 (which already carries the identical, more
      detailed FR-001/FR-002-vs-#5009/#4995 no-overlap conclusion) and note its removal in the same
      place Decision 6's other supersessions are tracked, or retitle it to describe what it now
      actually asserts (e.g. "Sequencing: FR-001/FR-002 diff has no file-level overlap with open PRs
      #5009/#4995") so a reader scanning NFR titles is not misled into thinking the governance-context
      fix seam is still being analyzed as live scope. Either way, this removes one more literal
      "FR-005/006/007" occurrence from an active (non-historical) table row, reducing this spec's
      exposure to the SK-277 false-positive pattern on the next retrospective pass.

  - id: SPEC-R3-GOV-002
    lens: Directive compliance
    severity: 2
    title: "FR-002/SC-002's \"and/or\" between the tactic and directive files leaves the actual doctrine-file target(s) for the companion regenerate-graph step ambiguous"
    evidence:
      - artifact: "spec.md § FR-002 (Requirements table): \"Add a new failure-mode entry (and/or procedure line) to the existing packs/built-in/tactics/canonical-source-unification.tactic.yaml and/or packs/built-in/directives/044-canonical-sources-and-unification.directive.yaml\""
      - artifact: "spec.md § SC-002: \"packs/built-in/tactics/canonical-source-unification.tactic.yaml and/or packs/built-in/directives/044-canonical-sources-and-unification.directive.yaml contains an explicit failure-mode entry...\""
      - code: "packs/built-in/tactics/canonical-source-unification.tactic.yaml (exists)"
      - code: "packs/built-in/directives/044-canonical-sources-and-unification.directive.yaml (exists)"
    claim: >
      FR-002 and SC-002 both leave the doctrine-file target as "tactic file and/or directive file,"
      never committing to one, the other, or both. Both files exist and are independently editable
      DRG-source inputs; the required companion step (regenerate-graph in write mode, committing the
      resulting `.graph.yaml` diff) applies identically regardless of which file(s) are touched, so
      the ambiguity does not risk a broken pipeline — but it does leave a WP implementer to decide,
      unguided by the spec, whether editing only one file (and, if so, which) satisfies SC-002, or
      whether both must carry the entry for "verbatim... reviewable by any future doctrine reader"
      to hold. A reviewer checking SC-002 post-implementation has no spec-stated basis to say a
      single-file edit is sufficient (or insufficient) versus a change that split the entry
      inconsistently across both files.
    remediation: >
      Pick one (or explicitly both) before implementation: e.g., "the tactic file carries the
      failure-mode entry; the directive file's Rule 1/Rule 3 text may optionally cross-reference it,
      but the tactic file alone satisfies SC-002," or the converse. This is a small, single-sentence
      fix that removes an avoidable implementation-time judgment call without touching the
      substance of FR-002/SC-002.

