findings:
  - id: PLAN-GOV-001
    lens: PR-overlap check quality
    severity: 3
    title: "PR #5133 overlap claim is factually wrong: it DOES touch packs/built-in/tactic.graph.yaml, contradicting plan.md's explicit 'zero overlap' finding"
    evidence:
      - artifact: "plan.md § PR-overlap section (Dependencies & Sequencing addendum)"
      - code: "plan.md:487-493 (\"#5133 does **not** touch ... `packs/built-in/tactic.graph.yaml`, or `packs/built-in/directive.graph.yaml` (confirmed by the full file list from `gh pr view 5133 --json files`)\")"
      - code: "plan.md:537 (\"Net finding: the only real file-level overlap across the entire current open-PR list is #5133's `analyze.md`\")"
    claim: >
      Live re-verification (`gh pr view 5133 --json files --repo spec-kitty/spec-kitty`, run
      during this review) shows PR #5133's file list includes
      `packs/built-in/tactic.graph.yaml` (MODIFIED, +15/-0) — a file this mission's own
      "Generated artifacts and their regenerating command" section (plan.md § Generated
      artifacts) lists as part of THIS mission's write set (regenerated by FR-002's required
      `spec-kitty doctrine regenerate-graph` step). Plan.md explicitly asserts the opposite
      twice. `directive.graph.yaml` is correctly confirmed absent from #5133's diff — only the
      `tactic.graph.yaml` claim is wrong.
    remediation: >
      Correct the PR-overlap section to list `packs/built-in/tactic.graph.yaml` as a second
      real file-level overlap with #5133, and add a concrete resolution instruction analogous
      to the modify/delete guidance already given for `analyze.md`: whichever PR lands second
      must re-run `spec-kitty doctrine regenerate-graph` in write mode after rebasing onto the
      first PR's merged state (never hand-resolve a git conflict inside the generated
      fragment). Update the "Net finding" sentence to no longer claim `analyze.md` is the
      *only* overlap.

  - id: PLAN-ARCH-001
    lens: blast-radius
    severity: 3
    title: "'Consumer projects never had this override' is overstated: the OVERRIDE tier for command-templates has demonstrably affected real consumer projects"
    evidence:
      - artifact: "plan.md § Technical Context (Target Platform)"
      - artifact: "spec.md § Edge Cases (\"What happens if a downstream consumer project has no .kittify/overrides/...analyze.md at all\")"
      - code: "src/specify_cli/runtime/migrate.py:56 (SHARED_ASSET_DIRS = {\"templates\", \"missions\", \"scripts\", \"command-templates\"})"
      - code: "src/specify_cli/upgrade/migrations/m_2_0_7_fix_stale_overrides.py:1-11"
    claim: >
      plan.md's Technical Context states "no consumer-facing runtime behavior changes
      (consumer projects never had this override — see spec.md Edge Cases)". Read
      categorically, this is overstated: the OVERRIDE tier for command-templates is a general
      resolver feature available to every spec-kitty project, and FixStaleOverridesMigration
      (2.0.7) exists specifically to repair consumer projects whose upgrade sequencing bug
      spuriously classified managed command-template files as CUSTOMIZED and moved them into
      .kittify/overrides/. The narrow claim (no consumer carries THIS SPECIFIC stale file) is
      true; the broader framing used to scope Target Platform/NFR-002's blast radius is not.
    remediation: >
      Narrow the claim to: "no consumer project carries this repo's specific stale
      April-2026 analyze.md override content; the OVERRIDE tier and command-templates
      overrides generally ARE a live consumer-facing resolver feature (see
      FixStaleOverridesMigration/2.0.7)." Does not change FR-001's mechanism or correctness,
      only the blast-radius framing.

  - id: PLAN-ARCH-002
    lens: blast-radius
    severity: 2
    title: "Plan's '497 mission directories' figure is an off-by-one counting artifact, not evidence of growth over spec.md's ~496"
    evidence:
      - artifact: "plan.md § Reflexivity (\"Operating-condition context\")"
      - artifact: "spec.md § Edge Cases (\"currently has ~496 mission directories under kitty-specs/\")"
    claim: >
      plan.md's `find kitty-specs -maxdepth 1 -type d | wc -l` command double-counts the
      `kitty-specs` parent directory itself (depth 0 satisfies `-maxdepth 1`), overstating the
      true count by one. `find kitty-specs -mindepth 1 -maxdepth 1 -type d | wc -l` (the
      correct incantation) returns 496 — identical to spec.md's figure, not one more. The
      plan's "grew by one, consistent with routine concurrent-mission use" inference is a
      shell-command bug, not evidence of growth — ironic given this mission's own
      "measure, don't assert" thesis.
    remediation: >
      Re-run the count with `find kitty-specs -mindepth 1 -maxdepth 1 -type d | wc -l` (496)
      and correct the sentence to state 496, dropping the "grew by one" inference. Does not
      change the section's substantive conclusion.

  - id: PLAN-VERIFY-001
    lens: gates / ci-parity reproduction
    severity: 4
    title: >-
      "ci-modules.yml / per-module test shards: none selected" is factually wrong —
      verified against the actual authority ci-modules.yml calls (select_modules),
      not the one the plan checked (select_gates)
    evidence:
      - artifact: "plan.md § The gate set for this mission (\"Path/diff-scoped gates that WILL fire\" bullet)"
      - code: "scripts/ci/local_gate_parity.py:55,93 — make ci-parity imports and calls only select_gates(), never select_modules()"
      - code: ".github/workflows/ci-modules.yml:20-26,236,259 — calls `select_modules(changed_files, mode=selection_mode)`"
      - code: "scripts/ci/gate_selection.py:270-306 — select_modules() unions in `_modules_for_test_paths`, built to close spec-kitty#4454 (tests-only diffs mapped back to their owning module)"
      - code: ".github/ci-module-registry.yml:149-167 — the `charter` module row's test_dirs includes `pytest tests/charter tests/doctrine`"
      - command: >-
          `select_modules()` against the plan's own planned FR-001+FR-002 file list returns
          `frozenset({'charter'})`, not the empty set the plan reports for "per-module test
          shards".
    claim: >-
      The plan's central, must-not-be-stale claim about which CI job matrix runs for this
      diff is wrong: `select_gates()`'s `selected_code_shards` field is a job-router-level
      concept that deliberately does not run the tests-only-diff-to-module mirroring logic
      `select_modules()` applies. This under-claims CI coverage — it risks an implementer
      believing no CI mechanism exercises the new resolver test, when in fact the `charter`
      module's 5-shard run WILL execute both new tests as part of this PR's own CI.
    remediation: >-
      Replace the "ci-modules.yml / per-module test shards: none selected" bullet with a
      corrected one using `select_modules()` (not `select_gates()`), reporting `{'charter'}`,
      and reframing this as a positive ATDD finding. Correct the "make ci-parity Method" note
      to state that `make ci-parity` only answers the router/job-level question and is not a
      complete proxy for "what CI actually runs" when the diff touches `tests/**`.

  - id: PLAN-VERIFY-002
    lens: red-first test design / determinism-vacuity
    severity: 3
    title: >-
      The sketched FR-001 test uses `is` identity comparison on ResolutionTier, contradicting
      test_resolver.py's own documented safe pattern for exactly this comparison
    evidence:
      - artifact: "plan.md § Red-first tests per changed behaviour (test sketch: `assert result.tier is ResolutionTier.PACKAGE_DEFAULT`)"
      - code: "tests/doctrine/test_resolver.py:25-36 — module comment documents why tier equality uses `.name == .name`, never `is`/`==`, due to a documented dual-class-identity hazard under `--import-mode=importlib` + pytestarch"
      - code: "tests/doctrine/test_resolver.py:126,148,173,185,195,201,234,... — every existing tier assertion in the file already uses `.name ==`"
    claim: >-
      The plan's one fully-written test sketch asserts tier identity with `is`, in a file
      whose own module-level comment documents why every other test avoids exactly that
      pattern. Not confirmed to flake under today's CI invocation (`--import-mode=importlib`
      is not set for this test tree), but a real inconsistency with the file's own documented
      convention.
    remediation: >-
      Rewrite the sketch's assertion to `assert result.tier.name == ResolutionTier.PACKAGE_DEFAULT.name`,
      matching the file's established idiom.
