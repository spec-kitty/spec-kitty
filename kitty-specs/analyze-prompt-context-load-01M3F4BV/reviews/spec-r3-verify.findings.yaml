findings:
  - id: SPEC-R3-VERIFY-001
    lens: baseline-honesty / factual-check
    severity: 2
    title: "analyze is smaller than 7 of the other 11 canonical siblings, not 6 — an uncorrected sibling of the 'third-smallest' error this round was meant to fix"
    evidence:
      - artifact: "spec.md § Confirmed diagnosis, line 121-122: \"Canonical: 11,555 B / 245 lines — smaller than 6 of the other 11 sibling command templates (`specify` 46.8 KB is 4x larger).\""
      - artifact: "research.md § 2, line 45: \"`analyze/prompt.md` (canonical) is smaller than 6 of the other 11 sibling templates.\""
      - code: "packs/built-in/missions/mission-steps/software-dev/*/prompt.md (live `wc -c`, re-derived during this review): research=4049, accept=4267, tasks-finalize=6604, tasks-outline=9271, analyze=11555, charter=12654, tasks-packages=12943, review=14122, implement=15726, plan=21586, tasks=33385, specify=46822"
    claim: >
      This round's mandatory fix corrected the "third-smallest of 8 actions measured" framing
      (research.md § 4 / spec.md's diagnosis section), but a sibling numeric claim about the
      *static canonical template* comparison across all 12 software-dev command templates
      (research.md § 2 / spec.md's "Confirmed diagnosis" bullet) was not corrected and is itself
      wrong in the same direction (undercounting how many siblings are larger than `analyze`).
      Re-deriving directly from the live files: of the 11 other canonical templates under
      `packs/built-in/missions/mission-steps/software-dev/*/prompt.md`, only 4 are smaller than
      `analyze` (11,555 B) — research (4,049 B), accept (4,267 B), tasks-finalize (6,604 B),
      tasks-outline (9,271 B) — and 7 are larger (charter, tasks-packages, review, implement,
      plan, tasks, specify). So `analyze` is smaller than **7** of the other 11, not 6, as both
      spec.md and research.md currently state in live, non-`<details>` prose. This does not
      change the diagnosis (analyze is still small, if anything the corrected number makes the
      "not oversized" case *stronger*, not weaker) and does not change any decision or FR/SC, but
      it is exactly the class of unverified-arithmetic claim this mission's own thesis
      ("measure, don't assert") and this round's mandate exist to eliminate, and it sits directly
      adjacent to the claim this round was specifically tasked with fixing.
    remediation: >
      In spec.md's "Confirmed diagnosis" bullet (line ~121) and research.md § 2 (line ~45),
      change "smaller than 6 of the other 11 sibling command templates/templates" to "smaller
      than 7 of the other 11 sibling command templates" (or equivalently state "larger than only
      4 of the other 11: research, accept, tasks-finalize, tasks-outline").

  - id: SPEC-R3-VERIFY-002
    lens: falsifiability
    severity: 2
    title: "FR-003 has no labeled Success Criterion or inline failure condition, unlike FR-001/FR-002/FR-004"
    evidence:
      - artifact: "spec.md § Functional Requirements table, FR-003 row (line 558): \"Document in `research.md` (this mission, already delivered) the reproducible `build_prompt()` render measurement... | ... | Medium | Done (delivered as part of this spec/research phase) |\" — no Status/notes falsification clause, and no SC-00x row cites FR-003."
      - artifact: "spec.md § Success Criteria (SC-001 through SC-004, lines 590-593): SC-001 maps to FR-001/NFR-001, SC-002 maps to FR-002, SC-003/SC-004 map to FR-004/NFR-003 constraints. None is labeled as FR-003's criterion."
      - artifact: "spec.md § User Story 2 Independent Test (line 495-497): \"research.md's measurement script is copy-pasteable and reproduces the same relative ordering ... on a clean checkout at the same commit\" — this is the de facto falsification condition for FR-003's claim, but it is not cross-referenced from the FR-003 row itself."
    claim: >
      FR-001 is falsified via NFR-001's explicit two-part condition; FR-002 is falsified via its
      own Status/notes clause plus SC-002's explicit "not met if..." wording; FR-004 is falsified
      via SC-003's diff-based check. FR-003 has none of this directly attached — its row simply
      says "Done" with no stated condition under which the documentation would be considered
      inadequate or wrong. The actual falsification criterion exists (User Story 2's Independent
      Test: does the measurement script reproduce the claimed ordering on a clean checkout at the
      same commit?), but it lives in a different section with no cross-reference, so a future
      reader auditing FR-003 in isolation (e.g. via the FR table) would not find it.
    remediation: >
      Add a one-line "Status/notes" or "Verification" clause to FR-003's table row (mirroring
      FR-002's pattern) that cross-references User Story 2's Independent Test as FR-003's
      falsification condition, e.g.: "Verified by User Story 2's Independent Test: the
      `build_prompt()` script above reproduces the stated relative ordering (analyze/accept/
      research small; specify/plan/tasks/implement/review large) on a clean checkout at commit
      da6d0af97; a re-run that fails to reproduce this ordering falsifies FR-003."

  - id: SPEC-R3-VERIFY-003
    lens: falsifiability
    severity: 1
    title: "SC-002 and Acceptance Scenario 1 state different bars for the FR-002 doctrine text (\"an explicit failure-mode entry\" vs. \"present verbatim\")"
    evidence:
      - artifact: "spec.md § User Story 1, Acceptance Scenario 1 (line 468): \"...the entry parses as valid doctrine and is present verbatim...\""
      - artifact: "spec.md § Success Criteria, SC-002 (line 591): \"...contains an explicit failure-mode entry naming 'bypassing a canonical surface on an unverified size assumption,' reviewable by any future doctrine reader...\" — no \"verbatim\" requirement stated."
    claim: >
      Acceptance Scenario 1 requires the failure-mode text be "present verbatim" (implying a
      fixed, pre-agreed wording the implementer must not paraphrase), while SC-002 — which this
      spec elsewhere treats as authoritative for FR-002's verification — only requires "an
      explicit failure-mode entry naming" the concept, without a verbatim requirement. An
      implementer following SC-002 alone could reasonably paraphrase the failure-mode text and
      still believe SC-002 is met, while an adversarial reader applying Acceptance Scenario 1's
      "verbatim" bar would disagree. This is a wording-only gap (the substantive content required
      is the same either way) with no effect on the mechanically-verified part of FR-002
      (doctrine-graph regeneration + the two named test files), only on whether the prose text
      itself must match a fixed string.
    remediation: >
      Pick one bar and use it consistently in both places: either drop "verbatim" from
      Acceptance Scenario 1 (matching SC-002's looser "explicit entry naming X" standard), or add
      "verbatim (matching the wording given in FR-002's own text above)" to SC-002 so both
      criteria agree on whether exact wording is required.
