      <details> block" case this round's other cross-references were fixed to avoid.
    remediation: >
      Update SC-004's parenthetical to reference Decision 6 and the "Known residual" section
      the way NFR-002/NFR-003/C-002/C-003 now do (the underlying fact — zero lines changed in
