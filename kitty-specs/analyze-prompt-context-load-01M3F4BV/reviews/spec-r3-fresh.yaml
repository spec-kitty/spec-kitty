findings:
  - id: SPEC-R3-FRESH-001
    lens: fresh
    severity: 3
    title: research.md still cross-references spec.md's "Operator Decision 5 reflexivity" Edge Case, which this round deleted
    evidence:
      - artifact: "research.md § 9.7.2, line 677"
      - artifact: "research.md § 9.7.3, line 706"
      - artifact: "spec.md § Edge Cases (diff 0bb0b671d..HEAD, the bullet removed and replaced)"
    claim: >
      This round's diff (0bb0b671d..HEAD) deletes spec.md's entire "(Operator Decision 5
      reflexivity — corrected per round-4 fix, SPEC-R2-ARCH-001/VERIFY-005: ...)" Edge Cases
      bullet outright, replacing it with two much shorter bullets (a "Read-only check" bullet
      and a one-line "(Operator Decision 6, 2026-09-26 — this bullet is retired.)" notice). But
      research.md § 9.7.2 ("...case (a) in spec.md's 'Operator Decision 5 reflexivity' Edge
      Case) is unaffected by this fix...") and § 9.7.3 ("...corrected in place (see §9.1) and in
      spec.md's 'Operator Decision 5 reflexivity' Edge Case...") were not updated in this round
      and still point a reader at that named Edge Case as if its content (the compact-path
      no-op argument, the byte figures, the required regression test) is live in spec.md. A
      reader following either research.md pointer into spec.md today finds no such heading or
      bullet text — only the one-line retirement notice. This is exactly the "pointer to a
      heading that ... was deleted" case: the target section research.md names no longer
      exists under that name anywhere in spec.md.
    remediation: >
      Update research.md § 9.7.2 and § 9.7.3 to either point at spec.md's current retirement
      bullet/"Known residual (out of scope): governance-context budget gap" section, or drop
      the forward pointer and state the compact-path-is-a-no-op conclusion self-containedly in
      research.md (it already has the supporting measurement in the same subsections).

  - id: SPEC-R3-FRESH-002
