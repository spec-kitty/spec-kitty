  - id: SPEC-R3-FRESH-003
    lens: charter
    severity: 3
    title: Decision 6's deferral of the governance-context fix does not satisfy DIRECTIVE_052's "tracked follow-up behind an umbrella/epic issue" requirement
    evidence:
      - artifact: "spec.md § Clarifications / Decisions, item 6"
      - artifact: "spec.md § \"Known residual (out of scope): governance-context budget gap\""
      - code: "packs/built-in/directives/052-prefer-durable-fixes.directive.yaml (integrity_rules: \"Deferring a structural remediation is compliant ONLY when it is recorded as a tracked follow-up behind an umbrella/epic issue with the root cause named.\")"
    claim: >
      DIRECTIVE_052 (activated in this repo's charter, cited earlier in this same spec's now-
      collapsed historical section as the authority requiring a tracked follow-up) requires a
      deferred structural fix to be recorded "behind an umbrella/epic issue," not merely
      mentioned in prose. Decision 6 and the new "Known residual" section both commit only to
      "the orchestrator will post the budget-gap measurements and an ADR amendment proposal on
      #5005 for the upstream maintainer" — i.e., a comment on the SAME issue #5005 that this
      mission is itself closing out (FR-001/002/003 are exactly what #5005 asked for). Nothing
      in spec.md states whether #5005 stays open specifically to track the deferred
      governance-context fix, or whether it closes on this mission's merge (the normal
      convention per the charter's Collaboration Strategy) leaving the deferred structural
      defect recorded only in a comment on a closed issue — not a "tracked follow-up" a
      maintainer would see in an open-issues triage pass. This is the same failure mode noted
      elsewhere in project memory: humans/maintainers read PRs, not issue comments, when
      triaging.
    remediation: >
      Either (a) explicitly state in spec.md/Decision 6 that #5005 will be kept open (or
      re-labeled) specifically to track the governance-context budget-gap ADR-amendment
      proposal until the maintainer rules, or (b) have the orchestrator file a dedicated
      follow-up issue naming the root cause (per DIRECTIVE_052's literal requirement) and
      record its number in spec.md's Dependencies & Sequencing, the same way Operator
      Decision 4's SK-276 ledger residual is recorded.

  - id: SPEC-R3-FRESH-004
    lens: fresh
    severity: 2
    title: "Post-deletion re-measurement figure (16,458 B) is loosely called \"an order of magnitude below\" the 97,175–112,248 B group, but the actual ratio is ~5.9x–6.8x"
    evidence:
      - artifact: "spec.md § Confirmed diagnosis, \"Honest post-deletion figure\" sentence"
      - artifact: "research.md § 4, \"Post-deletion re-measurement\" paragraph"
    claim: >
      Both spec.md and research.md's new post-deletion re-measurement text state: "This remains
      an order of magnitude below the 97,175–112,248 B group of five and well within normal
      LLM-context standards." 97,175 / 16,458 ≈ 5.9 and 112,248 / 16,458 ≈ 6.8 — under one order
      of magnitude (~10x) by either bound. The phrase was carried over verbatim from the
      pre-deletion figure's framing (11,891 B vs. the same group, a ~8.2x–9.4x ratio, itself a
      loose but more defensible use of "order of magnitude") without being recalibrated for the
      new, ~38% larger post-deletion number. This is a small but real quantitative overstatement
      inside a document whose entire methodology is "measure, don't assert" — the kind of
      unverified-round-number claim this mission's own diagnosis criticizes elsewhere (e.g. the
      round-3 fix to the ledger-check "zero hits" claim in research.md § 6).
    remediation: >
      Reword to something ratio-accurate, e.g. "roughly 6x–7x smaller than the
      97,175–112,248 B group" or "well under half the 40,000-character BUDGET_DEFAULT... and
      6–7x smaller than the five oversized actions," rather than reusing "order of magnitude."
