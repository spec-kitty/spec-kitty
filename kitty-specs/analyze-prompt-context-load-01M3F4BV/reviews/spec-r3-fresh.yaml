    severity: 3
    title: SC-004 is the one Success Criterion this round left unrenovated — it still cites "NFR-003's rewrite" and points at the now-collapsed fix-plan section
    evidence:
      - artifact: "spec.md § Success Criteria, SC-004"
      - artifact: "spec.md § Non-Functional Requirements, NFR-003 (current text)"
      - artifact: "spec.md § Confirmed diagnosis, \"### Confirmed root cause and fix plan for the governance-context disparity (Operator Decision 5)\" (now inside the second, Decision-6 <details> block)"
    claim: >
      Every other requirement/constraint that referenced the dropped FR-005/006/007 work was
      updated in this round to point at the new "Known residual (out of scope):
      governance-context budget gap" section (NFR-002, NFR-003, C-002, C-003, both Key
      Entities bullets all do this explicitly). SC-004 alone was left untouched (absent from
      the diff) and still reads: "(Reframed per NFR-003's rewrite: this is no longer true
      because the mission avoids that file to dodge #5009 — it is true because investigation
      confirmed that file is not the correct seam for the FR-005/006/007 fix; see 'Confirmed
      root cause and fix plan' above.)" Two problems: (a) "NFR-003's rewrite" it references was
      the Decision-5-era rewrite ("collision risk with #5009," "blanket prohibition retired") —
      the CURRENT NFR-003 (Decision 6, this round) says something materially different (a moot,
