      (T035 step 1: ''raise it here as a one-line amendment in its own commit; the file is owned by WP05/WP17/WP06'')'
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/wps.yaml (WP18 owned_files lists conformance/port,
      testsupport, architecture, portlevel-tests.txt only)
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks-overview.md section 5 (an edit
      of a file in NO owned_files of that WP is out-of-map and needs a one-line rationale)
  claim: A planned, expected edit is classified as out-of-map by the overview's own rule, on a file three
    earlier WPs share. It is minor (same lane, serial) but it means the exit-gate WP is planned to violate
    its ownership list.
  remediation: Add services/mission-status-api/src/test/resources/jacoco-class-floor.properties to WP18
    owned_files in wps.yaml and the prompt frontmatter (serial hand-off, same lane, no overlap error),
    and list WP18 as the fourth step of the chokepoint row in tasks-overview.md section 7.
