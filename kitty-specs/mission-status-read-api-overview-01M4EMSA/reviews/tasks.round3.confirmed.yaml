  remediation: Add FR-007 to WP19 and FR-009 to WP17 in wps.yaml and, because finalize-tasks leaves existing
    prompt frontmatter untouched (the DD entry on requirement_refs), in the two prompt frontmatters; refresh
    tasks.md by finalize-tasks and add WP19 to the FR-007 row and WP17 to the FR-009 row of tasks-overview.md
    section 3.1.
- id: TASKS-FRESH2-005
  lens: lanes
  severity: 2
  title: Overview says the lane-b base is checked at the first claim, but the allocator merges the lane-a
    tip into lane-b on every re-entry
  evidence:
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks-overview.md:50 ('the orchestrator
      checks at the first lane-b claim that the allocated base already contains the WP01 and WP02 results')
  - code: src/specify_cli/lanes/worktree_allocator.py:979-987 and :1095-1099 (REUSE path calls _merge_dependency_lane_tips
      on every re-entry; the tip of every depends_on_lanes branch is merged, idempotently)
  - artifact: 'kitty-specs/mission-status-read-api-overview-01M4EMSA/lanes.json (lane-b depends_on_lanes:
      lane-a, lane-planning)'
  claim: Because lane-b lists lane-a in depends_on_lanes, each later WP claim in lane-b merges whatever
    commits lane-a (WP07) has on its branch at that moment, including in-flight, unreviewed ones (ci-router.yml,
    packs.yml, .gitattributes, test_contracts_workflows.py, conformance trees). The overview presents
    the lane-level edge as a one-time base question. Gates run in lane-b between WP03 and WP09 (WP04 T022
    AC-15d workflow sweep, the architectural file checks) can therefore see a half-finished WP07, and
    a merge conflict aborts the claim.
  remediation: 'Extend tasks-overview.md section 1 (and the matching tooling-friction note) to say that
    every lane-b claim re-merges the current lane-a tip, and add an orchestrator rule: before claiming
    a lane-b WP while WP07 is not yet approved, either claim WP07 to completion first or confirm the merge
    is clean and re-run the workflow-enumerating sweep in WP04 T022 after any such merge. State the failure
    path (DependencyLaneMergeConflictError) so the claim is not mistaken for a WP defect.'
