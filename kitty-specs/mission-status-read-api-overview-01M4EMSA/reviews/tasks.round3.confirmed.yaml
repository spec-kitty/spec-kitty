findings:
- id: TASKS-FRESH2-001
  lens: acceptance
  severity: 3
  title: WP10 T053 step 9 (AC-4d HTTP leg) asserts less than AC-4d requires, so the new test can pass
    on a mixed-prefix item
  evidence:
  - artifact: 'kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks/WP10-http-controllers-contract-wiring.md:95
      (step 9 (a): ''event count and lastEventId equal to a prefix''; (b): 500 at both stages and ''a
      200 again once the newline lands'')'
  - artifact: 'kitty-specs/mission-status-read-api-overview-01M4EMSA/spec.md:238 (AC-4d: every 200 item''s
      eventCount, statusLaneCounts, lastEventId AND streamCursor are exactly those of one prefix; after
      the newline the read ''requires the item of the new prefix'')'
  - artifact: 'kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks/WP19-filesystem-event-source-and-readme-stub.md:74
      (step 4 adapter leg: ''every observed prefix matches a prefix of complete lines'', no field list)'
  claim: Fix round 2 moved the HTTP leg of AC-4d into WP10 and wrote it with two of the four fields the
    spec names. A response whose statusLaneCounts or streamCursor came from a different prefix than its
    eventCount (the exact 'mixture' the Concurrent writer edge case forbids) passes step 9. The latch
    part also stops at 'a 200 again' instead of requiring the item of the new prefix, which is the spec's
    third latch stage. The revert row (serve the prefix before a half-written row) would not catch a counts-versus-cursor
    mixture.
  remediation: 'In WP10 T053 step 9 (a) require, for every 200 item of the observed Mission, that eventCount,
    statusLaneCounts, lastEventId and streamCursor all equal those of one single prefix of complete lines
    of the final log (compute the expected tuple per prefix from the final log in the test). In (b) after
    the newline lands require the 200 item to equal the tuple of the new prefix, and require the L4 stage
    and the L4b stage to be observed as separate reads (assert both occurred, so the latch phase cannot
    be vacuous). Add a second revert row: take statusLaneCounts from the previous cache entry while the
    cursor advances => red. Mirror the four-field wording in WP19 T046 step 4.'
- id: TASKS-FRESH2-002
  lens: traceability
  severity: 2
  title: WP02 tells its implementer the next design-decision id is DD-19, but DD-19 to DD-39 are already
    taken
  evidence:
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks/WP02-spike-and-decision-record.md:64
      ('next DD id is DD-19') and :154 (T010 step 3 'DD-19 onward')
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/traces/design-decisions.md (DD-19
      to DD-25 tasks-stage, DD-26 to DD-34 fix round 1, DD-35 to DD-39 fix round 2, all present once)
  claim: WP02 is the first WP to append to design-decisions.md. Following its brief it writes DD-19 (generated-versus-hand,
    bundling mechanism) and onward, duplicating ids already used by tasks-stage entries; later cross-references
    such as 'DD-35' or 'DD-37' in WP prompts and the overview would then be ambiguous.
  remediation: 'Change WP02 line 64 and T010 step 3 to ''the next free DD id: read the last DD id in traces/design-decisions.md
    (DD-39 at fix round 2) and continue from it'', and state the same rule in any other WP that appends
    DD entries. Also update tasks-overview.md section 8, which still lists only ''DD-19 to DD-25'' and
    ''DD-26 onward: fix round 1'', to include the fix round 2 range DD-35 to DD-39.'
- id: TASKS-FRESH2-003
  lens: ownership
  severity: 2
  title: RecordingAllowlistAccess is declared a public class of adapter.out.filesystem without saying
    which source set; its name does not match WP08's Allowlist* glob
  evidence:
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks/WP08-filesystem-adapter-primitives.md:99
      ('AllowlistAccess ... and RecordingAllowlistAccess are PUBLIC classes of adapter.out.filesystem';
      'AllowlistAccess' was named so it matches the Allowlist* ownership glob)
  - artifact: 'kitty-specs/mission-status-read-api-overview-01M4EMSA/wps.yaml (WP08 owned_files: main
      .../adapter/out/filesystem/Allowlist* and test .../adapter/out/filesystem/**)'
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks/WP08-filesystem-adapter-primitives.md:105
      (Validation filters 'RecordingAllowlist*' as a test pattern)
  claim: File RecordingAllowlistAccess.java does not match the main-source glob Allowlist*. If the implementer
    puts it beside AllowlistAccess in src/main (the natural reading of 'public classes of adapter.out.filesystem'),
    it is an unowned file, and a test-only recording class ships in the production and native image. If
    it goes to src/test it is owned, but the prompt never says so, and rule 11 wording ('only testsupport
    may import adapter.out.filesystem') leaves open whether a test class in that package counts.
  remediation: State in WP08 T044 step 2 that AllowlistAccess (interface plus pass-through) lives in src/main
    under Allowlist* and RecordingAllowlistAccess lives in src/test, package org.speckitty.missionstatus.adapter.out.filesystem,
    public, covered by the owned test glob; add one sentence to WP18 T033 step 1 that rule 11 treats test
    classes in the adapter.out.filesystem package itself as in-package. Keep the DD-37 and overview section
    9 item 13 wording in step.
- id: TASKS-FRESH2-004
  lens: traceability
  severity: 2
  title: WP19 owns AC-7c/7d and WP17 owns the AC-9g projection, but neither lists the parent requirement
    in requirement_refs
  evidence:
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks-overview.md section 3.2 (AC-7c,
      AC-7d -> WP19; AC-9g -> WP17 (projection))
  - artifact: 'kitty-specs/mission-status-read-api-overview-01M4EMSA/wps.yaml (WP19 requirement_refs:
      FR-004, FR-010, FR-016, C-005, NFR-008, NFR-003, SC-006; WP17 requirement_refs: FR-004, FR-012,
      NFR-003, NFR-005, NFR-006)'
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks/WP19-filesystem-event-source-and-readme-stub.md:56
      (Context cites 'FR-007 (AC-7c/7d)')
  - artifact: kitty-specs/mission-status-read-api-overview-01M4EMSA/tasks-overview.md section 3.1 (FR-007
      -> WP06 only; FR-009 row has no WP17)
  claim: The fix-round-2 split moved AC-7c/7d out of WP06 into WP19 (WP06 T031 validation now says they
    are 'adapter-suite tests in WP19') and the projection out of WP05 into WP17. FR-007's adapter-level
    acceptance now lives only in a WP whose requirement_refs omit FR-007, so a review or accept pass keyed
    on requirement_refs will not find where AC-7c/7d are proven; the same holds for FR-009 (AC-9g) and
