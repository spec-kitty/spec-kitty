findings:
- id: PLAN-GOV-002
  lens: scope
  severity: 3
  title: Plan fixes AC-9b outcomes that contradict the binding spec, and the 'escalation list' it points to does not exist
  evidence:
  - artifact: plan.md section 8 ('the plan's test table expects 403 for filter-reachable values and 400 for container-rejected
      malformed values ... flagged to the orchestrator as a spec-amendment candidate'); risk R-11; research.md R-7
  - artifact: plan.md 'Readiness'/Unverified item 9 says 'escalated in the Unverified/escalation list', and Unverified item
      4 says 'dropped by amendment'; the Unverified list (items 1-9) contains no AC-9b entry and there is no escalation section
  - artifact: spec.md AC-9b (line 297) requires 'the refusal constant' for each listed Host value, including `evil.example@127.0.0.1:<port>`,
      and 'Fails on any 200 ...'
  claim: 'The plan pre-writes a test table that departs from AC-9b (400 for container-rejected rows) while the amendment is
    only ''flagged''. The one place that is supposed to record escalations (Unverified/escalation list, research ''Squad dispositions'')
    has no entry for it, nor for the AC-10c JFR amendment or the fleet-verdict gap beyond a one-line item. An amendment decision
    that lives only in prose paragraphs can be silently implemented, which is the failure the lens asks to catch.

    '
  remediation: 'Add a short ''Spec amendments and escalations'' table to plan.md (id, spec element, proposed change, status
    = proposed/not applied, owner = operator) listing: AC-9b malformed-Host rows, AC-10c JFR event fallback, ci-fleet-verdict
    coverage, and (if kept) any release path. State that until the operator rules, AC-9b stays as written and the WP01 spike
    result is what feeds the amendment request. Make section 8''s table conditional on that ruling rather than the plan''s
    expectation.

    '
  refuter_reason: Plan section 8 pre-writes a 400/403 split that departs from AC-9b while the Unverified list (items 1-9)
    and risk R-11 carry no AC-9b amendment or escalation entry, and the "Unverified/escalation list" it points to is only
    that numbered list.
- id: PLAN-GOV-003
  lens: directive
  severity: 3
  title: Tracer files are not in the canonical location, name or entry format of the mission-tracer-files procedure
  evidence:
  - artifact: plan.md section 10 and Charter Check row 'Standing order 3' (files at mission root as tracer-approach.md, tracer-design-decisions.md,
      tracer-tooling-friction.md)
  - code: 'packs/built-in/procedures/mission-tracer-files.procedure.yaml, ''Seed'' step: create `traces/` under the mission''s
      kitty-specs directory with tooling-friction.md, approach.md, design-decisions.md; ''Append'' step: entries as `- **[YYYY-MM-DD][phase]
      Short symptom.** 1-3 sentences`'
  - code: .gitattributes:12 `kitty-specs/**/traces/*.md merge=spec-kitty-traces` (the merge driver only covers traces/); recent
      missions (write-side-seam-matrix-tracer, wp-snapshot-backfill) use traces/
  - artifact: tracer-design-decisions.md is a table with IDs and no dates; tracer-tooling-friction.md entries are numbered
      and undated
  claim: 'Charter standing order 6 (canonical sources, never improvise or copy an older mission) and standing order 3 name
    the procedure as the authority. The plan copied an older root-level `tracer-*.md` convention (189 historical files) instead
    of the procedure''s `traces/` layout and dated-entry format, so the files miss the merge driver and the retrospective/accept
    steps that look in traces/. Content itself is substantive; only placement, names and format are off.

    '
  remediation: 'Move the three files to `kitty-specs/<mission>/traces/{tooling-friction,approach,design-decisions}.md` (git
    mv, add-only history is fine since the plan commit is on the issue branch, not main) and rewrite entries as `- **[2026-10-10][plan]
    symptom.** 1-3 sentences; disposition`. Update plan.md companion-artifact list, section 10, Charter Check row and quickstart
    references.

    '
  refuter_reason: The mission-tracer-files procedure mandates traces/ with tooling-friction.md, approach.md, design-decisions.md
    and dated entries, while plan.md section 10 puts tracer-*.md at the mission root, outside the traces merge driver glob.
- id: PLAN-GOV-004
  lens: terminology
  severity: 3
  title: Plan misstates how Contextive glossary files are maintained and over-claims that 'reducer' and 'status event' are
    canonical terms
  evidence:
  - artifact: 'plan.md section 2, last row: ''No glossary term is introduced (Mission, Work Package, Lane, status event, reducer
      already canonical). If a Contextive file edit becomes necessary it is a hand edit validated by the existing CI check.'''
  - code: 'docs/context/contextive-glossaries.md (''Do not edit generated files'': files under src/specify_cli/.contextive/
      are generated; edit docs/context/<slug>.md then run `python scripts/generate_contextive_glossaries.py generate`; `check`
      mode in CI)'
  - code: '`.venv/bin/spec-kitty glossary list` returns no entry for ''reducer'' or ''status event'' (only ''lane'', ''work
      package'', ''accepted work package'', ...); grep -rn reducer docs/context/*.md finds nothing'
  - artifact: 'spec.md NFR-008: ''Contextive glossary files are updated if a new term is introduced and the CI check passes'''
  claim: 'A hand edit of a generated `.contextive` file would fail the sync check, and the stated canonical-term basis is
    partly untrue: ''reducer'' has no glossary entry (the service README, docs and Java domain package names will use ''status
    reducer'', ''overview read model'', ''conformance golden'', ''Diagnostic'' as domain language). The plan neither decides
    to add them nor justifies treating them as code-only identifiers, so NFR-008 is not actually planned.

    '
  remediation: 'Replace the sentence with: terms are authored in `docs/context/<slug>.md`, Contextive YAML is regenerated
    with `.venv/bin/python scripts/generate_contextive_glossaries.py generate` and verified with `... check`. Then either
    (a) add a concrete task to define ''status reducer'' (and any other term used in docs/README) in the right context file,
    or (b) state that the docs/README avoid them and list the glossary terms they do use (Mission, Work Package, Lane) verified
    against `glossary list`. Add the `check` command to the section 5 local command list.

    '
  refuter_reason: docs/context/contextive-glossaries.md says generated files are not hand-edited, and no docs/context file
    defines 'reducer', so plan.md section 2 misstates both the edit path and the canonical-term basis.
- id: PLAN-GOV-005
  lens: ledger
  severity: 2
  title: Shared-surface edits missing from section 1 and from the Reflexivity diff check (.gitattributes, ci-gate-mechanics.md,
    CHANGELOG)
  evidence:
  - artifact: plan.md section 11 phase 2b write scope includes `.gitattributes`; contracts/service-contract-notes.md says
      '.gitattributes pins the tree to -text'; section 1 'Router/CI edits' and the Docs impact list do not name .gitattributes
  - artifact: spec.md Reflexivity items 1-6 enumerate the shared-surface edits and the review diff check ('only the edits
      listed'); neither .gitattributes nor docs/development/reference/ci-gate-mechanics.md nor docs/changelog/CHANGELOG.md
      is listed
  claim: 'The plan''s own diff check (''no src/ or other-Mission kitty-specs path modified; ci-router.yml diff is one filter-group
    line; two pinning tests edited'') will not catch or authorise three shared-file edits that the plan makes elsewhere. Reviewers
    working from section 1 or the spec list would flag them as drift, or worse, miss an unplanned .gitattributes change affecting
    every checkout.

    '
  remediation: 'Add .gitattributes (one scoped line for the conformance tree, not a global rule), ci-gate-mechanics.md and
    CHANGELOG.md to the section 1 edit list and to the ''diff check'' sentence in section 4; note that the Reflexivity list
    in spec.md is silent on them and is being extended by the plan (no spec edit needed, just listed).

    '
  refuter_reason: .gitattributes appears in plan section 11 phase 2b but not in section 1 or the section 4 diff-check sentence
