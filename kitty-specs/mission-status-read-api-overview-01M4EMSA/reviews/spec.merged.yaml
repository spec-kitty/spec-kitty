  - code: contracts/mission-status/schemas/MissionHead.yaml:139-140
  - artifact: "spec.md \xA7 Edge Cases (unreadable event log, malformed event), FR-004, Open Questions Q-1"
  - code: 'contracts/mission-status/schemas/MissionHead.yaml:139-141 (lifecycleStatus: wpTotal 0 ''including an unreadable event log'' reads draft)'
  - code: 'contracts/mission-status/schemas/Project.yaml (lastActivityAt: an event log that cannot be decoded or parsed fails the whole read with a 500; a Mission whose status.json cannot be read leaves
      its activity out)'
  - code: src/specify_cli/status/store.py:566-576 (read_events_raw raises StoreError on invalid JSON or non-object line)
  claim: 'The contract''s lifecycleStatus rule reads "wpTotal is 0 (including an unreadable event log), so draft". So the contract already maps an unreadable log to a 200 overview with zero counts and lifecycle
    draft, and has no per-Mission failure field. FR-004/AC-4a say the opposite ("Fails if the response is a healthy overview with zero counts") and Q-1 says the question is "not settled from the repo".
    An implementer following C-012 (serve the contract as written) fails AC-4a, and one satisfying AC-4a breaks both the contract and the "same overview as Python on every Mission" gate. The FR is written
    as a requirement while its premise is parked, so the unreadable-log leg of AC-4a is untestable until Q-1 is decided.

    [merged duplicate SPEC-ARCH-003]: The contract defines: an unreadable log yields wpTotal 0 and lifecycleStatus draft; an undecodable or unparseable log fails the whole read with a 500 Problem. The spec
    instead requires that an unreadable log never be reported as an empty healthy Mission and that the service report a per-Mission state, and parks this as Q-1. As written, AC-4a ("fails if the response
    is a healthy overview with zero counts") contradicts the contract''s own draft rule, and a Java port that follows Python''s StoreError (whole-request failure) contradicts the "report per Mission" text.
    The Project description also names status.json as a lastActivityAt input, which contradicts FR-010''s exclusion of status.json (the Python helper takes it from the snapshot, tests/contract/_mission_status_payloads.py:882).'
  remediation: Rewrite Q-1 to cite MissionHead.yaml:139-140 as the current contract answer (unreadable log reads as draft with zero counts). Mark the unreadable-log and missing-directory legs of FR-004/AC-4a
    as blocked on Q-1, and state the interim behaviour (contract rule plus the FR-004 AC-4c diagnostic) so the plan has a falsifiable AC either way. Keep the contract change an explicit escalation to the
    contract owners, not a silent deviation.
