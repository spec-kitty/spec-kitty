findings:
- id: SPEC-ARCH-JVM-001
  lens: M-C JVM build, native and supply-chain feasibility / hexagonal design
  severity: 4
  title: The Lamport algorithm FR-005 tells the Java port to mirror is not in this repository
  evidence:
  - artifact: "spec.md \xA7 FR-005, AC-5a, User Story 3 scenario 2"
  - code: src/specify_cli/status/reducer.py:17-18 (imports reduce_shared_state from spec_kitty_events.status)
  - code: src/specify_cli/status/reducer.py:372-377 (materialize_snapshot delegates the reduction to reduce_shared_state)
  - code: pyproject.toml:80 (spec-kitty-events>=10.4.0,<11)
  claim: FR-005 says the domain reducer is "equivalent to materialize_snapshot over reduce_shared_state in src/specify_cli/status/reducer.py". That file holds only the wrapper and the cancellation and implementer
    projections. The Lamport ordering itself (clock, then "the Python tie-break keys", AC-5a) is implemented in the external spec_kitty_events package, which is not under src/ and is a floating range. A
    Java implementer has no in-repo source to port, AC-5a leaves the tie-break keys unnamed, and a spec_kitty_events bump inside the range can change the algorithm with no Java signal beyond the goldens.
  remediation: Name the external algorithm as the reference (package, the exact version in uv.lock at spec time, the function spec_kitty_events.status.reduce). Spell the tie-break key order and the malformed/unknown-lane
    rules out in the spec or plan from that source. Add an AC that the Python golden test records the installed spec_kitty_events version in the goldens, so a bump that changes output forces regeneration
    and a Java follow-up.
- id: SPEC-ARCH-JVM-002
  lens: M-C supply-chain feasibility
  severity: 3
  title: Match contracts/ is presented as precedent, but contracts/ has no wrapper, no wrapper-validation action and no version catalog
  evidence:
  - artifact: "spec.md \xA7 Clarifications Q3, FR-014, C-008"
  - code: contracts/tools/gradle_pin_check.py:11-12 (the repository commits no wrapper)
  - code: contracts/settings.gradle:3-4 (there is no committed wrapper jar; Gradle comes from tools/pins.json)
  - code: contracts/tools/pins.json (Gradle is a sha256-pinned archive installed by install_tools.py)
  - code: contracts/gradle/verification-metadata.xml:4-5 (verify-metadata true, verify-signatures false)
  claim: Of the four Q3 controls, only strict verification metadata exists in contracts/. The committed wrapper with distributionSha256Sum, the wrapper-validation action and the version catalog appear nowhere
    in contracts/ or .github/workflows (a repo-wide search for wrapper-validation, setup-gradle and libs.versions finds nothing outside a comment in gradle_pin_check.py). The sentence "controls match, version
    does not" therefore hides that three of the four controls are new, with no existing check, tamper tool or workflow step to copy. The tamper tool is also hard-wired to the contracts tree (it copies it
    and runs its tools/bundle.py), so it cannot be reused as is.
  remediation: 'Reword FR-014/C-008 to say which controls are inherited (strict verification metadata, SHA-pinned actions) and which are introduced here, and give each introduced control its own failing
    check in the plan: a wrapper-properties test that distributionSha256Sum is present and 64 hex chars, a pinned wrapper-validation step, a catalog-only rule (no literal versions in build.kts, enforceable
    by a grep test). State that tamper_check.py is a model, not a reuse.'
- id: SPEC-ARCH-JVM-003
  lens: M-C supply-chain feasibility
  severity: 3
  title: Strict dependency verification and the wrapper-validation control are not stated so that a check can fail
  evidence:
  - artifact: "spec.md \xA7 FR-014 AC-14a, AC-14b, AC-14c, R-7"
  - code: contracts/gradle/verification-metadata.xml:4-5 (verify-signatures false; no trusted-artifacts or ignored-keys blocks)
  - code: contracts/tools/tamper_check.py:4-9 (plant detected only if the build stops with DEPENDENCY_VERIFICATION_FAILED)
  claim: '"Strict mode" is not defined: nothing says no <trusted-artifacts> or <ignored-keys> wildcard may be added, that buildscript and plugin classpaths (including the Spring Boot, GraalVM Native Build
    Tools and openapi-generator plugins) are covered, or that CI runs without --write-verification-metadata. AC-14b ("fails if it passes with a modified jar") describes behaviour of a third-party action
    and has no named positive control in this repo. AC-14c ("covers every platform-specific artifact of the four-OS matrix") has no mechanism: metadata written on one OS misses OS-classified artifacts,
    and the spec does not say the metadata is regenerated on or merged from all four OSes. The JDK/GraalVM distribution is outside Gradle verification entirely (see SPEC-ARCH-JVM-005).'
  remediation: 'Define strict as: verify-metadata true, a test that fails on any trusted-artifacts or ignored-keys entry and on any <sha256> origin other than "Generated by Gradle", CI invoking Gradle with
    dependency verification mode strict. Make AC-14c the matrix itself (every leg builds under strict, no leg writes metadata) and name the explicit multi-OS regeneration step. For AC-14b, plant a modified
    jar in a scratch copy in a workflow job that expects the validation step to go red (fixture job, continue-on-error inverted).'
- id: SPEC-ARCH-JVM-004
  lens: M-C supply-chain feasibility
  severity: 3
  title: The 7.25.0 pin equality has no acceptance criterion, and a new contracts*.yml name would be swept into the existing pin gates
  evidence:
  - artifact: "spec.md \xA7 FR-014 (openapi-generator version equals contracts/tools/pins.json), AC-14a-d, FR-015"
  - code: contracts/tools/gradle_pin_check.py:50-53 (defaults read contracts/build.gradle and contracts/gradle/ only)
  - code: contracts/tools/gradle_pin_check.py:55-56 and contracts/tools/verify_pins.py:57 (workflow glob contracts*.yml)
  - code: contracts/tools/pins.json (gradle 8.14.5, openapi-generator-gradle-plugin 7.25.0)
  claim: FR-014 requires the service's generator plugin to equal the pins.json pin, but no AC checks it, and the existing gradle_pin_check only reads contracts/build.gradle, so a drifted service version
    passes every gate (FR without coverage). Separately, both gradle_pin_check and verify_pins glob .github/workflows/contracts*.yml and compare any gradle-version input to 8.14.5; a service workflow named
    contracts-*.yml would be read and fail or confuse them. The spec names the workflow only as "a new workflow".
  remediation: 'Add AC-14e: a test (extend gradle_pin_check with --build for the service build, or a Python test beside tests/ci) that fails when the plugin version in the service build or catalog differs
    from pins.json. Constrain the workflow file name to one that does not match contracts*.yml (for example mission-status-api.yml) and say so in FR-015.'
- id: SPEC-ARCH-JVM-005
  lens: M-C toolchain provisioning and native matrix
  severity: 3
  title: JDK 25 / GraalVM toolchain provisioning in CI is deferred to "verified at plan time"
  evidence:
  - artifact: "spec.md \xA7 R-3, FR-015, Assumptions (no setup-java 25 exists), C-001"
  - code: .github/workflows/contracts.yml:124-127 and 327-330 (setup-java, temurin, java-version 21; the only JDK provisioning in the repo)
  claim: The spec requires a GraalVM native image on four targets yet names no JDK distribution, no GraalVM provisioning action, no JDK version pin, and no rule against Gradle toolchain auto-download (the
    foojay resolver fetches a JDK outside dependency verification). FR-015 pins "every action by SHA" but a SHA-pinned action that downloads an unpinned "latest" JDK defeats the pin doctrine. Windows x64
    native-image also needs the MSVC toolchain, and ubuntu-24.04-arm / macOS arm64 runner labels are asserted without a precedent in this repo's workflows.
  remediation: Add to FR-014/FR-015 an AC that the workflow names one GraalVM-for-JDK-25 provisioning action by SHA with an explicit java-version and distribution, disables toolchain auto-provisioning (org.gradle.java.installations.auto-download=false,
    no foojay plugin), and records the JDK/Gradle/Spring Boot/NBT versions in a manifest that a pin test compares to the build. List the exact runner labels per leg and the Windows MSVC step.
- id: SPEC-ARCH-JVM-006
  lens: M-C native release acceptance
  severity: 3
  title: Native smoke (AC-15b) proves "route answers" but not that AOT hints cover the filesystem adapter, SSE delivery or error bodies; cross-OS determinism (NFR-005) has no test
  evidence:
  - artifact: "spec.md \xA7 FR-015 AC-15b, NFR-005, SC-004, R-5"
  claim: 'AC-15b requires a request to each route and a Content-Type check. A missing reflection or resource hint most often shows in the paths a trivial request skips: Jackson serialisation of the full
    MissionOverview with null members, the RFC 9457 Problem body of a 400/404/409, reading real ledger bytes through the filesystem adapter, and an actual SSE event after an append. The prose of FR-015
    says "the contract tests" run against each native binary, but no AC does. NFR-005 demands byte-identical responses across the four OS targets, yet no step compares outputs between OSes (CRLF in ledgers,
    path separators, directory listing order and case-folding on macOS/Windows, Windows has no O_NOFOLLOW) and no AC covers it.'
  remediation: 'Make AC-15b: against each native binary run the curated golden set over HTTP and require byte equality with the goldens, one request per refusal code, and an append-while-open SSE round
    trip receiving a status-transition event. Add AC for NFR-005: each OS leg uploads a digest of its golden responses and a final job fails if the four digests differ. Add a CRLF and a sorted-listing fixture.'
- id: SPEC-ARCH-JVM-007
  lens: M-C virtual-thread / SSE / loopback testability
  severity: 3
  title: Virtual-thread behaviour and the 100-connection budget are stated without measurable thresholds; springdoc adds routes the guard and scope do not cover
  evidence:
  - artifact: "spec.md \xA7 NFR-004, C-001, FR-009, C-004, AC-9a-f"
  claim: NFR-004 ("without platform-thread exhaustion or an unbounded heap") has no number and no mechanism, and nothing asserts virtual threads are actually enabled (a misconfigured spring.threads.virtual.enabled
    silently runs on platform threads and still passes every functional AC; native-image behaviour of the setting is also untested). Springdoc-openapi is in the stack with a contract-first build, but its
    default endpoints (/v3/api-docs, /swagger-ui*) would be extra routes outside the three in C-004, and the spec does not say whether they are disabled or Host/Origin-guarded. The guard ACs do not say
    the check runs as a servlet filter ahead of MVC dispatch, so error and 404 paths and springdoc routes are covered, nor how IPv6 loopback and `localhost` are treated.
  remediation: 'Add ACs: the request-handling thread of /missions and of an SSE handler reports Thread.isVirtual() true (JVM and native); NFR-004 gets a numeric bound (peak platform-thread count delta and
    heap ceiling under 100 streams). State that springdoc UI/api-docs endpoints are disabled (or explicitly served and guarded) and that a request to any path outside the three returns 404 only after the
    Host/Origin filter. Specify accepted Host forms (127.0.0.1, localhost, [::1]) and the bind address ([127.0.0.1] only).'
- id: SPEC-ARCH-JVM-008
  lens: Java hexagonal design as constrained by the spec
  severity: 3
  title: Port contracts are too thin to keep Spring and JSON out of the domain while meeting FR-004/FR-005 and SSE
  evidence:
  - artifact: "spec.md \xA7 Clarifications (Architecture), FR-004, FR-005, FR-012, FR-013 AC-13a, FR-003"
  - code: src/specify_cli/status/reducer.py:374-375 (reads raw events and a typed stream, then reduces)
  claim: The outbound port MissionEventSource is named but its operations are not. FR-012 bans JSON and java.io/java.nio.file from domain and application, so line parsing, malformed-row classification and
    torn-tail detection must happen in adapter.out.filesystem; yet FR-004/FR-005 require the reducer to match Python's skip/refuse decisions exactly. Unless the port returns a typed outcome (parsed event,
    malformed line with reason, torn tail, unreadable), parity of malformed handling cannot be written framework-free or tested through the in-memory adapter (AC-13a). Likewise MissionStatusQuery "changes
    since a cursor" needs a framework-free way to block or subscribe for new events (an SseEmitter must not appear in the port); FR-003 gives no latency bound for AC-3a, and filesystem change detection
    differs per OS (WatchService is polling-based on macOS).
  remediation: 'Add to FR-013/FR-012 the required shape of both ports: MissionEventSource returns an events-plus-diagnostics value (including malformed and torn-tail records and a log fingerprint for the
    cursor) and offers a blocking awaitChange(cursor, timeout) (virtual-thread friendly) or a java.util.concurrent.Flow.Publisher; the SSE adapter maps it to SseEmitter. Give AC-3a a bound (event within
    N seconds on each OS) and name the change-detection mechanism (poll interval) so it is testable. Let the in-memory test adapter implement append and truncate.'
- id: SPEC-ARCH-JVM-009
  lens: M-C ArchUnit precision / non-vacuity
  severity: 3
  title: ArchUnit rules are stated loosely enough to be vacuous or over-broad
  evidence:
  - artifact: "spec.md \xA7 FR-012, AC-12a, AC-12b, FR-013 AC-13b, FR-005 AC-5b"
  claim: AC-12b only requires each rule's scanned class count "above zero", so a rule that scans one class passes. Base package, layer package names and the allowed `config` composition root are not named,
    so adapter.in versus adapter.out isolation and domain-to-application direction are unspecified. Banning all of java.io in domain and application also forbids java.io.Serializable and exceptions such
    as UncheckedIOException that records and ports may reasonably use; the denied set is not enumerated (Jackson, jakarta, slf4j, Spring, java.net.http). Logging for AC-4c has no stated home (a domain-level
    slf4j call violates the rule; a port is unspecified). ArchUnit must also read Java 25 class files; a version that cannot would scan nothing.
  remediation: Enumerate the layer packages and the exact denied package prefixes per layer. Strengthen AC-12b with named anchor classes (assert MissionStatusQuery and MissionEventSource are in the scanned
    set, plus a minimum class count per layer) and keep ArchUnit's fail-on-empty behaviour. Require the plan to verify the ArchUnit version reads Java 25 bytecode. State where diagnostics are emitted (an
    outbound DiagnosticsSink port or adapter-side logging).
- id: SPEC-ARCH-JVM-010
  lens: M-C openapi-generator pin and Q2 fallback spike
  severity: 3
  title: The WP01 spike has no exit criteria, and generating from a 3.1 split root conflicts with the contracts build's own note on lossy 3.1 handling
  evidence:
  - artifact: "spec.md \xA7 Clarifications Q2, C-007, R-4, FR-011 AC-11c"
  - code: contracts/mission-status/openapi.yaml:1 (openapi 3.1.0)
  - code: contracts/mission-status/schemas/MissionOverview.yaml:10 (unevaluatedProperties false)
  - code: 'contracts/build.gradle:41-43 (javaView is NOT an artefact: the openapi-yaml generator drops 3.1 constructs)'
  claim: '"Falls back to hand-written DTOs if unusable" does not define unusable, so the spike cannot be pass/fail. Contract is OpenAPI 3.1 with unevaluatedProperties and type arrays; the contracts build
    itself records that the Java generator path drops 3.1 constructs, and the spec generates from the split root rather than the bundle. Gradle 9.x compatibility of the 7.25.0 plugin (pinned only against
    8.14.5) is also unstated, and springdoc''s role beside a contract-first generated interface is unexplained (two sources for the served description).'
  remediation: 'Give the spike measurable exit criteria: plugin 7.25.0 runs on the chosen Gradle 9.x under strict verification; generated models compile, preserve nullability (type: [string, ''null''])
    and serialise each golden response byte-identically with deterministic member order; otherwise hand-written DTOs. Say which input the generator reads (split root versus the Python-written bundle) and
    what springdoc contributes.'
- id: SPEC-ARCH-JVM-011
  lens: Java hexagonal design / security of the filesystem adapter
  severity: 3
  title: Python's symlink and slug-containment refusals on ledger reads are not carried into the Java filesystem adapter requirements
  evidence:
  - artifact: "spec.md \xA7 FR-004, FR-010, FR-006, C-005"
  - code: src/specify_cli/status/store.py:440-454 (_read_text_without_following_symlinks refuses a symlinked event log, O_NOFOLLOW)
  - code: src/specify_cli/status/store.py:157-206 (_is_safe_slug and _is_contained keep slug resolution inside the specs root)
  claim: The Python reference refuses to read a symlinked ledger and contains slug resolution within the specs root. The Java service reads attacker-influenceable directory names under a loopback HTTP surface
    and must serve "no secrets in responses", yet no FR or AC requires NOFOLLOW reads, containment of resolved paths (including coordination worktree paths under .worktrees), or a fixture with a symlinked
    status.events.jsonl. Windows has no O_NOFOLLOW; the Java equivalent (LinkOption.NOFOLLOW_LINKS, real-path containment) is not named.
  remediation: 'Add to FR-004/FR-010 an AC: a symlinked ledger or meta.json is reported as a per-Mission failure, never read, and a resolved path outside the project root is refused; add the positive control
    fixture and run it on all four OSes.'
- id: SPEC-ARCH-001
  lens: M-B Read allowlist and path-resolver parity
  severity: 4
  title: FR-006 describes the resolver as "coordination worktree if it exists, else primary"; the real resolver decides by stored topology
  evidence:
  - artifact: "spec.md \xA7 FR-006, Edge Cases (coordination-topology), R-1"
  - code: 'src/specify_cli/missions/_read_path_resolver.py:340-420 (_resolve_existing_for_slug: a stored coord-less topology resolves PRIMARY regardless of a coord husk; only coord-routing topologies consult
      the coord worktree; topology None falls back to a probe plus fail-closed StatusReadPathNotFound)'
  - code: src/specify_cli/missions/_read_path_resolver.py:164-215 (classify_from_meta reads meta.json topology / coordination_branch and lanes.json)
  - code: tests/contract/_mission_status_payloads.py:700-717 (the reference oracle falls back to the Mission's own directory on CoordinationBranchDeleted, CoordAuthorityUnavailable, MissionMetadataUnavailable,
      or a read dir outside the checkout)
  claim: 'FR-006 and AC-6a/6b state the rule as existence-driven. The Python resolver is driven by the topology stored in meta.json (a stale coord husk beside a single_branch or lanes Mission must NOT be
    read, which is the #2062 close), and has typed fail-closed outcomes. A Java port written to the spec text would read the husk for such Missions and diverge from the golden oracle. The coordination fixture
    set (one coord Mission with a stale primary copy) does not include the husk-beside-primary-topology case, so the gate would not catch it.'
  remediation: 'Rewrite FR-006 as: the topology stored in the primary meta.json decides (coord and lanes_with_coord consult the coord mission dir if present; lanes, single_branch and absent-topology classification
    follow classify_from_meta), and list the typed fallbacks the oracle maps to "read the own directory". Add a curated fixture class for "stale coord husk beside a single_branch Mission" (AC-6 variant)
    and require the Java resolver to be table-driven from the same cases as the Python resolver tests.'
- id: SPEC-ARCH-002
  lens: M-B Read allowlist and path-resolver parity
  severity: 4
  title: FR-010 allowlist omits files and git state the reference derivation and resolver read, and the Java side cannot mirror the git probes
  evidence:
  - artifact: "spec.md \xA7 FR-010 (items 1-5), AC-10a, FR-006, Q-3"
  - code: src/specify_cli/missions/_read_path_resolver.py:208-215 (classify_from_meta reads lanes.json on the absent-topology arm)
  - code: 'src/specify_cli/coordination/surface_resolver.py:623-675,691-780 (is_registered_coord_worktree and _coord_branch_exists run git subprocesses: worktree list, rev-parse, refs/remotes scan, remote
      probe)'
  - code: 'src/specify_cli/missions/_read_path_resolver.py:288-310 (probe_coord_state: DELETED verdict needs a git rev-parse of the declared coordination_branch)'
  - code: src/specify_cli/status/reducer.py:387 and 300-310 (materialize_snapshot reads status.json via _target_schema_version to pick the snapshot generation)
  claim: The allowlist names meta.json, config.yaml, metadata.yaml, HEAD and two directory listings. It does not name lanes.json (read by the resolver on the un-backfilled arm), nor any git registry or
    ref state (.git/worktrees, packed-refs, refs/heads, refs/remotes) that decides DELETED versus UNMATERIALIZED and registered-coord versus husk. FR-016/AC-10c forbid spawning a process, so the Java service
    cannot reproduce those verdicts, yet FR-005/FR-006 promise "behaviour equals Python's" and AC-6c pins a "declared but missing coordination worktree" golden generated from live Python (which spawns git).
    Either the allowlist test will miss a needed read, or the golden will encode behaviour Java structurally cannot produce. Separately, status.json is read by materialize_snapshot (schema generation only;
    no overview field depends on it), which should be stated so "never status.json" is not read as "the oracle never reads it".
  remediation: 'Enumerate the resolver''s real inputs and decide each: add lanes.json (and its tolerance rule: corrupt means no lanes) to the allowlist or declare the absent-topology arm unsupported with
    an explicit failure; for the git-dependent verdicts, either add named ref files to the allowlist with a file-based reimplementation, or exclude declared-but-absent coordination from the curated goldens
    and record the divergence in FR-006 (not only in Q-3). Add one sentence that the oracle''s status.json read affects only snapshot generation fields absent from the overview.'
- id: SPEC-ARCH-004
  lens: M-B Read allowlist and path-resolver parity
  severity: 3
  title: Torn-final-line behaviour has no single Python reference, and AC-4b requires a report the oracle never emits
  evidence:
  - artifact: "spec.md \xA7 FR-004, AC-4b, Edge Cases (truncated or torn final line, concurrent writer), FR-005 last sentence"
  - code: 'src/specify_cli/status/tail_reader.py:247-250 (poll_once: an unterminated trailing remainder is left unconsumed, not parsed, not signaled)'
  - code: src/specify_cli/status/store.py:553-576 (read_events_raw, used by materialize_snapshot, raises StoreError on a non-JSON line, torn tail included)
  - code: tests/contract/_mission_status_payloads.py:727-741 (load_source uses poll_once for rows and cursor, but materialize_snapshot for the snapshot)
  claim: 'The Python oracle composes two readers with different torn-tail semantics: the cursor and rows tolerate a tail without newline, while the snapshot reduction raises on it. The overview needs both
    (eventCount, lane counts from the reducer; streamCursor from the tail reader). The spec says the Java reducer must match Python "where Python skips or refuses" and also that the torn tail is "reported",
    but Python reports nothing and may refuse the whole read. The five fixture classes include "log-truncated" but not "torn final line", so the case is untested by the golden gate.'
  remediation: Add a sixth curated class (torn final line) and state in FR-004 what the oracle does (record it from live Python), then say whether the Java service mirrors the refusal or the tolerated-tail
    reading. Reword AC-4b to assert the golden outcome and the path-free diagnostic, dropping "torn tail is reported" unless a contract surface for it is named.
- id: SPEC-ARCH-005
  lens: M-B Read allowlist and path-resolver parity
  severity: 3
  title: FR-010 does not say which directory each file is read from; the oracle reads meta.json from the Mission's own directory and the ledger from the resolved read dir
  evidence:
  - artifact: "spec.md \xA7 FR-010 items 1-2 ('<mission dir>'), FR-006"
  - code: tests/contract/_mission_status_payloads.py:722-741 (load_meta and resolve_mission_identity on the own primary dir; status.events.jsonl from read_dir)
  - code: src/specify_cli/status/reducer.py:399 (materialize_snapshot additionally calls resolve_mission_identity on the read dir, so a second meta.json is read)
  claim: 'The allowlist says "<mission dir>/meta.json" and "<mission dir>/status.events.jsonl" as if one directory. In a coord Mission the ledger lives under .worktrees/<slug>-<mid8>-coord/kitty-specs/...,
    while identity and dates come from the primary checkout. An allowlist test written per "mission dir" will either reject the legitimate coord ledger path or accept a read of the coord meta.json that
    the overview does not need (and which may be absent: sparse checkout).'
  remediation: 'Split item 1 and 2: ledger from the resolved read dir (primary or coord), meta.json from the primary Mission directory only. State that the coord copy of meta.json is not read for the overview,
    and that identity fields never depend on it.'
- id: SPEC-ARCH-006
  lens: Reflexivity
  severity: 3
  title: Reflexivity understates the shared-surface edits; the router and its pinning tests also change, and golden edits under services/ would not trigger the Python gate
  evidence:
  - artifact: "spec.md \xA7 Reflexivity ('The one shared-surface edit is the Python goldens test joining the contract_tools/corpus routing'), FR-008 (ii), SC-007"
  - code: '.github/workflows/ci-router.yml:284-310 (contract_tools filter: tests/contract/**, contracts workflows, specific src files; no services/** path)'
  - code: .github/workflows/ci-router.yml:1005-1030 (corpus-blocking and contract-tools jobs name tests/contract modules explicitly; tests/ci/test_contracts_workflows.py and tests/ci/test_corpus_blocking_home.py
      pin that every tests/contract module has exactly one home)
  - artifact: "spec.md \xA7 FR-008 (iv), \xA7 Reflexivity"
  - code: .github/workflows/ci-nightly.yml:61
  claim: 'A new Python golden test under tests/contract/ must be given a home in ci-router.yml (and the pinning tests updated), and the goldens live under services/mission-status-api/src/test/resources/conformance/,
    a path in no router filter group. A PR that edits only a golden or only Java would therefore not run the Python test that asserts goldens equal live Python, which defeats FR-008(ii). The reflexivity
    section also says nothing of ci-router.yml edits, so "no behaviour change" is only partly verified, and SC-007 ("a services/**-only PR triggers the new workflow and no Python shard") conflicts with
    adding services/** conformance paths to the contract_tools group.

    [merged duplicate SPEC-GOV-008]: FR-008(iv) allows editing the existing ci-nightly.yml "or a workflow of this mission''s own"; Reflexivity claims the only shared-surface edit is the Python goldens test
    joining the routing, and lists a workflow plus a CODEOWNERS line. Editing ci-nightly.yml would add an unlisted shared-surface edit (and router/arch-gate pins) that the verification diff check would
    then fail to anticipate.'
  remediation: 'Add to Reflexivity and FR-008 an explicit list: ci-router.yml filter edit (add the conformance goldens path to contract_tools only), the tests/ci pinning tests touched, and the home of the
    new tests/contract module. Reword SC-007 to "no src-backed Python shard" and add an AC that a golden-only diff selects the contract-tools job.'
  merged_from:
  - SPEC-GOV-008
- id: SPEC-ARCH-007
  lens: M-B Read allowlist and path-resolver parity
  severity: 2
  title: Java reads the HEAD file where the oracle runs git; the allowlist entry ".git/HEAD" is wrong for worktree checkouts
  evidence:
  - artifact: "spec.md \xA7 FR-001 (HEAD file), FR-010 item 5 ('.git/HEAD')"
  - code: src/specify_cli/core/git_ops.py:144-165 (get_current_branch runs git via subprocess; None for detached HEAD)
  - code: 'contracts/mission-status/schemas/Project.yaml (currentBranch: read from the HEAD file with no process started; x-source cites get_current_branch)'
  claim: The contract and spec choose a file read, but the Python oracle (get_current_branch) uses git, so unborn branches, a gitfile (.git is a file in a linked worktree, which a service started in one
    would meet), and symbolic-ref forms can differ. The allowlist names a fixed path ".git/HEAD" that does not exist in that case.
