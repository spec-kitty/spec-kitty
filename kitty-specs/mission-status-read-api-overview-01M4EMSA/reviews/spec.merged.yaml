- id: SPEC-VERIFY-004
  lens: MISSION LENS M-D (SSE contract ACs)
  severity: 4
  title: No AC exercises successful resume, streamCursor-over-Last-Event-ID precedence, or ordering and latency
  evidence:
  - artifact: "spec.md \xA7 FR-003 (resume rules named); AC-3a to AC-3f"
  - code: contracts/mission-status/paths/events.yaml:44
  claim: FR-003 lists resume rules (streamCursor wins over Last-Event-ID) but every AC covers live append, drops, truncation, refusals, unscoped and heartbeat. Nothing proves a valid cursor replays exactly
    the events after it, that the precedence rule holds, or that multiple appended rows arrive in log order each with its own id. AC-3a gives no time bound, so a polling-versus-watch implementation cannot
    be told apart and tests will either hang or flake.
  remediation: 'Add ACs: (a) connect with cursor C after N appended rows, receive exactly the later forwarded rows in order with ids; (b) send both streamCursor=C1 and Last-Event-ID=C2, assert C1 wins;
    (c) append K rows in one write, assert K events in order; (d) state a latency bound for AC-3a measured by the test with a failing timeout.'
- id: SPEC-VERIFY-005
  lens: MISSION LENS M-D (read-only and drain-independence)
  severity: 4
  title: Read-only ACs cannot notice a write, a lock, or a swallowed write failure; the drain toggle is unnamed
  evidence:
  - artifact: "spec.md \xA7 FR-016 AC-16a, AC-16b, AC-16c; \xA7 FR-010 AC-10a, AC-10c"
  - code: src/specify_cli/cli/commands/_teamspace_mission_state_gate.py:153
  claim: AC-16a passes if the service tries a write, catches the failure and continues; it is also meaningless when CI runs as root and on Windows where directory permission bits do not block creation.
    AC-16b (content hash before and after) misses create-then-delete lock files, mtime and listing changes. 'Takes no lock' has no AC. AC-10a instruments the filesystem port only, so reads or writes that
    bypass the port (springdoc, Spring config, direct java.nio use) are invisible, and AC-10c does not say how a spawn is observed. AC-16c toggles 'the drain setting' without naming the key; the Python
    posture is read via hosted_posture.drain_posture, so a toggle of a key the service never reads is vacuous.
  remediation: Require the filesystem port to record open modes and fail on any non-read open (with a positive control that adds a write); add a read-only mount or non-root path and a before/after fingerprint
    including directory listing and mtimes; name the exact drain config keys and assert the service does not read them (allowlist already covers this) plus a byte-equal test with drain on/off; state the
    spawn-detection mechanism (security manager substitute, ProcessBuilder ArchUnit ban, or strace-free wrapper).
