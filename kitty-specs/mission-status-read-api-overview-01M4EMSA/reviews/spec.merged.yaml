- id: SPEC-VERIFY-001
  lens: Falsifiability / MISSION LENS M-D (cache and cursor)
  severity: 4
  title: AC-7c claims a same-length rewrite is detected by the cursor digest, but the digest covers only the last line
  evidence:
  - artifact: "spec.md \xA7 FR-007 AC-7c; \xA7 Key Entities (Stream cursor)"
  - code: src/specify_cli/status/tail_reader.py:71
  - code: src/specify_cli/status/tail_reader.py:108
  claim: The TailCursor content invariant is the SHA-256 of the single most recently consumed line, not of the log. An equal-length rewrite that alters an earlier line and keeps the final line leaves offset
    and digest unchanged, so a cache keyed by the cursor serves stale counts and the stream sends no log-truncated. AC-7c as written is either unsatisfiable or satisfied only by a fixture that happens to
    change the last line (vacuous). The same blind spot applies to AC-3c content_mismatch.
  remediation: State in FR-007 what the cache key is (cursor plus file size plus mtime, or a full-content digest) and reword AC-7c with two fixtures, one changing the last line and one changing only a middle
    line of equal length, naming which must be detected. If a mid-log rewrite is out of the detection model, say so as a known limit with a Python-parity golden.
