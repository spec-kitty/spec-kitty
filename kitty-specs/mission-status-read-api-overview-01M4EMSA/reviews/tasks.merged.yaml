- id: TASKS-JVM-001
  lens: Gradle task ownership / WP feasibility
  severity: 4
  title: Test partition is unspecified, so the JVM `check` runs binary-dependent smoke/perf classes (or
    never runs the NFR-004 JVM proof)
  evidence:
  - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md \xA7 T012 step 8-9, \xA7 T014 step\
      \ 3"
  - artifact: "tasks/WP12-native-smoke-replay-and-digests.md \xA7 T066 Validation (`./gradlew test --tests\
      \ 'org.speckitty.missionstatus.nativesmoke.*'`)"
  - artifact: "tasks/WP13-performance-ratio-tests.md \xA7 T070 step 4, \xA7 T069 Validation, \xA7 T072\
      \ step 2"
  - artifact: "tasks/WP16-host-origin-smoke-stage-readme-docs-changelog.md \xA7 T080 Validation"
  - artifact: "plan.md \xA7 11 phase 1 row (nativeSmoke registration pointing at a skeleton nativesmoke.NativeSmokeTest)"
  claim: NativeSmokeTest, NativePerfTest and the perf-tagged classes are ordinary JUnit classes in src/test/java
    (packages nativesmoke and perf, owned by WP03/WP12/WP13). WP03 never says that the default `test`
    task (and so `check`, which the jvm job and WP03 T017 run) excludes them, nor how the `nativeSmoke`
    and `nativePerf` tasks are built (Test tasks with a class filter? how `-PnativeBinary` reaches the
    test JVM, since a Gradle -P property is not a system property?). The skeleton NativeSmokeTest (T014
    step 3) asserts that `-PnativeBinary` is set, which is false under `check`, so the WP03 exit gate
    `./gradlew check` is red as specified. Conversely WP12/WP13/WP16 validate with `./gradlew test --tests
    '...nativesmoke.*'` and `perf.*` and WP12 T066 puts pure-JVM digest unit tests in the same package,
    which contradicts any package-level exclusion. T012 step 9 makes the perf-tag decision conditional
    on "the WP02 timing record", but WP02 has no step that measures the 60 s NFR-004 hold (T009 measures
    only stampLedger), so the input does not exist. If the implementer excludes `perf` from `test` and
    registers no other task, the NFR-004 JVM proof (WP13 T070) is run by nothing in CI and the pin of
    T072 step 2 ("check still covers the perf classes unless tagged out") passes vacuously. No later WP
    may edit build.gradle.kts, so this must be settled in WP03.
  remediation: 'In WP03 T012 specify the partition outright: (a) tag NativeSmokeTest and NativePerfTest
    with a dedicated JUnit tag (for example `native-binary`) and exclude that tag from the default `test`
    task; untagged JVM-only tests in the nativesmoke package (digest, requests.json parse, WP12 T066)
    keep running in `check`; (b) register `nativeSmoke` and `nativePerf` as Test tasks that include only
    their tag/class and forward the binary with `systemProperty("nativeBinary", ...)` after a require-property
    check; (c) decide the perf question now (the 60 s hold is fixed by the spec): register `perfTest`
    for the `perf` tag, exclude `perf` from `test`, and make `check` depend on `perfTest`; delete the
    conditional of step 9 or add the missing WP02 measurement; (d) add a pin in T016 that parses build.gradle.kts
    for these registrations and the `check` dependencies; (e) correct the WP12/WP13/WP16 validation commands
    to the tasks that actually run the classes.'
  source: tasks-jvm.findings.yaml
- id: TASKS-JVM-002
  lens: Gradle task ownership
  severity: 3
  title: WP05 adds domain classes before the floor file exists, so `jacocoScopeCheck` (hence `check`)
    is red at the WP05 exit
  evidence:
  - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md \xA7 T012 step 6 (fails on an absent\
      \ floor file once a class exists under either package)"
  - artifact: "tasks/WP05-domain-core-and-ledger-codec.md \xA7 Context (jacocoScopeCheck requires the\
      \ floor file, WP06 writes it) and \xA7 Definition of Done (`check` green 'or the exact shortfall\
      \ is reported')"
  - artifact: "tasks/WP06-application-ports-feed-archunit-portlevel.md \xA7 Context and \xA7 T035 step\
      \ 1 (WP06 creates jacoco-class-floor.properties)"
  - artifact: "plan.md \xA7 11 (every phase leaves the branch green)"
  claim: WP05 is the first WP with classes under org.speckitty.missionstatus.domain, so from WP05 on `jacocoScopeCheck`
    fails on the absent floor file by WP03's own rule. WP06 owns and first writes the file. WP05 therefore
    cannot reach a green `./gradlew check`; its prompt papers over this with "or the shortfall is reported".
    The slice WP05 ends on is red on the mission branch, against the plan's every-phase-green rule, and
    a reviewer cannot tell a real failure from the designed one.
  remediation: Move first creation of jacoco-class-floor.properties to WP05 (add it to WP05 owned_files
    and create_intent) with the `domain` line recorded from the real report, and have WP06 append the
    `application` line; specify in WP03 T012 step 6 that a pattern line may be absent while no class matches
    that pattern. Alternatively make the absent-file tolerance per pattern. Update WP05 Definition of
    Done to require a green `check`.
  source: tasks-jvm.findings.yaml
- id: TASKS-JVM-003
  lens: Java/Gradle WP feasibility; spike matches plan (bundling)
  severity: 3
  title: '`bundleContract` as written (output under `build/`) is refused by the bundler it is meant to
    call'
  evidence:
  - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md \xA7 T012 step 3"
  - artifact: "tasks/WP02-spike-and-decision-record.md \xA7 T006 steps 1-2"
  - artifact: "tasks/WP04-workflow-native-hello-legs-gate-helper.md \xA7 T018 step 4 (jvm job: no Python/PyYAML\
      \ step, only 'bundling per mechanism A or B')"
  - code: contracts/tools/bundle.py:143
  - code: contracts/tools/bundle.py:144
  - code: contracts/tools/bundle.py:173
  claim: bundle.py returns OUT_INSIDE_REPOSITORY (exit 2) when --out lies inside the git working tree
    (bundle.py:143-144), and `services/mission-status-api/build/...` is inside it. WP02 T006 step 1 notices
    the clash and asks for a finding, but WP03 T012 step 3 still says the task "writes build/.../contract/openapi.yaml",
    with no mention of a temp output directory, a copy step, the tool's real output path (`<out>/bundle/mission-status/openapi.yaml`,
    bundle.py:173), `--module mission-status`, Gradle input/output declarations (the Python resolver reads
    contracts/_shared and contracts/mission-status, so the task is never up to date-correct without declared
    inputs), or the Python plus PyYAML prerequisites on the jvm job and on the Windows/macOS legs (the
    tool imports PyYAML and contract_resolver). An implementer following WP03/WP04 literally gets exit
    2 on the first `processResources`.
  remediation: 'Amend WP03 T012 step 3 (mechanism A): the task runs `python contracts/tools/bundle.py
    --root contracts --module mission-status --bundle-only --out <fresh dir under java.io.tmpdir>`, copies
    the single file `bundle/mission-status/openapi.yaml` into the generated resources dir, declares contracts/mission-status/**,
    contracts/_shared/** and contracts/tools/bundle.py plus contract_resolver.py as inputs, and fails
    with a message on a non-zero exit. Add to WP04 T018/T019 an explicit Python plus `pip install pyyaml`
    (or setup-uv) step on every leg that runs Gradle, or state that mechanism B replaces it. Have WP02
    T006 record the exact command line, not just a decision.'
  source: tasks-jvm.findings.yaml
- id: TASKS-JVM-004
  lens: Spike fallback does not invalidate downstream scopes
  severity: 3
  title: Bundling fallback B has no local/dev story and silently changes the gate, nightly and AC-11d
    procedure
  evidence:
  - artifact: "tasks/WP02-spike-and-decision-record.md \xA7 T006 step 3-4"
  - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md \xA7 T012 step 3 (mechanism B: downloaded\
      \ file accepted after SHA-256 check) and \xA7 T017 step 1 (`./gradlew check` green on the workstation)"
  - artifact: "tasks/WP10-http-routes-sse-contract-wiring.md \xA7 T055 step 2 (AC-11d: run the bundler\
      \ into a temp dir and compare)"
  - artifact: "tasks/WP14-nightly-corpus-comparison.md \xA7 T074 step 2 (bundling step 'per the WP02 mechanism')"
  - artifact: "tasks/WP04-workflow-native-hello-legs-gate-helper.md \xA7 T019 step 3 (gate needs: [jvm,\
      \ native])"
  claim: 'If the three-leg proof fails and B is adopted: (1) `bundleContract` only accepts a downloaded
    file, so a plain local `./gradlew check` (WP03 T017, quickstart, every WP validation) has no input
    and fails; (2) the AC-11d test as written in WP10 runs the bundler, which is exactly what B avoids
    on the legs, so the equality procedure is different per mechanism but only one is written; (3) a new
    `contract-bundle` job changes the pinned `needs` sets of the jvm/native/gate jobs (WP04 pins) and
    the nightly job, which runs on `schedule` where the legs are skipped, has no artifact to download.
    None of this is assigned to a WP, so a fallback flip is not a drop-in.'
  remediation: Specify B so that `bundleContract` runs bundle.py itself whenever the CI-supplied property
    (-PcontractBundleFile plus -PcontractBundleSha256) is absent, and verifies the file otherwise; state
    in WP10 T055 that under B the AC-11d test compares the served bytes with the verified artifact hash,
    plus a local bundler run when python is present; state in WP04 that B adds `contract-bundle` to the
    needs of jvm, native and gate and to the pins, and in WP14 that the nightly runs bundle.py itself
    (it already installs uv and PyYAML).
  source: tasks-jvm.findings.yaml
- id: TASKS-JVM-005
  lens: Java/Gradle WP feasibility (native test wiring)
  severity: 3
  title: Native test wiring spike omits Spring AOT test processing, and the tag-filter fallback has no
    owned location
  evidence:
  - artifact: "tasks/WP02-spike-and-decision-record.md \xA7 T008 step 5"
  - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md \xA7 T012 step 7, \xA7 T014 step 2,\
      \ frontmatter owned_files"
  - artifact: "tasks/WP10-http-routes-sse-contract-wiring.md \xA7 T058 step 1 ('src/nativeTest/** (or\
      \ the tag-filtered package per the WP02 wiring)')"
  claim: 'The three skeleton native tests (virtual-thread probe, Jackson+SSE round trip) need a running
    Spring context in the native test image. To my knowledge Spring Boot''s AOT test processing (`processTestAot`)
    is registered for the `test` source set, so a custom `nativeTest` source set needs its own AOT task
    and classpath wiring; T008 step 5 spikes only "how to point nativeTest at a dedicated source set"
    and the tag filter, not a @SpringBootTest-style test through either wiring. Separately, if the fallback
    (tag filter on `test`) wins, the skeleton and the real native tests have no defined home: WP03 owns
    only `skeleton/**`, `nativesmoke/**` and `src/nativeTest/**`, and WP10 deletes `skeleton/**`, so the
    tests that must survive (nativeTagFloor 3, then WP10''s real set) would sit in a package that is deleted
    or unowned.'
  remediation: 'Extend T008 step 5: for BOTH wirings run a @SpringBootTest-based @Tag("native") test through
    `nativeCompile nativeTest`, name the AOT task(s) and the executed-count in JUnit XML, and record the
    exact build.gradle.kts snippet. Add a fixed fallback package (for example src/test/java/org/speckitty/missionstatus/nativetagged/**)
    to the owned_files of WP03 (creation) and WP10 (replacement) now, so the choice does not need a frontmatter
    change later.'
  source: tasks-jvm.findings.yaml
- id: TASKS-JVM-006
  lens: Gradle task ownership (WP03 completeness)
  severity: 3
  title: Dependencies/tooling later WPs need are deferred to a WP02 decision that WP02 does not make
  evidence:
  - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md \xA7 T011 step 4 ('the WP02 record\
      \ fixes them')"
  - artifact: "tasks/WP08-filesystem-outbound-adapter.md \xA7 T046 step 1 ('YAML parsing: use the library\
      \ the WP02 record fixed')"
  - artifact: "tasks/WP10-http-routes-sse-contract-wiring.md \xA7 T056 step 2 (AC-11c: copy the contract,\
      \ run generate-and-compile on the copy), \xA7 T055 step 2 (AC-11d)"
  - artifact: "tasks/WP02-spike-and-decision-record.md \xA7 T004-T010 (no step selects a YAML parser or\
      \ Gradle TestKit)"
  claim: WP03 is the only owner of libs.versions.toml, build.gradle.kts and verification-metadata.xml
    and must declare "EVERY dependency any later WP needs". WP03 and WP08 both point at the WP02 record
    for the YAML parser, but WP02 never selects one. WP10's AC-11c (generated mode) needs a nested Gradle
    build of a mutated contract copy (Gradle TestKit/GradleRunner, `gradleTestKit()` in build.gradle.kts,
    a copy of the wrapper, verification metadata and offline resolution) and AC-11d needs a Python subprocess;
    neither is declared or spiked. The result is the exact amendment-to-WP03 path that plan section 11
