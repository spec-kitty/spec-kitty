  remediation: Add to WP02 T004 a step that fixes the YAML library (snakeyaml version managed by the Boot
    BOM, or a stated alternative, with the ArchUnit rule 8 consequence and a native hint) and proves a
    nested GradleRunner build of a copied project under strict verification works (or names the alternative
