  - id: TASKS-FRESH-010
    lens: consistency
    severity: 1
    title: "Overview lane sentence omits that lanes.json also makes lane-planning depend on lane-a and lane-b on lane-planning"
    evidence:
      - artifact: "tasks-overview.md section 1: 'lane-b depends on lane-a only through WP09'"
      - artifact: "lanes.json: lane-planning depends_on_lanes [lane-a]; lane-b depends_on_lanes [lane-a, lane-planning]; src/specify_cli/lanes/models.py docstring: 'Lane IDs that must complete before this lane starts'"
    claim: "Read literally, lane-b (WP03) waits for the whole of lane-a including the 2,500-line WP07, which contradicts the [P] claim for WP07. Claim gating is per WP dependency (dependency_readiness_for_wp), so the claim holds, but the document does not say so."
    remediation: "Add one sentence to section 1: lanes.json depends_on_lanes is informational; claims are gated by WP dependencies, so WP03..WP06 do not wait for WP07."
