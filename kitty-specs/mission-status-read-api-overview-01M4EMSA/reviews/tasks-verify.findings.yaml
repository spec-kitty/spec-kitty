findings:
  - id: TASKS-VERIFY-001
    lens: environment baseline (no JDK/Gradle/GraalVM)
    severity: 4
    title: >-
      Toolchain is fetched into a throwaway scratch dir by WP02 but WP03-WP16 assume it persistently on PATH/JAVA_HOME
    evidence:
      - artifact: "tasks/WP02-spike-and-decision-record.md § Context (Prerequisite) and T004 step 1"
      - artifact: "tasks/WP02-spike-and-decision-record.md § Objective (harness is THROWAWAY, outside the repository, session scratchpad)"
      - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md § T011 Validation, T017 step 1 ('green on JDK 25'), T014 Validation ('if GraalVM is present')"
      - artifact: "tasks/WP05..WP13 Validation lines (./gradlew ... with no provisioning step)"
      - code: "workstation probe: java, gradle and native-image are all absent from PATH; gcc and zlib headers are present; GraalVM CE jdk-25.0.2 linux-x64 tarball and its .sha256 asset exist upstream"
    claim: >-
      WP02 is the only WP that obtains a JDK/GraalVM and Gradle, and it puts them in a session-scoped scratch directory (untrusted-download rule, throwaway harness). Every later WP, run by a different agent session in a lane worktree, runs ./gradlew and needs JAVA_HOME with GraalVM CE 25 (graalvmNative toolchainDetection is off, so the image comes from JAVA_HOME). Nothing installs the toolchain persistently, records where it lives, or tells later WPs to use it. The BLOCKED path covers only "cannot obtain JDK 25" in WP02; it names no owner who unblocks and does not say what WP03+ do when the toolchain is absent in their own session. Result: either every Java WP re-derives its own install (inconsistent versions) or silently skips local verification ("CI is the proof") for work packages whose red-first and revert-fails evidence is local.
    remediation: >-
      Add an orchestrator-owned prerequisite (tasks-overview section 10 and WP02 T004 step 1) that installs, once, GraalVM CE 25.0.2 and Gradle 9.7.1 under a persistent prefix outside the repository (checksum verified against the vendor .sha256, extracted from an empty directory, placeholder path in all committed text), exports JAVA_HOME and PATH in every Java WP brief, and records versions and checksums (no paths) in the research.md environment section. Add to WP03..WP16 a first-step precondition "java -version and ./gradlew --version report the recorded versions, else stop and report BLOCKED (do not substitute another JDK or skip local gates)". State in WP02 BLOCKED who acts (orchestrator/operator) and that WP03 onward stay unclaimed.
  - id: TASKS-VERIFY-002
    lens: environment baseline (no JDK/Gradle/GraalVM)
    severity: 3
    title: >-
      Wrapper generation needs an installed Gradle, which nothing provides (chicken and egg)
    evidence:
      - artifact: "tasks/WP02-spike-and-decision-record.md § T004 step 1 ('Generate a wrapper in the scratch project')"
      - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md § T011 step 3 ('bootstrap with a locally installed Gradle 9.7.1 if no wrapper exists yet')"
      - code: "workstation probe: no gradle on PATH"
    claim: >-
      Both WPs create the wrapper with `gradle wrapper` / `./gradlew wrapper`, which requires a Gradle already installed; T004 only fetches the .sha256 file, and WP03 conditionally assumes a local Gradle 9.7.1. No step downloads gradle-9.7.1-bin.zip, verifies it against the recorded sha256, and unpacks it to run `wrapper`.
    remediation: >-
      In WP02 T004 step 1 add: download gradle-9.7.1-bin.zip into an empty directory, verify against the recorded sha256, unpack, and use that bin/gradle only to run `wrapper --gradle-version 9.7.1 --gradle-distribution-sha256-sum <sha>`; in WP03 T011 step 3 point at that same provisioned install (finding 001) instead of "a locally installed Gradle".
  - id: TASKS-VERIFY-003
    lens: environment baseline / per-AC test strategy
    severity: 3
    title: >-
      Verification-metadata generation needs a local nativeCompile/nativeTest/nativeSmoke run with no precondition check or fallback
    evidence:
      - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md § T015 step 1 (command resolves 'check nativeCompile nativeTest nativeSmoke ... --refresh-dependencies')"
      - artifact: "tasks/WP03-gradle-scaffold-supply-chain-skeleton.md § T014 Validation ('if GraalVM is present, otherwise on the CI leg')"
      - artifact: "tasks/WP02-spike-and-decision-record.md § T008 step 6 (native build of the hello app)"
    claim: >-
      AC-14a/14c depend on a metadata file generated by one Linux x64 run that resolves every configuration, including the native ones. That needs the GraalVM native toolchain locally (native-image, C compiler, zlib headers). T014 treats native as optional ("if present"), T015 treats it as mandatory; the two disagree. If native-image is missing at T015, there is no stated fallback (CI never commits, so a CI-only generation is excluded by the same WP). The preconditions are not verified anywhere (WP02 T008 builds a hello native image but does not record gcc/zlib/native-image availability as a gate for WP03).
    remediation: >-
      In WP02 T008 record explicitly "native-image + C toolchain present and nativeCompile of the hello app succeeded" as a PASS/FAIL gate; in WP03 T015 make that gate a stated precondition (stop and report BLOCKED if it failed) and align T014 (native-tagged tests are executed locally, not optionally). If a workflow_dispatch generation path is acceptable, say so and who commits its output.
  - id: TASKS-VERIFY-004
    lens: per-AC test strategy
    severity: 3
    title: >-
      AC-14b (recorded modified-wrapper-jar CI run) and AC-14c (strict resolution exits 0 on all four legs) have no owning evidence step
    evidence:
      - artifact: "tasks-overview.md § 3.2 (AC-14a-14c, 14e, 14g -> WP03 only)"
      - artifact: "spec.md:357-358 (AC-14b observable: validation step exit status on a branch with a modified jar, recorded once in the PR; AC-14c: strict-mode resolution exits 0 on each of the four legs)"
      - artifact: "tasks/WP04-workflow-native-hello-legs-gate-helper.md § T019 step 2 (verify-only step), § T021 (pins), § T022 step 3 (list of answers to record)"
    claim: >-
      The table assigns AC-14b and AC-14c to WP03, but WP03 has no CI and cannot observe either. WP04 builds the verify-only step but its T022 recording list (runner labels, setup-graalvm, compile wall-clock, bundling, classifier outcomes) does not include the one-time modified-jar negative run of AC-14b nor the four-leg strict-resolution exit statuses of AC-14c. WP04 pins only prove the step exists and is SHA-pinned, which spec AC-14b says is not the whole observable. No WP carries the negative run.
    remediation: >-
      Correct the table (AC-14b: WP04; AC-14c: WP03 for the Linux write plus WP04 for the three verify-only legs). Add to WP04 T022 step 3 and the orchestrator hand-off: a one-time CI run on a scratch branch with a modified gradle-wrapper.jar (job red at wrapper-validation) and the four legs' strict-resolution exit statuses, both recorded in the spike record and the PR notes.
  - id: TASKS-VERIFY-005
    lens: per-AC test strategy
    severity: 3
    title: >-
      AC-1b and AC-1c are covered only by an umbrella range, with no concrete test named
    evidence:
      - artifact: "tasks/WP10-http-routes-sse-contract-wiring.md § T053 ('acceptance test first: AC-1a..1e'; steps 3-5 name only L-rows, cursors, AC-1d scan)"
      - artifact: "tasks-overview.md § 3.2 row 'AC-1a to AC-1e' -> WP10, WP09, WP05"
      - artifact: "spec.md:166-167 (AC-1b: metadata.yaml deleted -> 200, schemaVersion null, health not healthy; AC-1c: missionCount equals count of /missions items)"
    claim: >-
      No WP prompt contains the strings AC-1b or AC-1c as a test with a stated failure condition. AC-1b needs an HTTP-level assertion of status 200 plus schemaVersion null plus health other than healthy for the metadata-absent fixture (goldens in WP09 compare the header but not the "status is 200" clause). AC-1c (count over the same fixture equals the number of /missions items across pages) is nowhere asserted; a header count that disagrees with paging would pass every golden individually.
    remediation: >-
      In WP10 T053 add two named steps with revert-fails: (AC-1b) request /project over the project-header fixture with .kittify/metadata.yaml absent, assert 200, schemaVersion null, health != healthy (revert: return 500 or healthy); (AC-1c) request /project and drain /missions across all pages for a multi-page fixture, assert missionCount equals the item total (revert: count only the first page). Split the 3.2 row so 1b and 1c are listed.
  - id: TASKS-VERIFY-006
    lens: per-AC test strategy
    severity: 2
    title: >-
      Self-referential discovered-count floors and un-guarded literal row tables
    evidence:
      - artifact: "tasks/WP09-golden-suite-on-real-adapter.md § T049 step 2 ('per-class floor' read from manifest.json)"
      - artifact: "tasks/WP11-host-origin-filter.md § T061 steps 1-3 (nine Host rows plus ten E-7 rows, no row-count assertion), § T062 step 1-2"
      - artifact: "tasks/WP08-filesystem-outbound-adapter.md § T042 step 1/4 (inline case list, no count guard)"
    claim: >-
      In WP09 the fixture/golden counts are checked against floors held in the manifest, which is the same data being validated; an emptied manifest, golden tree and fixture tree agree with each other and the suite passes. WP07 holds the independent check but only for Python. In WP11 and WP08 the row tables are the oracle, yet nothing asserts how many rows ran, so a table silently shortened (or a parameter source that yields fewer rows) still goes green.
    remediation: >-
      WP09 T049: also hard-code the per-class minimum counts in the Java test source (or a version-controlled constant outside the manifest) and assert the manifest floor is at least those values. WP11/WP08: assert the executed row count equals the literal table size (9 Host rows, the listed E-7 rows, the Origin rows; the resolver case count) and that every request target was exercised for each row.
  - id: TASKS-VERIFY-007
    lens: targeted validation commands
    severity: 2
    title: >-
      Many Java validations are just "targeted tests" with no Gradle task or --tests filter
    evidence:
      - artifact: "tasks/WP08 T043-T046 Validation, WP10 T054-T057 Validation, WP11 T062 Validation, WP05 T026-T028 Validation (text: 'targeted tests')"
      - artifact: "tasks/WP10-http-routes-sse-contract-wiring.md § T058 Validation (`./gradlew test --tests '*native*'` 'if tag-run is supported')"
    claim: >-
      The lens requires specific Gradle tasks. These subtasks name no class or package filter, so the implementer chooses between a narrow filter and bare `./gradlew test`; the JVM `check` includes the 100-connection and 500-Mission perf tests (WP13), making a bare run slow and unrepresentative. The T058 filter `*native*` is unverified wiring (WP02 T008 step 5 decides it).
    remediation: >-
      Replace each "targeted tests" with the concrete `./gradlew test --tests '<package or class>'` the subtask's tests live in (the packages are already named in the Files lines); for T058 cite the wiring chosen by WP02.
  - id: TASKS-VERIFY-008
    lens: baseline captured before first change
    severity: 2
    title: >-
      Baseline file is orchestrator-owned and absent at tasks time; only WP01 and WP16 consume it and nothing sequences its creation
    evidence:
      - artifact: "kitty-specs/mission-status-read-api-overview-01M4EMSA/research/ is empty (no baseline-red.md)"
      - artifact: "tasks/WP01-campsite-filter-group-test.md § Context (stop and report if absent), T001 step 4"
      - artifact: "tasks/WP04 § T022 step 1 (classify 'against the baseline record'), WP16 § T084 step 6; WP07, WP14, WP15 sweeps cite no baseline"
      - artifact: "tasks-overview.md § 10 (baseline listed as orchestrator-owned, not as a gate)"
    claim: >-
      The design is sound (WP01 refuses to start without it; plan section 6 requires it before WP01), but it is not expressed as a gate in wps.yaml/tasks.md, WP07 (lane-a, runnable after WP01) and the WP14/WP15 sweeps classify reds without pointing at the record, and the baseline's scope (make test-fast plus tests/contract, tests/ci and the sweep list of WP04 T022) is not stated in the WPs, so a sweep file outside the baselined set would be unclassifiable.
    remediation: >-
      Add to tasks-overview section 10 an explicit ordering "baseline-red.md committed (merge-base SHA, command lines, ids, issue numbers) before WP01 is claimed; its target set must include every file in WP04 T022 step 1 and the WP07/WP15 targeted lists"; add one line to WP07, WP14 and WP15 sweep steps: "classify any unexplained red against research/baseline-red.md, never fix or hide".
  - id: TASKS-VERIFY-009
    lens: targeted validation commands
    severity: 2
    title: >-
      WP16 close-out runs make test-fast and whole-repo ruff inside a WP
    evidence:
      - artifact: "tasks/WP16-host-origin-smoke-stage-readme-docs-changelog.md § T084 step 6"
      - artifact: "plan.md section 6 (make test-fast is the orchestrator's baseline command)"
    claim: >-
      Every other WP uses named pytest files; T084 step 6 tells the WP agent to run the repository-wide make test-fast and ruff check/format over '.', and "the router/pin tests of section 5" without listing the files. This is the one place the targeted-only rule is relaxed and it lacks a time bound or an owner distinction (agent vs orchestrator).
    remediation: >-
      Move the make test-fast comparison to the orchestrator-owned section 10 (pre-PR baseline re-run), keep ruff whole-repo only if guarded by `git rev-parse --show-toplevel`, and replace "the router/pin tests of section 5" with the explicit file list used in WP07 T041 step 6 and WP04 T022 step 1.
