    reason: plan.md and data-model.md specify a 30 s queue poll and heartbeat but never set SseEmitter or async request timeout, so the container default of about 30 s applies.
  - id: PLAN-ARCH-JVM-007
    verdict: confirmed
    reason: plan.md says springdoc is build-time only yet pins springdoc-openapi-starter-webmvc-ui and only proposes disabling runtime endpoints by configuration, which keeps the UI webjar in the binary.
  - id: PLAN-VERIFY-001
    verdict: confirmed
    reason: packs.yml has an explicit per-module --deselect list with no entry for test_mission_status_conformance.py and the plan never edits packs.yml, marking packs-gate as No.
  - id: PLAN-VERIFY-006
    verdict: confirmed
    reason: plan.md section 7 says a Q-3 nightly difference is both auto-annotated and fails loudly without defining pass or fail semantics or tying the annotation to a counted ledger.
