new_findings:
- id: PLAN-NEW4-001
  severity: 2
  title: The phase 1 contractdoc test directory has no owner after phase 4a deletes the skeleton route
    it tests, and 4a has no scope for the AC-11d tests
  evidence:
  - 'plan.md section 11 phase 1 row: write scope includes src/test/java/**/{skeleton,contractdoc,nativesmoke}/**
    and the ''contractdoc test that the served bytes equal the bundled document'' against the skeleton
    route in adapter.in.http.skeleton (deleted by 4a)'
  - 'plan.md phase 4a row: test scope is src/test/java/**/{adapter/in/http,config}/**, skeleton/** (deletion
    only) and the native test source set; contractdoc is not listed, yet the row assigns ''the contract-document
    tests (AC-11d)'' to 4a'
  - plan.md 'Write-scope completeness' claims every path of the section 13 tree (which lists contractdoc)
    is owned by exactly one phase; contractdoc is phase 1 alone, so the test either breaks at 4a (its
    target route is deleted) or is edited out of scope
  remediation: Add src/test/java/**/contractdoc/** to 4a's write scope (4a replaces the skeleton test
    with the real AC-11d test against ContractDocumentController), or state that 4a places the AC-11d
    tests under adapter/in/http and deletes contractdoc together with skeleton; amend the 'Write-scope
    completeness' sentence to match.
- id: PLAN-NEW4-002
  severity: 1
  title: Spec E-10 and AC-8c say the nightly names the Mission for any difference; plan section 7 cannot
    do so for a whole-read 500
  evidence:
  - 'spec.md E-10: ''The nightly fails on any Java/Python difference and names the Mission and the class'''
  - 'plan.md section 7 ''No exemption'' bullet and section 14 E-10 row: for a whole-read 500 the Mission
    is not observable over HTTP, so the line names the side, the route and the Problem code'
  remediation: Add one clause to spec E-10 or AC-8c (or a line in plan.ruling.md) that a whole-read refusal
    is named by side, route and Problem code because it is not attributable to a Mission over HTTP, so
    spec and plan state the same contract.
