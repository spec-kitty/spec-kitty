verdicts:
  - id: PLAN-GOV-001
    verdict: refuted
    reason: spec.md line 355 (under FR-015) says "The release artefact is attached by a release step defined in the plan", so the spec does delegate a release step to the plan and the premise that the spec never asks for one is false.
  - id: PLAN-GOV-006
    verdict: confirmed
    reason: plan section 9 says Sonar was "not read; no Sonar access" although scripts/ci/sonarcloud_branch_review.sh is a token-free public-REST reader, and the 1500-line test_contracts_workflows.py and the edited test_ci_corpus_trigger_completeness.py are neither surveyed nor declined with a reason.
  - id: PLAN-ARCH-005
    verdict: confirmed
    reason: plan section 13 says diagnostics ride in per-call ChangeBatch results logged by adapter.in.http while one shared ChangeFeed fans out, and nothing says which level owns occurrence identity or the S6 dedupe state, so AC-4c "one line per occurrence" is underdetermined for N>1 unscoped subscribers.
  - id: PLAN-ARCH-010
    verdict: refuted
    reason: the plan accurately reports the repo's own gate (the test caps the ceiling at GitHub's 20 and counts every *.yml), the practical conclusion that no further workflow file fits is correct, and the finding itself concedes this; it is wording nit with no plan defect.
  - id: PLAN-ARCH-JVM-005
    verdict: confirmed
    reason: plan.md line 80 prescribes `--write-verification-metadata sha256 help`, which only resolves the plugin/buildscript configurations, and "on each OS leg's resolved set" is unspecified for a Linux workstation, so a strict file from that recipe would miss compile/test/native entries.
  - id: PLAN-ARCH-JVM-011
    verdict: refuted
    reason: the cache key includes the byte-derived streamCursor, so a size/mtime read-order skew self-heals on the next lookup, spec FR-007 already says the file key is used only "where the platform exposes it", and the junction point is speculative.
  - id: PLAN-VERIFY-004
    verdict: refuted
    reason: non-vacuity is already guarded by AC-8a (a wrong-ordering perturbation must turn the Java conformance suite red), AC-13a (executed ids equal the file and a recorded floor), AC-6e and AC-15b (per-leg byte equality against goldens), so a silent zero-case green is not left open.
  - id: PLAN-VERIFY-009
    verdict: confirmed
    reason: plan.md line 118 does hedge the architectural-fast row with "only if on the roster" although the CI step runs tests/architectural with --battery-part fast and the guard file exists, so the gate statement is conditional where it should be stated (low severity).
