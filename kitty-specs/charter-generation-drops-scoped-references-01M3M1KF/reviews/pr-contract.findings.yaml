findings:
  - id: PR-CONTRACT-001
    lens: exported-api-change (ReferencesRefreshOutcome type-hint drift)
    severity: 1
    title: Test spy's return-type annotation lies about the widened ReferencesRefreshOutcome return
    evidence:
      - code: "tests/specify_cli/charter_runtime/test_boundary_heal.py:392"
    claim: >
      `refresh_references_if_needed` was widened from `bool` to `ReferencesRefreshOutcome`
      (src/specify_cli/charter_runtime/preflight/references_refresh.py:205,
      src/specify_cli/charter_runtime/preflight/runner.py:554). The test spy wrapping it,
      `def spy(repo_root: Path, cause: str) -> bool:` (test_boundary_heal.py:392), still
      declares `-> bool` while its body (`return original(repo_root, cause)`, line 394)
      actually returns a `ReferencesRefreshOutcome`. Python does not enforce this at
      runtime and the test (test_references_parity_hook_is_installed_and_invoked_after_a_successful_heal)
      passes regardless, but the annotation is now factually wrong and would mislead a
      reader or a future mypy pass (mypy is not currently gated in this repo per the
      sk-doctrine gate table, but the repo's own charter mandates `mypy --strict`
      aspirationally under Technical Standards > Testing Requirements).
    remediation: >
      Change the spy's signature to `def spy(repo_root: Path, cause: str) -> ReferencesRefreshOutcome:`
      to match the widened return type it forwards.
