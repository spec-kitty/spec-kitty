findings:
  - id: PLAN-GOV-001
    duplicate_of: PLAN-VERIFY-001
    lens: Directive (single-canonical-authority / DIRECTIVE_044) — gov; Falsifiability / Baseline honesty — verify
    severity: 4
    title: >-
      WP-CORE's "always-placeholder, uniformly regardless of cardinality/cause" design silently
      contradicts an existing, currently-green, test-pinned behavior contract (Contract C4, issue
      #4785, mission charter-catalog-coherence-01M2XQQF) on the exact same function
      (_render_kind_references), which the plan never discovers, cites, or reconciles.
    evidence:
      - artifact: "plan.md § Phasing & Sequencing, step 2 (WP-CORE)"
      - artifact: "plan.md § The baseline (stated as fact, not a TODO)"
      - artifact: "plan.md § Project Structure (tests/charter/ tree — test_catalog_completeness_4785.py never named)"
      - artifact: "tracer-approach.md § Overall approach / Rejected alternative: a hard fail-closed exit branch"
      - code: "src/charter/activation/compiler.py:1096-1141 (_render_kind_references, docstring lines 1120-1125: \"A miss against the raw repository IS a genuine unresolved reference: it is recorded into diagnostics ... rather than a silent placeholder CharterReference row (contract C4)\")"
      - code: "tests/charter/test_catalog_completeness_4785.py:191-216 (test_render_kind_references_routes_genuine_miss_to_diagnostics_not_placeholder — asserts references == [] at line 215 and the exact diagnostics string at line 216 for a genuine, never-existed miss; both PLAN-GOV-001 and PLAN-VERIFY-001 independently ran `.venv/bin/python -m pytest -q tests/charter/test_catalog_completeness_4785.py` and confirmed 5 passed / currently green on this branch)"
      - code: "kitty-specs/charter-catalog-coherence-01M2XQQF/contracts/behavior-contracts.md:48-58 (\"Contract C4 — Recompiled catalog is complete and stable\" — \"And Given a directive id with genuinely no bundled definition, Then it surfaces through the graph.unresolved diagnostics channel, not as a silent placeholder catalog.references row.\")"
    claim: >-
      Plan.md's WP-CORE (Phasing step 2, part (b): "ALWAYS preserves the id as a placeholder
      CharterReference ... never a second fail-closed exit branch") and tracer-approach.md's
      explicit rejection of a cardinality/cause-conditioned branch both commit to a single, uniform
      mechanism — placeholder-preservation for every unresolved id, regardless of cause
      (scope-filtered OR genuinely-never-existed). This design reads as required by spec.md's own
      FR-001 text, so the design choice itself may well be the intended, correct resolution — but it
      directly and verifiably reverses "Contract C4," a documented, tested, binding behavior
      contract from a prior COMPLETED mission (charter-catalog-coherence-01M2XQQF, issue #4785) on
      the EXACT SAME function WP-CORE rewrites: Contract C4 requires a genuinely-nonexistent id to
      surface ONLY through the diagnostics channel, never as a placeholder catalog.references row —
      and this is pinned today by a real, currently-green regression test
      (test_render_kind_references_routes_genuine_miss_to_diagnostics_not_placeholder). Once WP-CORE
      lands as designed, both of that test's assertions (references == [] and the exact diagnostics
      string) go red. This is a real, unaddressed gap, not a hypothetical: (1) the plan's own stated
      baseline ("51 passed... No pre-existing red in the relevant shards") deliberately excludes
      test_catalog_completeness_4785.py, so the "relevant shards" claim is true only because the
      directly-implicated shard was never run and WP-CORE's own stated green-bar re-check ("the
      existing 51-test baseline... stays green") cannot and will not catch this regression; (2)
      plan.md's Project Structure section lists compiler.py, _catalog_miss.py (reused/unmodified),
      and the new FR-005 test file under src/charter/activation//tests/charter/, but never names
      test_catalog_completeness_4785.py; (3) IC-01's Risks note only anticipates a grep-check for
      the diagnostic STRING format, not the deeper references==[]-vs-placeholder behavioral
      inversion the same test file also pins; (4) neither plan.md, spec.md, nor any tracer anywhere
      mentions "#4785," "Contract C4," "catalog-coherence," or "behavior-contracts.md" (grepped,
      zero hits) — so there is no evidence the planner discovered this contract, let alone made a
      considered decision to supersede it, which the charter's single-canonical-authority principle
      (DIRECTIVE_044: "Reconcile [extend/reference] existing doctrine rather than add a second
      authority") requires to be explicit. An implementing agent following the plan as written will
      hit an unplanned, unexplained test failure mid-WP-CORE with no plan-level guidance on whether
      to update the Contract C4 test-and-doc pair or narrow the new design's scope to
      SCOPE_FILTERED-only — real rework risk exactly where C-011's ATDD red/green discipline is
      supposed to make the WP's scope unambiguous. Meets the high-severity ("contradicts existing
      code") bar: it is verified, not speculative, against live, currently-passing code/tests/docs.
    remediation: >-
      Before WP-CORE starts, plan.md must: (1) explicitly decide and state whether Contract C4's
      "genuinely-missing id stays diagnostics-only, never placeholdered" clause is superseded by
      this mission's FR-001 for the MISSING_ARTIFACT/TYPO_SUSPECTED causes specifically (uniform
      placeholder-always, matching the plan's current design) — or whether WP-CORE's placeholder
      path should apply ONLY to the SCOPE_FILTERED cause (the actual #5257/#5253 defect), leaving
      genuinely-nonexistent ids on the existing diagnostics-only path Contract C4 already covers (a
      narrower, C4-compatible fix that still satisfies FR-001's disjunctive "preserve OR fail-closed"
      wording). (2) Whichever choice is made, name and schedule an update to
      tests/charter/test_catalog_completeness_4785.py AND
      kitty-specs/charter-catalog-coherence-01M2XQQF/contracts/behavior-contracts.md's Contract C4
      text in the SAME WP-CORE commit (not a follow-up), with an explicit cross-reference/rationale
      note describing the supersession — never leave the two texts silently contradicting. (3) Add
      tests/charter/test_catalog_completeness_4785.py to the plan's stated baseline/blast-radius test
      command so WP-CORE's own green-bar verification actually covers the file its design change
      affects.

  - id: PLAN-ARCH-001
    lens: mission-derived (placeholder-always mechanism vs. FR-006/NFR-002 continuity)
    severity: 4
    title: >-
      Plan does not commit to a placeholder-text format for the new DRG-backed-kind placeholders,
      leaving an unresolved tension between NFR-002 (reason-bearing placeholder) and the Edge Case's
      "must not further diverge from the existing placeholder convention" — and provides zero test
      coverage for that specific Edge Case.
    evidence:
      - artifact: "spec.md § Edge Cases — 'A repo whose committed .kittify/charter/charter.yaml already carries the pre-fix \"Definition unavailable\" placeholder baseline'"
      - artifact: "spec.md § Non-Functional Requirements — NFR-002 ('every placeholder entry names the specific kind/id and its reason category ... a reason-less ... diagnostic does not satisfy this requirement')"
      - artifact: "plan.md § Phasing & Sequencing, WP-CORE (step 2) — describes building a placeholder CharterReference but never specifies the placeholder's summary/content text template"
      - artifact: "tracer-approach.md § Overall approach — '_doctrine_yaml_reference ... as the TEMPLATE (not a direct reuse ...)' — deliberately non-committal on the final placeholder text"
      - code: ".kittify/charter/charter.yaml:1343-1348 (and :1457-1462, :1493-1498, :1667-1672, :1691-1696, :1709-1714) — the six #5257 ids' CURRENT committed placeholder entries all read verbatim `summary: Definition unavailable in bundled doctrine.` with no reason/cause distinguishing scope_filtered from missing"
      - code: "src/charter/activation/compiler.py:1505 — `_doctrine_yaml_reference`'s fallback source is `{\"summary\": \"Definition unavailable in bundled doctrine.\"}`, confirming this is the literal existing convention the Edge Case refers to"
      - artifact: "plan.md — FR-006's only stated verification is the 'zero unresolved ids -> byte-identical catalog' inert-path case; no WP, IC, or test exercises regenerating a fixture that already carries the pre-fix 'Definition unavailable' baseline"
    claim: >-
      NFR-002 requires every placeholder entry (not just the diagnostics-list string) to name the
      reason category, which the CURRENT committed baseline text ("Definition unavailable in bundled
      doctrine.") verifiably does not do — confirmed against .kittify/charter/charter.yaml's own six
      existing placeholder rows for the #5257 ids. Making WP-CORE's new placeholder satisfy NFR-002
      therefore necessarily changes the placeholder summary text away from that exact existing
      string for every regenerated repo carrying it, which is precisely the divergence spec.md's Edge
      Case warns against. Plan.md and tracer-approach.md never resolve this tension: they neither
      commit to reusing the exact existing string (which would leave NFR-002 unsatisfied for these
      ids) nor explicitly declare an extension/replacement format as the intended, acceptable
      divergence. No WP or test in the Phasing/Implementation Concern Map sections exercises this
      specific Edge Case at all. An implementer is left to decide this unguided, and a reviewer
      applying NFR-002 literally versus a reviewer applying the Edge Case literally will reach
      opposite verdicts on the same diff.
    remediation: >-
      Before WP-CORE starts, add an explicit decision to plan.md's WP-CORE step (or a new short
      "Placeholder text format" subsection) that either (a) states the new placeholder summary keeps
      the existing literal string "Definition unavailable in bundled doctrine." as a stable prefix
      and appends a reason-bearing suffix (e.g. "Definition unavailable in bundled doctrine. Reason:
      scope_filtered — <detail>"), explicitly reasoning that this extension — not replacement —
      satisfies both NFR-002 and the Edge Case, or (b) states the summary text changes format
      entirely and explicitly overrides the Edge Case's "must not diverge" language as an accepted,
      intentional documented divergence. Either way, add one concrete test to WP-CORE (or WP-ATDD)
      that regenerates a fixture seeded with today's exact baseline row shape for a still-unresolvable
      id and asserts the post-fix output against the chosen format.

  - id: PLAN-ARCH-002
    lens: Reflexivity / Canonical source (IC-02 risk statement)
    severity: 2
    title: >-
      IC-02's "Risks: None identified" understates a real (but gracefully-degrading) gap —
      active_languages is not currently threaded into _build_references / _render_kind_references,
      so classify_scope_filtered_miss's language-naming suggestion may fall back to its generic,
      language-set-less message.
    evidence:
      - artifact: "plan.md § Implementation Concern Map, IC-02 — 'Risks: None identified — the reused primitives are already tested ... and this mission does not modify them.'"
      - code: "src/charter/activation/_catalog_miss.py:261-305 — classify_scope_filtered_miss(artifact_id, active_languages=None) produces a richer suggestion naming the exact active language set when active_languages is supplied, and a generic fallback suggestion when it is None/empty"
      - code: "src/charter/activation/compiler.py:1045-1070 (_build_references) and :1144-1255 (_build_references_from_service) — neither function's signature currently carries active_languages, even though compile_charter itself computes it locally at line 424 and never passes it down to these helpers"
      - artifact: "contracts/charter-generate-json-diagnostics.md § After — the worked example's `detail` text explicitly names the active language set (\"... does not include the active language set ('python').\"), implying the richer, language-set-naming form is the intended output"
    claim: >-
      The contract doc's own worked example for the new unresolved_references JSON field shows a
      detail string naming the concrete active language set, which only happens when
      classify_scope_filtered_miss is called with a non-empty active_languages argument. Today,
      active_languages is computed once inside compile_charter (line 424) and is not threaded through
      _build_references -> _build_references_from_service -> _render_kind_references, so the new
      classify-and-placeholder helper WP-CORE introduces will need a new parameter threaded across
      three call levels to actually produce the contract's documented example output; if the
      implementer misses this, FR-002/NFR-002's minimum bar still passes, but the diagnostic is
      weaker than the contract's own documented example.
    remediation: >-
      Add active_languages as an explicit parameter to _build_references,
      _build_references_from_service, and the new classify-and-placeholder helper (compile_charter
      already computes it once at line 424 and can pass it straight through), and note this
      signature-threading requirement explicitly in IC-02's "Affected surfaces"/"Risks" text. Add one
      assertion in the WP-ATDD or WP-JSON test that the emitted detail/suggestion text for a
      scope_filtered case names the actual active language set, matching the contract doc's own
      worked example.

  - id: PLAN-VERIFY-002
    lens: Revert discipline
    severity: 3
    title: >-
      WP-AUTOREFRESH's planned test home (tests/specify_cli/charter_runtime/preflight/test_references_refresh.py)
      does not exist and is not where the auto-refresh path is actually tested today — the plan
      misses the real, already-built fixture infrastructure it should extend.
    evidence:
      - artifact: "plan.md § Project Structure ('tests/specify_cli/charter_runtime/preflight/ └── test_references_refresh.py  # Extended (or new sibling test) for the auto-refresh fold-in's red-first regression case')"
      - code: "tests/specify_cli/charter_runtime/preflight/ does not exist (ls returns 'No such file or directory' against this checkout's HEAD)"
      - code: "tests/specify_cli/charter_runtime/test_references_parity_refresh.py (the REAL, existing test module for preflight.references_refresh — its own module docstring: 'Covers preflight.references_refresh — WP06's implementation...'; already ships _git_init, _make_generate_subprocess_fake, and _seed_baseline_repo — fixture machinery directly reusable for a red-first test that makes the faked generate call return non-zero)"
    claim: >-
      Plan.md's Project Structure and IC-05 both target
      tests/specify_cli/charter_runtime/preflight/test_references_refresh.py for the WP-AUTOREFRESH
      fold-in's red-first regression test. Neither that directory nor that file exists in this
      checkout. The module under fix is ALREADY covered by a real, non-trivial test file at a
      different path and name — tests/specify_cli/charter_runtime/test_references_parity_refresh.py
      — which already builds exactly the kind of fixture WP-AUTOREFRESH's red-first test needs. This
      is the opposite of IC-04's own diligence for the FR-005 test, where plan.md correctly located
      and cited the real precedent file by name before committing to "extend, don't rebuild." For
      WP-AUTOREFRESH the equivalent verification was not done: the plan names a path that doesn't
      exist and never surfaces the real precedent file, so an implementing agent following the plan
      literally is likely to create a second, duplicate test module rather than extending the real
      one — fragmenting this module's test coverage, contrary to the charter's
      canonical-sources/single-authority standing order (Standing Order #6, DIRECTIVE_044).
    remediation: >-
      Update plan.md's Project Structure / IC-05 to point WP-AUTOREFRESH's red-first test at the
      real, existing file — tests/specify_cli/charter_runtime/test_references_parity_refresh.py —
      naming its _make_generate_subprocess_fake helper as the mechanism to adapt (make the faked
      generate invocation return a non-zero returncode/stderr) rather than inventing a new
      preflight/ subdirectory and file name that has no basis in the current test-tree layout.
