  - id: PR-TESTS-001
    verdict: confirmed
    reason: >-
      Verified the full chain: ci-module-registry.yml's "charter" row (roots
      src/charter/**, src/specify_cli/charter_runtime/**) declares
      test_dirs:[tests/charter, tests/doctrine] only; module-tests.yml:180-186
      makes registry_test_dirs REPLACE (not add to) the tests/{module}
      mirror when non-empty. The "cli" row (roots src/specify_cli/cli/**) has
      no test_dirs at all, so it falls back to the tests/cli mirror, not
      tests/specify_cli/cli/commands. out_of_matrix_test_dirs explicitly lists
      tests/specify_cli/charter_runtime (deferred-promotion, #4732) and
      tests/specify_cli/cli/commands (lift-invariant) as excluded from every
      row. ci-nightly.yml's specify-cli-out-of-matrix job (~line 989-1031)
      confirmed as the only lane running `tests/specify_cli` minus
      registry-claimed dirs. So all three new/extended files
      (tests/specify_cli/charter_runtime/test_references_parity_refresh.py,
      tests/specify_cli/charter_runtime/test_boundary_heal.py,
      tests/specify_cli/cli/commands/test_charter_generate_autotrack.py) sit
      in directories no per-PR module shard collects; only the nightly
      out-of-matrix job reaches them, a day later and disconnected from the
      PR. Nuance for severity/ownership: this blind spot is pre-existing CI
      architecture (the #4732 deferred-promotion ledger already named
      tests/specify_cli/charter_runtime and tests/specify_cli/cli/commands as
      excluded before this PR, and it applies identically to the many
      existing tests already living in those same trees on main) — this
      mission did not create the gap, it only added substantial new coverage
      that falls into an already-known hole. The gap itself is nonetheless
      real and current, not hypothetical.
