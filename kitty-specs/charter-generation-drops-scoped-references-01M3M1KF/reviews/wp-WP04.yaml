      terminology collision a future grep/import-by-name mistake could catch
      on.
    remediation: >-
      Advisory only — no action required for this WP; consider a more
      specific name (e.g. `RefreshAttemptOutcome`) if this surfaces again in
      review of a future change touching either module.
