  - id: WP04-C1-002
    severity: 3
    claim: >-
      T017's fix (`references_refresh.py:247-257`) adds a NEW behavior
      branch beyond what T019's red-first test or the WP brief describe: the
      `except (OSError, subprocess.TimeoutExpired) as exc:` handler now
      constructs and returns `RefreshOutcome(attempted=True, succeeded=False,
      detail=f"...invocation failed: {exc}")` instead of falling through to
      the old unconditional `return True`. This is a real, additional fix
      (pre-fix, a spawn-level OSError/TimeoutExpired also silently fell
      through to `return True`, the same swallow-bug class) but it is
      entirely untested: grep across
      `tests/specify_cli/charter_runtime/test_references_parity_refresh.py`
      and `test_boundary_heal.py` for `OSError`, `TimeoutExpired`, and
      `invocation failed` returns zero hits. CLAUDE.md's Sonar Expectations
      are explicit and binding: "Every new branch/helper needs tests in the
      same PR... When you add or refactor logic, add narrow tests that
      execute the new branches/helpers directly." This branch is untested
      new logic, not itself pinned red-first, so a regression here (e.g. the
      detail string silently swallowing something, or the branch
      accidentally falling back to the old `return True` behavior) would not
      be caught by this WP's test suite.
    remediation: >-
      Add a focused test in `test_references_parity_refresh.py` that
      monkeypatches `subprocess.run` to raise `OSError` (and/or
      `subprocess.TimeoutExpired`) for the targeted `generate` invocation and
      asserts `refresh_references_if_needed(...)` returns
      `RefreshOutcome(attempted=True, succeeded=False, detail=<non-empty,
      names the exception>)`, mirroring the non-zero-exit test already
      added.
  - id: WP04-C1-003
    severity: 2
    claim: >-
      The fold-in commit (88ba1d776) adds `RefreshOutcome.__bool__` (raises
      `TypeError`) per the orchestrator's requested "truthiness guard" — a
      new, deliberate observable contract on a dataclass this WP owns. No
      test exercises it: grep for `__bool__`, `pytest.raises(TypeError)`,
      `bool(outcome)`, `bool(result)` across both touched test files returns
      zero hits. The one place a caller might have hit this coercion
      (`test_boundary_heal.py`'s no-op assertion) was correctly adapted to
      check `.attempted`/`.succeeded`/`.detail` directly instead of
      truthiness — which is the right fix, but it means the guard's own
      contract (raising, not silently coercing) is asserted nowhere.
    remediation: >-
      Add `with pytest.raises(TypeError): bool(RefreshOutcome(attempted=True,
      succeeded=True, detail=None))` (or equivalent) to
      `test_references_parity_refresh.py`, pinning the guard's contract
      directly rather than only via its absence of use.
  - id: WP04-C1-004
    severity: 1
    claim: >-
      The new `references_refresh.RefreshOutcome` frozen dataclass shares its
