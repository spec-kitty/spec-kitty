feedback:
  - id: WP02-C1-001
    severity: 1
    claim: >
      Closeout characterization of the 8 tests/charter/ failures as uniformly the
      "linked-worktree charter-write guard" is imprecise for one node id:
      tests/charter/test_interview_mapping_mission_alias.py::test_synthetic_mission_type_is_picked_up_by_both_rosters
      (test_interview_mapping_mission_alias.py:123) fails with
      `ModuleNotFoundError: No module named 'charter'` from its internal
      `uv run --frozen --no-sync` subprocess, not with the "Refusing charter
      write from linked git worktree" message the other 7 show verbatim.
      Reproduced identically in a throwaway `git clone --no-hardlinks` of the
      lane branch (non-linked checkout): the other 7 flip to PASS there, this
      one still fails the same way, because the throwaway clone (like the lane
      worktree) has no `uv sync`-populated `.venv` for `uv run --no-sync` to
      resolve `charter` against. This is an unsynced-environment artifact
      unrelated to compiler.py/WP02's diff (interview-mapping/mission-type
      code is untouched by this WP, not in owned_files, and the failure mode
      is a missing package install, not a logic path this WP changed) -- not
      a regression, but the closeout prose over-generalizes the cause for
      this one id.
    remediation: >
      Non-blocking. If a closeout/PR note is amended, name this node id's
      true cause (unsynced `uv run` environment) separately from the other
      7's linked-worktree guard, rather than folding all 8 under one label.
      No code or test change required.
