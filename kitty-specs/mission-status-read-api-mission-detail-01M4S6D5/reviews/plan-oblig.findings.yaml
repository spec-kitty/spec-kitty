  FRESH3-002: "partially - reword choice is right and the 3 warm / 4 cold / 1 counts recount correctly against the source only if the routes skip probed() (PLAN-OBLIG-001); amendment leaves a contradicting Fails clause and an ambiguous 'meta.json read' (PLAN-OBLIG-002); P10/P11 unowned (PLAN-OBLIG-003)."
  FRESH3-003: "partially - table is derived from the schemas and Projector and the M7/M14/V18/V19 split is correct; AC-8.4 untestable as worded (PLAN-OBLIG-004), P10/P11 gates missing (PLAN-OBLIG-005), lane/verdict/artifact rows missing (PLAN-OBLIG-006), AC-14.4 V1..V18 clause (PLAN-OBLIG-012)."
  FRESH3-004: "partially - M13/candidate-name decision is sound and tested; but contradicts the unamended FR-004 bullet (PLAN-OBLIG-007) and AC-6.6 is gated before the routes exist, helper premise wrong (PLAN-OBLIG-008)."
  FRESH3-005: "resolved - reword is a real decision, test named, owner P0; minor: AC-21.1 generic assertions need an exemption (PLAN-OBLIG-009)."
  FRESH3-006: "resolved - FR-010, AC-10.3, Count 7, V7 wording exact, test and owner named; minor: fixture target must exist (PLAN-OBLIG-010)."
  FRESH3-007: "resolved - deliberate deviation D-76 is correct against FR-009 and the arithmetic recomputes; minor gaps in AC-7.4, the reflection test and the E-1 dependency (PLAN-OBLIG-011)."
