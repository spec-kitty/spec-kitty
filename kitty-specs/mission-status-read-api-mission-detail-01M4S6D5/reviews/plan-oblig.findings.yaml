findings:
  - id: PLAN-OBLIG-001
    lens: Obligations FRESH3-002 (meta.json read count)
    severity: 3
    title: The 3-warm / 4-cold count only holds if the ledger routes skip the existing "probed" step, and the plan never says so
    evidence:
      - artifact: "plan.md § 8 FRESH3-002 (D-71); § 3 readiness-facts row 'Meta reads per request'; § 9 item 1 (MissionLookup / OverviewReader)"
      - artifact: "spec.md FR-001 'Lookup' bullet: the three ledger routes 'then probe the ledger themselves'"
      - code: "services/mission-status-api/.../application/MissionStatusService.java symbol resolve -> probed -> source.stampLedger"
      - code: "services/mission-status-api/.../adapter/out/filesystem/FilesystemMissionEventSource.java ledgerPath -> ReadDirResolver.resolve (reads meta.json through SafeFiles.readRegular on every stampLedger, readLedger and readLedgerFrom call)"
    claim: >
      I recounted from the source. In the existing flow the matched Mission is read by: the scan (readMeta, 1), probed()'s
      stampLedger (resolver read, 2), overview(ref).readMeta (3), ledger() stampLedger (4), and on a cache miss readLedger (5).
      The plan's 3 warm / 4 cold equals this only if the detail routes use the probe-free MissionLookup.find followed directly by
      OverviewReader.overview(ref) and add NO separate probe/stamp. The plan's own fact table (§3) lists the repeated reads but
      omits probed(), and spec FR-001 says the ledger routes "probe the ledger themselves". An implementer who follows the spec
      (a probe step before the head derivation) produces 4 warm / 5 cold and the pinned AC fails by one; an implementer who
      adds nothing satisfies it. The count is a decision about the call sequence, but the call sequence is not stated.
    remediation: >
      In § 8 FRESH3-002 and § 9 item 1, state the sequence of the three ledger routes: MissionLookup.find, the duplicate
      continuation, then OverviewReader.overview(ref) (whose ledger() stamp IS the probe); they never call probed() and never call
      stampLedger/readLedger directly. Add that sentence to the amended AC-1.8(c) ("the ledger probe of FR-001 is the stamp inside
      the head derivation, not an extra call"). Add to the § 3 fact table that resolve() also reads meta once more through probed().
      MetaReadCountTest must include a stream-route control (resolve + probed: 2 warm) so the difference is visible.

  - id: PLAN-OBLIG-002
    lens: Obligations FRESH3-002 (AC-1.8 amendment wording)
    severity: 3
    title: The AC-1.8(c) replacement leaves the original "Fails if a Mission is read twice" and the Control sentence standing, and counts "meta.json reads" ambiguously for the artifact routes
    evidence:
      - artifact: "plan.md § 8 FRESH3-002 'Spec text' ('AC-1.8(c) becomes ...')"
      - artifact: "spec.md AC-1.8: the sentence 'Fails if a stream answer changes, if an artifact route touches the ledger, if a Mission is read twice, or if the figures are missed ...' and 'Control: ...same number of meta.json reads' follow clause (c) in the same bullet"
      - artifact: "spec.md FR-004 Entry 'readable' + FR-011 table ARTIFACT_FILE (listArtifacts reads every candidate file including meta.json under scope ARTIFACT)"
    claim: >
      (1) The plan replaces only clause (c), but the bullet's closing Fails/Control sentences apply to the whole AC and still say
      "if a Mission is read twice": after the amendment the matched Mission is legitimately read 3 or 4 times, so the AC contradicts
      itself. (2) The new wording says the port "records exactly one read of the meta.json" of the requested Mission on
      listArtifacts/getArtifactContent. listArtifacts reads every eligible file for `readable`, and `meta.json` is an eligible
      artifact (ARTIFACT_FILE), so a literal per-file count is 2 for that Mission (lookup + artifact read), and a
      getArtifactContent for path=meta.json is 2 as well. Only a count by access class (MISSION_META, which the plan's
      MetaReadCountTest uses) gives 1; the AC text does not say so.
    remediation: >
      Make the amendment replace the whole AC-1.8 closing ("Fails if ..." and "Control: ...") as well as (c): "Fails if a stream
      answer changes, if an artifact route touches the ledger, if any Mission other than the requested one is read more than once,
      if the requested Mission's count differs from the figures above, or if the NFR-001 figures are missed." Define the counted
      event as "reads of the access class MISSION_META" and say that the artifact-scope read of meta.json as an artifact is a
      different class and is not counted.

  - id: PLAN-OBLIG-003
    lens: Obligations FRESH3-002 (ownership)
    severity: 2
    title: The per-route meta read counts for getWorkPackage and getWorkPackageDetail have no phase gate
    evidence:
      - artifact: "plan.md § 8 FRESH3-002 'Owner: P9 (ledger routes) and P12 (artifact routes, count 1)'"
      - artifact: "plan.md § 11 exit gates of P10 and P11 (no AC-1.8, no MetaReadCountTest)"
    claim: >
      The decision pins the count on three ledger routes, but only P9 (getMission) lists AC-1.8 in its exit gate. getWorkPackage
      (P10) and getWorkPackageDetail (P11) are the other two ledger routes and nothing makes their counts a gate, so a route that
      re-reads meta.json once more (for example the WorkspaceReader or lanes.json path calling the resolver) passes its phase.
    remediation: >
      Add "MetaReadCountTest rows for getWorkPackage / getWorkPackageDetail" to the exit gates of P10 and P11 and to the § 11
      traceability row for FR-002/FR-003.

  - id: PLAN-OBLIG-004
    lens: Obligations FRESH3-003 (testability of AC-8.4)
    severity: 3
    title: New AC-8.4 demands a fixture for every row of the nullable/strict table, but the fixture classes (6 + 4) cannot cover the rows and one row is declared unreachable
    evidence:
      - artifact: "plan.md § 8 FRESH3-003: AC-8.4 'one fixture for each row of the FR-008 table whose outcome is 200 with a null ... one fixture for each row whose outcome is M7'"
      - artifact: "plan.md § 8 FRESH3-003: classes projection-nulls (Count 6) and projection-refusals (Count 4); row 'lastEventId (Work Package) ... not separately reachable'"
      - code: "tests/contract/_mission_status_payloads.py Projector.strict / strict_list (requirementRefs, trackerRefs, subtasks keys, authored.subtasks, ownedFiles all strict non-null)"
    claim: >
      The table has about 25 rows. Null-outcome rows without a named fixture: reviewCycles[].feedbackReference/artifactPath,
      workspace.laneBranch (separate from laneId), Work Package lastEventId (declared unreachable, so a fixture cannot exist).
      M7-outcome rows without a named fixture among the four refusal fixtures: head missionId/slug/targetBranch, wpId,
      requirementRefs, trackerRefs, authored.subtasks, subtasks map keys, SubtaskEntry.id, review.latestResult.reference. AC-8.1
      covers only the class-3 human fields. So AC-8.4 as worded is unsatisfiable (or is satisfied vacuously by the 10 named
      fixtures), which is the "untestable/vacuous AC" failure the obligation was meant to remove.
    remediation: >
      Either enumerate in AC-8.4 the exact fixtures (row -> fixture name) and size the two classes to match (add the missing
      nulls and the missing strict-list refusals), or reword AC-8.4 to "one fixture for each row listed in its own table, rows
      marked 'not separately reachable' being pinned by a unit test of the mapper instead". Keep a discovered-count guard
      (non-zero, equal to the row count) as § 11 requires elsewhere.

  - id: PLAN-OBLIG-005
    lens: Obligations FRESH3-003 (ownership)
    severity: 3
    title: The projection-nulls / projection-refusals fixtures and AC-8.4 are owned by P9 only; P10 and P11 exit gates do not name them
    evidence:
      - artifact: "plan.md § 8 FRESH3-003 'Owner: P4 ... with the route phases P9, P10, P11 each for its members'"
      - artifact: "plan.md § 11 exit gates: P9 lists 'projection-nulls (getMission fixtures)'; P10 lists AC-2.1..2.6, AC-9.x, wp-prompt-bytes; P11 lists AC-3.x, AC-10.x, AC-8.1; none lists AC-8.4 or projection-refusals"
    claim: >
      Nine of the ten new fixtures (everything except head-dates-nulled) exercise getWorkPackage or getWorkPackageDetail
      (merge-target-branch-path, planning-branch-too-long, lane-id-fails-pattern, override-partial-junk-at, reviewed-at-junk,
      all four projection-refusals). No phase gate that runs after those routes exist requires them, so the obligation's
      tests can be skipped without any phase going red; the "owner" statement is a promise, not a gate.
    remediation: >
      Add the relevant fixtures and "AC-8.4 (this route's rows)" to the exit gates of P10 and P11, and to the § 11 FR-008 row
      (currently "route phases for class 1 to 3 outcomes").

  - id: PLAN-OBLIG-006
    lens: Obligations FRESH3-003 (completeness of the table)
    severity: 2
    title: The nullable-versus-strict table omits the lane, verdict and artifact-reference members although it claims "all rows"
    evidence:
      - artifact: "plan.md § 8 FRESH3-003 table"
      - code: "tests/contract/_mission_status_payloads.py Projector.lane (raises ProjectionError for a lane not in STATUS_LANES; returns None for NON_DISPLAY_LANES) used for history[].fromStatusLane / toStatusLane"
      - code: "contracts/mission-status/schemas/HistoryEntry.yaml (toStatusLane $ref StatusLane, required, non-null), Subtask.yaml / DependencyRef.yaml statusLane (nullable), ArtifactReference.yaml path (required)"
    claim: >
      FRESH3-003 asked for a table "per new-route strict field". Missing rows: history[].fromStatusLane (nullable), history[].toStatusLane
      (non-null; the oracle's lane() can return None for a non-display lane, which breaks the contract and is exactly a "cannot be
      shown" case), SubtaskEntry/DependencyEntry statusLane (nullable), reviewCycles[].verdict, ArtifactReference.path and
      ArtifactEntry.path (non-null ArtifactPath; unrepresentable names are ineligible), review.latestResult.verdict. An
      implementer has no stated outcome (null, 200 or M7) for an unrecognised or non-display lane in history.
    remediation: >
      Add the rows: toStatusLane non-null -> M7 and V18 (oracle None/raise); fromStatusLane and the two statusLane members
      nullable -> null; verdict enums -> reducer-validated, cannot be unrepresentable; artifact paths -> ineligible, never an
      error. Then the "all rows" claim is true.

  - id: PLAN-OBLIG-007
    lens: Obligations FRESH3-004 (cross-reference)
    severity: 3
    title: D-73 narrows M13 to "WP*.md" candidate names, but the unamended FR-004 "File names" bullet says the Work Package index answers 500 for any non-ASCII name met
    evidence:
      - artifact: "plan.md § 8 FRESH3-004 (D-73, 'a non-candidate such as tasks/notes-é.md is not refused'); § 14 S-4 lists FR-012, V15, AC-6.6, AC-4.8, AC-12.1, AC-14.4 but not FR-004"
      - artifact: "spec.md FR-004 'File names (D-31)': 'the artifact routes and the Work Package index answer 500 ... when such a name is met, never omit it'"
    claim: >
      After the fold, the spec states two rules: FR-004 (any non-pure-ASCII name met by the index is a 500) and FR-012 M13 /
      AC-6.6 (only a WP*.md candidate is a 500, a non-candidate is served). The narrowing is sound (both ends of a candidate are
      ASCII, so mangling cannot change candidate-ness), but the plan does not amend the sentence it contradicts, and AC-6.6's
      control ("the non-candidate notes-é.md does not refuse") fails against FR-004 as written.
    remediation: >
      Add an S-4 amendment to the FR-004 "File names" bullet: "...the Work Package index answers 500 when a candidate name
      (starting WP and ending .md) that is not pure ASCII is met (M13); names that are not candidates are not part of the index
      and are never refused by it." Record the reasoning (ends are ASCII) in the amendment.

  - id: PLAN-OBLIG-008
    lens: Obligations FRESH3-004 (testability / ownership)
    severity: 3
    title: AC-6.6 is gated at P6 but needs the three routes (P9 to P11); the process leg's helper premise is wrong
    evidence:
      - artifact: "plan.md § 11 P6 exit gate 'AC-6.1 to AC-6.6'; P6 depends only on P5; routes land in P9, P10, P11"
      - artifact: "plan.md § 8 FRESH3-004 'WorkPackageIndexLocaleProcessTest (child JVM via the existing config.AppProcess helper, extended to pass LC_ALL; if the helper cannot pass an environment ...)'; § Unverified item 5"
      - code: "services/mission-status-api/src/test/java/org/speckitty/missionstatus/config/AppProcess.java: package-private final class; launch(Path, Path, Map<String,String> environment, List, List) already puts the environment"
    claim: >
      (1) AC-6.6 asserts that getMission, getWorkPackage and getWorkPackageDetail each answer 500 source_unreadable with one
      diagnostic in a child JVM under LC_ALL=C. No route exists at P6, so the P6 gate cannot run it; the only part P6 can prove
      is the index/stub leg. The route-level proof has no owner (P9/P10/P11 gates do not name AC-6.6). (2) AppProcess already
      accepts an environment, so "extended" and the "cannot pass an environment" fallback are moot, but the class is
      package-private in test package config: a test named WorkPackageIndexLocaleProcessTest placed beside the index
      cannot use it. The plan does not say where the test lives.
    remediation: >
      Split AC-6.6 ownership: the stub leg (NameEncoding/trustworthy stub, WorkPackageIndexLocaleTest) at P6; the three-route
      child-JVM leg at P11 (after P9/P10 exist) or one leg per route in P9/P10/P11. State that the process test lives in
      the config test package (or widen AppProcess visibility as a stated testsupport change) and drop the "if the helper cannot
      pass an environment" branch.

  - id: PLAN-OBLIG-009
    lens: Obligations FRESH3-005 (amendment reach)
    severity: 2
    title: The AC-21.1 assertions (executed floor, rows == failed, redCount) are not exempted for a "not run" module or an absent_on_base module
    evidence:
      - artifact: "plan.md § 8 FRESH3-005 AC-21.1/AC-21.3 amendment; § 14 S-5 and S-12"
      - artifact: "spec.md AC-21.1: 'executed is at least a floor committed in the test ... the rows of a module and base number exactly its failed'"
    claim: >
      The reword of item 2 and the 'zero rows, attribution: unclassified' amendment are real decisions and correct against the
      baseline text. But AC-21.1 as it stands asserts an executed floor and rows == failed for every module of the record; a
      not-run module has executed 0 and failed unknown, and S-12's absent_on_base has executed 0. The amended spec leaves the
      generic assertions in force beside the exception, so a literal test fails on the very record the plan prescribes
      (the plan's own P0 test list covers only 'not run module with rows').
    remediation: >
      Extend the S-5/S-12 wording: "the executed floor, the rows == failed check and the redCount sum apply to modules that were
      run; a module recorded not run or absent_on_base is exempt from them and is checked by the zero-rows / attribution /
      issue assertions instead." Add a P0 control: a not-run module with a nonzero floor passes, a run module with 0 executed
      fails.

  - id: PLAN-OBLIG-010
    lens: Obligations FRESH3-006 (fixture validity)
    severity: 2
    title: The git-entry-symlink fixture must point at an existing target or the V7 divergence is stale
    evidence:
      - artifact: "plan.md § 8 FRESH3-006 (fixtures directory-symlink and git-entry-symlink from PROVISION_PLAN link lines; 'the manifest check that V7's two outcomes differ')"
      - code: "src/specify_cli/workspace/context.py ResolvedWorkspace.exists (checks .git entry existence, following links); oracle uses Path.exists"
    claim: >
      The oracle returns true for a .git symlink only when its target exists; a dangling link gives false on both sides, so the
      Java strictness would not diverge and the V7 entry would fail the AC-14.4 'stale entry' check. The plan does not say what
      the link points to.
    remediation: >
      State in the fixture row that git-entry-symlink links to an existing file or directory inside the fixture (provisioned by
      the plan), and add a negative control with a dangling link whose oracle and Java outcomes agree (false).

  - id: PLAN-OBLIG-011
    lens: Obligations FRESH3-007 (deviation D-76)
    severity: 2
    title: D-76 deviation is sound but leaves AC-7.4 un-amended, the reflection test is name-based, and the NFR-002 sentence presumes the unresolved E-1
    evidence:
      - artifact: "plan.md § 8 FRESH3-007 (D-76), test list; § 14 S-7, S-13, E-1"
      - artifact: "spec.md FRESH3-007 remedy names AC-2.1/AC-7.4; FR-009 ('the body that FrontmatterManager.read returns' of the authored file)"
    claim: >
      Verified: promptMarkdown is the body of the authored (frontmatter) file, which is the winning file the builder captures, so
      single-pass capture is equivalent to the preferred second read, and the arithmetic (1 MiB buffer + 2 MiB decoded + 2 MiB
      body + 6.3 MB escaped JSON, about 11 MiB) recomputes. Remaining defects: (a) AC-7.4 (instrumentation complete), which the
      obligation names, gets no wording, so the 'one READ per file' assertion lives only in AC-2.1; (b) the 'no component of
      IndexedWorkPackage is a body' test inspects a String named body/prompt or a byte[], which a String named 'text' evades; the
      access-set count is the real guard, so the reflection test adds little; (c) the amended NFR-002 text says the call 'passes
      the admission gate', which is operator-gated (E-1) and may be declined, leaving the two texts contradictory.
    remediation: >
      Add one clause to AC-7.4 ("a Work Package file is read once per request"); replace the name-based reflection test with a
      component-type allowlist (no String/byte[]/CharSequence component beyond named frontmatter fields) or drop it in favour of
      the count test; write the NFR-002 sentence in two forms (gated / ungated) keyed to the E-1 outcome so tasks do not wait.

  - id: PLAN-OBLIG-012
    lens: Obligations FRESH3-003 (cross-reference)
    severity: 2
    title: AC-14.4 still reads "each row V1 to V18" after V19 is added; S-3 says only "AC-14.4 map"
    evidence:
      - artifact: "spec.md AC-14.4 first clause 'one knownDivergence entry for each row V1 to V18 above'"
      - artifact: "plan.md § 14 S-3; § 8 FRESH3-003 ('AC-14.4's row-to-entry map gains M7 to V18 and M14 to V19')"
    claim: >
      The plan extends the row-to-entry map but not the opening clause that fixes the entry count at V1..V18, so the
      amended spec would require 18 entries while the manifest holds 19 (and the stale-entry check would then be ambiguous).
    remediation: >
      List "AC-14.4 first clause: V1 to V19" in S-3 (and "V1 to V19" is already used in plan § 3, so only the spec side
      needs the edit).

summary_table:
