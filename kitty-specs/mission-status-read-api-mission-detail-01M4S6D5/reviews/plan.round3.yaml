- id: PLAN-FRESH-010
  lens: write-scope
  severity: 2
  title: Ordering of research.md and data-model.md writers contradicts the phase graph, and the hand-DTO
    drift reference has no owner
  evidence:
  - artifact: plan.md header ('the phases that need a spike record (P2, P3, P6) create research.md and
      data-model.md ... as their first commit'); shared-file table (research.md owner P2, P6 appends;
      data-model.md owner P3a, P4 and P4b append); Unverified 3 ('P3 writes it into data-model.md as its
      first commit')
  - artifact: "plan.md \xA7 11 P2 go/no-go rule ('a hand drift reference'), row P2 (ContractDriftProbe\
      \ is P2's), rows P10 to P12 (hand DTO records are theirs)"
  claim: '(a) P4 appends sections to a data-model.md that P3a creates, but P4 does not depend on P3a (they
    are concurrent), and P6 appends to research.md without depending on P2 (P2 || P5, P6 after P5 and
    P4). The header and Unverified 3 also still name P3 as the creator of data-model.md. (b) A hand-written
    DTO is owned by the route phase that maps it, but its ''hand drift reference'' lives in ContractDriftProbe
    and ContractDriftNestedBuildTest, which only P2 owns, and P2 cannot reference a record that does not
    yet exist; P10 to P12 have no scope or named edit for those two files.

    '
  remediation: 'Add P3a to P4''s and P2 to P6''s Depends-on (or give each its own file), fix the two stale
    phrases, and either give P10 to P12 a named edit on ContractDriftProbe and the nested-build test,
    or make P2 produce the hand records for every model it sends to hand mode.

    '
- id: PLAN-FRESH2-001
  lens: gates-and-pins
  severity: 4
  title: P2 (models list, hand DTO package) turns three tests/ci pins red; the pins belong to P13 and
    sit outside C-004
  evidence:
  - artifact: plan.md section 11, P2 row (extend the explicit models list; P2 writes every hand-DTO record
      into adapter.in.http.dto); shared-file table row 'tests/ci/test_mission_status_*.py | P13 | none'
  - artifact: spec.md C-004 (tests/ci mission-status pinning tests only if the router or workflow edits
      require it)
  - code: tests/ci/test_mission_status_api_build.py MODELS_LIST (line 53) and generation_violations (needle
      '"models" to "<MODELS_LIST>"', line 362)
  - code: 'tests/ci/test_mission_status_api_build.py contract_package_violations (line ~1300: CONTRACT_MODE
      == ''generated'' and ''dto'' in http_dirs -> ''the hand-mode dto package must not be populated'')'
  - code: services/mission-status-api/build.gradle.kts line 89 (the models list literal)
  claim: The build pin hard-codes the exact eleven-model list and, in generated mode, forbids a populated
    adapter/in/http/dto directory. P2 extends the list (first pin red at the P2 tip) and the plan itself
    says the WorkPackage model is "certainly" a hand record in adapter.in.http.dto (second pin red). The
    plan gives P2 no write access to the pin file (P13 is its only owner, "none" other writers), P2's
    exit gate does not run tests/ci, and C-004 admits tests/ci pin edits only when a router or workflow
    edit requires them, which neither P2 change is. So the plan's "every phase leaves the branch green"
    is false from P2 on, and the only way to green is an out-of-scope edit the plan neither assigns nor
    declares as a spec amendment.
  remediation: Add a named edit for P2 on tests/ci/test_mission_status_api_build.py (MODELS_LIST, the
    dto-directory clause and the CONTRACT_MODE semantics for a mixed generated plus hand mode), put the
    test file in P2's exit gate, and add an S row widening C-004 to cover "pin edits that follow a build.gradle.kts
    models-list or hand-DTO change". Update the shared-file table (owner P13, other writer P2) and the
    Charter Check scope row.
- id: PLAN-FRESH2-002
  lens: sequencing
  severity: 3
  title: 'P6 cannot reach its exit gate: AC-6.1 symlink and directory cases need P7''s provisioning, and
    P6 does not depend on P7'
  evidence:
  - artifact: plan.md section 11, P6 row (Depends on P5, P4, P3, P2; gate 'AC-6.1 to AC-6.5 (corpus wpm-01..28)')
      and P7 row (owns ProvisionPlan, the detail-aware FixtureFactory)
  - artifact: 'plan.md section 11 ''Concurrent sets'': ''P6 || P7 once both are unblocked'''
  - artifact: spec.md AC-6.1 cases (22) a directory named WP05-d.md and (23) a symlink named WP06-l.md;
      D-42 (links are never committed, they are provisioned from a plan)
  - code: services/mission-status-api/src/test/java/org/speckitty/missionstatus/testsupport/ProjectHeaderMaterialisation.java
      (the only existing plan applier runs SYMLINK_PLAN lines, the plan generalises it to PROVISION_PLAN
      in P4/P7)
  claim: The Java side of the committed provisioning plan (link, gitentry, mtime lines) is applied by
    P7's testsupport. P6's gate runs the whole wpm corpus against the oracle, including a symlinked Work
    Package file, and the plan declares P6 and P7 concurrent. P6 therefore has no way to materialise cases
    22 and 23 (or any PROVISION_PLAN fixture) without either reaching into P7's files or writing a second
    applier, and the plan lists neither.
  remediation: Either add P7 to P6's Depends-on column (P7 depends only on P3, P4, P4b, P5, so no cycle
    arises; P6 then moves after P7 and the "P6 || P7" statement goes), or move ProvisionPlan and the minimal
    materialiser into P5 or P4 and shrink P7 accordingly. Re-derive the concurrent sets and re-run the
    scope check.
- id: PLAN-FRESH2-003
  lens: seam-ownership
  severity: 3
  title: No phase owns how the detail services obtain the reduced ledger entry without a fourth meta.json
    read
  evidence:
  - artifact: 'plan.md section 8 FRESH3-002 (call sequence fixed: find, duplicate continuation, OverviewReader.overview(ref),
      ''nothing else''; 3 reads warm, 4 cold)'
  - artifact: plan.md section 9 item 1 and D-93 (P1 is behaviour-preserving; MissionReadModel 'exposes
      the lookup and the head derivation')
  - artifact: plan.md section 11 P1 and P9 write scopes; shared-file table (OverviewReader.java has no
      entry)
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/application/MissionStatusService.java
      lines 263-275 and 332-357 (overview(ref) returns Optional<MissionOverview>; the ProjectionCache.Entry
      is consumed inside; ledger(ref, mid8) is a second stampLedger plus meta resolution)
  claim: 'getMission, getWorkPackage and getWorkPackageDetail need the per-Work-Package snapshot (StatusSnapshot
    resolved map, lifecycleTypes, lane per WP), not only the MissionOverview head. The extracted overview(ref)
    hands out the head only. A detail service that calls OverviewReader.ledger(ref, mid8) afterwards performs
    one more stampLedger, hence one more ReadDirResolver meta read: 4 warm and 5 cold, which fails the
    pinned AC-1.8(c) count. The needed combined accessor (head plus entry from one pass) is not in P1''s
    behaviour-preserving extraction, is not a named edit of P9, and OverviewReader.java is owned by P1
    only.'
  remediation: State the accessor in section 9 and D-93 (for example overview(ref) returning a record
    of head and Entry, with the existing method delegating) and put it in P1 with its own meta-read-count
    control, or give P9 a named edit of OverviewReader and MissionReadModel in the shared-file table.
    Add the 3/4 count assertion to the P9 gate on the real service, not only on the extracted /missions
    path.
- id: PLAN-FRESH2-004
  lens: ownership
  severity: 2
  title: Stale sentence in P2's go/no-go rule gives the hand-DTO records a second owner
  evidence:
  - artifact: 'plan.md section 11, paragraph ''P2''s go/no-go rule (D-79)'': ''The records are owned by
      the route phase that maps them (the P10 row for WorkPackage; ...)'''
  - artifact: plan.md P2 row ('P2 writes every hand-DTO record that decision names'), P10 row ('the hand
      WorkPackage DTO ... is P2's'), shared-file table row for J/adapter/in/http/dto/**, D-111
  claim: D-111 moved every hand-DTO record, its drift reference and its mutation target to P2; the go/no-go
