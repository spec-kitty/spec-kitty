- id: PLAN-FRESH2-007
  lens: weakened-ac
  severity: 2
  title: 'AC-20.5 and NFR-009 are unevidenced by default: the base figure waits on an operator word, and
    CI has nothing to compare against'
  evidence:
  - artifact: 'plan.md section 6 item 5, section 11 P3 row, E-7 ''Interim behaviour'': ''AC-20.5 and the
      P3 base figure are recorded not run: awaiting the operator ... CI cannot take the base figure'''
  - artifact: spec.md AC-20.5 and NFR-009 (growth over the same measurement taken on the base, recorded
      in traces/)
  claim: With no word the mission ships P3's exit gate naming AC-20.5 while the AC cannot run, and the
    CI perfTest then asserts only the 64 MB ceiling, not the growth over the base the spec defines. The
    plan flags the decision but its default outcome quietly replaces a ratio acceptance criterion with
    an absolute one.
  remediation: Make the class measure its own same-run floor (the same corpus cached with the pre-FR-020
    projection, or a history-less entry) so CI can assert the growth without a recorded base, or state
    in section 14 that AC-20.5 is verified only post-merge and add the S row that says so. Do not leave
    "not run" as the silent default.
- id: PLAN-FRESH2-008
  lens: jvm-locale
  severity: 2
  title: The JVM test leg and Gate G silently assume a UTF-8 sun.jnu.encoding; only the nightly job and
    the native smoke pin it
  evidence:
  - artifact: "plan.md section 8 FRESH3-004 (AC-6.6 fixture tasks/WP01-\xE9.md created at test time and\
      \ served under a UTF-8 locale); section 12 and S-16 (LC_ALL set for the nightly and the smoke binary\
      \ only); section 5 Gate G commands (no locale)"
  - code: services/mission-status-api/build.gradle.kts (test task sets no jnu or LC_ALL; grep for jnu,
      LC_ALL, file.encoding is empty)
  claim: Tests that create or list non-ASCII file names (AC-6.6, the artifact sort corpus with UTF-8 byte
    order) depend on the forked test JVM's locale. Under a POSIX locale file creation throws before the
    service is reached, so Gate G goes red for a reason that is neither the mission's nor a baseline red.
    CI runners default to UTF-8, a local or containerised gate run may not.
  remediation: 'Add "LC_ALL=C.UTF-8 (or an installed UTF-8 locale) must be set for Gate G" to section
    5 and have the affected tests skip with a recorded "not run: precondition unmet" (the D-101 pattern)
    when sun.jnu.encoding is not UTF-8 and the case is not the stub leg.'
