- id: PLAN-FRESH2-005
  lens: contract-vs-ac
  severity: 2
  title: Seam 5 says the cap is enforced 'never by an earlier size', which contradicts AC-5.4 and the
    plan's own OVER_CAP row
  evidence:
  - artifact: 'plan.md section 7.1 row 5: ''The cap is enforced by bytes read (at most cap + 1), never
      by an earlier size'''
  - artifact: 'plan.md section 7.2 OVER_CAP row: ''more than cap bytes were read, or the open handle was
      larger'''
  - artifact: 'spec.md AC-5.4: 262145 bytes is 413 and ''the instrumented port records 0 bytes read for
      it''; AC-7.1: a size 100 at stat and 300000 at read is OverCap with at most cap + 1 bytes read'
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/out/filesystem/SafeFiles.java
      readRegular (size of the open handle checked first, then bytes per chunk)
  claim: 'Both checks are required: the open-handle size short-circuits with zero bytes read (AC-5.4),
    the byte count is the race guard (AC-7.1). Seam 5 is the contract #5533 imports; read literally it
    tells the P5 implementer to drop the handle-size check and read cap + 1 bytes of every oversize file,
    which fails AC-5.4.'
  remediation: Reword row 5 to "enforced by the size of the open handle first (no byte read when it exceeds
    the cap) and by the bytes actually read (at most cap + 1) as the race guard; never by a size read
    before the open".
