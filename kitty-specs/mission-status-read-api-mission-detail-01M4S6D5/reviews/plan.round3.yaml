- id: PLAN-OPERATOR-A3
  lens: operator ruling (binding obligation)
  severity: 4
  title: 'Operator ruling 2026-10-13, #5529 landing finding A3: move stream projection, admission cap
    and head projection behind the port'
  evidence:
  - artifact: operator ruling relayed by the coordinator; full finding text in the landing-squad architect
      report, A3 and A4
  claim: 'Leak projection of the live stream (event allow-list, WP_ID and display-lane drop, instant validation,
    actor-handle projection, refusal-to-diagnostic) lives only in adapter/in/http/EventData.java and EventsController;
    the admission cap (max-connections, admitted counter, shutdown registry) is HTTP-only. The inbound
    port MissionStatusQuery hands out raw Change/LineKind rows (StatusEvent with unprojected reason, reviewRef,
    reasonSource, claimAgent). A second inbound adapter (MCP, #6116) could bypass both. The plan must
    include: (1) an application-layer EventProjection so the port emits a sealed, projected StreamEvent
    (status-transition, lifecycle, log-truncated) instead of Change/LineKind; (2) the admission counter
    moves into the application subscribe path with a port refusal on capacity; (3) the non-ULID -> UNKNOWN_MISSION
    mapping (EventsController.scope()) and the unparseable-cursor detail move into StreamScope / StreamCursorText;
    (4) MissionStatusService.projected / withProjectedDates are extracted into a reusable MissionHead
    projection that the #957 detail routes must use; (5) ArchUnit rule 3 generalised to every adapter.in.<x>,
    with a planted sibling-adapter fixture (also: controllers live only in adapter.in.. with the one error
    controller allow-listed; optionally exclude java.lang.reflect/java.lang.invoke from rules 1b/2b).
    Record in the decision records as: operator 2026-10-13, #5529 landing finding A3.'
  remediation: 'Add a plan section (and phase(s) with write scopes, gates, revert-fails tests, ArchUnit
    fixtures, JaCoCo class counts, spec/#5529-symbol amendments, C-005 coupled-symbol notes) for items
    1 to 5; list the #5529 symbols touched (EventData, EventsController, Change, StreamSignal, MissionStatusQuery,
    MissionStatusService.subscribe, StreamScope, StreamCursorText, ArchitectureRules rule 3) and the necessary
    campsite-vs-functional classification (these are changes to #5529 code that this stacked mission now
    makes: say which phase, and that behaviour of the HTTP stream is preserved byte for byte, pinned by
    the existing stream tests unchanged); make the #5533 reusable-primitives section and the MCP-transport-agnostic
    claims consistent; record decision D-n with the quoted attribution.'
