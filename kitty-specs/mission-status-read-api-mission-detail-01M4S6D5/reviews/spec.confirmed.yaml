- id: SPEC-ARCH-001
  lens: M2 read fence / Contracts
  severity: 4
  title: Path-classified read classes and per-route access sets contradict the artifact routes (spec.md,
    tasks.md, WP files, review cycles, meta.json, lanes.json)
  evidence:
  - artifact: "spec.md \xA7 FR-011 (table, 'The classifier tries the specific classes first; ARTIFACT_DIR\
      \ and ARTIFACT_FILE come last' and the per-route access sets)"
  - artifact: "spec.md \xA7 AC-5.2 control ('spec.md is 200') against \xA7 AC-11.2 ('a READ of spec.md\
      \ (PLANNING_FILE is STAT only)' must be red)"
  - artifact: "spec.md \xA7 AC-4.1 / AC-5.8 / AC-4.3 (artifacts-populated lists tasks/WP01-x/review-cycle-1.md;\
      \ readable is computed by a content read of every entry)"
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/out/filesystem/Allowlist.java:142
      (classify returns the first matching ClassPattern; kitty-specs/<m>/meta.json and lanes.json already
      match MISSION_META and LANES_JSON)
  - code: services/mission-status-api/src/test/java/org/speckitty/missionstatus/adapter/out/filesystem/RecordingAllowlistAccess.java:47
      (the recorder classifies by path alone; it has no notion of route or purpose)
  claim: 'The fence classifies an access by its path, specific classes first. A content read of spec.md
    therefore records PLANNING_FILE (STAT only), of tasks.md TASKS_MD, of tasks/WP01-x.md WP_FILE, of
    a review-cycle file WP_CYCLE_FILE, of meta.json MISSION_META and of lanes.json LANES_JSON. The listing
    and content routes are allowed only ARTIFACT_DIR and ARTIFACT_FILE, and PLANNING_FILE is STAT only.
    So the spec''s own requirements cannot both hold: getArtifactContent of spec.md must answer 200 (AC-5.2
    control, and readable=true in every listing, AC-4.3) while AC-11.1/AC-11.2 require any READ of spec.md
    to fail the fence. The same applies to every file that is both an authored source and an artifact
    (tasks.md, tasks/WP*.md, review-cycle files, meta.json, lanes.json). Implemented as written, either
    the artifact routes cannot read the Mission''s most common artifacts, or the per-route fence is silently
    widened until it asserts nothing. The port of FR-007 takes only a Mission reference, a relative path
    and a cap, so it cannot carry the intent that would disambiguate. The spec also never says how the
    test harness learns which route issued an access (the recorder has no route).'
  remediation: 'Make the class an explicit input of the access instead of a function of the path: the
    port call (or a scoped AllowlistAccess view) carries the read purpose (for example a ReadScope) and
    the recorder records (scope, class, mode). Define ARTIFACT_FILE and ARTIFACT_DIR as scope-addressed
    classes that may cover any eligible path below the primary directory except the two root status records,
    and state the exact precedence: a file read through the artifact scope is checked against ARTIFACT_*,
    not against PLANNING_FILE, TASKS_MD, WP_FILE, WP_CYCLE_FILE, MISSION_META or LANES_JSON. Add the per-request
    route tag to the recorder (a request-scoped marker, serial flow) and write AC-11.1/AC-11.2 against
    (route, scope, class, mode). Keep AC-11.2''s red control for a PLANNING_FILE READ under the planning
    scope only, and add the artifact-scope green control for spec.md, tasks.md and meta.json.'
- id: SPEC-ARCH-002
  lens: Layering / M2 transport-agnostic port
  severity: 4
  title: Rule 13 bars adapter.in.http from domain.projection, which the existing events adapter already
    uses
  evidence:
  - artifact: "spec.md \xA7 AC-13.1 (rule 13: adapter.in.http 'may not depend on domain.reducer, domain.overview\
      \ derivers, domain.projection or adapter.out')"
  - artifact: "spec.md \xA7 FR-013 ('the HTTP controllers hold no logic')"
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/EventData.java:16-17,44,81
      (imports LeakClasses and Projector, builds new Projector(leaks))
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/EventsController.java:34,64,184
      (takes LeakClasses, emits DiagnosticCode.PROJECTION_REFUSED itself)
  - code: services/mission-status-api/src/test/java/org/speckitty/missionstatus/architecture/ArchitectureRules.java:159
      (rule 3 already limits adapter.in.http to application.port.in, domain and itself)
  claim: 'As worded, rule 13 is red on the unchanged production tree: EventData and EventsController (in
    adapter.in.http) use domain.projection and write a diagnostic. AC-13.1 is therefore either unsatisfiable,
    or satisfied only by an unstated exemption that lets a new controller copy the same pattern, which
    is exactly the duplication D-6 forbids for the later MCP adapter. The spec also does not say that
    rule 13 is a tightening of rule 3 (rule 3 already allows the whole of domain), so it is unclear what
    rule 13 adds beyond naming three sub-packages.'
  remediation: 'Rewrite AC-13.1 to state its scope: rule 13 applies to the controllers and mappers of
    the five new operations (a named class set or a package such as adapter.in.http.detail), with the
    events adapter listed as the one recorded exemption and a note that its projection logic is not an
    input of the MCP mission. State rule 13 as: classes that serve the five operations depend on application.port.in
    and on the domain result types only (domain.model, domain.overview result records), never on a deriver,
    reducer, projector or LeakClasses. Make the planted-violation control name the same class set.'
- id: SPEC-ARCH-006
  lens: M2 transport-agnostic port / contracts
  severity: 3
  title: The 'path decoded once' and 'repeated or malformed' rules are transport work the spec does not
    assign or test at the HTTP boundary
  evidence:
  - artifact: "spec.md \xA7 FR-005 ('The path is decoded once at the HTTP layer and judged as decoded';\
      \ 400 for missing, repeated or malformed, including strings that are not UTF-8), \xA7 FR-013 ('path\
      \ decoding rules that the contract fixes ... happens behind the port'), \xA7 AC-5.2"
  - code: contracts/mission-status/parameters/ArtifactPath.yaml (sent once, percent-encoded as any query
      value, decoded once at the HTTP layer)
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/ProblemAdvice.java:42
      (handlers exist for TypeMismatchException and Exception; none maps a missing required parameter)
  claim: 'FR-013 puts ''path decoding rules'' behind the port, but percent-decoding is done by the container
    before the controller runs, and the oracle''s read_content receives the already decoded list (tests/contract/_mission_status_artifacts.py
    read_content, ''the list of values after the one decoding the HTTP layer does''). The spec does not
    say who detects the four transport facts that decide 400: a repeated parameter (a generated Spring
    interface binding a String joins repeated values with commas, so path=a&path=b would reach the port
    as the valid name ''a,b'' and answer 404), a missing parameter (the framework''s own exception, which
    no advice maps to invalid_artifact_path), a percent sequence that is not valid UTF-8 (container-dependent:
    replacement character or dropped parameter, and U+FFFD passes the contract pattern), and ''+'' (space
    under form decoding). AC-5.2 covers ''repeated'' and ''missing'' but not an invalid byte sequence
    or ''+'', and gives no design for catching them. Left implicit, the logic either lands in the controller
    (a duplicate for MCP) or is wrong.'
  remediation: 'Specify the split: the HTTP adapter takes the raw query (all values of ''path'' as a list,
    strict UTF-8 percent-decoding it performs itself or rejects the request) and passes List<String> to
    the port, whose single operation applies the count check and the artifact-path rule (so MCP, which
    has a typed string, passes a one-element list). Add AC-5.2 rows for %ff, an overlong percent sequence,
    a literal ''+'', a repeated value that would join to a valid name, and a missing parameter mapped
    to 400 invalid_artifact_path with the Problem body of the contract. Add a handler for the framework''s
    missing-parameter exception.'
- id: SPEC-ARCH-007
  lens: M2 resource bounds
  severity: 3
  title: Memory and concurrency bounds omit the walk's path set, the 4 MiB tasks.md read and the 1 MiB
    lanes.json, and NFR-002 contradicts FR-011
  evidence:
  - artifact: "spec.md \xA7 OQ-4 / AC-4.4 (walk stops after 100000 entries), \xA7 FR-004 ('No two file\
      \ contents are held at once'), \xA7 FR-011 (TASKS_MD 4 MiB, LANES_JSON 1 MiB), \xA7 FR-003 (tasks.md\
      \ read per request, D-21 no cache)"
  - artifact: "spec.md \xA7 NFR-002 ('the cap plus one byte (262145 bytes) for artifacts and lanes.json-class\
      \ reads'; the test uses 100 content and 10 listing requests, none on getWorkPackageDetail)"
  - code: services/mission-status-api/src/main/resources/application.properties:7 (spring.threads.virtual.enabled=true;
      no limit on concurrent requests for the new routes)
  claim: (1) The listing must sort the whole walk to take the first 1000, so it holds up to 100000 relative
    paths of up to 512 characters per request; NFR-002 measures a 1000-file Mission and so never exercises
    that set. (2) NFR-002 says lanes.json-class reads are 262145 bytes, while FR-011 gives LANES_JSON
    a 1 MiB read; and getWorkPackageDetail reads tasks.md up to 4 MiB plus its decoded string and title
    rows on every call, uncached, for each of the Mission's Work Packages a dashboard opens; no concurrent
    detail requests are in the NFR-002 scenario. (3) A single listing is up to 1000 reads of 262145 bytes
    (about 256 MB of I/O) with no wall-clock or admission limit; virtual threads accept any number at
    once. On loopback this is a self-inflicted hazard rather than an attack, but the spec's stated purpose
    is that no combination exhausts resources.
  remediation: 'Reconcile NFR-002 with FR-011 (name each cap: 262145, 1 MiB, 4 MiB). Add a path-set bound
    to the walk (an entry count already exists; add a cumulative path-character budget, or keep only the
    1001 smallest paths with a bounded heap) and a fixture that walks the bound. Extend NFR-002''s scenario
    to concurrent getWorkPackageDetail on a Mission with a 4 MiB tasks.md and concurrent getMission on
    a 40-file Mission. Add one admission control for the heavy routes (a small semaphore on listArtifacts
    and getWorkPackageDetail, with a 503 or queue decision recorded) or state why none is needed given
    the loopback bind.'
- id: SPEC-ARCH-009
  lens: M2 read fence / determinism
  severity: 3
  title: Non-ASCII file names depend on the JVM's file-name encoding, which the spec and gates never pin
  evidence:
  - artifact: "spec.md \xA7 AC-4.1 (accented name), \xA7 AC-4.2 (U+FF5E against U+1F600), \xA7 NFR-004\
      \ (byte-identical across four OS targets), \xA7 Edge Cases (names that sort differently)"
  - code: services/mission-status-api (rg for sun.jnu.encoding, file.encoding, LC_ALL, LANG finds no setting
      or check in the service or its build)
  claim: On Linux the JDK decodes directory entries and encodes opened paths with sun.jnu.encoding, which
    follows the process locale, not the UTF-8 default of file.encoding. A detached service started from
    a service manager or a container usually has the POSIX locale, where a non-ASCII file name is listed
    with replacement characters and cannot be opened. The listing would then omit it (read as 'vanished'),
    return a mangled path, or answer 404 for the exact path the oracle serves. The spec's fixtures include
    such names but its legs run in whatever locale the runner has, so a green CI can coexist with a wrong
    deployment, and a name that Python lists as ineligible (not valid UTF-8) could be listed in Java as
    a different valid name.
  remediation: 'Add to FR-004/FR-007 a startup check: on non-Windows hosts, if sun.jnu.encoding is not
    UTF-8 the artifact routes answer 500 artifact_listing_unreadable/artifact_unreadable with a path-free
    diagnostic when a non-ASCII or unmappable entry is met (never silently omit), and the README states
    the locale requirement. Add a test leg that runs the artifacts-sort fixture under LC_ALL=C and requires
    the loud refusal, and one under a UTF-8 locale requiring byte equality with the golden.'
- id: SPEC-ARCH-011
  lens: M2 shared primitive / layering
  severity: 3
  title: 'The text-read port is Mission-relative, so the claim that #5533 adds no second reader is unsupported
    and AC-7.3 pins the wrong shape'
  evidence:
  - artifact: "spec.md \xA7 FR-007 ('serves FR-001 to FR-005 and, later, #5533'; methods take 'only a\
      \ Mission reference, a relative path and a cap'), \xA7 AC-7.3, \xA7 User Story 6, \xA7 FR-018"
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/application/port/out/MissionEventSource.java:13-35
      (every existing method takes a MissionRef or nothing; project-level files are read by a separate
      ProjectInputs path)
  claim: 'Governance inputs (charter, doctrine, pack files) are project-level, not below a Mission directory.
    A port whose parameters are a Mission reference and a path relative to it cannot read them, so #5533
    would either add a second reader or widen the port, and AC-7.3 (a unit test that the methods take
    only those three kinds of parameter) would then fail or be rewritten. The spec asserts the reuse without
    showing the shape; it also records no governance file list in the allowlist, so the ''built once''
    argument of Q1 is not checkable.'
  remediation: 'Either define the port over a (scope, relative path) pair where scope is the project root
    or a Mission directory, with the allowlist class and mode as the caller''s declared purpose (this
    also solves SPEC-ARCH-001), or soften FR-007/AC-7.3 to claim only what is verifiable now (the five
    operations) and add a note that #5533 may extend the scope parameter. Remove ''no second reader''
    from AC-7.3''s rationale unless the governance read set is named.'
- id: SPEC-VERIFY-001
  lens: Coverage / M3 read fence
  severity: 4
  title: FR-011 specific-first classes and per-route access sets forbid the reads that FR-004 and FR-005
    require
  evidence:
  - artifact: "spec.md \xA7 FR-011 (class table, 'The classifier tries the specific classes first', 'per-route\
      \ access sets')"
  - artifact: "spec.md \xA7 AC-5.2 control 'spec.md is 200'; AC-4.1 lists tasks/WP01-x/review-cycle-1.md;\
      \ AC-4.3 readable agrees with content"
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/out/filesystem/Allowlist.java:99-113
      (classifier is first-match over specific classes; MISSION_META and LANES_JSON already exist)
  claim: FR-011 classifies a path into the most specific class and gives listArtifacts and getArtifactContent
    only ARTIFACT_DIR and ARTIFACT_FILE. But spec.md is PLANNING_FILE (STAT only), tasks.md is TASKS_MD,
    tasks/WP*.md is WP_FILE, review-cycle files are WP_CYCLE_FILE, and meta.json and lanes.json are the
    existing MISSION_META and LANES_JSON. None of those classes is in the artifact routes' set, and PLANNING_FILE
    forbids READ outright (AC-11.2 requires a READ of spec.md to be red). Yet FR-005/AC-5.2 require spec.md
    to return 200, and FR-004 'readable' (AC-4.3) requires reading every listed file, including the planning,
    WP and review-cycle files. A correct implementation of the artifact routes fails AC-11.1/11.2, and
    one that passes the fence cannot serve the files the artifact ACs name. The two requirement sets cannot
    both be green.
  remediation: 'Decide the overlap explicitly: either ARTIFACT_FILE is the class of every eligible file
    for the artifact routes regardless of any more specific class (classification becomes route-aware),
    or add the specific classes with READ to the artifact routes'' sets with their cap of 262144. Rewrite
    AC-11.1/11.2 so the controls stay meaningful (for example: a READ of spec.md is red during getMission
    and green during getArtifactContent), and add a row to the FR-011 table for meta.json, lanes.json
    and nested status.events.jsonl on the artifact routes.'
- id: SPEC-VERIFY-002
  lens: M3 ArchUnit rule numbers
  severity: 4
  title: Proposed ArchUnit rules 13 and 14 are red on the existing main code
  evidence:
  - artifact: "spec.md \xA7 AC-13.1 (rule 13) and AC-13.2 (rule 14)"
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/EventData.java:16-17
      (imports domain.projection.LeakClasses and Projector)
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/EventsController.java:34-35
      (imports LeakClasses, ProjectionError)
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/application/port/in/Subscription.java:12
      (StreamSignal next(Duration wait) throws InterruptedException)
  - code: services/mission-status-api/src/test/java/org/speckitty/missionstatus/architecture/ArchitectureRules.java:45
      (DEFINED_RULE_COUNT = 12, so 13 and 14 are the next free numbers)
  claim: The rule numbering (12 defined, so 13 and 14) is right, but the rule bodies contradict the code
    they will run over. Rule 13 bars every class of adapter.in.http from depending on domain.projection,
    yet EventData and EventsController, which exist today, depend on it. Rule 14 requires that no public
    method of application.port.in declares a checked exception, yet Subscription.next declares InterruptedException.
    Both rules would be red on day one, or the implementer must silently rewrite the events path of the
    unmerged lane (C-005) or weaken the rule until it passes. The spec says neither.
  remediation: 'Scope rule 13 and 14 to the new types (a named subject: the three new controllers and
    the new port interfaces), or list the existing offenders as an explicit, shrink-only exemption with
    a test that the list cannot grow, or state that the events path is refactored in this mission and
    add the work to FR-013. Keep the planted-violation control.'
- id: SPEC-VERIFY-003
  lens: M3 JaCoCo / falsifiability
  severity: 4
  title: AC-19.3 describes a per-class floor file that does not exist, so its failure modes cannot occur
  evidence:
  - artifact: "spec.md \xA7 FR-019 and AC-19.3 ('per-class floor file lists every new class; a build with\
      \ one floor lowered, or a new class with no floor, fails')"
  - code: services/mission-status-api/src/test/resources/jacoco-class-floor.properties:1-2 (domain=55,
      application=44)
  - code: services/mission-status-api/build.gradle.kts:351-380 (CLASS-element rules at 0.90 line domain
      and application, 0.80 branch domain)
  - code: 'services/mission-status-api/build.gradle.kts:398-417 (jacocoScopeFailures: the file holds the
      minimum number of classes a scope pattern must match)'
  claim: 'The file has two lines, one class-COUNT floor per scope pattern. It lists no class and holds
    no coverage floor. The coverage thresholds are the fixed JaCoCo rules in the build script, applied
    to every class already. Consequences for AC-19.3: ''a new class with no floor fails'' cannot happen
    (a new class is covered by the pattern and just has to reach 0.90), and ''a lowered floor fails''
    is false for the file: lowering the count makes the check weaker and nothing goes red. The AC as written
    is vacuous against the real mechanism.'
  remediation: 'Restate AC-19.3 on what exists: the CLASS rules fail a new domain or application class
    under 0.90 line (domain branch 0.80), and the counts in the properties file are raised to the new
    matched-class count in this mission. Add a falsifiable ratchet, for example a test that the committed
    counts are not lower than the base branch values and equal the current matched count, and a planted
    untested class that turns the build red. Note that adapter packages (the YAML frontmatter decoder,
    the artifact walk) have no JaCoCo rule, and say which gate covers them.'
- id: SPEC-VERIFY-004
  lens: M3 oracle parity (golden honesty)
  severity: 3
  title: The Java-versus-oracle divergence inventory is incomplete and the generator ignores the oracle's
    own files seam
  evidence:
  - artifact: "spec.md \xA7 FR-014 (knownDivergence list), D-9, D-19, D-20, DC-3"
  - code: 'tests/contract/_mission_status_payloads.py:910-920 (read_authored_files: tasks.glob(''WP*.md'')
      with path.is_file(), which follows a symlink and keeps every duplicate)'
  - code: tests/contract/_mission_status_payloads.py:960-968 (build_detail takes files=; the default path
      calls read_authored_files)
  - code: tests/contract/_mission_status_artifacts.py:251-270 (index_missions skips a Mission with unreadable
      meta.json and follows symlinked directories)
  - code: 'tests/contract/_mission_status_detail.py:149-173 (index_work_packages: eligibility, no size
      cap)'
  claim: 'Divergences the spec names: symlinked planning file, changeState, duplicate id on getMission.
    Divergences it builds but does not list: a symlinked WP file (the oracle''s getMission lists it, Java
    skips it); the 1 MiB WP-file cap (500) and the 100000-entry walk bound (the oracle has neither); the
    C3 to C5 rows (Java answers 404/500 when a sibling Mission sorting earlier has a bad meta.json or
    a symlinked directory; the oracle''s index_missions skips them and answers 200); includePrompt 400.
    AC-14.4 only flags a divergence that shows up in an existing fixture, so an unlisted one with no fixture
    is invisible. Separately, build_detail accepts files=, so the generator can pass index_work_packages
    output and get a real oracle golden for the malformed, duplicate and two-selector classes; the spec
    instead records oracle ''raises'' and a Java-only assertion, which makes those goldens self-fulfilling.
    Also C4 makes a valid Mission''s detail depend on the name order of unrelated siblings, with no AC
    for a broken sibling sorting before versus after the requested Mission.'
  remediation: Add a FR-014 table of every intentional Java/oracle delta (name, cause, fixture, oracle
    outcome, Java assertion), including the five above, and make AC-14.4 fail when a Java refusal path
    exists with no entry. Specify that the generator feeds build_detail and build_work_package from index_work_packages
    (files=) so duplicates and skipped files have a true oracle golden. Add an AC with a broken-meta sibling
    before and after the requested Mission.
- id: SPEC-VERIFY-005
  lens: M3 worktreePresent
  severity: 3
