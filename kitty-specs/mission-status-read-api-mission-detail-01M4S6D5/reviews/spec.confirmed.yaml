- id: SPEC-VERIFY-011
  lens: Falsifiability
  severity: 2
  title: Permission-denied fixtures are vacuous when the runner is root
  evidence:
  - artifact: "spec.md \xA7 AC-4.3 (unreadable file, not on Windows), AC-10.3 (permission denied), AC-4.7"
  claim: A chmod 000 file or directory is readable by root, so on a root container the 'unreadable' fixtures
    answer 200 and the assertions either fail spuriously or, if skipped, pass vacuously. The Windows exclusion
