schema: review-confirmed/v1
phase: spec
findings:
- id: SPEC-GOV-002
  lens: M1 operator-fidelity
  severity: 2
  title: The 'operator's list of reads' cited by OQ-6 and D-11 is not part of the verbatim Clarifications
  evidence:
  - artifact: "spec.md \xA7 Clarifications Q4 (line 46) versus OQ-6 (line 63: 'The operator's list of\
      \ reads names a stat of spec, plan and tasks')"
  - artifact: traces/design-decisions.md D-5 versus D-11 ('The operator named frontmatter, review-cycle
      files, a stat of spec/plan/tasks and a stat of .worktrees/<lane>')
  claim: Q4 as recorded verbatim says only that changeState is always unknown and worktreePresent is a
    stat-only read. The list (frontmatter, review-cycle files, stat of spec/plan/tasks, stat of .worktrees)
    that OQ-6 and D-11 attribute to the operator appears nowhere in the binding record, so a reader cannot
    verify the baseline the new read classes are measured against, and the claim that TASKS_MD exceeds
    the ruling rests on an unrecorded source. (The Clarifications blocks themselves are identical in spec.md
    and design-decisions.md D-1..D-6; I could not compare them to the original operator input file, which
    is not in the repository.)
  remediation: Either add the operator's read list verbatim as a further Standing/Q record (copied by
    script, as approach.md says the other blocks were) or cite its source (dispatch or readiness probe,
    by name and date) in OQ-6 and D-11 and say it is not an operator decision of the 2026-10-13 record.
- id: SPEC-GOV-004
  lens: 'M1 operator-fidelity (Standing: transport-agnostic port)'
  severity: 3
  title: FR-005 decodes 'path' at the HTTP layer while FR-013 puts path decoding rules behind the port
  evidence:
  - artifact: 'spec.md FR-005 (line 276: ''The path is decoded once at the HTTP layer and judged as decoded'')
      versus FR-013 (line 402: ''path decoding rules that the contract fixes (path decoded once, the artifact-path
      rule) ... happens behind the port'')'
  - artifact: spec.md AC-5.2 (line 279), AC-13.4 (line 407)
  claim: The Standing record says the controller must hold no logic an MCP adapter would need to duplicate.
    The two requirements place the decode in different layers. A strict reading of FR-005 leaves percent-decoding,
    repeated-parameter and non-UTF-8 detection in the controller (an MCP resource URI would need its own
    copy), while FR-013 says it is behind the port. The plan cannot satisfy both, and AC-13.1 (ArchUnit)
    will not catch it because decoding is not a dependency.
  remediation: 'Split the rule: the HTTP adapter does only what is transport-specific (one percent-decode
    of the query value, and mapping a missing, repeated or undecodable value to a typed ''raw path invalid''
    input); the port takes a decoded String or a typed ArtifactPathInput, and the artifact-path rule (512
    chars, segments, NUL, drive letter, and so on) is applied behind the port. Reword FR-005 and FR-013
    to say the same thing and add a plain-Java caller case for an invalid path to AC-13.3.'
- id: SPEC-GOV-005
  lens: Scope (blast radius) / Directive (shared edits listed, not summarised)
  severity: 3
  title: C-004 and the Reflexivity list of shared edits omit the CI and script surfaces that the ACs require
    editing
  evidence:
  - artifact: 'spec.md C-004 (line 477), Reflexivity (lines 549, 558: ''Landing adds files under services/
      and tests/contract/ ... The shared edits are listed, not summarised'') versus AC-14.5 (line 418),
      AC-19.1 (line 445), AC-14.6 (line 419)'
  - code: scripts/ci/mission_status_corpus_compare.py (exists; AC-14.5 extends it)
  - code: .github/workflows/ci-router.yml:358 (mission-status src import filter that AC-14.6 may touch)
  claim: AC-14.5 extends scripts/ci/mission_status_corpus_compare.py and the nightly run, AC-19.1 raises
    the native-test floor in a workflow, and AC-14.6 may touch the router filter and tests/ci pinning
    tests. None of scripts/ci, the nightly or native workflow files, or tests/ci is in C-004's allowed
    write set (kitty-specs mission dir, services/, tests/contract/), and the Reflexivity list that promises
    completeness leaves them out and says landing adds files only under services/ and tests/contract/.
    Shared CI files are exactly the surface other missions run on; an incomplete list defeats the stated
    purpose of the list.
  remediation: 'Extend C-004''s write set and the Reflexivity list with every file the ACs touch: scripts/ci/mission_status_corpus_compare.py,
    the nightly workflow, the native workflow (--floor), ci-router.yml (conditional), tests/ci pinning
    tests, and the generator imports. Correct the sentence ''Landing adds files under services/ and tests/contract/''.'
- id: SPEC-GOV-009
  lens: Directive (campsite cleaning)
  severity: 2
  title: No opening campsite-clean step for the surfaces the mission extends
  evidence:
  - artifact: '.kittify/charter/charter.md:90-97 (Standing Order 2: campsite-clean the surfaces first,
      as a distinct preceding step)'
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/application/MissionStatusService.java
      (397 lines)
  - code: services/mission-status-api/src/test/java/org/speckitty/missionstatus/architecture/ArchitectureRules.java:45
      (DEFINED_RULE_COUNT = 12, 262 lines)
  claim: The spec extends MissionStatusService, Allowlist, LeakClasses, ArchitectureRules, FilesystemMissionEventSourceProject
    (343 lines) and the conformance generator, and says nothing about the campsite scout the charter requires
    before changing them. The tracer files and squad cadence are present; the tidy-first step is not.
  remediation: 'Add a short process constraint (C-011): the first work package is a behaviour-preserving
