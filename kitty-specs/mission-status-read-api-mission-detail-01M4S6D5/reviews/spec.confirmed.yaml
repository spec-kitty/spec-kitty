- id: SPEC-VERIFY-006
  lens: M3 oracle parity (tasks.md title_rows)
  severity: 3
  title: AC-3.4 corpus omits the Python text semantics that tasks.md parsing depends on
  evidence:
  - artifact: "spec.md \xA7 FR-003 Subtasks, AC-3.4; contrast FR-006 item 3 and D-13 (newline translation\
      \ stated only for WP files)"
  - code: tests/contract/_mission_status_detail.py:272-286 (read_tasks_md decodes bytes with utf-8, so
      a BOM stays and CRLF is not translated)
  - code: tests/contract/_mission_status_detail.py:245-268 and 183-215 (split on \n only; str.strip, \bWP\d{2,}\b
      and T\d{3,} use Unicode whitespace, word boundary and digits)
  claim: Frontmatter and body get an explicit newline and BOM rule, tasks.md gets none. The oracle keeps
    a leading BOM (which breaks the first heading match), keeps \\r on CRLF files, and relies on Python
    strip/\\d/\\b semantics. Java's String.strip, ASCII-only \\d and \\b, BufferedReader line splitting
    and Files.readString differ, so a plausible implementation diverges on CRLF, BOM, NBSP/U+0085/U+2028
    and non-ASCII digits. AC-3.4 lists eight cases and none covers these, so the parity ACs would pass
    for a wrong decoder.
  remediation: 'State the tasks.md decoding rule (UTF-8 strict, BOM kept, split on \\n only, Python whitespace
    and digit classes) and add AC-3.4 cases: CRLF file, BOM file, NBSP and U+0085 around a row, an Arabic-Indic
    digit in a subtask id and in a WP token, and a lone \\r inside a title.'
- id: SPEC-VERIFY-008
  lens: Silent-success
  severity: 3
  title: FR-012 omits stat and lstat failures for planning files, prompt lookup and absent versus unlistable
    tasks/
  evidence:
  - artifact: "spec.md \xA7 FR-012 row M4 (only tasks/ unlistable, WP file, tasks.md, cycle dir, .worktrees\
      \ stat); FR-001 Phases; FR-003 Artifact references; FR-004 'An unreadable file is an entry with\
      \ readable false'"
  - code: tests/contract/_mission_status_payloads.py:963 (build_detail uses Path.is_file(), which turns
      any OSError into false and so into pending/lifecycle fallthrough)
  - code: tests/contract/_mission_status_artifacts.py:285-310 (is_eligible raises any non-absent OSError
      so the caller answers 500)
  claim: The oracle's phase check swallows an OSError (permission denied on spec.md reads as 'not an artifact'),
    while the artifact eligibility rule raises. The spec requires a failed .worktrees stat to be 500 but
    says nothing for a failed stat of spec.md, plan.md or tasks.md (phases), a failed lstat during the
    prompt/spec reference lookup, or a tasks/ directory that is absent (empty, fine) versus a non-directory.
    An implementer following the oracle returns a healthy 'pending' phase for an unreadable file. Also
    a file that is unreadable in the listing is readable:false with no diagnostic and a vanished file
    is omitted with none, so the listing hides read faults.
  remediation: 'Add M-rows: non-absent stat failure of PLANNING_FILE or TASKS_MD on getMission, lstat
    failure in artifactReferences, tasks/ not a directory; each 500 source_unreadable with a diagnostic
    and a fixture (permission-denied needs the precondition in the next finding). Require one diagnostic
    per listing entry set to readable:false for a fault (not for NUL/size/UTF-8/secret). Record the stat-swallowing
    oracle behaviour as a divergence.'
