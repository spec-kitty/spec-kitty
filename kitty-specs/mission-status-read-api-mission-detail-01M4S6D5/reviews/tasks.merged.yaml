- id: TASKS-ORDER-005
  lens: Write scopes (chokepoints serialise)
  severity: 2
  title: Plan claims concurrent appends to R/portlevel-tests.txt 'merge by keeping every line'; git will conflict, and WP13..WP16 are concurrent
  evidence:
  - artifact: 'plan.md shared-file table row R/portlevel-tests.txt: ''concurrent appends merge by keeping every line'''
  - code: .gitattributes:12 and :34 (only kitty-specs/**/traces/*.md has a merge driver; R/portlevel-tests.txt and jacoco-class-floor.properties carry no merge=union)
  - artifact: 'lane graph: lane-l (WP13) and lane-o (WP16) are concurrent; WP14/WP15 concurrent with each other and with WP16; WP11 (PR A) concurrent with WP16'
  - artifact: 'tasks/WP13..WP16 ''Concurrent lanes'' risk: ''Mitigation: rebase, re-read, recount on the merged tree'' (no instruction for portlevel-tests.txt or OutOfScopeRoutesTest conflict resolution)'
  claim: 'Two lanes appending different lines at the end of the same text file produce a textual conflict in a three-way merge. The prompts'' mitigation covers the JaCoCo recount (D-145) but not how to resolve the portlevel list and OutOfScopeRoutesTest removals; the second-merged lane (and the orchestrator at consolidation) hits an unplanned conflict on chokepoint files.

    '
  remediation: 'In WP13..WP16 (and WP11 for jacoco) state the resolution rule: on conflict keep the union of id lines, re-run PortLevelClassSetTest and PortLevelIdsTest; for OutOfScopeRoutesTest keep the intersection of the remaining paths (remove every path any lane removed). Or serialise by merge order explicitly in tasks (orchestrator merges WP13, WP14, WP15, WP16 in that order, each rebasing). Do not claim silent merging.

    '
