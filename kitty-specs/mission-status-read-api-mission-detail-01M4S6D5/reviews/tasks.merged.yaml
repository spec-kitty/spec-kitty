- id: TASKS-ORDER-001
  lens: 'Dependencies correct / lane lineage (mission lens: external dependencies and stacking)'
  severity: 4
  title: WP05 depends only on the planning_artifact WP04, so its lane starts without any of WP01..WP03's code
  evidence:
  - artifact: 'wps.yaml WP05 dependencies: [WP04]; WP04 dependencies: [WP03]; WP04 is the only planning_artifact WP (lane-planning)'
  - artifact: 'plan.md section 11 Depends-on column: P3 depends on ''P3a (and so P1, P1a and P1b)'' - the plan relies on transitivity'
  - code: src/specify_cli/lanes/compute.py:1105-1126 (lane_deps built from DIRECT WP dependencies only; the planning lane is its own node)
  - code: src/specify_cli/lanes/branch_naming.py:560-600 (lane_branch_name('lane-planning') returns the target branch, not a kitty/mission-... lane branch)
  - code: src/specify_cli/lanes/worktree_allocator.py:1602-1672 (_merge_dependency_lane_tips merges only the lane's direct depends_on_lanes; a dependency on the planning lane merges the target branch, which holds no lane-a/b/c commit)
  - code: src/specify_cli/lanes/implement_support.py:757-795 (planning claim waives code-lane ancestry, so WP04 never pulls WP01..WP03 either)
  - artifact: 'reproduced read-only: compute_lanes on the 18 WP frontmatters gives lane-d (WP05) depends_on_lanes=(''lane-planning'',) while lane-planning depends on lane-c; lane-f (WP07), lane-h (WP09), lane-e (WP06) all inherit only from lane-d'
  claim: 'finalize computes one lane per WP, but lane-d (WP05) has lane-planning as its only dependency lane. The planning lane lives in the root checkout on the target branch, so merging it into lane-d''s worktree brings in no commit from lane-a (WP01 campsite), lane-b (WP02 stream seam) or lane-c (WP03 ArchUnit gates). Every later PR A lane (WP06, WP07, WP08, WP09, WP10, WP11, WP12) descends from lane-d, so the whole mission would be implemented on a tree without the campsite, the port seam and the generalised gates, until consolidation. WP05 would then recount the JaCoCo domain line, edit ServiceWiring/ProjectionCache neighbours, and run Gate G / CoupledSymbolsShapeTest against a tree that lacks WP01..WP03, and the final lane merges conflict. The sequencing D-44 (campsite, then the first functional change) is stated in the plan but not enforced in the lane graph.

    '
  remediation: 'Before finalize-tasks bootstraps (SK-310: owned_files/dependency edits after bootstrap are inert), give WP05 dependencies [WP03, WP04] in wps.yaml (and the WP05 frontmatter and the header table), so lane-d depends on lane-c as well as lane-planning and _merge_dependency_lane_tips brings in the lane-a..c chain. Re-run the read-only compute_lanes/finalize --validate-only check and confirm lane-d lists both lane-c and lane-planning. Alternatively (not preferred) record in WP05 a precondition that the orchestrator consolidates lanes a..c into the target branch before WP05 is claimed.

    '
- id: TASKS-ORDER-002
  lens: Write scopes / lane computation (claims about lanes)
  severity: 2
  title: WP08 says it 'shares WP07's lane'; finalize computes 18 distinct lanes (WP07 = lane-f, WP08 = lane-g)
  evidence:
  - artifact: 'tasks/WP08-p4b-resolved-state-goldens.md ''Pull request and dependencies'' line 1: ''WP08 shares WP07''s lane (it depends on it and edits its files by named edit)'''
  - artifact: 'plan.md section 11 shared-file table: ''P4b depends on P4, so it shares P4''s lane'''
  - artifact: 'finalize-tasks --validate-only: lanes_preview count 18, collapse_report total_merges 0; compute_lanes: lane-f=(WP07), lane-g=(WP08) depends on lane-f'
  claim: 'No lane is shared: the manifest has disjoint owned_files and a dependency edge, which yields a separate lane that merges lane-f''s tip. The statement is false and suggests WP08 reuses WP07''s worktree (and that the pair cannot run concurrently with anything that touches the same files).

    '
  remediation: 'Reword WP08 to ''WP08 runs in its own lane (lane-g) after WP07; its workspace merges WP07''s approved tip; the named edits to WP07-owned files apply on top of that tip''. Do not rely on lane sharing in plan section 11 prose either.

    '
