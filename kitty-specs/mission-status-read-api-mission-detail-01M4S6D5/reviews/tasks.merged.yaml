    '
  remediation: 'Correct each reference: WP03 -> ''WP12 (P8)'' and ''WP09 (P5)''; WP02 -> WP12; WP17 ProvisionPlan -> WP10 and detail oracle -> WP07 (file exists today); WP18 PlainCaller -> WP12, portlevel-tests.txt owner -> WP05, AdmissionGateTest -> WP12, PermissionCaseCoverageTest -> WP10. Then grep each prompt once for ''WP[0-9][0-9]'' next to a class name against the owned_files table (a mechanical check).

    '
