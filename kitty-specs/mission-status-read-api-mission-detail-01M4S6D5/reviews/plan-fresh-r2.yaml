      - artifact: "plan.md Charter Check cites ledger entry SK-310; SPEC-KITTY-LEDGER.md carries two SK-310 headings (plan completion guard; finalize-tasks owned_files re-sync), the plan does not say which"
      - artifact: "plan.md section 11 P4 and section 1 CI row: '.gitattributes (one scoped line)'; .gitattributes already carries services/mission-status-api/src/test/resources/conformance/** -text, which covers every new fixture directory"
    claim: >-
      None changes a gate; all three invite a reader to chase something that is not there. The .gitattributes line may
      be dead scope inside the frozen C-004 list.
    remediation: >-
      Correct the line count, name the intended SK-310 (the finalize-tasks one), and either state what the extra
      .gitattributes line adds beyond the existing -text rule or drop it from P4's scope.
