      -> source.stampLedger
  - code: services/mission-status-api/.../adapter/out/filesystem/FilesystemMissionEventSource.java ledgerPath
      -> ReadDirResolver.resolve (reads meta.json through SafeFiles.readRegular on every stampLedger,
      readLedger and readLedgerFrom call)
