  remediation: "In \xA7 8 FRESH3-002 and \xA7 9 item 1, state the sequence of the three ledger routes:\
    \ MissionLookup.find, the duplicate continuation, then OverviewReader.overview(ref) (whose ledger()\
    \ stamp IS the probe); they never call probed() and never call stampLedger/readLedger directly. Add\
    \ that sentence to the amended AC-1.8(c) (\"the ledger probe of FR-001 is the stamp inside the head\
    \ derivation, not an extra call\"). Add to the \xA7 3 fact table that resolve() also reads meta once\
