    \ 1), probed()'s stampLedger (resolver read, 2), overview(ref).readMeta (3), ledger() stampLedger\
    \ (4), and on a cache miss readLedger (5). The plan's 3 warm / 4 cold equals this only if the detail\
    \ routes use the probe-free MissionLookup.find followed directly by OverviewReader.overview(ref) and\
    \ add NO separate probe/stamp. The plan's own fact table (\xA73) lists the repeated reads but omits\
    \ probed(), and spec FR-001 says the ledger routes \"probe the ledger themselves\". An implementer\
    \ who follows the spec (a probe step before the head derivation) produces 4 warm / 5 cold and the\
