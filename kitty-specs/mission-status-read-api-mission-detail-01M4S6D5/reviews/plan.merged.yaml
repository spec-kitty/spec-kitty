    scope) and name the tests that hold the adapter fault branches (ListingTest-style fault injection
    per Kind). Add a phase exit command that counts classes per pattern in build/reports/jacoco/test/jacocoTestReport.xml
    against the two properties lines (the xml `class` elements that jacocoReportClassNames reads), so
