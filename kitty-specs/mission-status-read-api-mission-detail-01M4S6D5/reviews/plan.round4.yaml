      and ReadOnlyFlowTest: existing flows use HttpHarness.start(built) so that the fixture''s recording
      allowlist seam is in the request path'
  - artifact: "plan.md \xA7 11 phase rows P7 (detail-aware FixtureFactory = T/testsupport/FixtureFactory.java,\
      \ port-level), P9-P12 and P13 write scopes (T/adapter/in/http/{flow,hostorigin}/**, DetailRoutesFlowTest),\
      \ and the shared-file table row 'T/testsupport/http/{SpyQuery,StreamRig}.java, T/testsupport/FilesystemFixtureFactory.java\
      \ | P1a | none'"
  claim: 'The detail controllers get their services from DetailInfrastructureWiring and the per-route
    wiring classes, built over the production event source and TextSource; none of that goes through the
    fixture''s RecordingAllowlistAccess. AC-11.1 (full flow records no extra access), AC-16 (read-only),
    AC-17 (guards) and the HTTP golden/recorded-access tests of P9-P13 therefore need HttpHarness (and
    FilesystemFixtureFactory.Built / FixtureHandles) to install the fixture-built MissionDetailQuery,
