    '
- id: PLAN-FRESH3-005
  lens: ArchUnit rule 13 (port package split, PKG ruling)
  severity: 3
  title: Rule 13 is defined differently in section 13 and section 15.4, and the stricter reading is red
    on production nested enums
  evidence:
  - artifact: "plan.md \xA7 13 rule 13 row ('a class in port.in/port.out itself is an interface; every\
      \ class of dto is not an exception; every Throwable under port.. resides in exceptions; no other\
      \ subpackage') versus \xA7 15.4 item 5 table row 'Rule 13' ('exceptions holds only Throwables')"
  - code: "services/mission-status-api/src/main/java/org/speckitty/missionstatus/application/port/in/StreamRefused.java\
      \ (nested enum Kind) and application/port/out/SourceFault.java (nested Kind); plan \xA7 7.1 row\
      \ 6 adds TextFault.Kind"
  - artifact: "plan.md \xA7 11 P1b row: planted controls are DtoInRoot, ExceptionInRoot, ExceptionInDto\
      \ only"
  claim: 'Section 15.4 adds the clause ''exceptions holds only Throwables''. Taken literally every nested
    Kind enum of StreamRefused, SourceFault and TextFault is a non-Throwable class that resides in port.in.exceptions
    or port.out.exceptions (ArchUnit sees nested classes in the package of the outer class), so the production
    run of rule 13 is red at P1b. Section 13 omits the clause, so the two definitions disagree, and neither
    has a planted control for ''a data type in an exceptions package''. The ''interfaces only'' clause
    has the same nested-type exposure for any enum or record nested in a root interface.

    '
  remediation: 'Fix one definition (section 13 and 15.4 identical) and state that nested classes are judged
    by their outermost class. Add the control ''record in port.in.exceptions'' (red on rule 13 only) with
    a non-zero scanned count for the exceptions subpackages, or drop the clause.

    '
