- id: PLAN-OPERATOR-A3
  lens: operator ruling (binding obligation)
  severity: 4
  title: 'Operator ruling 2026-10-13, #5529 landing finding A3: move stream projection, admission cap
    and head projection behind the port'
  evidence:
  - artifact: operator ruling relayed by the coordinator; full finding text in the landing-squad architect
      report, A3 and A4
  claim: 'Leak projection of the live stream (event allow-list, WP_ID and display-lane drop, instant validation,
    actor-handle projection, refusal-to-diagnostic) lives only in adapter/in/http/EventData.java and EventsController;
    the admission cap (max-connections, admitted counter, shutdown registry) is HTTP-only. The inbound
    port MissionStatusQuery hands out raw Change/LineKind rows (StatusEvent with unprojected reason, reviewRef,
    reasonSource, claimAgent). A second inbound adapter (MCP, #6116) could bypass both. The plan must
    include: (1) an application-layer EventProjection so the port emits a sealed, projected StreamEvent
    (status-transition, lifecycle, log-truncated) instead of Change/LineKind; (2) the admission counter
    moves into the application subscribe path with a port refusal on capacity; (3) the non-ULID -> UNKNOWN_MISSION
    mapping (EventsController.scope()) and the unparseable-cursor detail move into StreamScope / StreamCursorText;
    (4) MissionStatusService.projected / withProjectedDates are extracted into a reusable MissionHead
    projection that the #957 detail routes must use; (5) ArchUnit rule 3 generalised to every adapter.in.<x>,
    with a planted sibling-adapter fixture (also: controllers live only in adapter.in.. with the one error
    controller allow-listed; optionally exclude java.lang.reflect/java.lang.invoke from rules 1b/2b).
    Record in the decision records as: operator 2026-10-13, #5529 landing finding A3.'
  remediation: 'Add a plan section (and phase(s) with write scopes, gates, revert-fails tests, ArchUnit
    fixtures, JaCoCo class counts, spec/#5529-symbol amendments, C-005 coupled-symbol notes) for items
    1 to 5; list the #5529 symbols touched (EventData, EventsController, Change, StreamSignal, MissionStatusQuery,
    MissionStatusService.subscribe, StreamScope, StreamCursorText, ArchitectureRules rule 3) and the necessary
    campsite-vs-functional classification (these are changes to #5529 code that this stacked mission now
    makes: say which phase, and that behaviour of the HTTP stream is preserved byte for byte, pinned by
    the existing stream tests unchanged); make the #5533 reusable-primitives section and the MCP-transport-agnostic
    claims consistent; record decision D-n with the quoted attribution.'
  verify_remaining: 'All five items are implemented with phases (P1, P1a, P1b), scopes, gates, revert
    rows, JaCoCo notes, S-22 and D-118 attribution, and the claims about EventData, EventsController,
    Change, StreamSignal, StreamScope, StreamCursorText and rule 3 match the #5529 sources, but section
    15.5 and the P1a gate list RefusalRowsTest as "no edit at all" while its anonymous MissionStatusQuery
    (line 176) returns port.in.ChangeBatch from changesSince and lacks endStreams(), so it cannot compile
    after P1a and it is in no phase''s write scope (the closed list of nine is ten); secondary points
    for the same fold are that FilesystemFixtureFactory.fromTreeWithOrdering reflectively needs the package-private
    seven-argument MissionStatusService constructor taking a ProjectionCache, which the P1 MissionReadModel/ctor
    design never says to keep or pin, and that EventProjection#project(FeedSignal.Truncated) returns a
    bare StreamEvent although EventData.of(Truncated) can raise ProjectionError and the old controller
    dropped the frame with a diagnostic.'
- id: RULING-PACKAGES
  severity: 2
  title: package convention leftovers
  claim: 'The package-split ruling is implemented in substance (sections 1, 7, 13, 15, P1a, P1b, P5, P8
    use port/{in,out}/{dto,exceptions} only, rule 13 and D-130 carry the quoted attribution, no TextFault/TextRefusal/DetailRefusal/FileRef
    remains in a port root) but there are leftovers that contradict it: the shared-file row for ArchitectureRules.java
    (plan line 518) says P1b leaves "rule ids and DEFINED_RULE_COUNT unchanged" and D-124 says the count
    "stays 12 at P1b" while the P1b row, section 13 and D-130 say 12 to 13, section 13 line 700 still
    says "Rule 13''s subject stays adapter.in.http.detail.." (it is rule 14), rule 13''s fourth clause
    (no port subpackage other than dto and exceptions) has no planted control, the P1a scope still names
    the old path port/in/{Change,ChangeBatch} for the git mv and 15.1 cites application.port.in.dto.Change
    as what the checkout shows, and section 1''s "every data type a port exchanges lives in dto" is not
    reconciled with the domain.detail and domain.model records the ports return.'
  remediation: fix as stated, then supersede with the CQRS layout ruling
- id: PLAN-FRESH3-001
  lens: behaviour-preservation / existing tests (P1a)
  severity: 4
  title: P1a moves the stream projection diagnostic from the Spring logging consumer to the fixture service's
    recorder, which turns CanaryScanTest red; the plan claims the canary tests stay green and unedited
  evidence:
  - artifact: "plan.md \xA7 15.2 (table row 'One projection_refused diagnostic per dropped frame ... pinned\
      \ by StreamFaultTest, the canary tests of NFR-003'), \xA7 15.5 (closed edit list), \xA7 11 P1a exit\
      \ gate"
  - code: 'services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/EventsController.java:
      send() and sendTruncation() call the controller''s own Consumer<Diagnostic> (the Spring bean config.LoggingDiagnostics)
      on a ProjectionError'
  - code: 'services/mission-status-api/src/test/java/org/speckitty/missionstatus/adapter/in/http/flow/CanaryScanTest.java
      lines 126-140 and 148-164: StreamRig.over(built) then assertThat(output.getAll()).contains(''code=projection_refused
      mid8=...'') and a count of three such log lines'
  - code: 'services/mission-status-api/src/test/java/org/speckitty/missionstatus/testsupport/FilesystemFixtureFactory.java
      and FixtureHandles.java: the fixture service is built with handles.recorder() (a list-adding consumer,
      no logging) as its diagnostics consumer'
  - code: 'services/mission-status-api/src/test/java/org/speckitty/missionstatus/adapter/in/http/stream/StreamFaultTest.java:
      contains no projection_refused assertion, so it does not pin the behaviour the plan says it pins'
  claim: 'After P1a the projection (and its refusal diagnostic) runs inside EventProjection in the service.
    Under HttpHarness/StreamRig the service is the fixture''s own, whose diagnostics consumer is the in-memory
    recorder, not the application''s logging consumer. The three assertions of CanaryScanTest that read
    the captured log for ''code=projection_refused mid8='' therefore go red, and Gate G (the whole test
    task) is red at the P1a tip. The plan''s ''pinned by'' column names StreamFaultTest (which does not
    test it) and ''the canary tests'' as unchanged and green, and the closed edit list of 15.5 does not
    contain CanaryScanTest or any plumbing that tees the fixture service''s diagnostics to the logger.
    This is a behaviour regression only visible in the test harness, but the contract of ''no existing
    assertion changes'' cannot be met as written.

    '
  remediation: 'Add the diagnostics plumbing to the P1a test-support edits: FilesystemFixtureFactory (P1a
    owns it) builds the fixture service with a consumer that records and also writes the same path-free
    log line as LoggingDiagnostics (or StreamRig installs it), so CanaryScanTest stays byte-for-byte unchanged.
    Name CanaryScanTest in the P1a exit gate and in the ''pinned by (unchanged)'' column, and correct
    the StreamFaultTest attribution. Alternatively list CanaryScanTest as a tenth named edit that reads
    the recorded diagnostics, and say that this changes where an assertion reads from (a C-011 reviewer
    judgement).

    '
- id: PLAN-FRESH3-002
  lens: existing tests that must be edited (P1a)
  severity: 3
  title: RefusalRowsTest is declared unchanged and in the P1a gate, but it implements MissionStatusQuery
    anonymously and cannot compile after the port change
  evidence:
  - artifact: "plan.md \xA7 15.5 ('Unchanged (no edit at all): ... adapter/in/http/rest/RefusalRowsTest'),\
      \ \xA7 15.2 (row 'Every connect-time refusal' lists RefusalRowsTest), \xA7 11 P1a row ('the nine\
      \ files'), Unverified 17"
  - code: 'services/mission-status-api/src/test/java/org/speckitty/missionstatus/adapter/in/http/rest/RefusalRowsTest.java
      lines 180-195: anonymous ''new MissionStatusQuery() { ... public ChangeBatch changesSince(...) ...;
      public Subscription subscribe(...) ... }'''
  claim: 'P1a changes changesSince to return StreamBatch and adds the abstract endStreams(). The anonymous
    class declares the old ChangeBatch return type and has no endStreams(), so the test source set does
    not compile. The file is not among the nine named edits (the grep for port.in.Change/ChangeBatch/StreamSignal/Subscription/changesSince
    over src/test finds ten files, the plan names nine), and 15.5 and 15.2 say it is not edited at all
    and is a pin of the P1a gate. Unverified 17 only anticipates unnamed files, not one that the plan
    itself lists as untouched.

    '
  remediation: 'Add RefusalRowsTest to the named type-level edits (return type StreamBatch and an endStreams()
    body; no assertion changes), fix the ''nine'' count to ten and remove the file from the ''Unchanged''
    list and from the ''pinned by (unchanged)'' column. Optionally make endStreams() a default no-op on
    MissionStatusQuery to shrink the churn, and say so.

    '
- id: PLAN-FRESH3-003
  lens: ruling A3 item 1 (projected, sealed StreamEvent)
  severity: 3
  title: StreamEvent.LogTruncated has a component named reason although the same section forbids any member
    named reason and PortLeakCanaryTest asserts it
  evidence:
  - artifact: "plan.md \xA7 15.3 row StreamEvent: 'LogTruncated(String missionId, String reason, long\
      \ detectedAtOffset, StreamCursor resetCursor) ... No member named reason, reviewRef, reasonSource\
      \ or claimAgent exists anywhere in the type'"
  - artifact: "plan.md \xA7 7.5 row 13 and \xA7 15.6 (PortLeakCanaryTest 'asserts ... that no returned\
      \ type has a member named like a raw field')"
  - code: 'services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/EventData.java:
      the log-truncated frame carries ''reason'' on the wire (StreamSignal.Truncated.reason().wire())'
  claim: 'The wire member is legitimately called reason, but the plan makes the Java record component
    the same name and then specifies a canary test and a type-level invariant that forbids exactly that
    name. As written either PortLeakCanaryTest is red at the tip or the test must carve out LogTruncated,
    which defeats the ''no member named like a raw field'' guard.

    '
  remediation: 'Name the component something else in the port type (for example truncationCause, holding
