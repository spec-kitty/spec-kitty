  - id: PLAN-VERIFY-011
    lens: Coverage floors
    severity: 2
    title: Coverage is held only for domain and application classes; the plan does not say that adapter, config and wiring classes have none, and the floor-raise rule is review-only
    evidence:
      - artifact: "plan.md Charter Check row 'Architectural alignment' and section 11 chokepoints (jacoco-class-floor.properties raised by exactly the number each phase adds); NFR-005 traceability"
      - code: "services/mission-status-api/build.gradle.kts jacocoTestCoverageVerification: three rules, includes only org.speckitty.missionstatus.domain.* and application.*; jacocoScopeFailures fails only when matched < floor"
    claim: >-
      FilesystemTextSource, YamlFrontmatterDecoder, JsonLanesDecoder, the codecs, the controllers and mappers and the wiring
      classes (roughly a third of the new code by the section 13 tree) carry no floor; their fault branches (FILE_UNREADABLE,
      DIR_UNREADABLE, over-cap race) are held only by whichever tests the phases happen to write. The plan does not state this,
      so the reader of 'JaCoCo floors on every new class' may assume more than is enforced. Because the scope check is a lower bound,
      a phase that adds ten classes and raises the floor by two stays green: the 'raise by exactly the number it adds' rule is
      enforced by nothing but the review brief, which the plan also does not give a command for.
    remediation: >-
      Add a sentence to section 5 that adapter and config classes have no floor (spec NFR-005 scope) and name the tests that
      hold the adapter fault branches (ListingTest-style fault injection per Kind). Add a phase exit command that counts classes per
      pattern in build/reports/jacoco/test/jacocoTestReport.xml against the two properties lines (the xml `class` elements
      that jacocoReportClassNames reads), so a forgotten raise is visible to the reviewer.
