  title: worktreePresent true has no oracle counterpart; golden host and oracle branches are unspecified
  evidence:
  - artifact: "spec.md \xA7 FR-010, OQ-3, D-12, D-20, AC-3.1, AC-10.3, R-7"
  - code: tests/contract/_mission_status_detail.py:108-115 and 466-478 (HostCapability has independent
      git and worktrees flags; _lane_worktree returns None when host.worktrees is false)
  - code: src/specify_cli/workspace/context.py:261-276 (ResolvedWorkspace.exists uses Path.exists, which
      follows symlinks, then requires the .git entry)
  claim: 'The claim about the rule is right (a husk without .git is absent). But the goldens are generated
    under NO_WORKTREES, where the oracle answers worktreePresent false for every Work Package, so the
    ''directory and .git present: true'' rows of AC-10.3 and the worktree-states class are asserted by
    Java alone, and D-20 declares only changeState as a divergence. HostCapability(git=False, worktrees=True)
    is possible and keeps changeState unknown, so a real parity golden for the true rows exists but is
    not used. The oracle also follows a symlinked directory or .git (Path.exists) while Java refuses a
    link, and resolve_workspace_for_wp has owned-checkout and persisted-context branches the stat rule
    cannot reproduce; R-7 defers the list of cases to the plan.'
  remediation: State that worktree-states goldens are generated with HostCapability(git=False, worktrees=True)
    on fixtures whose resolution is a plain lane worktree, and list the symlink rows and the non-reproducible
    resolution branches as knownDivergence now. Make the false rows run under both hosts.
- id: SPEC-VERIFY-006
  lens: M3 oracle parity (tasks.md title_rows)
  severity: 3
  title: AC-3.4 corpus omits the Python text semantics that tasks.md parsing depends on
  evidence:
  - artifact: "spec.md \xA7 FR-003 Subtasks, AC-3.4; contrast FR-006 item 3 and D-13 (newline translation\
      \ stated only for WP files)"
  - code: tests/contract/_mission_status_detail.py:272-286 (read_tasks_md decodes bytes with utf-8, so
      a BOM stays and CRLF is not translated)
  - code: tests/contract/_mission_status_detail.py:245-268 and 183-215 (split on \n only; str.strip, \bWP\d{2,}\b
      and T\d{3,} use Unicode whitespace, word boundary and digits)
  claim: Frontmatter and body get an explicit newline and BOM rule, tasks.md gets none. The oracle keeps
    a leading BOM (which breaks the first heading match), keeps \\r on CRLF files, and relies on Python
    strip/\\d/\\b semantics. Java's String.strip, ASCII-only \\d and \\b, BufferedReader line splitting
    and Files.readString differ, so a plausible implementation diverges on CRLF, BOM, NBSP/U+0085/U+2028
    and non-ASCII digits. AC-3.4 lists eight cases and none covers these, so the parity ACs would pass
    for a wrong decoder.
  remediation: 'State the tasks.md decoding rule (UTF-8 strict, BOM kept, split on \\n only, Python whitespace
    and digit classes) and add AC-3.4 cases: CRLF file, BOM file, NBSP and U+0085 around a row, an Arabic-Indic
    digit in a subtask id and in a WP token, and a lone \\r inside a title.'
- id: SPEC-VERIFY-007
  lens: Silent-success
  severity: 3
  title: OQ-1 default answers 200 with a Work Package missing and a log-only signal, where the oracle
    is loud
  evidence:
  - artifact: "spec.md \xA7 OQ-1, FR-006 item 4 and 6, FR-012 row M5, AC-1.6, AC-12.3 (exempts M5)"
  - code: 'tests/contract/_mission_status_payloads.py:916-919 (read_authored_files has no except: a malformed
      file raises)'
  claim: The mission's own principle is 'never a quietly empty detail', but the built-until-ruled default
    drops an unusable WP file from workPackages and signals it only in a server log line. The client sees
    a Mission with a Work Package silently absent; wpTotal (from the ledger) and the list can disagree
    with no in-band marker. The oracle for getMission and getWorkPackage raises, i.e. it is loud. AC-12.3
    then exempts exactly this row from the no-silent-success test. The question is correctly flagged open
    but nothing makes the ruling a gate before the plan.
  remediation: Make OQ-1 a blocking decision before tasks. If skip-with-diagnostic stays, add an in-contract
    signal that is legal today (for example keep the Work Package in the list is not possible; at minimum
    assert in a test that wpTotal minus listed count equals the count of skipped-file diagnostics) or
    default to 500 source_unreadable as the oracle does, and remove the AC-12.3 exemption.
- id: SPEC-VERIFY-008
  lens: Silent-success
  severity: 3
  title: FR-012 omits stat and lstat failures for planning files, prompt lookup and absent versus unlistable
    tasks/
  evidence:
  - artifact: "spec.md \xA7 FR-012 row M4 (only tasks/ unlistable, WP file, tasks.md, cycle dir, .worktrees\
      \ stat); FR-001 Phases; FR-003 Artifact references; FR-004 'An unreadable file is an entry with\
      \ readable false'"
  - code: tests/contract/_mission_status_payloads.py:963 (build_detail uses Path.is_file(), which turns
      any OSError into false and so into pending/lifecycle fallthrough)
  - code: tests/contract/_mission_status_artifacts.py:285-310 (is_eligible raises any non-absent OSError
      so the caller answers 500)
  claim: The oracle's phase check swallows an OSError (permission denied on spec.md reads as 'not an artifact'),
    while the artifact eligibility rule raises. The spec requires a failed .worktrees stat to be 500 but
    says nothing for a failed stat of spec.md, plan.md or tasks.md (phases), a failed lstat during the
    prompt/spec reference lookup, or a tasks/ directory that is absent (empty, fine) versus a non-directory.
    An implementer following the oracle returns a healthy 'pending' phase for an unreadable file. Also
    a file that is unreadable in the listing is readable:false with no diagnostic and a vanished file
    is omitted with none, so the listing hides read faults.
  remediation: 'Add M-rows: non-absent stat failure of PLANNING_FILE or TASKS_MD on getMission, lstat
    failure in artifactReferences, tasks/ not a directory; each 500 source_unreadable with a diagnostic
    and a fixture (permission-denied needs the precondition in the next finding). Require one diagnostic
    per listing entry set to readable:false for a fault (not for NUL/size/UTF-8/secret). Record the stat-swallowing
    oracle behaviour as a divergence.'
- id: SPEC-VERIFY-009
  lens: Falsifiability
  severity: 3
  title: FR-012 row W3 names an 'ambiguous Mission selector' that the ULID-only design cannot produce
  evidence:
  - artifact: "spec.md \xA7 FR-012 row W3; AC-12.1 ('every row above has its own fixture'); D-7; OQ-5"
  - code: tests/contract/_mission_status_detail.py:73 (_UNREADABLE includes MissionSelectorAmbiguous,
      a slug-handle concept)
  claim: The row is copied from the oracle's exception tuple. Selection is by missionId only and a duplicate
    id serves the first directory (C6), so no request reaches an ambiguous selector. AC-12.1 demands a
    fixture for every row, so this row cannot be satisfied and will either be silently dropped or invented.
  remediation: Delete 'an ambiguous Mission selector' from W3, or state the exact condition that Java
    can reach and add its fixture.
- id: SPEC-VERIFY-010
  lens: Falsifiability
  severity: 2
  title: Several ACs are not machine-observable or have no stated failure
  evidence:
  - artifact: "spec.md \xA7 AC-8.2 ('each is reverted in turn in the review record'), AC-14.6 ('outcome\
      \ recorded'), AC-19.4, AC-1.3 ('implement and review swap their evaluation order'), AC-14.2"
  - code: tests/contract/_mission_status_payloads.py:307-331 (derive_phase_status evaluates each phase
      independently; implement and review share no evaluation order)
  claim: AC-8.2 is satisfied by a human note, not by a build. AC-14.6 and AC-19.4 name an outcome to be
    recorded or a gate that passes, with no red condition. AC-1.3 and AC-14.2 say that swapping the evaluation
    order of implement and review turns a test red, but in the oracle the two are independent functions
    of the lane counts, so no such swap has an observable; the real observables are the order of the phases
    array and the order of the checks inside one phase.
  remediation: Turn AC-8.2 into a mutation or planted-regression test in the suite (a variant of the redaction
    that skips the check must fail AC-5.6). Give AC-14.6 and AC-19.4 an explicit failing condition. Reword
    AC-1.3 and AC-14.2 to name the phases array order and the within-phase check order.
- id: SPEC-VERIFY-011
  lens: Falsifiability
  severity: 2
  title: Permission-denied fixtures are vacuous when the runner is root
  evidence:
  - artifact: "spec.md \xA7 AC-4.3 (unreadable file, not on Windows), AC-10.3 (permission denied), AC-4.7"
  claim: A chmod 000 file or directory is readable by root, so on a root container the 'unreadable' fixtures
    answer 200 and the assertions either fail spuriously or, if skipped, pass vacuously. The Windows exclusion
    is stated with 'the job summary says so', the root case is not.
  remediation: 'Add a fixture precondition (open the file as the test user and require EACCES) and report
    ''not run: precondition unmet'' to the job summary, never pass; or inject the fault through the recording
    port instead of the file system.'
- id: SPEC-VERIFY-012
  lens: Coverage
  severity: 2
  title: Fixture class names in AC-3.1 do not map to the FR-014 class list; getWorkPackage has no corpus
    coverage
  evidence:
  - artifact: "spec.md \xA7 AC-3.1 (populated, no-cycles, null-workspace, planning-lane, ...) versus FR-014\
      \ fixture classes (detail-populated, cycles, tasks-md, worktree-states, ...)"
  - artifact: "spec.md \xA7 AC-14.5 and SC-002 (getMission, getWorkPackageDetail, listArtifacts, getArtifactContent;\
      \ getWorkPackage absent); AC-14.5 'No exemption' versus its derived refused list"
  - code: tests/contract/test_mission_status_conformance.py:327-342 (top-level directory set must equal
      CLASS_TAGS plus data files, each class has a floor)
  claim: The existing conformance test pins the directory set and a floor per class, so the new class
    names and floors must be exact, but AC-3.1 uses eleven names that FR-014 does not list, which makes
