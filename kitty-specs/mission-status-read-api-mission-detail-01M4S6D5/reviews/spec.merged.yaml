      \ reads'; the test uses 100 content and 10 listing requests, none on getWorkPackageDetail)"
  - code: services/mission-status-api/src/main/resources/application.properties:7 (spring.threads.virtual.enabled=true;
      no limit on concurrent requests for the new routes)
  claim: (1) The listing must sort the whole walk to take the first 1000, so it holds up to 100000 relative
    paths of up to 512 characters per request; NFR-002 measures a 1000-file Mission and so never exercises
    that set. (2) NFR-002 says lanes.json-class reads are 262145 bytes, while FR-011 gives LANES_JSON
