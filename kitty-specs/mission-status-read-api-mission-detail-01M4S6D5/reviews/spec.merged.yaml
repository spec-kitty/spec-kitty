- id: SPEC-GOV-010
  lens: Terminology
  severity: 2
  title: New domain terms and the overloaded 'Phase' are not reconciled with the glossary, and no gate
    or AC checks Contextive sync
  evidence:
  - artifact: 'spec.md Key Entities (lines 485-496: ''Phase ... Not the glossary phase'', Read class,
      Work Package file index, Text-read port, Workspace) and NFR-006 (line 466)'
  - code: 'spec-kitty glossary list: ''phase'' = ''Grouping container for mission primitives''; ''workspace''
      = ''Git worktree directory created for ...''; ''lane'' = ''Work package lifecycle state'''
  - artifact: docs/context/contextive-glossaries.md:94-103 (generated Contextive files are CI-checked
      when glossary/** or src/specify_cli/** change)
  claim: The contract's MissionPhase (specify..review) and Workspace (lane, branches, worktreePresent)
    do not match the glossary definitions, and the spec only says 'Not the glossary phase'. It does not
    say whether any term is added to docs/context (which, with C-004 and C-007, would be a write outside
    the allowed set and would trigger the Contextive check) or that none is. NFR-006 covers only the Feature
    ban.
  remediation: 'Add one sentence to Key Entities or NFR-006: either ''no glossary change; contract terms
    Phase and Workspace are used in the contract sense, disambiguated in the README'' or ''terms X, Y
    are added to docs/context/<slug>.md and the Contextive files are regenerated'', and extend C-004 accordingly.
    Add the README disambiguation of ''Phase'' to FR-018.'
- id: SPEC-ARCH-001
  lens: M2 read fence / Contracts
  severity: 4
  title: Path-classified read classes and per-route access sets contradict the artifact routes (spec.md,
    tasks.md, WP files, review cycles, meta.json, lanes.json)
  evidence:
  - artifact: "spec.md \xA7 FR-011 (table, 'The classifier tries the specific classes first; ARTIFACT_DIR\
      \ and ARTIFACT_FILE come last' and the per-route access sets)"
  - artifact: "spec.md \xA7 AC-5.2 control ('spec.md is 200') against \xA7 AC-11.2 ('a READ of spec.md\
      \ (PLANNING_FILE is STAT only)' must be red)"
  - artifact: "spec.md \xA7 AC-4.1 / AC-5.8 / AC-4.3 (artifacts-populated lists tasks/WP01-x/review-cycle-1.md;\
      \ readable is computed by a content read of every entry)"
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/out/filesystem/Allowlist.java:142
      (classify returns the first matching ClassPattern; kitty-specs/<m>/meta.json and lanes.json already
      match MISSION_META and LANES_JSON)
  - code: services/mission-status-api/src/test/java/org/speckitty/missionstatus/adapter/out/filesystem/RecordingAllowlistAccess.java:47
      (the recorder classifies by path alone; it has no notion of route or purpose)
  claim: 'The fence classifies an access by its path, specific classes first. A content read of spec.md
    therefore records PLANNING_FILE (STAT only), of tasks.md TASKS_MD, of tasks/WP01-x.md WP_FILE, of
    a review-cycle file WP_CYCLE_FILE, of meta.json MISSION_META and of lanes.json LANES_JSON. The listing
    and content routes are allowed only ARTIFACT_DIR and ARTIFACT_FILE, and PLANNING_FILE is STAT only.
    So the spec''s own requirements cannot both hold: getArtifactContent of spec.md must answer 200 (AC-5.2
    control, and readable=true in every listing, AC-4.3) while AC-11.1/AC-11.2 require any READ of spec.md
    to fail the fence. The same applies to every file that is both an authored source and an artifact
    (tasks.md, tasks/WP*.md, review-cycle files, meta.json, lanes.json). Implemented as written, either
    the artifact routes cannot read the Mission''s most common artifacts, or the per-route fence is silently
    widened until it asserts nothing. The port of FR-007 takes only a Mission reference, a relative path
    and a cap, so it cannot carry the intent that would disambiguate. The spec also never says how the
    test harness learns which route issued an access (the recorder has no route).'
  remediation: 'Make the class an explicit input of the access instead of a function of the path: the
    port call (or a scoped AllowlistAccess view) carries the read purpose (for example a ReadScope) and
    the recorder records (scope, class, mode). Define ARTIFACT_FILE and ARTIFACT_DIR as scope-addressed
    classes that may cover any eligible path below the primary directory except the two root status records,
    and state the exact precedence: a file read through the artifact scope is checked against ARTIFACT_*,
    not against PLANNING_FILE, TASKS_MD, WP_FILE, WP_CYCLE_FILE, MISSION_META or LANES_JSON. Add the per-request
    route tag to the recorder (a request-scoped marker, serial flow) and write AC-11.1/AC-11.2 against
    (route, scope, class, mode). Keep AC-11.2''s red control for a PLANNING_FILE READ under the planning
    scope only, and add the artifact-scope green control for spec.md, tasks.md and meta.json.'
- id: SPEC-ARCH-002
  lens: Layering / M2 transport-agnostic port
  severity: 4
  title: Rule 13 bars adapter.in.http from domain.projection, which the existing events adapter already
    uses
  evidence:
  - artifact: "spec.md \xA7 AC-13.1 (rule 13: adapter.in.http 'may not depend on domain.reducer, domain.overview\
      \ derivers, domain.projection or adapter.out')"
  - artifact: "spec.md \xA7 FR-013 ('the HTTP controllers hold no logic')"
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/EventData.java:16-17,44,81
      (imports LeakClasses and Projector, builds new Projector(leaks))
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/in/http/EventsController.java:34,64,184
      (takes LeakClasses, emits DiagnosticCode.PROJECTION_REFUSED itself)
  - code: services/mission-status-api/src/test/java/org/speckitty/missionstatus/architecture/ArchitectureRules.java:159
      (rule 3 already limits adapter.in.http to application.port.in, domain and itself)
  claim: 'As worded, rule 13 is red on the unchanged production tree: EventData and EventsController (in
    adapter.in.http) use domain.projection and write a diagnostic. AC-13.1 is therefore either unsatisfiable,
    or satisfied only by an unstated exemption that lets a new controller copy the same pattern, which
    is exactly the duplication D-6 forbids for the later MCP adapter. The spec also does not say that
    rule 13 is a tightening of rule 3 (rule 3 already allows the whole of domain), so it is unclear what
    rule 13 adds beyond naming three sub-packages.'
  remediation: 'Rewrite AC-13.1 to state its scope: rule 13 applies to the controllers and mappers of
    the five new operations (a named class set or a package such as adapter.in.http.detail), with the
    events adapter listed as the one recorded exemption and a note that its projection logic is not an
    input of the MCP mission. State rule 13 as: classes that serve the five operations depend on application.port.in
    and on the domain result types only (domain.model, domain.overview result records), never on a deriver,
    reducer, projector or LeakClasses. Make the planted-violation control name the same class set.'
- id: SPEC-ARCH-003
  lens: M2 read fence
  severity: 3
  title: The fence is a test-only property, but the artifact routes put a caller-supplied path in front
    of the file system
  evidence:
  - artifact: "spec.md \xA7 FR-007 ('so a read outside the allowlist is a failure of the test and not\
      \ an unseen access')"
  - artifact: "spec.md \xA7 FR-011, AC-11.4 (what stays forbidden is checked through the recording AllowlistAccess)"
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/out/filesystem/AllowlistPassThrough.java:12-45
      (the production access performs no classification or refusal)
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/out/filesystem/FilesystemMissionEventSource.java:52
      (production wiring is AllowlistAccess.passThrough())
  claim: 'In #5529 every path that reaches the file system is composed by the service from a Mission directory
    name that passed SafeFiles.isSafeSegment, so a test-time fence was proportionate. #957 adds ARTIFACT_FILE
    and ARTIFACT_DIR, whose path is derived from a request parameter, and WP_CYCLE_DIR and WORKTREE_LANE,
    whose segments come from authored files. The only runtime defences the spec names are the artifact-path
    regex and the lstat chain. Nothing makes the allowlist itself a runtime invariant, so a logic slip
    in path composition (a missed segment check, a Windows-specific name form) reads any file under the
    project root with no test failing unless a fixture happens to exercise it.'
  remediation: Add to FR-007/FR-011 a production AllowlistAccess decorator that classifies every access
    with Allowlist.classify and the scope of SPEC-ARCH-001 and throws a SourceFault (fail closed, path-free)
    for an access whose class or mode is not permitted. The recording access then wraps the same decorator,
    so the test observes the runtime decision. Add an acceptance criterion that a deliberately misbuilt
    path (a segment such as ..\\x, an absolute segment, a segment with NUL) is refused by the production
    decorator, with no read recorded.
- id: SPEC-ARCH-004
  lens: M2 read fence / containment
  severity: 3
  title: worktreePresent composes a path from the unvalidated Mission slug, and does not check .worktrees
    itself
  evidence:
  - artifact: "spec.md \xA7 FR-010 (.worktrees/<recorded slug>-<lane id> 'composed as worktree_dir_name\
      \ composes it'; 'a real directory (not a link)'), \xA7 FR-011 (WORKTREE_LANE, WORKTREE_LANE_GIT)"
  - artifact: "spec.md \xA7 AC-10.3 (fixtures: a symbolic-link lane directory, no row for a hostile slug\
      \ or a symbolic-link .worktrees)"
  - code: 'contracts/mission-status/schemas/MissionHead.yaml:48-51 (slug: type string, minLength 1, no
      pattern)'
  - code: contracts/mission-status/schemas/Workspace.yaml:17 (laneId pattern ^[A-Za-z0-9][A-Za-z0-9._-]*$
      excludes separators; the slug has no equivalent)
  - code: tests/contract/_mission_status_detail.py:490 (the oracle takes the slug from the Mission identity
      and f-strings it into the directory name, src/specify_cli/lanes/branch_naming.py worktree_dir_name)
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/adapter/out/filesystem/SafeFiles.java:41
      (isSafeSegment guards the Mission directory name only)
  claim: The lane id is pattern-limited, but the slug comes from meta.json, which is authored content
    with only minLength 1. A slug such as ../../x (or one with a separator) makes ".worktrees/<slug>-<lane>"
    and its .git entry resolve outside .worktrees and outside the project root; the two stats then answer
    "does this path and its .git exist" for any host location, through the response bit worktreePresent.
    The classifier would refuse a .. segment in the recording, but in production nothing does (SPEC-ARCH-003).
    Separately, only the final component is statted without following; a .worktrees that is itself a symbolic
    link redirects every lane stat, and the spec's "stat-only" ruling does not say that .worktrees is
    lstat-ed first.
  remediation: 'State in FR-010 that the composed directory name must pass SafeFiles.isSafeSegment (one
    segment, no separator, no dot segment, no NUL), else worktreePresent is false with a path_refused
    diagnostic and no stat is issued; require .worktrees to be an lstat-ed real directory inside the project
    root before either stat. Add to AC-10.3 the rows: slug containing a separator, slug equal to .., .worktrees
    as a symbolic link (instrumented port records zero STAT below it), and a lane id with the contract
    pattern at its boundary.'
- id: SPEC-ARCH-005
  lens: M2 transport-agnostic port / secret handling
  severity: 3
  title: The only guard for the unredacted prompt lives in the HTTP adapter, while the port serves it
    to any adapter
  evidence:
