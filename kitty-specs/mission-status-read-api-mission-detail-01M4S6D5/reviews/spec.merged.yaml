- id: SPEC-VERIFY-013
  lens: Baseline honesty
  severity: 2
  title: Baseline capture is a process step with no acceptance criterion, owner or stable signature
  evidence:
  - artifact: "spec.md \xA7 Baseline and verification honesty items 1 to 5; D-24"
  - code: tests/contract/test_mission_status_reality.py (the module the spec says is red with 240-second
      timeouts and KeyError 'findings')
  claim: 'The method is sound and #3284 and #5927 are acknowledged, but no AC or work-package gate requires
    the baseline file to exist, and the signature (exception class plus first line) will contain timeouts,
    ids or paths and mismatch between runs, turning a pre-existing red into ''introduced'' or the reverse.
    Capturing two bases of the reality module costs two 10-minute caps and the spec does not say whether
    that is waived. #3284 is named but no step says what to do with the full-suite red outside the targeted
    modules.'
  remediation: 'Add an AC: traces/baseline-red.yaml exists before the first WP is claimed, with per-test
