findings:
  - id: TASKS-DECOMP-001
    lens: Decomposition (single concern, reviewable in one sitting)
    severity: 3
    title: WP02 bundles five separable concerns across 48 owned files, 10 subtasks, a 48 KB prompt
    evidence:
      - artifact: "wps.yaml WP02 (owned_files: 48 entries; subtasks T009..T018)"
      - artifact: "tasks/WP02-stream-seam-behind-inbound-port.md (404 lines, the longest prompt; 10 subtasks = the stated maximum)"
      - artifact: "packs/built-in/missions/mission-steps/software-dev/tasks/guidelines.md:25 (target 3-7 subtasks, 200-500 lines); tasks-outline/prompt.md:84-86 (maximum 10)"
    claim: >
      WP02 mixes (a) making the raw feed application-internal (T010), (b) the projected StreamEvent/EventProjection vocabulary (T011, T012),
      (c) admission and shutdown behind the port (T013), (d) request vocabulary (T014), (e) reducing EventsController (T015), and (f) a ten-file
      type-level retype of existing tests (T016). A reviewer must hold the whole stream seam, the HTTP adapter and ten retyped suites in one head,
      and the behaviour-preserving claim (no assertion changed) is only checkable across all of it at once. It sits at the hard ceiling with
      two of the 10 subtasks being a gate (T018) and a plain-caller test (T017).
    remediation: >
      Split into WP02a (T009-T012 plus the T016 retype, which must stay with the symbol moves it follows, plus the T015 controller reduction)
      and WP02b (T013 admission/shutdown, T014 request vocabulary, T017 PlainStreamCallerTest, JaCoCo line, gate). WP02b depends on WP02a.
      Renumber downstream; both stay in PR A. Alternatively record in wps.yaml why it must be one reviewable unit and cap review to
      commit-by-commit order (T010, T011/T012, T013, T014, T015, T016).

  - id: TASKS-DECOMP-002
    lens: Decomposition (single concern, reviewable in one sitting)
    severity: 3
    title: WP09 joins two independent concerns (text-read port plus fence, and redaction plus artifact classification) in 42 files and ~2000 new lines
    evidence:
      - artifact: "wps.yaml WP09 subtasks T056..T065 (10) and owned_files (42 entries)"
      - artifact: "tasks/WP09-... Subtask list: ~1970 new lines estimated across eight files"
      - artifact: "wps.yaml WP09 comment 'Chokepoint: Allowlist, AllowlistAccess, AllowlistPassThrough and the README allowlist fence change in this one WP so the fence amendment is atomic'"
    claim: >
      The atomicity argument covers only the fence (T057-T060, T063, T065: TextSource, FilesystemTextSource, SafeFiles.readCapped, AllowlistAccess,
      Allowlist ten PathClass/eleven ENTRIES, guards). T061 (ArtifactPaths, ArtifactKinds, ArtifactKind, Eligibility) and T062 (TextScreen,
      LeakClasses.credential, nine DiagnosticCode values, parity test) touch other packages and have no ordering dependency on TextSource.
      Together they exceed a one-sitting review and the WP is the largest hand-written block in PR A.
    remediation: >
      Split in two WPs, both depending on WP05 only: WP09a fence (T056-T060, T063, T064, gate: port, adapter, Allowlist, README parity, no-uncapped/no-unbounded guards)
      and WP09b domain rules and redaction (T061, T062, its JaCoCo domain line). WP10/WP11/WP12/WP16 then depend on whichever they consume
      (Eligibility, TextScreen on WP09b; TextSource on WP09a). The Allowlist amendment stays atomic inside WP09a.

  - id: TASKS-DECOMP-003
    lens: Decomposition (a split that separates a thing from its own test / ownership smell)
    severity: 3
    title: WP12 owns 21 read-model records that the four route WPs then edit; guideline smell (a WP editing a dependency's owned files) is annotated, not fixed
    evidence:
      - artifact: "wps.yaml WP12 owned_files (51 entries incl. 21 domain/readmodel/detail records) and WP13..WP16 headers: 'named edits to the eight P8 records this route owns the shape of'"
      - artifact: "tasks/WP13 T092, WP14 T099, WP15 T110, WP16 T117 (named edits of WP12-owned records)"
      - artifact: "packs/built-in/missions/mission-steps/software-dev/tasks/guidelines.md 'Dependency Hygiene': 'A WP must not depend on a sibling whose owned files it also edits - that is a decomposition smell to fix, not annotate.'"
      - artifact: "wps.yaml WP14/WP15/WP16 headers: concurrent lanes each make named edits to OutOfScopeRoutesTest (WP13), R/portlevel-tests.txt (WP05) and jacoco-class-floor.properties (WP01), 'serialised by merge order'"
    claim: >
      WP12 shapes 21 records 'from the contract schemas' with no consumer in PR A, and each route WP (which depends on WP12) then edits the
      records of its own route. The record is separated from the code that gives it meaning, a reviewer of WP12 cannot judge the shape, and
      the three concurrent route lanes (WP14/15/16) all hit the same three shared files, so merge order and recounts become a manual step in each.
    remediation: >
      Either (a) make WP12 final: state in WP12 and in WP13-WP16 that the records are complete from the contract schemas and route WPs add NO edit to them
      (delete the 'named edits to the P8 records' lines and subtask text T092/T099/T110/T117), or (b) keep only the types the four ports need to compile
      in WP12 and move each route's records to its route WP's owned_files (shape and tests together). For the shared files, add one line in the
      wps.yaml header assigning the merge order WP14 -> WP15 -> WP16 so the lanes cannot race.

  - id: TASKS-DECOMP-004
    lens: PR readability (PR A / PR B split)
    severity: 3
    title: PR A is not a diff a human can read in a sitting and the plan gives no size estimate, review order or seam; PR A to PR B is roughly 286 to 75 owned entries
    evidence:
      - artifact: "wps.yaml owned_files counts: WP01..WP12 = 17+48+18+1+31+6+28+1+42+18+25+51 = 286 entries; WP13..WP18 = 13+10+18+15+8+11 = 75"
      - artifact: "plan.md:630 'Hand-written Java will exceed what is readable in one sitting once tests are counted; generated, count and golden files are reviewed by regeneration command, not by line'"
      - artifact: "tasks prompts: WP09 ~1970, WP11 ~1705, WP12 ~1702 new lines (the '~N lines' estimates in each prompt)"
    claim: >
      The operator ruled two PRs (E-8), so the count of two is not the defect. The defect is that the split point was chosen by phase (P8|P9),
      not by reviewable size: PR A holds 12 WPs, 3 of them near 2000 lines, plus a behaviour-preserving refactor, an ArchUnit overhaul,
      a contract spike, a Python oracle extension, a Java harness and the fence amendment, none of which is served by a route. Nothing tells the PR A
      reviewer in what order to read it, which parts are generated, or what the diff size is.
    remediation: >
      Without reopening E-8: add to wps.yaml header (and thus the PR A description via tasks.md/plan) a reading order by WP with per-WP line estimates
      (hand-written vs generated), mark generated sets (R/conformance/**, jacoco floors) as review-by-command, and ask the operator whether a
      stacked intra-PR seam (commits grouped WP01-WP06 behaviour-preserving foundation | WP07-WP12 detail groundwork) is acceptable for review.
      Escalate to the operator as a decision if the estimate for PR A exceeds the size a maintainer will review (the P13 split below shows the plan already splits work on this basis).

  - id: TASKS-DECOMP-005
    lens: PR readability (check of the P13 two-WP split)
    severity: 2
    title: P13 split is sound but justified by the wrong rule, and WP18 carries an acknowledged false dependency on WP17
    evidence:
      - artifact: "wps.yaml header 'Phase P13 is split in two WPs ... for the 10-subtask maximum and PR readability; both depend on P9..P12' and WP17 comment 'Both depend on P9 to P12 and have disjoint scopes'"
      - artifact: "wps.yaml WP18 dependencies [WP13..WP17]; tasks/WP18-... 'Plan defects' item 1: 'WP17 is a dependency of this WP but nothing in this WP's tests needs it'; open fork F3"
    claim: >
      WP17 (7 subtasks) and WP18 (8) are each reviewable and split along a clean seam (CI/native/docs/Python pins vs Java tests), so the split holds.
      But the header justifies it by the 10-subtask maximum (a combined P13 would be 15 subtasks, true) while the comments say the scopes are disjoint and then WP18 is
      serialised after WP17 on a dependency its own prompt says is unneeded. The contradiction survives into the generated dependency graph and forces
      WP18 to wait for the slowest CI work for no technical reason.
    remediation: >
      Resolve F3 now in the manifest: either drop WP17 from WP18's dependencies (the prompt already says the gate is correct either way) or keep it and
      rewrite the header comment and WP18 text to say the order is a deliberate 'closing evidence last' ordering, not technical. Either way, delete 'disjoint scopes' from one of the two places.

  - id: TASKS-DECOMP-006
    lens: Prompt-file quality (stale cross-references)
    severity: 3
    title: Prompts name the wrong WP for phase numbers (P8 read as WP08, P5 as WP05, P7 as WP07)
    evidence:
      - artifact: "tasks/WP03-... lines 80, 96, 242, 243, 251, 272: 'WP08 (P8) extends this WP's files with rules 15 and 16', '14 + 2 (WP08) = 16', 'the rest is WP08'; line 80 'WP05 (P5) adds one control (A2cByteBuffer)'"
      - artifact: "tasks/WP02-... line 148: 'AdmissionGate (WP08/P8 ...)'"
      - artifact: "tasks/WP01-... lines 269, 295: 'DEFINED_RULE_COUNT ... raised by WP03 and later WP08', 'turns red after WP05 or WP08'"
      - artifact: "tasks/WP18-... line 133 'WP08's AdmissionGateTest'; line 197 'PlainCaller, DetailFixture, HttpHarness#startWith are WP07's'"
      - artifact: "wps.yaml numbering table: P8 = WP12, P5 = WP09, P7 = WP10, P3 = WP05, P4b = WP08, P4 = WP07"
    claim: >
      WP08 is the resolved-state goldens WP; the AdmissionGate, rules 15/16 and PlainCaller are WP12, the A2cByteBuffer control and the 15 PathClass/11 ENTRIES/8 DiagnosticCode growth are WP09, and the harness (DetailFixture, startWith) is WP10.
      The WP numbering was reordered topologically after the prompts used plan phase names, so these cross-references point an implementer or reviewer (who will use the references to find the named edit owner or the thing to rebase on) at the wrong lane.
    remediation: >
      Replace each reference: WP03:80/96/242/243/251/272 WP08 -> WP12 and WP05 -> WP09; WP02:148 WP08 -> WP12; WP01:269 WP08 -> WP12, WP01:295 'WP05 or WP08' -> 'WP09 or WP12';
      WP18:133 WP08 -> WP12; WP18:197 'WP07's' -> 'WP10's (DetailFixture, startWith) and WP12's (PlainCaller)'. Then grep every prompt for bare WPnn mentions next to a phase gloss and check against the numbering table.

  - id: TASKS-DECOMP-007
    lens: No padding / no vacuous subtasks
    severity: 2
    title: Gate, review-pass and confirm-only subtasks, and conditional 'if' subtasks, inflate subtask counts beyond the 3-7 target
    evidence:
      - artifact: "wps.yaml: 17 of 18 WPs end in a 'Gate:' subtask (T008, T018, T025, T036, T043, T051, T055, T065, T072, T080, T089, T097, T104, T111, T118, T125, T133)"
      - artifact: "wps.yaml WP04 T029 'Review pass'; WP07 T049 'Confirm the P0 baseline-record tests ... stay green and unchanged'; WP05 T034 'confirm ProjectionCache.java and OverviewDeriver stay unchanged'"
      - artifact: "wps.yaml WP17 T121 'NativePerfTest NFR-002 scenario if it runs the scenario', T123 'edit MissionStatusApplicationHints only on a miss'; WP11 T079 'named edit of MissionStatusApplicationHints only on a proven native miss'"
      - artifact: "8 of 18 WPs carry 8-10 subtasks (WP01 8, WP02 10, WP07 8, WP09 10, WP11 8, WP12 9, WP13 8, WP18 8) against the 3-7 target"
    claim: >
      A gate is a validation step, which the guideline allows, but T029/T049/T034 produce no file or test; they are Definition-of-Done lines in the form of subtasks. The 'if/only on a miss'
      subtasks have no implementable deliverable until a condition is met. Together they push 8 WPs over the target without any recorded justification and hide that WP04 and WP08 are nearly empty.
    remediation: >
      Fold T029 into the WP04 DoD, T049 into the WP07 gate T051, T034 into T033; move the conditional MissionStatusApplicationHints edits (T079, T123, T088) from subtask text into the WP's
      'Named edits' list (they already appear there), and state in the WP17 prompt whether NativePerfTest is in or out. Record in the wps.yaml header which WPs deliberately exceed 7 and why.

  - id: TASKS-DECOMP-008
    lens: Decomposition (WP that edits its dependency's owned files)
    severity: 2
    title: WP08 is a thin WP whose three substantive subtasks are named edits to WP07-owned files
    evidence:
      - artifact: "wps.yaml WP08 header: 'T052 ... (named edit of the P4 generator)', 'T053 Named edits to P4's manifest.json ... and the resolved-state floor line in both Python CLASS_FLOORS and Java DETAIL_CLASS_FLOORS'; owned_files is only R/conformance/resolved-state/**"
      - artifact: "wps.yaml WP08 depends_on WP07; tasks/WP08-... 200 lines, 4 subtasks"
    claim: >
      WP08 owns generated output only and edits the generator, manifest and census owned by WP07 (its dependency): the same smell as finding 003, in miniature. The census floor and the
      generator hook for resolved-state are separated from the census test that proves them.
    remediation: >
      Either merge WP08 into WP07 (WP07 then has 12 subtasks, so first fold its gate/confirm subtasks per finding 007), or give WP08 its own files so it edits nothing of WP07's: a separate
      resolved-state generator module and a separate ResolvedStateManifestCensusTest owned by WP08, leaving WP07's generator, manifest.json and DETAIL_CLASS_FLOORS unchanged.

  - id: TASKS-DECOMP-009
    lens: Prompt-file quality
    severity: 2
    title: WP13-WP16 'Plan defects found' still ask the orchestrator to grant ownership that wps.yaml and the frontmatter already grant
    evidence:
      - artifact: "tasks/WP13-... Plan defects item 1; WP14 item 1; WP15 item 1; WP16 item 1 ('Port-level test class has no owner in the write map ... the orchestrator should confirm, or add the pattern ... before finalize-tasks')"
      - artifact: "wps.yaml lines 1047, 1105, 1174, 1235 and each prompt's owned_files/create_intent: MissionDetailPortLegsTest, WorkPackagePortLegsTest, WorkPackageDetailPortLegsTest, ArtifactPortLegsTest are owned and create_intent-listed"
    claim: >
      The defect text is out of date against the manifest and, read literally, sends the WP agent to ask the orchestrator for something already given or to make an 'out-of-map addition' it
      is already mapped to. It also reads as an open planning gap to the reviewer.
    remediation: >
      Replace each item with a one-line note 'resolved: owned by this WP in wps.yaml' (or delete it), keeping item 2 and 3 of WP13 which are still live.

  - id: TASKS-DECOMP-010
    lens: Prompt-file quality (canonical structure and tasks.md contract)
    severity: 2
    title: Manifest-versus-plan contradiction on the PR column; create_intent exists only in the prompt frontmatter
    evidence:
      - artifact: "plan.md:632 'tasks.md states the split and carries a PR column, A or B, for every Work Package'"
      - artifact: "wps.yaml header lines 2-3, 'tasks.md ... keeps no header, no PR column and no comment from this file'; titles carry [PR A]/[PR B] instead"
      - artifact: "wps.yaml header 'wps.yaml is the only authority' versus create_intent present in tasks/WP01-WP07, WP09-WP16, WP18 frontmatter and absent from wps.yaml; WP08 and WP17 have none (validate-only passes because their literal owned paths exist)"
    claim: >
      The plan requires a PR column in tasks.md that the generator cannot emit; the title tag is a workaround, never recorded as a plan deviation. Separately, create_intent (read by finalize from
      the prompt frontmatter) is a second source of truth that wps.yaml does not mirror, so a later wps.yaml-only edit leaves the two inconsistent (SK-310: edits after bootstrap are inert).
    remediation: >
      Record the [PR A]/[PR B] title tag as the deliberate realisation of the plan's PR column (one sentence in wps.yaml header and a plan amendment note). Either mirror create_intent in wps.yaml
      or add a header line stating that create_intent lives in the prompt frontmatter and is derived from the new files of each WP.

  - id: TASKS-DECOMP-011
    lens: Prompt-file quality (formatting)
    severity: 1
    title: Prompt H1 title is truncated and uses inconsistent dash glyphs
    evidence:
      - artifact: "tasks/WP01-... H1 '# Work Package Prompt: WP01 - [PR A] P1 Campsite: extract lookup, read model and head projection' versus frontmatter title ending '(C-011); starts after the #5529 re-cut'; WP13-WP16 H1 use an en dash, WP01-WP12/WP17/WP18 a hyphen"
    claim: Cosmetic only; profile section, frontmatter keys, owned_files, dependencies, subtasks and requirement_refs all match wps.yaml for all 18 WPs, no plan_concern_refs key, no home path or username anywhere.
    remediation: Use one dash glyph (the README template uses an en dash) and either the full title or a consistent truncation rule.
