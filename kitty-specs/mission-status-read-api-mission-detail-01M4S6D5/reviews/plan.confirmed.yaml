- id: PLAN-ARCH-004
  lens: Layering and wiring (hexagonal composition)
  severity: 3
  title: The shared OverviewReader and ProjectionCache are package-private in application but the plan
    wires the new services from one config class per route phase
  evidence:
  - artifact: "plan.md \xA7 9 item 1 (MissionLookup and OverviewReader extracted as package-private classes;\
      \ 'OverviewReader owns the one ProjectionCache'; AC-1.2 same derivation); \xA7 13 layout (MissionDetailWiring,\
      \ WorkPackageWiring ... in config); \xA7 11 chokepoints ('one new wiring class per route phase so\
      \ ServiceWiring is not edited')"
  - code: 'services/mission-status-api/src/main/java/org/speckitty/missionstatus/config/ServiceWiring.java
      missionStatusQuery: the only construction site, `new MissionStatusService(source, clock, diagnosticsLine,
      feedExecutor, settings, leaks)`'
  - code: services/mission-status-api/src/main/java/org/speckitty/missionstatus/application/MissionStatusService.java
      public constructor delegates with `new ProjectionCache(new StatusReducer(...))`; ProjectionCache.java
      is a package-private final class; cache() is package-private
  claim: Config (a different package) can only construct application classes through public API. Today
    the cache is created inside MissionStatusService's public constructor and is unreachable from config.
    The plan makes MissionLookup and OverviewReader package-private and has four new wiring classes in
    config construct MissionDetailService, WorkPackageService and the rest, all of which need the same
    OverviewReader instance (one cache, NFR-009, AC-1.2). No wiring path is stated. Implementers will
    either create a second ProjectionCache (doubling the NFR-009 growth the plan measures and letting
    /missions and getMission serve different stamps) or widen visibility ad hoc in P9, outside P1's 'behaviour-preserving'
    campsite.
  remediation: "Decide in the plan and execute in P1: expose one public application-level composition\
    \ handle (for example a public final `MissionReadModel` holding MissionLookup, OverviewReader and\
    \ the cache, built once in ServiceWiring and passed to both MissionStatusService and the detail services),\
    \ or make the four detail services receive it through a public constructor. Add the class to \xA7\
    13, P1's write scope and the JaCoCo count, and add an assertion in OverviewReaderTest or a wiring\
    \ test that /missions and getMission share one ProjectionCache instance."
  refute_reason: Plan makes OverviewReader package-private and owner of the one ProjectionCache while
    config wiring classes must build services needing it, and ServiceWiring/MissionStatusService code
    builds the cache internally; no wiring path is stated.
