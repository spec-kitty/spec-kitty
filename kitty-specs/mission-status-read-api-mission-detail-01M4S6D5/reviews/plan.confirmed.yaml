- id: PLAN-ARCH-008
  lens: Canonical source and generated artifacts
  severity: 3
  title: The regeneration command for gradle/verification-metadata.xml omits bootJar, which the CI strict
    step resolves
  evidence:
  - artifact: "plan.md \xA7 2 table row 'gradle/verification-metadata.xml' (regenerate: `./gradlew --write-verification-metadata\
      \ sha256 check nativeCompile nativeTest nativeSmoke -PnativeBinary=<built binary> jacocoTestReport\
      \ openApiGenerate --refresh-dependencies`)"
  - code: '.github/workflows/mission-status-api.yml step ''Verify dependencies strictly'': runs `./gradlew
      --no-daemon --dependency-verification strict bootJar testClasses`, and its echo hint is `... jacocoTestReport
      openApiGenerate bootJar --refresh-dependencies`'
  claim: The plan's command drops `bootJar`, the task the strict gate itself runs and the workflow's own
    remediation hint includes. Metadata regenerated with the plan's command can lack the bootJar-only
    dependencies, so the strict step then fails on every leg. The plan says 'no change planned' but gives
    this command as the sole permitted route if a phase touches the file (P2 may, via a new generator
    model).
  remediation: Replace the command by the workflow's hint verbatim (copy-paste, per the transcribed-commands
    lesson) with `bootJar` added, keep `-PnativeBinary` only if nativeSmoke truly requires it, and add
