schema: review-confirmed/v1
phase: tasks
findings:
- id: TASKS-DECOMP-003
  lens: Decomposition (a split that separates a thing from its own test / ownership smell)
  severity: 3
  title: WP12 owns 21 read-model records that the four route WPs then edit; guideline smell (a WP editing a dependency's owned files) is annotated, not fixed
  evidence:
  - artifact: 'wps.yaml WP12 owned_files (51 entries incl. 21 domain/readmodel/detail records) and WP13..WP16 headers: ''named edits to the eight P8 records this route owns the shape of'''
  - artifact: tasks/WP13 T092, WP14 T099, WP15 T110, WP16 T117 (named edits of WP12-owned records)
  - artifact: 'packs/built-in/missions/mission-steps/software-dev/tasks/guidelines.md ''Dependency Hygiene'': ''A WP must not depend on a sibling whose owned files it also edits - that is a decomposition smell to fix, not annotate.'''
  - artifact: 'wps.yaml WP14/WP15/WP16 headers: concurrent lanes each make named edits to OutOfScopeRoutesTest (WP13), R/portlevel-tests.txt (WP05) and jacoco-class-floor.properties (WP01), ''serialised by merge order'''
  claim: 'WP12 shapes 21 records ''from the contract schemas'' with no consumer in PR A, and each route WP (which depends on WP12) then edits the records of its own route. The record is separated from the code that gives it meaning, a reviewer of WP12 cannot judge the shape, and the three concurrent route lanes (WP14/15/16) all hit the same three shared files, so merge order and recounts become a manual step in each.

    '
  remediation: 'Either (a) make WP12 final: state in WP12 and in WP13-WP16 that the records are complete from the contract schemas and route WPs add NO edit to them (delete the ''named edits to the P8 records'' lines and subtask text T092/T099/T110/T117), or (b) keep only the types the four ports need to compile in WP12 and move each route''s records to its route WP''s owned_files (shape and tests together). For the shared files, add one line in the wps.yaml header assigning the merge order WP14 -> WP15 -> WP16 so the lanes cannot race.

    '
  refute_reason: WP13-WP16 depend on WP12 and each edits its records via named edits (wps.yaml T082 says route WPs amend their route's records), which guidelines.md Dependency Hygiene calls a smell to fix, not annotate; fixable in wps.yaml by making WP12 final or moving records.
- id: TASKS-DECOMP-006
  lens: Prompt-file quality (stale cross-references)
  severity: 3
  title: Prompts name the wrong WP for phase numbers (P8 read as WP08, P5 as WP05, P7 as WP07)
  evidence:
  - artifact: 'tasks/WP03-... lines 80, 96, 242, 243, 251, 272: ''WP08 (P8) extends this WP''s files with rules 15 and 16'', ''14 + 2 (WP08) = 16'', ''the rest is WP08''; line 80 ''WP05 (P5) adds one control (A2cByteBuffer)'''
  - artifact: 'tasks/WP02-... line 148: ''AdmissionGate (WP08/P8 ...)'''
  - artifact: 'tasks/WP01-... lines 269, 295: ''DEFINED_RULE_COUNT ... raised by WP03 and later WP08'', ''turns red after WP05 or WP08'''
  - artifact: tasks/WP18-... line 133 'WP08's AdmissionGateTest'; line 197 'PlainCaller, DetailFixture, HttpHarness#startWith are WP07's'
  - artifact: 'wps.yaml numbering table: P8 = WP12, P5 = WP09, P7 = WP10, P3 = WP05, P4b = WP08, P4 = WP07'
  claim: 'WP08 is the resolved-state goldens WP; the AdmissionGate, rules 15/16 and PlainCaller are WP12, the A2cByteBuffer control and the 15 PathClass/11 ENTRIES/8 DiagnosticCode growth are WP09, and the harness (DetailFixture, startWith) is WP10. The WP numbering was reordered topologically after the prompts used plan phase names, so these cross-references point an implementer or reviewer (who will use the references to find the named edit owner or the thing to rebase on) at the wrong lane.

    '
  remediation: 'Replace each reference: WP03:80/96/242/243/251/272 WP08 -> WP12 and WP05 -> WP09; WP02:148 WP08 -> WP12; WP01:269 WP08 -> WP12, WP01:295 ''WP05 or WP08'' -> ''WP09 or WP12''; WP18:133 WP08 -> WP12; WP18:197 ''WP07''s'' -> ''WP10''s (DetailFixture, startWith) and WP12''s (PlainCaller)''. Then grep every prompt for bare WPnn mentions next to a phase gloss and check against the numbering table.

    '
  refute_reason: Verified stale phase-as-WP references (WP03 lines 80/95/96/242/243/272 say WP08 for P8 which is WP12 and WP05 for P5 which is WP09; WP02:148 and WP01:269/295 and WP18:133/197 likewise) against the wps.yaml numbering table; a pure prompt edit fixes it.
- id: TASKS-DECOMP-008
  lens: Decomposition (WP that edits its dependency's owned files)
  severity: 2
  title: WP08 is a thin WP whose three substantive subtasks are named edits to WP07-owned files
  evidence:
  - artifact: 'wps.yaml WP08 header: ''T052 ... (named edit of the P4 generator)'', ''T053 Named edits to P4''s manifest.json ... and the resolved-state floor line in both Python CLASS_FLOORS and Java DETAIL_CLASS_FLOORS''; owned_files is only R/conformance/resolved-state/**'
  - artifact: wps.yaml WP08 depends_on WP07; tasks/WP08-... 200 lines, 4 subtasks
  claim: 'WP08 owns generated output only and edits the generator, manifest and census owned by WP07 (its dependency): the same smell as finding 003, in miniature. The census floor and the generator hook for resolved-state are separated from the census test that proves them.

    '
  remediation: 'Either merge WP08 into WP07 (WP07 then has 12 subtasks, so first fold its gate/confirm subtasks per finding 007), or give WP08 its own files so it edits nothing of WP07''s: a separate resolved-state generator module and a separate ResolvedStateManifestCensusTest owned by WP08, leaving WP07''s generator, manifest.json and DETAIL_CLASS_FLOORS unchanged.

    '
  refute_reason: WP08 depends on WP07, owns only R/conformance/resolved-state/**, and its subtasks T052/T053 are named edits to WP07's generator, manifest and floors (WP04 comment also says WP07 and WP08 append as named edits), the same Dependency Hygiene smell, fixable in wps.yaml by merging or giving WP08 its own files.
- id: TASKS-DECOMP-009
  lens: Prompt-file quality
  severity: 2
  title: WP13-WP16 'Plan defects found' still ask the orchestrator to grant ownership that wps.yaml and the frontmatter already grant
  evidence:
  - artifact: tasks/WP13-... Plan defects item 1; WP14 item 1; WP15 item 1; WP16 item 1 ('Port-level test class has no owner in the write map ... the orchestrator should confirm, or add the pattern ... before finalize-tasks')
  - artifact: 'wps.yaml lines 1047, 1105, 1174, 1235 and each prompt''s owned_files/create_intent: MissionDetailPortLegsTest, WorkPackagePortLegsTest, WorkPackageDetailPortLegsTest, ArtifactPortLegsTest are owned and create_intent-listed'
  claim: 'The defect text is out of date against the manifest and, read literally, sends the WP agent to ask the orchestrator for something already given or to make an ''out-of-map addition'' it is already mapped to. It also reads as an open planning gap to the reviewer.

    '
  remediation: 'Replace each item with a one-line note ''resolved: owned by this WP in wps.yaml'' (or delete it), keeping item 2 and 3 of WP13 which are still live.

    '
  refute_reason: WP13 Plan defects item 1 still asks the orchestrator to add the port-level class pattern while wps.yaml lines 1047/1105/1174/1235 already own the four PortLegsTest classes.
- id: TASKS-DECOMP-010
  lens: Prompt-file quality (canonical structure and tasks.md contract)
  severity: 2
  title: Manifest-versus-plan contradiction on the PR column; create_intent exists only in the prompt frontmatter
  evidence:
  - artifact: plan.md:632 'tasks.md states the split and carries a PR column, A or B, for every Work Package'
  - artifact: wps.yaml header lines 2-3, 'tasks.md ... keeps no header, no PR column and no comment from this file'; titles carry [PR A]/[PR B] instead
  - artifact: wps.yaml header 'wps.yaml is the only authority' versus create_intent present in tasks/WP01-WP07, WP09-WP16, WP18 frontmatter and absent from wps.yaml; WP08 and WP17 have none (validate-only passes because their literal owned paths exist)
  claim: 'The plan requires a PR column in tasks.md that the generator cannot emit; the title tag is a workaround, never recorded as a plan deviation. Separately, create_intent (read by finalize from the prompt frontmatter) is a second source of truth that wps.yaml does not mirror, so a later wps.yaml-only edit leaves the two inconsistent (SK-310: edits after bootstrap are inert).

    '
  remediation: 'Record the [PR A]/[PR B] title tag as the deliberate realisation of the plan''s PR column (one sentence in wps.yaml header and a plan amendment note). Either mirror create_intent in wps.yaml or add a header line stating that create_intent lives in the prompt frontmatter and is derived from the new files of each WP.

    '
  refute_reason: plan.md:632 requires a tasks.md PR column that wps.yaml line 3 says cannot be emitted, and create_intent appears in 16 prompt frontmatters but nowhere in wps.yaml (count 0).
- id: TASKS-DECOMP-011
  lens: Prompt-file quality (formatting)
  severity: 1
  title: Prompt H1 title is truncated and uses inconsistent dash glyphs
  evidence:
  - artifact: 'tasks/WP01-... H1 ''# Work Package Prompt: WP01 - [PR A] P1 Campsite: extract lookup, read model and head projection'' versus frontmatter title ending ''(C-011); starts after the #5529 re-cut''; WP13-WP16 H1 use an en dash, WP01-WP12/WP17/WP18 a hyphen'
  claim: Cosmetic only; profile section, frontmatter keys, owned_files, dependencies, subtasks and requirement_refs all match wps.yaml for all 18 WPs, no plan_concern_refs key, no home path or username anywhere.
  remediation: Use one dash glyph (the README template uses an en dash) and either the full title or a consistent truncation rule.
  refute_reason: WP13 H1 uses an en dash while WP01 uses a hyphen, and H1 titles are truncated against frontmatter, though the finding itself rates it cosmetic.
- id: TASKS-ORDER-001
  lens: 'Dependencies correct / lane lineage (mission lens: external dependencies and stacking)'
  severity: 4
  title: WP05 depends only on the planning_artifact WP04, so its lane starts without any of WP01..WP03's code
  evidence:
  - artifact: 'wps.yaml WP05 dependencies: [WP04]; WP04 dependencies: [WP03]; WP04 is the only planning_artifact WP (lane-planning)'
  - artifact: 'plan.md section 11 Depends-on column: P3 depends on ''P3a (and so P1, P1a and P1b)'' - the plan relies on transitivity'
  - code: src/specify_cli/lanes/compute.py:1105-1126 (lane_deps built from DIRECT WP dependencies only; the planning lane is its own node)
  - code: src/specify_cli/lanes/branch_naming.py:560-600 (lane_branch_name('lane-planning') returns the target branch, not a kitty/mission-... lane branch)
  - code: src/specify_cli/lanes/worktree_allocator.py:1602-1672 (_merge_dependency_lane_tips merges only the lane's direct depends_on_lanes; a dependency on the planning lane merges the target branch, which holds no lane-a/b/c commit)
  - code: src/specify_cli/lanes/implement_support.py:757-795 (planning claim waives code-lane ancestry, so WP04 never pulls WP01..WP03 either)
  - artifact: 'reproduced read-only: compute_lanes on the 18 WP frontmatters gives lane-d (WP05) depends_on_lanes=(''lane-planning'',) while lane-planning depends on lane-c; lane-f (WP07), lane-h (WP09), lane-e (WP06) all inherit only from lane-d'
  claim: 'finalize computes one lane per WP, but lane-d (WP05) has lane-planning as its only dependency lane. The planning lane lives in the root checkout on the target branch, so merging it into lane-d''s worktree brings in no commit from lane-a (WP01 campsite), lane-b (WP02 stream seam) or lane-c (WP03 ArchUnit gates). Every later PR A lane (WP06, WP07, WP08, WP09, WP10, WP11, WP12) descends from lane-d, so the whole mission would be implemented on a tree without the campsite, the port seam and the generalised gates, until consolidation. WP05 would then recount the JaCoCo domain line, edit ServiceWiring/ProjectionCache neighbours, and run Gate G / CoupledSymbolsShapeTest against a tree that lacks WP01..WP03, and the final lane merges conflict. The sequencing D-44 (campsite, then the first functional change) is stated in the plan but not enforced in the lane graph.

    '
  remediation: 'Before finalize-tasks bootstraps (SK-310: owned_files/dependency edits after bootstrap are inert), give WP05 dependencies [WP03, WP04] in wps.yaml (and the WP05 frontmatter and the header table), so lane-d depends on lane-c as well as lane-planning and _merge_dependency_lane_tips brings in the lane-a..c chain. Re-run the read-only compute_lanes/finalize --validate-only check and confirm lane-d lists both lane-c and lane-planning. Alternatively (not preferred) record in WP05 a precondition that the orchestrator consolidates lanes a..c into the target branch before WP05 is claimed.

    '
  refute_reason: finalize preview shows 18 lanes with WP04 the only planning WP, compute.py builds lane_deps from direct deps only, _ordered_dependency_lanes merges only direct dependency lanes, and the planning claim waives code-lane ancestry, so lane-d never receives WP01..WP03 code.
- id: TASKS-ORDER-002
  lens: Write scopes / lane computation (claims about lanes)
  severity: 2
  title: WP08 says it 'shares WP07's lane'; finalize computes 18 distinct lanes (WP07 = lane-f, WP08 = lane-g)
  evidence:
  - artifact: 'tasks/WP08-p4b-resolved-state-goldens.md ''Pull request and dependencies'' line 1: ''WP08 shares WP07''s lane (it depends on it and edits its files by named edit)'''
  - artifact: 'plan.md section 11 shared-file table: ''P4b depends on P4, so it shares P4''s lane'''
  - artifact: 'finalize-tasks --validate-only: lanes_preview count 18, collapse_report total_merges 0; compute_lanes: lane-f=(WP07), lane-g=(WP08) depends on lane-f'
  claim: 'No lane is shared: the manifest has disjoint owned_files and a dependency edge, which yields a separate lane that merges lane-f''s tip. The statement is false and suggests WP08 reuses WP07''s worktree (and that the pair cannot run concurrently with anything that touches the same files).

    '
  remediation: 'Reword WP08 to ''WP08 runs in its own lane (lane-g) after WP07; its workspace merges WP07''s approved tip; the named edits to WP07-owned files apply on top of that tip''. Do not rely on lane sharing in plan section 11 prose either.

    '
  refute_reason: WP08 prompt line 42 says it shares WP07's lane while the validate-only preview lists 18 distinct lanes with no collapse merges.
- id: TASKS-ORDER-003
  lens: Dependencies correct (cross-references through the WP numbering)
  severity: 2
  title: Stale or wrong WP numbers when prompts name the owner of a class or file (Plan-phase numbers were not translated)
  evidence:
  - artifact: 'tasks/WP03-... Dependents line: ''WP08 (P8) extends this WP''s files ... WP05 (P5) adds one control (A2cByteBuffer)''; P8 is WP12 and P5 is WP09'
  - artifact: 'tasks/WP02-... (Mechanisms bullet): ''AdmissionGate (WP08/P8 ...)'' ; AdmissionGate is WP12'
  - artifact: tasks/WP17-... 'ProvisionPlan (WP07, T/testsupport/ProvisionPlan)' ; the Java ProvisionPlan is WP10 (WP07 owns only the Python PROVISION_PLAN)
  - artifact: 'tasks/WP17-... T-subtask on oracle methods: ''detail oracle module of WP04 (tests/contract/_mission_status_detail.py, exists after WP04)''; WP04 is the documentation-only mapping WP; the oracle is WP07''s and the file already exists in the checkout (tests/contract/_mission_status_detail.py)'
  - artifact: 'tasks/WP18-... T129: ''PlainCaller (WP07 ...)'' (WP12), ''that file [portlevel-tests.txt] is owned by WP03'' (WP05); T129 Validation: ''WP08''s AdmissionGateTest'' (WP12); T-permission subtask: ''PermissionCaseCoverageTest (WP07)'' (WP10)'
  claim: 'Eight cross-references name the wrong WP. They were written against plan phase labels or an earlier numbering. An implementer or reviewer who follows them looks in (or asks) the wrong WP, and WP18''s statement of who owns portlevel-tests.txt would wrongly point to WP03.

    '
  remediation: 'Correct each reference: WP03 -> ''WP12 (P8)'' and ''WP09 (P5)''; WP02 -> WP12; WP17 ProvisionPlan -> WP10 and detail oracle -> WP07 (file exists today); WP18 PlainCaller -> WP12, portlevel-tests.txt owner -> WP05, AdmissionGateTest -> WP12, PermissionCaseCoverageTest -> WP10. Then grep each prompt once for ''WP[0-9][0-9]'' next to a class name against the owned_files table (a mechanical check).

    '
  refute_reason: wps.yaml shows PlainCaller, AdmissionGate and AdmissionGateTest owned by WP12, ProvisionPlan and PermissionCaseCoverageTest by WP10, A2cByteBuffer by WP09 and portlevel-tests.txt by WP05, contradicting the WP03/WP02/WP17/WP18 prompt references.
- id: TASKS-ORDER-004
  lens: Write scopes (named edits stated and out-of-map)
  severity: 2
  title: Prompts still describe files as unowned that wps.yaml already owns (WP05 LineKind, WP13-WP16 port-level test classes)
  evidence:
  - artifact: 'tasks/WP05-... Pull request and dependencies item 4 and ''Plan defects found'' item 1: ''J/domain/model/LineKind.java is owned by no WP ... the one out-of-map edit this WP may add'''
  - artifact: 'wps.yaml WP05 owned_files (line 426): ''.../domain/model/LineKind.java'' is owned'
  - artifact: 'tasks/WP13 ''Plan defects'' item 1, WP14 item 1, WP15 item 1, WP16 item 1: ''Port-level test class has no owner in the write map ... justified out-of-map addition'''
  - artifact: 'wps.yaml owned_files: conformance/port/MissionDetailPortLegsTest.java (WP13, line 1047), WorkPackagePortLegsTest.java (WP14), WorkPackageDetailPortLegsTest.java (WP15), ArtifactPortLegsTest.java (WP16)'
  claim: 'The orchestrator has since put these files into owned_files, but the prompts keep the old ''out-of-map, ask the orchestrator to add the pattern'' text. A worker following it would write a commit message claiming an out-of-map edit for an owned file (and WP05 may stop to ask), and a reviewer applying ''named edits must be out-of-map'' sees a contradiction between the prompt and the manifest.

    '
  remediation: 'Delete or rewrite those Plan-defect items as resolved (WP05: LineKind.java is in owned_files, edit it normally; WP13..WP16: the PortLegsTest class is owned, only the append to R/portlevel-tests.txt is a named edit of WP05''s file) and drop the ''Only if T033 proves it unavoidable'' hedge and the out-of-map bullet in WP05.

    '
  refute_reason: WP05 prompt calls LineKind.java owned by no WP while wps.yaml line 426 lists it, and WP13 Plan defects item 1 (same text in WP14-16) calls the owned PortLegsTest classes out-of-map.
- id: TASKS-ORDER-005
  lens: Write scopes (chokepoints serialise)
  severity: 2
  title: Plan claims concurrent appends to R/portlevel-tests.txt 'merge by keeping every line'; git will conflict, and WP13..WP16 are concurrent
  evidence:
  - artifact: 'plan.md shared-file table row R/portlevel-tests.txt: ''concurrent appends merge by keeping every line'''
  - code: .gitattributes:12 and :34 (only kitty-specs/**/traces/*.md has a merge driver; R/portlevel-tests.txt and jacoco-class-floor.properties carry no merge=union)
  - artifact: 'lane graph: lane-l (WP13) and lane-o (WP16) are concurrent; WP14/WP15 concurrent with each other and with WP16; WP11 (PR A) concurrent with WP16'
  - artifact: 'tasks/WP13..WP16 ''Concurrent lanes'' risk: ''Mitigation: rebase, re-read, recount on the merged tree'' (no instruction for portlevel-tests.txt or OutOfScopeRoutesTest conflict resolution)'
  claim: 'Two lanes appending different lines at the end of the same text file produce a textual conflict in a three-way merge. The prompts'' mitigation covers the JaCoCo recount (D-145) but not how to resolve the portlevel list and OutOfScopeRoutesTest removals; the second-merged lane (and the orchestrator at consolidation) hits an unplanned conflict on chokepoint files.

    '
  remediation: 'In WP13..WP16 (and WP11 for jacoco) state the resolution rule: on conflict keep the union of id lines, re-run PortLevelClassSetTest and PortLevelIdsTest; for OutOfScopeRoutesTest keep the intersection of the remaining paths (remove every path any lane removed). Or serialise by merge order explicitly in tasks (orchestrator merges WP13, WP14, WP15, WP16 in that order, each rebasing). Do not claim silent merging.

    '
  refute_reason: plan.md:598 claims concurrent appends merge by keeping every line but .gitattributes has no merge driver for portlevel-tests.txt, and WP13 only says later lane rebases and re-reads without a conflict resolution rule.
- id: TASKS-ORDER-008
  lens: Write scopes (named-edit accounting)
  severity: 1
  title: wps.yaml header comment calls ci-router.yml/test_contracts_workflows.py named edits while they are in WP07's owned_files
  evidence:
  - artifact: 'wps.yaml WP07 comment (line ~512): ''ci-router.yml and test_contracts_workflows.py are written only if AC-14.6 demands''; listed under ''Named edits'' but present in owned_files (lines 571-572)'
  claim: 'Wording inconsistency; owning shared CI files conditionally in a PR A WP also leaves WP17 (plan: ci-router one line ''only if required'') with no stated way to touch ci-router.yml.'
  remediation: Move the two items out of the 'Named edits' list in the WP07 comment and prompt into a 'conditional owned files' note, and add a one-line statement in WP17 that a ci-router change, if needed, is a named edit of WP07's file.
  refute_reason: wps.yaml lines 509-513 list ci-router.yml and test_contracts_workflows.py under "Named edits (out-of-map; not in owned_files)" while lines 571-572 own them, and WP17 has no ci-router mention or owned entry despite plan line 171 allowing one line there.
- id: TASKS-COVER-001
  lens: plan defects reported by WP authors (stale after wps.yaml was fixed)
  severity: 3
  title: Four "Plan defects found" items claim an ownership gap that wps.yaml already closes, so the prompt contradicts its own owned_files
  evidence:
  - artifact: tasks/WP13 § Plan defects found item 1; WP14 item 1; WP15 item 1; WP16 item 1 (port-level test class 'has no owner in the write map', 'justified out-of-map addition')
  - artifact: 'wps.yaml owned_files: WP13 owns conformance/port/MissionDetailPortLegsTest.java, WP14 WorkPackagePortLegsTest.java, WP15 WorkPackageDetailPortLegsTest.java, WP16 ArtifactPortLegsTest.java (and the same paths are in each prompt''s frontmatter owned_files)'
  - artifact: tasks/WP05 § Plan defects found item 1 and Context line 93 (LineKind.java 'is owned by no WP', 'out-of-map edit'); wps.yaml WP05 owned_files lists domain/model/LineKind.java
  claim: The WP authors reported gaps (port-level legs class, LineKind carrier record) that the manifest already fixes. An implementer reading the prompt will treat an owned file as an out-of-map edit, write a "justified exception" in the commit message, and a reviewer will wonder whether the ownership map was breached. WP13..16 also tell the orchestrator to "add the pattern before finalize-tasks (SK-310)", which is already done.
  remediation: Edit WP05, WP13, WP14, WP15, WP16 to state that the file is in owned_files (delete the out-of-map wording and the orchestrator request from "Plan defects found"; keep only the portlevel-tests.txt append as the named edit). No plan decision needed.
  refute_reason: WP13..16 frontmatter and wps.yaml (lines 1047, 1105, 1174, 1235) own the PortLegs classes and WP05 owns LineKind.java (line 426, frontmatter line 50), yet each prompt's Plan defects item 1 still calls them unowned out-of-map additions.
- id: TASKS-COVER-002
  lens: file references real / dependency citations
  severity: 3
  title: Stale phase-number-as-WP-number citations point implementers at the wrong work package
  evidence:
  - artifact: 'tasks/WP18 § T129 step 1: ''PlainCaller (WP07 ...)'', ''that file [portlevel-tests.txt] is owned by WP03''; § T129 Validation: ''WP08''s AdmissionGateTest''; § T130/T131: ''PermissionCaseCoverageTest (WP07)'', ''ConformanceTree surface partition, WP04'', ''providers created with their routes (WP04, WP07, ...)'''
  - artifact: 'tasks/WP02 context: ''AdmissionGate (WP08/P8 ...)''; tasks/WP03 context line 21 and Dependents: ''WP08 (P8) extends this WP''s files'', ''WP05 (P5)'', and the arithmetic ''14 + 2 (WP08) = 16''; tasks/WP17: ''testsupport classes of WP07'', ''detail oracle module of WP04 (exists after WP04)'''
  - artifact: 'wps.yaml owned_files: PlainCaller, AdmissionGate, DetailInfrastructureWiring are WP12 (P8); PermissionCaseCoverageTest, ServedRoute, testsupport are WP10 (P7); portlevel-tests.txt is WP05; ConformanceTree and the golden classes are WP07/WP08; WP04 is planning-only. tests/contract/_mission_status_detail.py already exists in this checkout.'
  claim: The prompts mix plan phase numbers with WP numbers (P8 is WP12, P7 is WP10, P3 is WP05, P4 is WP07). An implementer told that WP08 owns AdmissionGateTest or that WP03 owns portlevel-tests.txt looks in the wrong work package for the helper or for the file to rebase on. WP18 T129 also says "three gated operations (48 in all)" before correcting to four in the next sentence.
  remediation: Replace the cited WP ids with the owners in wps.yaml (list in evidence); in WP18 T129 write "each of the four gated operations (64 calls)". Run a repo-wide grep of each prompt for "WP0x (Px)" patterns after the edit.
  refute_reason: WP18 cites PlainCaller as WP07 and AdmissionGateTest as WP08 while wps.yaml puts them in WP12, PermissionCaseCoverageTest is WP10 not WP07, portlevel-tests.txt is WP05 not WP03, and WP02/WP03 cite WP08 for P8; WP18 line 126 also says three gated operations (48) before correcting to four.
