# Work package manifest for mission-status-read-api-mission-detail-01M4S6D5 (issue #957).
# Authored by the tasks stage, step 1 (tasks-outline). One WP per plan phase except P0; wps.yaml is the only authority,
# tasks.md is generated from it by finalize-tasks (it keeps no header, no PR column and no comment from this file).
#
# P0 (baseline record, FR-021) is NOT a work package. The orchestrator executes it before any WP is claimed
# (traces/baseline-red.yaml and the test_baseline_record_* tests appended to tests/contract/test_mission_status_conformance.py).
#
# TWO DRAFT PULL REQUESTS (operator ruling E-8, D-152). PR A = WP01..WP12 (plan phases P1 to P8, P0 as precondition): no route is
# served. PR B = WP13..WP18 (P9 to P13): the four route phases, then CI, native, nightly, README, perf and full-flow tests.
# Every WP title carries '[PR A]' or '[PR B]' because finalize-tasks drops unknown fields (the JSON schema forbids them).
# Each PR is self-contained and green at its own tip: no forward reference, fixtures live with their tests, floors and counts are
# satisfiable where introduced, and the mission record is complete from the start (meta.json plus a status.json materialised from
# status.events.jsonl, never hand-edited, so cutover-guard, mission-state audit and corpus-blocking pass).
#
# EXTERNAL DEPENDENCIES (not dependencies entries): (1) WP01 cannot start until the orchestrator has merged the re-cut tip of #5529
# (the side-first layout) into the branch; PR A stacks on the branch carrying #5529's last slice and #957 cannot merge before #5529
# (C-005). (2) #5533's Java work stacks on PR A (every shared primitive is in PR A); PR B cannot merge before PR A.
# The operator retargets PR A to main after #5529 lands and PR B after PR A lands; no agent pushes, opens or retargets a PR.
#
# NUMBERING. WPs are numbered in a topological order of the plan's Depends-on column (the only statement of order, D-87), so every
# dependency has a lower number: P3a, P3 precede P2, and P7 precedes P6 (P2 depends on P3; P6 depends on P7). Phase P13 is split in
# two WPs (CI/native/docs; full-flow/coverage-floor/perf tests) for the 10-subtask maximum and PR readability; both depend on P9..P12.
#
# Phase-to-WP table (to check every cross-reference in the prompts against): P1=WP01, P1a=WP02, P1b=WP03, P3a=WP04, P3=WP05, P2=WP06,
# P4=WP07, P4b=WP08, P5=WP09, P7=WP10, P6=WP11, P8=WP12, P9=WP13, P10=WP14, P11=WP15, P12=WP16, P13=WP17 and WP18.
#
# LANE LINEAGE (TASKS-ORDER-001). finalize-tasks builds the lane graph from DIRECT dependencies only, the planning_artifact WP04 runs in
# the planning lane (the target branch, which carries no lane commit), and a planning claim waives code-lane ancestry. So WP05 depends on
# WP03 as well as WP04: its lane then merges the WP01..WP03 lane chain, and every later PR A lane (WP06, WP07, WP09 and onward) inherits
# that code lineage transitively through WP05. The planning WP04's own output (M/data-model.md) is NOT code lineage and does not arrive that way: see OO-5. WP07 and WP08 also list WP04 but receive the code through WP05/WP07. Every code WP
# transitively receives, through direct dependency lanes, every code WP it uses; nothing depends on the planning WP04 alone.
#
# TASKS.MD AND CREATE_INTENT (TASKS-DECOMP-010). tasks.md is regenerated by finalize-tasks from this file and keeps only the WP titles, no
# header and no PR column. The '[PR A]' / '[PR B]' title tag is the deliberate realisation of the plan's PR column (plan section 11: tasks.md
# carries a PR column), recorded here as a deviation for a plan amendment note. After finalize-tasks the orchestrator prepends a header
# section to tasks.md (the PR split, the WP-to-PR map, the external dependencies #5529 and the #5533 stacking); nothing writes tasks.md by hand.
# create_intent (the literal new-file paths of a WP) is read by finalize from the prompt frontmatter and lives ONLY there; it is derived from
# the new literal files of each WP's owned_files, and every new literal owned path must be listed in it. owned_files, dependencies,
# requirement_refs, subtasks and title must stay equal between this file and each prompt's frontmatter.
#
# SHARED-FILE MERGE ORDER AND CONFLICT RULES (TASKS-ORDER-005, TASKS-DECOMP-003, TASKS-FRESH2-003). The shared files are R/jacoco-class-floor.properties,
# T/adapter/in/http/rest/OutOfScopeRoutesTest.java, T/architecture/ArchitectureControlsTest.java (WP11 and WP12 concurrently; ArchitectureRulesTest and
# ArchitectureRules are edited by WP12 only) and, when evidenced, a detail record of WP12. PR A lane merge order: WP11 before WP12 (OO-6). The orchestrator merges the route lanes in the
# order WP13 -> WP14 -> WP15 -> WP16 and each later lane rebases onto the merged tree. Neither file has a git merge driver, so a conflict is
# real and is resolved by rule, never assumed to merge silently: OutOfScopeRoutesTest keeps the INTERSECTION of the remaining paths (a path
# any lane removed stays removed); the properties file takes neither side and is rewritten from the plan section 2 command on the merged
# tree (D-145). ArchitectureControlsTest keeps the UNION of the Control rows of both lanes (WP11: C12aPortOut and A12cUsesCodec; WP12: ids 15 and 16, the count of 16, the SKELETON list); the lane merged second re-runs ArchitectureControlsTest and ArchitectureRulesTest (count assertions, contiguity guard) on the merged tree and recomputes any count, never keeps one computed on a single lane. WP11 and WP12 (PR A) follow the same recount rule for the properties file, with the PR A tip equality owned by WP12 (see D-145 JACOCO EQUALITY). R/portlevel-tests.txt is no longer a shared file (see PORT-LEVEL LEGS).
# WP12 ships the 21 detail records complete from the contract schemas; WP13..WP16 make NO routine edit of them. A named edit of a record is
# permitted only when the route's schema or golden proves a member missing or wrong (the plan section 11 shared-file table lists these as
# named edits; accepted named-edit risk, one record per commit, rebase first). Making WP12 'final with no edit', or moving the records into
# the route WPs, would contradict that table and is left to the orchestrator.
#
# PORT-LEVEL LEGS (TASKS-GREEN-001). PortLevelClassSetTest requires every class in conformance.port to depend on PortSourceSelector or
# PortFixtures, and PortSubsetSecondLegTest runs every id of R/portlevel-tests.txt on an in-memory and a filesystem source through a selector
# fixture, which carries only MissionStatusQuery (Fixture#query, FixtureFactory.Built, FilesystemFixtureFactory.Built: P1a files that no WP
# of this mission may edit). A detail port cannot be carried by it. Decision (least new ownership): the detail port-level legs
# (MissionDetail/WorkPackage/WorkPackageDetail/ArtifactPortLegsTest) live in T/application/query/portlegs/, outside conformance.port, and
# are NOT listed in R/portlevel-tests.txt; WP13..WP16 append nothing to it, and WP18's AdmissionGatePortLevelTest is likewise unlisted.
# WP05 alone appends ids (to Ac5ReductionTest, which already opens selector fixtures). Gate G of WP05 and WP13..WP16 names PortLevelClassSetTest
# and PortSubsetSecondLegTest. Deviation for the orchestrator: spec AC-13.5 and the plan shared-file row say the list 'gains' the detail
# legs; the alternative (a WP10 named edit of PortSourceSelector, Fixture, PortFixtures, FixtureFactory and FilesystemFixtureFactory so a
# detail port is built by DetailFixture on both legs) needs five P1a files and was rejected.
#
# D-145 JACOCO EQUALITY (TASKS-GREEN-006, TASKS-FRESH2-004). WP12 has no WP11 in its lane (plan section 11 Depends-on of P8 is P5, P7, P2 and is kept), so the equality cannot be checked on WP12's own lane. Rule: the orchestrator merges WP11 first (OO-6) and WP12 is the LAST PR A work package to merge; WP12 T088 compares the properties file with the section 2 command on the MERGED tree (WP11's lane merged into WP12's lane workspace first), which is PR A's tip, and records the comparison and the tree sha in its commit message. WP11 T079 recounts for its own lane only; WP17 T125 is the
# single owner of the comparison at PR B's tip; WP18 T133 re-runs it. A mismatch is repaired by a named edit of the properties file by the WP
# that found it (WP17 or WP18), in a commit of its own.
#
# ORCHESTRATOR RULINGS AND OPEN OBLIGATIONS. OO-1 to OO-4 were ruled by the orchestrator on 2026-10-13 (binding; each ruling is recorded in the
# affected prompts). OO-5 and OO-6 are standing orchestrator actions.
#  OO-1 RULED (WP04, WP05, WP08): history semantics follow the Python oracle's behaviour ("port what Python runs"). `history` is the oracle's
#       history_entries: every to_lane row of the Work Package, ordered by HistoryOrder, with no event_id de-duplication and no rollback
#       arbitration. The two extra resolved-state fixtures (a duplicate-event_id row, a lost-arbitration row) are NOT required. The soft/conditional
#       wording of WP05 T032 and WP04's open point is removed.
