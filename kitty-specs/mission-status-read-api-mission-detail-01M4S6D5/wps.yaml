#       extensions, the P0 baseline tests appended to the existing Python file) are allowed as test code, and edits to existing tests/ci pins and
#       scripts/ci are maintenance. No new Python file is added by PR B: the AC-18.1 README test of WP17 T124 is a JAVA test,
