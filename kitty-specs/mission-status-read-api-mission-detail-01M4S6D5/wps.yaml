#       ProvisionPlan reads it from the source fixture directory and removes a stray copy at the scratch root. No named edit of NOT_COPIED.
#  F1/E-12 INTERIM DEFAULT (orchestrator; operator decision on plan E-12 open) (PR B, WP13..WP18): PR B adds only NEW files to the mission directory (archive freeze). No work package of PR B edits an existing
