#       (the PR B work packages draft the tracer text in their hand-off report; the orchestrator lands it in the PR B addendum, a new add-only file, unless the operator rules otherwise on plan E-12, where this option (a) is the orchestrator's interim default). PR A work packages may create and append M/ files because they are
#       not yet on main.
