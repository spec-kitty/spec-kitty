      profile-invocation.md and the changelog .changed fragment all state it, and
      the refusal message names #7013 and tells the caller to omit --model.
  - id: A03
    question: Does the trailer path share one implementation across both commit paths and both sources?
    result: PASS
    note: >
      One resolver (git/commit_attribution.py) feeding one message builder in
      _commit_op_record; per-record and spine commits and configured/explicit
      values all go through it. No second trailer implementation exists.
  - id: A04
    question: Does the change keep the #6410 skip rules and the #6564 refusal outcomes?
    result: PASS
    note: >
      The trailer is resolved after both decisions; a skipped or refused commit
      never gains a trailer, and an attribution refusal is reported through the
      existing OpCommitOutcome.refusal channel the close output and doctor sweep
      already print.
  - id: A05
    question: Is any historical Op record modified anywhere in the diff?
    result: PASS
    note: >
      git diff origin/main -- kitty-ops/ shows only new kitty-ops/lifecycle/*.json
      bookkeeping files; no pre-existing <ULID>.jsonl record is added, removed or
      modified.
  - id: A06
    question: Do the docs and the code agree, including the doc surfaces this mission did not write?
    result: PASS
    note: >
      trail-model.md, configuration.md and profile-invocation.md were re-read
      against the tests: absent key, blank key, malformed key, override, exit
