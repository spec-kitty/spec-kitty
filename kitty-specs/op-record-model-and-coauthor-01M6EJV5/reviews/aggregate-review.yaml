      agent-subcommands.md were re-spliced from the live surface, not hand-typed.
  - id: A07
    question: Is anything left that a no-op change could have passed?
    result: PASS
    note: >
      The absence probe for model_id is paired with a positive control that names
      the model in the recommendation; the no-trailer ratchet is paired with the
