  - id: PLAN-FRESH5-001
    status: resolved
    reason: >
      §6b's subsection is retitled "Preserving the public `.cache_clear()`/`.cache_info()`
      seam across the split (PLAN-FRESH4-ARCH-001, sev 4; PLAN-FRESH5-001, sev 4)"
      (plan.md ~line 405) and its binding requirement now reads "the new public
      `resolve_layered_mission_types` wrapper must expose `.cache_clear`, `.cache_info`,
      and `.cache_parameters` attributes that forward to
      `_resolve_layered_mission_types_cached`'s own", with the code block adding all
      three binding lines (`.cache_clear`, `.cache_info`, `.cache_parameters`, ~lines
      455-457) — matching the remediation's "at minimum ... plus .cache_parameters if
      needed" instruction by including all three. `tests/charter/test_charter_import_time_io.py:231`'s
      live `resolve_layered_mission_types.cache_info()` call is cited twice as driving
      evidence (in the retitled subsection body and again in the closing paragraph). The
      "zero test-file edits" claim is preserved and is verifiably still true: `git status
      --porcelain` and `git diff --stat` for the whole checkout show only `plan.md`
      changed — no test file was touched. §14's production-fix commit step (~lines
      1446-1449) now explicitly names `tests/charter/test_charter_import_time_io.py` as
      part of the fix's own verification list, tied back to PLAN-FRESH5-001. The actual
      chosen mechanism (three explicit attribute-binding lines, not `functools.update_wrapper`)
      is correct Python and was empirically verified: `resolve_layered_mission_types.cache_clear
      = _resolve_layered_mission_types_cached.cache_clear` (and the `.cache_info`/
      `.cache_parameters` siblings) unconditionally copies a working reference to the
      target attribute regardless of how that attribute is implemented on the source
      object, so the fix works. One caveat noted for completeness, not blocking
      resolution: the plan's aside claiming `functools.update_wrapper` would copy "never
      `cache_clear`/`cache_info`/`cache_parameters`" is only accurate for `cache_clear`/
      `cache_info` (verified empirically: these are C-level type methods on the standard
      CPython `functools.cache` wrapper, absent from its `__dict__`) — `cache_parameters`
      is actually set as a plain instance attribute by `functools.lru_cache()` and *would*
      land in `wrapped.__dict__`, so `update_wrapper`'s `__dict__.update()` step would in
      fact copy it. This is a minor inaccuracy in a rejected-alternative justification, not
      in the operative binding requirement or code block, which is explicit, unambiguous,
      and does not rely on `update_wrapper` at all — it does not change the fix's
      correctness or reopen the finding.
