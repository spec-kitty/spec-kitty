      `mission_step_repository.py:163-169` (the function body, no
      try/except) and its caller
      `_resolve_all_for_mission_type_uncached` (`mission_step_repository.py:335-364`,
      also no surrounding try/except around any of the three
      `_add_step_ids_from_dir`/`_collect_org_step_ids` call sites), so a
      fault injected there is a real, non-vacuous production raise
      reachable through `create_mission_core`, not a test that only proves
      "the code I patched raises what I told it to." (4) Applied the
      profile's anti-laziness directive here specifically (reviewer-renata's
      "Tests as Scaffold, Not Friction" directive/024/030, and the
      task's explicit instruction not to rubber-stamp): sanity-checked
      whether declaring OBL-3 "green at Base" is consistent with CL-004's
      ATDD framing and CL-003's severity-4 bar. It is a legitimate
      exception, not a quiet weakening, because (a) CL-004/FR-004 name **a**
