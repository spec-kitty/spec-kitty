      — read in full, confirmed no stray exception handling was
      introduced; a `with lock:` block releases on the way out via
      `__exit__` regardless of exception and does not suppress it. (3) The
      PRIMARY_SITE/SECOND_SITE fault-injection asymmetry is handled
      honestly: §9's new "OBL-3's fault-injection seam, per site" binding
      note picks `_load_layered_mission_type_file` for SECOND_SITE (already
      propagates uncaught per §8a's "Loader's catch semantics" row) and
