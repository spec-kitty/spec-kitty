findings:
  - id: TASKS-DECOMP-001
    lens: "OBL-3 red/green framing not diluted"
    severity: 3
    title: "WP01's Objective and T002's headline both label the OBL-1+OBL-2+OBL-3 commit a 'red-first ... trio', re-introducing the exact confusion the arbiter's plan-phase ruling closed"
    evidence:
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md § Objective, line 63"
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md § Subtask T002 Purpose, line 266"
      - artifact: "reviews/plan.ruling.md, ARB-001/DEBBIE-001 disposition and 'Global ruling' item 5 (commit phasing must state which reds are load-bearing and which are trivial; OBL-3 is never red)"
      - artifact: "plan.md:1434-1440 (§14 commit phasing: 'OBL-3 is already GREEN at this commit, not red ... it is committed alongside the red obligations for review-diff cohesion, not because it is red-first')"
    claim: >
      The Objective section's summary sentence reads: "by (1) landing a
      red-first, Barrier-synchronized regression test trio proving the
      defect is real and reachable through create_mission_core, then (2)
      fixing both sites ...". The "test trio" is OBL-1+OBL-2+OBL-3 (per
      T002's own Purpose line, which groups the same three obligations
      under "Land the ATDD red-first commit (C-011) — OBL-1, OBL-2, and
      OBL-3"). Both headline statements characterize the whole three-test
      set, OBL-3 included, as "red-first" / "the ATDD red-first commit",
      with no adjacent qualifier. The plan (and the arbiter ruling that
      produced it) is explicit and unusual on this exact point: OBL-3 is a
      construction-invariant that is ALREADY GREEN at Base and must never
      be characterized as red-first — this is precisely the confusion that
      reopened PLAN-VERIFY-003 in the plan phase (reviews/plan.ruling.md,
      ARB-001). WP01's body does correctly disambiguate OBL-3 later (the
      OBL-3 table row, the revert matrix, the commit-phasing section, and
      T002 step 7's explicit "State plainly ... that OBL-3 is committed
      green (regression guard, not red-first)"), but the two headline
      statements a reader encounters first — the Objective and T002's own
      Purpose line — both use "red-first"/"ATDD red-first commit" to
      describe a set that includes OBL-3 without any co-located caveat,
      which is exactly the phrasing pattern the review brief calls a
      severity>=3 finding on its own.
    remediation: >
      Add an explicit, co-located qualifier to both headline sentences.
      Objective (line 63): change "(1) landing a red-first, Barrier-
      synchronized regression test trio" to something like "(1) landing a
      red-first regression test pair (OBL-1, OBL-2) plus a green-at-Base
      construction-invariant regression guard (OBL-3), all Barrier-
      synchronized and committed together for review-diff cohesion". T002
      Purpose (line 266): change "Land the ATDD red-first commit (C-011) —
      OBL-1, OBL-2, and OBL-3" to "Land the ATDD red-first commit (C-011) —
      OBL-1 and OBL-2 red-first, plus OBL-3 (already green at Base, a
      regression guard, not red-first evidence) committed alongside them
      for review-diff cohesion".

  - id: TASKS-DECOMP-002
    lens: "Mission-derived — binding-notes fidelity (§6b's 13-call-site dependency)"
    severity: 3
    title: "WP01's restructured '13 existing call sites' claim is internally inconsistent (its own itemized list sums to 14, not 13), and a second count ('12 other call sites') in the Risks section disagrees with both"
    evidence:
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md line 138 ('13 existing call sites depend on this: 12 direct .cache_clear() calls ..., plus MissionTypeRepository.cache_clear()'s own body ..., plus one .cache_info() call ...')"
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md line 382 ('... will silently break tests/charter/test_charter_import_time_io.py and 12 other call sites with AttributeError')"
      - artifact: "plan.md:412-414 (arbiter-corrected text, landed in commit 57769a254: '12 call sites across three test files call resolve_layered_mission_types.cache_clear() directly (13 including the one .cache_info() call site below) ..., MissionTypeRepository.cache_clear()'s own body ... also calls it directly')"
      - code: "tests/charter/test_charter_import_time_io.py:99,102,231 (2 .cache_clear() + 1 .cache_info() call)"
      - code: "tests/charter/test_mission_type_path_layout_ssot.py:79,82 (2 .cache_clear() calls)"
      - code: "tests/doctrine/missions/test_mission_type_repository.py:543,546,655,658,809,812,901,904 (8 .cache_clear() calls)"
      - code: "src/charter/offering/missions/mission_type_repository.py:206 (MissionTypeRepository.cache_clear()'s own body calling resolve_layered_mission_types.cache_clear())"
    claim: >
      Verified by direct grep: there are exactly 12 test-file
      `.cache_clear()` calls (2 in test_charter_import_time_io.py, 2 in
      test_mission_type_path_layout_ssot.py, 8 in
      test_mission_type_repository.py) plus 1 `.cache_info()` call (also in
      test_charter_import_time_io.py) plus the production-code self-call at
      MissionTypeRepository.cache_clear()'s own body
      (mission_type_repository.py:206) — 14 distinct call sites total that
      depend on the forwarding fix. plan.md's own text (corrected in commit
      57769a254, "fix(plan): correct second-site decorator naming and
      call-site count") states "12 ... (13 including the .cache_info() call
      site)" as ONE figure, then separately names the repository's own-body
      call as an ADDITIONAL fact not folded into that "13" — internally
      consistent, if terse. WP01 restructures this into a single "plus ...
      plus ..." enumeration ("12 direct .cache_clear() calls ..., plus
      MissionTypeRepository.cache_clear()'s own body ..., plus one
      .cache_info() call ...") that arithmetically sums to 14 while still
      being labeled "13 existing call sites" — an internal contradiction
      introduced by WP01's own rewording, not present in plan.md's phrasing.
      The Risks section then gives a THIRD, also-wrong figure: "12 other
      call sites" besides test_charter_import_time_io.py — but the two
      other files together hold only 10 `.cache_clear()` calls (2 + 8), so
      "12 other" overcounts by 2. This is exactly the SECOND_SITE binding
      requirement the WP itself calls "highest risk" (the forwarding-
      attribute regression), so an inconsistent call-site tally undermines
      confidence a reviewer checking "did every dependent call site stay
      green" is working from a correct completeness bar, even though the
      concrete file/test names cited elsewhere (T004 steps 7-8, Reviewer
      Guidance) are accurate.
    remediation: >
      Fix the arithmetic at both sites. Line 138: either change the
      headline to "14 existing call sites" (12 cache_clear + 1 cache_info +
      1 repository-body self-call) if all three items are being summed, or
      restore plan.md's original structure — "13 existing call sites (12
      `.cache_clear()` + 1 `.cache_info()`) plus the repository's own body
      call as a 14th, separately-tracked dependency" — so the stated total
      matches its own itemization. Line 382: change "12 other call sites"
      to "9 other .cache_clear() call sites plus the repository's own body
      call" (or simply "13 other call sites total, across two test files
      and the repository's own cache_clear() body") to match the corrected
      count.

  - id: TASKS-DECOMP-003
    lens: "Mission-derived — binding-notes fidelity (§8d binding constraint 6, NFR-001 cross-process/hash-seed determinism)"
    severity: 3
    title: "Binding constraint 6 (NFR-001 determinism verified across separate processes with varied PYTHONHASHSEED) is transcribed verbatim but never wired into any subtask's Steps, Validation, or Definition of Done — unlike all 6 other §8d constraints"
    evidence:
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md § Binding constraints, item 6, line 185"
      - artifact: "plan.md:846-850 (§8d item 6) and plan.md:900-905 (§9 'Cross-process/hash-seed determinism (NFR-001)')"
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md § Subtask T001 Steps/Validation (lines 251-262) — no PYTHONHASHSEED/subprocess step"
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md § Subtask T002 Steps/Validation (lines 264-278) — no PYTHONHASHSEED/subprocess step"
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md § Definition of Done (lines 363-376) — no PYTHONHASHSEED/subprocess item"
      - artifact: "tasks/WP01-concurrent-yaml-cache-race-fix.md § Reviewer Guidance (lines 387-395) — no PYTHONHASHSEED/subprocess bullet"
    claim: >
      All 7 of §8d's binding constraints are present in WP01's "Binding
      constraints on any harness" list (lines 178-186), and constraint 6
      is transcribed accurately: "NFR-001 determinism verified across
      SEPARATE PROCESSES with varied PYTHONHASHSEED, not one in-process
      loop ...". However, comparing this against the other 6 constraints
      shows a gap unique to constraint 6: constraint 1 (file-identity pin)
      is operationalized in T001 step 1/2 and T002 step 1; constraint 2
      (seam survives both commits) is operationalized in T001
      step 2/T003 step 4; constraint 3 (no lock across a barrier) is
      operationalized in T002 step 2's distinct-key construction; constraint
      4 (function-scoped teardown) is operationalized in T002 step 5;
      constraint 5 (count guards populations) is operationalized in T004
      step 6 and the OBL-2 table row; constraint 7 (CL-004 outer-call rule)
      is operationalized in T002 step 2's explicit "NOT through _run_create"
      instruction. Constraint 6 has no matching action item anywhere: no
      subtask instructs the implementer to actually run OBL-1's forced-
      interleave test across separate processes with varied
      PYTHONHASHSEED, no Definition-of-Done line checks it, and no Reviewer
      Guidance bullet asks a reviewer to confirm it was done. A mechanical
      implementer who completes every listed Step and ticks every DoD line
      could finish T001-T007 having never verified that OBL-1's verdict is
      hash-seed-independent — precisely the gap DEBBIE-002 (round 3) raised
      against the plan, now able to re-enter silently at the WP level
      because the obligation was moved into prose-only "binding constraint"
      form with no execution hook.
    remediation: >
      Add a concrete action item operationalizing constraint 6, most
      naturally inside T002 (where OBL-1's forced-interleave test is
      authored) or T006 (where the revert matrix and gate set are
      mechanically verified). E.g., add a T002 step: "Run OBL-1's PRIMARY_SITE
      case at least N times as separate subprocess invocations with
      PYTHONHASHSEED explicitly varied (e.g. `PYTHONHASHSEED=0`,
      `PYTHONHASHSEED=1`, `PYTHONHASHSEED=random` across several runs) and
      confirm the red/green verdict at each commit does not depend on the
      seed; record the result in the commit message or tracer notes." Add a
      matching Definition-of-Done line under T002 and a Reviewer Guidance
      bullet asking the reviewer to confirm this multi-seed run was
      actually executed (with evidence), not merely asserted.

complete: true
