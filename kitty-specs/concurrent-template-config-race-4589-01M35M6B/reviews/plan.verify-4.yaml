      plan.md §6b (lines 326-437) was rewritten to a single-flight design: the
      lock now wraps the whole cached call (resolve_all_for_mission_type /
      resolve_layered_mission_types), so a losing thread's call becomes a
      functools.cache hit instead of a second walk, and lines 399-412 argue
      population count is provably 1. §5 (lines 237-277) and §7 (lines
      593-600, "a warm hit's lock touch, honestly stated") are reconciled to
      this design rather than repeating the old "warm hit never touches a
      lock" claim. §8a's fact table (line 657) and §9 (lines 752-762)
      explicitly correct the counting unit to the whole per-key walk, never
      _load_layered_mission_type_file, and OBL-2's revert-matrix row
      (§8b/§8c) makes the property testable in both the 6a+6b and
      6b-reverted states.
