      three named mechanisms"). (b) FR-006 (spec.md line 427): reworded to
      "any exception encountered during cache population in the fix's new
      lock/cache code (e.g., ... if any such mechanism is ever introduced;
      the approved design (CL-008) introduces none of the three)" plus a new
      "never leave a partial result cached" clause matching SC-006(b) —
      consistent with both CL-006 and the new SC-006, no contradiction found.
      (c) CL-008 (spec.md lines 170-196) accurately cites
      PLAN-FRESH4-DEBBIE-001 by id and severity (severity 4, confirmed
      against reviews/plan.fresh-4-debbie.yaml verbatim), accurately restates
