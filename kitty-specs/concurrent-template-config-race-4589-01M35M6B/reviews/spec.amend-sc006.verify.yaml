  - id: AMEND-SC006-001
    status: resolved
    reason: >-
      The amended SC-006 (spec.md ~line 495-503) requires an exception raised
      "during cache population (e.g., a fault injected into the step-loader
      or mission-type loader)" to propagate unchanged, with nothing partial
      cached. Checked against plan.md's actual §6b/§6c code sketch (lines
      326-495), not against plan.md's own (stale) prose about SC-006/OBL-3:
      a genuine production raise path exists at SECOND_SITE —
      `_load_layered_mission_type_file` re-raises `ruamel.yaml.error.YAMLError`
      as a `ValueError` and lets any other non-YAMLError corruption propagate
      uncaught (plan.md §8a fact table, "Loader's catch semantics" row, line
      658) — and §6b's lock-wrapping call site (lines 370-379) is a bare
      `with _lock_for(key): return _resolve_all_for_mission_type_cached(...)`
      with no try/except, so that exception propagates through the lock
      release to the caller unchanged. Standard `functools.cache` semantics
      (relied on throughout §6b, e.g. lines 403-412) never store a result for
      a call that raised, so the next call is a genuine re-attempt, not a
      poisoned hit — this substantiates SC-006's "nothing partial is cached
      ... next call re-attempts and succeeds" clause without inventing any
      mechanism beyond what §6b already specifies. This is a real,
      testable code path reachable via `create_mission_core`, and the new
      SC-006 does not require the design to add a new exception type,
      timeout, or retry logic to satisfy it — unlike the original SC-006.
      CAVEAT (see AMEND-SC006-006): plan.md itself (§7 lines 569-580, §8b
      OBL-3 row line 671) still describes the *old*, since-debunked
      fault-injection framing ("forcing the per-key concurrency-control seam
      Section 6b adds to fail deterministically" / raising
      `MissionCacheLockError`) that PLAN-FRESH4-DEBBIE-001 itself flagged as
      having no real call site. plan.md has not been touched by this
      amendment (git diff --stat HEAD -- plan.md is empty) and
      reviews/plan.verify-4.yaml carries no result for
      PLAN-FRESH4-DEBBIE-001 or -002. The new SC-006's own wording is sound
      and satisfiable by the design; plan.md's prose describing how to test
      it is not yet consistent with that new wording. Rated resolved for
      spec.md's own content; the plan-level gap is tracked separately below
      so it is not lost.
  - id: AMEND-SC006-002
    status: resolved
    reason: >-
      The amended SC-006 states two explicit, checkable failure modes: "(a)
      the propagation is replaced with a silent-degrade return, or (b) the
      failed population is cached, i.e., a second call made after the fault
      does not re-attempt population" (spec.md ~line 501-503). Both are
      concrete, assertable test predicates (exception type/propagation on
      the first call; a second call after the fault must still attempt
      population, not return a stale/absent result silently). This is more
      specific than the original SC-006, which only named one failure mode
      (raise replaced with a silent-degrade return) — the amendment adds a
      second failure mode (cache poisoning by a failed population) without
      losing the first. Not vague; both modes name an observable, single
      assertion each.
  - id: AMEND-SC006-003
    status: resolved
    reason: >-
      The amended SC-006 preserves the original's core prohibition nearly
      verbatim: "never converted into `None`, an empty mapping, or a partial
      `template_set`" (spec.md ~line 497-498) matches the original's "never
      returns `None`, an empty mapping, or a partial `template_set`" word
      for word in substance. CL-006 (spec.md lines 135-150), which SC-006
      cites, likewise still requires raising "on every failure path" and
      still forbids `None`/empty-mapping/partial-`template_set` returns, and
      was explicitly broadened ("including, but not limited to, a lock
      timeout, a corrupted-cache detection, or a retry-exhaustion path,
      should any of those specifically be introduced") rather than narrowed.
      The amendment does not restrict the guarantee to only the three
      originally-named (and design-absent) mechanisms — SC-006 now reads "an
      exception raised during cache population (e.g., ... step-loader or
      mission-type loader)," which is broader than the original's
      lock-timeout/corrupted-cache/retry-exhaustion framing, and CL-008
      states this explicitly ("from any source, not limited to the three
      originally-named mechanisms"). The "never None/empty/partial" language
      is present in both SC-006 and CL-006 and was not dropped.
