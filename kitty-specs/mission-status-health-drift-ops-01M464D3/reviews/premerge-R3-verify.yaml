fresh:
  - id: R3-FRESH-001
    severity: 2
    title: Project.lastActivityAt contract description is silent on the status.json degrade and the event-log 500
    evidence:
      - code: "contracts/mission-status/schemas/Project.yaml:109-115"
      - artifact: "R2-refute.yaml PR-CONTRACT-001 option a (chosen): 'State the status.json null in the lastActivityAt description and in FR-024's Project row'"
    claim: >-
      FR-024 got its rows, but the contract description still says lastActivityAt is taken "over exactly the Missions
      GET /missions lists". A Mission with an undecodable status.json still counts on the Project read, which answers
      200, while GET /missions fails on it. A consumer reading only the contract cannot know either behaviour. Ruling 2
      as written does not demand the description edit, so this is a gap against R2's option text, not against the ruling.
    remedy: "Add one sentence to the lastActivityAt description and its x-derived rule: a Mission whose status.json cannot be read still counts and adds no activity; an event log that cannot be read fails the read. Fold it into the J-1 replay, or record that ruling 2 deliberately leaves the contract text unchanged."
  - id: R3-FRESH-002
    severity: 2
    title: wrap-cli-version in CRASH_KILLS hides its assertion kill
    evidence:
      - code: "tests/contract/test_mission_status_project.py:841 (CRASH_KILLS)"
    claim: >-
      Every mutation in the three tables was classified. The five CRASH_KILLS members crash with their intended defect
      class: UnexpectedWrite, UnexpectedProcess, the re-raised CoordAuthorityUnavailable, and the AttributeError of an
      unguarded load on list-shaped metadata. A guarded unguarded-load variant gives no problem, so its crash is its only
      defect. wrap-cli-version is different. With its crash guarded it still gives 11 assertion problems (the 'unknown'
      sentinel served). But row1 aborts at the first crash, so today the kill is crash-only (other=0, crash=2). Delete
      the sentinel assertions from row1 and the mutation table stays green. No mutation passes by crashing where it
      should not, so the fix holds; the cost is that the sentinel assertions are no longer protected.
    remedy: "Make row1 and row2 catch a raise per case and record it as a problem line, so the sentinel cases still run. Then drop wrap-cli-version from CRASH_KILLS."
  - id: R3-FRESH-003
    severity: 1
    title: AC-OPS credential row cites only the WP08 ruling for the actor part
    evidence:
      - artifact: "spec.md AC-OPS row 'credential in a handle (operator ruling at WP08, 2026-10-07)'"
    claim: "The actor half of the row comes from the post-squad ruling, but the row label cites only WP08."
    remedy: "Append 'and the ruling after the pre-merge squad, 2026-10-07' to the row label."
  - id: R3-FRESH-NIL
    severity: 1
    title: "Swept, no defect found: status.json UnicodeDecodeError path, kitty-ops trigger scope, store.py glob, hygiene"
    claim: >-
      (a) No UnicodeDecodeError regression. On a copy of a real Mission, an undecodable status.json still gives null
      activity and does not raise. 28 event-field corruptions (each field dropped or set to an int) all raise or serve
      the correct instant; none gives a silent null. A broken meta.json fails earlier, in the resolver
      (MissionMetaReadError). (b) kitty-ops/** selects exactly always-on plus the corpus-gated jobs (pinned). The
      duplicate-suite, workflow-coherence and release-ownership gates are green. (c) Reverting the store.py glob turns
      test_the_contract_tools_filter_group_names_every_src_file_the_mission_status_reader_and_its_tests_import red.
      (d) No home paths, usernames, scratchpad paths or ledger ids in the diff or the commit messages of the range.
    remedy: "None."
