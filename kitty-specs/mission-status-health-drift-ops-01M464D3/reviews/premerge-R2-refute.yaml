  - id: PR-TESTS-001
    verdict: REFUTED
    severity: 1
    remedy_kind: single
    refutation_attempt: >-
      Not a detection gap. seconds_combined = seconds_project + seconds_scan + seconds_per_mission
      (test_mission_status_reality.py:2493-2494), and every resolver call of the shared memo is paid inside seconds_project.
      So a cold scan (resolver plus scan reduction) is at most seconds_project + seconds_scan, which is at most the combined
      bound of 120 s. "One scan at most 120 s, resolver included" therefore holds transitively. R1's own revert probe agrees:
      the Project bound (141.9 s) and the combined bound (149.7 s) both went red. The shared execution is plan-ruled (D-P5
      "Execution sharing", plan-round). It was not re-run, because the conclusion follows from R1's recorded numbers and the
      code.
    remediation: >-
      Nit: the test_corpus_scan_is_within_its_bound docstring says that seconds_scan is the warm reduction, and that the
      resolver-inclusive scan bound is carried by the combined case. W-7 cites the combined case for "resolver included".
  - id: PR-TESTS-002
    verdict: CONFIRMED
    severity: 2
    remedy_kind: single
    refutation_attempt: >-
