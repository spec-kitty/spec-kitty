      kinds 1/2, kind 3, per-Mission, project and planted-repository cases all passed: 5 passed, 0 skipped, online. The
      planted repository holds kind-3 plants, so the green is not vacuous. reader_finding_keys and difference_problems
      compare sets (:2295-2308). The fixture rows catch the plant, so this is a gap in the corpus evidence only.
    remediation: "As R1: assert len(findings) == len(reader_finding_keys(findings)) in the corpus kind cases and the planted-repository case."
