entries:
  - id: PR-CONTRACT-001
    verdict: CONFIRMED
    severity: 3
    remedy_kind: fork
    refutation_attempt: >-
      No ruling covers the event log. The WP03 rework (tasks/WP03-project-vertical/review-cycle-3.md, commit 8b970f977) and the
      tracer close-out line "Refined at the WP09 review" both name only an undecodable status.json. That rework was a review
      decision with reviewer_agent "user", not an operator ruling. Its premise also overreaches: the "never raises" clauses of
      FR-002 and FR-003 are scoped to specKittyVersion and schemaVersion, and FR-006 and FR-024 say nothing about
      lastActivityAt never raising. FR-024 governs here. Its header says no read reports null as success when the truth is
      "could not read", and its Project.lastActivityAt row allows null only for "no Mission, or none with activity".
      Re-probed in a scratch repository with two Missions (b holds the later instant). Clean: lastActivityAt is b's instant.
      Event log plus one invalid-UTF-8 line: a's older instant is served as success. Event log plus one non-JSON line: the build
      raises StoreError. Undecodable status.json: a's instant is served. v1 load_source raised on all three plants
      (JSONDecodeError, JSONDecodeError, UnicodeDecodeError), so FR-006's "exactly what GET /missions lists" cannot hold in
      any of them. A side fact: the activity of the status.json case can be derived, because the event log is intact. The
      null there is materialize_snapshot's status.json read (_target_schema_version) failing, not missing activity.
    evidence:
      - code: "tests/contract/_mission_status_project.py:178-183 (the catch is in _mission_activity; R1's line numbers are stale)"
      - artifact: "spec.md FR-024 header and Project.lastActivityAt row; FR-002/FR-003 'does not raise' scoped to their own fields"
      - artifact: "tasks/WP03-project-vertical/review-cycle-3.md (scope: status.json only)"
    fork:
      options:
        - id: a
          text: >-
            Narrow the catch so that only the status.json read degrades. An event-log failure (invalid UTF-8, or non-JSON as
            today) ends the read as a failure under the default Problem, as GET /missions and GET /drift do. State the
            status.json null in the lastActivityAt description and in FR-024's Project row, and add an event-log plant beside
            the existing status.json plant. This makes the two event-log corruptions consistent.
        - id: b
          text: >-
            Keep the broad degrade. Record it as an operator ruling, state it in the lastActivityAt description and in FR-024,
            and also catch StoreError so that the non-JSON line degrades too. Today the two event-log corruptions give opposite
            outcomes.
      recommendation: >-
        a. The event log is the authority, and FR-024 forbids serving a wrong instant as success. Either option edits a
        contract description, so it rides the same J-1 replay as the other text fixes.
  - id: PR-CONTRACT-002
    verdict: CONFIRMED
    severity: 2
    remedy_kind: single
    refutation_attempt: >-
      Re-probed project_version on a metadata.yaml version of the AKIA shape (20 characters) and of the ghp_ shape
      (40 characters). Both were served verbatim, and leak_codes(STRICT) on the served value gave ('SECRET',). The
      19-character control was served with no hit. The reader follows FR-002 exactly ("a matching string -> that string"), so
      the gap is in the spec table. The Project promise "never carries ... a credential" is pre-existing on main (abafc135e
      Project.yaml), and this Mission added the first field that can break it. Severity is lowered from 3: the input is
      contrived (a value the CLI writes), and an implementer of FR-002 still builds the field correctly apart from this guard.
    remediation: >-
      In project_version, return null when leak_codes(version, STRICT) is non-empty, as current_branch_of does. Add the
      credential row to the FR-002 table, and add a plant per fitting SECRET_PATTERNS shape with a one-character-short
      control. No contract text changes, because the Project description already promises this, so no J-1 replay is needed.
  - id: PR-CONTRACT-003
    verdict: CONFIRMED
    severity: 3
    remedy_kind: fork
    schema_facts: >-
      OpsInvocation.actor is in OpsInvocation.required (13 members, all required). It is "$ref: ActorHandle.yaml" with the
      description "or null when the stored value is not a handle". ActorHandle.yaml (unchanged from main, abafc135e) has
      type [string, 'null'], minLength 1, maxLength 128 and pattern ^[A-Za-z0-9._:-]+$. So actor is required AND nullable.
      The premise of the WP08 record, "required and not nullable", is false. Both credential shapes (AKIA..., ghp_...) fit
      the ActorHandle pattern, so without the WP08 guard actor_of would serve them verbatim.
    refutation_attempt: >-
      Not refutable. tracer-design-decisions.md "Operator rulings at WP08" item 2 says the operator's option text had actor
      become null, and that the implementation chose skip on the false premise. spec.md FR-017 (line 369) contradicts itself:
      the member list says "actor (ActorHandle, nullable ...)", and the amendment says "not nullable in the schema". The
      reader's actor_of already serves null for a non-handle actor (tests/contract/_mission_status_ops.py:186-188), and
      handle_holds_credential (:378-380, :409) skips the record.
    fork:
      options:
        - id: 'null'
          text: >-
            A credential-shaped actor is served as actor: null. The Op stays in items and totalCount, and skippedCount is
            unchanged. profileId and action still skip, because they identify the record. Reader change: drop started.actor
            from handle_holds_credential, and make actor_of return null when holds_credential(actor). Contract text: the
            OpsInvocation.actor description becomes "or null when the stored value is not a handle or holds a credential".
            ActorHandle, which is shared with v1, stays untouched. Spec: correct FR-017 and FR-019 so they no longer list
            actor among the skip causes, and invert AC-OPS row 637 for actor (the failure becomes "actor served", and
            "actor nulled" becomes the pass). Matches the operator's original option, the OQ-5 precedent (a credential
            withholds a field and keeps the Op) and FR-017's own rationale ("actor alone degrades: attribution"). Cost: a
            reader, test and description edit, plus a J-1 replay for the description.
        - id: skip
          text: >-
            Keep the code. A credential-shaped actor skips the whole Op: it leaves items and totalCount, skippedCount rises,
            and a closed Op with that actor vanishes from the screen. Correct the false sentence in FR-017 and in the tracer
            record, so the rationale reads "skipped for uniformity with profileId and action" rather than "not nullable".
            Optionally state in the OpsInvocation.actor and listOpsInvocations descriptions that a credential-shaped handle
            skips the record. Today only the generic "a malformed field" clause covers it, and adding the sentence costs a
            J-1 replay. With no contract edit there is no J-1 replay.
      recommendation: >-
        null. It is what the operator chose on the option text, and the only reason given for departing from it is false.
        Either way the credential never reaches the payload, and the corpus holds no such actor, so the reality check is
        unaffected.
