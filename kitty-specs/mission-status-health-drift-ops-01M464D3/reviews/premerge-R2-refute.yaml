  - id: PR-BOUNDARY-001
    verdict: CONFIRMED
    severity: 3
    remedy_kind: fork
    refutation_attempt: >-
      Re-probed. select_gates(['kitty-ops/01ABC.jsonl']) and select_gates(['kitty-ops/closures.jsonl']) both give
      matched_groups=frozenset() and no tests-corpus-blocking. A contracts/ path selects it. The v1 reality module (abafc135e)
      has 0 kitty-ops references, so kitty-ops/ is a new blocking data root. Mitigating facts:
      (1) The same class already exists and is accepted. select_gates(['kitty-specs/x/status.events.jsonl']) also selects
      nothing, although v1's reality check reads every event log. test_ci_corpus_trigger_completeness.py:73-74 forbids
      churny globs: "Never add bare kitty-specs/** or status.events.jsonl (C-001)".
      (2) The churn is lower than for status events: 73 of 2911 commits on main since 2026-09-07 touch kitty-ops (60
      first-parent), against 215 for status.events.jsonl.
      Aggravating fact: a stale-Op sweep that writes spine closures for the pinned legacy_completion_ops ids, as 05697f827
      did, turns the pinned named list stale and reds main for every later corpus PR.
      Scope: ROUTER_WORKFLOW_PATH (ci-router.yml) is in SLICE_ALLOWED, and
      tests/architectural/test_ci_corpus_trigger_completeness.py is in EXTRA_ALLOWED_REGISTRATIONS
      (test_mission_status_contract_1_1.py:951-972). The fix touches no src/, so NFR-007 holds. The plan's own ci-router
      text (plan.md line 117) names only contract_tools globs, so a corpus-group glob goes beyond the plan as written and needs
      the operator's word.
    fork:
      options:
        - id: a
          text: >-
            Add 'kitty-ops/**' to the router corpus group and 'kitty-ops/' to _CORPUS_DATA_ROOTS, in the existing ci-router
            edit. Op-only PRs (about 2% of main commits) then select tests (corpus-blocking), plus the advisory Packs corpus
            run and prose-scan. This departs from the C-001 churn principle for a low-churn root.
        - id: b
          text: >-
            Change nothing in CI. Record it in plan Reflexivity beside item 5: "Op data drift is not selected before merge;
            the push-to-main run catches it". This is the same acceptance as status.events.jsonl today.
      recommendation: >-
        a. The pinned Op lists make a routine sweep a main-breaker, and the cost is small. Choose b only if the operator wants
        to keep C-001's churn rule uniform.
