  - id: SPEC-COMPLETE-011
    lens: Testability and falsifiability
    severity: 3
    title: "SC-009 and SC-010 are marked 'no-op passable: no' but name no observable a check can fail"
    evidence:
      - artifact: "spec.md § SC-009 (J-1 'recorded in tracer-design-decisions.md'), § FR-028, § SC-010 (OQ answered, or plan carries minimal behaviour)"
    claim: >-
      SC-009 is satisfied by writing a line in a Markdown file; nothing ties the record to the contract tree it ran against or to the job
      conclusions. SC-010 is a process step with no artifact test. Under the tactic acceptance-criteria-non-vacuity a criterion whose
      check is writing a sentence is no-op passable, so the 'no' is not honest.
    remediation: >-
      SC-009: require the record to cite the commit of the final contracts/ change, one line per job with its conclusion, and make a test
      (or the squad gate) fail when contracts/mission-status/ changed after the cited commit. SC-010: relabel [folded] with the satisfying item (the plan's
      OQ table), or add a check that each OQ has a ruling or a provisional marker in the plan; mark no-op passable 'yes, reviewed by squad' if no automated check exists.

  - id: SPEC-COMPLETE-012
    lens: Testability and falsifiability
    severity: 3
    title: "The kind 3 oracle named in FR-025 cannot decide completion or expected lanes, and the kind 3 floor contradicts 'never a pinned value'"
    evidence:
      - artifact: "spec.md § FR-025 (oracle for kind 3: 'git for-each-ref refs/heads plus the manifest JSON read directly'; floors include 'findings of each shipped kind'), § FR-025 last paragraph ('Environment-dependent values (currentBranch, kind 3) ... never a pinned value'), § A-3, § FR-012 ('honest when an independent oracle also flags')"
      - code: "src/specify_cli/status/lifecycle.py:320-347 and 267-283 (completion depends on merged_at, WP terminality and reopen events)"
    claim: >-
      Whether a Mission is non-completed and which lanes are expected depends on is_mission_completed and the reducer, neither of which the named oracle inputs
      provide. Either the oracle imports those same readers (a shared defect passes both) or it re-derives them with no stated method, so
      'honest' cannot be checked as specified. Separately a plan-time floor on kind-3 findings is a pinned value that
      fails on a clone with the Mission branches present (the count is 0..93 depending on local branches), contradicting the environment rule.
    remediation: >-
      Name the oracle for completion and expected lanes (for example a direct parse of meta.json merged_at and of the event-log lane of each WP, written without
      the product readers), or state that the oracle shares is_mission_completed and materialize_snapshot and name the planted fixtures that cover them separately. For floors:
      take the kind-3 floor from the synthetic fixtures only and assert corpus equality with the oracle, with no corpus floor on kind 3.

  - id: SPEC-COMPLETE-013
    lens: Silent success
    severity: 3
    title: "An Op file that cannot be opened is skipped silently while an unlistable directory is a 500; all-unreadable yields a 200 empty page"
    evidence:
      - artifact: "spec.md § FR-019 ('one unreadable file is a skipped record, not a failure'; Terminology: unreadable includes 'cannot be opened'), § FR-024 intro, § AC-OPS 'empty and failing directory'"
    claim: >-
      An I/O failure on every file of a listable directory (permissions, a mount fault) returns 200, items [], totalCount 0, indistinguishable from
      an empty project; the skipped count is not in the response (OQ-6 open). FR-024's own rule says unreadable must not be an empty success.
      FORK: (a) any OSError on a candidate file is 500 ops_unreadable, only shape and legacy failures are skipped / (b) keep per-file skip but 500 when
      candidates exist and none could be read for I/O reasons / (c) keep the spec text and record it in FR-024 as a known silent case.
    remediation: >-
      Choose among (a)-(c) and write it into FR-019 and the FR-024 table; add a fixture with a directory of unreadable files beside a control with one readable Op.

  - id: SPEC-COMPLETE-014
    lens: Testability and falsifiability
    severity: 3
    title: "The actor-shape AC passes if the whole record is dropped, and the actor-null rule contradicts the unreadable-record rule"
    evidence:
      - artifact: "spec.md § FR-017 ('actor (ActorHandle, nullable: null on a shape failure)' vs 'a mission_id or wp_id failing its pattern makes the record unreadable'), § AC-OPS 'actor shape' (plant: e-mail-shaped actor; red when 'an address in the payload')"
      - code: "contracts/mission-status/schemas/ActorHandle.yaml (pattern ^[A-Za-z0-9._:-]+$, 'projected to null rather than forwarded')"
    claim: >-
      The red condition 'an address in the payload' is also absent if the Op is skipped or the whole read fails, so a no-op that drops
      such records passes. The assertion should be that the record is served with actor null and every other field intact. The null-versus-unreadable
      split between actor and the other shape-checked fields is stated nowhere with a reason (profileId and action failing shape make the record unreadable).
    remediation: >-
      Rewrite the row: plant an Op with actor 'a@b.com', assert it is in items with actor null and status, startedAt unchanged; control 'claude' keeps its value.
      Add one sentence to FR-017 giving the reason actor alone degrades.

  - id: SPEC-COMPLETE-015
    lens: Silent success
    severity: 3
    title: "FR-010 sends a reducer failure to a 500 although the product's own check reports it as an error finding; the divergence is not flagged and OQ-4 covers only non-JSON"
    evidence:
      - artifact: "spec.md § FR-010 ('compared exactly as classify_status_json does'; 'a reducer that raises ... is not a finding'), § AD-10, § OQ-4, § OR-4 rationale (screen must agree with spec-kitty doctor)"
      - code: "src/specify_cli/audit/classifiers/status_json.py:60-70 (CORRUPT_JSON error findings) and 149-160 (reducer raising becomes a SNAPSHOT_DRIFT error finding)"
    claim: >-
      The audit the spec mirrors reports a Mission whose reducer raises as an SNAPSHOT_DRIFT error. The spec turns the same state into a whole-report 500, so Drift
      would show nothing for any Mission while the doctor lists an error, the disagreement OR-4 was ruled to avoid. Only the non-JSON
      sub-case is an OQ; the reducer sub-case is an author decision (AD-10) that the squad is not told differs from the audit.
    remediation: >-
      State the divergence in FR-010 and AD-10 with the audit line it differs from, and extend OQ-4 with the reducer-raises case (options: whole-report 500 /
      a finding with the audit's code). Plant both in the FR-015 failure fixtures.

  - id: SPEC-COMPLETE-016
    lens: Leak and redaction
    severity: 3
    title: "FR-005 lists the only null cases for currentBranch, but a name that passes the pattern can still be a strict-class leak"
    evidence:
      - artifact: "spec.md § FR-005 ('Null only for: ... a name failing ^[A-Za-z0-9][A-Za-z0-9._/-]*$ or over 255'), § FR-027 (STRICT_FIELDS names currentBranch)"
      - code: "contracts/tools/leak_patterns.py (STRICT_HOST_PATH_PATTERNS: (?:^|/)(home|Users)/<seg>/ is a host path in a strict field)"
      - code: "tests/contract/_mission_status_payloads.py:447-459 (Projector.strict nulls a strict value that trips the strict leak patterns)"
    claim: >-
      home/alice/x satisfies the FR-005 pattern but is a strict host path, so the contract either serves it (and the payload leak scan goes red on a
      legitimate repository) or the reader nulls it, which FR-005's exhaustive 'null only for' list forbids. A branch name is also user-authored and
      can carry a handle (alice/topic); nothing says whether that exposure is accepted as for Workspace.laneBranch.
    remediation: >-
      Add 'a name matching the strict host-path patterns' to the null cases (or say the leak scan exempts it), plant branch home/alice/x with control topic/x,
      and add one sentence in the Project.currentBranch description that the name is user-authored text served as stored.

  - id: SPEC-COMPLETE-017
    lens: Silent success
    severity: 2
    title: "health collapses 'metadata could not be read' into schema_drift, and the description is not required to say so"
    evidence:
      - artifact: "spec.md § FR-004 (healthy exactly when schemaVersion is not null and in range), § Acceptance Scenario US1.2 (absent metadata gives schema_drift), § FR-024 table"
    claim: >-
      A project with no metadata file, an unreadable file or a non-integer schema reads schema_drift, the same badge as a real out-of-range schema.
      FR-004 records the rule but not that a consumer must read schemaVersion=null to tell 'unknown' from 'drift'; a screen using health alone shows a false drift.
    remediation: "Require the ProjectHealth and Project.health descriptions to state that schema_drift also means 'schema could not be determined' and to point to schemaVersion null; add that sentence to the description-content test."

