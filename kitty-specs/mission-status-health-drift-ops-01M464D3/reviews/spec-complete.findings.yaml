findings:
  - id: SPEC-COMPLETE-001
    lens: Silent success
    severity: 4
    title: "branch_exists is a per-branch git subprocess that returns False on any git failure; the spec says one refs/heads listing and never defines git being unusable"
    evidence:
      - artifact: "spec.md § FR-012 (inputs list branch_exists), § FR-015 ('one listing of refs/heads'), § FR-025 (reader built from branch_exists), § NFR-002 (counting-opener)"
      - code: "src/specify_cli/lanes/_git.py:30-55 (_verify runs git rev-parse --verify per ref; returncode != 0 is False, including no git binary, not a repository, a git error)"
    claim: >-
      Two contradictions and one silent-success hole. (1) FR-015/NFR-002 describe one read-only listing of refs/heads
      checked by a counting opener, but the named public reader branch_exists starts one subprocess per branch (one per expected
      lane plus the Mission branch, per Mission). FR-007's no-subprocess rule is scoped to /project only, so nothing
      says which is intended. (2) branch_exists cannot tell "branch absent" from "git failed": in a directory that is not a
      repository, with git missing, or with a broken repository, every expected branch reads as absent, so the scan
      returns a full set of lane_branch_missing findings as a 200. That is "could not read" served as a finding, which FR-024 forbids.
      (3) Neither the FR-015 500 list nor the FR-024 catalogue names a refs/heads or git failure.
    remediation: >-
      Specify the branch source once. Either read refs/heads (loose refs plus packed-refs) with no subprocess and add an
      opener-count assertion that matches, or keep branch_exists and drop the 'one listing' and counting-opener wording for
      the git part. In both cases add to FR-015 and FR-024 that a non-repository, an unusable git or an unreadable refs
      store is 500 drift_scan_unreadable when any Mission has an expected lane (not a finding), with a planted fixture
      (directory without .git, plus a control with the branch present) and a project-wide check that git failure never yields kind 3.

  - id: SPEC-COMPLETE-002
    lens: Silent success
    severity: 3
    title: "A corrupt or non-object meta.json makes is_mission_completed raise, but FR-015's refusal list does not name it"
    evidence:
      - artifact: "spec.md § FR-012 (is_mission_completed input), § FR-015 / AD-10 (500 conditions), § FR-024 table"
      - code: "src/specify_cli/status/lifecycle.py:219-233 and 344 (is_mission_completed -> _last_merge_marker_at -> load_meta_fail_closed)"
      - code: "src/specify_cli/core/paths.py:606-656 (raises MissionMetaReadError when meta.json exists but is corrupt, non-object or unreadable)"
    claim: >-
      The scan opens meta.json (FR-015) and calls is_mission_completed for every Mission with a current lanes.json. A corrupt
      meta.json raises MissionMetaReadError. FR-015 lists as 500 only an unreadable directory or status path, an event log that
      cannot be reduced and a non-JSON lanes.json. The outcome for meta.json is undefined: an implementation may crash, skip
      the Mission, or treat it as not completed and flag it. The last two are silent success.
    remediation: >-
      Add a corrupt or unreadable meta.json to the AD-10 / FR-015 500 conditions and to the FR-024 table, with a planted fixture
      (meta.json = [] or invalid JSON, same Mission before corruption as control).

  - id: SPEC-COMPLETE-003
    lens: Silent success
    severity: 3
    title: "read_lanes_json raises on the legacy-shaped manifest and the spec leaves a JSON-valid manifest of any other shape undefined"
    evidence:
      - artifact: "spec.md § FR-012 (legacy-shaped: no finding; lanes.json 'not JSON' fails the scan), § FR-025 (read_lanes_json listed as a public reader), § AD-10"
      - code: "src/specify_cli/lanes/models.py:189-191 (from_dict reads data['mission_slug'] unguarded)"
      - code: "src/specify_cli/lanes/persistence.py:154-161 (KeyError and TypeError become CorruptLanesError)"
      - code: "kitty-specs/064-complete-mission-identity-cutover/lanes.json (the 1 legacy-shaped manifest: key feature_slug, no mission_slug)"
    claim: >-
      The reference reader is to be built from read_lanes_json, but on the one real legacy manifest that function raises
      CorruptLanesError, the same exception as for non-JSON. The spec requires two different outcomes (no finding vs 500), so
      the reader must read the raw JSON itself, which the spec does not say, and the oracle for kind 3 reads the manifest JSON
      directly, so a reader that wrongly maps the exception would be caught only on this one Mission. A third class, valid JSON
      that has neither mission_slug nor feature_slug (or lacks lanes or mission_branch), has no defined outcome.
    remediation: >-
      State the three-way classification in FR-012/FR-015: current shape (has mission_slug and the fields the rule reads),
      legacy shape (feature_slug and no mission_slug: no finding, counted), anything else that parses (500
      drift_scan_unreadable). Say how the reader detects it (raw json.loads first). Add the third class as a planted
      fixture beside the existing non-JSON and legacy ones.

  - id: SPEC-COMPLETE-004
    lens: Leak and redaction
    severity: 4
    title: "OQ-5 is not actually open for URL, path and embedded forms: steps 1, 2 and 4 silently redact a credential, and the order against the credential check is unstated"
    evidence:
      - artifact: "spec.md § FR-020 steps 1-5 and the sentence 'A value holding a credential (the SECRET_PATTERNS kinds) is OQ-5', § OQ-5, § AC-OPS 'credential in evidence'"
      - code: "contracts/tools/leak_patterns.py (SECRET_PATTERNS: gh[pousr]_, github_pat_, AKIA/ASIA, PEM header)"
      - code: "tests/contract/_mission_status_payloads.py:468-483 (the v1 human() projector redacts paths and e-mails, then raises ProjectionError if a leak, including a secret, remains)"
    claim: >-
      FR-020 never says whether the credential test runs on the stored value (before the steps) or on the redacted result. If
      after, a token in a URL query or userinfo (step 1 strips both), in a leading absolute path (step 2 replaces the whole
      value with [path]) or inside an embedded path run (step 4) is removed silently and the reader never fails: the case OQ-5
      says is undecided is decided by omission, with redacted=true and no loud failure. If before, step 1's removal of query and
      userinfo is dead for credentials. Only a token in plain free text or a bare repo_path reaches the OQ-5 behaviour. The AC
      row 'a value holding a token' has no shape, so a plant in plain text passes while the URL and path shapes stay unexamined.
    remediation: >-
      Add to FR-020 an explicit precedence: the credential check runs on the stored string before steps 1-5 (OQ-5 governs
      every shape), or record in OQ-5 as an extra option (d) that a credential inside a URL or path is removed silently like the rest.
      That choice belongs to the operator, so mark it FORK: (a) check before redaction, OQ-5 governs all shapes / (b) check after,
      add the silent-removal behaviour to OQ-5 explicitly. Extend the AC row with one plant per shape (token in query, in userinfo,
      in an absolute path, in free text, in a bare relative path) each with its clean control.

  - id: SPEC-COMPLETE-005
    lens: Leak and redaction
    severity: 3
    title: "'No credential' claims (NFR-004, SC-005, FR-020) are bounded by four SECRET_PATTERNS kinds and say so nowhere"
    evidence:
      - artifact: "spec.md § NFR-004, § SC-005, § FR-020 title ('free of host paths, addresses and credentials'), § FR-027"
      - code: "contracts/tools/leak_patterns.py (SECRET_PATTERNS has four patterns: GitHub classic and fine-grained tokens, AWS access key id, PEM private-key header)"
    claim: >-
      A bearer token, a password in text, a JWT, an Slack or API key of another vendor, or a token in a query string is not
      a 'credential' under those patterns. SC-005 and NFR-004 read as an absolute guarantee, and the green leak scan proves only
      the four kinds. Real evidence_ref values are free text written by agents (56 of the 467 closed Ops here), the class most likely to hold one.
    remediation: >-
      Reword NFR-004, SC-005 and FR-020 to 'no value matching the SECRET_PATTERNS kinds' and state in the OpsInvocation.evidence description that other secret shapes are not detected,
      or extend SECRET_PATTERNS in this slice (leak_patterns.py is in the slice file set only through the scanner; if extending, list it in the slice file set and add a plant per new kind).

  - id: SPEC-COMPLETE-006
    lens: Leak and redaction
    severity: 3
    title: "file:// and other scheme URLs, UNC paths and URLs embedded in text keep host paths, userinfo and query strings"
    evidence:
      - artifact: "spec.md § FR-020 steps 1-4, § AC-OPS 'evidence classes' (plants a file URL)"
      - code: "contracts/tools/leak_patterns.py (HUMAN_HOST_PATH_PATTERNS cover only /home, /Users, /root, /tmp, /var/tmp, /var/folders and a drive-letter Users path)"
      - code: "src/specify_cli/invocation/writer.py:34 (_URL_SCHEME_RE) and 87-103 (normalise_ref returns a scheme URL verbatim)"
    claim: >-
      Step 1 treats any leading scheme as a url and then runs step 4, whose path patterns know three roots. A value
      such as file:///srv/build/<user>/x or file:///mnt/data/x keeps its host path (kind url, only userinfo, query and fragment removed),
      while the same path without the scheme is replaced by [path] in step 2. A UNC path (backslash prefix) is not matched by
      step 2 and fails rule 3 (backslash), so it lands in text unredacted. A URL embedded in free text (kind text) is not
      parsed at all: userinfo and query are kept. The corpus has this shape (one free-text evidence value embeds a
      GitHub issue URL), only without a query. The planted 'file URL' in the AC row is a home path, the one root the patterns know.
    remediation: >-
      FR-020: a file-scheme URL is a host path (kind text, [path]); a value starting with two backslashes or any drive form is
      step 2; in step 4, embedded URLs get the same userinfo/query/fragment removal as step 1. Add plants file:///opt/x,
      a UNC path and a text value with https://u:p@host/x?token=abc, each with a clean-URL control.

  - id: SPEC-COMPLETE-007
    lens: Leak and redaction
    severity: 3
    title: "Step order between repo_path (kept unchanged) and the e-mail and path redaction of step 4 is ambiguous"
    evidence:
      - artifact: "spec.md § FR-020 step 3 ('repo_path, unchanged') vs step 4 ('Every value then passes the human-text host-path redaction ... and redact_emails')"
      - code: "tests/contract/_mission_status_payloads.py:610-662 (payload_leaks scans every string for e-mail and, outside strict keys, the human patterns)"
    claim: >-
      A relative single-token value that passes the artifact-path rule can still be an address or hold one (docs/a@b.com, notes/x@host).
      If step 3 returns it unchanged, the value is kind repo_path with an address in it and the leak scan on the payload goes red
      on legitimate data (or the reader raises). If step 4 applies to it, the kind and redacted flag after redaction are undefined
      (is it still repo_path, redacted=true?). The same ambiguity covers an absolute value containing whitespace (step 2 'the path replaced': the whole value or the run?).
    remediation: >-
      Rewrite FR-020 as an ordered pipeline with one defined output per step: classify, then redact every value, then re-check
      the kind (a repo_path that changed becomes text, redacted=true); say whether step 2 replaces the whole value or the matching run.
      Add plants: docs/a@b.com, and <host-home>/x/a b.txt, with a clean relative path as control.

  - id: SPEC-COMPLETE-008
    lens: Reality check
    severity: 3
    title: "Corpus evidence statistics are inconsistent: the '1 URL' does not exist as a url-kind value, so rule 1 and the url floor have no real example"
    evidence:
      - artifact: "spec.md § FR-020 last paragraph ('467 closed Ops, 351 none, 32 absolute, 56 free text, 28 relative ... 1 evidence is a URL'), § FR-025 floors (evidence of each kind)"
      - code: "kitty-ops/*.jsonl (measured: 351 + 56 + 32 + 28 = 467, zero values begin with a URL scheme; the only URL is embedded inside one free-text value; all 16 values over 512 characters are free text)"
    claim: >-
      The categories already sum to 467 without the URL, so '1 URL' double-counts, and the one URL is inside free text and classified
      text by the spec's own rules. There is no real url-kind value in the corpus, no real over-512 repo_path or absolute path, and no real
      redacted e-mail. A floor 'evidence of each kind and redacted' cannot be met for url from real data, and the
      reality check would exercise step 1 only through fixtures.
    remediation: >-
      Correct the count (0 url-kind, 1 free text embedding a URL). In FR-025 state per kind which floors come from the corpus and
      which are fixture-only (url: fixture), and set the corpus floor for url to 0 explicitly rather than 1.

  - id: SPEC-COMPLETE-009
    lens: Coverage
    severity: 3
    title: "NFR-005, NFR-007, C-006, C-003, C-007 and FR-026 have no acceptance row; NFR-002's numeric bounds are cited but not asserted"
    evidence:
      - artifact: "spec.md § Acceptance Criteria group headers (AC-PROJECT: FR-001..007, FR-024; AC-DRIFT: FR-008..015, FR-024; AC-OPS: FR-016..021, FR-024; AC-VERSION: FR-022,023,027..029, NFR-004, NFR-006; AC-REALITY: FR-025, NFR-001, NFR-002)"
      - artifact: "spec.md § Non-Functional Requirements (NFR-003, NFR-005, NFR-007), § Constraints (C-003, C-006, C-007), § FR-026"
    claim: >-
      By id count each of NFR-005 (byte-identical repeated reads and cursors), NFR-007 / C-006 (no file under src/ changes), C-003 (only the
      slice file set changes), C-007 (no new dependency) and FR-026 appears only in its own table row; no AC cites it. NFR-003 has rows but is not
      cited. NFR-002's 5 s / 30 s / 10,000-file bounds and its counting-opener assertion have no row in AC-REALITY or AC-DRIFT. The C-003/C-006 class
      is also the check a no-op cannot fail by accident but a scope-creeping change can pass.
    remediation: >-
      Add AC rows: determinism (two reads, byte-equal Project, findings, pages, cursors, two bundle builds; control: a clock tick changes scannedAt only),
      scope (git diff --name-only against main limited to the slice file set, with a planted extra file; a src/ path fails), dependency
      (no change in pyproject.toml and lock; planted addition), NFR-002 timing with the 10,000-file fixture and the counting opener, and cite FR-026 and the NFRs in the group headers.

