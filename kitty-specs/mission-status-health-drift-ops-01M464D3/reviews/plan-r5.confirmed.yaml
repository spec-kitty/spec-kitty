      \ catalogue'"
  - artifact: "plan.md \xA7 IC-09 Acceptance (named): 'planted floors, stale entries and a writing reader\
      \ fail'"
  - artifact: "contracts/tool-extension-and-reader.md \xA7 C row cache-the-result (updated)"
  claim: 'D-P16 still scopes the cache-the-result mutation to the Ops catalogue, AC-OPS 14 and ''the timing
    cases'' and never names the real 5 s case in the reality module, while the contract row and the AC-CROSS
    4 row now do. IC-09 Acceptance lists the planted failures but omits the cache-the-result mutation
