schema: review-findings/v1
phase: tasks
findings:
- id: TASKS-COVER-001
  lens: coverage-against-spec
  severity: 3
  title: AC-VERSION e sub-rows (terminology pin of the sole legacy-shape literal, camel-case pin plant)
    have no owning subtask
  evidence:
  - artifact: "tasks/WP06-contract-proof-edits.md \xA7 Acceptance rows (row 'AC-VERSION e') and closing\
      \ sentence 'This WP owns AC-VERSION b, d, e'; subtasks T028-T033 name no terminology or camel-case\
      \ test"
  - artifact: "tasks/WP07-drift-reader.md \xA7 T037 step 1 ('pinned by the terminology scan')"
  - artifact: "spec.md \xA7 AC-VERSION bullet 5 (the legacy-shape literal is the sole accepted occurrence\
      \ outside scope, pinned by a test; planted: a second use in the reader fails; a planted camel-case\
      \ value fails the pin check)"
  - code: tests/contract/test_mission_status_contract_1_1.py:761-806 (terminology_problems scans only
      the contracts/mission-status YAML and the CHANGELOG entry, never a Python reader)
  claim: WP06 claims AC-VERSION e as committed tests, but none of its six subtasks writes the pin test
    or the camel-case plant. WP07 says the sole legacy-shape literal in the reader is "pinned by the terminology
    scan", yet that scan (lines 761-806) does not read tests/contract/_mission_status_drift.py, and the
    reader module does not exist when WP06 runs. As written, the planted second use in the reader and
    the planted camel-case enum value fall to nobody, and the AC would pass vacuously.
  remediation: 'FORK: remedies A / B. A: add the pin test to WP07 (it owns the reader and test_mission_status_drift.py):
    a test that counts the legacy-shape literal in the reader source (exactly one, inside the legacy-shape
    test) with a planted second use that fails; add one subtask line (T034 or T039) naming it. B: widen
    terminology_problems in WP06 to take an optional list of Python files and have WP06 pin the expected
    path while WP07 creates it, which needs a stub-first ordering and is more fragile. Either way, name
    the camel-case plant concretely in WP04/WP05 T018/T023 or WP06 T028 (a changed enum value must fail
    the pin test) and drop ''AC-VERSION e'' from WP06''s ownership sentence for the parts it does not
    carry.'
- id: TASKS-COVER-002
  lens: coverage-against-spec
  severity: 2
  title: SC-009 and C-001 appear in no WP requirement_refs
  evidence:
  - artifact: wps.yaml requirement_refs (union over WP01-WP10 misses SC-009 and C-001); tasks.md per-WP
      Requirement Refs
  - artifact: "spec.md \xA7 Success Criteria SC-009; \xA7 Constraints C-001"
  claim: Every other FR, NFR, C and SC id of the spec is carried by at least one WP, but SC-009 (J-1 record
    and the W-2 diff command) and C-001 (operator rulings bind) are traced to none. SC-009 is realised
    only by the orchestrator steps (J-1, W-2) and by FR-028 in WP06, so a traceability check by id reports
    a gap.
  remediation: Add SC-009 to WP06 requirement_refs (WP06 hands over the exact J-1 commit, T033 step 1)
    and state in tasks.md that C-001 is governance-only and carried by the orchestrator (or add it to
    WP10's refs next to C-004 and C-005). Edit wps.yaml and regenerate; do not hand-edit the generated
    tasks.md.
- id: TASKS-COVER-003
  lens: coverage-against-plan
  severity: 2
  title: WP02 names a "manifest length" assertion in test_run_negative_cases.py that does not exist; the
    real surfaces are three hard-coded strict-name lists
  evidence:
  - artifact: "tasks/WP02-tool-extension.md \xA7 T006 purpose and Definition of Done ('the manifest length\
      \ moved by six'); plan IC-02 Affected surfaces (copied verbatim)"
  - code: tests/contract/test_run_negative_cases.py:259-262 (strict set hard-coded as ten names; no total-length
      assertion, only lint==11 and breaking==19 at 333-334 and a dynamic counts line at 350)
  - code: tests/contract/test_leak_scan.py:34 (STRICT_NAMES) and tests/contract/test_fixture_builder.py:52
      (NEW_STRICT_NAMES)
  claim: An implementer looking for a length to bump finds none. The edits the six names force are the
    three hard-coded name tuples, and the leak_scan one feeds ALL_KINDS (line 51). Nothing is wrong in
    intent, but the step as written is not implementable without re-deriving the surfaces.
  remediation: Rewrite T006 step 1 and the DoD line to name the three constants (STRICT_NAMES, NEW_STRICT_NAMES,
    the strict set at test_run_negative_cases.py:259) as the places that gain the six names, and drop
    'manifest length'. Also say that the previous slice's ten strict kinds stay, so 'the eight old kinds
    byte-identical' is the OLD_KINDS digest test only.
- id: TASKS-COVER-006
  lens: anti-laziness
  severity: 1
  title: WP01 T005 step 2 carries a garbled path literal
  evidence:
  - artifact: "tasks/WP01-resync-remeasure-campsite.md \xA7 T005 step 2 ('\"contracts/tools/contracts/tools/leak_scan.py\"\
      \ style paths x4')"
  - code: tests/contract/test_mission_status_contract_1_1.py (the literal is contracts/tools/leak_scan.py,
      four uses)
  claim: The doubled prefix is a transcription error and would send an implementer grepping for a string
    that is not in the file. The Campsite section above it has the right literal.
  remediation: 'Replace with "contracts/tools/leak_scan.py" x4. Also note that the quoted forms "byte_identity:
    " and "out_of_scope: " occur only inside f-strings in the checkout, so T005''s drop rule (recount
    first) will probably apply to them.'
- id: TASKS-SEQ-001
  lens: orchestrator-steps
  severity: 3
  title: No step moves the Step 0 / J-1 / hand-off records, or the amended planning state, into the lane
    workspaces that must read them
  evidence:
  - artifact: "tasks.md \xA7 ORCHESTRATOR STEP 0 item 4 (appends to tracer-approach.md, add-only) and\
      \ Chokepoint sequencing statement (orchestrator appends hand-off records between dispatches)"
  - artifact: "tasks/WP01-resync-remeasure-campsite.md and WP03/WP07 \xA7 Dependencies and order and Baseline-red\
      \ binning (workers read the Step 0 record in tracer-approach.md from the lane workspace)"
  - artifact: "tasks/WP07-drift-reader.md \xA7 Dependencies and order (not dispatched before the J-1 record\
      \ exists in tracer-design-decisions.md)"
  - artifact: lanes.json planning_commit_sha 4572d1df710561f61ebcaf9c9791749a1cd965ee (pinned before D-0
      merge and before any record is appended)
  - code: src/specify_cli/cli/commands/agent/mission_finalize.py:1108-1114 (--refresh-planning-commit
      advances planning_commit_sha so lanes merge the amended planning state)
  claim: 'The records are appended by the orchestrator on the planning/target branch, but code workers
    run in lane worktrees and are told to read the Step 0 record, and WP07 is gated on the J-1 record.
    Nothing in tasks.md says how those commits reach a lane workspace (commit the record, then refresh
    the planning pin or fast-forward/merge the Mission branch into the lane before dispatch), nor that
    D-0 (a merge of origin/main into the Mission branch) invalidates the planning pin recorded in lanes.json.
    A worker can be dispatched on a base that lacks the record it is told to read, and WP10 (lane-planning)
    appends to the same tracer files the orchestrator appended on another branch, so append-vs-append
    conflicts at W-1 consolidation are likely. The "not dispatched before the record exists" gates test
    existence on the planning branch, not in the lane.

    '
  remediation: 'Add to Step 0 item 4, to J-1, and to the chokepoint statement a per-dispatch pre-flight:
    commit the appended record add-only; run finalize-tasks --refresh-planning-commit (after D-0, after
    the J-1 record, before WP10) or, FORK: remedies A (refresh the planning pin each time, but see TASKS-SEQ-002:
    it regenerates tasks.md) / B (fast-forward kitty/mission-<slug> and merge the planning branch into
    the lane workspace, no tooling pin change); then verify with a grep of the record inside the lane
    workspace before dispatch. State which of A/B applies to lane-planning (WP10).

    '
- id: TASKS-VERIFY-002
  lens: Gate completeness
  severity: 2
  title: Operator-gated battery paragraph is faithful to plan and charter but dangling (three legs undefined,
    'previous slice' external)
  evidence:
  - artifact: "tasks/WP03-project-vertical.md \xA7 'Architectural battery legs (operator-gated...)'; identical\
      \ in WP07 and WP08"
  - artifact: "plan.md \xA7 Charter Check, row NO_FULL_HEAVY_SUITES_IN_MISSION ('An explicit operator\
      \ request can extend that for the registry-touching work packages, as in the previous slice; the\
      \ plan does not assume it'); \xA7 The gate set (e), row architectural-heavy battery ('CI-owned ...\
      \ Not run locally in mission work')"
  - artifact: .kittify/charter/charter.md:183-193 (exception only on an explicit operator request)
  claim: 'ADJUDICATION: the author''s default (battery CI-owned, record ''battery: CI-owned, not run locally'',
    run named gate and census files in full) matches the plan text and the charter; carrying the paragraph
    is not a violation and not a plan departure. The residual defect is that the paragraph tells the implementer
    to ''run the three legs exactly as the brief gives them'', yet no artifact in the mission directory
    defines the three legs or their commands (grep of spec, plan, research, quickstart, tracer files finds
    none); ''as in the previous slice'' points outside the mission. If the operator does request it, the
    WP carries nothing to run or to bin against, and the Step 0 record does not capture per-leg baselines
    either (it lists the latest main run of architectural-fast and architectural-heavy only).'
  remediation: 'FORK: remedies A / B. A: keep the conditional paragraph and name the legs concretely (job
    names, selection expression, shard split) with a pointer to the Step 0 per-leg main-run durations,
    so a brief can reference them. B: delete the paragraph from WP03, WP07, WP08 and leave the operator-requested
    extension to the dispatch brief alone, keeping only the ''battery: CI-owned, not run locally'' hand-off
    line. B reduces the chance an agent runs a heavy sweep on its own reading.'
- id: TASKS-VERIFY-003
  lens: Gate completeness
  severity: 3
  title: Router-glob edit is placed in commit 1 and in the final acceptance subtask, contradicting 'same
    commit as the helper'
  evidence:
  - artifact: "tasks/WP03-project-vertical.md \xA7 T011 (Files lists .github/workflows/ci-router.yml in\
      \ the red-first commit) versus \xA7 T017 (Acceptance runs and router globs, the last subtask) versus\
      \ \xA7 Registration item 4 ('in the same commit as the helper') and Definition of Done ('registry\
      \ gates green on every commit')"
  - artifact: "tasks/WP07-drift-reader.md \xA7 T034 versus T040; tasks/WP08-ops-reader.md \xA7 T041 versus\
      \ T046 (same pattern)"
  - artifact: "plan.md \xA7 D-P8 (globs added 'in the same commit as the helper'; the derivation test\
      \ 'goes red until they are present')"
  claim: The derivation test test_the_contract_tools_filter_group_names_every_src_file_the_mission_status_reader_and_its_tests_import
    goes red as soon as a helper imports a src module. The helper's real body is committed in a later
    commit than T034/T041 (the stub raises and need not import), yet the globs are listed once in commit
    1 and once in the closing subtask T017/T040/T046. The prompt does not say in which commit they land;
    an implementer following the subtask order commits the builder or reader with the gate red, against
    the 'green on every commit' rule, or squashes ordering that the squad and W-5 are meant to read.
  remediation: 'State explicitly: the globs for the stub''s imports go in commit 1 only if the stub imports
    src modules, otherwise in the commit that adds the real imports (the helper commit), with T017/T040/T046
    reduced to ''confirm the derivation test is green''. Remove ci-router.yml from the commit-1 Files
    line where the stub imports nothing.'
- id: TASKS-VERIFY-004
  lens: Baseline honesty
  severity: 2
  title: WP10 hygiene scan has a duplicated prose line inside its code fence, no discovered-count guard,
    and exempts reviews/ and the status log
  evidence:
  - artifact: "tasks/WP10-closeout-evidence.md \xA7 Hygiene scan of the Mission directory (the sentence\
      \ 'The Mission directory joins the corpus...' appears inside the text fence before the .venv/bin/python\
      \ command; script skips rel.startswith('reviews/') and status.events.jsonl, status.json; ends with\
      \ print(f\"files={files} problems={problems}\"))"
  - artifact: "tasks/WP10-closeout-evidence.md \xA7 T055 and Definition of Done ('prints problems=0')"
  claim: '(1) Pasted as written, the first prose line is run as a shell command and the heredoc follows
    it: a transcription hazard. (2) problems=0 passes vacuously if the walk finds no file (a wrong working
    directory gives files=0 problems=0); there is no minimum. (3) reviews/ and the event log are exempt,
    yet the mission directory is committed whole in W-5; the same leak patterns on this checkout flag
    email-shaped tokens in reviews/spec.merged.yaml and a noreply address on line 1 of status.events.jsonl.
    Those look non-private, but the exemption is unstated.'
  remediation: Delete the duplicated sentence from the fence; add 'assert files > 0' (or a floor equal
    to the count of files at WP10 start) before printing; state in one line why reviews/ and the byte-identical
    event log are exempt and who reviews them (the W-5 hygiene scan over the whole directory).
- id: TASKS-VERIFY-005
  lens: Red-first evidence
  severity: 2
  title: WP07 carries the 30 s ten-thousand-file timed row without the D-P16 method or an owner statement
  evidence:
  - artifact: "tasks/WP07-drift-reader.md \xA7 Acceptance rows, 'AC-CROSS 4' (fixture-built drift and\
      \ ops modules; 30 s, minimum of at least 5 repeats, D-P16); D-P16 text is not carried in WP07 (WP08\
      \ and WP09 carry it); WP07 T039 mentions only the counting opener and subprocess total"
  - artifact: "plan.md \xA7 D-P16 closing sentence ('the 30 s synthetic case and the 0.1 s cases to the\
      \ ops module'); \xA7 IC-08 relevant requirements ('the synthetic 10,000-file case')"
  claim: The row is copied verbatim into WP07 and says 'drift and ops modules', but plan D-P16 and IC-08
    place the synthetic 10,000-file timed case in the Ops module only. WP07 has no subtask for a timed
    case and no cold-repeat, cache-counter or margin rules, so an implementer may add an untimed or single-run
    30 s assertion to the drift module (a timing case without the D-P16 method, flaky under -n 4) or skip
    it and be rejected by a reviewer who reads the row literally.
  remediation: 'Add one sentence to WP07 T039: ''The 10,000-file timed case is owned by WP08; this module
    has no absolute timing assertion. Bounded reads here are counted (opener and subprocess counts), not
    timed.'' Or, if a drift timing case is intended, carry D-P16 verbatim and a subtask.'
- id: TASKS-VERIFY-006
  lens: Baseline honesty
  severity: 2
  title: Timed-bound margin escalation (under a factor of 2 goes to the operator) is in the verbatim design
    text only, not in any subtask step or Definition of Done
  evidence:
  - artifact: "tasks/WP08-ops-reader.md \xA7 D-P16 (ends 'a margin under a factor of 2 goes to the operator'),\
      \ \xA7 T045 Steps 1-2 and \xA7 Definition of Done ('measured minimum and margin are recorded')"
  - artifact: "tasks/WP09-oracles-reality.md \xA7 T051, T052 and Definition of Done (same pattern for\
      \ the 5 s case and the 120 s cases)"
  claim: The hand-off asks for the measured minimum and margin, but nothing in T045, T051, T052 or the
    Definition of Done says what the implementer does when the margin is under 2 (stop and report, do
    not loosen the bound). The measure-first instruction is present for WP08 ('Measure first') but absent
    from WP09 T051. A reviewer checking the DoD cannot fail a WP that records a 1.2 margin and moves on.
  remediation: 'Add to WP08 T045 and WP09 T051/T052 steps and to both Definitions of Done: ''Measure each
    bound on the unchanged fixture before asserting it; a margin under a factor of 2 is reported to the
    operator in the hand-off and the bound is not loosened or the case skipped.'''
