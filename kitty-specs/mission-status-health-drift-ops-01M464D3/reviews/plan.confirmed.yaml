    '
  remediation: 'Two valid remedies (fork). Option A: list all three moves in Departs 11 with a reason
    each (one tree for the squad for consolidation; verdict early because accept needs it). Option B:
    restore the procedure order for dev-assist and verdict and keep only the consolidate-before-squad
    departure. Under either, set the terminal #5776 verdict after W-4''s LAND, or say why it can precede
    it.

    '
  fork: true
  refute_reason: The procedure orders accept, retire dev-assist, verdicts, aggregate review, consolidate,
    while plan W-1/W-3/W-4 moves consolidation, verdict and dev-assist and Departs 11 discloses only the
    consolidation move; fork between disclosing all moves and restoring procedure order.
- id: PLAN-VERIFY-006
  lens: Test strategy
  severity: 2
  title: The 0.1 s redaction bound and the 30 s/5 s listing bounds are absolute wall-clock asserts in
    a blocking -n 4 job with no stated stabilising method
  evidence:
  - artifact: plan.md P-7, IC-08 acceptance, Test strategy AC-OPS row 14 and AC-CROSS 4
  - artifact: research.md R-11 (precedent test_leak_patterns uses a 0.5 s bound, unmarked)
  - code: .github/workflows/ci-router.yml:1006-1010 (-n 4 --dist loadfile over the whole tests/contract
      directory)
  - code: pytest.ini:32-36 (default per-test timeout of 240 s, a backstop not a budget)
  claim: 'NFR-008''s 0.1 s is a spec ruling and is not re-opened, but the plan''s mitigation is ''measure
    first, record the margin, never rerun to green''. That fixes diagnosis, not determinism: the three
    shapes run beside the heaviest tests in the directory on shared runners. The research precedent used
    5 times the bound. A flaky required job costs every later PR.

    '
  remediation: 'Keep the 0.1 s bound but specify the method in the plan: each shape is timed as the minimum
    of at least 5 repeated runs inside the test (min is robust to contention, still falsified by a quadratic
    matcher because the long shape stays far over), with the short-value control timed the same way; and
    record the measured minimum and the margin in the hand-off. Alternatives (fork): time CPU rather than
    wall clock, or gate on scaling ratio in addition to the bound. The planted quadratic mutation must
    still fail under the chosen method.

    '
  fork: true
  refute_reason: NFR-008 bound stays, but the plan specifies no stabilising timing method for absolute
    wall-clock asserts (0.1 s, 5 s, 30 s) in a blocking -n 4 job, so flakiness risk is real and unaddressed;
    fork on method (min of repeats, CPU time, scaling ratio).
- id: PLAN-VERIFY-008
  lens: Registration
  severity: 1
  title: The registry gate detects the corpus mark by a single-line regex, which the plan does not state
  evidence:
  - artifact: plan.md D-P5 ('every new module declares a module-level pytestmark')
