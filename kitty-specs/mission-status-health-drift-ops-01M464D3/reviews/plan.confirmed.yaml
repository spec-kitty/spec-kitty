- id: PLAN-ARCH-001
  lens: Canonical source / generated artefacts
  severity: 3
  title: Frozen pre-slice fixture directory holds two files that differ only by letter case
  evidence:
  - artifact: "plan.md \xA7 Generated artefacts (row 'Frozen pre-slice copies'), \xA7 Source code tree\
      \ (fixtures line), \xA7 IC-06 Affected surfaces"
  - artifact: contracts/tool-extension-and-reader.md and plan.md Technical Context ('contributors on Linux,
      macOS, Windows')
  - code: contracts/mission-status/schemas/Project.yaml and contracts/mission-status/paths/project.yaml
      (two real files that the plan flattens into one directory)
  claim: 'The plan puts the frozen copies of schemas/Project.yaml and paths/project.yaml side by side
    in tests/contract/fixtures/mission_status_pre_slice/ as Project.yaml and project.yaml. Those two names
    collide on a case-insensitive checkout (macOS default, Windows): git cannot materialise both, one
    overwrites the other, the working tree reads as modified, and the extended scratch pair (FR-022) would
    swap in the wrong bytes or fail on a contributor machine while staying green on Linux CI. The plan
    names macOS and Windows as supported contributor platforms, so the collision is in scope.'
  remediation: Do not flatten. Keep the source layout under the fixture directory (mission_status_pre_slice/schemas/Project.yaml,
    mission_status_pre_slice/paths/project.yaml, mission_status_pre_slice/examples/Project.example.yaml)
    and generate each by git show of the same relative path. Update the three places that name the fixture
    files (Generated artefacts row, source tree, IC-06 surfaces) and the SLICE_ALLOWED prefix stays tests/contract/.
  refute_reason: The contract tree really holds schemas/Project.yaml and paths/project.yaml, and plan.md
    line 256 flattens both into one fixture directory as Project.yaml and project.yaml, a case-insensitive
    collision on the macOS and Windows platforms the plan names.
- id: PLAN-ARCH-002
  lens: Contracts (shape claims against existing code)
  severity: 3
  title: Plan relies on ProjectMetadata.load never raising, but it raises on non-mapping metadata shapes
  evidence:
  - artifact: "plan.md \xA7 D-P4 (reads .kittify/metadata.yaml through ProjectMetadata.load); data-model.md\
      \ \xA7 Project: specKittyVersion ('top level not a mapping, or spec_kitty not a mapping -> null\
      \ (the read does not raise)'); plan.md \xA7 AC-PROJECT row 1 (YAML list; spec_kitty a list)"
  - code: 'src/specify_cli/upgrade/metadata.py:77-133 (ProjectMetadata.load: data.get / spec_kitty.get
      / env.get / data.get(''migrations'', {}).get applied to unvalidated YAML; only OSError and YAMLError
      are caught around the parse, and malformed migration entries are caught for KeyError and ValueError
      only)'
  - code: src/specify_cli/migration/schema_version.py:98-130 (get_project_schema_version, by contrast,
      checks isinstance dict at each level)
  claim: A non-empty YAML list at the top level, or a spec_kitty or environment value that is a list or
    scalar, makes ProjectMetadata.load raise AttributeError (a list has no get), and a non-mapping migrations
    entry raises TypeError. The plan and data-model state the builder serves null without raising while
    naming load as the reader, and AC-PROJECT row 1 plants exactly those inputs. The plan gives no guard,
    so the first red-first run shows an exception and the implementer must invent the remedy inside IC-03.
    No src change is allowed (C-006), so the guard has to live in the reader.
  remediation: 'State the guard in D-P4. Two valid options (fork): (a) pre-check the shape of the parsed
    YAML in the reader (top level mapping, spec_kitty mapping) and call ProjectMetadata.load only when
    the shape is safe, treating any residual AttributeError or TypeError from load as null; or (b) read
    spec_kitty.version directly with yaml.safe_load in the reader and keep ProjectMetadata.load only as
    the control of an equality test. Option (a) keeps the spec''s wording (''read as load reads it'');
    option (b) avoids depending on the raising loader. Either way add the raising shapes (list top level,
    spec_kitty list, environment list, non-mapping migration entry) to the AC-PROJECT row 1 plants and
    name the chosen option in the decision register.'
  fork: true
  refute_reason: ProjectMetadata.load calls data.get and spec_kitty.get on unvalidated YAML (only OSError
    and YAMLError caught) so a list top level raises AttributeError, while D-P4 names load as the reader
    and data-model says the read does not raise, with no guard stated; fork options (a) pre-check shape
    and treat residual AttributeError or TypeError as null, (b) read spec_kitty.version directly with
    safe_load and keep load only as the equality control.
- id: PLAN-ARCH-004
  lens: Contracts (additive proof, FR-022)
  severity: 3
  title: Bundle comparison "equal except Project" has no stated masking rule, so it can hide a change
    to the existing getProject operation
  evidence:
  - artifact: "plan.md \xA7 D-P10 (a): 'bundle comparison removes the new operations and schemas and the\
      \ two tags and equals the baseline bundle except Project'; \xA7 Contracts table row Project"
  - code: tests/contract/test_mission_status_contract_1_1.py:331-345 and 388-410 (CHANGED_ALLOWED; _bundle_problems
      deletes only path keys and compares whole trees); 421-437 (_make_pair copies the candidate tree,
      so the baseline is the candidate minus path keys)
  - code: 'contracts/mission-status/paths/project.yaml (the /project operation: summary, description,
      200 and default responses)'
  claim: Swapping frozen Project files into the scratch baseline makes the two trees differ at components.schemas.Project
    and in the description of the /project operation. The plan says the comparison tolerates 'Project'
    without saying what is masked. If the whole /project path item is excluded, a change to the one existing
    operation that this slice does touch (status codes, response schema, parameters) passes the additive
    proof. The planted cases listed (byte change in an existing schema, a 409 on an existing operation,
    changed info.version) do not include a plant on getProject.
  remediation: 'State the masking rule in D-P10: remove components.schemas.Project from both trees and
    compare paths./project after dropping only its description (and summary if changed); everything else
    of /project must be equal. Add two planted mutations: an extra response code on getProject, and a
    changed 200 schema reference, each of which must fail the comparison.'
  refute_reason: _bundle_problems compares whole trees after deleting only path keys, and D-P10 says only
    "equals the baseline bundle except Project" with no masking rule or plant on getProject, so a change
    to the existing /project operation could be hidden by an over-broad exclusion.
- id: PLAN-VERIFY-001
  lens: Gates
  severity: 3
  title: The named local gate-file list is not derived from the real architectural-fast roster and misattributes
    the heavy-battery censuses to it
  evidence:
  - artifact: "plan.md \xA7 The gate set (e), row architectural-fast (census of manual global state, the\
      \ home pin, dead symbols; 'the eight files of the quickstart')"
  - artifact: "quickstart.md \xA7 Architectural files that read tests/ (the eight named files)"
  - code: .github/ci-module-registry.yml:890-892 (test_no_dead_symbols.py and test_dead_symbol_allowlist_contract.py
      are excluded from the fast_gate roster on purpose); the roster block at :896-:930 names test_no_manual_global_state_mutation.py
      (:902) and test_no_tmp_paths_in_tests.py (:914) but no home-pin file
  - code: tests/architectural/test_no_tmp_paths_in_tests.py:20-30 (scans every file under tests/ for the
      shared-temp literal; in the fast roster)
  - code: tests/architectural/_clock_gate_scan.py:21 (the clock import and call bans scan src, tests and
      scripts; not in the fast roster)
  claim: 'The plan says the architectural-fast job censuses the whole test tree for manual global state,
    the home pin and dead symbols. Per the registry, dead-symbol files are excluded from that job and
    the home-pin files are not in its roster (they run in the 30-minute heavy battery, which the plan
    itself calls CI-owned). So the four plan-time failures attributed to the fast job are really heavy-battery
    files, and the ''first signal must not be CI'' promise does not hold for them. Worse, the list omits
    gates that really can fail on a new test module and that are cheap: the shared-temp literal scan (the
    evidence-class plants for absolute-path values are the natural place to type a shared-temp path),
    and the clock import/call bans (the readers take an injected clock, so a default of the wall-clock
    call would be red). Neither is named in the gate table or the quickstart, so each would first be seen
    in CI.

    '
  remediation: 'At IC-01, derive the named-file list mechanically: the fast_gate roster files that scan
    tests/ (grep the roster for scanners rooted at the tests directory) plus the two heavy clock files
    above (test_clock_import_ban.py, test_clock_call_ban.py), run as single named files (no directory
    sweep, so the NO_FULL_HEAVY_SUITES rule holds). Correct the gate-table sentence so dead symbols and
    the home pin are attributed to architectural-heavy, and add the plant rule ''no shared-temp literal
    in a plant; build host-path shapes from fragments'' to the quickstart''s last section beside the unicode-escape
    hazard.

    '
  refute_reason: The registry excludes test_no_dead_symbols.py and test_dead_symbol_allowlist_contract.py
    from the fast roster and lists no home-pin file, yet plan.md and the quickstart attribute dead symbols
    and the home pin to architectural-fast, and the fast roster scan test_no_tmp_paths_in_tests.py and
    the heavy clock-ban files are absent from the named list.
- id: PLAN-VERIFY-002
  lens: Floors and bounds
  severity: 3
  title: NFR-001 (job gain at most 120 s) has no recorded baseline and no test bounds it; W-7 compares
    against nothing
  evidence:
  - artifact: "plan.md \xA7 Baseline (f), 'To be taken at implement start' item 3 (records only architectural-fast\
      \ and architectural-heavy durations)"
  - artifact: 'plan.md D-P5 (''CI baseline from the previous slice: about 3 minutes''; re-plan above 6
      minutes) and W-7 (''first CI run''s reality-job duration against NFR-001'')'
  - artifact: plan.md Reality-check design notes ('no new case over 120 s')
  - code: .github/workflows/ci-router.yml:951-982 (tests-corpus-blocking, 10-minute timeout) and :983-1010
      (tests-contract-tools, 15-minute timeout)
  claim: 'NFR-001 is a gain bound: the corpus job gains at most 120 s. Gain needs a baseline duration
    of that job on current main, but IC-01 records durations only for the two architectural jobs; the
    corpus-blocking and contract-tools baselines are a remembered ''about 3 minutes'' from the previous
    slice. The in-test bound (''no case over 120 s'') bounds one case, not the job (a Project build plus
    a scan plus per-Mission reports can each be under 120 s and sum far above it). The plan also never
    converts its local proxies (the measured 108 s local for the unchanged corpus job, about 180 s in
    CI, so a factor near 1.7; one scan 40 to 52 s local) into a predicted CI gain, so a reviewer cannot
    tell whether the bound is tight (it is not far: roughly 70 to 90 s predicted against 120) or whether
    the 6-minute re-plan line is consistent with it (3 + 2 = 5 minutes). The bound is therefore falsifiable
    only by an after-the-fact reading at W-7, with no stated pass rule.

    '
  remediation: 'Extend Baseline item 3 to record the last N main-run durations (median) of both tests
    (corpus-blocking) and tests (contract tools). State in D-P5 the local to CI factor derived from the
    108 s versus CI figures, the predicted gain, and the W-7 pass rule: first-PR-run duration minus the
    recorded median is at most 120 s, and the contract-tools job stays under its own timeout with the
    margin recorded. Add one test that asserts the sum of the Project build, the scan and the per-Mission
    reduction inside a single bounded case, so the in-test bound and NFR-001 are the same quantity.

    '
  refute_reason: Baseline item 3 records durations only for the two architectural jobs, D-P5 holds only
    a remembered "about 3 minutes" CI figure for the corpus job, and W-7 states no pass rule for the 120
    s gain while the in-test bound covers one case, not the job.
- id: PLAN-VERIFY-003
  lens: Baseline honesty
  severity: 3
  title: The only parallel window (IC-01 beside IC-02) lets IC-02 change tools and tests before the baseline
    exists
  evidence:
  - artifact: plan.md IC-01 steps (5) baseline in a synced environment; IC-02 'no dependency; concurrent
      with IC-01'; IC-02 acceptance 'the architectural-fast files run green'
  - artifact: "plan.md \xA7 Baseline (f) 'To be taken at implement start (IC-01, before its first change)'"
  - artifact: "quickstart.md \xA7 Environment (the synced environment is built by IC-01)"
  claim: 'The baseline rule is that only a failure red on the branch and green on the base counts as introduced.
    IC-01 owns the baseline and the synced environment, yet IC-02 is dispatched concurrently with its
    own acceptance requiring green architectural-fast files, test_leak_scan and test_fixture_builder runs,
    and ruff over contracts/tools (ruff cannot run in the stale environment). IC-02''s reds cannot be
    binned against a base that has not been measured, and it has no access to the environment its acceptance
    needs unless it builds its own.

    '
  remediation: 'Two valid remedies (fork). Option A: make the D-0 sync plus the baseline and the synced
    environment an orchestrator step before any dispatch (IC-01 then keeps only the re-measurements and
    the campsite). Option B: keep IC-01 first and make IC-02 start only after IC-01''s baseline note is
    appended to the tracer file, accepting that the parallel window disappears (the lane computation is
    unchanged either way). State the chosen option in the Lanes section.

    '
  fork: true
  refute_reason: Plan makes IC-01 own the synced-environment baseline yet runs IC-02 concurrently with
    an acceptance (architectural-fast green, ruff) that needs that environment and a measured base; real
    defect, fork between an orchestrator pre-step and serialising IC-02 after IC-01's baseline note.
- id: PLAN-VERIFY-004
  lens: Test strategy
  severity: 3
  title: Corpus-reading assertions are placed in tool-job modules (which the repo documents as reading
    no corpus), with no stated home or non-vacuity guard
  evidence:
  - artifact: plan.md Test strategy, AC-DRIFT row 19 ('equality with is_mission_completed over every non-coordination
      corpus Mission'), AC-CROSS 4 ('real directory at most 5 s', 'one Project build and one scan at most
      120 s')
  - artifact: plan.md D-P5 (drift, project and ops modules run in tests (contract tools); the reality
      extension in corpus-blocking)
  - code: docs/development/reference/ci-gate-mechanics.md:776-782 ('They read no corpus; keeping them
      out of tests (corpus-blocking) keeps that job inside its timeout')
  - code: '.github/workflows/ci-router.yml:1000-1010 (tool job: uv sync --frozen --no-install-project,
      -n 4 --dist loadfile, 15-minute timeout)'
  claim: 'AC-DRIFT row 19 iterates the real corpus inside test_mission_status_drift.py, and AC-CROSS 4''s
    real-directory and whole-build bounds have no stated module. If they land in the new modules they
    run in the tool job, contradicting the documented split and adding corpus time to a job whose budget
    the plan never measures; if they land in the reality module the table is wrong about its modules.
    Row 19 also has no discovered-count guard (a Mission count that falls to zero would pass vacuously),
    although the plan''s own Section G rule demands one for every corpus-level assertion.

    '
  remediation: 'Name the module for every corpus-level row. Preferred: move row 19 and the AC-CROSS 4
    corpus-sized cases into test_mission_status_reality.py (corpus job, serial, floors available) and
    keep only fixture-built cases in the three new modules. Alternative (fork): keep row 19 in the drift
    module, add an examined-count guard (at least the D-P13 Missions floor) and update the gate-mechanics
    paragraph, which is then a docs edit outside SLICE_ALLOWED and must be added to the scope data. Either
    way add the guard to row 19.

    '
  fork: true
  refute_reason: Plan row 19 iterates the real corpus inside the drift module which D-P5 places in the
    tool job that ci-gate-mechanics.md says reads no corpus, and states no discovered-count guard for
    it or for AC-CROSS 4's real-directory bound; fork between moving to the reality module or keeping
