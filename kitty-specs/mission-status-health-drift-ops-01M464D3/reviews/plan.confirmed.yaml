- id: PLAN-VERIFY-005
  lens: Wrap-up order
  severity: 2
  title: Departs 11 discloses one reordering of the wrap-up procedure but the plan moves three steps
  evidence:
  - artifact: plan.md Departs from the spec, item 11; Wrap-up checklist W-1 (accept, consolidate, issue
      verdict) then W-3 (dev-assist) then W-4 (squad)
  - code: 'packs/built-in/procedures/mission-wrap-up-sequence.procedure.yaml steps: accept, retire dev-assist
      tests, resolve issue verdicts, aggregate review, consolidate, compact, rebase, draft PR'
  - code: .kittify/charter/charter.md:467 (the standing sequence)
  claim: 'The procedure orders accept, dev-assist, verdicts, squad, consolidate. The plan runs accept,
    consolidate, verdict, J-1 confirmation, dev-assist, squad. Departs 11 mentions only squad versus consolidation.
    Moving dev-assist after consolidation and the verdict ahead of the squad are undisclosed departures;
    the squad then reads a tree on which tests may still be retired or renamed in W-3 only if W-3 precedes
