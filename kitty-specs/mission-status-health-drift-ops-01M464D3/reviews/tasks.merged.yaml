    the orchestrator does when no JVM-capable machine exists (tell the operator before the draft PR, budget
    a second compaction), so the "operator accepts" branch has no recorded form and no W-2/W-7 consequence.

    '
  remediation: 'Append the P-9 sentence to J-1 and require that an acceptance be recorded in tracer-design-decisions.md
    in place of the nine lines, with W-2 and W-7 citing it.

    '
