- id: TASKS-COVER-007
  lens: anti-laziness
  severity: 1
  title: Small count and ownership slips in WP03 and WP10 subtasks
  evidence:
  - artifact: "tasks/WP03-project-vertical.md \xA7 T012 Files ('the ten files of the contract family listed\
