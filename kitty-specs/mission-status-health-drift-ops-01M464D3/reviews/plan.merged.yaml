- id: PLAN-GOV-006
  lens: terminology
  severity: 2
  title: New coined terms have no glossary decision, and 'drift' collides with existing glossary terms
  evidence:
  - artifact: "plan.md \xA7 Gate set row 'Contextive glossary traceability' and \xA7 Generated artefacts\
      \ row (glossary and contextive files 'Not touched'); tracer-tooling-friction.md F-9"
  - artifact: 'spec.md Terminology: ''The glossaries have no entry for invocation, drift or health; they
      are defined here.'''
  - code: spec-kitty glossary list shows active entries 'issue-matrix schema drift' and 'tool-surface
      drift' (scope spec_kitty_core)
  claim: 'The plan decides nothing about the glossary beyond ''no contextive map change''. The contract
    introduces drift finding, health, invocation, closure spine, fallback Mission as domain terms in a
    public contract, and ''drift'' already names two other things in the repository glossary; the plan
    does not say whether the terms are to be added, deferred, or kept contract-local, nor that descriptions
    must say ''drift'' means disagreement of a derived Mission artifact with its authority.

    '
  remediation: 'fork: true. Option A: add a plan decision (and a tasks line) that the Mission adds draft
    glossary entries for drift finding, invocation and health in the glossary file the repository uses
    for planning-and-tracking, plus the contextive entry the traceability test expects, as part of IC-06
    or a separate small package (needs the file set to admit those files, see PLAN-GOV-002). Option B:
    state in the plan that the terms stay spec-defined and contract-local, defer the glossary entry as
    an item the operator owns, and require the Drift schema description to disambiguate from the existing
    ''drift'' terms.

    '
