- id: PLAN-GOV-001
  lens: trace
  severity: 3
  title: Departs 5 mislabels a real departure from the fixed spec; plan runs offline what FR-025 and AC-REALITY
    2 and 3 say is skipped
  evidence:
  - artifact: "plan.md \xA7 Departs from the spec, item 5 and its header ('the spec text is left as it\
      \ is'), and \xA7 Reality-check design notes ('The Ops walk, its oracle comparison and the fingerprints\
      \ run in both')"
  - artifact: "spec.md \xA7 AC-REALITY bullets 2 and 3 (as edited in 02e425dc4): 'offline these assertions\
      \ are skipped by a named skip'; FR-025 'Corpus outcome' bullet: 'offline the floor, oracle, examined-plus-skipped\
      \ and per-Mission equality assertions are skipped'"
  - artifact: tracer-approach.md A-6 restates the spec as 'offline they take a named skip'
  - artifact: "plan.md \xA7 Departs from the spec item 5 and \xA7 Reality-check design notes ('The Ops\
      \ walk, its oracle comparison and the fingerprints run in both')"
  - artifact: spec.md AC-REALITY bullet 2 and FRESH4-001 ('Examined plus skipped equals discovered for
      Missions and Ops ... offline these assertions are skipped by a named skip')
  claim: 'The spec as fixed in the plan commit says the whole of AC-REALITY bullets 2 and 3 (examined
    plus skipped, Ops walk equals oracle, skippedCount equality, kitty-specs/kitty-ops fingerprint) takes
    a named skip offline. Departs 5 opens with ''skip offline wholesale (as fixed by this phase)'' and
    then specifies the opposite for the Ops walk, skippedCount equality and the read-only fingerprint
    (they run in every environment). That is a real departure from binding-as-written spec text, but the
    header of the list claims items 1 to 6 are inconsistencies in the spec left unedited, so a tasks author
    reading the spec and the plan gets two rules, and the spec fix this phase made is contradicted by
    the plan that made it. No operator ruling is contradicted (FRESH4-001 only says an offline run is
    no evidence for SC-002/SC-007), so the departure itself is defensible.

    '
  remediation: 'fork: true. Option A (keep the plan''s behaviour): reword Departs 5 as an explicit departure
    (''the spec skips X offline; the plan runs Y offline because it needs no network''), move it out of
    the ''inconsistencies'' framing, and edit AC-REALITY 2, 3 and the FR-025 sentence in spec.md to name
    only the resolver-dependent assertions as skipped (add-only record of the edit in tracer-approach.md
    A-6). Option B (keep the spec): drop the ''run in both'' sentence from the Reality-check design notes
    and AC-REALITY 3 row, so offline everything in bullets 2 and 3 skips.

    '
  merged_from:
  - PLAN-ARCH-006
