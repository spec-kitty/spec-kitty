feedback:
  - id: WP04-C2-001
    severity: 1
    claim: >
      The ".lock" suffix rename (agent-commands-freshness.lock) that produces the SK-243-safe
      apply-last ordering is a real, code-level guarantee today -- verified directly by reading
      asset_preparation._write_order (agent_commands.py:1041-1058): a name ending in ".lock"
      without a leading dot lands in stage 6, sorted dead last alongside _VERSION_FILENAME,
      regardless of path depth; a leading-dot ".foo.lock" instead lands in the EARLY stage 1
      bucket (the OS persistent-lock convention), which I independently confirmed reproduces the
      pre-fix ordering hazard (mutation M7b above). However, this is a private implementation
      detail of a DIFFERENT module (asset_preparation._write_order) that agent_commands.py
      couples to only by filename convention -- there is no named constant, no public "apply-last"
      API, and no test inside asset_preparation.py's own suite that pins "any .lock-suffixed
      non-dotfile effect sorts last" as a contract of that module. A future refactor of
      _write_order's stage classification (e.g. renumbering stages, or changing the suffix match)
      would only be caught by THIS WP's own TestFreshnessStampAppliesLast test, not by anything in
      asset_preparation.py. Grepped for other code treating "*.lock" specially (a lock to wait on,
      or cleanup/exclusion logic): the only other suffix-based ".lock" handling found is
      upgrade/skill_update.py's exclude_paths(".kittify/*", "*.lock"), which is an unused docstring
      example (zero real call sites) -- not a live hazard. No stale-lock-cleanup or generic
      home/cache-scanning code was found that would mistake this stamp for an OS lock file.
    remediation: >
      Advisory only, not blocking: consider a narrow regression test in
      tests/specify_cli/runtime/test_asset_preparation*.py (or wherever _write_order is tested
      directly, if it is) asserting the specific stage-6-for-.lock / stage-1-for-leading-dot-.lock
      contract at the asset_preparation level, so a future change to that private sort key fails
      closer to its source rather than only via this WP's own cross-module test.
