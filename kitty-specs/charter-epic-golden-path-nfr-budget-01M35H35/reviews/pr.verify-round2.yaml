      The tests are non-vacuous against the naive shape now.

  - id: pr-FRESH-002
    status: resolved
    reason: >-
      5df77a07b adds a runtime guard to overwrite_internal() (asset_preparation.py:296-300):
      raises ValueError unless path.parent equals the owner's cache root
      (self.inventory.parent) AND path.name ends with ".lock". Ran
      tests/specify_cli/runtime -m "not performance and not stress": 117 passed, including
      the 5 overwrite_internal tests, the full freshness/staleness/stamp-applies-last suite
      (26 tests selected via -k "freshness or staleness or stale or overwrite_internal", all
      passed) -- WP04's stamp write (agent_commands.py's
      home/"cache"/_FRESHNESS_STAMP_FILENAME, a real ".lock" file directly under the cache
      root) is unaffected. Re-proved red-first: removed the guard body, reran
      test_asset_preparation_overwrite_internal.py -- the two rejection tests
      (test_overwrite_internal_rejects_a_user_facing_managed_path,
      test_overwrite_internal_rejects_a_cache_root_path_without_the_lock_suffix) went FAILED
      ("DID NOT RAISE ValueError"); restored the file (byte-identical, git diff clean).
      Bypass check (own script, not in the test suite): (1) a literal ".." traversal target
      (cache/../evil.lock) is rejected by the guard itself, since Path equality on the
      unresolved parent never matches cache_root when ".." segments are present. (2) the
      guard does NOT call .resolve() -- a ".lock"-named symlink placed directly in the cache
      root (parent literally == cache_root) DOES pass the guard's own check and gets staged.
      However this is not an exploitable bypass end-to-end: the actual disk-apply layer
      (_write_asset in the same module) explicitly safe_unlink()s any destination that is
      currently a symlink before writing, and the underlying write_generated_file() used for
      the real write independently raises ValueError if asked to write through a symlink
      (its own docstring: "Symlinks are refused"). Empirically confirmed: staged a symlink
      named cache/sneaky.lock pointing at an outside file, ran overwrite_internal (staged,
      guard did not reject) then _write_asset on that staged write -- the outside file was
      untouched, and sneaky.lock ended up a regular file (the symlink was destroyed and
      replaced, never followed). So the guard's own comparison is unresolved-path, not a
      resolved-path comparison, but the layered defense at apply time closes the gap the
      finding's remediation was concerned about; no live bypass exists.

