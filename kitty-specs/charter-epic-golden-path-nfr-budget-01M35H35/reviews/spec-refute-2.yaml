      citation in spec.md literally includes the timeout marker; tracer-approach.md's own
      item 4 confirms this was a deliberate override of the dispatch's more accurate
      "797-805" (not a typo), and its stated rationale for doing so is internally
      inconsistent with the marker needing to survive.
  - id: SPEC-VERIFY-002
    verdict: confirmed
    reason: >-
      The arithmetic checks out exactly as claimed: spec.md's NFR-002 cites "139.7s ...
      vs then-current local ~156s" as support for "ran 12-30s slower," but
      156-139.7=16.3 (VM faster, not slower); the 12-30s figure only matches when 139.7s
      and 159.5s are instead compared against the CURRENT baseline 127.55s
      (139.7-127.55=12.15s, 159.5-127.55=31.95s), which is exactly the comparison the
      spec's own Evidence section performs two paragraphs later — confirmed also in
      tracer-design-decisions.md, which repeats the same flawed "vs ~156s" framing.
  - id: SPEC-VERIFY-003
    verdict: confirmed
    reason: >-
      C-005 is pure policy prose with no proposed detection mechanism, while FR-005/SC-002
      specify a concrete two-tier gate for a different defect (lever-C cost regression) —
      no FR in spec.md addresses mechanical detection of a future skip/xfail re-add on
      this test, and the charter's "Architectural gate discipline" standing order
      (verified at charter.md line 75: "Close defect classes by construction with a
      NON-VACUOUS call-site gate") directly applies since C-005 itself frames this as
      "exactly a prior instance" of a defect class.
  - id: SPEC-VERIFY-004
    verdict: confirmed
    reason: >-
      SC-002's exact text ("if a wall-clock assertion is warranted, it is scoped to the
      performance-marked nightly lane") is confirmed verbatim in spec.md, and the cited
