      so the hedge is a real deviation from the precedent SC-002 claims to follow.
  - id: SPEC-VERIFY-005
    verdict: confirmed
    reason: >-
      Confirmed verbatim in spec.md's Edge Cases: the bullet states only "the mission
      must re-measure on a real Actions runner before declaring closure" with no fallback
