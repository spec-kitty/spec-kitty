  - id: SPEC-VERIFY-001
    verdict: confirmed
    reason: >-
      Verified via `grep -n` against tests/e2e/test_charter_epic_golden_path.py: line 797 is
      `@pytest.mark.skip(`, line 805 is the decorator's closing paren, line 806 IS
