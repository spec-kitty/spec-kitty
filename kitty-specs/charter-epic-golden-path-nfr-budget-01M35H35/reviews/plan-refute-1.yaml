- id: PLAN-GOV-001
  verdict: confirmed
  reason: 'The operator''s verbatim Lever quote in spec.md names a specific cost driver ("trim the residual ~0.2s/call Typer command-surface construction that #4417 deferred"), plan.md''s own text confirms it demoted that literal mechanism to "Secondary" (~2s total) while promoting a different subsystem (assess_global_agent_commands()''s freshness-stamp fix, ~55-65% of cost) to primary, and tracer-design-decisions.md''s "On whether this needed an operator ruling" section (verified verbatim) shows the plan-authoring agent itself recognized and self-resolved this exact question; unlike FR-002, which Ruling 5 explicitly hands to "the plan phase chooses the concrete mechanism" (verified in spec.ruling.md and spec.md''s FR-002 text), no ruling grants that same latitude for FR-003/lever C, an asymmetry confirmed by rereading all five rulings in reviews/spec.ruling.md.'
- id: PLAN-GOV-002
  verdict: confirmed
  reason: 'SPEC-KITTY-LEDGER.md''s SK-243 entry (verified directly) is open, first-hand-verified 2026-09-22 (one day before plan.md), and is specifically about ensure_global_agent_commands() racing on AssetPreparation drift-recheck under concurrent missions -- distinct from the separately-scoped #4017 (ensure_runtime()) that spec.md does carve out; the cited code (agent_commands.py:35, :368-369 building AssetPreparation("slash_commands", ...), asset_preparation.py:783''s ValueError) is accurate, and a full-text search of plan.md/data-model.md/research.md confirms zero mentions of SK-243, #4017, or "Global asset input changed" anywhere, while data-model.md''s Concurrency section (verified) addresses only torn-write protection on the new stamp, not the legitimate-concurrent-mutation-misread-as-drift failure mode SK-243 documents for this exact function.'
- id: PLAN-ARCH-001
  verdict: confirmed
  reason: Verified by reading the current agent_commands.py source directly -- assess_global_agent_commands() (lines 343-443) today unconditionally renders then diffs against destination bytes every call (self-healing), the freshness stamp's three data-model.md fields (cli_version, template_source_signature, agent_keys) are all source-side with no destination check, and _all_global_agent_commands_healthy() (lines 296-305, exact line match) is confirmed by grep to have zero callers anywhere in src/ or tests/ -- so a stamp match would skip the render/diff/self-heal pass with no destination-health verification, exactly as claimed.
- id: PLAN-ARCH-002
  verdict: confirmed
  reason: Verified _VERSION_FILENAME = "agent-commands.lock" (line 40) is written today as plain version-string bytes via finish()'s version_path branch (asset_preparation.py:397-400, data=version.encode()) with zero readers confirmed by grep across the repo, and data-model.md's Read/write contract (verified) specifies dispositions only for "match" and "miss (absent or fields differ)", never for malformed/legacy content, despite asserting the stamp "never errors" -- a real, cited precedent (AssetPreparation.__init__ raising ValueError on malformed inventory content, lines 186-204, verified) shows the codebase's existing default behavior for corrupt cache content is to raise, and that raise's propagation path (agent_commands.py:434-443's except clause -> incomplete() -> _apply_command_assessment's RuntimeError at 473-492) is verified accurate.
- id: PLAN-VERIFY-001
  verdict: confirmed
  reason: Rereading plan.md line 145 directly, the sentence genuinely welds "This plan requires adding `--durations=1` ... to that one `run:` step in `ci-router.yml`'s `tests-e2e` job" (imperative, unqualified) to a trailing, grammatically disconnected "is explicitly NOT proposed" -- a real, independently-judged grammatical break that could plausibly be misread as a standing instruction to edit ci-router.yml, which would violate Ruling 4; this is a genuine wording defect, not a stretch.
- id: PLAN-VERIFY-002
  verdict: confirmed
  reason: 'Verified directly against ci-router.yml (lines 676-683): the tests-e2e job has exactly one run step combining `uv sync --frozen --all-extras` and `uv run --frozen pytest tests/e2e -q`, with no step boundary between them; verified tests/e2e/ contains 21 def-test functions across 6 files (grep -rn ''def test_'' tests/e2e/*.py, including indented class methods in test_cli_smoke.py) with no --durations flag in pytest.ini''s addopts (verified "--tb=short" only) and no internal timing instrumentation in test_charter_epic_golden_path.py (grep for time.monotonic/perf_counter/elapsed/duration returns zero hits) -- so the step-level Actions timestamp genuinely cannot isolate the golden-path test''s own duration from uv sync plus 20 other tests, exactly as claimed.'
- id: PLAN-VERIFY-003
  verdict: confirmed
  reason: Rereading plan.md's Actions evidence path section directly confirms the NFR-002/SC-003 closure evidence is recorded purely as prose (PR description + a new plan.md heading "added by the implementer"), with no test, lint rule, or CI gate cited anywhere in plan.md asserting the section exists or contains a real figure before the mission is treated as closed -- in contrast to FR-005's regression guard, which plan.md itself describes as a real, gated, always-on structural test; the asymmetry and the absence of a mechanical check are both verified by direct reading, not merely asserted by the finding.
- id: PLAN-VERIFY-004
  verdict: confirmed
  reason: Verified directly against ci-router.yml -- the `next` filter group (lines 116-119, exact match) includes 'src/specify_cli/runtime/**', which covers agent_commands.py; `next` is part of the `unmatched` catch-all's own union (steps.filter.outputs.next at line 218, exact match); and `next == 'true'` is one of the architectural-heavy job's OR-list triggers (line 523, exact match). Plan.md's Router-filter note (line 188) claiming agent_commands.py is "covered by no explicitly-named router filter group" is factually wrong on all three counts, with every line number the finding cites confirmed exact.
- id: PLAN-VERIFY-005
  verdict: confirmed
  reason: Verified src/specify_cli/__init__.py:151 (exact line match) gates ensure_global_agent_commands() behind `if not _is_doctor_skills_invocation(sys.argv):`, a fourth guard independent of and in addition to the three named in plan.md's Lever C section (_is_next_invocation/_is_live_work_hook_invocation/_is_session_start_invocation, which gate the enclosing block at line 140) -- plan.md's enumeration is genuinely incomplete by one, though the finding itself correctly notes this has no bearing on the plan's core count or correctness (severity 1, minor wording fix).
