findings:
  - id: PR-BOUNDARY-001
    lens: kernel/CLI seam — private-convention reach
    severity: 3
    title: "agent_commands.py reaches past AssetPreparation's public API into its private _effect() method to write the freshness stamp"
    needs_operator_decision: false
    evidence:
      - code: "<checkout>/src/specify_cli/runtime/agent_commands.py:687"
      - code: "<checkout>/src/specify_cli/runtime/asset_preparation.py:261 (def _effect)"
      - code: "<checkout>/src/specify_cli/runtime/asset_preparation.py:289 (def asset, the public equivalent)"
      - artifact: "kitty-specs/charter-epic-golden-path-nfr-budget-01M35H35/data-model.md § Agent-commands freshness stamp (\"Write: only after a full, successful render-and-apply cycle completes\")"
    claim: >
      `assess_global_agent_commands()`'s `_build()` closure writes the new freshness stamp via
      `prepared._effect(freshness_path, FileState(...), freshness_payload, OwnershipProof(...))`
      (agent_commands.py:687), calling `AssetPreparation._effect` — a name-mangled-free but
      underscore-prefixed method of a *different* module's class — directly, suppressed with
      `# noqa: SLF001` (ruff's private-member-access rule, confirmed enabled repo-wide via the
      presence of the noqa itself; grepped and confirmed this is the ONLY cross-module call to
      `._effect()` anywhere in src/ or tests/). The inline comment at agent_commands.py:660-675
      gives a genuine, verified-correct rationale for why the *public* `prepared.asset()` method
      is semantically wrong here (its drift-preservation logic would permanently preserve a
      corrupted stamp instead of overwriting it — I confirmed this reading `asset()` at
      asset_preparation.py:289-310). That rationale is sound, but it argues for a capability gap
      in `AssetPreparation`'s public surface, not for reaching past the underscore. Calling a
      leading-underscore method across a module boundary means the caller relies on an
      implementation detail `asset_preparation.py` has made no compatibility promise about; a
      future refactor of `_effect()`'s signature or semantics (entirely legal for a private
      method under this codebase's own conventions) would silently break `agent_commands.py`
      with no contract test to catch it. This is a distinct concern from the already-recorded
      WP04-C2-001 (which is about the `.lock`-suffix filename convention coupling to
      `_write_order`'s stage classification) — WP04-C2-001 does not mention the direct private
      *method* call at all, so this is not a re-file of that finding.
    remediation: >
      Promote a narrow public method on `AssetPreparation` (e.g. `overwrite_internal(path,
      after, content, proof)` or `stage_unconditional(...)`) with exactly `_effect()`'s
      "always overwrite, no drift-preservation" semantics, documented as the supported primitive
      for internal cache-only bookkeeping files (the freshness stamp today; `_VERSION_FILENAME`
      already gets the same semantics via `finish()`, which is itself a public method). Have
      `agent_commands.py` call that public method instead of `prepared._effect()` directly, and
      drop the `# noqa: SLF001`. This keeps the same, already-tested apply-last/same-batch
      behavior while making the capability part of `AssetPreparation`'s contract rather than an
      unguarded reach past its module boundary.
