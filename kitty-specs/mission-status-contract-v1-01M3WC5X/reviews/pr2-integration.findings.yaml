findings:
  - id: PR2-INTEGRATION-001
    lens: integration
    severity: 2
    title: Public docs and code comments cite "DD-32" and "ruled 2026-10-02", which no reader of the PR can resolve
    evidence:
      - code: "docs/development/reference/ci-gate-mechanics.md:558 (operator ruling DD-32), :588 (operator ruling 2026-10-02)"
      - code: ".github/workflows/contracts.yml:4, .github/workflows/ci-router.yml:823, tests/architectural/_gate_coverage.py:139, tests/architectural/test_no_duplicate_suite_execution.py:249, tests/ci/test_contracts_workflows.py:41,906, contracts/README.md (ruled 2026-10-02)"
      - code: "origin/main:kitty-specs/mission-status-contract-v1-01M3WC5X/tracer-design-decisions.md has 0 occurrences of DD-32; the PR stack does not add it (only the root checkout has it, line 284)"
    claim: DD-32 exists only in an uncommitted working copy of the Mission's decisions file. In the public PRs the id points at nothing, and "the operator" is an unnamed role. The accepted-risk statements (reader drift caught by the nightly run) carry the same weakness, with a date only.
    remediation: Commit tracer-design-decisions.md with DD-32 on the PR branch (or drop the id) and rewrite the prose as a self-contained rationale, e.g. "the tool tests moved to the Contracts workflow to keep the router's corpus job inside its 10 minute timeout (7m20s with them)". Replace "operator ruling" with "maintainer decision" or cite the PR comment.
  - id: PR2-INTEGRATION-002
    lens: integration
    severity: 1
    title: verify-pins comment contradicts itself
    evidence:
      - code: ".github/workflows/contracts.yml:47-49 'Nothing is downloaded by this job, so --fetch downloads each pinned artefact'"
    claim: The sentence says nothing is downloaded and then that --fetch downloads. The job does download all four pinned artefacts. The README says "A job that has already downloaded the tools passes --artifacts", which does not apply to this job.
    remediation: Reword to "This job installs no tools itself, so --fetch downloads each pinned artefact over https and hashes it".
  - id: PR2-INTEGRATION-003
    lens: integration
    severity: 1
    title: Commit subjects carry internal work-package and decision-record jargon
    evidence:
      - code: "git log: ci(contracts): list the WP08 corpus test modules ... ; ci(contracts): list the two IC-09 corpus modules ..."
    claim: WP08 and IC-09 mean nothing to a reader of the public history. All 49 commits are otherwise valid commitlint types (feat, fix, test, ci, docs, chore), the commitlint config has no header-length rule, and no username or path leaks in any message.
    remediation: Optional. Reword at the next history collapse, e.g. "list the lint, breaking-change and release corpus test modules".
