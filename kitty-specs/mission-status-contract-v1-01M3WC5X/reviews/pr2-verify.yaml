judgments:
  a_release_flow: >
    Usable but brittle, not wrong. Contracts is path-filtered (contracts/**, tests/contract/**, CODEOWNERS, contracts.yml), so
    the exact-SHA rule refuses a tag on any main commit that did not itself touch those paths, and a run cancelled by the
    cancel-in-progress concurrency group never counts. The error message and README tell the releaser to tag the contracts
    commit, which is the normal flow. Minimal correct rule: query the run for the most recent commit that touched the filter
    paths (git log -1 --format=%H $GITHUB_SHA -- contracts tests/contract .github/CODEOWNERS .github/workflows/contracts.yml),
    and add event=push and branch=main. See PR2-FRESH-001.
  b_release_tag_exclusion: >
    Correct. The release job runs on the pushed tag, so without exclusion the newest tag is the commit itself and the check
    compares it with itself (test_the_tag_being_released_is_never_its_own_baseline fails when the exclusion is reverted).
    Exclusion is by exact string, the first release falls back to no-baseline, and a backport tag lower than the newest release
    would still be compared with the newest (pre-existing, single-module today).
  c_gh_api_query: >
    Fail-closed: set -eu makes a gh failure abort the step, a non-integer or empty answer fails the -lt test, and zero runs
    refuses. The jq filter re-checks head_sha and conclusion. It cannot be satisfied by a run for another SHA. It can be
    satisfied by any event or branch that ran on the same SHA, including a pull_request run (which tests the merge ref with
    main, not the SHA alone) or a fork PR run listed in the base repo; both are for a commit already on main, so the exposure
    is small. Filtering event=push and branch=main closes it.
