    any message.
  remediation: Optional. Reword at the next history collapse, e.g. "list the lint, breaking-change and release corpus test
    modules".
  verified_severity: 1
  refute_verdict: partial
  refute_reason: Subjects 'list the two IC-09 corpus modules' and 'list the WP08 corpus test modules' exist (git log origin/main..HEAD,
    lines 16 and 37) and the jargon is real, but the planned compaction into a few sliced commits per seam rewrites these
    subjects anyway, so it only needs to be avoided when re-authoring; no action on the current history.
  orchestrator_route: resolved by the per-seam history compaction before push
- id: PR2-TESTS-003
  lens: tests
  severity: 1
  title: Reality module docstring promises --dist loadfile but the only job that runs it uses no xdist
  evidence:
  - code: tests/contract/test_mission_status_reality.py:20
  - code: .github/workflows/ci-router.yml:843
  claim: 'The counting test relies on file-order execution. The router corpus job runs the module serially, so it holds, and
    the contracts job ignores the module. The claim in the docstring is only true if someone later adds -n, and the module-scoped
    _build_index cache and EXECUTED set are also correct only under file-local ordering. The cache itself is sound: roots
    are resolved, planted repos under basetemp are walked fresh, and the fingerprint fixture proves the tree unchanged. No
    leakage was found.

    '
  remediation: Say in the docstring that the module must stay serial or on loadfile, no code change needed.
  verified_severity: 1
  refute_verdict: confirmed
  refute_reason: The module docstring (test_mission_status_reality.py:20) cites --dist loadfile, but the only job running
    it (ci-router.yml:843) passes no -n or --dist, so it runs serially; the guarantee holds today and the sentence is only
    misleading. A docstring-only fix is enough.
- id: PR2-TESTS-004
  lens: tests
  severity: 1
  title: Single-home guard marker is a literal duplicated from the workflows
  evidence:
  - code: tests/ci/test_contracts_workflows.py:912
  - code: .github/workflows/ci-router.yml:843
  claim: 'The guard now uses real collection (robust to indirect marks, proven by the indirect-mark control), but TOOL_TEST_MARKER
    is a literal; only the contracts job''s -m is asserted against it (line 899). If the router job''s -m changed, the guard
    would not follow.

    '
  remediation: Assert the router corpus job's -m expression equals TOOL_TEST_MARKER too.
  verified_severity: 1
  refute_verdict: confirmed
  refute_reason: TOOL_TEST_MARKER is a literal (test_contracts_workflows.py:912); router_contract_modules (line 932-935) extracts
    only module paths from the router command and never asserts its -m expression, so a changed router -m would not trip the
    guard. Add an equality assert as proposed.
