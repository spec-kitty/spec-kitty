- id: PLAN-ARCH-009
  lens: Blast radius
  severity: 3
  title: The router selects tests-corpus on the wrong triggers for a test that reads meta.json and status.events.jsonl;
    the plan states the reverse risk only
  evidence:
  - artifact: "plan.md \xA7 Reflexivity item 2 and item 5; Gate set row 'Corpus-trigger completeness'"
  - code: .github/workflows/ci-router.yml:174-183 (corpus group lists kitty-specs/**/spec.md, plan.md,
      tasks/**, contracts/**, acceptance-matrix.json only)
  - code: tests/architectural/test_ci_corpus_trigger_completeness.py:78-80 ('Never add bare kitty-specs/**
      or status.events.jsonl (C-001) -- that would fire on routine WP status-event churn')
  claim: The reality check reads every Mission's meta.json, status.events.jsonl and tasks/WP*.md, but
    by design a commit touching only meta.json or status.events.jsonl (every status transition) does not
    select tests-corpus. The plan reasons that a stranger's data defect can redden a PR that touches corpus
    paths; the larger exposure is that a data defect committed by a status-only change merges unchecked
    and surfaces on the push-to-main run of built-in-corpus-suite, or on the next unrelated corpus-selected
    PR, attributed to the wrong author. Only reader drift is acknowledged (item 5), not data drift on
    the unrouted files.
  remediation: 'Add this to Reflexivity as an accepted, named risk (R-14 sibling) with its detection point
    (push-to-main built-in-corpus-suite, nightly) and make the triage rule explicit: a red naming a Mission
    the PR does not touch is classified first, and the first-red on main is routed to the Mission''s owner,
