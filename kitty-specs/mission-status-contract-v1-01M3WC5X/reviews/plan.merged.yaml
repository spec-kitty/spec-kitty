- id: PLAN-ARCH-004
  lens: Resolver-parity and bundler fidelity
  severity: 4
  title: The bundler-fidelity spike (and the whole JVM toolchain) is scheduled before the workflow that
    can execute it exists
  evidence:
  - artifact: research.md R-3 ('bundle it in the contracts workflow on the draft PR'; 'first task of IC-07')
  - artifact: "plan.md \xA7 Implementation Concern Map (IC-07 'CI-only feedback loop'; IC-08 owns contracts.yml\
      \ and depends on IC-07), risk P-1, P-2, decision E-1 ('The spike is the first task of WP07 so the\
      \ question is answered early')"
  claim: IC-07 can only get feedback from CI, but contracts.yml is authored in IC-08, which depends on
