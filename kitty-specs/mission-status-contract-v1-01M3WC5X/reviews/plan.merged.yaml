- id: PLAN-ARCH-001
  lens: UI early-start claim
  severity: 4
  title: IC-04 'stable enough to generate a TypeScript client' is asserted before any validator, content
    check or client generator has ever read the split contract
  evidence:
  - artifact: "plan.md \xA7 UI early-start point, items 1-3 and 'Earlier partial points'"
  - artifact: "plan.md \xA7 Implementation Concern Map (IC-05, IC-07, IC-08 depend on IC-04 or run after\
      \ it; IC-08 is the first real execution of the workflows, risk P-8)"
  - artifact: "spec.md line 58 (path files named missions_{missionId}.yaml, braces kept) and plan.md \xA7\
      \ Source code tree (contracts/_shared/ referenced from contracts/mission-status/, _index.yaml registries)"
  - artifact: research.md R-3 (3.1 constructs may not survive the Java toolchain; spike is CI-only)
  claim: 'At the last commit of IC-04 the only things that have touched the contract are the Python resolver
    (refs) and the examples test. citation_check, provisional_check, enum_pin_check, leak_scan (IC-05),
    the 3.1 validator and vacuum lint (IC-07/IC-08) and the whole-corpus reality check (IC-09) have not
    run, and any of them can force schema changes. Item 3 (''a multi-file-capable generator can be generated
    straight from the split files'') is never exercised by any step in the plan. Unproven risk factors
    in the planned layout: unescaped braces in $ref file names, chained refs through _index.yaml, refs
    that leave the module directory into ../_shared/, path-item $ref in the root paths map, and OpenAPI
    3.1 type arrays and sibling keywords beside $ref, which many TypeScript generators handle partially.
    The plan names no generator and no smoke test, yet tells an external team this commit is generatable.'
  remediation: Either (a) move the advertised early-start point to the first commit after the contracts
    workflow has been green on the draft PR (validate-bundle, lint, example and citation checks), or (b)
    keep the IC-04 marker but label it 'unvalidated preview, no stability promise' and add an exit criterion
    to IC-04 (resolver round-trip plus example_check green). In both cases add a CI-only client-smoke
    step to the IC-07 spike that runs an openapi-generator typescript generator (Java, so Node-free, C-005
    holds) against the SPLIT root and records the result, and pin the canonical $ref spelling for brace
    file names (see PLAN-ARCH-005).
- id: PLAN-ARCH-002
  lens: UI early-start claim
  severity: 3
  title: '''Only additive or nullability-relaxing changes after the early-start point'' is incoherent
    with the plan''s own breaking-change gate, unenforced, and exposed to CL-1'
  evidence:
  - artifact: "plan.md \xA7 UI early-start point, last paragraph ('additive or a nullability relaxation,\
      \ never a removal or rename')"
  - artifact: "plan.md \xA7 Contracts table row 'contracts/mission-status/ v1' and gate table row 'Breaking-change\
      \ diff' (first release is the one allowed no-baseline state; D-P6)"
  - artifact: "spec.md CL-1 / plan.md \xA7 Branch contract (PR is a draft until a maintainer acknowledges\
      \ the design)"
  claim: (1) Making a response property optional or nullable changes a generated TypeScript type (T becomes
    T | null or optional) and is classified as breaking by oasdiff once a baseline exists, so the allowed
    change class is exactly what the plan's own gate would fail after v1.0.0; the promise protects consumers
    less than it reads. (2) Nothing in the plan checks the promise between the IC-04 commit and the IC-09
    commit, because breaking_check has no baseline before the first tag. (3) CL-1 means the maintainers
    can still request structural changes at acknowledgement, which the promise forbids; the plan does
    not say which wins.
  remediation: 'Reword the promise as a process commitment with an explicit exception (''unless the #5528
    acknowledgement requests otherwise''), say that nullability relaxation is breaking for generated clients
    and will be flagged in the module CHANGELOG under a ''pre-release shape change'' heading, and make
    it checkable: record the early-start commit as a pre-release reference and have the draft-PR breaking-change
    job print (informational, not gating) an oasdiff report against it. Pin consumers to the IC-09 point,
    as the plan already says, and say the IC-04 point carries no compatibility promise.'
