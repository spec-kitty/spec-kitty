    list the data files the check reads that the router does not select.'
- id: PLAN-ARCH-010
  lens: Blast radius
  severity: 3
  title: Committed planted leak fixtures and a directory-wide allow-list in leak_scan contradict C-006
    and the plan's 'no allowlist' claim
  evidence:
  - artifact: contracts/tools-and-workflows.md line 11 ('Planted files carry a marker line and are asserted
      to be detected by the text-level scan, which allow-lists exactly this directory')
  - artifact: "plan.md \xA7 Charter Check row Standing Order 5 ('no allowlist is added'); \xA7 Test strategy\
      \ preamble ('planted values in test code are assembled from fragments so test sources do not hold\
      \ literal paths or addresses'); plan.md line 30 (C-006, no absolute host path or e-mail in any file\
      \ this Mission authors)"
  claim: Class-A negative fixtures under contracts/tools/fixtures/ are committed files that must contain
    literal planted host paths, e-mail addresses and forbidden property names to be detected. That puts
    literal leak-shaped strings in a public repository, contradicts the fragment-assembly rule the plan
    applies to test code, and creates a directory-wide exemption in the text scan (a real leak copied
    under that directory is never reported). It also contradicts the 'empty allow-list' claim.
  remediation: Generate the leak-class fixtures at negative-test time from fragments (a small fixture-builder
    invoked by the job, writing to a temp root) and commit only the clean controls; if a committed file
    is unavoidable, exempt individual marker lines, not the directory, and have the scan assert the exempted
    count equals the committed marker count. Remove or rephrase the 'no allowlist is added' statement.
- id: PLAN-ARCH-011
  lens: Blast radius
  severity: 3
