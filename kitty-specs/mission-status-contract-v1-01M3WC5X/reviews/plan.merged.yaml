    not merely IC-07, and put the E-1 decision before IC-05 starts.'
- id: PLAN-ARCH-005
  lens: Resolver-parity and bundler fidelity
  severity: 3
  title: Parity proves less than claimed, and the resolver's required feature set is fixed before the
    contract exists
  evidence:
  - artifact: "plan.md \xA7 Decision register OQ-1 and D-P1/D-P2"
  - artifact: research.md R-1 (resolver scope), R-3
  - artifact: spec.md line 58 ({param} kept in file names) and line 268 (BAD_REF_FORM rejects URL, absolute
      and ~1 refs only)
  claim: (1) The bundle is dereferenced by the same Python resolver (in-file pointers), so parity proves
    only that the Java bundle is the split tree with refs hoisted; a resolver defect common to both sides
    (sibling keywords beside $ref, composition) cannot be seen. The plan should say so and not describe
    it as an independent check. (2) The openapi-generator output normally renames and de-duplicates components
    and may rewrite 3.1 constructs; a differing tree can be an acceptable rename, so the 'named normalisations'
    list is the real contract and needs a ceiling and review rule or it erodes into a vacuous comparison.
    (3) The resolver (IC-01) is specified before IC-02..04 write the contract, so keywords the contract
    ends up using ($defs, $anchor, discriminator, brace file names) can force resolver and parity changes
    late. (4) The layout rules do not fix the canonical spelling of a $ref to a brace-named file (percent-encoded
    versus raw), which the Python resolver, the Java parser and TypeScript tooling treat differently,
    so a first-run parity failure would be a ref-form decision, not a named normalisation.
  remediation: 'In the plan: state what parity does and does not prove; require that each normalisation
    entry names the construct, the tool behaviour and a planted test, cap the list and make growth past
    the cap a decision for the maintainers; add to the layout check a rule fixing the canonical $ref spelling
    for brace file names (decide it in the spike and test it against Python, Java and a TypeScript generator);
    and add a resolver change-control note: any contract keyword outside the OQ-1 list is added to the
    resolver and its parity fixtures in the same commit.'
