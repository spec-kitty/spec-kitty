schema: review-findings/v1
complete: true
phase: spec
findings:
- id: SPEC-GOV-001
  lens: Clarification fidelity
  severity: 4
  title: CL-2 requires the contracts workflow to run the reality check, but FR-020 offers a shape where it does not, and mislabels the release dry run as a non-change event
  evidence:
  - artifact: "spec.md \xA7 CL-2 bullet 3 ('The new path-filtered contracts workflow also runs the reality check, without running it twice')"
  - artifact: "spec.md \xA7 FR-020 'Exactly-once' ('if the plan does not [add a pytest job], the contracts workflow runs the reality check only on non-change events (the release workflow's dry run and tag\
      \ run)')"
  - artifact: "spec.md \xA7 FR-022 and OQ-2 (the dry run is also a path-filtered pull_request run)"
  - code: tests/architectural/test_no_duplicate_suite_execution.py:241 (AUTHORIZED_PER_CHANGE_SUITE_JOBS; pull_request-triggered jobs that reach pytest count as per-change)
  - code: '.kittify/charter/charter.md:91 (Standing Order 5: a transient allowlist is priced debt, prefer the empty-allowlist shape)'
  - artifact: spec.md FR-020 Exactly-once bullet (both shapes), FR-017, C-003, SC-008, FR-022 first bullet, OQ-2
  - code: tests/architectural/test_no_duplicate_suite_execution.py:241-268
  - code: tests/architectural/test_no_duplicate_suite_execution.py:374
  - artifact: "spec.md \xA7 FR-020 ('the router's corpus job deselects the test'); \xA7 FR-017 ('No existing job's needs, matrix or marker expression changes'); \xA7 C-003 and SC-008 ('adds exactly one\
      \ glob line to ci-router.yml'); \xA7 OQ-1 option (a) (a JDK and Gradle step for the corpus jobs)"
  - code: .github/workflows/ci-router.yml:710 (tests-corpus runs 'pytest -m "corpus and not windows_ci"'); .github/workflows/ci-router.yml:683 (timeout-minutes 10)
  claim: 'The binding decision is that BOTH the router corpus job and the new contracts workflow run the reality check, with exactly-once semantics. CL-2 itself then restates this as a mere invariant ("not
    a specific job layout"), and FR-020 allows a layout in which the contracts workflow never runs it on a change. That drops half of the decision. The alternative also contradicts FR-022/OQ-2: the release
    dry run is specified as a path-filtered pull_request run, which the duplicate-suite gate treats as change-triggered, so it is NOT a "non-change event" and would need its own AUTHORIZED_PER_CHANGE_SUITE_JOBS
    row (priced debt under the charter) or would double-run the test.

    '
  remediation: 'State in CL-2/FR-020 which single job is the blocking per-change home and that the contracts workflow also exercises the test (for example by running it as the dry-run/contracts job while
    the router corpus job deselects that node id, or the reverse). Remove the "only on non-change events" sentence or correct it to account for the pull_request-triggered dry run. If an AUTHORIZED_PER_CHANGE_SUITE_JOBS
    row is added, require an owner, rationale and exit condition per Standing Order 5.

    '
  merged_ids:
  - SPEC-ARCH-002
  - SPEC-VERIFY-007
  refute_reason: CL-2 bullet 3 requires the contracts workflow to run the reality check, FR-020's second shape has it run only on "non-change events (dry run)", yet FR-022 makes the dry run a path-filtered
    pull_request run, a real internal contradiction.
- id: SPEC-GOV-002
  lens: Directive
  severity: 4
  title: The markdown-lint acceptance criterion contradicts the Node-free constraint, and the only existing markdown lint job is advisory
  evidence:
  - artifact: "spec.md \xA7 FR-001 ('A markdown lint of the README and both CHANGELOG.md files passes under the repository's .markdownlint-cli2.jsonc'), \xA7 FR-024, \xA7 NFR-007"
  - artifact: "spec.md \xA7 CL-6 and C-005 (no Node, npm, npx anywhere in tooling, workflows or tests); CL-10 (silent success forbidden)"
  - code: '.github/workflows/ci-router.yml:425 (run: npx --yes markdownlint-cli2 "**/*.md" || true)'
  - artifact: spec.md FR-001 second bullet, FR-024, C-005, FR-017 (no npx/npm/yarn/pnpm in workflow)
  - code: .github/workflows/ci-router.yml:418-425
  - code: .markdownlint-cli2.jsonc:1-10
  claim: 'markdownlint-cli2 is a Node tool. The only place this repository runs it is the router''s markdownlint job, which uses npx and ends in "|| true", so it can never fail. The criterion is therefore
    either unsatisfiable under C-005 (a new Node step) or vacuously satisfied by a job that cannot go red, which is exactly the silent success CL-10 forbids.

    '
  remediation: 'Either carve an explicit, narrow exception to C-005 for a pinned markdownlint step in the contracts workflow (with checksum or lockfile pin, fail-loud, a planted-violation proof per FR-021),
    or replace the criterion with a Node-free structural check of the README and CHANGELOG headings and drop the claim that the repository''s markdownlint config is enforced. Do not rely on the existing
    advisory job as evidence.

    '
  merged_ids:
  - SPEC-ARCH-017
  refute_reason: FR-001 requires a markdownlint pass while C-005 bans npx/Node, and the only existing markdownlint job (ci-router.yml:425) is "npx ... || true", so the criterion is unsatisfiable or vacuous.
- id: SPEC-GOV-003
  lens: Directive
  severity: 4
  title: Reality check and contract pin primary-checkout reads and a snapshot count that the ADR's single read surface and a reproducible reducer defect make wrong
  evidence:
  - artifact: "spec.md \xA7 D-4 (wpTotal = len(snapshot.work_packages)), \xA7 D-5, \xA7 Edge Cases 'Field absent from real data' (many Missions have no log on the primary checkout and read as draft), \xA7\
      \ FR-019 (floors: at least 3000 work packages), \xA7 SC-002"
  - code: 'docs/adr/4.x/2026-10-01-2-mission-status-read-api-and-dashboard-extraction.md:103-114 (D-3: the API composes existing read models and never re-derives them; every read goes through the coordination-aware
      read surface MissionStatus.load / _read_path_resolver, callers never rebuild paths)'
  - code: src/specify_cli/status/aggregate.py:194 and :340 (MissionStatus.load uses the _read_path_resolver)
  - code: src/specify_cli/status/reducer.py (no handling of WPCreated or TasksCompleted rows; 218 committed event logs contain WPCreated)
  - artifact: spec.md FR-019 floors, SC-002, D-4, Edge Cases (event-less WP reads null status lane), catalogue rows wpTotal / workPackages / title
  - code: src/specify_cli/status/progress.py:201
  - code: src/specify_cli/dashboard/scanner.py:707
  claim: 'Verified on this checkout: calling materialize_snapshot on the 218 Missions whose logs hold WPCreated rows gives a snapshot whose work package count differs from the number of tasks/WP*.md files
    in 20 of them (several give 0 for 3 to 8 files). Across the corpus the snapshot yields 2936 work packages against 3019 WP files, below the FR-019 / SC-002 floor of 3000. The spec explains mismatches
    as "a work package with a file but no events", but here the events exist and the reducer drops them. D-4 and D-5 then pin the defective numbers (and the primary-only "draft" reading of coordination
    Missions) as v1 behaviour. This also departs from the charter''s single-canonical-authority principle and ADR D-3, which route status through the coordination-aware surface rather than materialising
    from the primary directory. The 3125-file figure quoted as survey data does not match this checkout (3019).

    '
  remediation: 'Make the reality check read through MissionStatus.load (or state in the plan why not, recorded against ADR D-3). Record the reducer gap as a known pre-existing defect with a public upstream
    issue (charter Pre-existing Failure Reporting Rule) and either derive wpTotal from a source that survives it or pin it explicitly and keep the floor honest (set floors from counts re-measured at implement
    time, not survey time). Add an AC that the reality check asserts wpTotal equals the WP file count or names each exception.

    '
  merged_ids:
  - SPEC-ARCH-009
  refute_reason: Reproduced on this checkout - reducer.py has no WPCreated handling, 20 of 218 WPCreated-bearing logs give a snapshot WP count different from the tasks/WP*.md count, and ADR D-3 requires
    reads via MissionStatus.load (the 3019 vs 3125 figure is wrong, 3125 matches, but the core claim holds).
- id: SPEC-GOV-004
  lens: Terminology
  severity: 3
  title: The spec coins "execution lane" and says no glossary term exists, but the glossary already defines "code lane" and "repo-root lane"
  evidence:
  - artifact: "spec.md \xA7 Terminology ('execution lane is not yet a glossary term'), \xA7 R-9, \xA7 C-007"
  - code: docs/context/topology.md:41 (### Repo-root lane) and :54 (### Code lane), plus :24 and :50 cross-links to the Lane term
  - code: docs/architecture/execution-lanes.md (existing prose use of the phrase)
  claim: 'The repository glossary already separates the status meaning (Lane) from the execution meaning (code lane; repo-root lane for single_branch). The spec introduces a third name, "execution lane",
    defined as whatever lanes.json holds, which spans both glossary terms. R-9''s mitigation ("adding the glossary term is out of scope") is therefore based on an incomplete glossary check, and the contract/README
    will teach a term the glossary does not use.

    '
  remediation: 'Use the glossary vocabulary (code lane, repo-root lane) in the spec, README and contract descriptions; keep "execution lane" only as a stated umbrella phrase tied to docs/architecture/execution-lanes.md,
    or drop it. Update R-9 and C-007 to record that the glossary was checked and which terms were found.

    '
  refute_reason: docs/context/topology.md defines "Repo-root lane" and "Code lane" glossary terms, contradicting the spec's R-9/Terminology claim that the glossary only has the status meaning of lane.
- id: SPEC-GOV-006
  lens: Clarification fidelity
  severity: 3
  title: CL-10 and the CL-2 gate analysis are presented as binding maintainer decisions but are author or charter derivations, and CL-1 to CL-4 have no public provenance
  evidence:
  - artifact: "spec.md \xA7 Clarifications preamble ('binding maintainer and design decisions ... fixed before this spec was written'), CL-10, CL-2 numbered list 1-4"
  - artifact: "spec.md \xA7 C-006 (no reference to a private discussion)"
  - code: 'issue #5558 body and the design comment on #5528 (read via gh): neither contains the draft-until-acknowledged rule, the tag name, the corpus-marker placement or the dry-run decision; the only
      comment on #5558 is a claim line'
  claim: 'The issue and the design comment carry the design (layout, tooling, slice, vocabularies, leak rules) but not Q1-Q4. CL-1..CL-4 are attributed to the maintainer with no public place a reader can
    verify them, which conflicts with the spirit of C-006. CL-10 (silent success is forbidden) and the four-point analysis of what the architectural gates demand are the spec author''s reading of the charter
    and code, yet sit inside the "not options for a reviewer to re-litigate" block, which shields author choices from review.

    '
  remediation: 'Link the public source for each of CL-1..CL-4 (post them as a comment on #5558 or #5528 and cite it) or label them as author-proposed pending acknowledgement. Move CL-10 and the CL-2 gate
    analysis to the derived decisions (D-n) or cite Standing Order 5 / the non-vacuity doctrine as their authority.

    '
  refute_reason: Issue
- id: SPEC-GOV-007
  lens: Clarification fidelity
  severity: 3
  title: WP history exposes annotation entries although D-8 withholds annotation rows from the event stream as free-text and leak-prone
  evidence:
  - artifact: "spec.md \xA7 Contract Field Catalogue, Work package row 'history' (kind: transition, annotation, lifecycle; reason; deltaKeys)"
  - artifact: "spec.md \xA7 D-8 ('Annotation and retrospective rows are not exposed in v1'), \xA7 D-9, \xA7 CL-8 (no absolute paths or e-mail addresses)"
  claim: 'The two derived decisions contradict each other: annotation rows are excluded from events because they carry free-text notes and absolute record paths, but the work package history array lists
    annotation as a kind with a free-text reason. An implementer cannot tell which wins, and the leak guarantee in CL-8 depends on it.

    '
  remediation: 'Pick one: remove "annotation" (and "lifecycle" if it carries retrospective rows) from the history kinds in v1, or define a projected annotation shape with no free text and add it to D-8.
    Update FR-006 to name the history kinds and the leak scan coverage.

    '
  refute_reason: The catalogue's WP history kind list includes annotation with a free-text reason while D-8/D-9 withhold annotation rows as leak-prone free text, and FR-006 does not resolve which wins.
- id: SPEC-GOV-010
  lens: Clarification fidelity
  severity: 2
  title: D-10 actor projection adds a model handle and a tool handle beyond the binding "agent, profile and role handles"
  evidence:
  - artifact: "spec.md \xA7 CL-8 ('Actors are agent, profile and role handles') vs \xA7 D-10 ({tool, role, profile, model})"
  claim: 'The binding wording names three handles. D-10 projects four, including model, which is also a place the status domain has recorded identifying strings. This quietly widens the exposed surface
    relative to the decision.

    '
  remediation: 'Either restrict the projection to the three named handles, or record in D-10 that tool is the agent handle and that model is an addition requested for review, with the leak scan and the
    null-on-mismatch rule applying to it explicitly.

    '
  refute_reason: CL-8 binds "agent, profile and role handles" while D-10 projects {tool, role, profile, model}, so model is a real unrecorded widening of the exposed surface.
- id: SPEC-GOV-011
  lens: Terminology
  severity: 2
  title: Mission phase collides with the glossary term phase, and two glossary surfaces disagree on the lane list
  evidence:
  - artifact: "spec.md \xA7 Terminology ('Mission phase', 'Phase label'), \xA7 FR-005"
  - code: '.kittify/glossaries/spec_kitty_core.yaml:358 (phase: grouping container for mission primitives, not the enforcement unit)'
  - code: .kittify/glossaries/spec_kitty_core.yaml:203 (lane lists nine states) versus docs/context/orchestration.md:166 (Lane lists seven, applicable 1.x/2.x)
  claim: 'The glossary''s phase means a grouping container for mission primitives; the contract''s phases are the five workflow steps. The spec defines its own meaning without noting the clash. Separately,
    the spec''s claim that the glossary lane term lists the nine values is true only of one of two glossary surfaces; the docs/context page that feeds the Contextive files lists seven.

    '
  remediation: 'Name the glossary conflict in the Terminology section and either rename the contract concept (for example workflowSteps) or define it explicitly as distinct from glossary phase. State which
    glossary surface is canonical for lane and cite the stale one as a known drift rather than as agreement.

    '
  refute_reason: spec_kitty_core.yaml (line 359) defines phase as a grouping container, the spec's Mission phase meaning clashes without naming it, and docs/context/orchestration.md:166 lists seven lanes
    against nine in the glossary.
- id: SPEC-ARCH-001
  lens: CI-gate interplay
  severity: 4
  title: Exactly-once invariant ignores packs.yml, which also runs the whole corpus marker per change
  evidence:
  - artifact: spec.md CL-2 (required end state), FR-019 last bullet, FR-020 Exactly-once bullet, SC-007
  - code: .github/workflows/packs.yml:155-182
  - code: .github/workflows/packs.yml:40-43
  - code: .github/workflows/packs.yml:74
  - code: .github/workflows/ci-router.yml:680-710
  - code: tests/architectural/test_no_duplicate_suite_execution.py:262-266
  claim: The spec says the reality check must run in exactly one blocking per-change job on any change touching contracts/**, and names only the router tests-corpus job. packs.yml job built-in-corpus-suite
    also runs `pytest -m "corpus and not windows_ci"` over the whole tree (no directory filter). Its `built_in` output is forced true on every push to main and in full mode, and is true on PRs touching
    packs/built-in/**, tests/doctrine/** and other listed paths. So a corpus-marked test already executes in two per-change jobs on every push to main (router tests-corpus plus packs built-in-corpus-suite),
    and on any mixed PR. Both jobs are authorised in the duplicate-execution ledger. The CL-2 invariant "never two" is therefore unachievable as written for push events and mixed diffs. FR-019 ("a real
    verdict in every job that selects the corpus marker, including jobs with no JVM") also silently omits this second JVM-less, --cov=src/doctrine job.
  remediation: Scope the invariant to what is achievable and testable, for example "on a pull_request diff that touches contracts/** and no packs lane path, the test id executes in exactly one blocking
    job (router tests-corpus)". State explicitly that packs.yml built-in-corpus-suite and push-to-main runs also collect the module by design, and that the module must therefore pass in both jobs (no JVM,
    --cov=src/doctrine). Update the FR-020 evidence step to list every job whose pytest expression selects `corpus` (router tests-corpus and packs built-in-corpus-suite) and to verify them with collect-only.
  refute_reason: packs.yml built-in-corpus-suite runs pytest -m "corpus and not windows_ci" over the whole tree and is forced on for every push to main, so CL-2 and SC-007 "exactly one blocking per-change
    job" are unachievable as written and the spec never mentions this job.
- id: SPEC-ARCH-003
  lens: CI-gate interplay
  severity: 3
  title: 'Hidden per-workflow gates not named: fork guard, fleet verdict, workflow-count ceiling'
  evidence:
  - artifact: spec.md FR-017, FR-022, CL-2 point 3 (names only test_workflow_coherence / WORKFLOW_FILES)
  - code: tests/ci/test_fork_guard.py:34
  - code: tests/ci/test_fork_guard.py:65
  - code: scripts/ci/fleet_verdict.py:37-47
  - code: .github/workflows/ci-fleet-verdict.yml:5
  - code: tests/architectural/test_module_shard_registry.py:403-410
  - code: .github/ci-module-registry.yml:11
  claim: (a) test_fork_guard parametrises over every workflow file whose triggers include schedule, push or workflow_run, and requires a canonical fork guard conjunct on each root job unless the file is
    in EXEMPT_WORKFLOWS. FR-017 (push to main) and FR-022 (tag push) create two such workflows; the spec never requires the guard or an exemption, so tests/ci goes red in the same PR. (b) The fleet verdict
    only observes the workflows in PR_WORKFLOWS and the workflow_run list; neither the contracts workflow nor the release workflow is in them, so a red contracts check never produces the PR verdict comment
    or main-red issue, and it is not in router-gate. FR-017 calls the checks protective but does not say whether they are meant to be visible to the fleet verdict. (c) test_reusable_workflow_ceiling_respected
    counts all *.yml files against a ceiling of 20; 17 exist today, so two new files leave one slot, and open CI PRs may consume it.
  remediation: 'Add to FR-017/FR-022: root jobs carry the repository fork-guard conjunct (or the release workflow is added to EXEMPT_WORKFLOWS with a reason, as release.yml is), pinned by the existing guard.
    Decide and state whether contracts.yml is added to PR_WORKFLOWS and the fleet-verdict workflow_run list (a trusted default-branch edit, so record it as a post-merge close-out step) or is deliberately
    advisory. Record the workflow-file count (19 of 20) in the plan and re-verify after rebasing on #5545 and #5557.'
  refute_reason: test_fork_guard requires a guard on every push/schedule/workflow_run workflow outside EXEMPT_WORKFLOWS (only release.yml), spec.md never mentions fork guards, PR_WORKFLOWS excludes the
    new files, and 17 workflow files exist against a ceiling of 20.
- id: SPEC-ARCH-004
  lens: CI-gate interplay
  severity: 3
  title: pytest.ini marker AC is already satisfied (vacuous); the corpus-glob mirror claim is false
  evidence:
  - artifact: spec.md CL-2 point 1, FR-020 second bullet, SC-008
  - code: pytest.ini:86
  - code: tests/architectural/test_ci_corpus_trigger_completeness.py:64-76
  - code: tests/architectural/test_ci_corpus_trigger_completeness.py:204-208
  - code: tests/release/ci_retirement_scrub.json:277-290
  - code: .github/workflows/ci-router.yml:177-187
  claim: 'The corpus marker description in pytest.ini already contains the literal text `contracts/**` (it refers to the kitty-specs mission contracts leaf). The AC "pytest.ini''s corpus marker description
    names contracts/**" is therefore passable by a no-op, and after the edit the same token would mean two different trees. Separately, the spec says _CORPUS_GLOBS must "stay a faithful mirror of the router".
    It is not one today: _CORPUS_GLOBS lists .kittify/release/downstream-verified.json, which the router filter does not, and no test compares the set with the router. The only mechanical check is the data-root
    prefix test, so the "documented glob set" edit is unenforced. The router corpus group is also transcribed in ci_retirement_scrub.json under non_src_router_groups.corpus, a third unreferenced mirror
    that SC-008 ("exactly one glob line") does not account for.'
  remediation: Reword the AC to a checkable string, for example the description must contain "top-level contracts/**" and "kitty-specs/**/contracts/**" as distinct tokens. Drop the "faithful mirror" claim,
    or add a router-versus-_CORPUS_GLOBS equality assertion (reading the router through scripts/ci/gate_selection.py) in the same PR, reconciling downstream-verified.json. Decide explicitly whether ci_retirement_scrub.json
    non_src_router_groups.corpus gets the same glob (it is not gated, so say it is documentation only) and amend SC-008 accordingly.
  refute_reason: pytest.ini line 86 already contains contracts/** so the AC is vacuous, and _CORPUS_GLOBS includes downstream-verified.json while no test compares it to the router.
- id: SPEC-ARCH-005
  lens: CI-gate interplay
  severity: 2
  title: Corpus registry detection is a single-line regex; helper tests also each need a registry row
  evidence:
  - artifact: spec.md CL-2 first bullet ('module-level pytestmark entry or a decorator'), FR-020 last bullet, NFR-007
  - code: tests/architectural/test_ci_corpus_trigger_completeness.py:223-226
  - code: tests/architectural/test_ci_corpus_trigger_completeness.py:246-258
  claim: _CORPUS_MARK_APPLICATION_RE matches `pytestmark = ...pytest.mark.corpus` only when both appear on the same line. A multi-line `pytestmark = [` list (a normal formatter result once a list grows)
    is not detected, so the registry equality test reports the module as missing from disk even though it is marked. The spec allows "a module-level pytestmark entry" without this constraint. The last FR-020
    bullet also says any new test in tests/contract carries corpus, which means every helper unit-test module added for NFR-007 must also be added to _CORPUS_MARKED_MODULES.
  remediation: State that the marker is applied as a single-line `pytestmark = [pytest.mark.contract, pytest.mark.corpus]` (as tests/contract/test_example_round_trip.py does) or by decorator, and that every
    new tests/contract test module, including helper-unit tests, is added to the registry in the same change. Verify with the named gate file run.
  refute_reason: The regex has no DOTALL and needs pytestmark and pytest.mark.corpus on one line, so a multi-line list is missed, and the spec states no such constraint.
- id: SPEC-ARCH-006
  lens: CI-gate interplay
  severity: 2
  title: NFR-001 ignores the 240 s per-test timeout and a single-worker loadfile run
  evidence:
  - artifact: spec.md NFR-001, FR-019 (one test over every Mission)
  - code: pytest.ini:35
  - code: tests/architectural/test_pytest_ini_timeout_default.py:1-12
  - code: .github/workflows/ci-router.yml:680-710
  claim: The reality check measures at most 120 s and is "not asserted inside the test", but pytest.ini carries a hard per-test timeout of 240 s (pinned by a gate). If the test is one function looping over
    538 Missions, it runs on one xdist worker under --dist loadfile beside about 1400 other corpus tests on a 10 minute job, with only 2x margin to the per-test ceiling. Corpus growth or a slow runner turns
    into a timeout that names no Mission.
  remediation: Require one parametrised test case per Mission (also what FR-019's failure message naming needs), or an explicit per-test timeout mark with a recorded rationale. Record the measured runtime
    against the 240 s ceiling, not only the job timeout.
  refute_reason: pytest.ini sets timeout=240, and FR-019/NFR-001 describe one test over every Mission with only a job-timeout headroom check and no per-test budget.
- id: SPEC-ARCH-007
  lens: CI-gate interplay
  severity: 3
  title: NFR-007 90 percent coverage of test-helper code has no measurement path
  evidence:
  - artifact: spec.md NFR-007, FR-019 (helper under tests/contract/)
  - code: pyproject.toml:2937-2944
  - code: .github/workflows/ci-aggregate.yml:290-291
  - code: .github/workflows/ci-router.yml:710
  claim: The repository's coverage tooling measures src (the coverage paths map src/, the diff-cover gate scores changed critical-path lines from module shards, and the router corpus job runs without --cov).
    A helper under tests/contract/ is outside every measured subject, so "line and branch coverage of at least 90 percent of the new test-helper code" cannot be shown by any existing job, and the spec names
    none.
  remediation: 'Name the measurement (for example a non-blocking `pytest --cov=<helper package> --cov-branch --cov-fail-under=90` step run locally and its output pasted in the PR) or replace the AC with
    checkable behaviour: every projection helper function has a direct unit test, and the planted positive and negative controls of FR-019 exercise each branch.'
  refute_reason: Coverage config maps only src/ and NFR-007 names no job that measures tests/contract helper coverage.
- id: SPEC-ARCH-010
  lens: Data-shape grounding
  severity: 3
  title: lifecycleStatus is specified over nine lanes but the existing derivation is a five-column, file-count one
  evidence:
  - artifact: spec.md D-5, D-4, CL-8 (no grouping), FR-019 (uses 'the lifecycle derivation')
  - code: src/specify_cli/dashboard/scanner.py:36-46
  - code: src/specify_cli/dashboard/scanner.py:219-246
  - code: src/specify_cli/dashboard/scanner.py:681-725
  claim: D-5 says lifecycleStatus "re-expresses the existing derivation over the nine-status-lane counts with unchanged semantics, quirks included". The existing function takes kanban_stats, whose columns
    come from _KANBAN_COLUMN_FOR_LANE (claimed and in_progress become doing, in_review becomes for_review, blocked becomes planned, canceled becomes done) and whose total counts tasks/WP*.md files with
    a non-genesis lane, not snapshot work packages. Re-expressing it over statusLaneCounts is a different function wherever the file set and the snapshot set differ (214 and 29 work packages here), so "unchanged
    semantics" is false, and the column mapping that CL-8 keeps out of the contract is in fact required to state the rule.
  remediation: Write the derivation in the schema description as an explicit rule over statusLaneCounts (which lanes count as active, planned and terminal) and state the input set (snapshot, per D-4). Then
    require the reality check to compare lifecycleStatus with the scanner's derivation only on Missions where file and snapshot sets agree, and list the Missions where they disagree as a documented, counted
    difference rather than silently different behaviour.
  refute_reason: _derive_mission_status takes kanban_stats built from WP*.md files via _KANBAN_COLUMN_FOR_LANE, not snapshot lane counts, so D-5's "unchanged semantics" over statusLaneCounts is not literally
