findings:
  - id: PLAN-ARCH-001
    lens: "UI early-start claim"
    severity: 4
    title: "IC-04 'stable enough to generate a TypeScript client' is asserted before any validator, content check or client generator has ever read the split contract"
    evidence:
      - artifact: "plan.md § UI early-start point, items 1-3 and 'Earlier partial points'"
      - artifact: "plan.md § Implementation Concern Map (IC-05, IC-07, IC-08 depend on IC-04 or run after it; IC-08 is the first real execution of the workflows, risk P-8)"
      - artifact: "spec.md line 58 (path files named missions_{missionId}.yaml, braces kept) and plan.md § Source code tree (contracts/_shared/ referenced from contracts/mission-status/, _index.yaml registries)"
      - artifact: "research.md R-3 (3.1 constructs may not survive the Java toolchain; spike is CI-only)"
    claim: "At the last commit of IC-04 the only things that have touched the contract are the Python resolver (refs) and the examples test. citation_check, provisional_check, enum_pin_check, leak_scan (IC-05), the 3.1 validator and vacuum lint (IC-07/IC-08) and the whole-corpus reality check (IC-09) have not run, and any of them can force schema changes. Item 3 ('a multi-file-capable generator can be generated straight from the split files') is never exercised by any step in the plan. Unproven risk factors in the planned layout: unescaped braces in $ref file names, chained refs through _index.yaml, refs that leave the module directory into ../_shared/, path-item $ref in the root paths map, and OpenAPI 3.1 type arrays and sibling keywords beside $ref, which many TypeScript generators handle partially. The plan names no generator and no smoke test, yet tells an external team this commit is generatable."
    remediation: "Either (a) move the advertised early-start point to the first commit after the contracts workflow has been green on the draft PR (validate-bundle, lint, example and citation checks), or (b) keep the IC-04 marker but label it 'unvalidated preview, no stability promise' and add an exit criterion to IC-04 (resolver round-trip plus example_check green). In both cases add a CI-only client-smoke step to the IC-07 spike that runs an openapi-generator typescript generator (Java, so Node-free, C-005 holds) against the SPLIT root and records the result, and pin the canonical $ref spelling for brace file names (see PLAN-ARCH-005)."
  - id: PLAN-ARCH-002
    lens: "UI early-start claim"
    severity: 3
    title: "'Only additive or nullability-relaxing changes after the early-start point' is incoherent with the plan's own breaking-change gate, unenforced, and exposed to CL-1"
    evidence:
      - artifact: "plan.md § UI early-start point, last paragraph ('additive or a nullability relaxation, never a removal or rename')"
      - artifact: "plan.md § Contracts table row 'contracts/mission-status/ v1' and gate table row 'Breaking-change diff' (first release is the one allowed no-baseline state; D-P6)"
      - artifact: "spec.md CL-1 / plan.md § Branch contract (PR is a draft until a maintainer acknowledges the design)"
    claim: "(1) Making a response property optional or nullable changes a generated TypeScript type (T becomes T | null or optional) and is classified as breaking by oasdiff once a baseline exists, so the allowed change class is exactly what the plan's own gate would fail after v1.0.0; the promise protects consumers less than it reads. (2) Nothing in the plan checks the promise between the IC-04 commit and the IC-09 commit, because breaking_check has no baseline before the first tag. (3) CL-1 means the maintainers can still request structural changes at acknowledgement, which the promise forbids; the plan does not say which wins."
    remediation: "Reword the promise as a process commitment with an explicit exception ('unless the #5528 acknowledgement requests otherwise'), say that nullability relaxation is breaking for generated clients and will be flagged in the module CHANGELOG under a 'pre-release shape change' heading, and make it checkable: record the early-start commit as a pre-release reference and have the draft-PR breaking-change job print (informational, not gating) an oasdiff report against it. Pin consumers to the IC-09 point, as the plan already says, and say the IC-04 point carries no compatibility promise."
  - id: PLAN-ARCH-003
    lens: "UI early-start claim"
    severity: 3
    title: "The early-start commit hash recorded for the UI team will not survive the plan's own re-sync and history-collapse steps"
    evidence:
      - artifact: "plan.md § UI early-start point ('The commit hash ... is recorded in tracer-approach.md ... offered to the UI team on #5528') and E-3"
      - artifact: "plan.md § Upgrade chain, migration impact and reflexivity item 6 (rebase onto current main, then the compact-history step of mission-wrap-up-sequence, again at PR prep)"
    claim: "The plan hands an external team a branch commit hash while also planning two history-rewriting steps (rebase, compact-history). After either, the hash is unreachable on the branch, or reachable only through reflog or an abandoned remote ref, so a UI team that pinned it loses its reference."
    remediation: "Publish the early-start and pin-grade points as immutable refs that survive the rewrite, for example a lightweight tag in a non-release namespace that the breaking-change tag listing does not match (not contract-<module>-v<semver>), or a copy of the split tree attached to the draft PR. Record the recorded-hash caveat in E-3, and re-publish the point after the compact-history step."
  - id: PLAN-ARCH-004
    lens: "Resolver-parity and bundler fidelity"
    severity: 4
    title: "The bundler-fidelity spike (and the whole JVM toolchain) is scheduled before the workflow that can execute it exists"
    evidence:
      - artifact: "research.md R-3 ('bundle it in the contracts workflow on the draft PR'; 'first task of IC-07')"
      - artifact: "plan.md § Implementation Concern Map (IC-07 'CI-only feedback loop'; IC-08 owns contracts.yml and depends on IC-07), risk P-1, P-2, decision E-1 ('The spike is the first task of WP07 so the question is answered early')"
    claim: "IC-07 can only get feedback from CI, but contracts.yml is authored in IC-08, which depends on IC-05, IC-06 and IC-07. No job exists to run the spike, validate, bundle, lint, oasdiff or parity during IC-07. E-1 is therefore not answered 'early', and a negative outcome (3.1 constructs rewritten) arrives after IC-01 (resolver) and IC-05 (every content check, built on the resolver tree) are done, which is the rework the escalation was meant to avoid."
    remediation: "Split the workflow: make a minimal contracts.yml skeleton (validate-bundle plus resolver-parity over a spike module, with the fork guard and SHA pins) the first deliverable of IC-07, or move the skeleton to IC-01 so the router and fleet edits and the first push exercise it early, and keep IC-08 for the remaining jobs, guards and negative-tests. State in the plan that the spike result gates IC-05, not merely IC-07, and put the E-1 decision before IC-05 starts."
  - id: PLAN-ARCH-005
    lens: "Resolver-parity and bundler fidelity"
    severity: 3
    title: "Parity proves less than claimed, and the resolver's required feature set is fixed before the contract exists"
    evidence:
      - artifact: "plan.md § Decision register OQ-1 and D-P1/D-P2"
      - artifact: "research.md R-1 (resolver scope), R-3"
      - artifact: "spec.md line 58 ({param} kept in file names) and line 268 (BAD_REF_FORM rejects URL, absolute and ~1 refs only)"
    claim: "(1) The bundle is dereferenced by the same Python resolver (in-file pointers), so parity proves only that the Java bundle is the split tree with refs hoisted; a resolver defect common to both sides (sibling keywords beside $ref, composition) cannot be seen. The plan should say so and not describe it as an independent check. (2) The openapi-generator output normally renames and de-duplicates components and may rewrite 3.1 constructs; a differing tree can be an acceptable rename, so the 'named normalisations' list is the real contract and needs a ceiling and review rule or it erodes into a vacuous comparison. (3) The resolver (IC-01) is specified before IC-02..04 write the contract, so keywords the contract ends up using ($defs, $anchor, discriminator, brace file names) can force resolver and parity changes late. (4) The layout rules do not fix the canonical spelling of a $ref to a brace-named file (percent-encoded versus raw), which the Python resolver, the Java parser and TypeScript tooling treat differently, so a first-run parity failure would be a ref-form decision, not a named normalisation."
    remediation: "In the plan: state what parity does and does not prove; require that each normalisation entry names the construct, the tool behaviour and a planted test, cap the list and make growth past the cap a decision for the maintainers; add to the layout check a rule fixing the canonical $ref spelling for brace file names (decide it in the spike and test it against Python, Java and a TypeScript generator); and add a resolver change-control note: any contract keyword outside the OQ-1 list is added to the resolver and its parity fixtures in the same commit."
  - id: PLAN-ARCH-006
    lens: "Dashboard re-verification"
    severity: 3
    title: "Plan section (l) cites MissionIdentity as the source of friendly_name, acceptedAt, mergedAt and discardedAt, but MissionIdentity has none of those fields"
    evidence:
      - artifact: "plan.md § Dashboard references re-verified (l), row 'scanner.py friendly-name fallback ...' ('friendly_name ... (the MissionIdentity field)'; 'acceptedAt, mergedAt, discardedAt: the stamping functions and MissionIdentity fields')"
      - code: "src/specify_cli/mission_metadata.py:107 (MissionIdentity: mission_slug, mission_number, mission_type, mission_id only)"
      - code: "src/specify_cli/mission_metadata.py:59 (friendly_name is a key of MissionMetaRequired)"
      - code: "src/specify_cli/mission_metadata.py:72 (accepted_at) and :78 (merged_at) are MissionMetaOptional keys; discarded_at is only stamped at :706-730 and is not declared in either TypedDict"
    claim: "The citation check (FR-010, PQ-10) fails on a cited symbol that does not resolve. An implementer who follows the plan and writes x-source MissionIdentity.friendly_name (or .accepted_at) produces a citation that cannot resolve, or cites a different symbol from the plan's, which defeats the 'surviving source' substitution the table was written to give."
    remediation: "Correct the table: cite MissionMetaRequired (friendly_name), MissionMetaOptional (accepted_at, merged_at) and the discard stamp function in mission_metadata.py (name the function, line 706 area), and note that discarded_at is undeclared in the TypedDicts (the contract's x-derived or x-source must say it is read from the raw meta mapping through load_meta). Re-run a symbol grep for every row of (l) before the artifact is frozen."
  - id: PLAN-ARCH-007
    lens: "Dashboard re-verification"
    severity: 2
    title: "WPView.subtasks does not exist; subtasks live on WPView.resolved and WPView.authored with different types, and the 'seven lifecycle constants' are a subset of a twelve-member set"
    evidence:
      - artifact: "plan.md § (l) ('subtaskProgress: x-derived from the subtasks mapping in WPView'; 'the seven lifecycle event type constants (SPECIFY_STARTED and siblings)')"
      - code: "src/specify_cli/status/wp_view.py:85 (ResolvedGroup.subtasks Mapping[str, str]) and :132 (AuthoredGroup.subtasks tuple[str, ...]); WPView at :139 has only wp_id, resolved, authored"
      - code: "src/specify_cli/status/lifecycle_events.py:107-122 (LIFECYCLE_EVENT_TYPES has twelve members)"
      - artifact: "data-model.md line 47 ('The seven lifecycle event type constants are in lifecycle_events.py')"
    claim: "No class named WPView carries a subtasks attribute, so a class-plus-attribute citation fails; the two real attributes differ (an event-sourced status mapping versus an authored id tuple) and the plan does not say which feeds subtaskProgress. For the event stream the allow-list of seven (spec lines 310, 577) is a new set owned by the helper, not a constant in lifecycle_events.py, so a lifecycle type added to src later is silently dropped by design with no check noticing."
    remediation: "Cite ResolvedGroup.subtasks (and say which of the two is the done/total source). For the allow-list, say it is contract-owned, name the seven constants (MISSION_CREATED, SPECIFY_STARTED, SPECIFY_COMPLETED, PLAN_STARTED, PLAN_COMPLETED, TASKS_STARTED, TASKS_COMPLETED), and have event_mapping_check or the reality check print LIFECYCLE_EVENT_TYPES minus the allow-list so a new upstream type is a visible, deliberate drop."
  - id: PLAN-ARCH-008
    lens: "Dashboard re-verification"
    severity: 2
    title: "The spec's field catalogue still cites the deleted scanner as live evidence; the correction exists only in a plan table"
    evidence:
      - artifact: "spec.md lines 521, 531, 532, 537, 551, 559, 570 (specify_cli/dashboard/scanner.py:NNN citations); spec.md R-2"
      - artifact: "plan.md § (l) (corrections), research.md line 94 ('No contract citation may point at a path that git ls-files does not list')"
      - code: "src/specify_cli/dashboard/ is on disk but git ls-files lists zero files there (untracked residue); git show d78aa2345:src/specify_cli/dashboard/scanner.py resolves and still defines _derive_mission_status, _derive_next_action, get_workflow_status, build_mission_registry, scan_all_features"
    claim: "The task generator and implementers read spec.md first; seven catalogue rows still point at a removed module. The plan states the substitutions but does not declare the table authoritative over the spec rows, so a work package can copy a dangling citation. The untracked residue directory also lets a naive os.path.exists check pass for a deleted path; the plan relies on git ls-files, which is right, and should require it."
    remediation: "Add one sentence to plan (l): 'this table supersedes every spec.md catalogue row that cites specify_cli/dashboard/; tasks and WPs cite the corrected source'. Require citation_check to test existence by git ls-files (not the filesystem), with a planted fixture that points at the untracked dashboard residue."
  - id: PLAN-ARCH-009
    lens: "Blast radius"
    severity: 3
    title: "The router selects tests-corpus on the wrong triggers for a test that reads meta.json and status.events.jsonl; the plan states the reverse risk only"
    evidence:
      - artifact: "plan.md § Reflexivity item 2 and item 5; Gate set row 'Corpus-trigger completeness'"
      - code: ".github/workflows/ci-router.yml:174-183 (corpus group lists kitty-specs/**/spec.md, plan.md, tasks/**, contracts/**, acceptance-matrix.json only)"
      - code: "tests/architectural/test_ci_corpus_trigger_completeness.py:78-80 ('Never add bare kitty-specs/** or status.events.jsonl (C-001) -- that would fire on routine WP status-event churn')"
    claim: "The reality check reads every Mission's meta.json, status.events.jsonl and tasks/WP*.md, but by design a commit touching only meta.json or status.events.jsonl (every status transition) does not select tests-corpus. The plan reasons that a stranger's data defect can redden a PR that touches corpus paths; the larger exposure is that a data defect committed by a status-only change merges unchecked and surfaces on the push-to-main run of built-in-corpus-suite, or on the next unrelated corpus-selected PR, attributed to the wrong author. Only reader drift is acknowledged (item 5), not data drift on the unrouted files."
    remediation: "Add this to Reflexivity as an accepted, named risk (R-14 sibling) with its detection point (push-to-main built-in-corpus-suite, nightly) and make the triage rule explicit: a red naming a Mission the PR does not touch is classified first, and the first-red on main is routed to the Mission's owner, not the PR author. Do not widen the router globs (C-001 in the completeness test). In the PR body list the data files the check reads that the router does not select."
  - id: PLAN-ARCH-010
    lens: "Blast radius"
    severity: 3
    title: "Committed planted leak fixtures and a directory-wide allow-list in leak_scan contradict C-006 and the plan's 'no allowlist' claim"
    evidence:
      - artifact: "contracts/tools-and-workflows.md line 11 ('Planted files carry a marker line and are asserted to be detected by the text-level scan, which allow-lists exactly this directory')"
      - artifact: "plan.md § Charter Check row Standing Order 5 ('no allowlist is added'); § Test strategy preamble ('planted values in test code are assembled from fragments so test sources do not hold literal paths or addresses'); plan.md line 30 (C-006, no absolute host path or e-mail in any file this Mission authors)"
    claim: "Class-A negative fixtures under contracts/tools/fixtures/ are committed files that must contain literal planted host paths, e-mail addresses and forbidden property names to be detected. That puts literal leak-shaped strings in a public repository, contradicts the fragment-assembly rule the plan applies to test code, and creates a directory-wide exemption in the text scan (a real leak copied under that directory is never reported). It also contradicts the 'empty allow-list' claim."
    remediation: "Generate the leak-class fixtures at negative-test time from fragments (a small fixture-builder invoked by the job, writing to a temp root) and commit only the clean controls; if a committed file is unavoidable, exempt individual marker lines, not the directory, and have the scan assert the exempted count equals the committed marker count. Remove or rephrase the 'no allowlist is added' statement."
  - id: PLAN-ARCH-011
    lens: "Blast radius"
    severity: 3
    title: "Release workflow publishes GitHub Releases without stating --latest/prerelease handling, so a contract tag can take the repository's 'Latest release' pointer"
    evidence:
      - artifact: "plan.md § D-P5 ('publication is gh release create'; tag namespace contract-<module>-v<semver>)"
      - artifact: "plan.md § Contracts table row 'New: release tag namespace' (disjoint from v*.*.*)"
    claim: "A release created for contract-mission-status-v1.0.0 is, by default, a candidate for the repository-level 'Latest' marker and appears in the releases feed that external tooling and users treat as the CLI's release stream. Tag-filter disjointness (FR-022) protects the CLI release workflow triggers but not the Releases UI and API. The plan does not decide this, and the CLI release process (RELEASE_CHECKLIST.md) is owner-run."
    remediation: "State in D-P5 that the contract release is created with --latest=false (and decide prerelease for the 1.0.0 draft), add the flag to the release_check/publish-step guard assertion, and add it to the post-merge close-out step (SC-009) as something the operator verifies."
  - id: PLAN-ARCH-012
    lens: "Reflexivity"
    severity: 2
    title: "Fleet-verdict coverage of the new workflow cannot be observed on the delivering PR"
    evidence:
      - artifact: "plan.md § Seam (ci-fleet-verdict.yml +1 name, fleet_verdict.py +1 entry); § Gate set row 'Fleet verdict and fleet main'; risk P-8"
      - code: ".github/workflows/ci-fleet-verdict.yml:5 (workflow_run; checkouts at lines 43, 79, 108 take the default-branch ref)"
      - code: "scripts/ci/fleet_verdict.py:52-76 (applicable_workflows walks the trusted checkout's workflows; PR_WORKFLOWS must equal the set seen)"
    claim: "workflow_run jobs execute the default-branch copy, so on this PR the verdict uses main's inventory and main's workflow files and will not include contracts.yml at all. The plan's 'enforced = read by the fleet verdict' wording for the contracts gate is therefore unverifiable until after merge, and the first PR that touches contracts/ after merge is the first real test of the new inventory entry and the applicability (branches: [main], three paths)."
    remediation: "Say in the plan and the PR body that the fleet-verdict integration is confirmed only post-merge, add a post-merge close-out step (alongside SC-009) that opens or inspects a contracts-touching PR to confirm the verdict lists the contracts workflow as required, and keep the unit-level coverage in tests/ci/test_fleet_verdict.py as the pre-merge evidence."
