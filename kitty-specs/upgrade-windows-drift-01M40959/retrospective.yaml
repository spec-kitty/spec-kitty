- id: n-009
  category: tooling
  summary: 'Tracer: Cause'
  evidence_refs:
  - e-011
  details: '- **Cause**: lifecycle and planning commands resolve the repository root checkout; `LIFECYCLE_OWNED_TOPOLOGIES`
    admits only `single_branch`, so a `lanes_with_coord` mission created in a linked worktree is invisible to them.'
- id: n-013
  category: tooling
  summary: 'Tracer: Cause'
  evidence_refs:
  - e-011
  details: '- **Cause**: I committed `status.events.jsonl` (10 mission-lifecycle events: MissionCreated…TasksCompleted) and
    `status.json` to the target branch directly (`938d6e7388` plain commit, `2ef559d4d1` safe-commit of the whole mission
    dir). These are coordination-partition files; `finalize-tasks` had deliberately left them uncommitted on the target. The
    target copies then shared no event with the coordination log, so the squash content proof could not attribute them.'
- id: n-014
  category: tooling
  summary: 'Tracer: Fix'
  evidence_refs:
  - e-011
  details: '- **Fix**: set both target files byte-equal to the coordination branch copy (the squash would project that content
    anyway); lifecycle events stay in target git history.'
- id: n-003
  category: tooling
  summary: 'Tracer: Fix false drift at the owner.'
  evidence_refs:
  - e-010
  details: 2. **Fix false drift at the owner.** `command_installer` treats canonical bytes as fresh and refreshes the
    recorded hash in the adoption pass; providers stay thin.
- id: n-011
  category: tooling
  summary: 'Tracer: Follow-up'
  evidence_refs:
  - e-011
  details: "- **Follow-up**: candidate upstream issue — `agent mission create --owned-checkout` accepts `lanes_with_coord`
    but every later lifecycle command refuses it; either refuse at create time or support it.\n\n## 2026-10-03 — Squash consolidation
    refused on diverged status files (self-inflicted)"
- id: n-004
  category: tooling
  summary: 'Tracer: Git object ids decide planning staging.'
  evidence_refs:
  - e-010
  details: 3. **Git object ids decide planning staging.** `hash-object --path` versus `ls-tree`, batched, fail closed;
    `show_blob` unchanged.
- id: n-015
  category: tooling
  summary: 'Tracer: Lesson / upstream candidate'
  evidence_refs:
  - e-011
  details: '- **Lesson / upstream candidate**: never `safe-commit` a whole mission directory on a `lanes_with_coord` mission;
    the `implement` "commit planning artifacts first" hint suggests exactly that command and should exclude coordination-kind
    files. The coordination log also never receives the mission-lifecycle events.'
- id: n-002
  category: tooling
  summary: 'Tracer: No new public flag'
  evidence_refs:
  - e-010
  details: 1. **No new public flag** (C-002). Consent to replace an edited command skill is `doctor tool-surfaces --fix`
    (or an interactive upgrade "yes"), carried as `ApplyConsent.overwrite_paths` — the agent-profile pattern.
