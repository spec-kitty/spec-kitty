findings:
  - id: PLAN-ARCH-001
    lens: Ownership regex correctness / no over-match
    severity: 4
    title: >-
      Pre-existing wp_task_pattern already matches nested .md paths across
      directory AND mission boundaries, silently defeating spec.md's own AC3
      (own-WP residue must still block) and undermining FR-008's mission
      scoping — before owning_wp_for_path is ever consulted
    evidence:
      - artifact: "plan.md § Design Approach and Decisions, (a) Per-path ownership attribution mechanism"
      - artifact: "plan.md § Design Approach and Decisions, (c) The two existing wp_id-blind pinned tests"
      - artifact: "plan.md § Data and Control Flow (mermaid), node C/D"
      - artifact: "spec.md § User Story 1, Acceptance Scenario 3"
      - artifact: "spec.md § Requirements, FR-007"
      - artifact: "spec.md § Requirements, FR-008"
      - code: "src/specify_cli/review/dirty_classifier.py:81 (_is_review_handoff_survivor_path's wp_task_pattern = re.compile(r\"kitty-specs/[^/]+/tasks/WP\\d+-.+\\.md$\"))"
      - code: "src/specify_cli/review/dirty_classifier.py:93-115 (_is_benign calls _is_review_handoff_survivor_path)"
      - code: "src/specify_cli/review/dirty_classifier.py:144-150 (classify_dirty_paths's existing loop: _is_benign is checked first)"
    claim: >-
      Plan.md's Design Decision (a) describes the pre-existing
      `_is_review_handoff_survivor_path` regex as generalizing only "the flat
      .md-only convention", and its flow diagram (node C→D) labels the branch
      `_is_benign` handles as "any-WP flat .md task file" — implying only
      flat `tasks/WPxx-*.md` paths short-circuit before `owning_wp_for_path`
      is consulted. This is factually wrong about the CURRENT, UNMODIFIED
      regex. `wp_task_pattern = re.compile(r"kitty-specs/[^/]+/tasks/WP\d+-.+\.md$")`
      uses `[^/]+` for the mission-slug segment and `.+` for everything after
      `WP<n>-`; Python's `.` matches `/` by default, so this pattern already
      matches ANY nested `.md` file under ANY WP directory, in ANY mission,
      regardless of `wp_id`. Verified directly by executing the actual regex
      from dirty_classifier.py:81 against
      `kitty-specs/<slug>/tasks/WP01-foo/scratch.md` (spec.md's own literal
      AC3 example path, where WP01 is the WP being moved) — it returns a
      match, so `_is_benign` already returns `True` for this path today, and
      will continue to under plan.md's design since Design Decision (c)
      states `_is_benign`/`_is_review_handoff_survivor_path` are left
      unmodified. In `classify_dirty_paths`'s proposed loop (plan.md's code
      block under (a)), the `if _is_benign(path, wp_id): benign.append(path); continue`
      branch fires FIRST and unconditionally for this path — `owning_wp_for_path`
      is never reached, `owner == wp_id` (FR-007's blocking branch) is never
      evaluated, and the path lands in `benign`. This means `move-task WP01`
      would NOT block on its own uncommitted `scratch.md` residue,
      contradicting spec.md's explicit AC3 ("the transition still blocks on
      that path") and FR-007 ("Own-directory residue is not exempted")
      outright.
      A second, related consequence: the same pattern's `[^/]+` mission-slug
      segment is NOT scoped to the caller's `mission_slug` — it matches any
      mission's slug literally. So a nested `.md` file under a DIFFERENT
      mission's `kitty-specs/<other-slug>/tasks/WP01-foo/x.md` (FR-008's
      named edge case, "Ownership check is scoped to the current mission")
      is ALSO already routed to `benign` by the unmodified `_is_benign`
      check, independent of whether the new `owning_wp_for_path` helper is
      itself correctly `mission_slug`-anchored (it is, but that correctness
      is moot here because `_is_benign` short-circuits first for any
      matching `.md` path). Verified directly: the identical
      dirty_classifier.py:81 regex matches
      `kitty-specs/other-slug/tasks/WP01-foo/x.md` even when the caller's
      `mission_slug` is `"slug"`.
      Plan.md's own IC-01 test-coverage plan for FR-007 specifically
      describes testing "own-directory NON-task-file residue" (plan.md §
      Implementation Concern Map, IC-01 "Relevant requirements" /
      Validation Strategy step 2) — i.e. deliberately avoiding the `.md`
      extension for that FR row — so the plan's own validation strategy will
      not catch this gap; an implementer following plan.md as written would
      ship spec.md's AC3 broken and undetected by the plan's stated tests.
    remediation: >-
      Before implementation, resolve this at the design level in plan.md,
      not as an implementation afterthought: either (a) tighten
      `_is_review_handoff_survivor_path`'s `wp_task_pattern` itself (e.g. to
      `WP\d+-[^/]+\.md$`, disallowing `.` from crossing `/`, and/or anchoring
      the mission-slug capture to the caller's `mission_slug` the same way
      the new `owning_wp_for_path` does) so it no longer matches nested or
      cross-mission `.md` residue — which requires plan.md to retract Design
      Decision (c)'s "no re-pinning, left alone unmodified" stance for this
      function and add it to the edited-surfaces list (still within C-003's
      named file, `dirty_classifier.py`, so blast radius is unaffected); or
      (b) reorder `classify_dirty_paths` so that for any path matching the
      `tasks/WP<n>-*/` directory shape, `owning_wp_for_path` is consulted
      BEFORE (or instead of) the nested-`.md`-crossing branch of
      `_is_benign`, so `owner == wp_id` can still route to `blocking` even
      when the legacy survivor pattern would otherwise claim it. Either way,
      plan.md's Validation Strategy must add an explicit test asserting
      spec.md's literal AC3 path
      (`kitty-specs/<slug>/tasks/WP01-foo/scratch.md`, moving WP is WP01)
      resolves to `blocking`, and a companion test for the FR-008
      cross-mission nested-`.md` case
      (`kitty-specs/<other-slug>/tasks/WP01-foo/x.md` while `mission_slug`
      is the current mission) also resolves to `blocking` (or a non-`benign`
      outcome) rather than relying only on the "non-task-file" FR-007 test
      currently planned.
