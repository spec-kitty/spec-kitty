mission: dirty-tree-guard-wp-scoped-01M3M3TT
findings:
  - id: TASKS-DECOMP-001
    lens: Work-package sizing
    severity: 2
    title: "PR shape's \"one sitting\" claim is justified only by file count (5), not by the WPs' own line-count estimates (~380-575 lines)"
    evidence:
      - artifact: "tasks.md § PR shape: \"the 5-file blast radius is small enough to review in one sitting once both WPs land\""
      - artifact: "tasks/WP01-wp-scoped-ownership-attribution.md Subtask T001 (\"~80-150 lines\"), T002 (\"~40-60 lines\"), T003 (\"~150-200 lines\")"
      - artifact: "tasks/WP02-honest-per-path-refusal-attribution.md Subtask T005 (\"~25-35 lines\"), T006 (\"~25-40 lines\"), T007 (\"~60-90 lines\")"
    claim: >
      tasks.md's "PR shape" section (and plan.md's Design Decision (e)) justifies the
      one-PR / "review in one sitting" claim solely by naming 5 files. The WP files' own
      per-subtask line estimates sum to roughly 380-575 lines across the final PR, and
      neither tasks.md's PR shape paragraph nor plan.md's Design Decision (e) engages with
      this line-count total when asserting "small enough to review in one sitting."
    remediation: >
      Add one sentence to tasks.md's "PR shape" section stating the combined estimated diff
      size (~400-575 lines, mostly test code) alongside the file count.
  - id: TASKS-SEQ-001
    lens: chokepoint naming for the lane-transition guard itself
    severity: 3
    title: WP01/tasks.md never state, at top level, that dirty_classifier.py is shared guard infrastructure for every in-flight mission — only the #5151 file-overlap chokepoint is surfaced prominently
    evidence:
      - artifact: "spec.md § Compatibility & Reflexivity: \"Because move-task's guard is shared infrastructure, this is a compatibility-relevant change for every in-flight mission using it, not only the missions that reported the defect.\""
      - artifact: "plan.md § Compatibility, Rollout, and Risks — the \"Compatibility\" bullet, which carries the general (all-missions) framing forward from spec.md"
      - artifact: "tasks.md and tasks/WP01-wp-scoped-ownership-attribution.md: the only occurrence of \"Compatibility & Reflexivity\" anywhere in tasks.md or WP01 is a parenthetical citation inside T003 step 8; no sentence states that this WP edits shared infrastructure every currently-running mission's move-task depends on"
    claim: >
      tasks.md's "Known, accepted cross-mission file overlap" section and WP01's
      pre-implement gate section discuss only the #5151-specific hold. Neither artifact
      restates spec.md's broader Compatibility & Reflexivity claim that dirty_classifier.py
      backs move-task for every mission currently in flight. This under-states the blast
      radius and risks an implementer/reviewer treating WP01's regex change as low-stakes.
    remediation: >
      Add one explicit sentence to WP01's "Objective" or "Risks" section stating
      dirty_classifier.py is shared move-task guard infrastructure for every in-flight
      mission, tying it to the test_no_previously_benign_path_becomes_blocking regression
      test as the concrete proof obligation.
  - id: TASKS-VERIFY-001
    lens: Per-AC test strategy concrete (requirement-ref cross-check)
    severity: 2
    title: WP01's frontmatter requirement_refs omits NFR-001 and NFR-002 that tasks.md's own body assigns to WP01
    evidence:
      - artifact: "tasks.md § WP01 — WP-scoped ownership attribution mechanism (IC-01), 'Requirement refs' line"
      - code: "kitty-specs/dirty-tree-guard-wp-scoped-01M3M3TT/tasks.md:138-140"
      - code: "kitty-specs/dirty-tree-guard-wp-scoped-01M3M3TT/tasks/WP01-wp-scoped-ownership-attribution.md:5-14 (YAML frontmatter requirement_refs)"
      - artifact: "plan.md § Implementation Concern Map, IC-01 'Relevant requirements' (also lists NFR-001, NFR-002 for IC-01)"
    claim: >
      tasks.md's prose for WP01 explicitly includes NFR-001 and NFR-002, matching plan.md's
      IC-01 list. But WP01's materialized prompt file's YAML frontmatter requirement_refs
      list omits NFR-001 and NFR-002 entirely. WP02's frontmatter correctly includes
      NFR-002, proving this is not a by-design convention — WP01 alone is missing them.
    remediation: >
      Add NFR-001 and NFR-002 to WP01's frontmatter requirement_refs list. Re-run
      spec-kitty agent tasks map-requirements before finalize-tasks, and confirm the
      regenerated frontmatter includes both NFR entries for WP01.
