- id: PR-CONTRACT-002
  lens: public API hygiene (charter C-007 spirit / package export consistency)
  severity: 2
  title: owning_wp_for_path is deliberately public and consumed cross-module, but is not re-exported through
    specify_cli.review's package __all__ like its sibling classify_dirty_paths
  evidence:
  - code: src/specify_cli/review/__init__.py:7-18 (`__all__` lists `classify_dirty_paths` but not `owning_wp_for_path`)
  - code: 'src/specify_cli/review/dirty_classifier.py:129,148-150 (owning_wp_for_path''s own docstring:
      ''Deliberately public (no leading underscore) — consumed cross-module by tasks_parsing_validation.py
      via a direct submodule import, mirroring how that module already imports classify_dirty_paths'')'
  claim: 'Charter C-007''s mandatory `__all__` rule is scoped only to `src/charter/` and `src/kernel/`
    ("Future expansion to other subpackages is a per-mission scope decision" — charter.md line 640), so
    `review/` is not currently bound by it, and the symbol-level dead-code gate (tests/architectural/test_no_dead_symbols.py,
    34/34 passed) is satisfied because it scans all public module-level names, not just `__all__` members.
    This is therefore not a gate violation. It is, however, a real inconsistency in the package''s own
    stated public surface: `classify_dirty_paths` is both re-exported via `specify_cli.review.__all__`
    AND imported directly from the submodule by its one caller, while the new `owning_wp_for_path` — explicitly
    designed and documented as a public, cross-module-consumed symbol doing the same job for a second
    capability — is only reachable via the submodule import, not the package''s declared public surface.
    A future maintainer scanning `specify_cli.review.__all__` to find "what does this package export"
    would miss this function entirely.'
  remediation: Add `owning_wp_for_path` to `src/specify_cli/review/__init__.py`'s import and `__all__`
    list alongside `classify_dirty_paths`, for consistency with the module's own established export convention.
  refute_reason: Verified in src/specify_cli/review/__init__.py that __all__ lists classify_dirty_paths
    but not the new, deliberately-public, cross-module-consumed owning_wp_for_path, a genuine and easily-fixed
    inconsistency introduced by this diff.
  disposition: accepted-not-fixed
  accepted_reason: 'Orchestrator disposition (severity 2 < 3, accept-with-reason permitted): the remediation
    edits src/specify_cli/review/__init__.py, a sixth file outside spec C-003''s frozen blast radius;
    the plan squad already reverted exactly this edit as scope creep (PLAN-FRESH-001); charter C-007''s
    __all__ mandate covers src/charter and src/kernel only, and the dead-symbol gate passes. Left for
    a follow-up that owns review/ package exports.'
- id: PR-TESTS-001
  lens: mission-derived (three real-world occurrences)
  severity: 3
  title: '#5159 item 4''s reported transition target (--to approved) is never literally invoked by any
    new test'
  evidence:
  - artifact: 'spec.md FR-009 ("a failing test reproducing each of the three reported occurrences ...
      #5159 item 4") and Overview occurrence 2 ("blocked move-task --to approved for an unrelated WP")'
  - code: tests/specify_cli/cli/commands/agent/test_tasks.py:396-399 (test_move_task_ignores_other_wp_residue_regardless_of_shape)
      and :444-447 (test_move_task_still_blocks_own_directory_residue_same_fixture) both invoke runner.invoke(app,
      ["move-task", "WP01", "--to", "for_review", ...]) — neither uses --to approved
  - code: src/specify_cli/cli/commands/agent/tasks_move_task.py:957-991 confirms _validate_ready_for_review
      (which reaches _validate_research_artifacts / classify_dirty_paths) fires identically for Lane.FOR_REVIEW,
      Lane.APPROVED and Lane.DONE, so the underlying guard code path is target-lane-agnostic
  claim: '#5159 item 4, one of the three real-world occurrences this mission folds in (FR-009), was specifically
    a block on `move-task --to approved`, not `--to for_review`. The new WP03 review-cycle-directory fixture
    in test_move_task_ignores_other_wp_residue_regardless_of_shape reproduces the *dirty-path shape* of
    #5159 item 4 faithfully, but the test only ever invokes `--to for_review`, never `--to approved` —
    the actual reported transition target is not exercised by any new test. I verified by reading tasks_move_task.py:957-991
    that _validate_ready_for_review is invoked identically for FOR_REVIEW/APPROVED/DONE (target_lane only
    changes the retry-hint text, per the FR-015 docstring comment at tasks_parsing_validation.py:832-833),
    so the functional risk from this gap is low — but the letter of FR-009 ("a failing test reproducing
    each of the three reported occurrences") is not met for occurrence 2 as literally reported, and the
    charter''s own ATDD discipline ("verify this shape empirically, do not assume") was applied to the
    git-porcelain shape in this same fixture but not to the transition target.

    '
  remediation: 'Add a `--to approved` variant of test_move_task_ignores_other_wp_residue_regardless_of_shape
    (or parametrize the existing test over target_lane in ("for_review", "approved")) so the occurrence
    is reproduced through its actually-reported entry point, not just a functionally- equivalent one.

    '
  refute_reason: Verified tasks_move_task.py:973 invokes _validate_ready_for_review identically for FOR_REVIEW/APPROVED/DONE,
    but spec.md FR-009 requires a failing/passing test reproducing each of the three reported occurrences
    and
  disposition: route-to-fix
- id: PR-FRESH-001
  lens: fresh-sweep (fail-open on git-rename porcelain lines)
  severity: 4
  title: A "R  old -> new" git-rename porcelain line is passed through as one composite path string, and
    can make a WP's own genuine dirty residue resolve benign regardless of wp_id -- defeating FR-007's
    fail-closed guarantee
  evidence:
  - artifact: spec.md FR-007 / Edge Cases 'The moving WP's own directory' / Clarifications Q2 ('Never
      a silent pass for an undetermined path')
  - code: 'src/specify_cli/review/dirty_classifier.py:92 (_is_review_handoff_survivor_path''s wp_task_pattern:
      `re.compile(r"kitty-specs/[^/]+/tasks/WP\d+-[^/]+\.md$")`, used via `.search()` with no `^` anchor
      -- this exact line was edited by this diff to tighten `.+` to `[^/]+`, but the missing start-anchor
      was left in place)'
  - code: src/specify_cli/review/dirty_classifier.py:153 (owning_wp_for_path's `(?:\.md|/.*)$` alternation
      is unbounded -- `.*` absorbs anything, including an embedded ` -> new-path` tail, once the OLD path's
      prefix matches)
  - code: 'src/specify_cli/cli/commands/agent/tasks_parsing_validation.py:314 (`file_part = line[3:]`,
      pre-existing/unchanged: for a `git status --porcelain` rename line `R  old -> new`, this yields
      the single composite string `"old -> new"`, which is then handed to classify_dirty_paths unmodified)'
  claim: "I verified this directly against the real functions (both bugs share one root cause: neither\
    \ regex is anchored/bounded against an embedded \" -> \" rename descriptor, and the porcelain-line\
    \ parser that produces `raw_paths`/`dirty_paths` -- unchanged by this diff -- never splits a rename\
    \ line before classification).\n\nBug A (more severe -- short-circuits before owning_wp_for_path is\
    \ even reached): any dirty line whose trailing component happens to look like a flat `tasks/WPxx-*.md`\
    \ file is classified benign via `_is_benign`'s `wp_task_pattern.search()`, for EVERY wp_id, even when\
    \ the line's \"old\" side is garbage:\n\n  classify_dirty_paths(\n      [\"not-even-a-real-path ->\
    \ kitty-specs/066-test/tasks/WP05-x.md\"],\n      wp_id=\"WP01\", mission_slug=\"066-test\",\n  )\n\
    \  -> blocking=[] benign=[\"not-even-a-real-path -> kitty-specs/066-test/tasks/WP05-x.md\"]\n\nA concrete,\
    \ reachable instance of this: WP01's OWN non-task-file residue (which FR-007 says must keep blocking)\
    \ is silently waved through the instant it happens to be involved in a rename whose *new* side lands\
    \ on a flat WPxx-*.md path for ANY WP number, including an unrelated one:\n\n  classify_dirty_paths(\n\
    \      [\"kitty-specs/066-test/tasks/WP01-own/scratch.py -> kitty-specs/066-test/tasks/WP99-unrelated.md\"\
    ],\n      wp_id=\"WP01\", mission_slug=\"066-test\",\n  )\n  -> blocking=[] benign=[...]   # should\
    \ block -- this is WP01's own uncommitted residue\n\n\nBug B (in the new owning_wp_for_path itself):\
    \ for a rename whose old path matches a DIFFERENT WP's directory and whose new path lands inside the\
    \ MOVING WP's own directory, ownership resolves from the old path's prefix only (the regex's `/.*$`\
    \ absorbs the arrow and the new path), so newly-renamed-in content that now lives under the moving\
    \ WP's own directory is classified benign instead of blocking:\n\n  classify_dirty_paths(\n      [\"\
    kitty-specs/066-test/tasks/WP02-foo/old.py -> kitty-specs/066-test/tasks/WP01-own/new.py\"],\n   \
    \   wp_id=\"WP01\", mission_slug=\"066-test\",\n  )\n  -> blocking=[] benign=[...]   # should block\
    \ -- new.py is WP01's own residue\n\n\nI confirmed with a real git repo that `git status --porcelain`\
    \ genuinely emits this composite `\"old -> new\"` shape for a staged rename (`git mv` then `git status\
    \ --porcelain` -> `R  <old> -> <new>`), and that the unchanged parsing loop in `_validate_research_artifacts`\
    \ (`tasks_parsing_validation.py:314`, `file_part = line[3:]`) passes that whole string through as\
    \ a single dirty path with no split on `\" -> \"`. This is not purely hypothetical: git's rename detection\
    \ is similarity-based, not `git mv`-only, and this mission's own review-cycle / task-file scaffolding\
    \ produces near-identical boilerplate across WP directories -- exactly the shape most likely to trigger\
    \ a false-positive rename pairing across two different WPs' directories. No test in this diff's three\
    \ touched test files exercises any rename-form (`\" -> \"`/`R  `) porcelain line; every new fixture\
    \ uses only add/modify shapes.\n"
  remediation: 'Reject or normalize rename-form porcelain lines before they reach classify_dirty_paths,
    at the parsing boundary in `_validate_research_artifacts` (tasks_parsing_validation.py:296-323): split
    a status-2/3-prefixed rename line on `" -> "` and classify only the *new* path (matching git''s own
    convention that the new path is the file''s current location), or explicitly treat any raw line containing
    `" -> "` as an always-blocking, unattributable path pending real two-sided handling. Independently,
    harden the regexes themselves so a composite string can never satisfy them end-to-end: anchor `wp_task_pattern`
    with `^` (or use `fullmatch`/`re.match`) so `.search()` cannot pick up a trailing embedded path, and
    bound `owning_wp_for_path`''s `(?:\.md|/.*)$` alternation so it cannot swallow a second `kitty-specs/.../`
    occurrence or an arrow separator (e.g. reject any candidate containing `" -> "` before applying the
    regex, or require the whole string to contain no further `/tasks/` or `kitty-specs/` occurrence after
    the first match). Add a regression test in tests/review/test_dirty_classifier.py that feeds a real
    `"old -> new"` rename string reproducing each of Bug A and Bug B and asserts the result stays blocking.

    '
  refute_reason: 'A real staged git rename inside kitty-specs/ produces "R  old -> new" porcelain (verified
    in a scratch repo), tasks_parsing_validation.py''s unchanged line[3:]/no-split parsing hands the composite
    string straight into _validate_research_artifacts -> classify_dirty_paths, and running that real end-to-end
    entry point on WP01''s own file renamed into its own directory (WP02-foo/old.py -> WP01-own/new.py)
    returns a false pass (guidance=None) instead of blocking, violating FR-007; a base-vs-diff differential
    on the same inputs shows Bug A (wp_task_pattern''s missing ^ anchor letting .search() match a composite
    string''s tail) already fail-opens identically on af847be71''s version (pre-existing, unchanged by
    this diff''s .+ -> [^/]+ tightening), while Bug B is only reachable because this diff adds owning_wp_for_path
    itself -- on af847be71 the same old->new WP01-residue input correctly stayed blocking (no owning_wp_for_path
    existed to misattribute it), so the diff turns a previously-safe path into a fail-open one.

    '
  disposition: route-to-fix
  round: 2
- id: PR-FRESH2-001
  lens: attribution-honesty divergence (round-2 fix, rename-entry attribution)
  severity: 3
  title: _attribute_blocking_entry re-derives ownership from owning_wp_for_path alone, skipping _is_benign,
    so a rename entry that blocks because of a genuinely unattributable path can be mislabeled "owned
    by {wp_id}" when its OTHER (benign-exempted) side happens to match the moving WP's own directory pattern
  evidence:
  - artifact: spec.md FR-005 ("the guidance text to name the path's actual determined owner ... instead
      of unconditionally asserting the WP being moved owns it regardless of which case applies")
  - artifact: spec.md Key Entities – Dirty Path Classification ("Per-path ownership for a mixed-ownership
      blocking list (FR-005 ...) must be resolved for each blocking path without diverging from classify_dirty_paths's
      own blocking/benign partition")
  - code: src/specify_cli/cli/commands/agent/tasks_parsing_validation.py:263-283 (_attribute_blocking_entry
      loops `paths` and calls `owning_wp_for_path` directly — it never consults `_is_benign`, unlike `classify_dirty_paths`
      at dirty_classifier.py:214-221, which checks `_is_benign` FIRST and only falls through to `owning_wp_for_path`
      when `_is_benign` is False)
  - code: src/specify_cli/review/dirty_classifier.py:129-132 (_is_benign) and :95-131 (is_self_bookkeeping_churn
      matches ANY basename == "meta.json" via `PurePosixPath(normalized).name`, regardless of directory
      nesting)
  claim: 'Verified end-to-end through the real `_validate_research_artifacts` entry point (mocking only
    `subprocess.run`, per the file''s own existing test style) with a synthetic rename porcelain line
    "R  kitty-specs/demo/scratch/mystery.py -> kitty-specs/demo/tasks/WP01-mine/meta.json": `mystery.py`
    (old side) is genuinely unattributable (`owning_wp_for_path` returns None, not under any WP directory)
    and is the actual reason the entry blocks; `meta.json` (new side) is excluded as benign self-bookkeeping
    churn by `_is_benign` (`is_self_bookkeeping_churn` matches any file literally named `meta.json` by
    basename, independent of directory), so `classify_dirty_paths` never even reaches `owning_wp_for_path`
    for that side. Despite this, the rendered guidance line reads "... (owned by WP01)" — because `_attribute_blocking_entry`
    calls `owning_wp_for_path` on BOTH paths independently, and `owning_wp_for_path` alone (with no `_is_benign`
    pre-check) resolves the `meta.json` path''s directory prefix to WP01, since it is nested under `tasks/WP01-mine/`.
    A second, more realistic repro: pairing the same unattributable `mystery.py` with WP01''s own flat
    task file (`kitty-specs/demo/tasks/WP01-mine.md`, the routinely-committed artifact `_is_benign`''s
    `wp_task_pattern` always treats as benign for ANY wp_id) produces the identical false "(owned by WP01)"
    label. In both cases the block is correct (Clarifications Q2''s fail-closed guarantee holds — the
    entry does block), but the honesty guarantee FR-005 exists specifically to provide is violated: the
    message tells the agent it owns a file it does not, and never mentions the actual unattributable path
    is why the transition is refused. Confirmed the divergence is exactly what spec.md''s Key Entities
    section calls out as a requirement NOT to introduce ("without diverging from classify_dirty_paths''s
    own blocking/benign partition").

    '
  remediation: 'Ground `_attribute_blocking_entry`''s per-path check in the SAME blocking decision `classify_dirty_paths`
    already made, rather than recomputing ownership from scratch: pass the `blocking_set` (or the flat
    `blocking` list) into the attribution helper and only call `owning_wp_for_path` on the subset of `paths`
    that are themselves members of `blocking_set` (i.e. paths `_is_benign` did NOT already exempt). Add
    a regression test with a rename entry whose blocking side is unattributable and whose benign-exempted
    side (a `meta.json` or the moving WP''s own flat task file) happens to sit inside the moving WP''s
    own directory, and assert the guidance says "not attributable to a specific work package", not "owned
    by {wp_id}".

    '
  refute_reason: 'Live repro against the real `_validate_research_artifacts` on a `git mv` "mystery.py
    -> WP01-mine/meta.json" rename in a scratch repo printed "(owned by WP01)" even though `classify_dirty_paths`
    itself resolves `meta.json` as benign and blocks only on the genuinely-unattributable `mystery.py`
    side — `_attribute_blocking_entry` (new in 55e40cb91, which replaced the single-path `_attribute_blocking_path`)
    calls `owning_wp_for_path` per-side with no `_is_benign`/blocking_set gate, diverging from the classifier''s
    own partition exactly as spec.md''s Key Entities section forbids.

    '
  disposition: route-to-fix
  round: 3
