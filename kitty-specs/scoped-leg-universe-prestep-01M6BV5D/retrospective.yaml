  details: "- **[2026-11-01][discovery] One parser for the selected-gates file.** The format is owned by `scripts/ci/battery_scope.py`
    (next to the writer the CI scope step calls); `battery_partition_plugin.read_gates_file` and the pre-step's `consumers`
    decision both parse through it, so the pre-step can never believe a gate is selected that the leg refuses to run."
