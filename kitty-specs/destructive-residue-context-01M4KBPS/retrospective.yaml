    the missing values for every other role.'
- id: n-003
  category: tooling
  summary: 'Tracer: Role resolver.'
  evidence_refs:
  - e-016
  details: '- **Role resolver.** `coherence.checkout_role_for(repo_root, worktree)` uses the git worktree registry (`classify_worktree_topology`,
    C-SEAM-1): repo root -> REPOSITORY_ROOT, registered `-coord` -> COORDINATION, other registered -> LANE (a Mission worktree
    is indistinguishable from a lane and shares its rules). Unregistered, outside the root, or an unreadable registry -> COORDINATION,
    the strictest role. `ResidueContext.for_checkout` re-targets the role so `advance_branch_ref`/`restore_branch_ref`/`resync_checkouts_to_tip`
    judge EACH checked-out worktree by its own role; a caller-supplied role is only used for single-checkout guard calls.'
- id: n-014
  category: tooling
  summary: 'Tracer: Rollback.'
  evidence_refs:
  - e-016
  details: "- **Rollback.** `rollback._RunResidue` wraps the run's `ResidueContext` and additionally treats THIS Mission's
    status log/snapshot as disposable under every topology (the rollback undoes the run's own bookkeeping; WP01's #5966 control
    requires it for a LANES Mission). Another Mission's files and all other coordination kinds still refuse. Unreadable `meta.json`
    -> no context -> strictest (no exemption)."
- id: n-019
  category: tooling
  summary: 'Tracer: Scratch = TOOL_OWNED, justified per site.'
  evidence_refs:
  - e-016
  details: '- **Scratch = TOOL_OWNED, justified per site.** Every scratch checkout is created by the same function that removes
    it, under `.kittify/runtime/merge/<id>/workspace` (`create_merge_workspace`, removed by `cleanup_merge_workspace`) or
    a `tempfile` root (`bake._compute_next_mission_number_or_none`, `bake._write_mission_number_to_branch`, `lanes.consolidation.preview_mission_target_integration`,
    `lanes.consolidation._merge_branch_into`, `review.baseline._baseline_worktree`). One helper in `consolidation/workspace.py`
    (`remove_scratch_worktree`, `abort_scratch_merge`, `discard_scratch_tree`) holds the tool-owned context so the five sites
    do not each build one. The `merge --abort` calls in `_merge_branch_into` act on that same scratch worktree, so they are
    tool-owned too.'
- id: n-022
  category: tooling
  summary: 'Tracer: Signature plumbing.'
  evidence_refs:
  - e-016
  details: '- **Signature plumbing.** `_refresh_primary_checkout_after_merge`, `_merge_branch_into` and `attempt_auto_rebase`
    gained keyword-only `mission_slug` (and `lag_base_sha`) because none could name a Mission. A missing slug or unreadable
    topology yields the strictest context (nothing disposable), never a destructive default. `phase_bookkeeping.py`, `lanes/lifecycle_sync.py`
    pass the values (one-line edits outside the owned list).'
- id: n-020
  category: tooling
  summary: 'Tracer: `discard_scratch_tree`.'
  evidence_refs:
  - e-016
  details: '- **`discard_scratch_tree`.** `remove_tool_owned_tree` refuses any directory holding a `.git` entry, and a stale
    merge workspace is exactly that. A checkout goes through `guarded_tree_delete` (tool-owned); a dangling gitlink (registration
    gone) is a plain tree once the dead link is dropped; a `.git` directory the guard cannot read is kept.'
- id: n-007
  category: tooling
  summary: 'Tracer: `guarded_branch_delete`.'
  evidence_refs:
  - e-016
  details: '- **`guarded_branch_delete`.** `git rev-list ... --not --exclude=... --branches` does NOT exclude the branch (git
    2.43), so unique commits are computed from `for-each-ref` minus the branch itself, fed to `rev-list --stdin` as `^sha`
    lines.'
- id: n-008
  category: tooling
  summary: 'Tracer: `guarded_merge_abort`.'
  evidence_refs:
  - e-016
  details: '- **`guarded_merge_abort`.** A conflicted merge makes every merged path dirty, so paths in `diff --name-only <merge-base>
    MERGE_HEAD` are exempt; any other tracked edit refuses. Untracked files survive `merge --abort` and are not counted.'
