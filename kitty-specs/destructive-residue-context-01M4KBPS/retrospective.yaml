- id: n-021
  category: tooling
  summary: 'Tracer: Lag context.'
  evidence_refs:
  - e-016
  details: "- **Lag context.** `reset --hard HEAD` on a checkout that lags its own HEAD sees the lag as dirty (staged deletions
    of HEAD's files), so a bare Mission `ResidueContext` would refuse every legitimate recovery. `git_probes.LagResidueContext`
    makes a path disposable when HEAD changed it since the checkout last matched `base_sha` and neither worktree nor index
    differs from `base_sha` there (the operator did not touch it); an optional inner Mission context adds regenerable residue.
    Used by the resume recovery (anchor = the persisted pre-mutation tip, the pure-lag proof stays in front) and by `_refresh_primary_checkout_after_merge`
    (`lag_base_sha=state.pre_mutation_target_sha`, `mission_slug`). A refusal there warns and skips the refresh, like the
    off-target branch does: the landing is settled, the lag is resolvable."
- id: n-016
  category: tooling
  summary: 'Tracer: Lane branch deletes'
  evidence_refs:
  - e-016
  details: '- **Lane branch deletes** (`phase_teardown`, orchestrator-api) go through `guarded_branch_delete`. The phase_teardown
    path passes the lane tip snapshotted before the run (`pre_mutation_refs`) as the creation base, so a squash-landed lane
    (unreachable from any ref) is still deleted while a commit made after the snapshot keeps the branch (warning, never a
    failed consolidation). A kept branch keeps its recorded lane tip. orchestrator-api has no snapshot: `creation_base=None`,
    so only reachable lanes are deleted.'
