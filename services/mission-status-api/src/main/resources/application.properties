# Packaged defaults of the Mission Status API service (plan section 13). The required key mission-status.project-root has no default.
# Loopback only: BindGuard (a later work package) refuses any other effective value, and Boot would otherwise bind every interface.
server.address=127.0.0.1
server.port=${mission-status.port:8787}
# No proxy trust: the Host/Origin filter reads the raw Host header, forwarded headers are refused.
server.forward-headers-strategy=none
spring.threads.virtual.enabled=true
# SseEmitter(0L) streams are open-ended; the container default (about 30 s) would end an idle stream at the first heartbeat.
spring.mvc.async.request-timeout=-1
mission-status.stream.queue-capacity=1024
# --- WP10 ---
# The heartbeat of an idle event stream (ISO-8601 duration); the events controller reads it. mission-status.port (default 8787, 0 for an
# ephemeral port) already feeds server.port above.
mission-status.stream.heartbeat-interval=PT30S
# --- WP20 ---
# NFR-003 / AC-9g: no log line carries an absolute path or a user name. Boot's startup line names the working directory and the user
# ("started by <user> in <directory>"), so it is not written, and the banner is not printed.
spring.main.log-startup-info=false
spring.main.banner-mode=off
# --- pre-merge fold 1 ---
# The service serves exactly its own routes: no static-resource handler (it would answer 404 with a warning that echoes the request path,
# and a hostile configuration could point it at any directory). ConfigPin also pins this and the configuration locations.
spring.web.resources.add-mappings=false
# Tomcat's HTTP/1.1 parser logs the text of a bad Host or request line at INFO; the request is the caller's, so the text could carry a
# path or an e-mail address. NFR-003 / AC-9g: raise the logger to WARN.
logging.level.org.apache.coyote.http11=WARN
# Concurrent event streams admitted (the 429/503 refusal comes after this many); NFR-004 measures 100.
mission-status.stream.max-connections=128
# Spring's "No mapping for GET <path>" warning would echo the request path into the log.
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
