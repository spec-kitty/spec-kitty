# Packaged defaults of the Mission Status API service (plan section 13). The required key mission-status.project-root has no default.
# Loopback only: BindGuard (a later work package) refuses any other effective value, and Boot would otherwise bind every interface.
server.address=127.0.0.1
server.port=${mission-status.port:8787}
# No proxy trust: the Host/Origin filter reads the raw Host header, forwarded headers are refused.
server.forward-headers-strategy=none
spring.threads.virtual.enabled=true
# SseEmitter(0L) streams are open-ended; the container default (about 30 s) would end an idle stream at the first heartbeat.
spring.mvc.async.request-timeout=-1
mission-status.stream.queue-capacity=1024
