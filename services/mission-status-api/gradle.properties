# No implicit JDK download: the pinned GraalVM Community 25 comes from JAVA_HOME (orchestrator-provisioned locally,
# graalvm/setup-graalvm in CI).
org.gradle.java.installations.auto-download=false
# The daemon stays at its default; CI passes --no-daemon. No shared build cache, no secrets.
org.gradle.jvmargs=-Xmx2g
