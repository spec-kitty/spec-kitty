[pytest]
# NOTE: Intentionally excluding `.` from pythonpath. With both `.` and `src/`
# on the path, Python can load the same source file under two module names
# (e.g. `doctrine.resolver` and `src.doctrine.resolver`), creating duplicate
# class objects that break `is` / `==` checks for enum members across the
# module boundary. The `.` entry is only needed for `from src.X import Y`
# style imports in test code — which are now all fixed to use the canonical
# `from X import Y` form.
pythonpath = src
testpaths = tests
addopts = --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# #63: pytest's `all` default keeps every test's tmp_path alive for the whole
# session; across make test-full's ~40k tests that alone exhausts the
# runner's temp filesystem. `failed` frees a passing test's tmp_path at its
# own fixture teardown instead of waiting for session end. See
# tests/_support/run_basetemp.py's module docstring for the fuller picture
# (this setting is the actual #63 driver fix; that module is a separate,
# unrelated housekeeping fix for pytest's shared basetemp tree).
tmp_path_retention_policy = failed
markers =
    e2e: End-to-end tests exercising the full CLI workflow (may be slow)
    orchestrator_availability: tests for agent availability detection
    orchestrator_fixtures: tests for fixture loading and management
    orchestrator_happy_path: happy path end-to-end tests
    orchestrator_review_cycles: review rejection/approval cycle tests
    orchestrator_parallel: parallel execution and dependency tests
    orchestrator_smoke: basic smoke tests for agent invocation
    core_agent: test requires core tier agent (fails if unavailable)
    extended_agent: test for extended tier agent (skips if unavailable)
    slow: test expected to take >30 seconds
    fast: pure-logic tests with no subprocess/git overhead (sub-second per test)
    timeout: test timeout in seconds (requires pytest-timeout plugin)
    adversarial: Adversarial/security tests for 0.13.0
    doctrine: Doctrine package smoke and integration checks
    distribution: Tests requiring wheel install (slow, no SPEC_KITTY_TEMPLATE_ROOT)
    platform_darwin: macOS-specific tests (case-insensitive FS)
    platform_linux: Linux-specific tests
    requires_symlinks: Tests that need symlink support
    asyncio: marks tests as async (requires pytest-asyncio plugin)
    integration: marks integration tests
    contract: Consumer-surface contract tests pinning external public APIs (e.g. spec-kitty-events / spec-kitty-tracker) the CLI depends on
    git_repo: tests that create real git repositories (subprocess git init)
    no_readiness_stub: opt out of any autouse readiness-stub fixture so the test exercises its own readiness wiring (mission 082 tracker CLI tests)
    no_git_tmp_path: opt out of the dashboard autouse git-init of tmp_path so a test can exercise the non-git registry-unavailable degradation branch (WP03 topology seam)
    windows_ci: tests that must pass on the native windows-latest CI job (runs only on windows-latest; covers hook execution, file-backed auth store, path helpers, worktree fallback, regression guards)
    live_adapter: tests that call the real Anthropic API (deselect with -m 'not live_adapter')
    non_sandbox: test is structurally incompatible with mutmut's forked sandbox (subprocess CLI calls, whole-codebase AST walks, wheel builds, or repo-state fixtures outside also_copy). See ADR 2026-04-20-1
    flaky: test passes in the main suite but is non-deterministic under mutmut or forking pipelines. Each entry is debt — root-cause and remove. See ADR 2026-04-20-1
    quarantine: irreducible *environmental* flake (Tier 3) held out of every normal/blocking run so it can never turn main red or block an unrelated PR. Env-gated: skipped unless SPEC_KITTY_RUN_QUARANTINE=1 (no live CI job sets it — the former non-blocking `quarantine-visibility` lane no longer exists; per docs/development/testing/testing-flakiness.md the PR that adds the first quarantined test must also add a visibility lane). Each entry needs a one-line reason + tracking issue and is debt. NOT the `flaky` marker. See docs/development/testing/testing-flakiness.md
    unit: pure-logic tests for a single module's behavior (no subprocess, no filesystem beyond tmp_path, no network). Distinct from `fast` (which is a performance characterisation); `unit` is the category default for module-scoped tests
    architectural: architectural invariant tests (layer-rule pytestarch checks, import-boundary scans, shared-package-boundary, naming conventions, schema enforcement). Run in the architectural gate
    exploratory: human-driven exploratory tests not intended for CI. Opt them out of CI workflows via `-m "not exploratory"`
    stress: concurrency/load stress tests — real multi-process/subprocess concurrency, not safe to co-schedule with fast-tier jobs (they spawn their own threads and race coverage's per-thread trace installation under the module shards); deselected from the per-PR AND full module-tests slices and run serially under `-m "stress and not windows_ci"` by the dedicated ci-nightly lane (also `make test-full`'s serial `-n0` pass); opt-in locally via `-m stress` (mission-coordination-branch-atomic-event-log WP09; dedicated CI lane added by WP06/#3256, mission verdict-seam-boundary-hardening-01KZG179 — the ci-nightly `-m stress` home was reinstated with #4698 after the interim ci-quality.yml dropped `stress-tests-serial`)
    regression: issue-pinned end-to-end regression tests that exercise an exact reproduction sequence (mission-coordination-branch-atomic-event-log WP09)
    timing: wall-clock timing regression gate; not selected by any live CI job — run serially under `-m timing -n0` (`make test-full`'s dedicated serial pass; the former `timing-nfr-serial` CI job no longer exists) or via explicit local invocation
    performance: wall-clock performance-budget test using the benchmark fixture; selected by the nightly `ci-nightly.yml` `performance` job (`-m performance`, `SPEC_KITTY_RUN_PERFORMANCE=1` — conftest.py skips these tests without it); never selected by any per-PR-blocking job; also runnable via explicit local invocation (`SPEC_KITTY_RUN_PERFORMANCE=1 -m performance`)
    agent: tests that exercise the orchestrator-api / agent-facing contract surfaces (JSON envelope, typer compatibility)
    upgrade: tests for the spec-kitty upgrade migration pipeline (m_3_2_* and earlier migrations)
    docs_scoped: architectural test whose result depends on repo docs/ content (a docs change could newly-red it). Historically selected by the arch-adversarial CI pole's docs-only trim (`-m 'docs_scoped and not windows_ci'`); that pole no longer exists and the live `suite` job runs these tests with everything else. Kept so a docs-only trim can be reintroduced without re-marking. New docs-scanning arch tests MUST carry this marker
    corpus: test reads the wheel-shipped doctrine corpus (packs/built-in/**) or a narrow mission-spec/charter data leaf (kitty-specs/**/spec.md, plan.md, tasks/**, contracts/**, acceptance-matrix.json; .kittify/{charter,glossaries,doctrine}/**) -- so a data-only change to those paths would otherwise ship invisibly (#3008). Run under `-m "corpus and not windows_ci"` (the former blocking `fast-tests-corpus` CI job that selected it no longer exists in the interim ci-quality.yml). New corpus-reading tests MUST carry this marker (guarded by tests/architectural/test_ci_corpus_trigger_completeness.py)
