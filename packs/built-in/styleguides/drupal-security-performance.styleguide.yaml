schema_version: "1.0"
id: drupal-security-performance
title: Drupal Security and Performance Styleguide
scope: code
applies_to_languages:
  - php
  - twig

principles:
  - "Escape by default: rely on Twig auto-escaping; `|raw` is a deliberate, justified exception, never a convenience."
  - "Access-check every entity query: explicit `accessCheck()` has been required since Drupal 9.2 and throws an error from Drupal 10.0 -- on Drupal 10/11 an unchecked query is a hard failure, not a warning."
  - "An access-check bypass is a decision, not an oversight: `accessCheck(FALSE)` is only ever explicit and commented."
  - "Cacheability is not optional: every render array that depends on data declares its tags, contexts, and max-age."
  - "Cache contexts encode who content is for: a missing user-scoped context can leak one visitor's content to another."
  - "Invalidate by cache tag on save, not by guessing an expiry: correctness first, freshness second."
  - "Credentials never enter version control, not even briefly: git history retains what a later commit deletes."
  - "Load entities in bulk: `loadMultiple()` over a loop of individual `load()` calls avoids an N+1 query storm."
  - "Long-running work belongs in Batch or Queue API, never a single request that can hit the execution-time limit."

patterns:
  - name: Twig Output Escaping
    description: "Twig auto-escapes all variable output by default. `|raw` disables that protection entirely and reopens cross-site scripting for anything derived from user input; for genuine HTML, render through a text format (`#type => 'processed_text'` in a render array, or `check_markup()` outside one -- see drupal-conventions' Twig Auto-Escaping entry for the render-array construct) instead of bypassing escaping."
    bad_example: |
      {# comment.body may contain unsanitized markup from a webform submission #}
      <div class="comment">{{ comment.body|raw }}</div>
    good_example: |
      {# auto-escaping is sufficient for plain text #}
      <div class="comment">{{ comment.body }}</div>
      {# intentional HTML: comment.body.processed runs the value through the
         text format's filters (equivalent to #type => 'processed_text' /
         check_markup() in PHP) -- never |raw #}
      <div class="comment">{{ comment.body.processed }}</div>

  - name: Plain Text Over Markup
    description: "`#markup` is XSS-filtered against the admin tag list (via `Renderer::ensureMarkupIsSafe`) rather than escaped, so it still permits a broad set of HTML tags and is the wrong choice for untrusted input -- it does not close the same hole Twig's auto-escaping does. Use `#plain_text` for untrusted content, since it escapes; use `Html::escape()` when the value must be interpolated outside a render array."
    bad_example: |
      <?php
      function my_module_build_greeting(string $user_supplied_name): array {
        return ['#markup' => 'Hello, ' . $user_supplied_name . '!'];
      }
    good_example: |
      <?php
      function my_module_build_greeting(string $user_supplied_name): array {
        return ['#plain_text' => 'Hello, ' . $user_supplied_name . '!'];
      }

  - name: Entity Query Access Check
    description: "Implicit access checking on content entity queries was deprecated in Drupal 9.2.0 and throws an error from Drupal 10.0.0 -- on any supported Drupal (10/11) an entity query without an explicit `accessCheck()` fails outright, so this is a correctness requirement, not a lint. `accessCheck(FALSE)` remains legitimate for genuinely internal, non-user-facing queries (a cron sweep that must see every entity regardless of permissions) but must be explicit and commented, never the default because nobody set it. See drupal-conventions' Entity Query pattern for the injected-service shape this call sits inside; this entry owns only the access-check argument."
    bad_example: |
      <?php
      $nids = $this->entityTypeManager->getStorage('node')
        ->getQuery()
        ->condition('status', 1)
        ->execute();
    good_example: |
      <?php
      $nids = $this->entityTypeManager->getStorage('node')
        ->getQuery()
        ->condition('status', 1)
        ->accessCheck(TRUE)
        ->execute();
      // Cron-only sweep: no user session to check against, so bypassing
      // access control is deliberate and documented, not an oversight.
      $all_nids = $this->entityTypeManager->getStorage('node')
        ->getQuery()
        ->accessCheck(FALSE)
        ->execute();

  - name: Render Array Cacheability
    description: "A render array built from entity or query data with no `#cache` metadata either caches forever under an accidental key or never caches at all -- both produce stale or needlessly recomputed content. Declare `tags`, `contexts`, and `max-age` based on what the data actually depends on."
    bad_example: |
      <?php
      $build = ['#theme' => 'item_list', '#items' => $items];
    good_example: |
      <?php
      $build = [
        '#theme' => 'item_list',
        '#items' => $items,
        '#cache' => [
          'tags' => ['node_list', 'taxonomy_term:' . $categoryId],
          'contexts' => ['url.query_args'],
          'max-age' => 3600,
        ],
      ];

  - name: Cache Contexts For Personalized Output
    description: "A cache context is not a performance knob -- it tells the render cache which audience a cached copy is valid for. User-specific content cached without a user context (`user`, `user.roles`, `user.permissions`) is a security leak, not merely a staleness bug: the first visitor's rendered output -- their name, their balance, their private data -- gets served verbatim to every later visitor who hits that cache entry."
    bad_example: |
      <?php
      // Safe against Plain Text Over Markup: @name is a t() placeholder,
      // which Html::escape()s the value even inside '#markup'.
      $build = [
        '#markup' => $this->t('Welcome back, @name', ['@name' => $account->getDisplayName()]),
        '#cache' => ['tags' => ['user:' . $account->id()]],
        // No context: user A's rendered markup is served to user B.
      ];
    good_example: |
      <?php
      // Safe against Plain Text Over Markup: @name is a t() placeholder,
      // which Html::escape()s the value even inside '#markup'.
      $build = [
        '#markup' => $this->t('Welcome back, @name', ['@name' => $account->getDisplayName()]),
        '#cache' => [
          'tags' => ['user:' . $account->id()],
          'contexts' => ['user'],
        ],
      ];

  - name: Cache Tag Invalidation
    description: "A cache tag only helps if something invalidates it. Tag a listing with the entities it lists (Drupal's entity system invalidates entity-based tags automatically on save) rather than relying on `max-age` alone to eventually catch up with edits."
    bad_example: |
      <?php
      // A bare max-age serves outdated results for up to an hour after an
      // editor publishes a new node -- nothing invalidates it sooner.
      $build['#cache']['max-age'] = 3600;
    good_example: |
      <?php
      // Invalidates the moment any listed node changes, independent of max-age.
      $build['#cache']['tags'] = Cache::mergeTags(['node_list'], $listTags);
      $build['#cache']['max-age'] = 3600;

  - name: Credentials Out Of Version Control
    description: "A database password committed to `settings.php` is compromised the moment it lands in a commit, even in a private repository -- and deleting it in a later commit does not fix that, because git history retains every prior version of the file. Removal is cleanup, not remediation; the only remediation is rotating the credential. Keep secrets out of version control from the start."
    bad_example: |
      <?php
      // settings.php, committed to the repository
      $databases['default']['default'] = [
        'database' => 'drupal',
        'username' => 'drupal_user',
        'password' => 'Sup3rSecret!',
        'host' => 'db',
      ];
    good_example: |
      <?php
      // settings.php, committed -- reads from the environment, no secret in git
      $databases['default']['default'] = [
        'database' => getenv('DB_NAME'),
        'username' => getenv('DB_USER'),
        'password' => getenv('DB_PASSWORD'),
        'host' => getenv('DB_HOST'),
      ];
      // settings.local.php supplies real local values and is excluded via
      // .gitignore -- it is never committed.

  - name: Query Efficiency
    description: "Loading entities one at a time inside a loop issues one query per entity -- an N+1 pattern -- where a single `loadMultiple()` call issues one. Add an explicit `range()` to any query that does not need every matching result."
    bad_example: |
      <?php
      $nodes = [];
      foreach ($nids as $nid) {
        $nodes[] = $this->entityTypeManager->getStorage('node')->load($nid);
      }
    good_example: |
      <?php
      $nodes = $this->entityTypeManager->getStorage('node')->loadMultiple($nids);
      $nids = $this->entityTypeManager->getStorage('node')
        ->getQuery()
        ->condition('status', 1)
        ->accessCheck(TRUE)
        ->range(0, 50)
        ->execute();

  - name: Batch And Queue For Long Operations
    description: "Work that iterates over thousands of entities inside one request risks the PHP execution-time limit and ties up a web worker for the duration. Batch API splits the work into request-sized steps with progress feedback; Queue API defers it to a worker process entirely. Neither belongs inline in a controller or form submit handler."
    bad_example: |
      <?php
      public function submitForm(array &$form, FormStateInterface $form_state): void {
        $nids = $this->entityTypeManager->getStorage('node')->getQuery()->accessCheck(TRUE)->execute();
        foreach ($nids as $nid) {
          $this->reindexNode($nid); // thousands of nodes, one HTTP request
        }
      }
    good_example: |
      <?php
      public function submitForm(array &$form, FormStateInterface $form_state): void {
        $nids = $this->entityTypeManager->getStorage('node')->getQuery()->accessCheck(TRUE)->execute();
        $batch = [
          'title' => $this->t('Reindexing content'),
          'operations' => array_map(
            fn (string $nid) => [[static::class, 'reindexNodeBatch'], [$nid]],
            $nids
          ),
        ];
        batch_set($batch);
      }

tooling:
  coding_standards: "phpcs --standard=Drupal,DrupalPractice"
  static_analysis: "phpstan analyse"
  dependency_audit: "composer audit"
  cache_rebuild: "drush cr"

quality_test: "Can a reviewer point at any #markup, |raw, or entity query in this diff and confirm -- without guessing -- that its escaping, access check, and cache metadata are each a deliberate choice?"

references:
  - "amazee.io drupal-agents-md (Vanilla variant), Security & Performance Guidelines / Caching Strategies / Anti-Patterns #3, #6, #7, #10, #11 -- https://github.com/amazeeio/drupal-agents-md/blob/main/Vanilla/AGENTS.md"
  - "Drupal.org: entity query access checking change record -- https://www.drupal.org/node/3201242 -- authoritative for the accessCheck entry above; the amazee.io source states this incorrectly at its line 701 (claims Drupal 10.2/warning-only/mandatory-in-12) and this file deliberately does not follow it -- deprecated in 9.2.0, error thrown from 10.0.0."
  - "See also, for the general coding-convention treatment this file cross-references: Drupal Conventions Styleguide."
  - "packs/built-in/agent_profiles/drupalling-dries.agent.yaml"
