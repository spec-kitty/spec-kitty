schema_version: "1.0"
id: common-docs
title: Common Docs Styleguide
scope: docs
applies_to_languages: []

principles:
  - "Single root, 13 sections. All documentation lives under one Common Docs root with the 13-section structure: index, context, architecture, adr, plans, api, configuration, integrations, security, guides, operations, migrations, changelog. Each directory carries its own index.md. No second documentation root and no per-version shadow tree."
  - "Frontmatter is the per-page source of truth. In-file YAML frontmatter is the sole authority for per-page metadata. The page-inventory rollup is regenerated FROM frontmatter as a freshness-gated lockfile; it is never a parallel hand-maintained store."
  - "Lifecycle key is doc_status, never status. The frontmatter lifecycle key is the namespaced doc_status with the controlled vocabulary draft | active | deprecated | superseded | durable. durable is the reserved, never-retire value for domain throughlines — re-verified on domain change rather than aged out or retired. The bare key status is prohibited in frontmatter because it collides with the work-package lane status model. The freshness date is carried by updated: YYYY-MM-DD."
  - "SEO description is bounded. Frontmatter carries a description string of 50-180 characters (inclusive) consumed by the SEO post-processing step; descriptions outside that band are rejected."
  - "Cross-references use related: resolvable paths. Cross-references are a related: frontmatter list of repo-relative .md paths that each resolve to an existing file. The dead citation_refs sidecar field is not reintroduced."
  - "Audience is named via a resolvable audience: path. Every documentation page touched by a change declares its target reader through an audience: frontmatter field — one resolvable repo-relative .md path (or a list of paths) targeting a persona under docs/context/audience/. This is the machine-checkable form of DIRECTIVE_047's audience-oriented-writing rule. The field is required on touched pages only and is deliberately NOT added to frontmatter_required_fields, so untouched legacy pages are never red-lined for lacking it (C-012)."
  - "ADRs live under adr/<era>/ with YAML frontmatter. Architecture Decision Records are filed under adr/1.x/, adr/2.x/, or adr/3.x/ by era of decision and carry YAML frontmatter so the docsite can index them. The living architectural design collapses into a single unversioned architecture/ location."
  - "Naming is kebab-case and section-scoped. Documentation file and directory names are lowercase kebab-case; ADR filenames keep their dated prefix; one concern per file."
  - "Curate by delete-stale. docs/ is not a wiki: one concern per file; DIRECTIVE_037 (Living Documentation Sync) owns the same-change documentation-update rule; stale or deprecated documents are distilled into a decision (adr/) or design (architecture/) and then retired rather than accumulating."

patterns:
  - name: doc_status namespacing
    description: >
      Use the namespaced doc_status lifecycle key so a documentation lifecycle
      value can never be confused with the work-package lane status term, by a
      reader or by a grep.
    bad_example: |
      ---
      title: Charter Activation
      status: active
      ---
    good_example: |
      ---
      title: Charter Activation
      doc_status: active
      updated: 2026-06-27
      ---
  - name: related cross-reference
    description: >
      Express a cross-reference as a related: list of resolvable repo-relative
      .md paths, validated at build time, rather than the dead citation_refs
      sidecar field.
    bad_example: |
      # in docs/development/3-2-page-inventory.yaml
      citation_refs: []   # populated in only 6 of 565 rows — effectively dead
    good_example: |
      ---
      title: Charter Activation
      doc_status: active
      related:
        - ../architecture/charter-activation.md
        - ../adr/3.x/2026-05-16-1-doctrine-layer-merge-semantics.md
      ---
  - name: audience-resolvable
    description: >
      Name a page's target reader through the audience: frontmatter field whose
      value is a resolvable repo-relative .md path (or a list of paths) into
      docs/context/audience/, validated by the audience resolver, rather than a
      free-text audience note that nothing can check. Required on touched pages
      only.
    bad_example: |
      ---
      title: Merge Workflow
      audience: maintainers   # free text — unresolvable, unverifiable
      ---
    good_example: |
      ---
      title: Merge Workflow
      doc_status: active
      updated: 2026-08-10
      audience: ../context/audience/internal/maintainer.md
      ---

anti_patterns:
  - name: Second documentation root
    description: >
      A second top-level documentation root or a per-version shadow tree
      re-creates the split-brain the Common Docs root exists to cure.
    bad_example: |
      architecture/3.x/...        # one root
      docs/architecture/3x/...    # shadow duplicate of the same content
    good_example: |
      docs/architecture/...       # single living design, unversioned
      docs/adr/3.x/...            # immutable era history only
  - name: Sidecar metadata SSOT
    description: >
      Treating a sidecar inventory as the metadata source of truth forces
      authors to keep a remembered rollup in sync and leaves the published site
      reading a different store than the one being edited.
    bad_example: |
      # 565-row page-inventory.yaml hand-maintained as SSOT;
      # frontmatter generated from it.
    good_example: |
      # Frontmatter is SSOT; page-inventory.yaml is regenerated from it
      # and a freshness gate asserts the committed rollup is in sync.

# Rule -> check mapping table. Every documentation rule names the ONE live
# check that enforces it. Zero rows carry check = none — that is what makes this
# styleguide a checkable artifact rather than narrative.
tooling:
  structure-single-root-section: "the common-docs-structural-lint doctrine asset (the structural lint shipped with this pack) — the durable successor to the retired ratchet. Its shadow_tree_basename check asserts no shared non-nav content basename across section subtrees; its self-test also asserts DIRECTIVE_042 resolves to a loaded directive. The single-root / all-sections-present structure itself remains subject to periodic bulk curation and review, not a per-PR mechanical count."
  adr-era-layout: "the common-docs-structural-lint doctrine asset (the structural lint shipped with this pack) — its point_in_time_placement check allowlists adr/** (era-dated ADRs) so ADRs resolve under adr/<era>/ without churn; the living architecture/ being unversioned is maintained by periodic bulk curation and review."
  naming-kebab-case: "Maintained by periodic bulk curation and review (the retired per-PR docs ratchet asserted this mechanically; the common-docs-structural-lint doctrine asset does not currently assert kebab-case naming)."
  curation-delete-stale: "Maintained by periodic bulk curation and review; the common-docs-structural-lint doctrine asset's shadow_tree_basename and point_in_time_placement checks catch two concrete drift classes (duplicated non-nav basenames and misplaced dated/point-in-time files) but curation itself remains a review-time practice, per DIRECTIVE_037's same-change discipline."
  frontmatter-doc-status: "The page-inventory lockfile freshness gate reads frontmatter REPORT-ONLY (it regenerates the rollup FROM frontmatter and reds on drift). It does not yet assert the doc_status controlled vocabulary or reject a bare status key."
  frontmatter-ssot-lockfile: "The page-inventory lockfile freshness gate (asserts the rollup is regenerated FROM frontmatter and the committed lockfile is in sync)."
  frontmatter-seo-description: "The page-inventory lockfile freshness gate (asserts every description is 50-180 characters)."
  related-resolvable-paths: "The related: path validator (asserts every related: entry resolves to an existing repo-relative .md path)."
  audience-resolvable: "The audience: path resolver — asserts every audience: value on a touched page resolves to an existing repo-relative .md persona under docs/context/audience/. Non-vacuous: reuses assert_examined_floor (min_files >= the count of audience-tagged pages; fails on 0 examined) and emits checked_count; runs strict on pull requests (exit 1 on any dangling reference). Scoped to touched pages only — never added to frontmatter_required_fields."

quality_test: >
  A documentation change satisfies this styleguide when: the
  common-docs-structural-lint doctrine asset (the structural lint shipped with
  this pack) is green — index completeness for
  curated-complete sections (initially architecture/ only), point-in-time file
  placement under plans/** honoring the adr/**, plans/research/**, and
  plans/investigations/** allowlist, no shared non-nav content basename across
  section subtrees, and required frontmatter on in-scope pages; the
  page-inventory lockfile freshness gate is green — the rollup regenerates
  FROM frontmatter with no drift, and every description is within 50-180
  characters (the doc_status controlled vocabulary and the bare-status rejection
  are read REPORT-ONLY); and the related: path validator resolves every
  cross-reference.

# The machine-parseable structural_lint_config:
# policy block that used to live here has moved to the lint asset's own data
# file, packs/built-in/assets/docs_structural_lint.config.yaml — owned by
# the lint asset, not by this styleguide. The loader contract is unchanged
# (the pinned wrapper key structural_lint_config: still resolves through
# --styleguide PATH / SPEC_KITTY_STYLEGUIDE); only the file the BUILT-IN
# DEFAULT is loaded from has moved. A project that needs a different policy
# keeps its own styleguide or data file carrying that block, as this
# repository's own maintainer override already does (unaffected by this move).

references:
  - packs/built-in/directives/042-common-docs.directive.yaml
  - packs/built-in/tactics/common-docs-scaffold.tactic.yaml
  - packs/built-in/tactics/common-docs-write.tactic.yaml
  - packs/built-in/tactics/common-docs-find.tactic.yaml
  - packs/built-in/assets/docs_structural_lint.config.yaml
