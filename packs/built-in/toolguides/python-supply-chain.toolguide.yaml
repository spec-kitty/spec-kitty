summary: >
  Ecosystem-specific commands and file names for the Python pip/uv/poetry
  stack: lockfile-driven reproducible installs, hash pinning, and index
  pinning. This guide carries the mechanics; the
  `supply-chain-install-safety` tactic (ecosystem-neutral) owns the checklist
  shape and the evidence a reviewer requires.
commands:
  - uv lock
  - uv sync --locked
  - uv pip compile --generate-hashes
  - pip install --require-hashes
  - poetry lock
  - poetry sync
