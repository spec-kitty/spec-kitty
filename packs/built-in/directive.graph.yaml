  reason: Disciplined refactoring suggests Extract First-Order Concept when the smell is a hidden/duplicated concept that should be named; the `when` is the tactic's own stated applicability. Composition-only under today's traversal.
- source: directive:DISCIPLINED_REFACTORING
  target: tactic:refactoring-move-field
  relation: suggests
