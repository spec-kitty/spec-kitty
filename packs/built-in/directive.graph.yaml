  reason: Disciplined refactoring suggests Encapsulate Record when the smell is an unencapsulated data record; the `when` is the tactic's own stated applicability. Composition-only under today's traversal.
- source: directive:DISCIPLINED_REFACTORING
  target: tactic:refactoring-encapsulate-variable
  relation: suggests
  when: a widely-accessed module-level or global variable (or public class attribute) is read and written from many locations and needs a single chokepoint for monitoring, validation, or a later change of type
  reason: Disciplined refactoring suggests Encapsulate Variable when the smell is a globally-accessed variable with no chokepoint; the `when` is the tactic's own stated applicability. Composition-only under today's traversal.
- source: directive:DISCIPLINED_REFACTORING
  target: tactic:refactoring-extract-first-order-concept
