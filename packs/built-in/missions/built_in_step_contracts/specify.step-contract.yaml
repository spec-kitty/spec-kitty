schema_version: "1.0"
id: specify
action: specify
mission: software-dev
steps:
  - id: bootstrap
    description: Load charter context for this action
    command: "spec-kitty charter context --action specify --json"

  - id: capture_intent
    description: >
      Conduct or verify the human discovery interview, then capture confirmed
      user intent
    delegates_to:
      kind: directive
      candidates:
        - DIRECTIVE_010
        - DIRECTIVE_037
  - id: map_examples
    description: Capture concrete rules, examples, and open questions for the behavior slice
    delegates_to:
      kind: procedure
      candidates:
        - example-mapping-workshop

  - id: validate_requirements
    description: Validate requirements against spec fidelity rules
    delegates_to:
      kind: tactic
      candidates:
        - requirements-validation-workflow

  - id: document_decisions
    description: Record any design decisions made during specification
    delegates_to:
      kind: directive
      candidates:
        - DIRECTIVE_003
  - id: write_spec
    description: Write spec.md to kitty-specs/{mission_slug}/
    command: "Write spec.md in kitty-specs/{mission_slug}/"

  - id: commit_spec
    description: Commit the specification to the planning branch the CLI reports
    delegates_to:
      kind: directive
      candidates:
        - DIRECTIVE_029
        - DIRECTIVE_033