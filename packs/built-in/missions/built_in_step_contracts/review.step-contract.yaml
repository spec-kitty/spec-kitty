schema_version: "1.0"
id: review
action: review
mission: software-dev
gates:
  - on_transition: "in_progress->for_review"
    handler: "spec-kitty-pre-review"
    handler_kind: "mission_step_contract"
    schema_version: "1.0"
    fail_open: true
    provenance: "built-in"
steps:
  - id: bootstrap
    description: Load charter context for this action
    command: "spec-kitty charter context --action review --json"
    inputs:
      - flag: --profile
        source: wp.agent_profile
        optional: true
      - flag: --tool
        source: env.agent_tool
        optional: true

  - id: verify_spec_fidelity
    description: Verify implementation matches specification intent
    delegates_to:
      kind: directive
      candidates:
        - 010-specification-fidelity-requirement
        - 037-living-documentation-sync

  - id: verify_example_sync
    description: Verify canonical examples, acceptance checks, and docs stayed in sync
    delegates_to:
      kind: tactic
      candidates:
        - usage-examples-sync

  - id: assess_intent_and_risk
    description: Evaluate changes for intent alignment and risk
    delegates_to:
      kind: tactic
      candidates:
        - review-intent-and-risk-first

  - id: supply_chain_security_review
    description: >
      Require explicit supply-chain evidence (registry authenticity,
      package freshness, lifecycle-script disposition, Node Active LTS
      posture, incident/IoC posture) before recommending approval for any
      change that touches the dependency tree. Advisory in v1 per
      NFR-003/C-003: this step does not add a new fail-closed transition
      gate -- the existing "in_progress->for_review" gate above is
      unchanged -- but silence or an unexamined default is treated as a
      gap in evidence, not a pass.
    delegates_to:
      kind: tactic
      candidates:
        - supply-chain-install-safety

  - id: quality_gate
    description: Verify tests pass and type checks succeed
    delegates_to:
      kind: directive
      candidates:
        - 030-test-and-typecheck-quality-gate

  - id: verify_stopping_conditions
    description: Check that work has reached completion criteria
    delegates_to:
      kind: tactic
      candidates:
        - quality-gate-verification
        - stopping-conditions

  - id: status_transition
    description: Move WP to approved or request changes
    command: "spec-kitty agent tasks move-task {wp_id} --to approved"
    guidance: >
      If changes are needed, move to in_progress with a reason.
      If review passes, move to approved with evidence. Merge later records done.
