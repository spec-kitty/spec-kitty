# Expected artifact manifest for plan mission
#
# Defines which artifacts are required/optional at each plan-mission step.
#
# Step keys are the RUNTIME ACTION IDS of the plan step contracts
# (missions/built_in_step_contracts/plan-*.step-contract.yaml):
# specify / research / plan / review. The runtime guard dispatches on these
# action ids and gathers artifact presence from this manifest, so keying it on
# another vocabulary (the old goals/structure/draft/done phase names) makes a
# committed artifact read as absent and the step block without naming a path.
#
# `review` gates on an approval gate, not a filesystem artifact, so it carries
# no required-artifact entry.

schema_version: "1.0"
mission_type: "plan"
# manifest_version is a sync-namespace identity key (feeds NamespaceRef), not
# a content-freshness counter; kept at "1" per
# kitty-specs/expected-artifacts-manifest-repair-01KZY498/tracer-design-decisions.md
# Decision 2.
manifest_version: "1"

# Artifacts required regardless of mission step
required_always: []

# Artifacts required at specific mission steps (keys = runtime action ids)
required_by_step:
  specify:
    # The plan `specify` action produces the decision-shaped spec.
    - artifact_key: "output.spec.main"
      artifact_class: "output"
      path_pattern: "spec.md"
      blocking: true

  research:
    - artifact_key: "evidence.research"
      artifact_class: "evidence"
      path_pattern: "research.md"
      blocking: true

  plan:
    - artifact_key: "output.plan.main"
      artifact_class: "output"
      path_pattern: "plan.md"
      blocking: true

  review:
    # Approval gate, not a filesystem artifact: no required-artifact entry.
    []

# Artifacts optional throughout the mission
optional_always: []
