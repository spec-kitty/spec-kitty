schema_version: "1.0"
id: migrate-project-guidance-to-spec-kitty-charter
name: Migrate Project Guidance to Spec Kitty Charter
purpose: >
  Convert an existing project guidance or charter document into
  doctrine-backed governance artifacts that can be compiled into a
  Spec Kitty charter bundle with functional parity.
entry_condition: >
  A project has an existing guidance document, charter, or operating
  policy that must be preserved during migration to Spec Kitty.
exit_condition: >
  The legacy guidance has been decomposed into doctrine artifacts, curated
  into the active catalog, activated through mission defaults or agent
  profiles, and verified through compiled charter output. Every term the
  source defines or uses with a specific meaning is in the project glossary
  at the right scope, or intentionally excluded with a stated reason. All
  generated/curated artefacts are internally consistent, use the glossary
  surfaces verbatim, and are retrievable through the charter offering's
  repository classes.
steps:
  - title: Inventory the source guidance
    description: >
      Read the legacy guidance document end to end, list every rule,
      workflow, constraint, and tool preference, and separate mandatory
      behavior from explanatory narrative.
    actor: human
  - title: Classify each guidance item by doctrine artifact type
    description: >
      Map each item to the best doctrine target: directive for obligations,
      tactic for reusable how-to behavior, styleguide for conventions,
      toolguide for tool-specific rules, paradigm for high-level posture,
      and procedure for multi-step operational workflows. Prefer the
      directive+tactic pairing when a policy also requires a repeatable
      execution method and not just a static rule.
    actor: agent
  - title: Capture the source vocabulary in the glossary
    description: >
      Before drafting, extract every term the source defines or uses with a
      specific meaning — severity levels, role names, system and environment
      names, canonical verbs, named gates — and record each in the project
      glossary seed for the narrowest scope that owns it: team_domain for the
      team's own conventions, audience_domain for industry or regulatory terms
      the source takes as given. Run the glossary-maintenance-workflow
      procedure for the triage: accept, reject with reason, or defer with an
      owner. A term that already exists in a broader scope with a different
      sense is recorded in the narrower scope and the conflict surfaced, never
      overwritten. The accepted surfaces are the vocabulary the drafted
      artifacts must use verbatim.
    actor: agent
    on_failure: >
      If the source is inconsistent with itself about a term, do not pick a
      sense silently; record both as candidates and escalate to the guidance
      owner before drafting artifacts that depend on it.
  - title: Draft doctrine artifacts in proposed state
    description: >
      Create candidate doctrine YAML artifacts for every classified item,
      preserving the original behavior while rewriting it into doctrine-native
      fields and cross references. Where a legacy section mixes policy and
      execution detail, split it into a directive for the requirement and a
      tactic for the operational method.
    actor: agent
  - title: Wire cross-artifact references
    description: >
      Connect directives to tactics, tactics to styleguides, toolguides, and
      procedures, and add any needed profile or mission-default activation
      targets so the compiled charter can surface the migrated behavior.
    actor: agent
  - title: Curate and promote accepted artifacts
    description: >
      Review the proposed artifacts through the doctrine curation workflow,
      revise weak candidates, and promote accepted artifacts into the shipped
      set used by charter compilation.
    actor: human
  - title: Activate migrated guidance in mission defaults
    description: >
      Update charter interview defaults, profile-aware governance
      selection, or mission-specific defaults so the migrated artifacts are
      actually selected during compilation.
    actor: agent
  - title: Compile and compare for functional parity
    description: >
      Generate a charter bundle from the migrated artifacts, compare the
      resulting obligations and referenced guidance against the legacy source,
      confirm every defined term resolves in the glossary, and record any
      remaining behavior or vocabulary gaps.
    actor: agent
  - title: Close remaining gaps
    description: >
      Add or revise doctrine artifacts until every material rule from the
      legacy guidance is either activated in the compiled charter or
      intentionally retired with rationale.
    actor: human
references:
  - type: procedure
    id: glossary-maintenance-workflow
    reason: >
      The vocabulary-capture step is an instance of the glossary maintenance
      workflow applied at migration time, so the source's terms are triaged
      into the glossary before artifacts that depend on them are drafted.
  - type: directive
    id: DIRECTIVE_003
  - type: directive
    id: DIRECTIVE_010
  - type: directive
    id: DIRECTIVE_018
