schema_version: "1.0"
id: DIRECTIVE_051
title: Supply-Chain Install Safety
intent: >
  Install-time and dependency-resolution decisions must be evaluated against a
  threat-CLASS model, not a static package denylist. Worm-style supply-chain
  compromises (credential-harvesting postinstall scripts, typosquatted or
  namespace-confused packages, rapid-republish attacks during an active
  incident window) recur across ecosystems faster than any hand-maintained
  list of bad package/version pairs can track. Agents and mission workflows
  must therefore default to five ecosystem-neutral threat-class controls for
  every dependency addition or upgrade, stated once here, never restated
  below, and never restated by any other artifact that cites this directive:
  (1) registry authenticity — the resolved package and version must come
  from the ecosystem's approved official registry, not an unexpected mirror
  or namespace; (2) package freshness — first-publish and
  latest-publish/update timestamps must be surfaced so an operator can see
  when a version is suspiciously new or was substantially reworked; (3)
  deny-by-default lifecycle-script approval — install-time hook scripts are
  never auto-approved and must be explicitly allowlisted with a documented
  justification when required for a legitimate native build; (4)
  lockfile-driven installs — the ecosystem's lockfile is the source of truth
  for a reproducible install, and automation uses a frozen/CI install mode so
  an unreviewed dependency-tree change cannot silently slip in; (5)
  incident-list and IoC/persistence posture — known active-incident
  package/version lists and indicator-of-compromise or persistence patterns
  (unexpected install-script network calls, credential/token exfiltration
  attempts, self-propagating install behavior) are treated as class-level
  risk signals to check for, with CAS/vendor incident feeds as the external
  authority of record — this directive never hardcodes specific incident
  package names or versions as core truth, because that list changes faster
  than doctrine can be re-authored. The concrete, per-ecosystem commands and
  file names for these five controls live in the ecosystem-neutral
  `supply-chain-install-safety` tactic and the per-ecosystem toolguides it
  points to (for example the JavaScript/TypeScript and Python toolguides),
  never in this directive.
enforcement: required
scope: >
  Applies whenever a software-dev mission adds, upgrades, or reviews a
  dependency during `plan`, `implement`, or `review`, across any package
  ecosystem (JavaScript/TypeScript, Python, Java, and others as applicable).
  It governs the checks an implementer must perform before accepting a new or
  changed dependency and the evidence a reviewer must require before
  approving a change that touches the dependency tree. This directive is
  advisory at the transition-gate level in v1: it does not introduce a new
  fail-closed transition-gate handler, and workflow wiring must not silently
  hard-block on it. It DOES require visibility and explicit evidence —
  silence or an unexamined default is not compliance.
procedures:
  - "Run the ecosystem-neutral `supply-chain-install-safety` tactic's
    checklist for every dependency addition, upgrade, or review, using the
    ecosystem toolguide it references (for example JavaScript/TypeScript or
    Python) for the exact commands and file names."
  - "Record evidence, not just a pass/fail impression: implementer and
    reviewer outputs must capture what was checked and the resulting
    decision for each of the five threat-class controls in `intent`, so a
    later reviewer or operator does not have to re-derive the analysis."
integrity_rules:
  - "None of the five threat-class controls stated in `intent` may be
    silently skipped; an unexamined default is a gap in evidence, not a
    pass."
  - "An adverse result from any control in `intent` (an unexpected registry
    or namespace, a suspiciously new or reworked version, an
    un-allowlisted install-time hook, lockfile drift, or an active-incident
    match) is never silently accepted; it requires explicit operator
    acknowledgment before the change proceeds."
  - "Blanket enablement of install-time hook scripts is a violation of this
    directive, not a valid workaround, even when it unblocks one
    dependency's legitimate native build."
  - "This directive must remain threat-class based. Hardcoding a specific
    incident package name or version number as core doctrine truth is
    prohibited — cite the CAS/vendor incident feed consulted instead."
  - "This directive does not introduce a new fail-closed transition-gate
    handler in v1. Workflow wiring that consumes this directive must keep it
    advisory at the gate level while still requiring explicit visibility and
    evidence — omitting the check entirely is not an acceptable
    interpretation of 'advisory'."
validation_criteria:
  - "Software-dev mission guidance for plan/implement/review references this
    directive (directly or via the `supply-chain-install-safety` tactic) for
    any change that adds, upgrades, or removes a dependency."
  - "Implementer and reviewer evidence for a dependency change documents a
    result for every control named in `intent` — an unexamined default is
    treated as a gap, not a pass."
  - "No dependency change is accepted with an unreviewed non-default
    install-time hook script or an unacknowledged reproducibility gap."
  - "No hardcoded incident-specific package name/version list is introduced
    into this directive as core truth; CAS/vendor incident feeds remain the
    external authority referenced."
references:
  - type: directive
    id: DIRECTIVE_001
  - type: tactic
    id: dependency-hygiene
  - type: tactic
    id: supply-chain-install-safety
