schema_version: "1.0"
id: avoid-gold-plating
name: Avoid Gold Plating
purpose: >
  Challenge a proposed implementation or design for unnecessary complexity by
  asking whether each abstraction or feature addresses a current, observed need.
  Keeps implementation effort proportional to scope, reduces cyclic complexity,
  and guards against speculative over-engineering that wastes time and calcifies
  into technical debt.
references:
  - name: Easy-to-Change Design Review
    type: tactic
    id: easy-to-change
    when: >
      After confirming the design is not gold-plated, use easy-to-change to verify
      that the simpler design still supports anticipated future change.
  - name: Reconciling Change-Scope Tensions
    type: directive
    id: RECONCILE_CHANGE_SCOPE_TENSIONS
    when: >
      Once this tactic's evidence gate accepts an added complexity, the SIZE
      of the resulting change is a separate scope decision reconciled
      through this directive.
  - name: Locality of Change
    type: directive
    id: DIRECTIVE_024
    when: This tactic is the practical application protocol for Directive 024; use the directive for policy, this tactic for evaluation procedure
  - name: Architectural Integrity Standard
    type: directive
    id: DIRECTIVE_001
    when: Proposed changes that expand architectural scope must pass the integrity standard check
steps:
  - title: Identify abstractions and generalisations introduced
    description: >
      List every abstraction layer, configurable hook, generic interface, or
      optional extension point in the proposed design that goes beyond what the
      immediate requirements demand. Do not pre-judge; just surface them.
  - title: Apply the "is this needed now?" test
    description: >
      For each item identified, ask: "Is this solving a problem that exists right
      now?" and "If the future requirement materialises, could it be addressed
      at that time with reasonable effort?" If both answers are yes-and-yes, the
      abstraction is likely premature.
    examples:
      - "A plugin registry for a feature that currently has one implementation — premature."
      - "A configurable timeout because the ops team has already requested per-environment tuning — justified."
  - title: Assess reversibility
    description: >
      Ask: "If we ship the simpler version now and the requirement does arrive,
      how hard is the refactor?" For easily reversible changes, defer. For
      changes that calcify quickly (public API, database schema, wire format),
      a small upfront investment may be justified despite current absence of need.
  - title: Park and note, do not discard
    description: >
      When an abstraction is identified as premature, park the idea in a design
      note or ADR rather than implementing it. Record the reasoning so the idea
      is not lost and can be revisited when the need actually surfaces.
  - title: Validate the simplified design
    description: >
      Confirm the stripped-back design still meets all current requirements and
      adheres to the project's minimum clean-code bar (readability, naming,
      test coverage). Avoiding gold plating is not a licence to skip quality.
  - title: Apply the evidence-gate checklist before accepting added complexity
    description: >
      This is the single threshold this tactic owns for accepting an
      abstraction or generalisation beyond what current requirements demand;
      other tactics reference it rather than restating their own bar.
      Proceed with the added complexity only if 5+ of these 7 apply:
      (1) Can you point to 3+ real instances where the current, simpler
      approach failed? (2) Have you quantified the impact? (3) Have you
      evaluated "do nothing" as an option? (4) Have you explored simpler
      alternatives first? (5) Does the change preserve or enhance core
      architectural values? (6) Are you not prescribing too early? (7) Does
      the change achieve significant value at proportional cost? Record the
      accept/reject decision together with the do-nothing baseline and the
      alternatives considered, documented per DIRECTIVE_003 (decision
      documentation), which the review action delivers. An added complexity that conflicts with an
      existing ADR must propose to supersede that ADR or be rejected. Apply
      this gate to small additions too, not only large ones.
    examples:
      - "5/7 checks apply: 4 real failures logged, impact quantified, do-nothing evaluated and rejected, simpler alternatives explored, and the change preserves architectural values -- proceed."
      - "Only 2/7 checks apply and there is no evidence of 3+ real failures -- defer the abstraction and note it in a design note instead."
failure_modes:
  - "Complexity creep — each small addition looks reasonable in isolation, but the cumulative effect degrades simplicity; apply this gate to small changes too."
