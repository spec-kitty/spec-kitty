schema_version: "1.0"
id: supply-chain-install-safety
name: Supply-Chain Install Safety Checklist
purpose: >
  Provide the concrete, ecosystem-neutral checklist that turns
  DIRECTIVE_051's five threat-class pillars into checks an implementer runs
  before accepting a dependency change and evidence a reviewer requires
  before approving one. Apply whenever a mission adds, upgrades, or removes
  a dependency during `plan`, `implement`, or `review`, in any package
  ecosystem — the checklist below is executed, not merely acknowledged; each
  step produces a recorded result, not an aspirational statement of intent.
  This tactic states the concept and the evidence shape each step must
  produce; the exact commands, file names, and runtime-version conventions
  differ per ecosystem and live in the matching toolguide (for example the
  JavaScript/TypeScript toolguide, or the Python toolguide). This tactic is
  advisory at the transition-gate level in v1 (no new fail-closed handler is introduced),
  but the checklist itself is not optional: an unexamined default counts as
  a gap in evidence, not a pass.
steps:
  - title: Run the registry existence/authenticity check
    description: >
      Confirm the resolved package and version exist on the ecosystem's
      approved official registry and not an unexpected mirror, proxy, or
      typosquatted namespace. Record the resolved registry host as evidence.
      If resolution is ambiguous or unexpected, stop and escalate to the
      operator instead of proceeding. See the matching ecosystem toolguide
      for the exact resolution command.
    examples:
      - "Evidence line: \"registry check: <package>@<version> resolves on
        <approved registry host> — OK\""

  - title: Produce a freshness report
    description: >
      Record first-publish and latest-publish/update timestamps for the
      resolved version. Flag any version published within a short window
      (e.g. days) of the current date, or published during a known active
      incident window, as an elevated-risk signal requiring explicit operator
      acknowledgment rather than silent acceptance. See the matching
      ecosystem toolguide for the exact command that surfaces these
      timestamps.
    examples:
      - "Evidence line: \"freshness: <package>@<version> published 2026-08-01
        (5 days old) — flagged for operator review\""

  - title: Confirm no automatic install-time hook script execution occurred
    description: >
      Install-time hook scripts (the ecosystem's `preinstall`/`install`/
      `postinstall`-equivalent) are deny-by-default. Verify none were
      auto-executed for the new or changed dependency. If a hook script is
      genuinely required (a legitimate native build), confirm it is an
      explicit, scoped allowlist entry with a documented justification —
      never a blanket safety bypass. Record the disposition (no script
      present / script present and denied / script present and explicitly
      allowlisted with justification). See the matching ecosystem toolguide
      for the safe-install command that skips hook scripts by default.
    examples:
      - "Evidence line: \"install-time hooks: <package> ships one; NOT
        allowlisted; build succeeds without it — denied by default\""

  - title: Confirm a lockfile-driven, reproducible install
    description: >
      Commit and rely on the ecosystem's lockfile for a reproducible
      install, and use the ecosystem's frozen/CI install mode in automation
      so an unreviewed dependency-tree change cannot silently slip into a
      build. Review lockfile diffs the same way manifest diffs are
      reviewed — a lockfile-only change can still introduce a new transitive
      dependency or resolve to a different version. See the matching
      ecosystem toolguide for the lockfile's file name and frozen-install
      command.
    examples:
      - "Evidence line: \"lockfile: <lockfile name> updated and reviewed;
        frozen/CI install mode used — reproducible\""

  - title: Run IoC/persistence posture checks
    description: >
      Check the package (and any changed transitive dependencies) against
      current CAS/vendor supply-chain incident feeds — the external
      authority of record — and watch for class-level indicators of
      compromise: unexpected network calls from install-time hook scripts,
      credential/token exfiltration attempts, or self-propagating
      (worm-style) install behavior. Do not embed a static incident
      package/version list in the mission artifact; cite the external
      feed(s) consulted instead.
    examples:
      - "Evidence line: \"IoC/incident check: consulted <CAS/vendor feed
        name>, no active-incident match for <package>@<version>; no
        anomalous install-script network activity observed\""

  - title: Capture review evidence in the required shape
    description: >
      Before recommending approval, confirm the change's evidence trail
      includes a result for every control DIRECTIVE_051 names: registry,
      freshness, install-time hook scripts, lockfile reproducibility, and
      incident/IoC posture. A missing or unexamined control is a gap to
      close before approval, not something to wave through because the
      mission is otherwise advisory in v1.
    examples:
      - "Evidence line: \"supply-chain checklist: all five controls
        recorded — approved\""

  - title: Disposition any adversarial-squad or reviewer challenge explicitly
    description: >
      When an adversarial-squad pass or a reviewer challenges a supply-chain
      finding or assumption made during this checklist, record an explicit
      disposition for the challenged finding — never drop it silently. The
      disposition vocabulary and the evidence each disposition must carry
      are owned by the findings-disposition contract of the
      `adversarial-squad-deployment` procedure; apply that contract as
      written rather than a paraphrase (load it with
      `spec-kitty charter context --include procedure:adversarial-squad-deployment`).
      Every disposition must be traceable to
      a specific evidence_location (file/section) in the mission artifact.
    examples:
      - "Disposition: finding_id=SC-01, challenge_summary=\"freshness
        threshold too lax for a Tier-1 dependency\", source=adversarial
        pass, disposition=changed, evidence_location=\"review notes
        §Supply-Chain Evidence\""
      - "Disposition: finding_id=SC-02, challenge_summary=\"an unreviewed
        install-time hook should block merge\", source=reviewer challenge,
        disposition=deferred_with_rationale, rationale=\"v1 remains advisory
        per C-003; tracked as follow-up\", evidence_location=\"tasks/WPxx
        history\""

failure_modes:
  - "Treating the checklist as aspirational prose — writing 'we should check
    the registry' instead of actually running the check and recording the
    result is not compliance."
  - "Silently dropping a challenged finding — an adversarial-squad or
    reviewer challenge that never receives a recorded disposition under the
    findings-disposition contract is a governance gap, not a neutral
    outcome."
  - "Using v1's advisory posture as license to skip evidence entirely —
    advisory means no new fail-closed transition gate, not 'the checklist is
    optional'."
  - "Hardcoding a specific incident package/version into this tactic instead
    of citing the external CAS/vendor feed consulted — the checklist must
    stay reusable as incidents change."
  - "Globally bypassing install-time hook-script safety to save time on one
    dependency, silently re-enabling automatic script execution
    project-wide."
  - "Editing a lockfile by hand, or ignoring a lockfile diff during review —
    lockfile drift can introduce an unreviewed transitive dependency."

references:
  - name: Supply-Chain Install Safety Directive
    type: directive
    id: DIRECTIVE_051
    when: This checklist operationalizes the policy pillars defined by the supply-chain-install-safety directive
  - name: Secure Design Checklist
    type: tactic
    id: secure-design-checklist
    when: Supply-chain install safety is a specialization of Fail-Safe Defaults (deny by default) applied to dependency install-time hook scripts
  - name: Adversarial Squad Deployment
    type: procedure
    id: adversarial-squad-deployment
    when: Use adversarial-squad challenge passes at plan/research and review point-cuts for security-impacting dependency decisions, and disposition every contested finding explicitly
  - name: JavaScript/TypeScript Supply-Chain Install Safety
    type: toolguide
    id: javascript-supply-chain
    when: Use for the exact ecosystem commands and file names behind this checklist's steps in a JavaScript/TypeScript project
  - name: Python Supply-Chain Install Safety
    type: toolguide
    id: python-supply-chain
    when: Use for the exact ecosystem commands and file names behind this checklist's steps in a Python project
  - name: Java Supply-Chain Install Safety
    type: toolguide
    id: java-supply-chain
    when: Use for the exact ecosystem commands and file names behind this checklist's steps in a Java project
