schema_version: "1.0"
id: executive-debrief-generation
name: Executive Debrief Generation
purpose: >
  The maintainer workflow for producing an executive debrief — a
  "WTF happened since <T>" window report or a "WTF is up with <milestone>"
  scope report — over one or more repositories. It is a three-stage pipeline:
  a deterministic collector reads the facts from GitHub, the maintainer
  synthesizes them under the executive-debrief styleguide, and a renderer
  produces the branded PDF. The styleguide defines two layouts: a one-pager
  (a fixed slot contract filled into the debrief template) and a long-form
  debrief (one Markdown file rendered by the spec-kitty-branded-pdf
  generator). It is lighter and more data-driven than the
  project-evolution-postmortem, and it is run as a governed dispatch Op, not
  a Mission (DIRECTIVE_053).
entry_condition: >
  A maintainer has been asked what happened over a window, or what the state of
  a milestone/label is. The scope is expressible as either a time window (since
  a date/tag, converted to UTC) or a milestone/label/query, and the target
  repositories are known.
exit_condition: >
  A branded debrief PDF exists whose every count and every issue/PR reference
  traces to a collected file (one-pager: the renderer's ref-guard passed;
  long form: the writer's ref check against the collector output and the
  named supplemental files passed), whose Method states the exact scope and
  as-of, which names its readers, and which follows the
  executive-debrief styleguide for shape and report-writing for voice. The Op is
  closed with its real outcome; scratch inputs live in the gitignored work/ dir.
  Nothing from the debrief is committed to a product repository: the PDF and
  its inputs are handed to the operator, and only durable findings, when kept
  at all, land as a short Markdown note in the planning repository.
steps:
  - title: Fix the scope and pick the mode
    description: >
      Decide window mode (a time range: "since Friday", a tag, a quarter) or
      scope mode (a milestone, a label, a query). For window mode convert the
      local time to UTC — Brussels is CEST/UTC+2 until late October. Name the
      target repositories; add the planning repo only when the request covers it.
      Record who the debrief is for, as the requester named them. Pick the
      layout: the one-pager when counts and a few labelled clusters answer the
      question, the long form when the readers need a mechanism explained, a
      trend shown or a decision prepared.
      Open the work as a governed dispatch Op; a debrief is an Op, not a Mission.
    actor: agent
  - title: Collect the facts deterministically
    description: >
      Run the debrief collector asset (spec-kitty doctrine asset path
      debrief-collector; packs/internal/assets/debrief/collect-debrief.py) in
      the chosen mode with GITHUB_TOKEN unset so it uses the keyring token. Window
      mode takes the repositories and a UTC range, for example `collect-debrief.py
      window --repo spec-kitty/spec-kitty --since 2026-09-26T06:00:00Z --until
      2026-09-28T05:50:00Z --out work/debrief.json`; scope mode takes a milestone,
      label or query, for example `collect-debrief.py scope --repo
      spec-kitty/spec-kitty --milestone 11 --out work/milestone.json`. Repeat
      --repo for each repository. It emits one JSON document: meta (mode,
      filters, main SHAs, a generated method line), metrics (the tiles), authors,
      pull_requests, closed_issues, open_issues, and valid_refs (every #ref it
      saw). That document is the sole input to synthesis. Never count by hand;
      the collector owns every number and every reference. If a gh query fails,
      it fails closed; do not paper over a missing count.
      A long-form debrief may need facts the collector does not return (open
      P0s, milestone counts, nightly runs, git statistics, file sizes). Read
      each with gh or git into a file under raw/ beside the collector output,
      and name those files in the appendix. A supplemental fact that was not
      saved to a file does not go in the report.
    actor: agent
    on_failure: >
      If a metric or query cannot be gathered, record it as unavailable with the
      reason in the Method footer rather than estimating it.
  - title: Synthesize
    description: >
      Load the review context first: spec-kitty charter context --action
      review --include agent-profile:synthesizer-sam --include
      agent-profile:comms-cleo. Read only the collected files. Apply the
      launch-blocker customer-impact lens (a release or MVP report foregrounds
      defects that reach consumers and fail silently) and the issue-valuation
      rubric (irreversibility, silence, blast radius), and the
      executive-debrief styleguide: write the lede, the tiles (from metrics),
      the SHIPPED/WATCH highlights, four-to-six clustered sections, and — window
      mode: the decision table, release mode: "what it takes to tag". Name the
      "silent and exit 0" class where it fits. Take author attribution from the
      PR author field, never from a guess. Say "closed", not "fixed", for a
      specific issue whose collected verified_fixed value is null (GitHub's
      state_reason is not proof of a shipped fix). In scope mode, mark impact
      tags as a preliminary read of each issue's own description until checked
      against the code, and offer a research-squad verification pass before
      dropping that caveat. Every #ref written must be in the collector's
      valid_refs. For the one-pager, produce exactly the slot object documented
      in docs/development/reporting/debrief-styleguide.md under "One-pager slot
      contract", and nothing else. For the long form, write one Markdown file in
      the styleguide's order: executive summary (bottom line, headline table,
      what happened, what we need from leadership), lettered parts, open risks,
      appendix. Write the summary for the least technical named reader. Before
      rendering, check that every #ref in the Markdown appears in the collector
      output or in a file under raw/, and verify each claim that is not a
      plain count (an owner, an author, "N PRs touch X") against those files.
    actor: agent
    on_failure: >
      If a load-bearing claim cannot be tied to a collected fact, cut it rather
      than shipping an unattributed assertion.
  - title: Render the branded PDF
    description: >
      One-pager: fill the debrief template with the renderer
      (the debrief-renderer asset; packs/internal/assets/debrief/render-debrief.py
      with --synthesis, --collector and --out), which enforces the ref-guard and
      fails closed on any invented reference, then print the HTML to PDF with a
      headless browser. The template, the logo and the Falling Sky fonts sit
      beside the renderer in packs/internal/assets/debrief/ and the template
      loads them by relative path, so keep them together when you copy the
      template elsewhere. Do not restyle the template per report; the
      consistency is the point. It uses its own structured renderer
      because its dashboard layout (metric tiles, pill-tagged cluster cards) is
      not Markdown prose. Long form: render the Markdown with the
      spec-kitty-branded-pdf generator (packs/internal/assets), which needs pandoc,
      WeasyPrint and the sibling spec-kitty-design repository, passing the
      cover through --eyebrow, --title, --subtitle, --lede, --footer-center and
      three --meta chips (AS OF, SCOPE, FOR). Do not hand-build a cover, a
      footer or a stylesheet. The generator draws a first-level heading as a
      part title and a second-level heading as a subsection, so the body starts
      at the executive summary with parts at the first level. Follow the
      branded-deliverable tactic's decision-and-review discipline in both
      cases; this is an audience-facing branded deliverable. Converging the
      two brand treatments onto one token/font/logo source (pointing both
      renderers at the spec-kitty-design source) is tracked as follow-up #5273,
      not a blocker.
    actor: agent
  - title: Verify, review, and hand off
    description: >
      Before handing over, check that every tile or table number came from
      metrics or a saved raw/ file; every #ref is in valid_refs (long form: or in
      a saved raw/ file); the readers are named and, for the long form, the
      summary ends with what they must decide; the Method names the exact scope
      and as-of from the collector's meta; the closed-versus-fixed distinction
      holds for any issue singled out; and scope-mode impact tags are marked
      preliminary unless a verification pass ran. Do not ship on a zero exit
      code alone. Confirm the PDF renders (pdfinfo),
      rasterise and inspect the pages, and for an audience-facing debrief run a
      designer review pass on the light cream/paper treatment led by the
      signature yellow. Fold findings back into the synthesis or the renderer and
      re-render until it reads on-brand, then send the PDF to the operator. Close
      the Op with its real outcome and keep the collector JSON and synthesis in
      the gitignored work/ directory. When the requester asked for the Markdown
      as well, hand over the long form's source file with the PDF.
    actor: agent
    on_failure: >
      A brand or accuracy fault found in review goes back to the synthesis or the
      renderer, never into the shipped PDF.
  - title: Place the output
    description: >
      A debrief is handed over, not committed. Send the PDF to the operator and
      keep the collector output, synthesis, charts and any one-off collector
      script in the gitignored work/ directory. Never commit a PDF to any
      repository, and never open a pull request into spec-kitty (or another
      product repository) for a debrief: report folders there add thousands of
      lines to the product history and put throwaway scripts under the code
      gates. When the operator wants a debrief's findings kept (open risks, a
      confirmed waiver, a decision), write a short Markdown note under
      spec-kitty-planning reference/, named for its date and topic, with the
      findings, the as-of and the issue/PR refs; no PDF and no raw-data dump.
      If a request asks for a different placement, raise the conflict with the
      operator before committing anything.
    actor: agent
    on_failure: >
      If a debrief was already pushed to a product repository, close the pull
      request, hand the PDF to the operator and ask them to delete the branch;
      a closed pull request keeps its commits reachable, so a force-push does
      not remove the PDF.
