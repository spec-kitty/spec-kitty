schema_version: "1.0"
id: semi-auto-delivery
name: Semi-Auto Delivery (a governed autonomous run with pause-and-escalate)
purpose: >
  The runner-side standing orders for a semi-autonomous governed delivery run:
  one agent — a local maintainer session or a dispatched cloud runner — takes a
  tracker issue, or a coherent issue-set, from orientation through to a draft PR
  the operator merges, working on its own but PAUSING to escalate the decisions
  that are the operator's to make. "Semi-auto" is the whole point: autonomous
  inside the agreed scope, never silent on a decision that changes something
  outside it. These standing orders are what a dispatch brief or a local
  invocation would otherwise hand-type every single time; a path that binds this
  procedure by reference stops re-authoring them. It is the substance behind the
  kitty-semi-auto skill in both of its modes. It is mode-agnostic: the conduct
  of the run is identical whether executed locally or in a cloud session.
  cloud-session-dispatch owns how the dispatch prompt is written and how the
  runner is spawned; this procedure owns how the run is then conducted.
entry_condition: >
  An operator has handed one issue or a coherent issue-set to be delivered
  semi-autonomously, either run in the invoking session (local) or dispatched to
  a fresh cloud runner (cloud). The scope boundary is agreed before work starts.
exit_condition: >
  The work is landed as a PR targeting main — opened as a draft, driven to green,
  then flipped to ready-for-review for the operator to merge — with CI green or
  every remaining red classified and reported with the reason it is not this PR's
  defect, the changelog and docs updated, and every escalation-class decision
  surfaced to the operator rather than taken silently — OR the run has paused at
  an escalation point and the operator holds the decision. No progress is ever
  claimed that was not read back from real state; the operator always merges.
steps:
  - title: Orientation gate before anything else
    description: >
      Sync the environment (a cloud run runs `bash scripts/dev/cloud-session-setup.sh`,
      which syncs deps, installs the CLI from the checkout, keeps `.codegraph/` out
      of `git status` and starts the CodeGraph index build). Read CLAUDE.md,
      AGENTS.md and the charter in full before planning or touching code, and load
      `spec-kitty charter context --action <action>` for each phase you will run.
      The charter overrides the brief; flag any drift rather than picking silently.
    actor: agent

  - title: Research, grounding and discovery squads first, before specifying
    description: >
      Run a read-only code-grounding pass and commit it as the mission's research
      note before any spec or plan exists. It records: the sizes and a
      responsibility map of the target files; the invariants that must survive,
      each with its ADR and CLAUDE.md citation; every architectural or AST gate and
      shrink-only ledger that references those files, and how to keep each one green
      honestly; the current test seams and what they cost; interactions with open
      P0s and sibling runs; and 90-day churn. In the same read-only pass, run two
      discovery squads whose whole purpose is to beat the pointfix tendency — a fix
      that lands only where the ticket points and leaves its siblings or its issue
      family untouched. A similar-surfaces squad sweeps the codebase for every
      sibling surface that shares this defect or change shape — other call sites,
      parallel branches, the same anti-pattern or duplicated logic elsewhere — and
      gives each a disposition: in-scope-now for this run, or file-and-link as a new
      issue, with a reason. A tracked-issues squad searches the tracker for
      duplicate, related, parent/child and superseding tickets and records which to
      Closes, which to Refs, which to fold, and which supersede this work. Both
      verdicts go in the research note and, at closeout, in the PR's Discovery
      sub-section; "no related surfaces, no related issues" is a claim made
      explicitly, never an omission, and scope is never widened past the agreed
      issue-set silently — an out-of-scope sibling is filed-and-linked and surfaced
      to the operator. Never specify before grounding — a spec written from
      assumptions the code does not hold sends the whole run after stale scope.
    actor: agent

  - title: Decide Mission vs Ops by blast radius
    description: >
      Choose the delivery shape from the blast radius, and state the choice. A wide
      or multi-work-package change runs as a full governed Mission through the
      canonical loop. A tight, single-surface change runs as a governed Op. An
      issue-set that spans unrelated surfaces is split into separate Missions or Ops
      — grouping is allowed only when the issues share a surface or a sequence. Name
      the dependency and sequence explicitly when a split is sequenced.
    actor: agent

  - title: Work autonomously, but pause-and-escalate on the operator's decisions
    description: >
      Inside the agreed scope, run autonomously: plan, implement, test and review
      without round-tripping every step. But STOP and surface the decision to the
      operator — do not resolve it silently — before acting on any of these decision
      classes, because each one changes something the operator owns:
      (a) a triage verdict that turns on regression-vs-stale-test — whether a red is
        a real defect to fix or an obsolete expectation to change (never green-wash
        the second without proving the expected behaviour genuinely changed);
      (b) deciding WHETHER to change a shared seam, a public or versioned contract,
        or an architectural boundary at all;
      (c) editing a test's asserted expectations, as opposed to adding coverage;
      (d) widening scope beyond the agreed issue-set;
      (e) any charter Decision Moment;
      (f) once such a change is agreed, the versioning MECHANICS — bumping the
        version and landing the machine contract, the version ledger and the human
        docs together in the same change, never drifting them apart.
      Per OPERATOR_SIGNAL_CONTRACT, a path that decides must also signal: raise the
      pause on an operator-visible surface (this session for a local run; the
      runner's own session for a cloud run), with a plain sentence of what was
      decided and what you need. A decision the operator never saw is the
      half-finished, fake-green outcome that costs the next agent hours.
    actor: agent
    on_failure: >
      If an escalation-class decision is reached under time pressure, pause and
      report it rather than guessing; a paused run is a correct exit, a silent
      decision is not.

  - title: Hold the brownfield standing orders
    description: >
      Smallest viable diff that resolves the issue. Locality of change — touch the
      surface that owns the behaviour, not its callers wholesale. Single canonical
      authority — edit the source of truth, never a generated mirror or agent copy.
      Red-first — a bugfix test witnesses the bug before the fix (swap the pre-fix
      file back and watch it fail). Never skip, disable, xfail or quarantine a test,
      and never retry-to-green, to make a run pass; a red is fixed at the root or
      classified honestly, never erased.
    actor: agent

  - title: Test to the calibrated blast radius, never the heavy suites
    description: >
      In-mission runs are bounded per CLAUDE.md and NO_FULL_HEAVY_SUITES_IN_MISSION:
      `make test-fast`, the test files of every module the diff touches, the owning
      subsystem's own test directory (a domain test dir such as `tests/charter/` and
      `tests/charter_offering/` for `src/charter/offering/**` — not a heavy suite),
      and the SPECIFIC architectural gate files a cross-cutting change implicates,
      named individually. Never sweep a heavy-suite directory — the bare
      `tests/architectural/`, `tests/e2e/`, a full `tests/integration/` run,
      `-m performance|stress|timing` — and never `make test-full`; CI owns those at
      the draft PR. Run `make format-check`; keep ruff and mypy at zero. Record the
      exact commands and passed/failed counts in the PR's "Tests run" section, and
      classify any baseline-red that is not this change's rather than widening the run.
    actor: agent

  - title: Rebase on the fixed cadence
    description: >
      For a Mission, rebase onto the canonical remote's main (the remote pointing at
      spec-kitty/spec-kitty, not necessarily origin) after spec, after plan and
      after tasks (before implement). For an Op, which has no spec/plan/tasks
      boundaries, rebase before the first commit and before each push. In both
      shapes, after that, rebase only on a staleness notice from CI or the operator —
      not on every upstream commit. Never push to main; consolidate lands into local
      main only.
    actor: agent

  - title: Closeout the canonical way
    description: >
      Clean the branch and rebase onto the canonical remote's current main. A Mission then closes
      through the mission-wrap-up-sequence (accept, issue verdicts, aggregate
      review, consolidate, compact, rebase); an Op closes lighter — no mission
      wrap-up, straight to the pre-PR path. In both shapes: update docs/changelog,
      run the pre-PR review squad scaled to the work, and fold its findings (file a
      follow-up only for a finding that is highly impactful, takes significant
      effort, or needs an operator decision — name each in the PR's Deferred
      section). Open the PR as a DRAFT targeting main using the repository template —
      the five-section body contract (Issue with `closes #<n>`, Change, Tests run
      with a Self-review block, Blast radius with Discovery + Files, Deferred),
      validated with the internal `validate-pr-body.py` asset. Watch CI until it is
      green, or every remaining red is classified as not this PR's, then flip the PR to ready-for-review with a reviewer handover comment stating
      what was added, the escalation decisions surfaced, and the test/gate evidence.
      The operator merges: never push main, never self-merge or arm auto-merge. The
      operator's commit attribution trailer rides every commit, and no AI model
      identifier appears in any commit, PR or pushed artifact; GitHub posts follow
      the operator's and the harness's attribution conventions.
    actor: agent

anti_patterns:
  - name: Deciding silently
    description: >
      Resolving an escalation-class decision — a regression-vs-stale-test verdict, a
      contract or boundary change, a test-expectation edit, a scope widening — without
      surfacing it to the operator. The operator cannot steer what was never
      signalled, and the fake-green half is the half that misleads the next agent.
  - name: Specifying before grounding
    description: >
      Writing a spec or plan before the read-only grounding run. It commits the run
      to assumptions the code does not hold.
  - name: Pointfix without discovery
    description: >
      Fixing only the exact surface the ticket names and skipping the discovery
      squads, so sibling surfaces that share the defect stay broken and duplicate or
      superseding tickets go unlinked. The discovery verdict — similar surfaces with
      their disposition, related issues with their disposition — is part of
      grounding, not an optional extra, and "no related work" is stated explicitly.
  - name: Greening by erasure
    description: >
      Skipping, disabling, xfailing or quarantining a test, or retrying to green,
      instead of a real root-cause fix or an honestly classified red.
  - name: Running the heavy suites in-mission
    description: >
      Sweeping the whole `tests/architectural/` directory or running `make test-full`
      locally during the run. CI owns the heavy and full suites at the draft PR; the
      run targets the specific gate files it implicates.
  - name: Full-auto drift
    description: >
      Widening scope, crossing an architectural boundary, or changing a contract
      because it looked obviously needed, without the pause. Autonomy is bounded by
      the agreed scope; past it, escalate.
  - name: Self-merging
    description: >
      Merging the PR or arming auto-merge. The deliverable is a green PR flipped to
      ready-for-review and handed off; the operator merges.

references:
  - type: directive
    id: NO_FULL_HEAVY_SUITES_IN_MISSION
    reason: In-mission runs are bounded to the calibrated blast radius and specific gate files; CI owns the heavy and full suites.
  - type: directive
    id: OPERATOR_SIGNAL_CONTRACT
    reason: A deciding path must also signal — every escalation-class decision surfaces on an operator-visible surface, never resolved silently.
  - type: procedure
    id: mission-wrap-up-sequence
    reason: The canonical accept, verdict, aggregate-review, consolidate, compact and rebase closeout for a Mission-shaped run.
  - type: procedure
    id: test-first-bug-fixing
    reason: The red-first workflow the brownfield standing orders require for a bugfix.
  - type: procedure
    id: adversarial-squad-deployment
    reason: The pre-PR review squad the closeout runs before opening the draft PR.
  - type: tactic
    id: clean-linear-commit-history
    reason: The commit-history shape the closeout aims for — coherent, reviewable commits, bookkeeping compressed.
