schema_version: "1.0"
id: feature-and-scenario-authoring
title: Feature and Scenario Authoring Styleguide (consumer-first BDD — "what should the system do")
scope: docs
applies_to_languages: []

principles:
  - "A feature describes a job a consumer wants done; a scenario describes one observable outcome they care about. Both are written from the user's point of view — what the system should do for them — never how it does it. The reader is the consumer of the product, not the person who built it."
  - "The litmus for a scenario. It earns a .feature only if it states a user goal AND a consequence the user cares about, phrased so it stays true regardless of which command or internal delivers it. If the whole scenario reduces to 'the thing I put in is the thing I get back', it is mechanism: leave it in the unit/e2e tier."
  - "Lead from the promise, not the command. Start from the guarantee the system makes (a doc, an ADR, an FR) and write the outcome. The command is an implementation detail the scenario should survive."
  - "Describe desired behaviour, not defects. The .feature layer is the specification of what the system should do; it is not a bug-reproduction layer. Never tag a scenario @defect and never phrase it as a reproduction — a fixed defect becomes a positive promise, and its reproduction stays in the regression tier."
  - "Name outcomes, not output surfaces. Assert the governed result the consumer experiences, not what a command printed. 'The governance in force includes the profiles I selected' is a promise; 'charter list prints researcher-ryan' is a technical echo."
  - "One promise per scenario, concrete and checkable. Narrow to a single guarantee a step can witness. Breadth that cannot be observed — 'composition resolves the way I expect' — is not a scenario; split it into the specific guarantees that matter or drop it."
  - "Stay in the consumer's language. No internal module names, file paths, event-log shapes, or implementation vocabulary in Feature or Scenario text. If a sentence only makes sense to someone who has read the source, rewrite it for the user."

patterns:
  - name: Outcome-first Feature title
    description: >
      Title the Feature by the job and its value, not the subsystem or command.
      "Recorded governance decisions are honoured" and "The system refuses
      unsound governance with a clear reason" read as promises; "The charter
      list command" and "DRG resolver" do not.
  - name: Given / Assume / Act / Assert, reusing steps first
    description: >
      Arrange with Given, state preconditions with Assume, take the consumer
      action with Act (When), check the outcome with Assert (Then). Reuse the
      existing step vocabulary before adding any; a new step is a new line of
      Java to maintain. New steps are phrased as outcome verbs.
  - name: Promise identity and traceability
    description: >
      Tag each scenario @promise:PR-CHARTER-<AREA>-NNN with an id matching the
      contract's grammar, and map that id to the FR/ADR it asserts in the
      suite's PROMISES index, so the set doubles as the frozen-contract map for
      the surface under test.
  - name: "@wip for unbound or in-progress drafts"
    description: >
      A scenario whose step is not yet bound, or that is still being shaped,
      carries @wip plus @wip-owner:<handle> and @wip-since:<YYYY-MM-DD>. It runs
      without failing the nightly, so a promise can be captured before its step
      library exists.
  - name: Worked exemplars (charter offering)
    description: >
      The three offering outcome features show the target style. "The
      governance in force is what I chose": an author gets the artifacts their
      charter puts in force, not every artifact that merely exists. "The system
      refuses unsound governance with a clear reason": activating something
      that would silently drop a profile's steps is refused, naming what and
      why. "I can share governance across a team or project safely": a pack
      with an invalid profile is not reported healthy. Each is a consumer
      outcome, independent of the command that delivers it.

anti_patterns:
  - name: CRUD / affordance echo
    description: >
      A scenario whose only content is that a command returned what was put in.
      It asserts the output surface the unit/e2e tier already owns and carries
      no consumer meaning.
    bad_example: >
      "Scenario: charter list shows the researcher profile / When I run
      'spec-kitty charter list --kind agent_profile' / Then the output contains
      'researcher-ryan'."
    good_example: >
      "Scenario: an author sees only the profiles their charter puts in force /
      Given a project whose charter selects the researcher profile / When the
      author starts a mission / Then the governance in force includes the
      researcher profile and excludes profiles that are merely available."
  - name: Mechanism transcription
    description: >
      A Gherkin copy of an e2e's internal-state assertions, file-layout checks
      or step sequencing. It proves the mechanism, not the promise, and breaks
      whenever the implementation moves.
    bad_example: >
      "Then .kittify/charter/synthesis-manifest.yaml lists 12 nodes and the DRG
      fragment has an edge agent_profile:a -> agent_profile:b."
    good_example: >
      "Then the specialised profile's governance applies on top of the one it
      specialises."
  - name: Command-named steps
    description: >
      Steps written against the command's output rather than the governed
      outcome, so the scenario breaks when the surface changes even though the
      promise holds.
    bad_example: >
      "Then the command prints 'Activated: skill:acme-triage'."
    good_example: >
      "Then the acme-triage skill is in force for the project."
  - name: Defect framing
    description: >
      Tagging a scenario @defect or phrasing it as a reproduction. The feature
      layer states desired behaviour; defect linkage and the clock-skew-style
      reproduction belong to the Python/regression tier.
    bad_example: >
      "@defect:4941 Scenario: reproduce the lost-rejection bug when the clock
      is skewed."
    good_example: >
      "@promise:PR-CHARTER-GOVERNANCE-003 Scenario: a rejection recorded after
      an approval sends the work package back."
  - name: Over-broad, uncheckable scenario
    description: >
      A promise too broad for a step to witness. It reads as a slogan and
      passes vacuously.
    bad_example: >
      "Scenario: composition resolves the way I expect."
    good_example: >
      "Scenario: when two selected profiles both set the same step's input, the
      more specific profile's value is the one in force."

references:
  - "tests/scenarios/README.md"
  - "docs/development/testing/acceptance-scenarios.md"
