org_name: spec-kitty-internal
# Skills render as kitty-<id> (kitty-land-pr, ...). `kitty` is lowercase ASCII, starts
# with a letter, and does not start with a prefix reserved for built-in skills.
skill_namespace: kitty
required_procedures:
  - landing-contributor-prs
  - project-evolution-postmortem
  - memory-curation-and-escalation
  - executive-debrief-generation
  - test-suite-quality-assessment
  - cloud-session-dispatch
required_directives:
  - NO_FULL_HEAVY_SUITES_IN_MISSION
required_glossary_packs:
  - spk-internal-glossary
required_toolguides:
  - terminology-guard
  - test-quality-triage
# Team-shared maintainer commands, in force for every project that registers this
# pack, with no per-person `charter activate skill` step (ADR 2026-09-27-1).
required_skills:
  - land-pr
  - issue-triage
  - mission-from-issue
  - report-debrief
