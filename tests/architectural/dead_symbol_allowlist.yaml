# Dead-symbol allowlist for tests/architectural/test_no_dead_symbols.py (#5346, FR-009).
#
# Identity is (module, name): `module` is the __all__-declaring module, `name` the bare
# symbol name. Body edits cost 0 edits here; a move or rename is reported stale.
# Schema and rules L1-L10: tests/architectural/_dead_symbol_allowlist.py (the only reader).
# Decision record: see docs/adr/4.x (dead-symbol allowlist identity).
#
# THIS ALLOWLIST IS A RATCHET. Its size is capped in _baselines.yaml only. Do not add an entry
# as a reflex: wire the symbol, drop it from __all__, or delete it first.
# Never add `line:` or `body_hash:` fields; the loader refuses them.

schema_version: 1
categories:
  category_a_slice_f_deferred:
    rationale: A. Slice F charter+kernel deferred. Pre-existing public symbols in ``src/charter/`` + ``src/kernel/``
      whose ``__all__`` membership was inherited from before WP02 and whose lack of runtime callers reflects
      a "library written but never wired" situation carried over from earlier missions. A future mission
      MUST either wire each from a runtime caller, remove it from ``__all__``, or delete the symbol entirely.
      Target = 0 by Slice G.
    requires_issue: false
  category_b_grandfathered_legacy:
    rationale: 'B. Grandfathered legacy (out of WP02 scope). Pre-existing public symbols across ``src/charter/offering/``
      + ``src/specify_cli/`` whose ``__all__`` membership predates the WP02 symbol-level gate. WP02 was
      scoped to ``src/charter/`` + ``src/kernel/`` per C-007/FR-121, so these entries were inherited as-is
      into the ratchet baseline. Per the Slice F ratchet policy (C-004), this category MAY only shrink:
      growth requires an entry in ``_baselines.yaml`` plus a ``# justification:`` comment and a follow-up
      tracker ticket (FR-303). relocation-hardened-dead-code-scanners-01KX958P WP02: two stale entries
      dropped (FR-006): ``charter_activate_app`` / ``charter_deactivate_app``
      no longer exist. ``UnifiedBundleMigration`` / ``RefreshOrientationBlockMigration`` moved to the
      T013 structural auto-exempt (the ``_is_registered_migration_class`` ``@MigrationRegistry.register``
      class detector in ``tests/architectural/test_no_dead_symbols.py``); a dead helper or constant
      elsewhere in the same ``m_*.py`` file is still caught (DoD e).'
    requires_issue: false
  category_c_wp_in_flight_charter_scope:
    rationale: C. WP-in-flight Slice F charter symbols.
    requires_issue: false
  category_c_guarded_read_reparent_2899:
    rationale: 'C. #2899 guarded-read re-parent collateral. ``UnknownWorkflowError`` was re-parented ``Exception``
      -> ``GuardedReadError`` so the global CLI error-presentation hook renders an unknown workflow id
      cleanly instead of as a traceback (mission cli-error-surface-seam, #2899 / #4746). It is a genuine
      PUBLIC exception -- declared in ``workflow_registry.__all__``, raised by ``get_workflow``, and propagated
      per FR-015 (no silent fallback) -- with no cross-module ``src/`` caller. On ``main`` it passed via
      the ``(Exception)``-base T013 exception auto-exemption, which the new ``GuardedReadError`` base
      no longer matches. Content-tier key; burns down if the re-parenting is reconsidered or a cross-module
      caller is added. Follow-up: #2899.'
    requires_issue: false
  category_c_wp_in_flight_coordination_branch:
    rationale: 'C. Mission #1348 coordination-branch atomic event log. Public helper symbols for missions/coordination-branch
      topology; each is exercised by integration + unit tests, with production wiring tracked under Priivacy-ai/spec-kitty#1355
      / #1356.'
    requires_issue: false
  category_c_wp_in_flight_topology_authority:
    rationale: C. WP-in-flight topology authority seam (mission 01KTYGTE). ``ResolvedStatusSurface`` is
      the return type of the already-wired ``resolve_status_surface_with_anchor``; callers consume the
      value, not the name. No follow-up tracker -- lone remaining transitive-consumption entry.
    requires_issue: false
  category_c_wp_in_flight_unified_mission_step:
    rationale: 'C. WP-in-flight unified MissionStep model (mission 01KSWJVX). Public surface for the unified
      ``MissionStep``/mission-type model, shipped ahead of production callers landing in later WPs of
      the same mission family. Follow-up tracker: mission-internal WP03/WP04/WP05.'
    requires_issue: false
  category_c_wp_in_flight_charter_activation:
    rationale: 'C. WP-in-flight charter-pack activation layer (01KSYE4V). New public symbols across charter/doctrine/specify_cli
      whose only callers today are the test suite or later WPs still in development. Follow-up tracker:
      mission-internal WP06/WP08 (CLI wiring).'
    requires_issue: false
  category_c_org_doctrine_closeout:
    rationale: C. org-doctrine close-out (mission-authored public surface). Public charter/doctrine API
      symbols awaiting production callers that ship in later WPs of the same mission family, or intentionally
      discoverable public surface that is only test-exercised today. Re-derived each cycle, not a standing
      tracker (the mission owns them).
    requires_issue: false
  category_c_upstream_session_presence:
    rationale: 'C. Upstream session-presence public surface (pre-existing on main). Two module-level constants
      used internally by ``UpgradeChecker`` but with no import-site caller in src/ yet. NOT this mission''s
      code -- surfaced only because the mission''s ``src/specify_cli/status/`` changes triggered the ``core_misc``
      path filter. Follow-up: wire or prune when callers land.'
    requires_issue: false
  category_c_quality_debt_1928:
    rationale: 'C. Quality-debt epic #1928. ``PathValidationError`` is the public exception raised by
      ``validate_mission_paths(..., strict=True)``; the sole runtime caller invokes it non-strict. Deliberate
      public API. Tracked under #1928 (FR-303).'
    requires_issue: false
  category_c_operator_config_public_api:
    rationale: 'C. operator-config public API (mission operator-config-ergonomics). Three symbols authored
      by the operator-config-ergonomics mission (landed via #3506) that are deliberate, contract-declared
      public API but have no static src/ importer yet -- the same "public-but-unwired" shape as #1928
      above: * ``UnresolvedEnvTokenError`` -- raised only on the ``inject_defaults=False`` expansion policy
      (env-expander.md C-EXP-2/4); no current caller uses that policy, so nothing in src/ catches it yet.
      * ``OperatorEnvFileUnreadableError`` -- fail-loud error raised by the pre-import env-file loader;
      it propagates to CLI startup and is caught nowhere by design (fail-loud, C-LDR-3). * ``RedactedVar``
      -- public return-element type of ``redact()``; callers iterate the returned list without importing
      the class name. Manufacturing a fake src/ importer is the anti-pattern this gate warns against,
      so they are allow-listed. Wire-or-prune tracked under #3508 (FR-303).'
    requires_issue: false
  category_c_mission_type_uncaught_propagation_surface:
    rationale: 'C. mission-type uncaught propagation surface (mission cli-boundary-robustness). ``MissionTypeEmptyActionSequenceError``
      (WP06, FR-004) is raised twice intra-module (``resolve_mission_type_context`` / the layered-roster
      resolver) but, by design, is NEVER caught by name at any src/ call site -- ``charter/activation/mission_type_profiles.py::activate.py``''s
      ``UnknownMissionTypeError`` handler explicitly narrows to that sibling exception ONLY, letting this
      one propagate uncaught to the CLI boundary (spec.md Edge Cases: "must surface that resolution failure
      rather than silently treating ''cannot resolve'' as ''no steps were removed''" -- see the comment
      at ``charter/activate.py``''s ``except UnknownMissionTypeError:`` block). The gate''s import-based
      caller detector has no way to see a deliberately-uncaught ``raise`` as a reference, same fail-loud
      shape as ``OperatorEnvFileUnreadableError`` above. Only test code names it (via ``pytest.raises``).
      Wire-or-prune tracked under #4600 (FR-303).'
    requires_issue: false
  category_c_doctor_auto_discovery_seam:
    rationale: 'C. doctor auto-discovery seam (mission operator-config-ergonomics). All six symbols are
      LIVE, not dead -- the gate only counts cross-file src/ ``__all__`` importers, and both reach-paths
      here are invisible to it: * each ``register(app)`` is invoked by doctor.py''s ``_auto_discover_doctor_
      siblings()`` via ``getattr(module, "register")`` (a dynamic string lookup, mirroring the migration
      ``auto_discover_migrations`` seam); * each ``run_*`` is called intra-module by its own ``register``
      shell. Manufacturing a fake src/ importer is the anti-pattern this gate warns against, so they are
      allow-listed (same rationale as the branch-naming failover seam below). The eventual root fix is
      a structural auto-exempt for the doctor-register seam, mirroring ``_is_registered_migration_class``
      so future ``_*_doctor.py`` siblings never need a hand entry -- tracked in #3508.'
    requires_issue: false
  category_c_branch_naming_failover_seam:
    rationale: C. Branch-naming legacy-failover seam. Both symbols are LIVE -- the gate only counts cross-file
      src/ ``__all__`` importers, so a test-only hook and an intra-module env read are invisible to it
      (NOT dead). Manufacturing a fake src/ importer is the anti-pattern this gate warns against, so they
      are allow-listed instead.
    requires_issue: false
  category_c_merge_decomp_shim_reexport_2057:
    rationale: 'C. Merge god-module decomposition shim re-exports (mission #2057). The ``cli/commands/merge.py``
      god-module was decomposed into cohesive seams under ``specify_cli/consolidation/`` (behavior-preserving
      refactor). FR-006 mandates the thin command shim re-export every relocated symbol so existing importers
      keep working with zero import edits. relocation-hardened-dead-code-scanners-01KX958P WP02: 59 of
      the 65 pure re-export names (``specify_cli.cli.commands.consolidate::*``) are now covered by the
      T013 structural auto-exempt (``_is_reexport_shim_symbol``) -- each resolves via a single-alias ``ImportFrom``
      whose origin definition has a live caller elsewhere. ``BaselineMergeCommitError`` stays hand-listed
      because its bare name is a LIVE COLLISION bare_name (escalated to the module_path tier by the FR-005
      classifier) -- collision bare_names are never auto-exempt (T012''s escalate-or-fail-close path must
      see them). The 13 seam-INTERNAL helpers stay hand-listed too: they are locally DEFINED (not re-exported)
      in their seam module, just lacking a cross-file src/ caller after the decomposition moved the consuming
      call to a sibling seam -- a different shape than a re-export shim.'
    requires_issue: false
  category_b_t001_unblinded:
    rationale: B. T001-unblinded symbols (WP01 harden-dead-symbol-gate). The T001 bug in ``_extract_all_literal``
      caused any module with a top-level ``ast.AnnAssign`` before ``__all__`` to be silently zeroed. WP01
      fixed the parser; these symbols surfaced as offenders for the first time. Grandfathered at the same
      "investigate + wire/prune/delete" policy as ``category_b_grandfathered_legacy``. Burns down when
      each symbol is wired, removed from ``__all__``, or deleted (FR-303).
    requires_issue: false
  category_c_mission_type_drg_edges_facade_reexport:
    rationale: 'C. mission-type-drg-edges (#2677) charter.drg facade re-export. ``charter.drg`` is a contract-required
      FACADE module: the ``runtime-charter-doctrine-boundary`` plan (docs/plans/doctrine, ~L57) and the
      ``charter-facade-modules.md`` Symbol table mandate it re-export ``load_graph`` so consumers reach
      the DRG loader through ``charter.drg.*`` -- an invariant independently enforced by ``test_charter_facades_reexport_doctrine``.
      WP03 of this mission rerouted the LAST in-``src/`` consumer of ``charter.drg.load_graph`` to ``load_built_in_graph``,
      so the contract-required re-export now has no cross-file src/ caller (removing it would break the
      facade gate -- two-gate tension). ``load_graph`` is a LIVE COLLISION bare_name (3 live ``__all__``
      locations; ``charter.drg`` + ``charter.offering.drg`` share a body_hash), so the FR-005 classifier
      escalates it to the module_path tier and it is deliberately NOT covered by ``_is_reexport_shim_symbol``
      (escalated keys are hand-curated by design). Tracker: #2677 (FR-303).'
    requires_issue: false
  category_c_urn_resolution_lane:
    rationale: 'C. mission-step-creatability (01KXQA6R) WP07 URN resolution lane. ``resolve_template_by_urn``
      / ``TemplateURNError`` are the by-URN compatibility-contract lane for template resolution (C-004,
      ``contracts/name-urn-resolution.md``). WP07''s scope is FR-010-bound to "add the lane + a by-URN==by-name
      equivalence test only" -- wiring a real production consumer is explicitly out of scope for this
      WP. The real consumer (`charter context --include template:<id>`) lands in a later mission/WP, so
      these two names are exported but currently have zero production importers. Follow-up tracker: #2761.'
    requires_issue: false
  category_c_wp_in_flight_charter_yaml_io_write_helper:
    rationale: 'C. consolidate-charter-bundle WP01 shared write-helper vocabulary. ``charter.activation.charter_yaml_io.update_charter_yaml_section``
      (the INV-9 single writer all three charter.yaml mutators -- activation_engine.commit_plan, pack_manager.merge_defaults,
      compiler.write_compiled_charter -- route through) IS wired with a live src/ caller. ``OWNED_SECTIONS``
      (the public vocabulary of section names callers may name) and ``UnknownCharterYamlSectionError``
      (the typed error the helper raises for an unrecognised section) are the module''s public *contract*
      surface for that call, but every current caller passes a literal section string rather than importing
      the vocabulary/exception to validate against -- so neither symbol itself has a cross-file src/ importer
      yet. Library- primitive, test-exercised (tests/charter/test_charter_yaml_io.py validates both the
      accepted-section vocabulary and the raised-on-unknown contract). WP07 (consolidate-charter-bundle-01KXSYB9,
      #2773) declines to force an artificial caller (e.g. a defensive pre-check duplicating the helper''s
      own validation) purely to satisfy this gate. Follow-up tracker: #2773 (wire a real caller, e.g.
      a CLI/validation surface that echoes ``OWNED_SECTIONS`` back to an operator, or fold the two symbols
      out of ``__all__`` in a dedicated follow-up).'
    requires_issue: false
  category_c_scope_source_factory_constructed:
    rationale: C. scopesource-gate-followup-01KY6S9P WP04 single-factory-construction hub. ``resolve_scope_source``
      constructs ``DeclaredCommandScopeSource`` in-module and callers consume it through the structural
      ``ScopeSource`` port.
    requires_issue: false
  category_c_lifecycle_gate_execution_context_2841:
    rationale: 'C. lifecycle-gate-execution-context (#1834/#2885/#2795/#2882) forward seams. Mission ``lifecycle-gate-execution-context``
      (FR-303 dead-symbol case, no new tracker ticket) landed some surfaces still awaiting a real cross-module
      caller: * ``acceptance/execution_context.py::SurfaceHeadResolver`` is a ``Callable[[Path], str]``
      type alias used ONLY as the annotation on ``GateExecutionContext.assert_at_ref``''s ``head_of``
      parameter -- the C5 ref-agreement gate (``gates_core._assert_ref_agreement``, wired into the ACCEPT-phase
      acceptance-matrix gate) calls ``assert_at_ref()`` with the default resolver and never needs to inject
      a substitute in production, so this alias is exercised only by the direct unit tests that inject
      a fake ``head_of`` for ``tests/acceptance/test_gate_execution_context.py``''s isolated-method cases.
      A type alias consumed purely as a signature annotation is never a ``from ... import`` site by construction.
      * ``acceptance/post_consolidation.py`` (``verify_deferred_invariants`` / ``PostConsolidationResult``
      / ``PostConsolidationViolation`` / ``InvariantViolation``) is WP06/T031''s Op, dispatched ad hoc
      via ``spec-kitty dispatch`` -- by design "there is no new CLI verb and no call-in from merge/executor.py"
      (module docstring; zero ``merge/`` coupling is a load-bearing contract constraint, C7) and ``scripts/ci/check_dangling_deferrals.py``
      is deliberately "zero-coupled to src/specify_cli" (its own docstring) so it duplicates the wire
      value instead of importing this module. A plain library function with a real, documented caller
      (docs/guides/accept-and-merge.md #deferred-invariants-and-the-post-consolidation-gate) that is never
      a static ``src/`` import by design. * ``cli/commands/archive.py`` (``create`` / ``list_archives``)
      were formerly hand-allowlisted here as Typer command callbacks registered by the ``@app.command(...)``
      decorator; the real runtime caller is Typer''s own dispatch against ``archive_module.app`` (wired
      in ``cli/commands/__init__.py``), never a ``from ... import create`` site. Removed (#470): now covered
      by the ``_is_typer_command_definition`` T013 structural auto-exemption, per the disjointness invariant
      (auto_exempt ∩ hand_allowlist = ∅ -- see ``test_auto_exempt_disjoint_from_hand_allowlist``).'
    requires_issue: false
  category_c_delivery_rail_forward_api:
    rationale: 'C. Delivery-rail forward API (mission doctrine-delivery-reachability-01KYMXD6). The delivery-rail
      public API built by mission ``doctrine-delivery-reachability-01KYMXD6``: the WP08 per-channel reachability
      helpers (``src/charter/offering/drg/reachability.py``) and the WP07 activation-partition helpers
      (``src/charter/activation/pack_context.py``). WP03 UPDATE (mission ``doctrine-delivery-activation-01KYQVQK``
      — the planned "walk-update" fast-follow itself): this mission wired the *profile* channel. ``profile_channel_reachable``
      (never in this frozenset) and ``agent_profile_seed_urns`` (retired below) now have a genuine runtime
      caller in ``src/charter/offering/agent_profiles/repository.py``, so they are no longer forward-only.
      The remaining eight symbols are a DIFFERENT concern — the charter-activation partition helpers and
      the *action*-channel reachability helpers — for which this mission builds no ``src/`` consumer;
      they stay allowlisted-with-note. They are exercised today only by their own unit tests — no ``src/``
      caller reaches them yet. Each is a deliberate, ``__all__``-curated public symbol — the forward contract
      a later mission consumes from runtime ``src/``. This is the "library authored ahead of its runtime
      caller" shape the gate flags, deliberately deferred here rather than deleted (deletion would forfeit
      mission-built API with a live forward story). Follow-up tracker: Priivacy-ai/spec-kitty#3063 (the
      deferred reachability/ delivery decision surface; see docs/plans/doctrine/delivery-reachability-wiring-table.md).
      Target = 0 once a later mission wires each remaining helper from a runtime caller. The WP15 progressive-disclosure
      module (``src/charter/activation/progressive_disclosure.py``) is a DIFFERENT case, landing-fold-corrected
      (PR #3070, E1): its delivery entry points (``build_disclosure_payload``, ``collect_typed_artifacts``,
      ``requires_closure``) ARE wired -- ``charter.activation.context`` calls them directly -- so they
      carry no allowlist entry at all; the gate''s
      module-attribute detector recognises the caller and never flags them. The module''s remaining helpers
      (``bare_id``, ``edge_to_reference``, ``outbound_references``, ``link_references``, ``reconstruct_urns``,
      ``artifact_to_dict``, and the ``DELIVERY_INLINE``/``DELIVERY_LINK``/``STATED_DEFAULT_WHEN`` constants)
      were previously over-exported in ``__all__`` with no external importer, which made the gate mislabel
      live, intra-module-only implementation detail as "unwired forward API". They were demoted out of
      ``__all__`` instead (they remain ordinary module-level names -- ``__all__`` only governs ``import
      *``, and nothing does that here) and so no longer need an allowlist entry either: only genuinely
      public, genuinely unwired API stays allowlisted below. ``partition_delivery`` is the one progressive-disclosure
      symbol that is both: still public (``__all__``-declared, per its own forward-API docstring) and
      has zero ``src/`` callers today.'
    requires_issue: false
  category_c_charter_facade_forward_api_01kzpdsr:
    rationale: 'C. WP-in-flight charter facade forward API (01KZPDSR WP03). Mission ``doctrine-public-api-surface-01KZPDSR``
      WP03 built the sanctioned ``charter.*`` doors (``charter.assets`` / ``charter.model_routing`` /
      ``charter.missions`` / ``charter.glossary_packs`` / ``charter.spdd_reasons`` plus the widened ``charter.drg``
      cluster) that let WP05–WP07 migrate runtime off direct ``doctrine.*`` imports (FR-003, NFR-002,
      contract C2). Those consumer WPs depend on WP03 and have NOT landed in this lane, so each new facade
      re-export currently has no cross-file ``src/`` caller. Every symbol below is a contract-required
      facade re-export (``test_charter_facades_reexport_doctrine`` independently enforces the object-identity
      + ``__all__`` membership these entries would otherwise let a refactor drop). Each is a LIVE-COLLISION
      bare_name (the same name lives in the doctrine origin ``__all__`` and, for the PUBLIC ones, in ``charter.offering.api``
      too), so the FR-005 classifier escalates it to the module_path tier and it is deliberately NOT covered
      by the content-tier ``_is_reexport_shim_symbol`` auto-exempt — escalated keys are hand-curated by
      design (DoD i). Same status as the ``category_c_mission_type_drg_edges_facade_reexport`` category above. THIS
      RATCHET SHRINKS as WP05–WP07 wire runtime onto each door: when a facade symbol gains a real ``src/``
      caller, its entry MUST be removed here (the stale-ratchet check reds if it lingers). Tracker: mission
      ``doctrine-public-api-surface-01KZPDSR`` WP05/WP06/WP07 (FR-303).'
    requires_issue: false
  category_c_charter_authority_flip_forward_api:
    rationale: 'C. charter-authority-flip (01M14RB3) forward public API (#3664). Two intentional public
      symbols landed by the doctrine->charter governing-term flip that have no cross-file `src/` caller
      yet, both content-tier (unique bare_name, no live collision): * ``charter.activation.interview::InterviewAnswersRegressionError``
      -- raised by ``write_interview_answers(..., fail_closed_on_regression=True)``. That opt-in flag
      has no production caller today: the only caller is ``tests/charter/test_answers_migration.py`` (which
      asserts on the error directly), and the answers-migration script ``scripts/migrate_charter_interview_answers.py``
      deliberately does NOT use this writer at all -- it does byte-preserving anchored substitution to
      survive the archive-freeze gate. So this is test-only forward public API, exposed by design so that
      future/external migration callers can catch it. * ``charter.activation.sync::LegacyGovernanceKeyWarning``
      -- the ``UserWarning`` subclass ``_warn_legacy_governance_key_once()`` raises internally (same module,
      so invisible to the cross-file caller graph); ``tests/charter/ test_governance_key_compat.py`` asserts
      on it via ``pytest.warns(...)``. Public by design so any consumer can filter/assert on the specific
      warning class rather than a bare ``UserWarning``.'
    requires_issue: false
  category_c_path_conventions_forward_api:
    rationale: 'C. mission-type-canonical-source-01M302V9 path_conventions forward API (#3831/#4088, FR-303).
      ``charter.offering.missions.models::VALID_PATH_KEYS`` / ``::validate_path_conventions`` land the
      canonical ``path_conventions`` charter doctrine slot ahead of its wiring: per the ADR (``docs/adr/3.x/2026-09-20-1-canonical-mission-type-source.md``),
      the slot is a forward-declared, additive extension point on the charter ``MissionType`` model --
      its producers are downstream consumer org packs and the #2652-deferred built-in convergence, neither
      of which lands in this PR. Content-tier: ``VALID_PATH_KEYS`` also exists as a legacy, non- ``__all__``
      (widened-scope only) module-level constant in ``specify_cli/mission.py``, which is invisible to
      the gate''s live collision index (``classify_collisions`` only walks statically-declared ``__all__``
      membership) -- so no module_path escalation is needed here. Remove this entry once a real src/ caller
      lands (FR-303 tracker: #2652).'
    requires_issue: false
  category_c_fsm_write_path_unsafe_door:
    rationale: 'C. fsm-write-path-integrity-01M1TZV6 WP03 raw-append door (FR-010). ``specify_cli.status._unsafe``
      is the enumerated, gate-facing door for the raw ``status.events.jsonl`` append primitives (they
      left the ``status`` facade so no runtime module can reach them without appearing in the shrink-only
      ``ALLOWED_CALLERS`` census). Two of its public names have no cross-file ``src/`` caller BY DESIGN:
      * ``specify_cli.status._unsafe::ALLOWED_CALLERS`` -- consumed only by the architectural gate ``tests/architectural/test_status_unsafe_allowlist.py``
      (every door importer must be in it; it must stay a subset of the test''s committed BASELINE). A
      runtime caller would defeat its purpose. * ``specify_cli.status._unsafe::append_event`` -- the unverified
      single-row primitive, re-exported because the write-gates contract names every raw primitive on
      this door; production writers use the ``_verified`` / ``_atomic`` variants, so its only importers
      are tests (14 files) that seed event logs through the sanctioned door. Module-path tier: the alias
      text collides with ``glossary``''s unrelated ``append_event`` re-export. Tracked with the mission''s
      census-gate-rule note (#3895); drop these entries if the door is ever folded back or ``append_event``
      retired.'
    requires_issue: false
  category_d_charter_code_topology_relocation_forward_api:
    rationale: 'D. charter-code-topology-01M152G1 doctrine->charter.offering relocation forward API (#3664).
      Three symbols surfaced by the src/doctrine/ -> src/charter/offering/ package relocation (mission
      ``charter-code-topology-01M152G1``, PR #3664). (A fourth casualty of the same relocation, ``charter.activation.pack_context::
      normalize_activation_identifier``, was NOT a new entry here -- it already had a Category C allowlist
      row above (historical: under the pre-#5346 ``(bare_name, body_hash)`` scheme, the relocation changed
      that row''s body_hash, so the row was re-pinned in place rather than duplicated; under the current
      ``(module, name)`` identity this class of churn no longer applies).) None of
      the three below is dead: each is exported by design for a consumer outside this specific cross-file
      caller graph, verified before allow-listing (never a blanket suppression): * ``charter.offering.drg.org_pack_config::LegacyOrgPackDoctrineKeyWarning``
      -- raised internally by the module''s own legacy-key compat warn-once helper (same module, so invisible
      to the cross-file caller graph), same shape as the established ``charter.activation.sync::LegacyGovernanceKeyWarning``
      / ``specify_cli.tracker.config::LegacyTrackerOwnershipKeyWarning`` precedent above: public by design
      so a consumer can filter/assert on the specific warning class. Asserted on via ``pytest.warns(...)``
      in ``tests/runtime/test_bridge_io.py``, ``tests/runtime/test_resolver_unit.py``, and ``tests/unit/mission_loader/test_command.py``.
      * ``kernel.doctrine_root::CANONICAL_DOCTRINE_DIRNAME`` -- the CR-07 canonical per-project doctrine-artifact
      dirname (``"charter-packs"``, replacing legacy ``.kittify/doctrine/``). The module''s own docstring
      is explicit that this is M2 (read-side dual-root resolver) groundwork only: "M3 performs the actual
      on-disk data move and flips write call sites over; nothing in this module writes or moves any file."
      No write call site exists yet anywhere in ``src/`` (grepped: zero hits for the literal ``"charter-packs"``
      outside this module) -- genuinely forward API for the not-yet-landed M3 cutover, not a dropped caller.
      * ``kernel.doctrine_root::LegacyDoctrineRootWarning`` -- same "legacy compat warn-once, same-module
      raise, public for external filtering" shape as ``LegacyOrgPackDoctrineKeyWarning`` above.'
    requires_issue: false
  category_e_charter_activation_split_forward_api:
    rationale: 'E. charter-activation-split forward API (#806). EXPERIMENTAL deliberately retains its
      replay semantics, so these restored upstream helpers are public but currently unwired. TODO(triage):
      #925 owns their wire-or-prune disposition.'
    requires_issue: false
  category_c_team_kitty_launch_defaults_3980:
    rationale: 'C. team-kitty-launch-defaults 3980 forward API. The #3980 launch-defaults flip introduced
      the canonical env-name constants in ``specify_cli.core.env`` and kept ``sync_active()`` as the contract-pinned
      armed predicate (``kitty-specs/team-kitty-launch-defaults-01M1XJ4Y/ contracts/saas_rollout.md``
      v3). None has a cross-file ``src/`` caller yet: * the three ``core.env`` constants are consumed
      by their own module''s gate functions (``sync_kill_switch_active`` / ``pre_review_gate_skip_reason``
      / ``moment_handlers_disabled_reason``) and imported by tests (``tests/specify_cli/core/test_env.py``,
      the agent-command conftest), but the parallel literal name lists in ``core/secret_redaction.py``
      and ``upgrade/migrations/m_3_2_8_provision_kitty_env.py`` predate the constants and still hardcode
      the strings. * ``sync_active()``''s last runtime caller (the owned-checkout ``OWNED_SYNC_UNSUPPORTED``
      refusal) was removed by #3980 itself; the contract still requires its kill-switch/disarm test coverage,
      and the launch table names it as the ``SPEC_KITTY_SYNC_DISABLE`` consumer. TODO(triage): #3980 post-launch
      — wire the literal-list sites to the constants, and either wire a ``sync_active()`` consumer (the
      kill-switch fold into readiness/tracker gating) or retire it with the next contract version bump,
      then drop these entries.'
    requires_issue: false
  category_c_live_work_capture_public_surface:
    rationale: 'C. Live Work capture layer public surface (#4268). The new ``specify_cli.live_work`` package
      (spec-kitty#4268, Live Work harness capture): its runtime callers are the ``live-work`` CLI command
      group and the retrospective-outcome fanout, which consume the adapter, publisher, coalescer, watcher
      and bindings seams. The twelve symbols below are the layer''s *public constants and predicates*
      — the vocabulary its tests pin and its follow-up wiring (factory dispatch install, e2e capture-to-paint
      qualification, spec-kitty#4268''s acceptance evidence) consumes by name; none has a second src/
      importer yet. TODO(triage): wire the first by-name consumer or drop from __all__ (FR-303).'
    requires_issue: false
  category_d_live_work_authored_public_surface:
    rationale: 'D. Live Work authored-message service surface (#4269). The ``specify_cli.live_work.authored``
      service (spec-kitty#4269, authored publish/reply/read/inbox): its runtime callers are the ``zeitgeist
      send/reply/read/inbox`` CLI commands and the MCP ``zeitgeist_*`` tools, which import the service
      functions, the typed error and the outcome enum by name. The three symbols below are the service''s
      *result type and wire bounds* — the vocabulary its tests pin and the e2e A-question->B-reply qualification
      (e2e#452) consumes by name; none has a second src/ importer yet. TODO(triage): wire the first by-name
      consumer or drop from __all__ (FR-303, spec-kitty#4269).'
    requires_issue: false
  category_c_terminus_reconciliation_5001:
    rationale: 'C. Terminus reconciliation gate + merge-coord integrity (#5001). The terminus/merge-coord
      integrity spine (Epic #5001) lands its public vocabulary ahead of every external caller: today each
      symbol is exercised intra-module (the wired `route_terminus`/`VerifyResult`/claim-builder call chains)
      and by the WP06 reconciliation test suite (tests/consolidation/test_reconciliation.py), not yet
      imported from a second src/ module. External consumers land with the Epic #5001 follow-ups.'
    requires_issue: false
