    singleton (never SystemClock/FrozenClock by name), so there is no non-test src/ caller to wire; tests
    across kernel/agent/upgrade/specify_cli inject FrozenClock directly and DEFAULT_CLOCK is instantiated
    from SystemClock at module load. Kept public (not pruned from __all__) because both are load-bearing
    constructor targets for the SC-002 single-injection-point idiom documented in kernel/clock.py''s own
    module + class docstrings (kernel-clock-single-door, PR #3305).'
