# tests/architectural/test_egress_consent_boundary.py
# Issue #3030 (P0 confidentiality). The egress boundary permits a transmit
# primitive only in a file carrying an explicit allowance. Both sets are
# ratcheted here so this gate cannot be silenced by a one-line module edit —
# adding a file requires this diff plus a `# justification:` naming why the
# sink carries no project data, or why its consent seam is sound.
test_egress_consent_boundary:
  # justification: 28 files hold a transmit primitive with a recorded reason —
  # 12 gated by a named consent seam on the data's own project_uuid (E1/E2/E3
  # and E6-E13), 1 per-project transport whose every caller is separately
  # seamed (E14), and 15 that are
  # not project egress at all — auth/OAuth token traffic, the doctrine fetch,
  # the readiness probe, four localhost control endpoints and `sync doctor`'s
  # empty-body connectivity probe (E18). Each was verified individually, not
  # assumed. 12 + 1 + 14 = 27. Earlier, 27 -> 28: the callee-agnostic
  # injected-transport rule (added after
  # E20 showed a `poster(...)` parameter is invisible to any method-name rule)
  # surfaced cli/commands/sync.py, which calls request_with_fallback_sync
  # rather than requests.post. That is the gate finding a file nobody had
  # reasoned about, which is its purpose — not a new leak.
  # 28 -> 27 (#3167): E15, the UNREACHABLE allowance for the queue-backed drain
  # in sync/batch.py, was RETIRED — the drain was deleted rather than gated, so
  # the module holds zero transmit primitives and is no longer on the allowlist
  # at all. This ratchet is shrink-only (growth fails, shrinkage merely warns),
  # so leaving it at 28 would have silently held the ceiling one free
  # unconsented-egress file too high. That is the drift #3167 exists to close,
  # which is why the count is corrected here even though nothing reds on it.
  # 27 -> 28 (per-project-sync-consent-ledgers WP10/T047):
  # sync/daemon_protocol.py owns one authenticated, versioned quiesce/restart
  # call to the exact current daemon. Its constructor parses and requires an
  # exact http://127.0.0.1:<port> or http://localhost:<port> authority; remote,
  # userinfo-confused, path-bearing, and portless URLs are rejected before I/O.
  # This is loopback control, not project-data egress, and its exact sink count
  # is independently pinned in test_egress_consent_boundary.py.
  # Both sides of the #14 merge moved this counter off 28, in opposite
  # directions, and both allowances are kept:
  # - Priivacy-ai/spec-kitty#9 (E3 ephemeral-team-status) ADDED
  #   specify_cli/zeitgeist_client/resolution.py — the capability mint POSTs
  #   {'repo_slug', 'kind'} to Team Kitty to *receive* a relay token;
  #   credential traffic gated by team membership over Bearer auth, not
  #   per-project consent.
  # - E4 re-homing (planning epic #4, issue spec-kitty#2) REMOVED
  #   specify_cli/dashboard/handlers/api.py — its /api/sync/trigger proxy
  #   route was deleted, so the file holds zero transmit primitives and left
  #   the allowlist entirely (the loopback health probe it used to borrow
  #   lives in dashboard/lifecycle.py now). Recorded so the ceiling does not
  #   silently hold a free file.
  # Recount at the merge (sk-impl-spec-kitty-9): the merged allowlist measures
  # 26 entries (resolution.py in, api.py out), not the 28 the arithmetic of
  # the two recorded bumps suggests — the number had drifted +2 ahead of the
  # real set before either branch touched it. Corrected to the measured count
  # per the #3167 rule above: this ratchet is shrink-only (growth fails,
  # shrinkage merely warns), but the ceiling should not hold free files.
  # Growth here means a new file transmits: argue it in the diff.
  #
  # 26 -> 14 (issue-5-delete-sync-transport, 2026-08-25): the sync transport's
  # deletion removed twelve sink-bearing files outright — delivery/receivers.py,
  # delivery/dispatcher.py, sync/body_transport.py, sync/runtime.py, sync/events.py,
  # invocation/propagator.py's E6 row was RE-ANCHORED (not removed) on its
