  # model_task_routing: the reader/writer asymmetry firing on a live case.
  # loader.py:96-106 READS these (catalog.routing_policy.freshness_policy,
  # freshness.max_catalog_age_hours). The shipped catalog mentions them only
  # inside a comment block (lines 597-603) explaining that the catalog must
  # "never wall-clock-expire". The staleness check is therefore unreachable on
  # the shipped catalog -- possibly intentional, but intentional-and-inert.
  - name: freshness_policy
    declared_at: src/charter/offering/model_task_routing/models.py
    disposition: wire-the-producer
    note: Read by loader.py; present in the shipped catalog only as a comment.
  - name: freshness_policy
    declared_at: src/charter/offering/schemas/model-to-task_type.schema.yaml
    disposition: wire-the-producer
    note: Read by loader.py; present in the shipped catalog only as a comment.
