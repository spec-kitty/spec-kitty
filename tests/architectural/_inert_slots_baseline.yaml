# Frozen shrink-only baseline for the zero-producer lint (WP01, FR-001/SC-001).
#
# THIS IS NOT AN ALLOWLIST. A baseline entry is DEBT: every row carries a
# structural disposition that clears it. There is no permanent exemption.
#
# Ratchet semantics (charter Burn-down Policy §a, `frozen-baseline-shrink-only-ratchet`):
#   - a finding NOT in this file  -> FAILS the gate
#   - a baseline entry no longer found -> WARNS, and the entry should be deleted
# The file's size is registered as `test_no_inert_schema_slots.baseline_entries`
# in `tests/architectural/_baselines.yaml` and may only go down.
#
# Row shape is exactly `name`, `declared_at`, `disposition`, `note`. The parser
# (`load_baseline` in `_inert_slots.py`) refuses any other key, including the
# retired `owner`, `provisional`, top-level `mission` and the retired
# `code_only_suppressions` section (mission
# ratchet-baseline-census-gate-remediation-01M3EW3Z, #3026/#3962).
#
# Why a baseline at all: SC-001 asked for a zero-entry allowlist, but the lint's
# first run on the shipped tree returned 41 findings whose fixes run in later
# work. The criterion was written against a tree that turned out not to be
# clean. Operator ruling, doctrine-silence-guards-01KYFV7Q.
#
# `disposition` vocabulary is exactly three values. There is deliberately no
# `accepted`, no `wont-fix`, no `by-design`:
#   wire-the-producer       something should fill this and nothing does
#   delete-the-declaration  nothing should fill this; the declaration is the defect
#   fix-the-lint-definition a false positive; the CHECKER changes, never the baseline
#
# KNOWN UNDER-COUNT (still true after the src/doctrine scope fix): the lint matches
# slot names globally, with no namespacing, so a slot is still masked by an
# unrelated same-named producer *inside* src/charter/offering/. The error direction is
# always false-NEGATIVE, so the true debt is higher than this file's size.
#
# Burn-down history:
# - The scope fix grew this file 41 -> 59. `_code_producers` used to harvest
#   all of src/ (12,742 names vs 807 now). Among the names that scan added were
#   `aliases` -- the field SC-001 exists to guard, which the gate therefore did
#   NOT guard -- and `overrides`, which hid half of the FR-028 pair.
# - WP05/T024 (doctrine-silence-guards) cleared 8 entries (the
#   `enhances`/`overrides` pair across paradigm|procedure|styleguide|tactic
#   schemas): FR-028 retired both fields and the schemas no longer declare
#   them. 59 -> 51.
# - PR #3134 excluded `occurrence-map.schema.yaml` from the schema walk
#   (`_NON_ARTIFACT_SCHEMAS`): occurrence maps are per-mission planning
#   artifacts outside the src-only producer scope, a checker-scope false
#   positive. Its `from`/`moves`/`to` rows were deleted. 51 -> 48.
# - PR #3234 retired `toolguide-references` (-1), dead-port-disposition-01M1TZVN
#   retired the ten-row `orchestration` family (-10), and #3831/#4088 added
#   `path_conventions` (+1). 48 -> 38.
# - ratchet-baseline-census-gate-remediation-01M3EW3Z WP05 deleted the stale
#   `styleguide-references` and `model` rows on agent-profile.schema.yaml,
#   which the live scan no longer reports. 38 -> 36.

