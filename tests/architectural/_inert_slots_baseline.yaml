# Frozen shrink-only baseline for the zero-producer lint (WP01, FR-001/SC-001).
#
# THIS IS NOT AN ALLOWLIST. An allowlist entry is permanently excused. A baseline
# entry is DEBT: it has a named owner, a required structural fix, and a test
# (`test_a_baseline_entry_does_not_survive_its_owner`) that fails the moment the
# owner completes with the entry still here. `ALLOWLIST` stays `frozenset()`.
#
# Ratchet semantics (charter Burn-down Policy §a, `frozen-baseline-shrink-only-ratchet`):
#   - a finding NOT in this file  -> FAILS the gate
#   - a baseline entry no longer found -> WARNS, and the entry should be deleted
#
# Why a baseline at all: SC-001 asked for a zero-entry allowlist, but the lint's
# first run on the shipped tree returned 41 findings whose owners run AFTER this
# work package (WP05) or in a later mission (Mission D / I9). The dependency is
# inverted; the criterion was written against a tree that turned out not to be
# clean. Operator ruling, doctrine-silence-guards-01KYFV7Q.
#
# `disposition` vocabulary is exactly three values. There is deliberately no
# `accepted`, no `wont-fix`, no `by-design`:
#   wire-the-producer       something should fill this and nothing does
#   delete-the-declaration  nothing should fill this; the declaration is the defect
#   fix-the-lint-definition a false positive; the CHECKER changes, never the baseline
#
# `provisional: true` marks an entry whose disposition has NOT been adjudicated.
# WP01 recorded the evidence but did not decide, so a provisional guess cannot
# harden into the record. An entry with a named owner may NOT be provisional --
# that owner's disposition is theirs to decide and record;
# `test_baseline_entries_are_well_formed` pins it.
#
# `unassigned` is CAPPED and shrink-only (`MAX_UNASSIGNED_ENTRIES`). It is the one
# owner value the anti-weasel test can never fire for, so without a cap it is a
# legal row that never fires, never expires and never requires adjudication --
# i.e. a way to satisfy the growth rule without doing the work. The cap may only
# go down. Every named owner must also RESOLVE to a real WP or mission in the
# event log (`test_every_named_owner_resolves`): `WP42`, `wp05` and `mission:typo`
# would otherwise read as "never complete" exactly like `unassigned`.
#
# KNOWN UNDER-COUNT (still true after the src/doctrine scope fix): the lint matches
# slot names globally, with no namespacing, so a slot is still masked by an
# unrelated same-named producer *inside* src/charter/offering/. The error direction is
# always false-NEGATIVE, so the true debt is >= 59.
#
# The scope fix is why this file grew 41 -> 59. `_code_producers` used to harvest
# all of src/ (12,742 names vs 807 now). Among the names that scan added were
# `aliases` -- the field SC-001 exists to guard, which the gate therefore did NOT
# guard -- and `overrides`, which hid half of the FR-028 pair.
#
# WP05/T024 cleared its 8 entries (the `enhances`/`overrides` pair across
# paradigm|procedure|styleguide|tactic.schema.yaml): FR-028 retired both fields
# and each `models.py` raises on them via `@model_validator`, so the schemas
# advertising them as valid properties documented a shape the loader rejects.
# `scripts/generate_schemas.py` now emits the reconciled shape and the four
# schemas no longer declare either property. 59 -> 51. The entries-still-found
# floors in `_inert_slots.py` are derived from this file's live size, so their
# drop needed no edit of their own.
#
# PR #3134 added `structural_targets` to occurrence-map.schema.yaml, which the
# gate flagged as a new inert slot -- the same false-positive class as the
# already-baselined `from`/`moves`/`to` on that schema (occurrence maps are
# per-mission planning artifacts under kitty-specs/, structurally outside the
# src-only producer scope this checker walks; no property of that schema was
# ever going to be assessable here). Rather than add a fourth baseline row,
# `_inert_slots.py` now excludes `occurrence-map.schema.yaml` from the schema
# walk at the source (`_NON_DOCTRINE_SCHEMAS`), which also retires the
# already-baselined `from`/`moves`/`to` rows below -- they are DELETED here
# rather than left to warn, because `test_the_scan_actually_sees_the_shipped_tree`
# is a concrete floor requiring every schema-declared baseline entry to still
# be found; a scan that structurally cannot ever find them again must not
# leave them in the file. 51 -> 48 entries, `unassigned` 23 -> 20; the mirrored
# `baseline_entries` / `unassigned_entries` counters in
# `tests/architectural/_baselines.yaml` are updated in the same change, per
# that file's own registration-gate requirement.

# WP owners without a `mission:` prefix are work packages of this mission.
mission: doctrine-silence-guards-01KYFV7Q

