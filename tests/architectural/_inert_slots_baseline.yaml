# ---------------------------------------------------------------------------
# CODE-ONLY SUPPRESSIONS
#
# A different record for a different problem. The `entries:` above are findings
# the gate DOES report and someone owes work on. These are slots the gate does
# NOT report, solely because code under src/charter/offering/ names them -- the one
# suppression route that had no accounting until review fabricated a suppression
# with a single dead line and took the module from 1 failed to 26 passed.
#
# The producer rule itself is unchanged, deliberately. Review's mutation used a
# dict literal; confirming it found that a bare binding and a keyword argument
# work identically, and any rule of the form "which AST node counts as a write"
# is satisfiable by writing that node. So the fix is not a narrower rule, it is
# the removal of the silence: this computed set must MATCH this record exactly.
#
# Ratchet semantics -- BOTH directions fail, unlike the baseline above:
#   - a suppression not recorded here     -> FAILS (that is the hole)
#   - a recorded row no longer computed   -> FAILS (delete the row; the same
#     signal also catches a collapsed walk, which would otherwise empty the
#     computed set and let every absence assertion in the module pass)
#
# `verdict` vocabulary is exactly three values, and only the first is a claim
# that the code write is real:
#   genuine-producer     the code really does place a value in this slot
#   name-collision       an unrelated same-named symbol; the slot IS inert and
#                        this row is masking a real finding
#   reader-not-producer  the code contact reads or maps the key rather than
#                        filling it. The module's central asymmetry ("a reader
#                        is not a producer") is defeated by the kwarg and
#                        dict-key rules, which cannot tell `f(x=obj.x)` or a
#                        loader's key map from a write. Also masking.
#
# The latter two are DEBT and are capped shrink-only (MAX_MASKING_SUPPRESSIONS).
# That cap is what gives this record teeth rather than merely making the route
# visible: at its current population a NEW code-only suppression can only be
# admitted as `genuine-producer` -- a positive claim, in a diff, next to the
# code being claimed, and re-derived from the AST by `code_producer_writes`.
#
# `producer` cites ONE file that writes the name; several rows have more (see
# `field_path`, six identical jsonschema error-path locals). The citation is
# verified, not exhaustive -- `test_every_recorded_code_producer_actually_writes_the_slot`
# re-parses that file and fails if the claim is false, closing for this record
# the same gap `test_every_named_owner_resolves` closes for baseline owners.
#
# THE HEADLINE, because it should not need re-deriving: 14 of these 15 rows are
# masking. The code-producer path suppresses one genuine production and fourteen
# coincidences. It was never the load-bearing producer form in a doctrine layer
# -- authored artefacts are -- and this record is the measurement that says so.
code_only_suppressions:
  - name: action_sequence
    declared_at: src/charter/offering/missions/models.py
    producer: src/charter/offering/missions/mission_type_repository.py
    verdict: genuine-producer
    note: >-
      `payload["action_sequence"] = projected_sequence or raw.get("action_sequence")`
      -- a store into the payload the mission-type model is built from, in the
      same domain as the slot. The one real code producer in this record.

  - name: directive
    declared_at: src/charter/offering/import_candidates/models.py
    producer: src/charter/offering/artifact_kinds.py
    verdict: name-collision
    note: >-
      Suppressed by the `_PLURALS` / `_PATTERNS` dict keys, which are ArtifactKind
      tokens ("directive" -> "directives", "*.directive.yaml"). The slot is a field
      of an import candidate. Different domain, same six letters; no artefact
      authors the field.
  - name: directive
    declared_at: src/charter/offering/schemas/import-candidate.schema.yaml
    producer: src/charter/offering/artifact_kinds.py
    verdict: name-collision
    note: Schema twin of the `import_candidates/models.py` row above.

  - name: effort
    declared_at: src/charter/offering/schemas/agent-profile.schema.yaml
    producer: src/charter/offering/model_task_routing/evaluator.py
    verdict: reader-not-producer
    note: >-
      `RoutingCandidate(effort=profile.effort)` READS the profile field and
      forwards it under the same label; the write lands in RoutingCandidate, not
      in a profile. The clearest case of the kwarg rule inverting this module's own
      reader/writer asymmetry. No shipped profile authors `effort`.

  - name: extends
