  # Sits directly next to mission B2's `aliases` -- the field this lint exists
  # to guard. The only shipped pack, built-in/spec-kitty-core.glossary-pack.yaml,
  # does not carry it.
  # SC-001's own two fields, and the reason the src/doctrine scope fix was a
  # BLOCKER rather than a tidy-up: `aliases` was masked by the whole-src/ producer
  # scan, so mission B2 could have shipped it inert with this gate green.
  # glossary_packs/models.py says so in its own docstring: the `aliases` /
  # `banned_synonyms` fields "are carried and round-tripped for Mission B
  # forward-compat but are inert (unwired) in Mission A".
  # These belong to mission B2.
  - name: aliases
    declared_at: src/charter/offering/glossary_packs/models.py
    disposition: wire-the-producer
    note: >-
      Declared inert by its own module docstring, pending mission B2. SC-001 names
      this field explicitly.
  - name: banned_synonyms
    declared_at: src/charter/offering/glossary_packs/models.py
    disposition: wire-the-producer
    note: Enforcement field; the one shipped glossary pack does not author it.

